<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kata console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">kata <span>console</span></div>
      <div class="topbar-meta" id="topbar-meta"></div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">项目</div>
        <ul class="project-list" id="project-list"></ul>
      </aside>

      <main class="main">
        <section class="list-pane" id="list-pane">
          <div class="filters" id="filters" hidden>
            <input type="search" id="search" placeholder="搜索 feature（ID / 名称）" />
            <select id="f-module"><option value="">全部模块</option></select>
            <select id="f-automation">
              <option value="">全部自动化</option>
              <option value="not-started">not-started</option>
              <option value="ready">ready</option>
              <option value="in-progress">in-progress</option>
              <option value="done">done</option>
            </select>
            <span class="count" id="list-count"></span>
          </div>
          <div class="feature-list" id="feature-list">
            <div class="empty">← 选择一个项目</div>
          </div>
        </section>

        <section class="detail-pane" id="detail-pane">
          <div class="empty">选择一个 feature 查看详情</div>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
