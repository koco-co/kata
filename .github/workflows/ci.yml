name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # base 对比需要完整历史（PR 的 origin/<base> 与 push 的 event.before）
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      # 空白/冲突标记检查：与基线对比，而不是对工作区做空转检查
      - name: Whitespace check (git diff --check)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..HEAD"
          fi
      - name: Validate git hook
        run: |
          sh -n .githooks/pre-push
          bun scripts/setup-hooks.ts
      # 提交消息格式：PR 校验 origin/<base>...HEAD，push 校验 before..HEAD
      - name: Commit message check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun cli/bin/kata.ts repo lint --commit-range "origin/${{ github.base_ref }}...HEAD" --exit-code
          else
            bun cli/bin/kata.ts repo lint --commit-range "${{ github.event.before }}..HEAD" --exit-code
          fi
      - run: bun install --frozen-lockfile
      - name: Full project checks
        run: bun run pre-push

  python-automation-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install Python automation workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Validate Python automation lock
        run: uv lock --check
      - name: Ruff format
        run: uv run --locked --no-sync ruff format --check automation
      - name: Ruff lint
        run: uv run --locked --no-sync ruff check automation
      - name: Pyright strict
        run: uv run --locked --no-sync pyright
      - name: Offline Python automation tests
        run: |
          uv run --locked --no-sync pytest \
            automation/playwright-web-ui/tests \
            automation/playwright-web-ui/suites/data-assets/tests/contract \
            automation/playwright-web-ui/suites/data-assets/tests/unit \
            -q
      - name: Validate pre-commit configuration
        run: uv run --locked --no-sync pre-commit validate-config
