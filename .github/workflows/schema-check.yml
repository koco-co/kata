name: schema-check

on:
  push:
    paths:
      - '.claude/scripts/_shared/schemas/**'
      - 'engine/src/schemas/**'

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test engine/tests/schemas/
