name: schema-check

on:
  push:
    paths:
      - '.claude/scripts/_shared/schemas/**'
  pull_request:
    paths:
      - '.claude/scripts/_shared/schemas/**'

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test .claude/scripts/_shared/tests/schemas/
