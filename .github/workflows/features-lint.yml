name: features-lint

on:
  pull_request:
    paths:
      - 'workspace/**/features/**'
      - '.claude/scripts/_shared/lint/**'
      - '.claude/scripts/_shared/cli/features-*.ts'
      - '.claude/scripts/_shared/schemas/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: kata features lint --all --exit-code
