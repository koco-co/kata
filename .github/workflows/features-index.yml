name: features-index

on:
  push:
    branches: [main]
    paths:
      - "workspace/**/features/**/metadata.yaml"
      - "workspace/**/features/**/manifest.json"
      - ".claude/scripts/_shared/cli/features-index.ts"
      - ".claude/scripts/_shared/cli/features.ts"
      - ".github/workflows/features-index.yml"
  pull_request:
    paths:
      - "workspace/**/features/**/metadata.yaml"
      - "workspace/**/features/**/manifest.json"
      - ".claude/scripts/_shared/cli/features-index.ts"
      - ".claude/scripts/_shared/cli/features.ts"
      - ".github/workflows/features-index.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bunx kata features index --all
      - name: Verify generated indexes are committed
        run: |
          if ! git diff --exit-code -- ':(glob)workspace/**/features/INDEX.md'; then
            echo "::error::features/INDEX.md is stale. Run 'bunx kata features index --all' and commit the result."
            exit 1
          fi
