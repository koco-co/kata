name: gitignore-no-bloat

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count non-blank, non-comment lines
        run: |
          LINES=$(grep -vE '^\s*(#|$)' .gitignore | wc -l)
          echo "non-blank, non-comment .gitignore lines: $LINES"
          if [ "$LINES" -gt 20 ]; then
            echo "::error::.gitignore exceeds 20 effective lines; new artifact paths must be governed by directory contracts, not gitignore patterns."
            exit 1
          fi
