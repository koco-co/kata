# 注：本 workflow 各 step 的 references 字段仅列入 SKILL.md 作为入口锚点；
# 完整的「按需加载」reference 文件清单维护在两份 SKILL.md 的「按需加载协议」段。
# 如果将来要在 yaml 里完整化 references，必须同步更新 SKILL.md 表与 workflow-check 校验逻辑。
name: case-draft
version: 1
entry: /case-draft
description: 根据 PRD、Lanhu、Axure 或功能描述生成 QA 用例的完整流程；本 yaml 是该 workflow 的唯一规范源。
steps:
  - id: source-intake
    next: [module-identify]
    blackboard_inputs: []
    blackboard_outputs: [sources, source_refs]
    references:
      - .claude/skills/case-draft/SKILL.md
      - .agents/skills/case-draft/SKILL.md
      - references/source-intake-protocol.md
      - references/error-fallback-paths.md
    failure_modes:
      - SOURCE_FETCH_BLOCKED
      - LANHU_AUTH_REQUIRED
    human_gates: []
    verification: [sources_and_source_refs_recorded]
  - id: module-identify
    next: [source-confirm]
    blackboard_inputs: [sources, source_refs]
    blackboard_outputs: [decisions]
    references:
      - references/module-identify.md
      - references/error-fallback-paths.md
    failure_modes:
      - MODULE_AMBIGUOUS
    human_gates: []
    verification: [project_module_decision_recorded]
  - id: source-confirm
    next: [historical-context]
    blackboard_inputs: [sources, decisions]
    blackboard_outputs: [open_questions]
    references:
      - references/source-confirm.md
    failure_modes: []
    human_gates:
      - ambiguous_source_requires_user_confirmation
    verification: [source_confirmation_questions_recorded]
  - id: historical-context
    next: [requirement-atomize]
    blackboard_inputs: [sources, decisions]
    blackboard_outputs: [decisions]
    references:
      - references/historical-context.md
      - references/execution-protocol.md
      - references/error-fallback-paths.md
    failure_modes: []
    human_gates: []
    verification: [historical_evidence_boundaries_recorded]
  - id: requirement-atomize
    next: [ambiguity-scan]
    blackboard_inputs: [sources, decisions]
    blackboard_outputs: [decisions]
    references:
      - references/atomization-guide.md
      - references/execution-protocol.md
      - references/worker-prompt.md
    failure_modes: []
    human_gates: []
    verification: [requirement_atoms_have_source_refs]
  - id: ambiguity-scan
    next: [confirmation-package]
    blackboard_inputs: [decisions]
    blackboard_outputs: [open_questions]
    references:
      - references/ambiguity-decision-tree.md
    failure_modes: []
    human_gates: []
    verification: [ambiguities_classified]
  - id: confirmation-package
    next: [product-feedback-merge]
    blackboard_inputs: [open_questions]
    blackboard_outputs: [open_questions]
    references:
      - references/confirmation-package-template.md
      - references/error-fallback-paths.md
    failure_modes: []
    human_gates:
      - confirmation_package_requires_user_decision
    verification: [blocking_questions_packaged]
  - id: product-feedback-merge
    next: [coverage-matrix]
    blackboard_inputs: [open_questions, decisions]
    blackboard_outputs: [decisions]
    references:
      - references/ambiguity-decision-tree.md
      - references/confirmation-package-template.md
    failure_modes: []
    human_gates: []
    verification: [feedback_merge_scope_recorded]
  - id: coverage-matrix
    next: [case-draft]
    blackboard_inputs: [decisions]
    blackboard_outputs: [coverage]
    references:
      - references/coverage-matrix-guide.md
    failure_modes: []
    human_gates: []
    verification: [coverage_matrix_links_requirement_atoms]
  - id: case-draft
    next: [case-review]
    blackboard_inputs: [decisions, coverage, source_refs]
    blackboard_outputs: [artifacts]
    references:
      - references/coverage-matrix-guide.md
      - references/spec-reviewer-prompt.md
      - references/quality-reviewer-prompt.md
      - references/execution-protocol.md
      - references/worker-prompt.md
      - references/output-standard.md
      - references/fewshots/case-format-sample.md
      - references/fewshots/case-format-sample.xmind.md
    failure_modes: []
    human_gates: []
    verification: [draft_artifacts_have_case_ids_and_atom_links]
  - id: case-review
    next: [output]
    blackboard_inputs: [artifacts, coverage]
    blackboard_outputs: [open_questions, verification]
    references:
      - references/spec-reviewer-prompt.md
      - references/quality-reviewer-prompt.md
      - references/case-review-evidence-gates.md
      - references/execution-protocol.md
    failure_modes: []
    human_gates: []
    verification: [review_gates_recorded]
  - id: output
    next: [automation-handoff]
    blackboard_inputs: [artifacts, verification]
    blackboard_outputs: [artifacts]
    references:
      - references/quality-reviewer-prompt.md
      - references/case-review-evidence-gates.md
      - references/output-standard.md
      - references/error-fallback-paths.md
    failure_modes: []
    human_gates: []
    verification: [deliverable_files_verified]
  - id: automation-handoff
    blackboard_inputs: [artifacts]
    blackboard_outputs: [handoff]
    references:
      - references/automation-handoff-spec.md
      - references/error-fallback-paths.md
    failure_modes: []
    human_gates: []
    verification: [automation_intents_filtered]
