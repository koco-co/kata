<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Kata runtime architecture</title>
  <desc id="desc">Kata uses independently maintained Claude and Codex runtime skills, shared router graph workflow blackboard contracts, engine checks, plugins, and workspace artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; fill: #334155; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 8; }
      .runtime { fill: #ecfeff; stroke: #0891b2; }
      .contract { fill: #f0fdf4; stroke: #16a34a; }
      .engine { fill: #fff7ed; stroke: #ea580c; }
      .workspace { fill: #fef2f2; stroke: #dc2626; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="620" fill="#ffffff"/>
  <text x="640" y="58" text-anchor="middle" class="title">Kata SKILL + Router + Graph + Workflow + Blackboard</text>

  <rect x="70" y="115" width="240" height="105" class="box"/>
  <text x="190" y="150" text-anchor="middle" class="label">User Entrypoints</text>
  <text x="190" y="178" text-anchor="middle" class="body">README, AGENTS.md</text>
  <text x="190" y="200" text-anchor="middle" class="body">CLAUDE.md, slash commands</text>

  <rect x="390" y="95" width="230" height="105" class="box runtime"/>
  <text x="505" y="130" text-anchor="middle" class="label">Codex Runtime</text>
  <text x="505" y="158" text-anchor="middle" class="body">.agents/skills/**</text>
  <text x="505" y="180" text-anchor="middle" class="body">agents/openai.yaml</text>

  <rect x="390" y="235" width="230" height="105" class="box runtime"/>
  <text x="505" y="270" text-anchor="middle" class="label">Claude Runtime</text>
  <text x="505" y="298" text-anchor="middle" class="body">.claude/skills/**</text>
  <text x="505" y="320" text-anchor="middle" class="body">Claude Code prompts</text>

  <rect x="705" y="115" width="260" height="225" class="box contract"/>
  <text x="835" y="150" text-anchor="middle" class="label">Shared Contracts</text>
  <text x="835" y="182" text-anchor="middle" class="body">Router: routes/*.yaml</text>
  <text x="835" y="207" text-anchor="middle" class="body">Graph: skill-graph.yaml</text>
  <text x="835" y="232" text-anchor="middle" class="body">Workflow: workflows/*.yaml</text>
  <text x="835" y="257" text-anchor="middle" class="body">Blackboard: schema + review docs</text>
  <text x="835" y="282" text-anchor="middle" class="body">Rules, schemas, plugins metadata</text>

  <rect x="1040" y="115" width="180" height="225" class="box engine"/>
  <text x="1130" y="150" text-anchor="middle" class="label">Engine</text>
  <text x="1130" y="182" text-anchor="middle" class="body">kata CLI</text>
  <text x="1130" y="207" text-anchor="middle" class="body">runtime checks</text>
  <text x="1130" y="232" text-anchor="middle" class="body">schemas</text>
  <text x="1130" y="257" text-anchor="middle" class="body">plugins</text>
  <text x="1130" y="282" text-anchor="middle" class="body">write policy</text>

  <rect x="390" y="430" width="300" height="110" class="box workspace"/>
  <text x="540" y="466" text-anchor="middle" class="label">Workspace Artifacts</text>
  <text x="540" y="496" text-anchor="middle" class="body">Archive, XMind, reports</text>
  <text x="540" y="520" text-anchor="middle" class="body">Playwright scripts, run evidence</text>

  <rect x="760" y="430" width="300" height="110" class="box"/>
  <text x="910" y="466" text-anchor="middle" class="label">Evidence Sources</text>
  <text x="910" y="496" text-anchor="middle" class="body">Lanhu, Zentao, SourceRef</text>
  <text x="910" y="520" text-anchor="middle" class="body">workspace/.kata/repos/** read-only</text>

  <path d="M310 165 L390 145" class="line"/>
  <path d="M310 180 L390 285" class="line"/>
  <path d="M620 147 L705 185" class="line"/>
  <path d="M620 287 L705 255" class="line"/>
  <path d="M965 225 L1040 225" class="line"/>
  <path d="M1130 340 L930 430" class="line"/>
  <path d="M1130 340 L610 430" class="line"/>
  <path d="M760 485 L690 485" class="line"/>

  <text x="640" y="590" text-anchor="middle" class="body">Quality gate: bun run check:skills, bun test --cwd engine, bun run check, git diff --check</text>
</svg>
