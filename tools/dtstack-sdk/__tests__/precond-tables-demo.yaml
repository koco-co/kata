tables:
  - name: quality_test_num
    sql: |
      DROP TABLE IF EXISTS pw_test.quality_test_num;
      CREATE TABLE pw_test.quality_test_num (
        id INT,
        score DOUBLE,
        category STRING
      ) STORED AS PARQUET;
      INSERT INTO TABLE pw_test.quality_test_num
      SELECT 1, 5.0, '2'
      UNION ALL
      SELECT 2, 15.0, '4'
      UNION ALL
      SELECT 3, 3.0, '1'
      UNION ALL
      SELECT 4, -1.0, '3'
      UNION ALL
      SELECT 5, 8.0, '5'
      UNION ALL
      SELECT 6, 7.0, '1'
      UNION ALL
      SELECT 7, 9.0, '2'
      UNION ALL
      SELECT 8, 2.0, '3'
      UNION ALL
      SELECT 9, 6.0, '1'
      UNION ALL
      SELECT 10, 4.0, '2';
  - name: quality_test_str
    sql: |
      DROP TABLE IF EXISTS pw_test.quality_test_str;
      CREATE TABLE pw_test.quality_test_str (
        id INT,
        score_str STRING,
        category STRING
      ) STORED AS PARQUET;
      INSERT INTO TABLE pw_test.quality_test_str
      SELECT 1, '5', '2'
      UNION ALL
      SELECT 2, '5.0', '4'
      UNION ALL
      SELECT 3, '15.0', '1'
      UNION ALL
      SELECT 4, 'abc', '3'
      UNION ALL
      SELECT 5, '-1.0', '5';
