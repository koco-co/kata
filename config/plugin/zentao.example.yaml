# Copy to zentao.yaml locally; do not commit the copied file.
base_url: "https://zentao.example"
cookie: ""
username: ""
password: ""

# Required only for `kata zentao create`.
create:
  product: 100
  branch: 0
  module: 0
  assignee:
    account: example-qa
    display: 示例负责人
  opened_build: trunk
  bug_type: codeerror
  severity_map:
    critical: 1
    major: 2
    normal: 3
    minor: 4
  priority_map:
    "1": 1
    "2": 2
    "3": 3
    "4": 4
