# 禅道连接与创建 Bug 的配置模板；复制为 zentao.yaml 后填写本机值，禁止提交 Cookie 和密码。
# Copy to zentao.yaml locally; do not commit the copied file.
# 禅道站点根地址；不要把具体页面路径写入这里。
base_url: "https://zentao.example"
# 已登录会话 Cookie；有 Cookie 时可不填 username/password。
cookie: ""
# Cookie 不可用时用于登录的账号。
username: ""
# 登录密码；禁止写入 Git、日志或通知。
password: ""

# 仅 `kata zentao create` 使用的产品、模块、负责人和字段映射。
create:
  # 禅道产品 ID。
  product: 100
  # 禅道分支 ID；无分支产品使用 0。
  branch: 0
  # 缺省需求/模块 ID；创建时可由报告中的映射覆盖。
  module: 0
  assignee:
    # 禅道负责人账号与展示名称。
    account: example-qa
    display: 示例负责人
  # 创建 Bug 时关联的构建名称。
  opened_build: trunk
  # 禅道 Bug 类型。
  bug_type: codeerror
  # 报告严重程度到禅道数值的映射。
  severity_map:
    critical: 1
    major: 2
    normal: 3
    minor: 4
  # 报告优先级到禅道数值的映射。
  priority_map:
    "1": 1
    "2": 2
    "3": 3
    "4": 4
