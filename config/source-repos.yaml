# 源码仓库配置:kata repos / scans 的唯一数据源。
# 实体克隆在主工作树 .repos/ 下(gitignored);worktree 经 git common-dir 自动重定向。
# 字段:
#   name        group/repo 唯一标识(也支持 repo 短名解析)
#   project     所属 workspace 项目(workspace/<project>)
#   path        相对仓库根的克隆路径
#   branch      默认查询分支
#   description 用途说明(可附 remote URL)
#   writable    false=只读+pull/checkout;true=允许创作(当前无写命令)
