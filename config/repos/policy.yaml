# Repository-owned artifact policy. Private repository sources remain in sources.yaml.
root:
  allowed_files:
    - .gitattributes
    - .gitignore
    - CLAUDE.md
    - CONTRIBUTING.md
    - INSTALL.md
    - LICENSE
    - README-EN.md
    - README.md
    - AGENTS.md
    - biome.json
    - bun.lock
    - bunfig.toml
    - package.json
    - playwright.config.ts
    - tsconfig.base.json
    - tsconfig.json
    - tsconfig.workspace.json
  allowed_directories:
    - .agents
    - .claude
    - .codex-plugin
    - .github
    - .repos
    - .vscode
    - assets
    - cli
    - config
    - runtime
    - tests
    - workspace
forbidden_globs:
  - kata-automation-*.config.ts
  - lib/**
  - "**/project.json"
  - runtime/cases/**
  - runtime/playwright/**
  - runtime/db/**
  - workspace/**/automation/scripts/**
  - workspace/*/_shared/helpers/**
  - workspace/*/_shared/rules/**
  - workspace/*/_shared/pages/**
  - workspace/*/_shared/fixtures/**
  - workspace/*/_shared/runtime/**
artifacts:
  cases_yaml:
    route: workspace/<project>/features/<version>/<feature>/cases/<name>.yaml
    filename: <name>.yaml
  case_import:
    route: workspace/<project>/features/<version>/<feature>/cases/imports/<name>.<ext>
    extensions: [csv, xlsx, md, xmind]
  case_export:
    route: workspace/<project>/features/<version>/<feature>/cases/exports/<name>.<ext>
    extensions: [csv, xlsx, md, xmind]
  automation_case:
    route: workspace/<project>/features/<version>/<feature>/automation/tests/cases/
    filename: c0001-lowercase-english-kebab-slug.spec.ts
  automation_sql_template:
    route: workspace/<project>/features/<version>/<feature>/automation/tests/sql/
    filename: lowercase-english-kebab.sql
  automation_run_temporary:
    route: workspace/<project>/runs/<run-id>/_tmp/
    tracked: false
shared_modules:
  roots:
    - workspace/*/_shared/automation
  minimum_feature_consumers: 2
  page_domain_pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
dependencies:
  runtime_must_not_import: cli/
  forbidden_import_fragments:
    - runtime/cases/
    - runtime/playwright/
    - runtime/db/
    - _shared/helpers/
    - _shared/pages/
