# Playwright 自动化公共配置示例。
# 实际运行配置文件为同目录下的 playwright.yaml。
# 不读取根目录 .env。

playwright:
  # 是否允许 kata automation run 使用数字 requirement_id 自动发现 feature；关闭时仍支持完整路径。
  requirement_id_mapping: true
  # 单条用例失败后是否继续执行同一批次的后续用例。
  continue_on_failure: true
  # 是否跳过建表、元数据同步等前置准备。
  skip_precondition_setup: true
  # 是否按 cases YAML 中 automation.spec_file 的 cNNNN 序号降序执行；开启后 workers 强制为 1。
  sort_cases: false
  # 未开启排序时的 Playwright worker 数量。
  workers: 4
  # Playwright 项目名称；当前公共配置支持 chromium。
  browser: chromium
  # 是否使用无头浏览器。
  headless: true
  # 每个步骤截图策略：all=全部，failed=仅失败，off=关闭。
  step_capture: all
  # 单个 Playwright 测试的默认超时时间（毫秒）。
  timeout_ms: 60000
  # Playwright 自动重试次数。
  retries: 0
  # 元数据同步是否必须精确命中表名；特殊场景由用例显式覆盖。
  metadata_sync_require_exact_table: false
  # 元数据同步表选项搜索最长等待时间（毫秒）。
  metadata_table_search_timeout_ms: 180000
  # 元数据同步任务等待终态最长时间（毫秒）。
  metadata_sync_timeout_ms: 600000
  # 前置条件 API 单次请求超时时间（毫秒）。
  precondition_request_timeout_ms: 120000
  # 前置条件同步任务等待时间（秒）。
  precondition_sync_timeout_sec: 300
  # 前置条件脚本整体超时时间（毫秒）。
  precondition_timeout_ms: 1800000
  # 数据质量任务/校验结果轮询最长时间（毫秒）。
  monitor_timeout_ms: 2700000
  # 数据资产定时任务状态轮询最长时间（毫秒）。
  schedule_job_timeout_ms: 1800000
  # 是否执行 feature 自己定义的清理动作。
  cleanup: true
  allure:
    # 是否生成 Allure 原始结果和 HTML 报告。
    enabled: true
    # Allure 原始结果目录，相对路径按仓库根目录解析。
    results_dir: allure-results
    # Allure HTML 报告目录，相对路径按仓库根目录解析。
    report_dir: allure-report
