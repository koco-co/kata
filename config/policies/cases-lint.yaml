# 用例作者内容的全局强制规则。
# 只能由 kata cases lint/build 读取；模型不得直接读取 config/ 下的配置文件。
# 规则只作用于 title、precondition、steps.action/expected 和 tags，不检查 meta、需求证据与导入记录。
forbidden_terms:
  # 不允许用不确定词替代可执行的测试条件。
  uncertainty:
    - 可能
    - 或许
    - 也许
    - 大概
    - 大致
    - 预计
    - 推测
    - 猜测
    - 疑似
    - 似乎
    - 通常
    - 一般情况下
    - 理论上
    - 原则上
  # 不允许用弱动作词逃避明确操作。
  weak_action:
    - 尝试
    - 试着
    - 尽量
    - 酌情
    - 视情况
    - 必要时
    - 按需
    - 适当
  # 不允许用模糊的准备语句替代具体账号、表、字段和值。
  vague_setup:
    - 准备
    - 预置
    - 当前账号
    - 构造数据
    - 构造值
    - 测试对象
    - 待定
    - 待补充
    - 暂定
    - 后续补充
    - 测试数据
    - 测试表
    - 测试字段
    - 测试账号
    - 测试用户
  # 不允许用数量不明、对象不明或泛化对象描述测试范围。
  vague_object:
    - 类似
    - 相关
    - 相应
    - 等等
    - 诸如此类
    - 若干
    - 一些
    - 一批
    - 少量
    - 大量
    - 多个
    - 多条
    - 多张
    - 某个
    - 某些
    - 某一
    - 某条
    - 某张
    - 某目录
    - 任一表
  # 普通功能用例不写登录状态；权限场景必须写明实际角色账号。
  login_state:
    - 已登录
    - 已登陆
    - 登录后
    - 登陆后
    - 先登录
    - 先登陆
  # 预期必须描述可观察结果，禁止只写“正确/正常”等空泛结论。
  generic_assertion:
    - 数据正确
    - 结果正确
    - 显示正常
    - 功能正常
    - 操作正常
    - 流程正常
    - 返回正常
    - 页面正常
    - 展示正常
    - 信息正常
    - 统计数值正常
    - 数据与原型设计一致
    - 与构造值一致
    - 与条件一致
    - 可以正常
    - 提示错误
    - 逻辑正常
    - 功能逻辑正常
    - UI展示正确
    - 校验通过
    - 任务校验通过
    - 功能异常
    - 符合预期
    - 无异常
  # 不允许把流程残留、模型补充或占位分类写进正式用例。
  process_residue:
    - 用户确认补充
    - AI补充
    - AI生成
    - 待人工确认
    - 未分类
  # 不允许把模板占位、续写指令或省略表达留在正式用例。
  placeholder_residue:
    - xxx
    - XXX
    - TODO
    - TBD
    - 待完善
    - 待补齐
    - 同上
    - 同前
    - 参照上例
    - 见上文
    - 省略
    - ……

# 每类禁词命中后的整改目标；CLI 只汇总命中表达，不泄露文件、用例或行号。
forbidden_expectations:
  uncertainty: 使用已经由需求、页面或项目知识确认的确定条件和结果
  weak_action: 使用可直接执行的明确动作，不使用试探或条件式动作
  vague_setup: 写明具体账号角色、对象名称、字段、值、数据量或可执行构造内容
  vague_object: 写明确定对象、数量、范围和标识，不使用泛化指代
  login_state: 普通功能用例不写登录状态；权限场景写明实际角色账号及进入的平台
  generic_assertion: 写明 Toast 文本、控件状态、记录字段值、数量、状态或可执行查询结果；条件写在标题末尾半角括号内
  process_residue: 删除确认过程、生成来源和占位分类，只保留正式业务内容
  placeholder_residue: 用需求事实替换模板占位、引用省略和续写标记

# 首步骤必须独立描述一至三级真实菜单路径，不得把入口和点击动作揉成一条。
first_step_pattern: '^进入【[^】\n→]+(?:\s*→\s*[^】\n→]+){0,2}】页面$'
# lint 报错中的固定动作目标、示例和首步骤预期。
first_step_expected: '进入【一至三级实际菜单路径】页面'
first_step_example: '进入【数据质量 → 规则库配置】页面'
first_step_result: '进入成功'

# 显式 VALUES 或导入文件超过该行数后，必须改用集合生成语句或完整文件生成脚本。
bulk_row_threshold: 5
# 命中这些业务语义时，前置数据必须是至少两个动态日期分区的分区表。
partition_case_terms:
  - 分区
  - 增量同步
  - 分区扫描

# 需求没有声明数据源时，模型生成的默认类型；声明了其他类型时必须按声明使用对应方言。
default_datasource_type: SparkThrift2.x
# 允许出现在数据源语义块中的精确类型集合，大小写和别名均不自动纠正。
datasource_types:
  - SparkThrift2.x
  - SparkThrift
  - Hive
  - Hive1.x
  - Hive2.x
  - Hive3.x
  - Doris
  - Doris2.x
  - Doris3.x
  - StarRocks3.x
  - MySQL
  - PostgreSQL
  - Oracle
  - GaussDB
  - GaussDB9.1
  - Vastbase
  - OceanBase
  - OceanBaseOracle
  - Impala
  - Lindorm
  - Kyuubi

# 多表用例允许的角色集合；同一角色重复时由 CLI 要求追加两位序号。
table_roles:
  - source
  - target
  - comparison
  - dimension

# 没有 INSERT 时，只有写明这些空表语义才允许通过。
empty_table_markers:
  - 该表为空表
  - 该表不写入数据
environment_placeholders:
  project: '^\$\{Project[A-Z]\}$'
  datasource: '^\$\{DataSource[A-Z]\}$'
  schema: '^\$\{Schema[A-Z]\d*\}$'
environment_context_terms:
  project:
    - 项目
    - 工程
    - project
  datasource:
    - 数据源
    - datasource
  schema:
    - 数据库
    - 源库
    - 目标库
    - schema
    - database
