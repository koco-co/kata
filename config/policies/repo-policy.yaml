# 仓库产物路由和命名策略。CLI repository lint / kata run check 会读取本文件；
# 私有源码仓库清单仍保存在未跟踪的 config/private/repositories.yaml。
root:
  # 根目录允许直接存在的受跟踪文件；新增根文件前必须同步本策略。
  allowed_files:
    - .gitattributes
    - .gitignore
    - CLAUDE.md
    - INSTALL.md
    - LICENSE
    - README-EN.md
    - README.md
    - AGENTS.md
    - biome.json
    - bun.lock
    - bunfig.toml
    - package.json
    - playwright.config.ts
    - tsconfig.base.json
    - tsconfig.json
    - tsconfig.workspace.json
  # 根目录允许存在的目录；产物必须落在这些目录之一。
  allowed_directories:
    - .agents
    - .claude
    - .codex-plugin
    - .github
    - .githooks
    - .repos
    - .vscode
    - assets
    - cli
    - config
    - docs
    - runtime
    - scripts
    - tests
    - workspace
  # 任何命中以下 glob 的路径都会被仓库检查拒绝，即使文件未被 Git 跟踪。
forbidden_globs:
  - kata-automation-*.config.ts
  - kata-automation-config-*.ts
  - kata-automation-config-*.overrides.json
  - lib/**
  - "**/project.json"
  - runtime/cases/**
  - runtime/playwright/**
  - runtime/db/**
  - workspace/**/automation/README.md
  - workspace/**/automation/scripts/**
  - workspace/*/_shared/helpers/**
  - workspace/*/_shared/rules/**
  - workspace/*/_shared/pages/**
  - workspace/*/_shared/fixtures/**
  - workspace/*/_shared/runtime/**
artifacts:
  # YAML 是用例唯一中间态；CSV/XMind/Markdown 等均为导入或导出产物。
  cases_yaml:
    # 正式用例源文件的路径模板。
    route: workspace/<project>/features/<version>/<feature>/cases/<name>.yaml
    # YAML 文件名必须与需求目录中的用例名称一致。
    filename_pattern: '[^/]+\.yaml'
  case_import:
    # 历史需求源文件的归档目录和允许扩展名。
    route: workspace/<project>/features/<version>/<feature>/cases/imports/<name>.<ext>
    extensions: [csv, xlsx, md, xmind]
  case_export:
    # 由 YAML 派生的交付文件目录和允许扩展名；可随时由 build 重建，不进入 Git。
    route: workspace/<project>/features/<version>/<feature>/cases/exports/<name>.<ext>
    extensions: [csv, xlsx, md, xmind]
    tracked: false
  automation_case:
    # 正式 Playwright 源代码位置和文件命名规则。
    route: workspace/<project>/features/<version>/<feature>/automation/tests/cases/
    filename_pattern: 'c\d{4}-[a-z0-9]+(?:-[a-z0-9]+)*\.spec\.ts'
  automation_sql_template:
    # 自动化 SQL 模板位置和小写英文文件名规则。
    route: workspace/<project>/features/<version>/<feature>/automation/tests/sql/
    filename_pattern: '[a-z0-9]+(?:-[a-z0-9]+)*\.sql'
  automation_run_temporary:
    # 单次运行产生的临时目录；不得提交到 Git。
    route: workspace/<project>/features/<version>/<feature>/runs/<run-id>/_tmp/
    tracked: false
shared_modules:
  # 共享自动化模块根目录及其复用门槛。
  roots:
    - workspace/*/_shared/automation
  minimum_feature_consumers: 2
  page_domain_pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
dependencies:
  # 运行时代码的导入边界；违反时 repository lint 阻断。
  runtime_must_not_import: cli/
  forbidden_import_fragments:
    - runtime/cases/
    - runtime/playwright/
    - runtime/db/
    - _shared/helpers/
    - _shared/pages/
source_code:
  # 第一方 TS/JS 文件行数上限（AGENTS.md 小文件约束的机械化）；超大文件必须按域拆分。
  max_lines: 800
  # 排除 glob：vendor、生成代码与不可拆 fixture 显式登记；不得按业务目录整体豁免。
  # 存量超限文件登记在此（拆分前一次性豁免），新增文件必须遵守 max_lines。
  excluded_globs:
    - cli/vendor/**
    - cli/lib/platform-env.ts
    - cli/lib/cases/content-lint.ts
    - tests/cli/cases-content-lint.test.ts
    - workspace/dataAssets/_shared/automation/flows/sparkthrift-rule-validation/rule-set.ts
    - workspace/dataAssets/features/v6.4.11/【15862】【岚图汽车】【数据资产】数据质量任务性能优化，规则sql合并/automation/tests/fixtures/v6411-ui-case-specs.ts
    - workspace/dataAssets/features/v6.4.11/【15862】【岚图汽车】【数据资产】数据质量任务性能优化，规则sql合并/automation/tests/flows/v6411-result-recheck-flow.ts
    - workspace/dataAssets/features/v6.4.11/【15862】【岚图汽车】【数据资产】数据质量任务性能优化，规则sql合并/automation/tests/flows/v6411-ui-rebuild-flow.ts
    - workspace/dataAssets/features/v6.4.7/【数据资产】集成测试用例/automation/tests/flows/integration-suite.ts
    - workspace/dataAssets/features/v6.4.8/【岚图汽车】【数据质量】支持每个数据表的规则集管理/automation/tests/flows/rule-set-management-suite.ts
    - workspace/dataAssets/features/v6.4.11/【15889】【岚图汽车】【数据资产】数据资产适配lindorm/automation/tests/cases/c0032-view-tags.spec.ts
    - workspace/dataAssets/features/v6.4.11/【15889】【岚图汽车】【数据资产】数据资产适配lindorm/automation/tests/pages/data-quality/reports.ts
    - workspace/dataAssets/features/v6.4.11/【15889】【岚图汽车】【数据资产】数据资产适配lindorm/automation/tests/pages/data-quality/rule-library.ts
    - workspace/dataAssets/features/v6.4.11/【15889】【岚图汽车】【数据资产】数据资产适配lindorm/automation/tests/pages/data-quality/settings.ts
    - workspace/dataAssets/features/v6.4.8/【岚图汽车】【数据质量】支持每个数据表的规则集管理/automation/tests/runners/smoke.spec.ts
    - workspace/dataAssets/features/v7.0.0/【岚图汽车】【数据资产】数据资产集成用例/automation/tests/pages/data-standard-page.ts
