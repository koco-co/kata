# 仓库产物路由和命名策略。CLI repository lint / kata run check 会读取本文件；
# 私有源码仓库清单仍保存在未跟踪的 config/private/repositories.yaml。
root:
  # 根目录允许直接存在的受跟踪文件；新增根文件前必须同步本策略。
  allowed_files:
    - .gitattributes
    - .gitignore
    - .pre-commit-config.yaml
    - .python-version
    - CLAUDE.md
    - INSTALL.md
    - LICENSE
    - README-EN.md
    - README.md
    - AGENTS.md
    - biome.json
    - bun.lock
    - bunfig.toml
    - package.json
    - pyproject.toml
    - tsconfig.base.json
    - tsconfig.json
    - uv.lock
  # 根目录允许存在的目录；产物必须落在这些目录之一。
  allowed_directories:
    - .agents
    - .claude
    - .codex-plugin
    - .github
    - .githooks
    - .repos
    - .vscode
    - assets
    - artifacts
    - automation
    - cli
    - config
    - docs
    - runtime
    - scripts
    - tests
    - workspace
  # 任何命中以下 glob 的路径都会被仓库检查拒绝，即使文件未被 Git 跟踪。
forbidden_globs:
  - kata-automation-*.config.ts
  - kata-automation-config-*.ts
  - kata-automation-config-*.overrides.json
  - lib/**
  - "**/project.json"
  - runtime/cases/**
  - runtime/playwright/**
  - runtime/db/**
  - config/automation/**
  - playwright.config.*
  - runtime/automation/**
  - workspace/**/automation/**
  - workspace/*/_shared/automation/**
  - workspace/*/_shared/helpers/**
  - workspace/*/_shared/rules/**
  - workspace/*/_shared/pages/**
  - workspace/*/_shared/fixtures/**
  - workspace/*/_shared/runtime/**
artifacts:
  # YAML 是用例唯一中间态；CSV/XMind/Markdown 等均为导入或导出产物。
  cases_yaml:
    # 正式用例源文件的路径模板。
    route: workspace/<project>/features/<version>/<feature>/cases/<name>.yaml
    # YAML 文件名必须与需求目录中的用例名称一致。
    filename_pattern: '[^/]+\.yaml'
  case_import:
    # 历史需求源文件的归档目录和允许扩展名。
    route: workspace/<project>/features/<version>/<feature>/cases/imports/<name>.<ext>
    extensions: [csv, xlsx, md, xmind]
  case_export:
    # 由 YAML 派生的交付文件目录和允许扩展名；可随时由 build 重建，不进入 Git。
    route: workspace/<project>/features/<version>/<feature>/cases/exports/<name>.<ext>
    extensions: [csv, xlsx, md, xmind]
    tracked: false
  automation_case:
    # 正式 executor suite 用例位置和 pytest 文件命名规则。
    route: automation/<executor>/suites/<project>/tests/e2e/<version>/<feature-id>/
    filename_pattern: 'c\d{4}_[a-z0-9]+(?:_[a-z0-9]+)*_test\.py'
  automation_sql_template:
    # executor suite 的 SQL 资源位置和小写英文文件名规则。
    route: automation/<executor>/suites/<project>/resources/sql/
    filename_pattern: '[a-z0-9]+(?:-[a-z0-9]+)*\.sql'
  automation_run_temporary:
    # immutable attempt 内的一次性 scratch 文件；不得提交到 Git。
    route: artifacts/runs/<project-id>/<logical-run-id>/executions/<executor-id>/<execution-id>/attempts/<attempt-id>/scratch/
    tracked: false
dependencies:
  # 运行时代码的导入边界；违反时 repository lint 阻断。
  runtime_must_not_import: cli/
  forbidden_import_fragments:
    - runtime/cases/
    - runtime/playwright/
    - runtime/db/
    - _shared/helpers/
    - _shared/pages/
    - "@playwright/test"
    - allure-playwright
source_code:
  # 第一方 TS/JS/Python 文件行数上限（AGENTS.md 小文件约束的机械化）；超大文件必须按域拆分。
  max_lines: 800
  # 排除 glob：vendor、生成代码与不可拆 fixture 显式登记；不得按业务目录整体豁免。
  # 存量超限文件登记在此（拆分前一次性豁免），新增文件必须遵守 max_lines。
  excluded_globs:
    - cli/vendor/**
    - cli/lib/platform-env.ts
    - cli/lib/cases/content-lint.ts
    - tests/cli/cases-content-lint.test.ts
