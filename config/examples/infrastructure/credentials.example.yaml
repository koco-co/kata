# Copy to credentials.yaml locally; do not commit the copied file.
credentials:
  server-default:
    # 凭据类型；当前基础设施诊断支持密码 profile。
    kind: password
    # SSH 或服务账号用户名。
    username: root
    # 仅用于说明结构的占位值；必须替换为本机秘密，不能提交真实密码。
    password: "replace-with-a-local-secret"
  data-source-default:
    # 数据源连接凭据 profile，与 hosts.yaml 中的服务器凭据分开管理。
    kind: password
    # 数据源账号用户名。
    username: data-source-user
    # 仅用于说明结构的占位值；必须替换为本机秘密，不能提交真实密码。
    password: "replace-with-a-local-secret"
