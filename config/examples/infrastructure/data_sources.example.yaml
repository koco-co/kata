# Copy to data_sources.yaml locally; do not commit the copied file.
data_sources:
  example-hive:
    # CLI 使用的逻辑数据源类型；必须与支持的连接适配器一致。
    type: hive
    # 数据源主机；示例使用文档保留地址。
    host: 192.0.2.10
    # 数据源服务端口。
    port: 10000
    # 默认数据库或 catalog。
    database: default
    # 引用 credentials.yaml 中的数据源凭据 profile。
    credential_ref: data-source-default
