# 通知插件配置模板；复制为 notify.yaml 后填写本机值，禁止提交 Webhook、签名密钥和 SMTP 密码。
# Copy to notify.yaml locally; do not commit the copied file.
# `enabled_events` is intentionally empty: a local webhook alone never enables delivery.
# 总开关；即使打开，enabled_events 为空也不会发送业务通知。
is_enable: true
# 允许发送的事件名白名单；只填写确实需要外发的事件。
enabled_events: []
dingtalk:
  # 钉钉通道总开关。
  is_enable: true
  # 钉钉机器人 Webhook，不要写入 Git。
  webhook_url: ""
  # 钉钉机器人关键词。
  keyword: ""
  # 钉钉签名密钥，不要写入 Git。
  sign_secret: ""
feishu:
  # 飞书通道总开关。
  is_enable: true
  # 飞书机器人 Webhook，不要写入 Git。
  webhook_url: ""
wecom:
  # 企业微信通道总开关。
  is_enable: true
  # 企业微信机器人 Webhook，不要写入 Git。
  webhook_url: ""
smtp:
  # SMTP 邮件通道总开关。
  is_enable: true
  # SMTP 主机、端口和账号；密码字段不得提交。
  host: ""
  port: 587
  user: ""
  pass: ""
  # 发件人与收件人地址。
  from: ""
  to: ""
  # 是否在建立连接时启用 TLS（通常用于 465 端口）。
  secure: false
