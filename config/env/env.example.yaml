# DataAssets 平台环境模板。复制为 config/env/<env>.yaml 后再填写本机值；
# 该文件只描述字段结构，不得写入真实 URL、Cookie、租户、数据源或密码。
# 私密文件由 kata env/config doctor 管理，目录权限应为 0700，文件权限应为 0600。

# 环境配置格式版本；当前解析器要求为 2。
schema_version: 2
# 平台根地址，只能是没有账号密码、路径、查询参数和片段的 HTTP(S) URL。
url: http://platform.example

auth:
  # 浏览器会话 Cookie；留空表示尚未配置，禁止提交真实 Cookie。
  cookie: ""

guard:
  # 运行前必须匹配的平台租户名称，用于防止把用例执行到错误租户。
  expected_tenant: pw_test

projects:
  # 数据质量等资产功能使用的项目名称或别名。
  quality: pw_test
  # 离线开发功能使用的项目名称或别名；不涉及离线项目时可删除。
  offline: pw_test

datasources:
  sparkthrift:
    # 平台中已经注册的数据源名称，不是连接密码或 JDBC URL。
    name: pw_test_HADOOP
    # 数据源默认数据库；schema 与 database 相同时应省略 schema。
    database: pw_test
    # 需要在离线项目中同步注册时设为 true；默认值也是 true。
    requires_offline: true
  # 可按实际环境增加第二个数据源；每个键只能使用小写字母、数字和连字符。
  # doris:
  #   name: pw_test_DORIS
  #   database: pw_test
  #   schema: analytics
  #   requires_offline: false

defaults:
  # 默认选中的 datasources 键，必须与上方某个数据源键一致。
  datasource: sparkthrift

safety:
  # 允许写入平台或数据源的总开关；新环境建议保持 false，回归前显式确认后再开启。
  allow_write: false

