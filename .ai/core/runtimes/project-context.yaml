schema_version: 1
description: Project context channel rules for loading workspace rules and knowledge.
channels:
  - id: project_rules
    source: workspace/{project}/rules/**
    schema: MarkdownFile@1
    priority: 200
    token_budget: 3000
    provenance: project_owner
    write_owner: knowledge-curate@1
  - id: project_knowledge
    source: workspace/{project}/knowledge/**
    schema: MarkdownFile@1
    priority: 100
    token_budget: 5000
    provenance: project_owner
    write_owner: knowledge-curate@1
