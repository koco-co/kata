id: playwright-automation-prompt@1
schema_ref: PromptContract@1
locale: zh-CN
model_lock:
  required_capabilities:
    - structured_output
    - vision
  minimum_context_tokens: 32000
input_schema:
  name: UiAutomationIntent@1
  required:
    - request
output_schema:
  name: PlaywrightAutomationHandoff@2
  required:
    - status
    - artifacts
    - evidence
    - acceptance_command
rendering:
  role_sections:
    system: 仅根据提供的证据执行 playwright-automation；阶段参考按 step.id 按需读取。assistant 可见输出只写用户需要响应或验收的最终文本，不写内部阶段诊断。
    user: 返回 PlaywrightAutomationHandoff@2；自测证据、验收命令、环境确认和 blocker 模板按 playwright-automation references 分阶段加载。
  boundaries:
    untrusted_context_tag: context
    source_ref_tag: source_ref
prefill:
  enabled: true
  text: '{"schema_ref":"PlaywrightAutomationHandoff@2",'
fallback:
  deterministic_parse: true
  on_schema_error: retry_once_then_refuse
hallucination_policy:
  unknown_fact: block
  missing_source_ref: refuse
cache_breakpoints:
  - id: kata-system
    after: system
    min_tokens: 1024
  - id: kata-context
    after: context
    min_tokens: 4096
model_routing:
  primary:
    provider: anthropic
    model_id: claude-sonnet-4-6
    fallback_strategy: refuse_with_budget_report
  fallback:
    - provider: anthropic
      model_id: claude-haiku-4-5-20251001
      condition: budget_low
