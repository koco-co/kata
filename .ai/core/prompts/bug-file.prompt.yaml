id: bug-file-prompt@1
schema_ref: PromptContract@1
locale: zh-CN
model_lock:
  required_capabilities:
    - structured_output
  minimum_context_tokens: 16000
input_schema:
  name: ReportingBugsInput@1
  required:
    - request
output_schema:
  name: ReportingBugsOutput@1
  required:
    - result
    - pending_items
rendering:
  role_sections:
    system: 仅根据提供的证据执行 bug-file。
    user: 返回结构化结果，未解决的事实放入 pending_items。
  boundaries:
    untrusted_context_tag: context
    source_ref_tag: source_ref
prefill:
  enabled: true
  text: '{"result":'
fallback:
  deterministic_parse: true
  on_schema_error: retry_once_then_refuse
hallucination_policy:
  unknown_fact: put_in_pending_items
  missing_source_ref: refuse
cache_breakpoints:
  - id: kata-system
    after: system
    min_tokens: 1024
  - id: kata-context
    after: context
    min_tokens: 4096
model_routing:
  primary:
    provider: anthropic
    model_id: claude-sonnet-4-6
    fallback_strategy: refuse_with_budget_report
  fallback:
    - provider: anthropic
      model_id: claude-haiku-4-5-20251001
      condition: budget_low
