# Boilerplate: 见 .ai/core/agents/README.md#worker-base
id: knowledge-curate-worker@1
schema_ref: AgentContract@1
role: worker
runner: worktree_patch
write_capability: patch_only
allowed_tools:
  - read_file
  - write_patch
  - ask_user
read_scope:
  - .ai/core/**
  - workspace/**
write_scope:
  - workspace/**
forbidden_scope:
  - workspace/*/.kata/repos/**
  - .kata/repos/**
  - workspace/*/.repos/**
  - .agents/**
  - .claude/**
handoff_schema: HandoffEnvelope@1
review_gates:
  - schema_guard.require_provenance@1
  - write_policy.block_repos_write@1