id: case-draft-worker@1
schema_ref: AgentContract@1
role: worker
runner: worktree_patch
write_capability: patch_only
allowed_tools:
  - read_file
  - write_patch
read_scope:
  - .ai/core/**
  - workspace/**
  - engine/tests/fixtures/**
write_scope:
  - workspace/*/features/**
forbidden_scope:
  - workspace/*/.kata/repos/**
  - .kata/repos/**
  - workspace/*/.repos/**
  - .agents/**
  - .claude/**
handoff_schema: HandoffEnvelope@1
review_gates:
  - schema_guard.require_provenance@1
  - write_policy.block_repos_write@1
