id: diff-scan@1
schema_ref: WorkflowContract@1
entry_skill: diff-scan@1
failure_mode: staged_until_final_success
inputs:
  request:
    kind: request
    required: true
  project:
    kind: workspace_id
    required: false
budgets:
  total_run_budget_tokens: 16000
  total_run_budget_usd_cents: 80
  aggregation_budget_tokens: 2000
  rate_card_ref: local-ga-core@1
black_box_fixtures:
  - .ai/core/evals/workflows/diff-scan/happy-path.json
steps:
  - id: intake
    uses: agent:diff-scan-worker@1
    prompt: diff-scan-prompt@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_ask_user: false
    output_schema: CodeScanRequest@1
  - id: resolve_diff
    requires:
      - intake
    output_schema: ResolvedDiff@1
  - id: load_context
    requires:
      - resolve_diff
    output_schema: ScanContext@1
  - id: identify_evidence_backed_issues
    requires:
      - load_context
    output_schema: EvidenceBackedIssues@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      must_use_blocked_envelope: true
  - id: filter_unproven_risks
    requires:
      - identify_evidence_backed_issues
    output_schema: FilteredIssues@1
  - id: output_report
    requires:
      - filter_unproven_risks
    gates:
      - report.exists || findings.exists
      - notify_plugin: kata plugin-loader notify --event diff-scan-completed --data '{}' || true
failure_policy:
  missing_evidence: ask_one_clarifying_question
