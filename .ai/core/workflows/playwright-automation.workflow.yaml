id: playwright-automation@1
schema_ref: WorkflowContract@1
entry_skill: playwright-automation@1
failure_mode: staged_until_final_success
inputs:
  request:
    kind: request
    required: true
  project:
    kind: workspace_id
    required: false
  automation_intent:
    kind: automation_intent_file
    required: false
budgets:
  total_run_budget_tokens: 32000
  total_run_budget_usd_cents: 160
  aggregation_budget_tokens: 3000
  rate_card_ref: local-ga-core@1
  phase_token_budgets:
    case-normalize: 2200
    env-preflight: 1200
    ui-plan: 4000
    ui-probe: 3500
    plan-reconcile: 2800
    playwright-generate: 7500
    self-run: 1200
    run-triage: 2800
    repair-loop: 2800
    handoff: 1000
  repair_limits:
    max_attempts_per_spec: 3
    max_locator_retries_per_spec: 2
    max_user_questions_per_blocker: 1
black_box_fixtures:
  - .ai/core/evals/workflows/playwright-automation/fresh-generation.json
  - .ai/core/evals/workflows/playwright-automation/continue-from-plan.json
  - .ai/core/evals/workflows/playwright-automation/continue-from-script.json
  - .ai/core/evals/workflows/playwright-automation/triage-and-repair.json
steps:
  - id: case-normalize
    uses: agent:playwright-automation-worker@1
    prompt: playwright-automation-prompt@1
    output_schema: UiAutomationIntent@1
    gates:
      - AutomationIntent@1 accepted as intent only, not observed UI evidence; env-preflight, ui-probe, plan-reconcile, and self-run remain required
  - id: env-preflight
    requires:
      - case-normalize
    output_schema: UiAutomationPreflight@1
    gates:
      - status in [ready, blocked_by_environment]
  - id: ui-plan
    requires:
      - env-preflight
    output_schema: UiAutomationIntent@1
    gates:
      - plan.assertions_visible == true
  - id: ui-probe
    requires:
      - ui-plan
    output_schema: UiProbeSnapshot@1
    gates:
      - probe.evidence_collected == true
  - id: plan-reconcile
    requires:
      - ui-probe
    output_schema: PlanReconciliation@1
    gates:
      - reconciliation.status in [aligned, plan_adjusted, needs_user_decision, blocked]
  - id: playwright-generate
    requires:
      - plan-reconcile
    output_schema: PlaywrightScriptManifest@1
    gates:
      - generation.has_probe_evidence == true
  - id: self-run
    requires:
      - playwright-generate
    output_schema: SelfRunResult@1
    gates:
      - self_run.command_logged == true
  - id: run-triage
    requires:
      - self-run
    condition: self_run.status == failed
    output_schema: UiRunTriage@1
    gates:
      - triage.classification in [product, script, data, permission, environment, unknown]
  - id: repair-loop
    requires:
      - run-triage
    condition: run_triage.completed == true
    output_schema: RepairAttemptLog@1
    gates:
      - repair.attempts <= 3
  - id: handoff
    requires:
      - self-run
    run: kata handoff render ${feature_id} --run ${run_id} --project ${project}
    output_schema: PlaywrightAutomationHandoff@2
    condition: self_run.status == passed or (self_run.status == failed and run_triage.completed == true)
    gates:
      - self_run.status == passed or (run_triage.completed == true and repair_loop.completed == true and handoff.status in [blocked_by_env, blocked_by_product, failed, partial])
      - handoff.status in [passed, blocked_by_env, blocked_by_product, failed, partial]
      - notify_plugin: kata plugin-loader notify --event playwright-automation-completed --data '{}' || true
  - id: quality-gate
    ref: quality-gate.md
    run: kata cases lint --exit-code --severity fail-only --scope workspace
    requires:
      - handoff
    condition: handoff.status in [passed, blocked_by_env, blocked_by_product, failed, partial]
    output_schema: QualityGateReport@1
    gates:
      - quality_gate.no_weak_assertions == true
      - quality_gate.no_env_local == true
      - quality_gate.runner_is_aggregator == true
      - quality_gate.cases_in_cases_dir == true
      - quality_gate.session_compliant == true
      - quality_gate.env_profile_compliant == true
      - quality_gate.cases_lint_passed == true
      - quality_gate.no_dangling_helpers == true
      - quality_gate.spec_structure_valid == true
      - quality_gate.metadata_present_and_valid == true
      - quality_gate.manifest_present_and_valid == true
      - quality_gate.case_traceability_header == true
      - quality_gate.no_feature_local_helpers == true
      - quality_gate.no_debug_in_cases == true
      - quality_gate.handoff_double_track == true
failure_policy:
  missing_evidence: ask_one_clarifying_question
  missing_environment: blocked_by_env
  probe_unavailable: blocked_by_env
  repair_limit_reached: failed
  unknown_failure: failed
