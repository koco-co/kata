id: knowledge-curate@1
schema_ref: WorkflowContract@1
entry_skill: knowledge-curate@1
failure_mode: staged_until_final_success
inputs:
  request:
    kind: request
    required: true
  project:
    kind: workspace_id
    required: false
budgets:
  total_run_budget_tokens: 16000
  total_run_budget_usd_cents: 80
  aggregation_budget_tokens: 2000
  rate_card_ref: local-ga-core@1
black_box_fixtures:
  - .ai/core/evals/workflows/knowledge-curate/happy-path.json
steps:
  - id: intake
    uses: agent:knowledge-curate-worker@1
    prompt: knowledge-curate-prompt@1
    output_schema: KnowledgeRequest@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_ask_user: false
  - id: resolve_project
    requires:
      - intake
    gates:
      - project.resolved == true
  - id: query_or_stage_update
    requires:
      - resolve_project
    output_schema: KnowledgeUpdatePlan@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_write: true
      must_use_blocked_envelope: true
  - id: verify_confidence
    requires:
      - query_or_stage_update
    gates:
      - knowledge.confidence >= 0.7
  - id: dry_run_preview
    requires:
      - verify_confidence
    gates:
      - dry_run_output.exists
  - id: confirm_write
    gates:
      - user_confirmed_write == true
    requires:
      - dry_run_preview
  - id: commit_knowledge_update
    requires:
      - confirm_write
    gates:
      - entry.exists
      - notify_plugin: kata plugin-loader notify --event knowledge-curate-completed --data '{}' || true
failure_policy:
  missing_evidence: ask_one_clarifying_question
