id: infra-diagnose@1
schema_ref: WorkflowContract@1
entry_skill: infra-diagnose@1
failure_mode: keep_partial_artifacts
inputs:
  clue:
    kind: file_or_text
    required: true
  project:
    kind: workspace_id
    required: false
budgets:
  total_run_budget_tokens: 20000
  total_run_budget_usd_cents: 100
  aggregation_budget_tokens: 2000
  rate_card_ref: local-ga-core@1
black_box_fixtures:
  - .ai/core/evals/workflows/infra-diagnose/happy-path.json
steps:
  - id: intake
    uses: agent:infra-diagnose-worker@1
    prompt: infra-diagnose-prompt@1
    output_schema: InfraDiagnoseIntent@1
    routing_signals:
      datasource:
        indicators: ["No route to host", "Connection refused", "jdbc:", "NoRouteToHostException", "Host unreachable", "timeout"]
      server:
        indicators: ["ssh", "systemctl", "服务器", "登服务器", "无法连接"]
      ambiguous:
        behavior: ask_user_to_specify
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_ask_user: false
  - id: lookup_knowledge
    requires:
      - intake
    output_schema: KnowledgeLookupResult@1
  - id: diagnose
    requires:
      - lookup_knowledge
    output_schema: DiagnosisEvidence@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      must_use_blocked_envelope: true
  - id: propose_or_apply_fix
    requires:
      - diagnose
    output_schema: FixOutcome@1
    gates:
      - destructive_fix.user_confirmed == true
  - id: record_knowledge
    requires:
      - propose_or_apply_fix
    gates:
      - knowledge_entry.exists
      - notify_plugin: kata plugin-loader notify --event infra-diagnose-completed --data '{}' || true
failure_policy:
  missing_credentials: ask_one_clarifying_question
  unreachable_host: produce_pending_items
