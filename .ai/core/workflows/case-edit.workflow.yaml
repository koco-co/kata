id: case-edit@1
schema_ref: WorkflowContract@1
entry_skill: case-edit@1
failure_mode: staged_until_final_success
inputs:
  request:
    kind: request
    required: true
  project:
    kind: workspace_id
    required: false
budgets:
  total_run_budget_tokens: 16000
  total_run_budget_usd_cents: 80
  aggregation_budget_tokens: 2000
  rate_card_ref: local-ga-core@1
black_box_fixtures:
  - .ai/core/evals/workflows/case-edit/happy-path.json
steps:
  - id: intake
    uses: agent:case-edit-worker@1
    prompt: case-edit-prompt@1
    output_schema: ArtifactMaintenancePlan@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_ask_user: false
  - id: parse_artifact
    requires:
      - intake
    output_schema: ParsedArtifact@1
  - id: plan_edit
    requires:
      - parse_artifact
    output_schema: EditPlan@1
  - id: preview_diff
    requires:
      - plan_edit
    gates:
      - dry_run_output.exists
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_write: true
      must_use_blocked_envelope: true
  - id: confirm_write
    gates:
      - user_confirmed_write == true
    requires:
      - preview_diff
  - id: output
    requires:
      - confirm_write
    gates:
      - archive.exists || xmind.exists
      - notify_plugin: kata plugin-loader notify --event case-edit-completed --data '{}' || true
failure_policy:
  missing_evidence: ask_one_clarifying_question
