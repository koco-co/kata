id: bug-file@1
schema_ref: WorkflowContract@1
entry_skill: bug-file@1
failure_mode: staged_until_final_success
inputs:
  request:
    kind: request
    required: true
  project:
    kind: workspace_id
    required: false
budgets:
  total_run_budget_tokens: 16000
  total_run_budget_usd_cents: 80
  aggregation_budget_tokens: 2000
  rate_card_ref: local-ga-core@1
black_box_fixtures:
  - .ai/core/evals/workflows/bug-file/happy-path.json
steps:
  - id: intake
    uses: agent:bug-file-worker@1
    prompt: bug-file-prompt@1
    output_schema: FailureEvidence@1
    routing_signals:
      backend:
        indicators: ["Exception", "Caused by", "java.lang", "at com.", "SQLException", "HTTP 5"]
      frontend:
        indicators: ["TypeError", "ReferenceError", "ChunkLoadError", "React error", "Vue warn"]
      ambiguous:
        behavior: ask_user_to_specify
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_ask_user: false
  - id: normalize_evidence
    requires:
      - intake
    output_schema: NormalizedEvidence@1
  - id: classify_signal
    requires:
      - normalize_evidence
    output_schema: SignalClassification@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      must_use_blocked_envelope: true
  - id: reproduce_or_scope
    requires:
      - classify_signal
    output_schema: ReproduceScope@1
  - id: classify_impact
    requires:
      - reproduce_or_scope
    output_schema: ImpactClassification@1
  - id: draft_report
    requires:
      - classify_impact
    output_schema: BugReport@1
  - id: review_report
    requires:
      - draft_report
    gates:
      - report.exists
      - notify_plugin: kata plugin-loader notify --event bug-file-completed --data '{}' || true
failure_policy:
  missing_evidence: ask_one_clarifying_question
