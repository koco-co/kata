id: workspace-manage@1
schema_ref: WorkflowContract@1
entry_skill: workspace-manage@1
failure_mode: staged_until_final_success
inputs:
  request:
    kind: request
    required: true
  project:
    kind: workspace_id
    required: false
budgets:
  total_run_budget_tokens: 16000
  total_run_budget_usd_cents: 80
  aggregation_budget_tokens: 2000
  rate_card_ref: local-ga-core@1
black_box_fixtures:
  - .ai/core/evals/workflows/workspace-manage/happy-path.json
steps:
  - id: intake
    uses: agent:workspace-manage-worker@1
    prompt: workspace-manage-prompt@1
    output_schema: WorkspaceRequest@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      may_not_ask_user: false
  - id: inspect_workspace
    requires:
      - intake
    gates:
      - workspace.exists || workspace.can_create
  - id: plan_change
    requires:
      - inspect_workspace
    output_schema: WorkspacePlan@1
    subagent_constraints:
      schema_ref: SubagentConstraints@1
      must_use_blocked_envelope: true
  - id: stage_workspace_update
    requires:
      - plan_change
    gates:
      - dry_run_output.exists
      - user_confirmed_write == true
  - id: verify_workspace
    requires:
      - stage_workspace_update
    gates:
      - workspace.valid == true
      - notify_plugin: kata plugin-loader notify --event workspace-manage-completed --data '{}' || true
failure_policy:
  missing_evidence: ask_one_clarifying_question
