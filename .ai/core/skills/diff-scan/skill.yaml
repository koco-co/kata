id: diff-scan@1
name: diff-scan
kind: product-skill
schema_version: 1
skill_version: 1
status: deprecated
description:
  summary: 扫描源代码 diff，只报告可复现、有证据支撑的缺陷。
  must_trigger_when:
    - 用户要求对代码做静态扫描、diff 扫描，或在代码变更中查找 bug。
    - 用户给出仓库 diff、分支对或变更文件集供检查。
  must_not_trigger_when:
    - 用户要求一般性的代码讲解，且未指明 diff 目标。
    - 用户要求依据 PRD 需求生成 QA 用例。
outputs:
  - findings
  - report
inputs:
  diff:
    required: true
    kind: repo_or_diff
  project:
    required: false
    kind: workspace_id
allowed_tools:
  - read_file
  - write_artifact
  - ask_user
context_budget:
  core_tokens: 900
  reference_tokens: 5000
  evidence_tokens: 8000
  overflow_policy:
    order:
      - informative_references
      - few_shots
      - evidence_context
      - normative_references
    preserve:
      - hard_rules
      - failure_policy
      - evidence
    on_overflow: summarize_then_drop_lowest_priority
body:
  always_load:
    routing_summary:
      - 扫描代码 diff，定位可复现缺陷；源仓库一律不改。
    hard_rules:
      - 仅报告能依据所给 diff 与周边代码复现的 bug。
      - .kata/repos/{project}/** 为只读源仓库，详见 .ai/core/rules/repo-readonly.md。
evidence:
  source_refs_required: true
  distinguish_fact_inference_assumption: false
  required_source_refs:
    - repo.diff@1
  stale_ref_policy: block
failure_policy:
  missing_diff: ask_for_branch_or_diff
  unreproducible_risk: omit_from_bug_list
