id: case-draft@1
name: case-draft
kind: product-skill
schema_version: 1
skill_version: 1
status: active
description:
  summary: 以 PRD、设计稿、Lanhu 或 Axure 等需求源生成 QA 测试用例。
  must_trigger_when:
    - 用户希望基于需求、PRD、设计稿或原型链接生成、扩写或复核测试用例。
    - 用户提供 Lanhu、Axure、Markdown PRD、截图、fixture 或功能描述作为需求源。
  must_not_trigger_when:
    - 用户只是要做 Archive MD、XMind 或 CSV 之间的格式转换。
    - 用户要基于已有用例生成或修复 Playwright 自动化脚本。
outputs:
  - enhanced.md
  - confirmation-package.md
  - archive.md
  - cases.xmind
  - archive.draft.md
  - unresolved-summary.md
  - manifest.json#automation
inputs:
  prd:
    required: true
    kind: file_url_or_fixture
    schema: PrdSource@1
  project:
    required: false
    kind: workspace_id
allowed_tools:
  - read_file
  - run_command
  - write_artifact
  - ask_user
context_budget:
  core_tokens: 900
  reference_tokens: 5000
  evidence_tokens: 8000
  overflow_policy:
    order:
      - informative_references
      - few_shots
      - evidence_context
      - normative_references
    preserve:
      - hard_rules
      - failure_policy
      - evidence
    on_overflow: summarize_then_drop_lowest_priority
body:
  always_load:
    routing_summary:
      - 固定执行 source-intake → module-identify → historical-context → requirement-atomize → ambiguity-scan → confirmation-package → product-feedback-merge → coverage-matrix → case-draft → case-review → output → automation-handoff。
      - Archive、XMind、草稿、确认包与自动化意图 manifest 均落到 workspace/{project}/features/{YYYY-MM-english-slug}/。
      - 阶段内任务编排：source-intake 与 module-identify 完成且不在 Lanhu/Axure error-fallback 路径下时，按 references/execution-protocol.md 创建 TodoWrite、按 references/worker-prompt.md 派发 Worker、按 references/spec-reviewer-prompt.md 与 references/quality-reviewer-prompt.md 二阶段审查；Lanhu/Axure 阻塞草稿、source-intake 抓取静默期与所有 BlockedEnvelope 路径下禁用。
    hard_rules:
      - Lanhu/Axure URL 是源输入，须先抓取或读取 fixture，不要求用户额外提供本地 PRD 或源抓取许可。
      - Lanhu/Axure URL 解析时必须只把 URL 子串作为 URL；若同一条输入或紧随其后的用户回复已经提供功能/页面名称，应记录为用户已补充的首要 blocking 答案，不得把该回答拼进 URL、搜索 token、feature_id 或抓取参数。此时不得再次输出固定问题“这个 Lanhu 页面对应的功能/页面名称是什么？”，也不得把该固定问题写入 pending；若仍缺少阻塞证据，只能询问下一项最小阻塞问题。
      - Lanhu/Axure URL 的 source-intake 必须先执行本地同源缓存 token search，再调用任何外部抓取、fetch、WebFetch、浏览器或设计源能力检查。识别 URL 并完成结构化解析后，下一批工具必须包含完整 `pageId`、完整 `docId`、完整 `pid` 的定向 `rg -n ... workspace/*/features -g "prd.md" -g "metadata.yaml" -g "manifest.json"` 搜索；不得在这些搜索前调用 `mcp__fetch__fetch_html`、`mcp__fetch__fetch_readable`、`mcp__fetch__fetch_markdown`、`WebFetch`、浏览器或设计源插件。错误顺序示例：Skill → Read `source-intake-protocol.md` → `mcp__fetch__fetch_html`；正确顺序示例：Skill → Read `source-intake-protocol.md` → 完整 URL token `rg` 搜索 → 必要时再抓取。
      - 用户输入只有 Lanhu/Axure URL，或当前正在处理 Lanhu/Axure source-intake/fallback 时，进入静默执行模式：除最终两行阻塞回复外，不得发送任何面向用户的 assistant text。这个规则覆盖通用技能宣告、进度说明、阶段总结和落盘确认；若需要继续调用工具，直接调用工具。抓取结果、可读模式尝试、精确计数、搜索命中、项目/模块推断、进入阻塞草稿创建、目录创建和下一步说明只能作为内部推理或 artifact 内容，不得先写给用户。不得发送“WebFetch 仅返回...”“再尝试 readable 模式”“需要精确的搜索计数”“搜索计数完成”“进入阻塞草稿产物创建”“Let me verify”“Let me verify some details”“update the confirmation-package”“现在补充样例”等中间文本。
      - Lanhu/Axure URL 降级为阻塞草稿前，本轮必须实际执行至少一次同源缓存以外的抓取或设计源能力检查；不得基于历史经验写“WebFetch 返回空壳”“插件不可用”等未在本轮发生的结果。若本轮没有抓取/能力检查工具结果，必须先执行工具或停止，不得写阻塞产物。
      - confirmation-package.md 中的原始 URL 必须逐字保留用户输入或规范化后的单一 URL，且必须使用 fenced code block 作为一行完整 URL 写入；不得把 URL 写成 inline code，不得为了排版把 URL 拆成多行、缩进参数、重复追加 query 参数或改写参数值。SourceRefs 中不得再次以内联代码重复完整 URL；`SR-LANHU-URL-001` 的内容只能写“见上方原始 URL”或等价短描述。
      - Lanhu/Axure 阻塞草稿的原始 URL、URL 参数表、搜索 token 和最终 feature_id 必须来自首条用户输入 URL 的结构化解析结果，不得从后续抓取工具调用的 `url` 参数、模型重写 URL、工具回显 URL 或记忆中的 URL 反向覆盖。若后续 tool_use 把 `pageId=7afabbf5f0cf4d0680704ab3b5f20295` 误写为 `7afabbf5f0cf4d06807004ab3b5f20295` 等任何变体，artifact 中仍必须保留首条用户输入的原始值 `7afabbf5f0cf4d0680704ab3b5f20295`，并禁止记录变体。
      - 写入 confirmation-package.md 前必须自检原始 URL 中每个 query 参数只出现一次；若 `docType`、`pageId` 等参数重复，必须修正为用户输入或规范化后的单一 URL 后再写入。
      - Lanhu/Axure 阻塞草稿的 confirmation-package.md 第一行必须严格等于 `## 原始 URL`；不得在其前添加 `# Confirmation Package`、标题、前言、空行或横线。章节标题必须使用中文：`## 原始 URL`、`## URL 参数`、`## SourceRefs`、`## 项目推断`、`## 模块推断`、`## 需要用户补充的信息`、`## 可选后续材料`。不得把 `原始 URL` 写成 `Source URL`，不得把 `URL 参数` 写成 `URL Parameters`，不得把 `可选后续材料` 写成 `Deferred`。
      - Lanhu/Axure 阻塞草稿的 `feature_id` 后缀必须精确等于解析后 `pageId` 的前 8 位；最终聊天、artifact path、manifest.feature_id 与落盘目录必须完全一致。发送最终回复前必须逐字核对，不得把 `7afabbf5` 误写为 `7abbf5` 等删减或重排形式。
      - Lanhu/Axure 阻塞草稿最终聊天的路径必须直接复制本轮 `mkdir -p` 或 Write tool_result 中已经成功创建的目录字符串，不得重新从记忆中拼写、缩写或重算 `feature_id`。对于 `pageId=7afabbf5f0cf4d0680704ab3b5f20295`，最终路径、目录名、`manifest.feature_id` 必须逐字包含 `2026-05-unresolved-lanhu-7afabbf5`；`2026-05-unresolved-lanhu-7abbf5` 是错误值，必须禁止输出。
      - Lanhu/Axure 阻塞草稿的每一次 Write file_path 都必须直接复用本轮 `mkdir -p` 成功创建的精确目录字符串作为父目录；四个 Write file_path 的父目录必须完全一致，且必须与 `manifest.feature_id`、最终聊天路径一致。不得向 `2026-05-unresolved-lanhu-7abbf5`、`7afbf5`、`7afabb5` 等任何变体目录写入文件；不得在写错目录后发送“I need to fix a critical error”等中间文本；不得用 `rm -rf`、`mv`、`cp` 或二次 Write 自行清理/搬迁错误目录。
      - Lanhu/Axure 阻塞草稿进入 fallback 后不得为确认目录存在、查找格式样例、查看已有 feature 名称或参考现有产物而执行父级 feature 目录枚举；禁止 `ls workspace/{project}/features/`、`ls /.../workspace/{project}/features/`、`ls .../features/ | head`、`ls -d .../features/*`、Glob、find 或等价命令。只允许直接 `mkdir -p workspace/{project}/features/{feature_id}/` 后写四个阻塞文件；mkdir 命令本身必须严格使用 repo-root 相对路径，不得使用 `<REPO_ROOT>/workspace/{project}/features/{feature_id}` 或任何绝对路径。若 thinking 中已构造 `<REPO_ROOT>/workspace/...`，必须在发起 Bash 前改成 `workspace/...`；不得调用 `mkdir -p <REPO_ROOT>/workspace/dataAssets/features/2026-05-unresolved-lanhu-7afabbf5`。如果这一次 `mkdir -p` 返回 `was blocked`、`requires approval`、`This command requires approval`、`but you haven't granted it yet` 或提到 `allowed working directories`，下一条 assistant message 必须只包含一个 `type=text` content item，文本严格等于两行工具权限受限最终文本；不得包含 `type=thinking`，不得先产生新的 thinking 分析、错误解释、路径诊断或规则复述。不得重试相对/绝对 `mkdir -p`，不得尝试 Write 让目录自动创建，且不得出现 “The path IS within”“The error says it's within”“Wait, the error says”“Let me read the error more carefully”“try again with a different approach”“try using Write instead”“maybe writing a file will create the parent directories automatically” 等内部继续理由。
      - Lanhu/Axure 阻塞草稿不得读取 `references/confirmation-package-template.md` 或任何 few-shot/template 来决定格式；该路径只使用当前 SKILL.md、`references/source-intake-protocol.md`、`references/error-fallback-paths.md` 与本轮证据。常规 confirmation-package 阶段可读模板，但 Lanhu/Axure 阻塞草稿必须使用 error-fallback 中的固定章节和最小 manifest 规则；若任一 reference Read 返回 `but you haven't granted it yet`、`requires approval` 或等价权限拒绝，不得再读取其他 `references/**`，不得写“maybe the user will grant permission this time”，必须用当前已加载的 SKILL.md 规则和本轮证据继续。
      - 'Lanhu/Axure 阻塞草稿的搜索证据中禁止出现“大量命中”“若干命中”“多个命中”“多个”“N+”“>20”“>5”“24+”等任何模糊命中数、阈值命中数或加号估计；不得写 `Hits: 多个`、`总命中 >5` 或“多个，包含...”。若没有精确计数，必须写“总数未知，工具输出被截断，以下仅为已观察样例”，或先运行可复核计数命令后写精确数字。'
      - Lanhu/Axure 阻塞草稿的 pageId/docId/pid 搜索 token、实际执行的 Bash/Grep/rg 命令、实际计数命令与记录的搜索命令都必须使用 URL 参数完整值；不得执行或记录 `rg "fc0fee93"`、`rg -c "fc0fee93"`、`rg "7de90493"`、`rg -c "7de90493"`、`rg "7afabbf5"` 等前缀、短码或截断值搜索。若需要计数，实际命令必须使用完整 `docId=fc0fee93-74f5-4eff-a769-99e68506b296`、完整 `pid=7de90493-e80f-4592-a263-38fb2d2e98c0`、完整 `pageId=7afabbf5f0cf4d0680704ab3b5f20295` 的参数值（可只搜索值本身，但必须完整）。
      - Lanhu/Axure 阻塞草稿补充搜索计数时，如果 Bash/rg/count 命令返回 `requires approval`、`This command requires approval`、`This Bash command contains multiple operations`、`contains multiple operations` 或等价审批拒绝，必须停止同一 URL token 的全部 Bash/rg/count 重试；不得把 `rg ... | wc -l` 改写为无管道 `rg -c`、不得把 `workspace/*/features` 缩窄为 `workspace/{project}/features` 后重试、不得并发继续对 pageId/docId/pid 发起替代 Bash 计数。若已有 Grep/搜索输出足以精确计数，使用该输出；否则在阻塞产物中写“总数未知，工具输出被截断，以下仅为已观察样例”，不得为了精确数字继续试探权限。
      - Lanhu/Axure 阻塞草稿的每个非 0 命中搜索 SourceRef 必须在同一 SourceRef 内容中列出用于判断的样例路径；命中数大于 5 时必须列出前 5 个样例路径和总数，不得只写“4 命中”“22 命中”“均为 prd.md”或只引用相邻 feature ID。0 命中可写 0 命中且不列样例路径。
      - Lanhu/Axure 阻塞草稿读取相邻 feature `metadata.yaml` 时必须对 URL token search 命中的精确路径逐个调用 Read；不得先用 `ls`、`test -f`、Bash、cat、sed、head、for 循环或 shell 拼接对一个或多个 `metadata.yaml` 做存在性预检、批量读取或内容截断，也不得把 `ls .../metadata.yaml`、`test -f .../metadata.yaml` 或 `head -30 metadata.yaml` 输出当作模块推断证据。
      - Lanhu/Axure 阻塞草稿创建目录时只能创建 `workspace/{project}/features/{feature_id}/` 根目录；不得创建 `workspace/{project}/features/{feature_id}/inputs`、`inputs/lanhu-snapshots` 或任何其他空子目录。阻塞草稿只允许写入四个文件：`confirmation-package.md`、`archive.draft.md`、`unresolved-summary.md`、`manifest.json`。
      - Lanhu/Axure 阻塞草稿写入 `confirmation-package.md` 的搜索 token 时，Token 单元格只能写完整 URL 参数值本身，不得附加键名前缀、等号、短码或说明；不得写成 `pageId=7afabbf5f0cf4d0680704ab3b5f20295`，不得写成 `docId=fc0fee93-74f5-4eff-a769-99e68506b296`，不得写成 `pid=7de90493-e80f-4592-a263-38fb2d2e98c0`。
      - Lanhu/Axure 阻塞草稿中的抓取 SourceRef 工具名必须逐字等于本轮实际 tool_use 名称（例如 `WebFetch`、`mcp__fetch__fetch_html`）；不得把未调用的 `fetch_markdown`、`fetch_readable`、`fetch_html`、浏览器或插件写成已调用工具。除非本轮实际 tool_use 名称就是 `WebFetch`，artifact 与面向用户文本均不得把 `mcp__fetch__fetch_markdown`、`mcp__fetch__fetch_html`、`mcp__fetch__fetch_readable` 或其他工具统称为 `WebFetch`。
      - Lanhu/Axure 阻塞草稿的抓取记录只能写 observed_error；`inferred_reason` 必须为空、`无` 或省略。阻塞产物中的每个抓取 SourceRef 都必须有非空、非“无”的 observed_error；若工具没有报错但未提取到设计内容，observed_error 就写中性结果摘要，例如“仅返回页面框架/静态资源引用，未提取到设计内容”“仅观察到品牌文字，未提取到设计内容”或“无内容输出，未提取到设计内容”。除非同一运行有明确工具错误直接说明该机制，confirmation-package.md、archive.draft.md、unresolved-summary.md、最终聊天与任何面向用户的中间 assistant 文本中均不得写“SPA”“JS”“CSS/JS”“JavaScript”“客户端渲染”“运行时渲染”“无法渲染”“无法执行 JavaScript”“markdown 转换无法获取运行时渲染内容”等机制词；HTML/markdown 仅返回 app 容器、脚本、样式或加载骨架时，统一概括为“仅返回页面框架/静态资源引用，未提取到设计内容”。不得在 observed_error 或中间说明后追加 `<div id="app">`、`CSS/JS`、脚本文件名等原始片段括号说明。
      - Lanhu/Axure 阻塞草稿记录 `mcp__fetch__fetch_html`、HTML、markdown 或 readable 抓取结果时，只允许写工具名和单句中性 observed_error；不得增加“输出”字段，不得记录 `<div id="app">`、`空容器`、`HTML`、`样式/脚本引用`、脚本/样式/资源文件、页面骨架源码片段或任何括号中的原始 HTML 说明。
      - Lanhu/Axure 阻塞草稿不得把“登录态”“Cookie”“认证”“权限”列为抓取失败原因、推断原因、deferred material 或后续材料，除非同一运行存在 SSO 重定向、登录页标题、认证 HTTP 状态、权限报错或可见截图文字等直接证据。
      - Lanhu/Axure 阻塞草稿的 `unresolved-summary.md` 第一行必须严格等于 `## Blocking / Pending`；不得写 `# Unresolved Summary`、标题、前言、空行或任何其他内容在其前。只有用户尚未提供功能/页面名称时，才允许把固定问题“这个 Lanhu 页面对应的功能/页面名称是什么？”列为 pending/blocking；不得给固定问题追加 `（pending）`、`(pending)`、状态标签、括号说明或其他后缀。用户已提供功能/页面名称时，该固定问题不得写入 pending/blocking。模块归属、截图、导出 PRD 等只能放入 deferred，除非它们被明确选为下一项最小阻塞问题。deferred item 只能命名缺失材料或待确认项，不得解释抓取机制、失败原因、当前推断、模块候选或用途；不得追加括号说明。summary 中不得写 `7afabbf5...` 这类省略 token，不得写“SPA”“JS”“JavaScript”“客户端渲染”“运行时渲染”“无法渲染”“无法执行 JavaScript”等机制词。
      - Lanhu/Axure 阻塞草稿的 `archive.draft.md` 不得创建“待确认”“Pending Confirmations”或等价 pending 章节；`archive.draft.md` 的标题也不得包含“待确认”，不得写 `# 草稿 — 待确认`、`# Archive Pending`、`# Draft — unresolved`、`# Draft - unresolved` 或等价标题。标题必须是中文或中英混合的业务草稿标题，不得只用英文 Draft/unresolved 表达阻塞状态。模块归属、截图、导出 PRD 等非首要缺口只能写入 `confirmation-package.md` 或 `unresolved-summary.md` 的 deferred 区域，不得写入 archive.draft.md。首要问题章节标题必须写作 `## 下一步`，不得写 `## Next`、`## Next Step` 或其他英文标题。
      - Lanhu/Axure 阻塞草稿的 `unresolved-summary.md` 不得写 URL 参数汇总，不得使用任何省略号、省略短码或 Unicode ellipsis（例如 `tid=24a1c6b2-…`、`pageId=7afabbf5…`）；如需引用 URL，只能写完整原始 URL或只写 SourceRef ID。
      - Lanhu/Axure 阻塞草稿不得创建“运行时设计源插件”“插件能力”“浏览器能力”等章节，不得写“当前运行时工具清单未观察到 Lanhu 专用插件”或任何插件可用性/不可用性结论，除非本轮实际调用了明确的能力检查工具并得到可引用 SourceRef。
      - Lanhu/Axure 阻塞草稿路径全程不得调用 TodoWrite 或等价 todo 工具；不得为阻塞产物创建、完成、核对或收尾写 todo。写完阻塞产物后，下一条 assistant 文本消息必须是阻塞草稿路径加当前首要问题；功能/页面名称尚未提供时才使用固定两行模板，已提供时不得使用该固定问题。四个阻塞产物首次写入成功后不得再发送任何中间 text，也不得再调用 Bash/Grep/Read/Edit/Write 追加样例、补计数或二次修正；若需要样例或计数，必须在首次写入前完成。
      - Lanhu/Axure 阻塞草稿若遇到 Bash/Write/fetch/WebFetch/MCP fetch 权限拒绝或非交互授权失败，不得输出授权请求、权限说明清单、已完成分析摘要、项目/模块推断、搜索命中、抓取尝试列表或“请授权必要的工具权限”等用户补救说明。权限拒绝触发词包括 `requires approval`、`This command requires approval`、`was blocked`、`but you haven't granted it yet`、`Claude requested permissions to use WebFetch, but you haven't granted it yet`、`Claude requested permissions to use mcp__fetch__fetch_html, but you haven't granted it yet`、`Claude requested permissions to use mcp__fetch__fetch_markdown, but you haven't granted it yet`、`Claude requested permissions to use mcp__fetch__fetch_readable, but you haven't granted it yet`、`Claude requested permissions to use mcp__fetch__fetch_txt, but you haven't granted it yet` 与 `Claude requested permissions to write to`。不得把 `haven't granted it yet` 当作可等待授权；在 `claude --print` 中它就是当前 action 的终止结果。抓取/能力检查必须一次只调用一个 fetch/WebFetch/MCP fetch/浏览器/设计源工具，等待该 tool_result 后才能决定下一步；不得在同一 assistant 消息或同一批 tool_use 中并发调用 `mcp__fetch__fetch_html` 与 `mcp__fetch__fetch_markdown`、readable/txt/WebFetch 或浏览器变体。抓取/能力检查首次遇到上述权限拒绝后，不得再次调用同一 URL 的任何 fetch、WebFetch、MCP fetch、浏览器或设计源变体；不得再调用 Read 补读 `references/source-intake-protocol.md`、`references/error-fallback-paths.md` 或任何 `references/**`。这个禁止覆盖按需加载表和“进入 error-fallback-paths”的一般读取时机：即使本文件尚未读取、即使 Read 会被允许，也不得在抓取拒绝后读取 `references/error-fallback-paths.md`；不得写 “Let me read the error-fallback-paths.md reference”“go into the error-fallback paths”“Let me wait for them to be approved”“Let me try a different approach”“Let me try again”“one more time”“maybe the user will grant permission this time” 或 “the user may just need to see it again”。若已能推断 project，可只把这一次拒绝作为抓取 SourceRef 的 observed_error 后立即进入阻塞产物 `mkdir -p workspace/{project}/features/{feature_id}/`；“立即进入”表示下一次工具调用必须是这条 `mkdir -p`，不得在其前补跑 `Grep` count、`rg` count、Bash count、读取相邻 `metadata.yaml`、模块推断、命中数精确化、SourceRef 样例扩充或任何 Read/Grep/Bash。不得在抓取拒绝后写 “Let me use Grep with count mode”“Let me read the metadata.yaml files”“I need to count the pid hits”“Now I have the counts”。若 `mkdir -p`、目录存在性检查、Bash 或 Write 在阻塞产物创建阶段首次遇到上述权限拒绝，下一条 assistant message 必须只包含一个 `type=text` content item，文本严格等于两行：第一行 `工具权限受限，未能写入阻塞草稿产物。`，第二行 `请在允许写入 workspace/{project}/ 后重新发送该 Lanhu 链接。`；不得包含 `type=thinking`，不得再调用 Bash/Write/Read/Grep/fetch/WebFetch/MCP fetch，不得因为错误文本提到 `allowed working directories` 或路径看似位于仓库内而继续诊断，不得重试绝对路径或相对路径 `mkdir -p`，不得执行 `test -d`，不得尝试 “Write directly” 或 “Write might create the directory automatically”，不得再次 Write `confirmation-package.md`，不得追加任何解释、列表、Markdown 标题或后续步骤。
      - 当功能/页面名称尚未由用户提供时，Lanhu/Axure 阻塞草稿最终聊天必须严格等于两行模板：第一行 `阻塞草稿产物路径：\`workspace/{project}/features/{feature_id}/\``，第二行 `这个 Lanhu 页面对应的功能/页面名称是什么？`。第一行只能把路径包在反引号中，不得在 `阻塞草稿产物路径：` 前添加反引号，不得把整行或标签包成 inline code。两行之间不得有空行；前后不得有任何前言、状态说明、检查摘要、分隔线、确认语、输出提示或 Markdown 横线。降级为阻塞草稿后，除工具调用与文件写入外，不得发送任何面向用户的中间说明；抓取摘要、项目推断、目录创建、精确计数等只能写入 artifacts 或作为内部推理。严禁写“所有阻塞草稿产物已写入”“现在输出最终回复”“目录已核对”“已落盘”等落盘/输出确认。不得在最终聊天中列 URL 参数、搜索命中、项目/模块推断、抓取尝试、插件状态、已产出文件清单或 deferred 材料。一旦输出该问题，本轮必须立即结束；不得再调用 TodoWrite、Bash、Grep 等工具，不得继续回答任何与该输入无关的潜在、历史或残留请求。`claude --print` 的最终 result 必须完全等于该两行阻塞草稿回复，而不是后续无关回复、检查摘要、输出提示或落盘确认。若功能/页面名称已由用户提供，禁止输出该固定问题；若仍需阻塞，只输出 artifact 路径和下一项最小阻塞问题。
      - 项目未指定时先自行推断 workspace 项目；仅在无候选或多候选无法消歧时询问用户。
      - 历史上下文不得确认新增行为；history_inferred 只能作为参考证据，不能替代产品确认。
      - 每个 requirement atom 必须包含 evidence_kind、ambiguity_class、confidence，并保留至少一个 source_ref。
      - 证据事实必须在 manifest.json#case_drafting.requirement_atoms 中引用 SourceRef ID：FeatureManifest@2 轻量 requirement_atoms 使用 { id, source_ref }，完整 RequirementAtom@1 / CaseEvidenceMap@1 / CoverageMatrix@1 按各自 schema 保留 source_refs、case_id 与 requirement_atom_ids。archive.md / archive.draft.md / cases.xmind 正文不得显式包含 SourceRef、SR-<ID>、csv::、规范 SourceRef 字符串或 CSV 证据定位文本；用例与证据映射必须通过 case_id 与 requirement_atom_ids 对账，不得把 atom_id/case_title/priority 或 requirement_id+case_title+priority 作为机器唯一键。Lanhu/Axure 阻塞草稿的 confirmation-package.md / unresolved-summary.md 在 error-fallback 路径下豁免，仍按现有硬规则保留 URL token 表与 SourceRef ID。
      - archive.md 与 cases.xmind 只能在 blocking pending 为 0 时生成；否则不得产出最终用例。
      - 仍有 blocking pending 时只输出草稿与确认类产物，包括 confirmation-package.md、archive.draft.md、unresolved-summary.md。
      - 仅 manifest.json#automation.intents[] 中 automation_status=ready 的 AutomationIntent@1 可交给 playwright-automation@1；deferred 与 blocked 只留在 manifest 与报告中。
      - Subagent 不得直接向用户提问；遇阻塞须经由 BlockedEnvelope 回传主 agent。
      - few-shot 仅供格式参照，不得作为需求事实或历史事实来源。
      - feature 目录 slug 命名见 references/error-fallback-paths.md「Slug fallback（非 Lanhu/Axure 路径）」节；含中文、全角标点、空格、长度超限或多模块串联描述的字符串必须降级为 `YYYY-MM[-{customer}]-unresolved-{module}-{8-hex}` 兜底，原文写入 metadata.yaml notes，不得作为 mkdir 目标。
references:
  - path: references/source-intake-protocol.md
    type: normative
    load_phases:
      - source-intake
    purpose: 接收 Lanhu、Axure、PRD、截图、fixture 或自然语言需求源时，建立 source_snapshot、source_refs 与抓取失败处理。
    load_when: step.id == source-intake
  - path: references/module-identify.md
    type: normative
    load_phases:
      - module-identify
    purpose: 在追问前根据 workspace 配置、仓库画像、知识库与源页面路径推断项目和模块。
    load_when: step.id == module-identify
  - path: references/historical-context.md
    type: normative
    load_phases:
      - historical-context
    purpose: 在用户授权后读取历史用例、知识库与只读源码证据，并标明历史证据不能确认新增行为。
    load_when: step.id == historical-context
  - path: references/atomization-guide.md
    type: normative
    load_phases:
      - requirement-atomize
    purpose: 将源事实、历史推断与测试假设拆为带 evidence_kind、ambiguity_class、confidence 的 requirement atoms。
    load_when: step.id == requirement-atomize
  - path: references/ambiguity-decision-tree.md
    type: normative
    load_phases:
      - ambiguity-scan
      - product-feedback-merge
    purpose: 识别 blocking、defaultable、inferred 与 confirmed 情形，并限定反馈合并后的重扫范围。
    load_when: step.id in [ambiguity-scan, product-feedback-merge]
  - path: references/confirmation-package-template.md
    type: normative
    load_phases:
      - confirmation-package
      - product-feedback-merge
    purpose: 输出面向产品确认的问题包，并将显式回复合并回 enhanced PRD。
    load_when: step.id in [confirmation-package, product-feedback-merge]
  - path: references/coverage-matrix-guide.md
    type: normative
    load_phases:
      - coverage-matrix
      - case-draft
    purpose: 将 requirement atoms 映射到覆盖矩阵和草稿用例，确保每条用例可追溯到需求原子。
    load_when: step.id in [coverage-matrix, case-draft]
  - path: references/spec-reviewer-prompt.md
    type: normative
    load_phases:
      - case-draft
      - case-review
    purpose: 机械复核 spec 合规、SourceRef 分层、`case_id` 对账与 blocking pending。
    load_when: step.id in [case-draft, case-review]
  - path: references/quality-reviewer-prompt.md
    type: normative
    load_phases:
      - case-draft
      - output
    purpose: 审查用例内容质量，包括步骤完整性、标题可读性、覆盖质量与表述一致性。
    load_when: step.id in [case-draft, output]
  - path: references/case-review-evidence-gates.md
    type: normative
    load_phases:
      - case-review
      - output
    purpose: 复核 SourceRef、历史推断和 blocking unknown，决定最终产物或阻塞草稿产物。
    load_when: step.id in [case-review, output]
  - path: references/automation-handoff-spec.md
    type: normative
    load_phases:
      - automation-handoff
    purpose: 仅交接 ready AutomationIntent@1，阻止 deferred 或 blocked 自动化意图进入 playwright-automation。
    load_when: step.id == automation-handoff
  - path: references/error-fallback-paths.md
    type: normative
    load_phases:
      - source-intake
      - module-identify
      - historical-context
      - confirmation-package
      - case-draft
      - output
      - automation-handoff
    purpose: 在抓取、项目推断、历史读取、澄清、草稿、输出或自动化交接失败时选择可恢复降级路径。
    load_when: step.id in [source-intake, module-identify, historical-context, confirmation-package, case-draft, output, automation-handoff]
  - path: references/execution-protocol.md
    type: normative
    load_phases:
      - historical-context
      - requirement-atomize
      - case-draft
      - case-review
      - output
    purpose: 阶段内 TodoWrite 编排、Worker 派发、二阶段 Review 协议；只在非 error-fallback 路径下生效。
    load_when: step.id in [historical-context, requirement-atomize, case-draft, case-review, output]
  - path: references/worker-prompt.md
    type: normative
    load_phases:
      - historical-context
      - requirement-atomize
      - case-draft
    purpose: 在允许的阶段内派发 case-draft Worker 时，限定输入字段、写入范围、状态 envelope 与证据分层规则。
    load_when: step.id in [historical-context, requirement-atomize, case-draft]
few_shots:
  - path: references/confirmation-package-template.md
    load_phases:
      - confirmation-package
    purpose: 仅供确认包问题组织格式参考，不作需求事实来源。
    load_when: step.id == confirmation-package
    max_tokens: 1200
evidence:
  source_refs_required: true
  distinguish_fact_inference_assumption: true
  required_source_refs:
    - prd.file@1
    - lanhu.fixture@1
  stale_ref_policy: block
failure_policy:
  missing_evidence: refuse_with_questions
  ambiguous_requirement: produce_pending_items
