id: case-draft@1
name: case-draft
kind: product-skill
schema_version: 1
skill_version: 1
status: active
description:
  summary: 以 PRD、设计稿、Lanhu 或 Axure 等需求源生成 QA 测试用例。
  must_trigger_when:
    - 用户希望基于需求、PRD、设计稿或原型链接生成、扩写或复核测试用例。
    - 用户提供 Lanhu、Axure、Markdown PRD、截图、fixture 或功能描述作为需求源。
  must_not_trigger_when:
    - 用户只是要做 Archive MD、XMind 或 CSV 之间的格式转换。
    - 用户要基于已有用例生成或修复 Playwright 自动化脚本。
outputs:
  - enhanced.md
  - confirmation-package.md
  - archive.md
  - cases.xmind
  - archive.draft.md
  - unresolved-summary.md
  - manifest.json#automation
required_inputs:
  - kind: requirement_source
    required: true
  - kind: knowledge.entry
    required: true
  - kind: repo.line
    required: true
  - kind: case.archive
    required: false
inputs:
  prd:
    required: true
    kind: file_url_or_fixture
    schema: PrdSource@1
  project:
    required: false
    kind: workspace_id
allowed_tools:
  - read_file
  - run_command
  - write_artifact
  - ask_user
context_budget:
  core_tokens: 900
  reference_tokens: 5000
  evidence_tokens: 8000
  overflow_policy:
    order:
      - informative_references
      - few_shots
      - evidence_context
      - normative_references
    preserve:
      - hard_rules
      - failure_policy
      - evidence
    on_overflow: summarize_then_drop_lowest_priority
body:
  always_load:
    routing_summary:
      - 固定执行 source-intake → module-identify → source-confirm → historical-context → requirement-atomize → ambiguity-scan → confirmation-package → product-feedback-merge → coverage-matrix → case-draft → case-review → output → automation-handoff。
      - Archive、XMind、草稿、确认包与自动化意图 manifest 落到引擎经 'kata features resolve' 计算并写入 metadata.yaml/source-snapshot 的固定 feature 目录；不在提示词中拼接路径。
      - 阶段内任务编排：source-intake 与 module-identify 完成且不在 Lanhu/Axure error-fallback 路径下时，按 references/execution-protocol.md 创建 TodoWrite、按 references/worker-prompt.md 派发 Worker、按 references/spec-reviewer-prompt.md 与 references/quality-reviewer-prompt.md 二阶段审查；Lanhu/Axure 阻塞草稿、source-intake 抓取静默期与所有 BlockedEnvelope 路径下禁用。
    hard_rules:
      - Lanhu/Axure URL 的 source-intake、token 搜索顺序、抓取降级、阻塞草稿产物格式、fallback 回复模板与权限拒绝行为严格遵循 references/error-fallback-paths.md；该文件内规则与本节等效，skill.yaml 不逐条重复。
      - 项目未指定时先自行推断 workspace 项目；仅在无候选或多候选无法消歧时询问用户。
      - 历史上下文：history_inferred 作为参考证据使用，新增行为的确认以产品反馈为准。
      - 每个 requirement atom 携带 evidence_kind、ambiguity_class、confidence 和至少一个 source_ref。
      - 证据事实通过 manifest.json#case_drafting.requirement_atoms 中的 SourceRef ID 引用；轻量路径用 { id, source_ref }，完整路径按各自的 schema 保留 source_refs、case_id 与 requirement_atom_ids。
      - archive.md、archive.draft.md、cases.xmind 正文只保留人类可读用例内容；SourceRef 标识（SR-<ID>、csv::、SourceRef 字符串、CSV 证据定位文本）仅存在于结构化数据层。
      - 用例与证据映射通过 case_id 与 requirement_atom_ids 对账；单一字段组合（如 atom_id/case_title/priority）不作为机器唯一键。
      - Lanhu/Axure 阻塞草稿的 confirmation-package.md / unresolved-summary.md 在 error-fallback 路径下豁免，保留 URL token 表与 SourceRef ID。
      - archive.md 与 cases.xmind 在 blocking pending 清零后生成；blocking pending 非零时只输出草稿与确认类产物（confirmation-package.md、archive.draft.md、unresolved-summary.md）。
      - manifest.json#automation.intents[] 中 automation_status=ready 的 AutomationIntent@1 移交 playwright-automation@1；deferred 与 blocked 只留在 manifest 与报告中。
      - Subagent 遇阻塞时通过 BlockedEnvelope 回传主 agent，不直接向用户提问。
      - few-shot 作为格式参照使用，不包含需求事实或历史事实依据。
      - feature 目录 slug：含中文、全角标点、空格、长度超限或多模块串联描述的字符串降级为 `YYYY-MM[-{customer}]-unresolved-{module}-{8-hex}` 兜底，原文写入 metadata.yaml notes；规范命名见 references/error-fallback-paths.md「Slug fallback」节。
  codex_override:
references:
  - path: references/source-intake-protocol.md
    type: normative
    load_phases:
      - source-intake
    purpose: 接收 Lanhu、Axure、PRD、截图、fixture 或自然语言需求源时，建立 source_snapshot、source_refs 与抓取失败处理。
    load_when: step.id == source-intake
  - path: references/module-identify.md
    type: normative
    load_phases:
      - module-identify
    purpose: 在追问前根据 workspace 配置、仓库画像、知识库与源页面路径推断项目和模块。
    load_when: step.id == module-identify
  - path: references/source-confirm.md
    type: normative
    load_phases:
      - source-confirm
    purpose: 在 module-identify 产出稳定上下文后，一轮确认前后端源码 triple 并写入 metadata.yaml/source-snapshot。
    load_when: step.id == source-confirm
  - path: references/historical-context.md
    type: normative
    load_phases:
      - historical-context
    purpose: 在用户授权后读取历史用例、知识库与只读源码证据，并标明历史证据不能确认新增行为。
    load_when: step.id == historical-context
  - path: references/atomization-guide.md
    type: normative
    load_phases:
      - requirement-atomize
    purpose: 将源事实、历史推断与测试假设拆为带 evidence_kind、ambiguity_class、confidence 的 requirement atoms。
    load_when: step.id == requirement-atomize
  - path: references/ambiguity-decision-tree.md
    type: normative
    load_phases:
      - ambiguity-scan
      - product-feedback-merge
    purpose: 识别 blocking、defaultable、inferred 与 confirmed 情形，并限定反馈合并后的重扫范围。
    load_when: step.id in [ambiguity-scan, product-feedback-merge]
  - path: references/confirmation-package-template.md
    type: normative
    load_phases:
      - confirmation-package
      - product-feedback-merge
    purpose: 输出面向产品确认的问题包，并将显式回复合并回 enhanced PRD。
    load_when: step.id in [confirmation-package, product-feedback-merge]
  - path: references/coverage-matrix-guide.md
    type: normative
    load_phases:
      - coverage-matrix
      - case-draft
    purpose: 将 requirement atoms 映射到覆盖矩阵和草稿用例，确保每条用例可追溯到需求原子。
    load_when: step.id in [coverage-matrix, case-draft]
  - path: references/spec-reviewer-prompt.md
    type: normative
    load_phases:
      - case-draft
      - case-review
    purpose: 机械复核 spec 合规、SourceRef 分层、`case_id` 对账与 blocking pending。
    load_when: step.id in [case-draft, case-review]
  - path: references/quality-reviewer-prompt.md
    type: normative
    load_phases:
      - case-draft
      - output
    purpose: 审查用例内容质量，包括步骤完整性、标题可读性、覆盖质量与表述一致性。
    load_when: step.id in [case-draft, output]
  - path: references/case-review-evidence-gates.md
    type: normative
    load_phases:
      - case-review
      - output
    purpose: 复核 SourceRef、历史推断和 blocking unknown，决定最终产物或阻塞草稿产物。
    load_when: step.id in [case-review, output]
  - path: references/automation-handoff-spec.md
    type: normative
    load_phases:
      - automation-handoff
    purpose: 仅交接 ready AutomationIntent@1，阻止 deferred 或 blocked 自动化意图进入 playwright-automation。
    load_when: step.id == automation-handoff
  - path: references/error-fallback-paths.md
    type: normative
    load_phases:
      - source-intake
      - module-identify
      - historical-context
      - confirmation-package
      - case-draft
      - output
      - automation-handoff
    purpose: 在抓取、项目推断、历史读取、澄清、草稿、输出或自动化交接失败时选择可恢复降级路径。
    load_when: step.id in [source-intake, module-identify, historical-context, confirmation-package, case-draft, output, automation-handoff]
  - path: references/execution-protocol.md
    type: normative
    load_phases:
      - historical-context
      - requirement-atomize
      - case-draft
      - case-review
      - output
    purpose: 阶段内 TodoWrite 编排、Worker 派发、二阶段 Review 协议；只在非 error-fallback 路径下生效。
    load_when: step.id in [historical-context, requirement-atomize, case-draft, case-review, output]
  - path: references/worker-prompt.md
    type: normative
    load_phases:
      - historical-context
      - requirement-atomize
      - case-draft
    purpose: 在允许的阶段内派发 case-draft Worker 时，限定输入字段、写入范围、状态 envelope 与证据分层规则。
    load_when: step.id in [historical-context, requirement-atomize, case-draft]
few_shots:
  - path: references/confirmation-package-template.md
    load_phases:
      - confirmation-package
    purpose: 仅供确认包问题组织格式参考，不作需求事实来源。
    load_when: step.id == confirmation-package
    max_tokens: 1200
evidence:
  source_refs_required: true
  distinguish_fact_inference_assumption: true
  required_source_refs:
    - prd.file@1
    - lanhu.fixture@1
  stale_ref_policy: block
failure_policy:
  missing_evidence: refuse_with_questions
  ambiguous_requirement: produce_pending_items
