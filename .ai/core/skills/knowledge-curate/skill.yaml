id: knowledge-curate@1
name: knowledge-curate
kind: product-skill
schema_version: 1
skill_version: 1
status: active
description:
  summary: 查询、更新与维护项目的业务知识、规则、术语、踩坑与模块事实。
  must_trigger_when:
    - 用户希望记录、维护、更新或写入项目业务知识、规则或术语。
    - 用户希望查询业务规则、术语、模块知识或项目业务概念。
  must_not_trigger_when:
    - 用户只询问源码实现细节，不涉及业务知识的查询或更新。
    - 用户要求生成或编辑用例、扫描代码变更，或做 UI 自动化。
outputs:
  - answer
  - entry
inputs:
  project:
    required: false
    kind: workspace_id
  query:
    required: true
    kind: request
allowed_tools:
  - read_file
  - write_artifact
  - ask_user
context_budget:
  core_tokens: 900
  reference_tokens: 5000
  evidence_tokens: 8000
  overflow_policy:
    order:
      - informative_references
      - few_shots
      - evidence_context
      - normative_references
    preserve:
      - hard_rules
      - failure_policy
      - evidence
    on_overflow: summarize_then_drop_lowest_priority
body:
  always_load:
    routing_summary:
      - 查询与维护项目业务知识；知识统一沉淀于 workspace/{project}/knowledge/ 之下。
    hard_rules:
      - 项目知识统一存于 workspace/{project}/knowledge/** 之下。
      - 未明确选定项目之前，不得跨项目编辑知识。
  codex_override:
    routing_summary:
      - 查询与维护项目业务知识；知识统一沉淀于 workspace/{project}/knowledge/ 之下。
    hard_rules:
      - 项目知识统一存于 workspace/{project}/knowledge/** 之下。
      - 未明确选定项目之前，不得跨项目编辑知识。
references:
  - path: references/knowledge-rules.md
    type: normative
    generated_from: body.always_load.hard_rules
    load_phases:
      - query_or_stage_update
      - commit_knowledge_update
    purpose: 查询或写入项目知识条目时，遵循知识库的分类规约与沉淀流程。
    load_when: step.id in [query_or_stage_update, commit_knowledge_update] and outputs.ids contains entry
evidence:
  source_refs_required: true
  distinguish_fact_inference_assumption: true
  required_source_refs:
    - knowledge.entry@1
  stale_ref_policy: block
failure_policy:
  low_confidence_update: require_user_confirmation
  missing_project: ask_one_clarifying_question
