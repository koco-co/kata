id: case-edit@1
name: case-edit
kind: product-skill
schema_version: 1
skill_version: 1
status: active
description:
  summary: 用户提供既有 Archive、XMind 或 CSV 用例产物并要求编辑、同步或转换。
  must_trigger_when:
    - 用户希望对已有测试用例做修改、编辑、同步、标准化、归档或格式转换。
    - 用户给出 XMind、CSV 或既有 Archive MD 用例产物的路径。
  must_not_trigger_when:
    - 用户希望依 PRD 或需求源产出新的测试用例。
    - 用户希望基于已有用例创建或运行 Playwright 自动化。
outputs:
  - archive
  - xmind
  - normalized
  - apply_corrections
inputs:
  artifact:
    required: true
    kind: file
  project:
    required: false
    kind: workspace_id
allowed_tools:
  - read_file
  - write_artifact
  - ask_user
context_budget:
  core_tokens: 900
  reference_tokens: 5000
  evidence_tokens: 8000
  overflow_policy:
    order:
      - informative_references
      - few_shots
      - evidence_context
      - normative_references
    preserve:
      - hard_rules
      - failure_policy
      - evidence
    on_overflow: summarize_then_drop_lowest_priority
body:
  always_load:
    routing_summary:
      - 编辑或同步用例产物——语义不变是底线。
    hard_rules:
      - 编辑或同步用例时，原有语义须完整保留。
      - 缺失的前置条件、步骤或预期结果，不得凭空补造。
      - 涉及平台表单字段、菜单路径、规则类型、参数枚举或执行链路的编辑，必须先读取可用的上线需求用例、平台 DOM、源码或项目知识作为证据；无法取得证据时标记为待确认，不得凭经验补字段。
      - 表单字段、按钮、Tab、下拉选项和枚举值必须逐字匹配证据中的实际文案；不得将「sql」归一成「SQL」、不得把「字段」写成「字段级」、不得用动作泛称替代按钮全称。
      - 交付前必须自审 Archive Markdown 与 XMind 的数量、优先级、标题、前置条件、步骤和预期一致性，不得依赖用户人工发现格式或业务规则问题。
      - 用户明确指定用例标题或历史标题包含业务括号（如「验证【规则名】...」）时，必须原样保留业务括号内容，不得按通用标题规则移除。
      - 用例级节点格式与可读性以 .ai/core/skills/case-draft/references/output-standard.md#用例级节点格式（Case-Level Normative） 为准；DQ 规则任务管理类用例额外遵循该节「数据质量子集」段。
  codex_override:
    routing_summary:
      - 编辑或同步用例产物——语义不变是底线。
    hard_rules:
      - 编辑或同步用例时，原有语义须完整保留。
      - 缺失的前置条件、步骤或预期结果，不得凭空补造。
      - 涉及平台表单字段、菜单路径、规则类型、参数枚举或执行链路的编辑，必须先读取可用的上线需求用例、平台 DOM、源码或项目知识作为证据；无法取得证据时标记为待确认，不得凭经验补字段。
      - 表单字段、按钮、Tab、下拉选项和枚举值必须逐字匹配证据中的实际文案；不得将「sql」归一成「SQL」、不得把「字段」写成「字段级」、不得用动作泛称替代按钮全称。
      - 交付前必须自审 Archive Markdown 与 XMind 的数量、优先级、标题、前置条件、步骤和预期一致性，不得依赖用户人工发现格式或业务规则问题。
      - 用户明确指定用例标题或历史标题包含业务括号（如「验证【规则名】...」）时，必须原样保留业务括号内容，不得按通用标题规则移除。
      - 用例级节点格式与可读性以 .ai/core/skills/case-draft/references/output-standard.md#用例级节点格式（Case-Level Normative） 为准；DQ 规则任务管理类用例额外遵循该节「数据质量子集」段。
few_shots:
  - path: references/fewshots/case-format-sample.md
    load_phases:
      - plan_edit
      - output
    purpose: 用例级节点格式参照（含 DQ 子集），仅用于格式参考，不作需求事实来源。
    load_when: step.id in [plan_edit, output]
    max_tokens: 3000
  - path: references/fewshots/case-format-sample.xmind.md
    load_phases:
      - plan_edit
      - output
    purpose: XMind 用例 topic 与 md 用例的映射对照（ASCII 树状示意，非真 .xmind）。
    load_when: step.id in [plan_edit, output]
    max_tokens: 1500
references:
  - path: references/archive-xmind-sync.md
    type: normative
    generated_from: body.always_load.hard_rules
    load_phases:
      - plan_edit
      - preview_diff
      - output
    purpose: 规划编辑、预览差异或导出用例时，保持 Archive 与 XMind 之间的一致性。
    load_when: step.id in [plan_edit, preview_diff, output] and outputs.ids contains archive
  - path: references/apply-corrections.md
    type: normative
    load_phases:
      - apply-corrections
    purpose: 加载 case-corrections.md + sidecar，进行 dry-run summary 三选一，按 status=approved 回写 archive.md，调用 archive-xmind-sync 同步 xmind，写 apply-log。
    load_when: step.id == apply-corrections
evidence:
  source_refs_required: true
  distinguish_fact_inference_assumption: true
  required_source_refs:
    - case.archive@1
  stale_ref_policy: block
failure_policy:
  missing_artifact: ask_for_file_path
  ambiguous_edit: ask_one_clarifying_question
