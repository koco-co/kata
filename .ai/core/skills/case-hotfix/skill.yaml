references:
  - path: references/hotfix-archive-format.md
    type: normative
    generated_from: workspace/dataAssets/_shared/rules/hotfix-*.md and historical Hotfix archives
    load_phases:
      - draft_cases
      - review_cases
      - output
    purpose: Apply executable Hotfix archive format, prerequisite SQL, and historical case layout before writing or reviewing archive output.
    load_when: outputs.ids contains archive
evidence:
  source_refs_required: true
  distinguish_fact_inference_assumption: false
  required_source_refs:
    - bug.record@1
  stale_ref_policy: block
failure_policy:
  missing_bug_context: ask_one_clarifying_question
  ambiguous_fix_scope: produce_pending_items
