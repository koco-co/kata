      - SSH 统一用 `SSHPASS=<pw> sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 root@<host>`；禁止把明文密码拼进 ps 可见的命令行。
      - 只读诊断（ping/nc/telnet/systemctl status/journalctl/netstat/ss/docker ps 等）自动执行；破坏性操作（重启/改防火墙/kill/改配置）须先告知命令并经用户确认。
      - 根因必须有命令输出支撑，区分事实与推断，无证据不臆造根因或负责人。
      - 定位根因或修复后，把症状、报错原文、根因、排查命令与输出摘要、解决方案、主机端口写入 `.kata/infra/knowledge/` 新条目。
      - 禁止改动 `.kata/repos/**` 源码仓库；本技能只操作目标服务器与本地 `.kata/infra/`。
references:
  - path: references/diagnostic-playbook.md
    type: normative
    load_phases:
      - diagnose
    purpose: 按报错类型给出分步只读诊断与对症修复路径，含 Hive No route to host 等典型案例。
    load_when: step.id == diagnose
  - path: references/ssh-protocol.md
    type: normative
    load_phases:
      - diagnose
      - propose_or_apply_fix
    purpose: SSH 连接、凭据读取与缺失补充、破坏性命令确认门控的执行规约。
    load_when: step.id in [diagnose, propose_or_apply_fix]
  - path: references/knowledge-format.md
    type: normative
    load_phases:
      - lookup_knowledge
      - record_knowledge
    purpose: 排查知识库的检索流程与条目落盘格式，保证先查后做、收尾沉淀。
    load_when: step.id in [lookup_knowledge, record_knowledge]
evidence:
  source_refs_required: false
  distinguish_fact_inference_assumption: true
failure_policy:
  missing_credentials: ask_one_clarifying_question
  unreachable_host: produce_pending_items
