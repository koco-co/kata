      - playwright-cli 只作为 vendor 工具能力；kata 产品入口始终是 playwright-automation。
      - 环境必须通过 `workspace/<project>/_shared/env/*.yaml` profile 表达；不得为交付或自动化运行新写 `workspace/<project>/.env.local`。
      - env-preflight 的一次性 Playwright/session 探测脚本只能写入 `mktemp -d` 创建的 `/tmp/kata-playwright-preflight-*` 目录或当前 feature 的 `results/<run-id>/playwright/preflight/`；创建当前 feature 证据目录时必须从 repo root 使用相对路径 `workspace/{project}/features/{featureId}/results/<run-id>/playwright/preflight`，不得用 `<REPO_ROOT>/...` 绝对路径作为 `mkdir -p` 目标。不得使用平铺的 `/tmp/kata-playwright-preflight-*.mjs`，不得在 repo root、project 根目录或 feature 根目录写入/遗留 `check-session.mjs`、`probe.mjs` 等临时脚本。截图、JSON、HAR 等探测证据必须写入同一个 preflight 证据目录，不得用相对路径把 `session-verify.png`、`session-probe.png` 等文件落到 repo root。若脚本 import `playwright` 或 `@playwright/test`，运行前必须证明执行方式可解析依赖，不得以 `ERR_MODULE_NOT_FOUND` 试错。可选文件集合检查不得使用会触发 zsh `no matches found` 的未保护 glob。
      - env-preflight 若脚本会 `import` / `require` `playwright`、`@playwright/test`、repo helper 或 workspace package，必须直接写入当前 feature 的 `results/<run-id>/playwright/preflight/` 或 `results/preflight/` 并从 repo root 执行；不得先写到 `/tmp` 试跑再因依赖解析失败改写到 results。只有不依赖本仓库 node_modules/workspace 的轻量 shell/Node 探测才可使用 `/tmp`。若选择 `/tmp` 保存探测脚本，必须先用 Bash 执行 `mktemp -d /tmp/kata-playwright-preflight-XXXXX` 并读取真实返回目录；Write 的 `file_path` 必须使用该真实目录。禁止写入包含未展开 shell 变量或占位符的路径，如 `/tmp/kata-playwright-preflight-$$/probe.mjs`、`$TMPDIR/probe.mjs`、`${TMPDIR}/probe.mjs` 或平铺 `/tmp/kata-playwright-preflight-*.mjs`。
      - env-preflight Playwright 探测脚本读取 profile `auth.session_path` 时，若路径是 `.kata/...` 或其他 repo-root 相对路径，脚本必须在第一次 Write 中通过 `path.resolve(process.cwd(), auth.session_path)` 从 repo root 解析，并在运行命令中固定 `cwd` 为 repo root；不得用 `__dirname`、`import.meta.url` 或手写 `../../../` 从脚本所在 `results/**` 目录反推 repo root，不得先写错路径再用 Edit 试探修正，不得出现先写 `const __dirname = path.dirname(fileURLToPath(import.meta.url))` 再替换为 `process.cwd()` 的探测脚本修复。需要绝对路径时必须在写脚本前由 Bash `pwd` 或 Node `process.cwd()` 一次性计算并注入，禁止多次编辑同一 probe 脚本只为修正 storageState 路径层级。
      - env-preflight 在用户确认 env profile 后，必须先完成登录跳转、权限页、产品页可达性的全部探测并形成单一最终分类，再输出任何面向用户的 blocker 文本；不得先输出“noPermission/无权限”再继续探测并改判为“session 过期”。只要任一确认性探测显示跳转到 `/login`、`/uic/#/login` 或页面正文为登录页，应优先归类为登录态过期/无效；只有在未跳转登录且已确认处于登录态的页面或 API 返回 401/403/无权限页时，才可归类为权限问题。
      - NO_PERMISSION_DIRECT_TEXT_GATE：env-preflight 真实探测确认已登录但跳转 `noPermission`、`productAccess`、401/403 或无权限页后，下一条 assistant `type=text` 必须是唯一的 no_permission 直接文本 blocker，且第一个字符必须直接是 blocker 正文，不得先输出“探测结果显示”“探测确认已登录但无 dataAssets 产品权限”“归类为 no_permission”“Wait — 按规则”等过渡文本，不得再调用权限阻塞 AskUserQuestion，不得在 AskUserQuestion 失败后再输出第二个 blocker。no_permission blocker 不得追加 tenant/project ID、括号编号或 `session 有效` 之类未要求的状态包装；tenant 和质量项目只写 profile 中的名称，例如 `pw_test`，不得写 `pw_test（10481）`、`pw_test (92)`。若需要列后续操作，只能在同一条最终文本中用一句话说明可切换有权限环境或补充有权限 Cookie，不得生成多选交互。
      - env-preflight 的登录态补充触点必须分别列出已确认 env profile、已检查的 `auth.session_path`、已检查的 repo-root fallback 路径；即使两者是同一路径，也必须用两行分别说明同一路径及过期/缺失状态，不得合并成一句“已检查 session 路径”。
      - LOGIN_SUPPLEMENT_MUST_BE_VISIBLE_TEXT：真实探测确认登录跳转、登录页或 `session_expired` 后，Cookie 补充模板必须作为 assistant `type=text` 可见输出发送，不能只写在 thinking 中；该文本发送前不得调用 Bash/Read/Edit/Write/Glob/Grep 等任何工具，不得清理或删除 `results/**/preflight` 探测脚本、截图或 JSON 证据，不得以空 result 结束。
      - LOGIN_SUPPLEMENT_DIRECT_TEXT_GATE：在 env-preflight 的 Bash/Playwright/API 探测结果已经显示登录跳转、登录页或 `session_expired` 后，下一条 assistant `type=text` 必须直接是最终 Cookie 补充请求，且第一行严格为 `会话已过期。`；不得先发送任何过渡文本。若即将输出 `探测结果显示`、`探测结果确认 session 已过期`、`探测确认 session 已过期`、`探测确认 session 过期`、`探测确认跳转登录页`、`探测确认该 session 已过期，页面跳转到登录页。按规则直接输出 Cookie 补充请求。`、`探测确认 session 已过期，页面跳转到登录页。按规则直接输出 Cookie 补充请求。`、`探测确认 session 过期，页面跳转到登录页。按规则直接输出 Cookie 补充请求。`、`探测确认登录跳转`、`跳转到登录页`、`跳转至 /login`、`Session 已过期`、`登录态已过期`、`进入登录态补充触点`、`需要补充登录态`、`准备请求 Cookie`、`归类为 session_expired`、`按规则输出 Cookie 补充请求`、`按规则直接输出 Cookie 补充请求`、`按规则输出登录态补充请求`、`输出登录态补充请求` 等文字，必须删除这条过渡文本，把路径和 Cookie 请求合并进同一条最终文本。该阶段不得出现两条登录态 blocker text；最终 blocker 文本的第一个字符必须是 `会`，不得在同一条 text 前面拼接诊断句。
      - 登录态直接文本请求必须按此模板输出；模板前不得有任何字、空行、标题或横线，第一行之前不得写“Session 已过期，按规则直接输出 Cookie 补充请求”等元说明：`会话已过期。\n\n已确认环境：{env_profile}\n已检查 auth.session_path：{auth_session_path}（过期）\n已检查 repo-root fallback：{repo_root_fallback}（同一路径，过期|缺失|过期）\n\n请提供当前登录态 Cookie 字符串，以便重新生成 storageState 后继续。`
      - 登录态补充必须在“直接文本请求”和“AskUserQuestion”二选一，不得两者都做。`claude --print`、非交互运行或 `/playwright-automation` workflow 中默认使用直接文本请求：形成 session 过期/无效最终分类后的下一次 assistant text 必须就是最终 Cookie 补充请求并立即停止，首行必须是 `会话已过期。`；不得先输出或在最终文本中包含“Session 已过期”“进入登录态补充触点”“归类为”“输出 Cookie 补充请求”“session_expired”等内部过程说明，不得调用登录态 AskUserQuestion。若明确处于可交互 UI 且选择使用 AskUserQuestion，形成 session 过期/无效最终分类后的下一次 assistant action 必须是 AskUserQuestion tool_use；问题正文必须承载已确认 env profile、已检查的 `auth.session_path` 和 repo-root fallback；调用前不得先输出任何同义 blocker 文本，例如“Session expired”“Session 已过期”“登录态过期”“需要补充登录态”“需要提供有效 Cookie”“已检查 session 路径”等。若 AskUserQuestion 在 `claude --print` 中返回 `Answer questions?`，只输出一次最终 Cookie 补充请求并停止；该最终文本不得包含 `AskUserQuestion`、`当前模式`、`工具不可用` 等工具元说明。登录态补充若使用 AskUserQuestion，必须提供至少两个合法互斥选项；不得只传一个“提供 Cookie”选项导致 InputValidationError。登录态补充默认只请求 Cookie 字符串或要求稍后处理，不得主动索要明文密码/登录凭据。
      - 新建 env profile 前必须检查 `workspace/<project>/_shared/env/*.yaml`：若 base_url + tenant_name 已存在匹配 profile，编辑现有 profile 而非新建。
      - 新生成的 feature 自动化必须提供 `tests/runners/smoke.spec.ts` 与 `tests/runners/full.spec.ts`；runner 只做聚合，case 写入 `tests/cases/`，共享页面对象写入 `_shared/pages/`，共享 helper 写入 `_shared/helpers/`，禁止写入 feature-local helper 目录。
      - 进入 `playwright-generate` 前必须有本轮 plan-reconcile 结论，且 status 只能是 `aligned` 或 `plan_adjusted`；若 status 为 `blocked`、`needs_user_decision`、`blocked_by_ui_probe`，或 ui-probe 因 3 次探测预算耗尽而未确认核心 UI 事实，不得读取 `references/playwright-generate.md`，不得检查/创建 tests、page object 或 runner，不得生成“预自动化脚本”或“可用性检测脚本”；必须进入 handoff 并输出阻塞证据。
      - 交付前必须至少运行目标 `full.spec.ts`；只运行 smoke 不得宣称端到端自动化完成。
references:
  - path: references/case-normalize.md
    type: normative
    load_phases:
      - case-normalize
    purpose: 将 MD、Archive、PRD、Lanhu、脚本或失败结果归一化为 UiAutomationIntent。
    load_when: step.id == case-normalize
  - path: references/env-preflight.md
    type: normative
    load_phases:
      - env-preflight
    purpose: 校验 base URL、登录态、项目、数据源、权限与浏览器依赖。
    load_when: step.id == env-preflight
  - path: references/ui-plan.md
    type: normative
    load_phases:
      - ui-plan
    purpose: 规划覆盖范围、可见断言、fixture、选择器策略和风险。
    load_when: step.id == ui-plan
  - path: references/ui-probe.md
    type: normative
    load_phases:
      - ui-probe
    purpose: 通过真实浏览器收集页面、可访问性、截图、网络与 locator 证据。
    load_when: step.id == ui-probe
  - path: references/plan-reconcile.md
    type: normative
    load_phases:
      - plan-reconcile
    purpose: 对账书面用例与真实 UI，输出继续、调整、提问或阻塞。
    load_when: step.id == plan-reconcile
  - path: references/playwright-generate.md
    type: normative
    load_phases:
      - playwright-generate
    purpose: 基于对账后的计划和 UI 证据生成或修复 Playwright 脚本。
    load_when: step.id == playwright-generate
  - path: references/self-run.md
    type: normative
    load_phases:
      - self-run
    purpose: 运行目标 spec 并记录命令、退出码、输出与报告路径。
    load_when: step.id == self-run
  - path: references/run-triage.md
    type: normative
    load_phases:
      - run-triage
    purpose: 将失败归类为产品、脚本、数据、权限、环境、未知或需用户决策。
    load_when: step.id == run-triage
  - path: references/repair-loop.md
    type: normative
    load_phases:
      - repair-loop
    purpose: 执行有限修复循环并保留每次修复证据。
    load_when: step.id == repair-loop
  - path: references/quality-gate.md
    type: normative
    load_phases:
      - quality-gate
    purpose: 检查脚本结构、断言完整性、session 合规、manifest、handoff 双轨等 15 项质量门禁。
    load_when: step.id == quality-gate
  - path: references/handoff.md
    type: informative
    load_phases:
      - handoff
    purpose: 输出通过、阻塞、部分完成或修复耗尽的最终交付报告。
    load_when: step.id == handoff
  - path: references/execution-protocol.md
    type: normative
    load_phases:
      - ui-probe
      - playwright-generate
      - self-run
      - repair-loop
    purpose: 阶段内 TodoWrite 编排、Worker 派发、二阶段 Review 协议；只在用户确认 env 且无 blocker 后生效。
    load_when: step.id in [ui-probe, playwright-generate, self-run, repair-loop]
  - path: references/worker-prompt.md
    type: normative
    load_phases:
      - ui-probe
      - playwright-generate
      - self-run
      - repair-loop
    purpose: Worker subagent prompt 模板与 status envelope schema。
    load_when: step.id in [ui-probe, playwright-generate, self-run, repair-loop]
  - path: references/spec-reviewer-prompt.md
    type: normative
    load_phases:
      - ui-probe
      - playwright-generate
      - self-run
      - repair-loop
    purpose: 阶段产物 spec 合规机械检查清单与输出 schema。
    load_when: step.id in [ui-probe, playwright-generate, self-run, repair-loop]
  - path: references/quality-reviewer-prompt.md
    type: normative
    load_phases:
      - playwright-generate
      - repair-loop
    purpose: 脚本内容质量审查（选择器、断言、复用度）。
    load_when: step.id in [playwright-generate, repair-loop]
evidence:
  source_refs_required: true
  distinguish_fact_inference_assumption: true
  required_source_refs:
    - ui.automation.intent@1
    - ui.probe.snapshot@1
    - self.run.result@1
  stale_ref_policy: block
failure_policy:
  missing_environment: blocked_by_env
  missing_probe_evidence: return_to_ui_probe
  run_failed: enter_run_triage
  repair_limit_reached: failed
  unknown_failure: failed
