id: playwright-automation@1
name: playwright-automation
kind: product-skill
schema_version: 1
skill_version: 1
status: active
description:
  summary: 生成、修复或验证 Playwright UI 自动化，并在交付前完成真实浏览器运行与失败归因。
  must_trigger_when:
    - 用户希望生成、修复、验证或运行 Playwright UI 自动化。
    - 用户提供 MD 用例、PRD、Lanhu、脚本或失败结果来推进 UI 自动化。
    - 用户要求对 UI 自动化失败做归因并继续修复。
  must_not_trigger_when:
    - 用户只想手动操作浏览器而不生成或修复测试。
    - 用户只需要非 UI 的 QA 用例编写。
    - 用户只需要静态代码扫描。
outputs:
  - plan
  - script
  - run
  - handoff
inputs:
  request:
    required: true
    kind: file_or_text
    schema: UiAutomationIntent@1
  project:
    required: false
    kind: workspace_id
  automation_intent:
    required: false
    kind: file
    schema: AutomationIntent@1
allowed_tools:
  - read_file
  - write_artifact
  - ask_user
  - run_command
context_budget:
  core_tokens: 1200
  reference_tokens: 8000
  evidence_tokens: 12000
  overflow_policy:
    order:
      - few_shots
      - informative_references
      - evidence_context
      - normative_references
    preserve:
      - hard_rules
      - failure_policy
      - source_refs
      - self_run_evidence
    on_overflow: summarize_then_drop_lowest_priority
body:
  always_load:
    routing_summary:
      - 统一处理 UI 自动化规划、真实页面探测、Playwright 生成、运行归因和修复闭环。
      - 阶段内任务编排：用户确认 env 且 env-preflight 无 blocker 后，按 references/execution-protocol.md 创建 TodoWrite 子任务、按 references/worker-prompt.md 派发 Worker、按 references/spec-reviewer-prompt.md 与 references/quality-reviewer-prompt.md 二阶段审查；silent-mode、env-preflight 全阶段、所有 BLOCKED 模板路径下禁止该协议。
    hard_rules:
      - PREFLIGHT_TOOL_DENIAL_SENTINEL：已确认 env profile 后，任何 env-preflight 工具结果只要包含 `Unhandled node type`、`This command requires approval`、`Contains simple_expansion`、`Contains command_substitution`、`was blocked`、`requires approval`、`requested permissions`、`hasn't granted it yet`、`permission denied` 或 `未授权`，下一次 assistant action 必须立刻是最终 text，且第一个字符必须是 blocker 模板的 `b`。进入真实 probe/run-id/evidence-dir 阶段后不得在同一 assistant message 中批量发起 `pwd` 与 run-id/evidence 相关 Bash；也不得在同一 assistant message 中同时发起 run-id generation 与 evidence directory creation，必须先等待 run-id tool_result，确认未拒绝后才能创建 evidence 目录。若同一批 tool_result 中一个成功、另一个包含拒绝信号，拒绝信号优先，下一次 action 仍必须是最终 text，不得利用成功的 `pwd` 或其他成功结果继续推进。首次拒绝后不得调用 TodoWrite、不得维护 todo 状态、不得写“Todos have been modified”、不得用 `echo "test"` 或任何 basic command availability probe 测试工具是否还能用；即使 thinking 已经写出“must immediately output the blocker”“No more tool calls”“Let me output the blocker”“I already violated”“I can't undo”“STOP NOW”，下一次 action 也不得是 TodoWrite 或 Bash。首次拒绝后的下一次 assistant message 必须只包含一个 `type=text` content item；不得包含 `type=thinking` 或任何 tool_use。不得再运行 `date`、`mkdir`、`mktemp`、`pwd`、`ls`、`test -d`、`echo "test"`、`Write` 或任何“换个命令/试一下/看一下是否可用”的工具调用；不得为了“Let me simplify”“simpler approach”“format it properly”“Get repo root pwd”“确认 repo root”“构造命令”“the path is under <REPO_ROOT>”“path IS under <REPO_ROOT>”“false positive”“allowed working directories”“check current working directory”“results directory exists”“确认测试文件”“feature 目录内容”“tests/runners/full.spec.ts 是否存在”“handoff 命令路径”调用 `pwd`、`ls`、`echo "preflight-$(date +%s | md5 | head -c 8)"`、`openssl rand`、`uuidgen` 或 `echo "test"`，blocker 命令只使用已知的 env profile 文件名、project 和 featureId；不得运行 `ls workspace/dataAssets/features/2026-04-dq-builtin-reasonability-field-calc-compare/`，不得调用 description 为 `Check if feature directory contents reveal tests existence` 的 Bash。不得在模板前写“根据硬规则”“mkdir 被工具策略拒绝”“必须停止 env-preflight 阶段”等解释；不得把整个 blocker 包进一个 fenced code block。最终 text 只能是 tool_permission_denied blocker 模板，模板中只有验收命令放进 fenced code block。
      - 'PREFLIGHT_TOOL_DENIED_BLOCKER_EXACT_FORMAT：tool_permission_denied blocker 第一行必须严格等于 `blocked_by_environment: tool_permission_denied`；不得写成 `blocked_by_environment / tool_permission_denied`、`blocked_by_environment/tool_permission_denied`、`blocked_by_environment - tool_permission_denied` 或任何 slash/hyphen 变体。验收命令 fenced code block 语言必须严格为 `shell`，不得写成 `bash`，且 fenced block 中只能包含一行验收命令；不得把整个 blocker 包进 fenced code block。'
      - PREFLIGHT_TOOL_DENIED_NO_POST_READ：tool_permission_denied 首次拒绝后不得为了确认 `env_profile_file`、`project`、`featureId`、`profile.project` 或验收命令变量重新 `Read` env profile、manifest、metadata 或 reference；禁止 `Read workspace/dataAssets/_shared/env/ltqc-local.yaml`、`Read workspace/*/_shared/env/*.yaml`。必须只使用拒绝前已经知道的 env profile 文件名、project 和 featureId 组装 blocker；即使 thinking 已写出“Let me output this blocker”，下一次 action 也不得是 Read 或任何 tool_use。
      - 'PREFLIGHT_TOOL_DENIED_NO_POST_DIAGNOSTICS：tool_permission_denied 首次拒绝后不得调用 description 为 `Get repo root` 的 `pwd`、description 为 `Test basic command availability` 的 `echo "test"`，也不得在 thinking 写出“NO NO NO! I just violated the rule”或“I just made another violation”后继续任何 tool_use。即使已经错误调用过 `pwd` 或 `echo "test"`，最终 text 第一个字符仍必须是 `blocked_by_environment: tool_permission_denied` 的 `b`；不得在前面追加“`mkdir -p` 被工具策略阻止，必须停止 env-preflight 阶段。”或任何诊断前缀。'
      - 'PREFLIGHT_MTIME_PROGRESS_SILENT：session mtime 超过 24 小时只能作为内部事实触发真实 Playwright 复验；不得输出 `Session file mtime ~36.7h > 24h`、`需要真实 Playwright 复验`、`使用字面量 run-id` 或任何 mtime/run-id 进度文本。确认 env profile 后到最终 blocker 之前，mtime 计算、run-id 选择、evidence dir 创建都必须保持 silent，除非最终输出 blocker 模板。'
      - PREFLIGHT_APPROVAL_PROMPT_IS_DENIAL：已确认 env profile 后，`This Bash command contains multiple operations`、`The following parts require approval`、`require approval` 与 `This command requires approval` 一样都是首次拒绝终止信号；不得解释为“还不是 denial”“只是 approval prompt”“可换个命令继续试”。首次出现后下一次 assistant action 必须是唯一最终 blocker text；不得换用 `openssl rand`、`uuidgen`、`echo "preflight-$(date +%s | md5 | head -c 8)"`、TaskStop、`task_id="placeholder"`、Read reference 或任何 tool_use。
      - SILENT_MODE_TRIGGER：当用户输入是 `/playwright-automation` 加功能名称、标题片段或自然语言描述，且未显式提供 `环境:`、base_url、env profile 或 Cookie 时，第一条 assistant text 只能是 AskUserQuestion 失败后的最终环境确认 fallback，且第一行必须是 `请确认执行环境。`；在此之前不得发送任何 `type=text` 内容。该规则覆盖技能宣告、目标命中说明、状态分析、source_backed_bootstrap 判断、env-preflight 说明、profile 读取说明和 session 检查说明；禁止在 fallback 前写“已加载 playwright-automation 工作流”“I need to invoke the `playwright-automation` skill first as required by the routing rules.”“目标目录已精确定位”“目标目录已定位”“目标目录已定位：”“目标目录已确定：”“目标目录已确认”“目标目录已定位。让我读取该目录的 manifest 和 metadata。”“已定位目标目录”“现在读取 manifest 和 metadata”“精确命中目标目录”“PRD 标题精确匹配”“PRD 精确包含”“确认目标目录”“case_drafting.status=”“case_drafting.status”“case_drafting.status == not-started”“`prd.md` 和 `inputs/lanhu-snapshots/` 都存在”“进入 source_backed_bootstrap”“进入 source_backed_bootstrap 模式”“符合 source_backed_bootstrap 条件”“先检查可用的环境 profile”“已读取 4 个环境 profile”“所有 4 个 profile 均存在”“所有 4 个 profile 的 session 文件均存在”“所有 4 个 session 文件均存在”“发起环境确认”等任何进度或解释。需要展示给用户的唯一交互必须通过 AskUserQuestion 工具发起，非交互失败后才输出 fallback。若即将输出任何进度文字，必须删除该文字，直接调用下一步工具。
      - CANONICAL_ENV_ASKUSERQUESTION：环境确认时必须一次性调用 `AskUserQuestion`，input 必须包含顶层非空 `questions` 数组、一个问题对象、`question/header/options` 字段，以及四个完整文件名 option label；调用前先在内部准备完整 input，具体 payload 示例见 `references/env-preflight.md`。若还没有准备好 `questions` 数组，不得调用 AskUserQuestion。严禁用空对象 `{}`、占位调用或缺少 `questions` 的调用试探工具。
      - EXPLICIT_ENV_PROFILE_CONFIRMED：只要用户输入中包含 `环境:`、`env:`、base_url，或完整 env profile 文件名（如 `ltqc-local.yaml`、`ltqc-test.yaml`、`ltqc-prod.yaml`、`ci63.yaml`），该环境视为用户已确认；不得再调用环境确认 AskUserQuestion，不得输出环境确认 fallback。此时必须直接读取对应 profile，执行 env-preflight，并在登录态失效时进入登录态补充触点。
      - DEFAULT_ENV_CONFIRMATION_ACCEPTED：若前一轮环境确认 fallback 已提示 `默认推荐：ltqc-local.yaml`，且用户回复只有 `确认`、`确认。`、`使用默认`、`默认` 或同义短句，必须视为确认默认推荐环境 `ltqc-local.yaml`；不得再次调用环境确认 AskUserQuestion，不得再次输出环境确认 fallback。此时按 `ltqc-local.yaml` 已显式确认处理，直接读取该 profile、执行 env-preflight，并在登录态失效时进入登录态补充触点。解析 `/playwright-automation` 原始输入时必须先按行检查最后一个非空行；若最后一个非空行只有 `确认`、`确认。`、`使用默认` 或 `默认`，必须先从功能检索文本中剥离该行，并立即设置 `env_profile=ltqc-local.yaml`、`env_confirmed=true`。这类同消息确认不得当作标题关键词、功能名称、自然语言描述或新一轮无环境请求；不得再调用环境确认 AskUserQuestion；不得输出“已剥离尾部 `确认`，设置 `env_profile=ltqc-local.yaml`，进入静默 bootstrap”“已剥离尾部”“设置 `env_profile=ltqc-local.yaml`”“进入静默 bootstrap”等解析过程说明。该路径从目标 discovery 开始到最终 env-preflight blocker 之前不得发送任何 assistant `type=text`；只允许工具调用和内部推理。若最终分类为登录态过期，最终 blocker 文本的第一个字符必须就是 `会话已过期。` 的 `会`，不得在同一条 text 中把确认解析、目标命中、bootstrap、mtime 或探测过程拼接在模板之前。
      - EXPLICIT_ENV_SILENT_PREFLIGHT：当 `/playwright-automation` 输入是功能名称、标题片段或自然语言描述且已显式提供 env profile 时，从初始 discovery、目标目录选择、manifest/metadata 检查、source_backed_bootstrap 判断、env profile 读取、session mtime 检查到 Playwright/API 探测完成之前，不得发送任何 assistant `type=text` 进度。DEFAULT_ENV_CONFIRMATION_ACCEPTED 触发后同样适用。禁止写“Using playwright-automation”“Using playwright-automation to process feature”“Starting with feature name fragment discovery”“Found 精确目标目录”“Based on the search results”“has an exact PRD title match”“Let me now read the target directory metadata”“Let me read the target directory”“已剥离尾部”“设置 `env_profile=ltqc-local.yaml`”“进入静默 bootstrap”“开始两段式名称片段发现”“目标目录已精确定位”“目标目录已精确定位：”“目标目录已定位到”“目标目录已精确命中”“目标目录已精确命中：”“目标目录已定位：”“目标目录已确认：”“目标目录已确认：`workspace/dataAssets/features/”“目标目录确认为”“标题精确命中”“PRD 标题：”“PRD 标题精确匹配”“PRD 标题精确命中”“用户附带的 `确认`”“读取 manifest 和 metadata”“现在读取 manifest”“现在读取 manifest 和 metadata”“case_drafting.status”“case_drafting.status == not-started”“case_drafting.status != completed”“缺少 `archive.md`/`test-point-checklist.md`”“`prd.md` 和 `inputs/lanhu-snapshots/` 均存在”“prd.md 和 inputs/lanhu-snapshots/”“prd.md 和 inputs/lanhu-snapshots/ 存在但缺少 archive/test-point-checklist”“进入 source_backed_bootstrap 模式”“进入 source_backed_bootstrap”“环境已确认为”“环境已显式确认”“环境已显式指定”“用户已显式指定”“Environment confirmed as”“Wait — 按规则”“按规则我不得”“直接读取 env-preflight”“直接执行 env-preflight”“Checking session file status”“Session 文件存在但 mtime 34h > 24h”“Session 文件 mtime 超过 24 小时”“Session 文件存在但 mtime 超过 24 小时”“Session 文件存在但已超过 24 小时”“Session file exists but mtime”“需运行真实 Playwright 复验”“需要真实 Playwright 复验”“创建探测脚本”“Running real Playwright probe”“Checking source-backed bootstrap eligibility”“Entering source_backed_bootstrap”“Now reading env-preflight”“checking session file”“Session file exists”“Creating probe script”“Probe confirms”“探测确认登录跳转”“探测确认跳转登录页”“session 已过期”“按规则输出 Cookie 补充请求”“按规则直接输出 Cookie 补充请求”“Outputting Cookie supplement request”等阶段提示。若最终分类为登录态过期，第一条且唯一一条可见 blocker text 必须直接以 `会话已过期。` 开头；不得在模板前加入探测摘要。`claude --print --output-format stream-json` 的显式环境登录过期路径只能出现一条 assistant `type=text`，且该文本必须就是 Cookie 补充模板。最终 blocker 文本的第一个字符必须就是模板首字，不得在同一条 text 前面拼接诊断句。
      - ENV_PREFLIGHT_PERMISSION_DENIED_STOP：用户已确认 env profile 后，若 env-preflight 的 session existence check、session mtime/age calculation、run-id generation、Bash/Write/curl/Playwright probe、临时脚本写入或证据目录创建返回 permission denied、未授权、requires approval、hasn't granted it yet、requested permissions、was blocked、Contains command_substitution、Contains simple_expansion、simple_expansion、contains multiple operations、This Bash command contains multiple operations、Unhandled node type、需要批准 或等价权限/工具策略拒绝，第一次拒绝即为终止信号，必须立即停止探测和修复尝试；不得区分“交互模式/非交互模式”，不得把用户回复“确认”解释为允许继续请求工具权限，不得把 approval prompt、hasn't granted it yet、was blocked、Contains command_substitution、Contains simple_expansion、Unhandled node type 或 multiple operations approval 解释成“标准交互授权流程”“可换个命令继续试”“换个命令继续算 mtime”“换个命令生成 run ID”“换个命令生成更简单 run ID”“simple approach”“用户还没机会 approve”“不是实际 denial”“false positive”“路径看似在 allowed working directories 内”。首次拒绝后的下一次 assistant action 必须是唯一最终 text；首次拒绝后的下一次 assistant message 必须只包含一个 `type=text` content item；不得包含 `type=thinking` 或任何 tool_use。即使 thinking 中已经决定“输出 blocker/stop/no more tool calls”“I already violated”“I can't undo”“STOP NOW”，下一次 action 也不得是 `pwd`、`ls`、run-id retry、placeholder command、Read reference 或任何 tool_use；不得先输出一条解释 text 再继续 tool_use；不得再出现任何 Bash/Read/Write/Edit/Glob/Grep/WebFetch/curl/Playwright probe tool_use，不得继续运行 `stat -f "%Sm"`、`openssl rand`、`uuidgen`、`date`、`date +%s | md5 | head -c 8`、`FEATURE="workspace/dataAssets/features/2026-04-dq-builtin-reasonability-field-calc-compare"; RUN_ID="preflight-$(date +%s | md5 | head -c 8)"; mkdir -p "$FEATURE/results/$RUN_ID/playwright/preflight"; echo "RUN_ID=$RUN_ID"; echo "DIR=$FEATURE/results/$RUN_ID/playwright/preflight"`、`echo $$ | md5sum 2>/dev/null || uuidgen 2>/dev/null | head -c 8 || date +%s | head -c 8`、md5、md5sum、head、mkdir、重复 mkdir、mktemp、/tmp Write、curl、替代脚本或改写 probe 脚本，也不得继续运行 `pwd`、`echo "test"`、`ls`、`ls workspace/dataAssets/features/2026-04-dq-builtin-reasonability-field-calc-compare/`、`test -d`、`npm ls`、`ls node_modules/