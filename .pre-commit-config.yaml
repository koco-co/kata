minimum_pre_commit_version: 4.3.0

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked --no-sync ruff format --check
        language: system
        files: ^automation/.*\.py$
        types: [python]

      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --no-sync ruff check
        language: system
        files: ^automation/.*\.py$
        types: [python]

      - id: pyright
        name: Pyright strict
        entry: uv run --locked --no-sync pyright
        language: system
        files: ^(automation/.*\.py|pyproject\.toml)$
        pass_filenames: false

      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock|automation/.*/pyproject\.toml)$
        pass_filenames: false

      - id: python-tests
        name: Python automation offline tests
        entry: uv run --locked --no-sync pytest automation/playwright-web-ui/tests automation/playwright-web-ui/suites/data-assets/tests/contract automation/playwright-web-ui/suites/data-assets/tests/unit -q
        language: system
        files: ^(automation/contracts/|automation/playwright-web-ui/(src|tests|suites)/|pyproject\.toml|uv\.lock)
        pass_filenames: false

      - id: control-plane-contracts
        name: Automation control-plane contracts
        entry: bun test tests/cli/executor-registry.test.ts tests/cli/executor-command.test.ts tests/cli/executor-lifecycle.test.ts tests/cli/execution-manifest.test.ts tests/cli/automation-run-layout.test.ts tests/cli/automation-selection.test.ts tests/cli/automation-execution.test.ts tests/cli/automation-verifier.test.ts tests/cli/automation-cli-contract.test.ts
        language: system
        files: ^(automation/.*/executor\.toml|automation/contracts/|cli/commands/(automation|runs)\.ts|cli/lib/automation/(executor-registry|executor-command|executor-lifecycle|execution-manifest|run-layout|automation-selection|automation-execution|automation-handoff|automation-verifier)\.ts|tests/cli/(executor-registry|executor-command|executor-lifecycle|execution-manifest|automation-run-layout|automation-selection|automation-execution|automation-verifier|automation-cli-contract)\.test\.ts)$
        pass_filenames: false
