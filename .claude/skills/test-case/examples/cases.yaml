# cases.yaml 样例（节选改写自真实需求，展示格式而非事实）
# meta: 用例集业务元信息；版本和 feature 身份由所在目录路径推导。
meta:
  title: 单表校验规则支持枚举值个数统计
  requirement_id: "15862"
  case_module_id: ""
  source: https://lanhuapp.com/web/#/item/project/... (需求设计稿链接)
  exports:
    - xmind
cases:
  # case_id 从 C0001 递增；tags 按 模块/页面/功能点 层级写
  - case_id: C0001
    title: 验证新建单表规则时统计函数可选「枚举值个数」并按枚举个数阈值告警
    priority: P0
    automation:
      spec_file: c0001-enum-count-validation.spec.ts
    precondition: |-
      1) 数据质量存在项目 ${ProjectA} 且关联数据源 ${DataSourceA}。
      2) ${DataSourceA} 下存在表 user_profile，建表语句:
         CREATE TABLE user_profile (
           id BIGINT,
           city STRING,
           status INT
         );
    steps:
      - action: 进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」
        expected: 弹出规则创建向导，进入第一步「监控对象」
      - action: |-
          选择监控对象:
          - 数据源: ${DataSourceA}
          - 数据表: user_profile
          点击「下一步」
        expected: 进入第二步「监控规则」，展示校验字段与统计函数配置区
      - action: |-
          添加规则:
          - 校验字段: city
          - 统计函数: 枚举值个数
          - 校验方式: 固定值
          - 比较符: >
          - 阈值: 10
          - 规则强弱: 强规则
        expected: 规则项保存成功，列表展示「city / 枚举值个数 / 固定值 > 10」
      - action: 点击「保存」，返回规则配置列表后点击该规则的「运行」
        expected: |-
          1) 运行成功
          2) 当 city 枚举值个数大于 10 时产生强规则告警，否则结果为正常
    tags:
      - 数据质量
      - 规则配置
      - 统计函数
  - case_id: C0002
    title: 验证「枚举值个数」不支持非字符类型字段时给出提示
    priority: P1
    precondition: 同 C0001。
    steps:
      - action: 进入单表校验规则第二步「监控规则」，校验字段选择 INT 类型的 status
        expected: 统计函数下拉不出现「枚举值个数」；hover 提示「仅支持字符类型字段」
    tags:
      - 数据质量
      - 规则配置
