meta:
  title: 单表校验规则支持枚举值个数统计
  feature_id: quality-single-table-enum-count
  requirement_id: "15862"
  case_module_id: ""
  source: "禅道需求 #15862"
  # test_points_digest: sha256:<完整摘要>  （存在 cases/test-points.md 时必填）
  # imports: 历史输入文件名                  （存在真实历史输入时声明）
  # exports: 单表校验规则支持枚举值个数统计.xmind  （需要显式派生产物时声明）
  # layout: requirements                     （聚合多个需求时声明）
cases:
  - case_id: C0001
    title: 验证【规则库配置】-【新建监控规则】配置枚举值个数强规则并运行，触发强规则告警
    source_ref: TP-002
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0001 (
           id BIGINT,
           city STRING,
           status INT
         );
         INSERT INTO ${SchemaA}.test_table_15862_c0001 VALUES
           (1, 'beijing', 1),
           (2, 'shanghai', 2);
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「单表校验规则」
        expected: 打开「单表校验规则」创建向导并进入「监控对象」步骤
      - action: |-
          配置监控对象：
          数据源：${DataSourceA}
          数据库：${SchemaA}
          数据表：test_table_15862_c0001
          规则描述: 
          点击「下一步」
        expected: 进入「监控规则」步骤并展示校验字段与统计函数配置区
      - action: |-
          配置监控规则：
          校验字段：city
          统计函数：枚举值个数
          校验方法：固定值
          比较符：>
          期望值：1
          强弱规则：强规则
        expected: 规则项展示「city / 枚举值个数 / 固定值 > 1 / 强规则」
      - action: 点击「保存」
        expected: Toast提示:「保存成功」,列表新增该规则且状态为「启用」
      - action: 点击该规则「运行」
        expected: |-
          1) 运行状态：「成功」
          2) 告警类型：「强规则告警」
    tags:
      - 数据质量
      - 规则库配置
    # automation 合同只由 automation Skill 按真实 executor 实现维护；不得从文件存在推导 active
