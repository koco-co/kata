# cases.yaml 样例（节选改写自真实需求，展示格式而非事实）
# meta: 用例集业务元信息；版本和 feature 身份由所在目录路径推导。
meta:
  title: 单表校验规则支持枚举值个数统计
  requirement_id: "15862"
  case_module_id: ""
  test_points_digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  source: https://lanhuapp.com/web/#/item/project/... (需求设计稿链接)
  exports:
    - 需求名.xmind
cases:
  # case_id 从 C0001 递增；tags 按 模块/页面/功能点 层级写
  - case_id: C0001
    title: 验证新建单表规则时统计函数可选「枚举值个数」并按枚举个数阈值告警
    source_ref: TP-001
    priority: P0
    precondition: |-
      1) 数据质量存在项目 ${ProjectA} 且关联数据源 ${DataSourceA}。
      2) 在 ${DataSourceA} 中执行以下 SQL，创建包含两个不同 city 值的 user_profile:
         CREATE TABLE user_profile (
           id BIGINT,
           city STRING,
           status INT
         );
         INSERT INTO user_profile VALUES
           (1, 'beijing', 1),
           (2, 'shanghai', 1);
    steps:
      - action: 进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」
        expected: 弹出规则创建向导，进入第一步「监控对象」
      - action: |-
          选择监控对象:
          - 数据源: ${DataSourceA}
          - 数据表: user_profile
          点击「下一步」
        expected: 进入第二步「监控规则」，展示校验字段与统计函数配置区
      - action: |-
          添加规则:
          - 校验字段: city
          - 统计函数: 枚举值个数
          - 校验方式: 固定值
          - 比较符: >
          - 阈值: 1
          - 规则强弱: 强规则
        expected: 规则项保存成功，列表展示「city / 枚举值个数 / 固定值 > 1」
      - action: 点击「保存」，返回规则配置列表后点击该规则的「运行」
        expected: |-
          1) 运行成功
          2) city 有 2 个枚举值，大于阈值 1，运行结果产生强规则告警
    tags:
      - 数据质量
      - 规则配置
      - 统计函数
  - case_id: C0002
    title: 验证「枚举值个数」不支持非字符类型字段时给出提示
    source_ref: TP-002
    priority: P1
    precondition: |-
      1) 数据质量存在项目 ${ProjectA} 且关联数据源 ${DataSourceA}。
      2) ${DataSourceA} 下存在表 user_profile，其中 status 字段类型为 INT。
    steps:
      - action: 进入单表校验规则第二步「监控规则」，校验字段选择 INT 类型的 status
        expected: 统计函数下拉不出现「枚举值个数」；hover 提示「仅支持字符类型字段」
    tags:
      - 数据质量
      - 规则配置
