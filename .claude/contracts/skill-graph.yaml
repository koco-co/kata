skills:
  bug-file:
    user_entry: /bug-file
    consumes: [bug-evidence, screenshots, logs, reproduction-steps]
    produces: [bug-report, source-refs]
    related: [case-hotfix, diff-scan, knowledge-curate]
  case-draft:
    user_entry: /case-draft
    consumes: [prd-source, lanhu-source, axure-source, user-input]
    produces: [archive-md, xmind, metadata, manifest, source-refs]
    related: [case-edit, playwright-automation, knowledge-curate]
  case-edit:
    user_entry: /case-edit
    consumes: [archive-md, xmind, csv, correction-request]
    produces: [updated-archive-md, updated-xmind, edit-summary]
    related: [case-draft, case-hotfix, playwright-automation]
  case-hotfix:
    user_entry: /case-hotfix
    consumes: [bug-record, fix-summary, zentao-record]
    produces: [hotfix-regression-cases, archive-md, source-refs]
    related: [bug-file, case-edit, diff-scan]
  conflict-analyze:
    user_entry: /conflict-analyze
    consumes: [conflict-markers, branch-diff, file-context]
    produces: [conflict-analysis, resolution-plan]
    related: [diff-scan, workspace-manage]
  diff-scan:
    user_entry: /diff-scan
    consumes: [git-diff, branch-changes, changed-files]
    produces: [defect-findings, reproduction-notes, source-refs]
    related: [bug-file, conflict-analyze, case-hotfix]
  infra-diagnose:
    user_entry: /infra-diagnose
    consumes: [environment-symptom, server-access, datasource-config]
    produces: [diagnosis-report, remediation-notes, operational-knowledge]
    related: [knowledge-curate, workspace-manage]
  knowledge-curate:
    user_entry: /knowledge-curate
    consumes: [business-rule, project-term, module-fact]
    produces: [knowledge-entry, updated-index, source-refs]
    related: [case-draft, case-hotfix, infra-diagnose]
  playwright-automation:
    user_entry: /playwright-automation
    consumes: [test-intent, web-target, acceptance-criteria]
    produces: [playwright-tests, automation-handoff, run-evidence]
    related: [case-draft, case-edit, playwright-cli]
  playwright-cli:
    user_entry: /playwright-cli
    consumes: [browser-target, playwright-command, inspection-request]
    produces: [browser-observation, screenshot, trace-output]
    related: [playwright-automation]
  workspace-manage:
    user_entry: /workspace-manage
    consumes: [workspace-request, project-config, command-help-request]
    produces: [workspace-status, setup-actions, command-menu]
    related: [infra-diagnose, conflict-analyze]
