# spec §6.7 case-edit phases: §1-parse / §2-diff / §3-apply（合并 spec-review 进 review gate）。
# v2 schema 由 engine/src/skills/workflow-schema.ts 校验。
name: case-edit
version: 2
default_dispatch: inline
default_model: sonnet
default_effort: high

metadata:
  event_kinds_emitted:
    - phase_entered
    - phase_exited
    - decision_made
    - artifact_written
    - validator_failed
    - blocked
    - handoff_emitted
  artifact_kinds_produced:
    - archive
    - xmind

steps:
  - id: parse
    dispatch: inline
    blackboard_inputs: [user_input]
    blackboard_outputs: [source_refs, atoms]
    failure_modes: [unsupported_format]

  - id: diff
    dispatch: subagent
    model: sonnet
    effort: high
    workers: [edit-worker]
    blackboard_inputs: [atoms]
    blackboard_outputs: [draft_archive]
    failure_modes: [worker_timeout]

  - id: spec-review
    dispatch: subagent
    model: haiku
    effort: low
    reviewers: [spec-reviewer]
    blackboard_inputs: [draft_archive]
    blackboard_outputs: [spec_verdict, spec_violations]
    validators: [archive-schema]
    failure_modes: [verdict_invalid]

  - id: apply
    dispatch: inline
    blackboard_inputs: [draft_archive, spec_verdict]
    blackboard_outputs: [archive_path, xmind_path]
    validators: [archive-format, xmind-mapping]
    failure_modes: [io_error]
