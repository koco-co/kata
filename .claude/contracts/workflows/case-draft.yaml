# spec §6.8 终稿；v2 schema 由 engine/src/skills/workflow-schema.ts 校验。
name: case-draft
version: 2
default_dispatch: inline
default_model: sonnet
default_effort: high

metadata:
  event_kinds_emitted:
    - phase_entered
    - phase_exited
    - decision_made
    - artifact_written
    - validator_failed
    - blocked
    - handoff_emitted
  artifact_kinds_produced:
    - archive
    - xmind
    - manifest

steps:
  - id: source-intake
    dispatch: inline
    blackboard_inputs: [user_input]
    blackboard_outputs: [source_refs]
    failure_modes: [missing_source]

  - id: case-draft
    dispatch: subagent
    model: sonnet
    effort: high
    workers: [case-worker]
    blackboard_inputs: [source_refs]
    blackboard_outputs: [draft_archive]
    failure_modes: [worker_timeout]

  - id: spec-review
    dispatch: subagent
    model: haiku
    effort: low
    reviewers: [spec-reviewer]
    blackboard_inputs: [draft_archive]
    blackboard_outputs: [spec_verdict, spec_violations]
    validators: [archive-schema]
    failure_modes: [verdict_invalid]

  - id: quality-review
    dispatch: subagent
    model: haiku
    effort: low
    reviewers: [quality-reviewer]
    blackboard_inputs: [draft_archive, spec_verdict]
    blackboard_outputs: [quality_verdict, quality_violations]
    failure_modes: [verdict_invalid]

  - id: output
    dispatch: inline
    blackboard_inputs: [draft_archive, spec_verdict, quality_verdict]
    blackboard_outputs: [archive_path, xmind_path, manifest_path]
    validators: [archive-format, xmind-mapping]
    failure_modes: [io_error]
