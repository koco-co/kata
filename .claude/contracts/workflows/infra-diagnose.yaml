# spec §6.7 infra-diagnose phases: §1-probe / §2-diagnose / §3-remediate / §4-kb-write
# spec §6.11：default sonnet，单流程无 review。本 workflow 全部 inline。
# v2 schema 由 engine/src/skills/workflow-schema.ts 校验。
name: infra-diagnose
version: 2
default_dispatch: inline
default_model: sonnet
default_effort: high

metadata:
  event_kinds_emitted:
    - phase_entered
    - phase_exited
    - artifact_written
    - validator_failed
    - blocked
    - handoff_emitted
  artifact_kinds_produced:
    - diagnosis
    - remediation_plan
    - knowledge_entry

steps:
  - id: probe
    dispatch: inline
    blackboard_inputs: [user_input]
    blackboard_outputs: [probe_result]
    failure_modes: [probe_failed]

  - id: diagnose
    dispatch: inline
    blackboard_inputs: [probe_result]
    blackboard_outputs: [diagnosis]
    failure_modes: [diagnosis_inconclusive]

  - id: remediate
    dispatch: inline
    blackboard_inputs: [diagnosis]
    blackboard_outputs: [remediation_plan]
    failure_modes: [remediation_blocked]

  - id: kb-write
    dispatch: inline
    blackboard_inputs: [diagnosis, remediation_plan]
    blackboard_outputs: [knowledge_entry_path]
    validators: [knowledge-entry-schema]
    failure_modes: [io_error]
