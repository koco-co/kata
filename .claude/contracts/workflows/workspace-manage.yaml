# spec §6.7 workspace-manage phases: §1-inspect / §2-render
# spec §6.11：default haiku（catalog 操作）。
# v2 schema 由 engine/src/skills/workflow-schema.ts 校验。
name: workspace-manage
version: 2
default_dispatch: inline
default_model: haiku
default_effort: low

metadata:
  event_kinds_emitted:
    - phase_entered
    - phase_exited
    - artifact_written
    - handoff_emitted
  artifact_kinds_produced:
    - workspace_state

steps:
  - id: inspect
    dispatch: inline
    blackboard_inputs: [workspace_request]
    blackboard_outputs: [workspace_state]
    failure_modes: [workspace_missing]

  - id: render
    dispatch: inline
    blackboard_inputs: [workspace_state]
    blackboard_outputs: []
    failure_modes: [io_error]
