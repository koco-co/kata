# spec §6.10 playwright-automation per-phase model：7 phases。
# v2 schema 由 engine/src/skills/workflow-schema.ts 校验。
name: playwright-automation
version: 2
default_dispatch: inline
default_model: sonnet
default_effort: high

metadata:
  event_kinds_emitted:
    - phase_entered
    - phase_exited
    - decision_made
    - artifact_written
    - validator_failed
    - blocked
    - handoff_emitted
  artifact_kinds_produced:
    - playwright_tests
    - run_handoff

steps:
  - id: preflight
    dispatch: inline
    blackboard_inputs: [user_input]
    blackboard_outputs: [env_profile]
    failure_modes: [env_profile_missing]

  - id: probe
    dispatch: inline
    blackboard_inputs: [env_profile, qa_cases]
    blackboard_outputs: [ui_evidence, source_refs]
    failure_modes: [probe_failed]

  - id: generate
    dispatch: subagent
    model: sonnet
    effort: high
    workers: [playwright-worker]
    blackboard_inputs: [qa_cases, ui_evidence, source_refs]
    blackboard_outputs: [playwright_tests]
    failure_modes: [worker_timeout]

  - id: run
    dispatch: inline
    blackboard_inputs: [playwright_tests, env_profile]
    blackboard_outputs: [run_handoff]
    failure_modes: [run_failed]

  - id: repair
    dispatch: subagent
    model: sonnet
    effort: high
    workers: [playwright-worker]
    blackboard_inputs: [playwright_tests, run_handoff, ui_evidence]
    blackboard_outputs: [playwright_tests]
    failure_modes: [repair_limit_reached]

  - id: quality
    dispatch: subagent
    model: haiku
    effort: low
    reviewers: [quality-reviewer]
    blackboard_inputs: [playwright_tests, run_handoff]
    blackboard_outputs: [quality_verdict, quality_violations]
    failure_modes: [verdict_invalid]

  - id: handoff
    dispatch: inline
    blackboard_inputs: [playwright_tests, run_handoff, quality_verdict]
    blackboard_outputs: [run_handoff]
    failure_modes: [io_error]
