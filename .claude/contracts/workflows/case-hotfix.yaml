# spec §6.7 case-hotfix phases: §1-bug-parse / §2-scope / §3-draft / §4-output
# 加 spec-review 子步对应 §6.11 hotfix spec-review: haiku 覆写。
# v2 schema 由 engine/src/skills/workflow-schema.ts 校验。
name: case-hotfix
version: 2
default_dispatch: inline
default_model: sonnet
default_effort: high

metadata:
  event_kinds_emitted:
    - phase_entered
    - phase_exited
    - decision_made
    - artifact_written
    - validator_failed
    - blocked
    - handoff_emitted
  artifact_kinds_produced:
    - archive
    - xmind

steps:
  - id: bug-parse
    dispatch: inline
    blackboard_inputs: [user_input]
    blackboard_outputs: [bug_record, source_refs]
    failure_modes: [bug_record_missing]

  - id: scope
    dispatch: inline
    blackboard_inputs: [bug_record, source_refs]
    blackboard_outputs: [fix_scope]
    failure_modes: [fix_scope_missing]

  - id: draft
    dispatch: subagent
    model: sonnet
    effort: high
    workers: [hotfix-worker]
    blackboard_inputs: [bug_record, fix_scope, source_refs]
    blackboard_outputs: [draft_archive]
    failure_modes: [worker_timeout]

  - id: spec-review
    dispatch: subagent
    model: haiku
    effort: low
    reviewers: [spec-reviewer]
    blackboard_inputs: [draft_archive]
    blackboard_outputs: [spec_verdict, spec_violations]
    validators: [archive-schema]
    failure_modes: [verdict_invalid]

  - id: output
    dispatch: inline
    blackboard_inputs: [draft_archive, spec_verdict]
    blackboard_outputs: [archive_path, hotfix_archive_path]
    validators: [archive-format]
    failure_modes: [io_error]
