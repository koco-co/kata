name: case-hotfix
version: 1
entry: /case-hotfix
description: 根据 bug、issue、ZenTao 记录或修复说明生成 hotfix 回归用例；本 yaml 是该 workflow 的唯一规范源。
steps:
  - id: bug-intake
    next: [fix-scope]
    blackboard_inputs: []
    blackboard_outputs: [sources, source_refs]
    references:
      - .claude/skills/case-hotfix/SKILL.md
      - .agents/skills/case-hotfix/SKILL.md
    failure_modes:
      - BUG_RECORD_MISSING
    human_gates:
      - ASK_FOR_BUG_RECORD
    verification: [bug_record_source_ref_recorded]
  - id: fix-scope
    next: [draft_cases]
    blackboard_inputs: [sources, source_refs]
    blackboard_outputs: [decisions, open_questions]
    references:
      - references/hotfix-archive-format.md
    failure_modes:
      - FIX_SCOPE_MISSING
      - BUG_NOT_FIXED
    human_gates:
      - ASK_FOR_FIX_SCOPE
    verification: [fix_scope_or_pending_items_recorded]
  - id: draft_cases
    next: [review_cases]
    blackboard_inputs: [sources, source_refs, decisions]
    blackboard_outputs: [artifacts, coverage]
    references:
      - references/hotfix-archive-format.md
      - .claude/contracts/output-artifacts.md
    failure_modes:
      - HOTFIX_ARCHIVE_FORMAT_INVALID
    human_gates: []
    verification: [single_hotfix_case_covers_fix_path]
  - id: review_cases
    next: [output]
    blackboard_inputs: [artifacts, coverage]
    blackboard_outputs: [verification, open_questions]
    references:
      - references/hotfix-archive-format.md
    failure_modes:
      - HOTFIX_SCOPE_OVEREXPANDED
      - SOURCE_REF_LEAKED_TO_ARCHIVE
    human_gates: []
    verification: [hotfix_hard_rules_checked]
  - id: output
    blackboard_inputs: [artifacts, verification]
    blackboard_outputs: [handoff]
    references:
      - .claude/contracts/output-artifacts.md
    failure_modes:
      - OUTPUT_QA_FAILED
    human_gates: []
    verification: [hotfix_archive_and_sidecars_verified]
