meta:
  title: 【gate】同步任务restful源端优化
  version: v6.3.7
  feature_id: v6.3.7/【v637】【gate】【离线开发】同步任务restful源端优化
  case_module_id: "8885"
  imports:
    - 202506-离线开发v6.3.7.xmind
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证「数据开发-周期任务」「数据来源-Path」显示&交互正确
    priority: P0
    steps:
      - action: 进入【离线开发-数据开发-周期任务】页面，新建数据同步任务，【数据来源】步骤“数据源”选择restful数据源，查看页面显示
        expected: |-
          1） “数据源”下方新增字段：Path
          2） 「Path」置灰提示：请填写后端服务路径
      - action: 「Path」输入少于2个字符
        expected: 输入框下方红字提示：“路径长度请限制在2-200个字符”
      - action: 「Path」输入大于200个字符
        expected: 输入框下方红字提示：“路径长度请限制在2-200个字符”
      - action: 「Path」输入2-200个字符，包含非法字符（除/、英文、数字、下划线、连字符外的字符）
        expected: 输入框下方红字提示：“只能 / 开头，支持英文，数字，下划线，连字符(-)”
      - action: 「Path」输入2-200个合法字符但不以/开头
        expected: 输入框下方红字提示：“只能 / 开头，支持英文，数字，下划线，连字符(-)”
      - action: 「Path」输入2-200个合法字符且以/开头
        expected: 输入框正常回显已输入内容
  - case_id: C0002
    title: 验证「数据开发-周期任务」数据同步功能正常_restful2other_post_数据源url未配置path
    priority: P0
    precondition: 数据源中心已创建restful数据源（可来源于api）：数据源的请求方式为post，URL未包含path，例如：http://172.16.115.247:81
    steps:
      - action: 进入【离线开发-数据开发-周期任务】页面，新建数据同步任务A，【数据来源】步骤“数据源”选择restful数据源，“Path”为空，其余内容正常填写，保存并临时运行
        expected: |-
          1） 数据同步任务A保存成功
          2） 临时运行失败
      - action: 提交并补数据运行数据同步任务A
        expected: |-
          1） 数据同步任务A提交成功
          2） 补数据运行失败
      - action: 进入【离线开发-数据开发-周期任务】页面，新建数据同步任务B，【数据来源】步骤“数据源”选择restful数据源，“Path”配置对应的后端服务路径（例如：/api/gateway/test/mt_test/wytest_0409_default），其余内容正常填写，保存并临时运行
        expected: |-
          1） 数据同步任务B保存成功
          2） 临时运行成功，数据均正常写入目标数据源中
      - action: 提交并补数据运行数据同步任务B
        expected: |-
          1） 数据同步任务B保存成功
          2） 补数据运行成功，数据均正常写入目标数据源中
  - case_id: C0003
    title: 验证「数据开发-周期任务」数据同步功能正常_restful2other_post_数据源url已配置path
    priority: P0
    precondition: 数据源中心已创建restful数据源（可来源于api）：数据源的请求方式为post，URL已包含path，例如：http://172.16.115.247:81/api/gateway/test/mt_test/wytest_0409_default
    steps:
      - action: 进入【离线开发-数据开发-周期任务】页面，新建数据同步任务A，【数据来源】步骤“数据源”选择restful数据源，“Path”为空，其余内容正常填写，保存并临时运行
        expected: |-
          1） 数据同步任务A保存成功
          2） 临时运行成功，数据均正常写入目标数据源中（数据来源为数据源中心所配置的url对应的接口）
      - action: 提交并补数据运行数据同步任务A
        expected: |-
          1） 数据同步任务A提交成功
          2） 补数据运行成功，数据均正常写入目标数据源中（数据来源为数据源中心所配置的url对应的接口）
      - action: 进入【离线开发-数据开发-周期任务】页面，新建数据同步任务B，【数据来源】步骤“数据源”选择restful数据源，“Path”配置对应的后端服务路径（与数据源中心的path不一致，例如：/api/gateway/test/mt_test/wytest_0409_default），其余内容正常填写，保存并临时运行
        expected: |-
          1） 数据同步任务B保存成功
          2） 临时运行失败
      - action: 提交并补数据运行数据同步任务B
        expected: |-
          1） 数据同步任务B保存成功
          2） 补数据运行失败
