meta:
  requirement_id: none
  title: 【gate】对接资产数据脱敏
  feature_id: offline-asset-masking-integration
  project_id: batch-works
  case_module_id: "8884"
  imports:
    - 202506-离线开发v6.3.7.xmind
  exports:
    - 对接资产数据脱敏.xmind
cases:
  - case_id: C0001
    title: 验证【数据安全】-【脱敏管理】开启离线脱敏配置项，页面展示已开启应用资产数据脱敏提示
    priority: P2
    precondition: 无
    steps:
      - action: 进入【数据安全 → 脱敏管理】页面
        expected: 进入成功
      - action: 开启离线脱敏配置项, 检查「脱敏管理」页面内容
        expected: "提示: 已开启应用资产数据脱敏, 当前数据脱敏只取自资产内所配的规则"
      - action: 关闭离线脱敏配置项, 检查「脱敏管理」页面内容
        expected: 「脱敏管理」页面展示配置项为关闭状态，不展示脱敏规则生效提示
    tags: [数据安全, 脱敏管理]
  - case_id: C0002
    title: 验证【数据开发】-【周期任务】Doris跨集群查询配置部分覆盖规则，字段phone脱敏且切换数据源报错
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}

      2) 数据源类型：Doris

      3) 存在数据库：${SchemaA}

      4) 数据资产-脱敏规则A: 将从第「1」位至第「7」位替换为：「*」


      5) 离线开发-脱敏规则B: 算法脱敏


      6) 建表语句：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002 ( id INT, asset_id VARCHAR(20), user_name VARCHAR(50), id_card VARCHAR(20), phone VARCHAR(15), email VARCHAR(50), amount DECIMAL(15,2), create_time DATETIME DEFAULT CURRENT_TIMESTAMP ) ENGINE=OLAP DUPLICATE KEY(id) DISTRIBUTED BY HASH(id) BUCKETS 4 PROPERTIES ( "replication_num" = "1" );
         INSERT INTO ${SchemaA}.test_table_none_c0002 (id, asset_id, user_name, id_card, phone, email, amount) VALUES (1, 'A1001', '张三', '110105199001011234', '13800138000', 'zhangsan@example.com', 150000.00), (2, 'A1002', '李四', '310115198502029876', '13912345678', 'lisi@company.org', 987654.32), (3, 'A1003', '王五', '440305200010103333', '13755556666', 'wangwu@test.net', 50000.50), (4, 'A1004', '赵六', '510124197712128888', '18600001111', 'zhaoliu@demo.com', 1234567.89);
         SELECT * FROM ${SchemaA}.test_table_none_c0002;

      7) 已开启离线脱敏配置项
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建Doris任务A, 执行SQL语句
        expected: 正常查询出SQL结果, 数据未进行脱敏处理
      - action: |-
          重新进入Doris任务A, 执行SELECT * FROM test_table_none_c0002;
        expected: |-
          1) 「select结果预览」和下载后的文件中的字段phone前7位替换为「*」, 仅显示后4位
          2) 「表查询-数据预览」中的字段phone前7位替换为「*」, 仅显示后4位
          3) 「数据同步-数据预览」中的字段phone前7位替换为「*」, 仅显示后4位
      - action: 进入「周期任务-基础属性」, 切换Doris数据源, 重新进入Doris任务A, 执行SELECT * FROM test_table_none_c0002;
        expected: 报错, 当前数据源下没有对应的test_table_none_c0002表
    tags: [数据开发, 周期任务, 数据脱敏]
  - case_id: C0003
    title: 验证【数据开发】-【周期任务】Doris查询配置全部覆盖规则，查询预览与下载文件字段A全部脱敏
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}

      2) 数据源类型：Doris

      3) 存在数据库：${SchemaA}

      4) 已开启离线脱敏配置项


      5) 建表语句：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 ( id INT, asset_id VARCHAR(20), user_name VARCHAR(50), id_card VARCHAR(20), phone VARCHAR(15), email VARCHAR(50), amount DECIMAL(15,2), create_time DATETIME DEFAULT CURRENT_TIMESTAMP ) ENGINE=OLAP DUPLICATE KEY(id) DISTRIBUTED BY HASH(id) BUCKETS 4 PROPERTIES ( "replication_num" = "1" );
         INSERT INTO ${SchemaA}.test_table_none_c0003 (id, asset_id, user_name, id_card, phone, email, amount) VALUES (1, 'A1001', '张三', '110105199001011234', '13800138000', 'zhangsan@example.com', 150000.00), (2, 'A1002', '李四', '310115198502029876', '13912345678', 'lisi@company.org', 987654.32), (3, 'A1003', '王五', '440305200010103333', '13755556666', 'wangwu@test.net', 50000.50), (4, 'A1004', '赵六', '510124197712128888', '18600001111', 'zhaoliu@demo.com', 1234567.89);

      6) 简单查询「任务A」：
         SELECT * FROM ${SchemaA}.test_table_none_c0003;

      7) 复杂查询「任务B」：
         SELECT * FROM ${SchemaA}.test_table_none_c0003 where 1=1;

      8) 自定义jar资源包及使用方法 https://dtstack.yuque.com/rd-center/wict2z/end0mqgnq3wevx3p


      9) 自定义函数查询「任务C」：
         SELECT *, addStr("test") FROM ${SchemaA}.test_table_none_c0003;
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 使用admin账号, 进入「项目管理-创建项目」, 新建一个「初始化方式」为「创建」的Doris项目.
        expected: 创建成功
      - action: 新建Doris任务A, 执行简单查询「任务A」
        expected: 正常查询出SQL结果, 数据未进行脱敏处理
      - action: 在「数据资产-数据安全」中添加「全部覆盖」规则, 并添加test_table_none_c0003脱敏表及字段A, 默认选项不变
        expected: 添加成功
      - action: 重新进入Doris任务A, 执行简单查询「任务A」
        expected: 「select结果预览」和下载后的文件中的字段A全部进行脱敏处理
      - action: 重新进入Doris任务A, 执行复杂查询「任务B」
        expected: 「select结果预览」和下载后的文件中的字段A全部进行脱敏处理
      - action: 在资源管理中添加jar包, 然后在函数管理中添加「自定义函数」 , 重新进入Doris任务A, 执行查询「任务C」
        expected: |-
          1) 自定义函数正常解析并执行
          2) 「select结果预览」和下载后的文件中的字段A全部进行脱敏处理
      - action: 进入「数据开发-表查询-Doris」, 点击test_table_none_c0003表, 查看「数据预览」内容
        expected: 「表查询-数据预览」中的字段A全部进行脱敏处理
      - action: 进入「数据开发-周期任务」, 新建「数据同步」任务, 数据来源选择test_table_none_c0003表, 点击「数据预览」, 查看「数据预览」内容
        expected: 「数据同步-数据预览」中的字段A全部进行脱敏处理
      - action: |-
          进入Doris任务A, 执行简单查询「任务A」, 查看「Select结果预览」、「表查询-数据预览」、「数据同步-数据预览」内容
        expected: |-
          1) 「select结果预览」和下载后的文件中的字段A全部进行脱敏处理
          2) 「表查询-数据预览」中的字段A全部进行脱敏处理
          3） 「数据同步-数据预览」中的字段A未进行脱敏处理
    tags: [数据开发, 周期任务, 数据脱敏]
