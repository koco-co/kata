  - case_id: C0005
    title: 验证【数据开发】-【周期任务】Doris查询配置转义脱敏规则，assetId与email字段字符按规则替换
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}

      2) 数据源类型：Doris

      3) 存在数据库：${SchemaA}

      4) 脱敏规则A: A -> B @ -> @@@


      5) 建表语句：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005 ( id INT, asset_id VARCHAR(20), user_name VARCHAR(50), id_card VARCHAR(20), phone VARCHAR(15), email VARCHAR(50), amount DECIMAL(15,2), create_time DATETIME DEFAULT CURRENT_TIMESTAMP ) ENGINE=OLAP DUPLICATE KEY(id) DISTRIBUTED BY HASH(id) BUCKETS 4 PROPERTIES ( "replication_num" = "1" );
         INSERT INTO ${SchemaA}.test_table_none_c0005 (id, asset_id, user_name, id_card, phone, email, amount) VALUES (1, 'A1001', '张三', '110105199001011234', '13800138000', 'zhangsan@example.com', 150000.00), (2, 'A1002', '李四', '310115198502029876', '13912345678', 'lisi@company.org', 987654.32), (3, 'A1003', '王五', '440305200010103333', '13755556666', 'wangwu@test.net', 50000.50), (4, 'A1004', '赵六', '510124197712128888', '18600001111', 'zhaoliu@demo.com', 1234567.89);
         SELECT * FROM ${SchemaA}.test_table_none_c0005;

      6) 已开启离线脱敏配置项


      7) 简单查询「任务A」：
         SELECT * FROM ${SchemaA}.test_table_none_c0005;

      8) 复杂查询「任务B」：
         SELECT id, asset_id, user_name, id_card, phone, amount, email, phone_prefix, total_users_in_prefix, total_amount_in_prefix, RANK() OVER (PARTITION BY phone_prefix ORDER BY amount DESC) AS rank_in_prefix FROM ( SELECT id, asset_id, user_name, id_card, phone, amount, email, SUBSTRING(phone, 1, 3) AS phone_prefix, COUNT(id) OVER (PARTITION BY SUBSTRING(phone, 1, 3)) AS total_users_in_prefix, SUM(amount) OVER (PARTITION BY SUBSTRING(phone, 1, 3)) AS total_amount_in_prefix FROM ${SchemaA}.test_table_none_c0005 WHERE amount > 100000 ) t ORDER BY phone_prefix, rank_in_prefix;

      9) 自定义jar资源包及使用方法 https://dtstack.yuque.com/rd-center/wict2z/end0mqgnq3wevx3p

      10) 自定义函数查询「任务C」：
         SELECT *, addStr("test") FROM ${SchemaA}.test_table_none_c0005;
