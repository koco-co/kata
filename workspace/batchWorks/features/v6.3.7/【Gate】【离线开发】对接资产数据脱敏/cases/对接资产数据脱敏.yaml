  - case_id: C0032
    title: 验证【数据开发】-【临时查询】Hive查询配置冲突脱敏规则，资产规则优先且关闭配置项后离线规则生效
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}

      2) 数据源类型：Hive

      3) 存在数据库：${SchemaA}

      4) 数据资产-脱敏规则A: 将从第「1」位至第「7」位替换为：「*」


      5) 离线开发-脱敏规则B: 算法脱敏


      6) 建表语句：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0032;
         -- 创建资产数据表（Hive格式）
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0032 (
         id INT,
         asset_id STRING COMMENT '资产ID',
         user_name STRING COMMENT '用户姓名',
         id_card STRING COMMENT '身份证号',
         phone STRING COMMENT '手机号',
         email STRING COMMENT '邮箱',
         amount DECIMAL(15,2) COMMENT '资产金额',
         create_time TIMESTAMP
         ) COMMENT '资产信息表'
         ROW FORMAT DELIMITED
         FIELDS TERMINATED BY '\t'
         STORED AS TEXTFILE;
         INSERT INTO ${SchemaA}.test_table_none_c0032 VALUES
         (1, 'A1001', '张三', '110105199001011234', '13800138000', 'zhangsan@example.com', 150000.00, '2023-01-01 10:00:00'),
         (2, 'A1002', '李四', '310115198502029876', '13912345678', 'lisi@company.org', 987654.32, '2023-01-01 10:05:00'),
         (3, 'A1003', '王五', '440305200010103333', '13755556666', 'wangwu@test.net', 50000.50, '2023-01-01 10:10:00'),
         (4, 'A1004', '赵六', '510124197712128888', '18600001111', 'zhaoliu@demo.com', 1234567.89, '2023-01-01 10:15:00');
         SELECT * FROM ${SchemaA}.test_table_none_c0032;

      7) 已开启离线脱敏配置项
    steps:
      - action: 进入【数据开发 → 临时查询】页面
        expected: 进入成功
      - action: 新建hive任务A , 执行SQL语句
        expected: 正常查询出SQL结果, 数据未进行脱敏处理
      - action: |-
          然后进入hive任务A, 执行SELECT * FROM test_table_none_c0032;
        expected: |-
          1) 「select结果预览」和下载后的文件中的字段phone不脱敏
          2) 「表查询-数据预览」中的字段phone 不脱敏
          3) 「数据同步-数据预览」中的字段phone不脱敏
      - action: |-
