meta:
  title: 【标品】redux优化测试
  case_module_id: "8888"
  imports:
    - 202506-离线开发v6.3.7.xmind
  exports:
    - redux优化测试.xmind
cases:
  - case_id: C0001
    title: 验证【数据源管理】-【整库同步】展开数据同步目标下拉框，选项名称、类型和可用状态与数据源管理列表一致
    priority: P2
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 授权数据源 B：${DataSourceB}
      4) 数据源 B 类型：Hive2.x
      5) ${DataSourceA}、${DataSourceB} 在数据源管理列表中的状态均为「可用」
    steps:
      - action: 进入【离线开发 → 数据源管理 → 整库同步】页面
        expected: 进入成功
      - action: 点击「数据同步目标」下拉框
        expected: 下拉选项包含 ${DataSourceA}、${DataSourceB}，名称、类型和可用状态与数据源管理列表一致
    tags: ["离线开发", "数据源管理", "整库同步"]

  - case_id: C0002
    title: 验证【数据开发】-【批量操作】展开数据源下拉框，选项名称、类型和可用状态与数据源管理列表一致
    priority: P2
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 授权数据源 B：${DataSourceB}
      4) 数据源 B 类型：Hive2.x
      5) ${DataSourceA}、${DataSourceB} 在数据源管理列表中的状态均为「可用」
    steps:
      - action: 进入【离线开发 → 数据开发 → 批量操作】页面
        expected: 进入成功
      - action: 点击「数据源」下拉框
        expected: 下拉选项包含 ${DataSourceA}、${DataSourceB}，名称、类型和可用状态与数据源管理列表一致
    tags: ["离线开发", "数据开发", "批量操作"]

  - case_id: C0003
    title: 验证【数据开发】-【数据同步】向导模式新建任务，来源与目标数据源下拉框仅列出对应类型数据源
    priority: P2
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 授权数据源 B：${DataSourceB}
      4) 数据源 B 类型：Hive2.x
      5) ${DataSourceA}、${DataSourceB} 在数据源管理列表中的状态均为「可用」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          新建数据同步周期任务：
          任务名称：TaskB
          配置模式：向导模式
        expected: 打开数据同步任务编辑器并展示来源、目标配置区
      - action: 来源类型选择「MySQL」并展开「数据源」下拉框
        expected: 来源数据源下拉选项包含 ${DataSourceA} 且不包含类型为 Hive2.x 的 ${DataSourceB}
      - action: 目标类型选择「Hive」并展开「数据源」下拉框
        expected: 目标数据源下拉选项包含 ${DataSourceB} 且不包含类型为 MySQL 的 ${DataSourceA}
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0004
    title: 验证【数据开发】-【数据同步】脚本模式导入模板，来源与目标数据源下拉框仅列出对应类型数据源
    priority: P2
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 授权数据源 B：${DataSourceB}
      4) 数据源 B 类型：Hive2.x
      5) ${DataSourceA}、${DataSourceB} 在数据源管理列表中的状态均为「可用」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          新建数据同步周期任务：
          任务名称：TaskA
          配置模式：脚本模式
        expected: 打开脚本模式数据同步任务编辑器并展示「导入模板」按钮
      - action: 点击「导入模板」
        expected: 打开「导入模板」弹窗并展示来源类型、来源数据源、目标类型、目标数据源四个字段
      - action: 来源类型选择「MySQL」并展开来源数据源下拉框
        expected: 来源数据源下拉选项包含 ${DataSourceA} 且不包含 ${DataSourceB}
      - action: 目标类型选择「Hive」并展开目标数据源下拉框
        expected: 目标数据源下拉选项包含 ${DataSourceB} 且不包含 ${DataSourceA}
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0005
    title: 验证【数据开发】-【FileCopy】打开任务并展开数据源下拉框，选项名称和可用状态与数据源管理列表一致
    priority: P2
    precondition: |-
      1) 数据源管理列表存在名称为「redux_file_source」且状态为「可用」的记录
      2) 存在名称为「redux_filecopy_c0005」的FileCopy周期任务
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 打开 redux_filecopy_c0005 并展开「数据源」下拉框
        expected: 下拉选项包含「redux_file_source」，名称和可用状态与数据源管理列表一致
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0006
    title: 验证【数据地图】-【查找数据】展开项目名称下拉框，选项名称与项目列表一致
    priority: P2
    precondition: |-
      1) 使用数据开发账号进入离线开发平台
      2) 项目列表存在「redux_project_a」和「redux_project_b」
      3) 数据开发账号是 redux_project_a、redux_project_b 的项目成员
    steps:
      - action: 进入【数据地图 → 查找数据】页面
        expected: 进入成功
      - action: 点击「项目名称」下拉框
        expected: 下拉选项包含「redux_project_a」「redux_project_b」，项目名称与项目列表一致
    tags: ["数据地图", "查找数据"]

  - case_id: C0007
    title: 验证【数据地图】-【数据表管理】展开项目名称下拉框，选项名称与项目列表一致
    priority: P2
    precondition: |-
      1) 使用数据开发账号进入离线开发平台
      2) 项目列表存在「redux_project_a」和「redux_project_b」
      3) 数据开发账号是 redux_project_a、redux_project_b 的项目成员
    steps:
      - action: 进入【数据地图 → 数据表管理】页面
        expected: 进入成功
      - action: 点击「项目名称」下拉框
        expected: 下拉选项包含「redux_project_a」「redux_project_b」，项目名称与项目列表一致
    tags: ["数据地图", "数据表管理"]
