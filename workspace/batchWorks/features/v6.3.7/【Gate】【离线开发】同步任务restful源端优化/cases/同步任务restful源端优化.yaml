meta:
  title: 【gate】同步任务restful源端优化
  case_module_id: "8885"
  imports:
    - 202506-离线开发v6.3.7.xmind
  exports:
    - 同步任务restful源端优化.xmind
cases:
  - case_id: C0001
    title: 验证【数据开发】-【周期任务】新建同步任务选择 RESTful 来源，展示 Path 输入框并校验格式
    priority: P0
    precondition: |-
      1) 周期任务支持新建数据同步任务
      2) 数据源中心存在 RESTful 数据源 ${DataSourceA}，支持 POST 请求
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建数据同步任务，在「数据来源」步骤选择 ${DataSourceA}
        expected: 「数据源」下方展示「Path」输入框，提示「请填写后端服务路径」
      - action: 在「Path」输入少于 2 个字符或超过 200 个字符
        expected: 「Path」置红提示:「路径长度请限制在2-200个字符」
      - action: 在「Path」输入不以「/」开头或包含非法字符的 2 至 200 个字符
        expected: 「Path」置红提示:「只能 / 开头，支持英文，数字，下划线，连字符(-)」
      - action: 在「Path」输入以「/」开头且只包含允许字符的 2 至 200 个字符
        expected: 「Path」回显输入内容且无格式错误提示
    tags: [数据开发, 周期任务, RESTful同步]

  - case_id: C0002
    title: 验证【数据开发】-【周期任务】运行 RESTful 来源同步任务，未配置 Path 时运行失败且配置 Path 后同步成功(Path = 未配置/已配置)
    priority: P0
    precondition: |-
      1) 数据源中心存在 POST RESTful 数据源 ${DataSourceA}，请求地址为 http://restful.example.test:81，地址不含 Path
      2) 存在可写入的目标数据源 ${DataSourceB}
      3) 后端服务 Path「/api/gateway/test/post」返回 3 条固定记录
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建数据同步任务 A，来源选择 ${DataSourceA}，Path 为空，保存并临时运行
        expected: 任务 A 保存成功，临时运行记录显示失败
      - action: 提交任务 A 并执行补数据
        expected: 任务 A 提交成功，补数据运行记录显示失败
      - action: 新建数据同步任务 B，来源选择 ${DataSourceA}，Path 填写「/api/gateway/test/post」，目标选择 ${DataSourceB}，保存并临时运行
        expected: 任务 B 保存成功，临时运行记录显示成功，目标数据源新增 3 条记录
      - action: 提交任务 B 并执行补数据
        expected: 任务 B 提交成功，补数据运行记录显示成功，目标数据源新增 3 条记录
    tags: [数据开发, 周期任务, RESTful同步]

  - case_id: C0003
    title: 验证【数据开发】-【周期任务】运行 RESTful 来源同步任务，地址已含 Path 时留空沿用且另配 Path 后运行失败(来源地址 = 已含 Path 且另配 Path)
    priority: P0
    precondition: |-
      1) 数据源中心存在 POST RESTful 数据源 ${DataSourceA}，请求地址为 http://restful.example.test:81/api/gateway/test/post
      2) 存在可写入的目标数据源 ${DataSourceB}
      3) 地址 Path 返回 3 条固定记录，另一个 Path「/api/gateway/test/other」返回 0 条记录
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建任务 A，来源选择 ${DataSourceA}，Path 为空，保存并临时运行
        expected: 任务 A 保存成功，临时运行记录显示成功，目标数据源新增 3 条记录
      - action: 提交任务 A 并执行补数据
        expected: 任务 A 提交成功，补数据运行记录显示成功
      - action: 新建任务 B，来源选择 ${DataSourceA}，Path 填写「/api/gateway/test/other」，保存并临时运行
        expected: 任务 B 保存成功，临时运行记录显示失败，目标数据源不新增记录
      - action: 提交任务 B 并执行补数据
        expected: 任务 B 提交成功，补数据运行记录显示失败
    tags: [数据开发, 周期任务, RESTful同步]

  - case_id: C0004
    title: 验证【数据开发】-【周期任务】运行 RESTful 来源同步任务，未配置 Path 或配置请求参数时运行失败且仅配置 Path 后同步成功(Path = 未配置/已配置；请求参数 = 配置/未配置)
    priority: P1
    precondition: |-
      1) 数据源中心存在 GET RESTful 数据源 ${DataSourceA}，请求地址为 http://restful.example.test:81，地址不含 Path 和请求参数
      2) 存在可写入的目标数据源 ${DataSourceB}
      3) Path「/api/gateway/test/get」返回 3 条固定记录，带 query 参数时返回 3 条固定记录
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建任务 A，来源选择 ${DataSourceA}，Path 为空，配置请求参数后保存并临时运行
        expected: 任务 A 保存成功，临时运行记录显示失败
      - action: 提交任务 A 并执行补数据
        expected: 任务 A 提交成功，补数据运行记录显示失败
      - action: 新建任务 B，Path 填写「/api/gateway/test/get」，不配置请求参数，保存并临时运行
        expected: 任务 B 临时运行记录显示成功，目标数据源新增 3 条记录
      - action: 新建任务 C，Path 填写「/api/gateway/test/get」并配置请求参数，保存并临时运行
        expected: 任务 C 临时运行记录显示成功，目标数据源新增 3 条记录
    tags: [数据开发, 周期任务, RESTful同步]

  - case_id: C0005
    title: 验证【数据开发】-【周期任务】运行 RESTful 来源同步任务，地址已含 Path 时留空沿用且另配 Path 或请求参数后运行失败(来源地址 = 已含 Path 且另配 Path/请求参数)
    priority: P1
    precondition: |-
      1) 数据源中心存在 GET RESTful 数据源 ${DataSourceA}，请求地址为 http://restful.example.test:81/api/gateway/test/get?number=1
      2) 存在可写入的目标数据源 ${DataSourceB}
      3) 地址接口返回 3 条固定记录，Path「/api/gateway/test/other」返回 0 条记录
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建任务 A，来源选择 ${DataSourceA}，Path 为空，不配置请求参数，保存并临时运行
        expected: 任务 A 临时运行记录显示成功，目标数据源新增 3 条记录
      - action: 新建任务 B，Path 填写「/api/gateway/test/other」，保存并临时运行
        expected: 任务 B 临时运行记录显示失败，目标数据源不新增记录
      - action: 新建任务 C，Path 为空并配置请求参数，保存并临时运行
        expected: 任务 C 临时运行记录显示失败
    tags: [数据开发, 周期任务, RESTful同步]

  - case_id: C0006
    title: 验证【数据开发】-【周期任务】新建同步任务选择 RESTful 目标，展示 Path 输入框并校验格式
    priority: P1
