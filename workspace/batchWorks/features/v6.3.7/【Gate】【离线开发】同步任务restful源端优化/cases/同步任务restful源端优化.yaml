      - action: 在「Path」输入「/api/gateway/test/put」
        expected: 「Path」回显输入内容且无格式错误提示
    tags: [数据开发, 周期任务, RESTful同步]

  - case_id: C0007
    title: 验证【数据开发】-【周期任务】运行 RESTful 目标同步任务，未配置 Path 时运行失败且配置 Path 后同步成功(Path = 未配置/已配置)
    priority: P1
    precondition: |-
      1) 数据源中心存在 POST RESTful 目标数据源 ${DataSourceA}，请求地址为 http://restful.example.test:81，地址不含 Path
      2) 存在包含 3 条固定记录的源数据表 source_table
      3) 后端服务 Path「/api/gateway/test/post」接收记录并返回状态码 200
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建任务 A，目标选择 ${DataSourceA}，Path 为空，保存并临时运行
        expected: 任务 A 临时运行记录显示失败
      - action: 新建任务 B，目标 Path 填写「/api/gateway/test/post」，保存并临时运行
        expected: 任务 B 临时运行记录显示成功，接口接收 3 条记录
      - action: 提交任务 B 并执行补数据
        expected: 补数据运行记录显示成功，接口累计接收 3 条记录
    tags: [数据开发, 周期任务, RESTful同步]

