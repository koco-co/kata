  - case_id: C0007
    title: 验证【数据源】-【整库同步】勾选记录保存展开脏数据配置，取消勾选隐藏配置
    priority: P2
    precondition: 无
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击MySQL数据源的【整库同步】按钮
        expected: 进入整库同步配置页面
      - action: 选择数据同步目标为Hive
        expected: 配置完成
      - action: 找到【脏数据管理】配置区域
        expected: |-
          1) 显示"记录保存"复选框
          2) 复选框默认未勾选
      - action: 勾选【记录保存】复选框
        expected: |-
          1) 下方展开详细配置项
          2) 显示"脏数据写入hive表"配置
          3) 显示"脏数据存储生命周期"输入框(默认值: 90)
      - action: 取消勾选
        expected: 隐藏脏数据配置项
    tags: [数据源, 整库同步, 脏数据管理, hive]

