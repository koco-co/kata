meta:
  title: 【东风商用车】整库同步功能优化
  feature_id: offline-full-database-sync-enhancements
  project_id: batch-works
  requirement_id: '15353'
  case_module_id: '10177'
  imports:
    - 202601-离线开发v6.4.5.xmind
  exports:
    - 整库同步功能优化.xmind
cases:
  - case_id: C0001
    title: 验证【数据源】-【整库同步】进入配置页面新增过滤条件，展示提示与源端信息
    priority: P1
    precondition: |-
      1) 数据源test_mysql中存在用户表t_user和订单表t_order, 建表语句如下:
         CREATE TABLE `t_user` (
           id INT PRIMARY KEY,
           username VARCHAR(50),
           create_time DATETIME
         );
         CREATE TABLE `t_order` (
           id INT PRIMARY KEY,
           user_id INT,
           total_amount DECIMAL(10, 2),
           create_time DATETIME
         );
      2) 表中已写入如下数据:
         INSERT INTO t_user VALUES (1, '张三', '2026-01-05');
         INSERT INTO t_user VALUES (2, '李四', '2026-01-10');
         INSERT INTO t_order VALUES (101, 1, 299.00, '2026-01-15');
         INSERT INTO t_order VALUES (102, 1, 59.50, '2026-01-16');
         INSERT INTO t_order VALUES (103, 2, 1200.00, '2026-01-20');
         INSERT INTO t_order VALUES (104, 1, 88.00, '2026-02-01');
         INSERT INTO t_order VALUES (105, 2, 450.00, '2026-02-02');
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击MySQL数据源的【整库同步】按钮
        expected: 进入整库同步配置页面
      - action: 检查页面配置项显示
        expected: |-
          在「数据同步目标」上方新增「过滤条件」配置项, 提示: where条件即针对源头数据筛选条件, 根据指定的column、table、where条件拼接SQL进行数据抽取, 暂时不支持limit关键字过滤. 利用where条件可进行全量同步和增量抽取, 具体说明如下:
          1) 全量同步: 第一次做数据导入时在默认配置下为全量导入, 可不用设置where条件
          2) 增量抽取: 增量导入在实际业务场景中, 往往会选择当天的数据进行同步, 在默认配置下需要编写where条件语句, 请先确认表中描述增量字段(时间戳)为哪一个. 如tableA增量的字段为create_time, 则填写create_time > 您需要的日期, 如果需要日期动态变化, 请参考帮助文档
      - action: 检查源端信息
        expected: |-
          1) 页面顶部显示源端数据源test_mysql (MySQL)
          2) 源端表列表存在2张表(user、order)
          3) 每张表前有复选框可选择
    tags: [数据源, 整库同步, 数据过滤, mysql]

  - case_id: C0002
    title: 验证【数据源】-【整库同步】输入where条件发布任务，任务配置回显过滤条件
    priority: P0
    precondition: |-
      1) 数据源: MySQL
      2) 源端存在user表, 建表语句如下:
         CREATE TABLE user (
             id INT PRIMARY KEY COMMENT '用户ID',
             name VARCHAR(100) COMMENT '用户名',
             age INT COMMENT '年龄',
             create_time DATETIME COMMENT '创建时间'
         );
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击MySQL数据源的【整库同步】按钮
        expected: 进入整库同步配置页面
      - action: '在【过滤条件】输入框中输入: create_at > ''2026-01-01'''
        expected: 输入内容正常显示
      - action: '继续配置其他必填项: 选择数据同步目标为Hive, 选择至少1张源端表'
        expected: 配置完成
      - action: 点击【发布任务】按钮
        expected: 任务发布成功
      - action: 进入数据开发-任务开发目录, 查看生成的数据同步任务配置
        expected: '任务配置中, 数据来源的数据过滤显示: create_at > ''2026-01-01'''
      - action: 点击数据预览
        expected: 返回符合条件的结果
      - action: 运行任务
        expected: 数据同步成功
    tags: [数据源, 整库同步, 数据过滤, mysql]

