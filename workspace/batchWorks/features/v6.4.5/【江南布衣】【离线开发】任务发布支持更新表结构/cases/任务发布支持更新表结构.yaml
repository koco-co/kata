meta:
  title: 【江南布衣】任务发布支持更新表结构
  requirement_id: "15375"
  case_module_id: "10147"
  imports:
    - 202601-离线开发v6.4.5.xmind
  exports:
    - 任务发布支持更新表结构.xmind
cases:
  - case_id: C0001
    title: 验证周期任务/手动任务打包时，通过「添加关联」可正确关联任务中创建的表（sparkthrift）
    priority: P1
    precondition: |-
      1) 已登录系统，账号具有任务发布权限
      2) 系统中存在至少2个项目（测试项目test_project_01和生产项目prod_project_01）
      3) 测试项目test_project_01和生产项目prod_project_01均配置了Hive数据源
      4) 测试项目test_project_01中存在至少1个周期任务A或手动任务B，且任务中包含CREATE TABLE语句
      5) 建表语句如下:
      周期任务A
      CREATE TABLE IF NOT EXISTS test_source_tableA (
          id INT COMMENT '主键ID',
          name STRING COMMENT '姓名',
          age INT COMMENT '年龄'
      )
      STORED AS ORC;


      手动任务B
      CREATE TABLE IF NOT EXISTS test_source_tableB (
          id INT COMMENT '主键ID',
          name STRING COMMENT '姓名',
          age INT COMMENT '年龄'
      )
      STORED AS ORC;
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 跳转到创建发布包页面，「对象类型」默认为「周期任务」
      - action: 选择周期任务A, 点击【添加关联】按钮
        expected: 显示【添加关联】弹窗
      - action: 切换到【关联表】tab页
        expected: 列表正确显示周期任务A中所有创建的表, 包含Hive表test_source_tableA
      - action: 选择test_source_tableA，点击【确认】
        expected: test_source_tableA成功添加到右侧【发布列表】
      - action: 选择「对象类型」为「手动任务」, 选择手动任务B, 点击【添加关联】按钮
        expected: 显示【添加关联】弹窗
      - action: 切换到【关联表】, 选择test_source_tableB，点击【确认】
        expected: test_source_tableB成功添加到右侧【发布列表】
    tags:
      - 任务发布/创建发布包 ❯
  - case_id: C0002
    title: 验证「对象类型」选择「表」时，可正确展示当前项目中周期任务/手动任务/临时查询创建的表(Hive)
    priority: P1
    precondition: |-
      1) 存在2个项目（test_project_01 和 prod_project_01）

      2) 建表语句如下:

      周期任务1
      CREATE TABLE IF NOT EXISTS task_table01 (
          task_id INT COMMENT '任务ID',
          task_name STRING COMMENT '任务名称',
          task_status STRING COMMENT '任务状态'
      )
      STORED AS ORC;

      手动任务1
      CREATE TABLE IF NOT EXISTS task_table02 (
          manual_id INT COMMENT '手动任务ID',
          manual_name STRING COMMENT '手动任务名称',
          manual_desc STRING COMMENT '手动任务描述'
      )
      STORED AS ORC;

      临时查询1
      CREATE TABLE IF NOT EXISTS task_table03 (
          query_id INT COMMENT '查询ID',
          query_sql STRING COMMENT '查询SQL',
          query_result STRING COMMENT '查询结果'
      )
      STORED AS ORC;
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 跳转到发布包创建页面
      - action: 「对象类型」切换为「表」
        expected: 列表数据刷新
      - action: 检查表列表中的表信息
        expected: |-
          列表正确显示test_project_01中周期任务/手动任务/临时查询创建的所有表：
          1) task_table01（所属任务：周期任务1）
          2) task_table02（所属任务：手动任务1）
          3) task_table03（所属任务：临时查询1）
      - action: 勾选task_table01~03
        expected: 表成功添加到右侧【发布列表】
    tags:
      - 任务发布/创建发布包 ❯
  - case_id: C0003
    title: 验证周期任务/手动任务打包时，通过「添加关联」可正确关联任务中创建的表（Doris）
    priority: P1
    precondition: |-
      1、 当前项目已创建Doris数据源
      2、 项目中已存在一个Doris SQL周期任务和手动任务，任务中包含建表语句：

      CREATE TABLE test_db.tb_create_in_task (
          id INT,
          name STRING,
          create_time TIMESTAMP
      ) PARTITIONED BY (dt STRING);

      CREATE TABLE test_db.tb_create_in_task2 (
          id INT,
          name STRING,
          create_time TIMESTAMP
      ) PARTITIONED BY (dt STRING);

      3、 该任务已提交并至少运行成功一次（表已实际创建）
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 跳转到创建发布包页面，「对象类型」默认为「周期任务」
      - action: 选择周期任务A, 点击【添加关联】按钮
        expected: 显示【添加关联】弹窗
      - action: 切换到【关联表】tab页
        expected: 列表正确显示周期任务A中所有创建的表, 包含Hive表test_source_tableA
      - action: 选择test_source_tableA，点击【确认】
        expected: test_source_tableA成功添加到右侧【发布列表】
      - action: 选择「对象类型」为「手动任务」, 选择手动任务B, 点击【添加关联】按钮
        expected: 显示【添加关联】弹窗
      - action: 切换到【关联表】, 选择test_source_tableB，点击【确认】
        expected: test_source_tableB成功添加到右侧【发布列表】
    tags:
      - 任务发布/创建发布包 ❯
  - case_id: C0004
    title: 验证「对象类型」选择「表」时，可正确展示当前项目中周期任务/手动任务/临时查询创建的(Doris)
    priority: P1
    precondition: |-
      建表语句:
      -- 周期任务A
      CREATE TABLE IF NOT EXISTS table01 (
          id INT,
          name VARCHAR(100)
      )
      DUPLICATE KEY(id)
      DISTRIBUTED BY HASH(id) BUCKETS 10;

      -- 手动任务B
      CREATE TABLE IF NOT EXISTS table02 (
          id INT,
          name VARCHAR(100)
      )
      DUPLICATE KEY(id)
      DISTRIBUTED BY HASH(id) BUCKETS 10;

      -- 临时查询C
      CREATE TABLE IF NOT EXISTS table03 (
          id INT,
          name VARCHAR(100)
      )
      DUPLICATE KEY(id)
      DISTRIBUTED BY HASH(id) BUCKETS 10;
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 跳转到发布包创建页面
      - action: 「对象类型」切换为「表」
        expected: 列表数据刷新
      - action: 检查表列表中的表信息
        expected: |-
          列表正确显示test_project_01中周期任务/手动任务/临时查询创建的所有表：
          1) task_table01（所属任务：周期任务1）
          2) task_table02（所属任务：手动任务1）
          3) task_table03（所属任务：临时查询1）
      - action: 勾选task_table01~03
        expected: 表成功添加到右侧【发布列表】
    tags:
      - 任务发布/创建发布包 ❯
  - case_id: C0005
    title: 验证「发布包校验」 变更信息显示正常（Hive + 一键发布)
    priority: P2
    precondition: |-
      1) 存在2个项目（test_project_01 和 prod_project_01）

      2) 源表&目标表——建表语句：
      DROP TABLE IF EXISTS source_table;
      CREATE TABLE IF NOT EXISTS source_table (
          id INT,
          name STRING,
          age INT,
          update_time TIMESTAMP
      )
      PARTITIONED BY (dt STRING)
      STORED AS ORC;
      DESC source_table;

      3) 源表变更SQL
      ALTER TABLE source_table CHANGE COLUMN update_time create_time TIMESTAMP CASCADE;
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 进入成功
      - action: 「对象类型」切换为「表」, 选择Hive表source_table并打包
        expected: 打包成功, 跳转到「发布至目标项目」页面
      - action: 点击「发布」按钮
        expected: 进入「发布包校验」弹窗
      - action: 检查「表」模块信息
        expected: |-
          “表”模块icon变更为黄色警告, 表格列信息:
          1) 标题: 本项目表结构存在变更
          2) 问号icon悬浮提示: 当前仅支持对 Doris、Hive 表的字段新增、字段删除及字段类型修改进行提示。
          在表格左侧勾选对应变更项后，系统将在发布过程中自动执行相应的表结构变更 SQL，变更将直接作用于目标项目的数据表结构，可能对下游任务及数据产生影响，请谨慎操作。
          3) 表格列包括:
          - 数据源名称：${数据源名称}（${数据源类型}）
          - Schema名称：展示表结构存在差异的表所在的schema名称
          - 表名：展示结构存在差异的表名
          - 变更说明：展示当前表内字段变更的情况，包括修改字段、新增字段。按照变更风险从高到低的顺序展示，依次为： 修改字段 → 新增字段
          - 修改：修改字段 ${字段名称}（${原字段类型} -> ${新字段类型}}）
          - 新增：新增字段 ${字段名称}（${字段类型}）
    tags:
      - 任务发布/发布至目标项目 ❯
      - Hive ❯
  - case_id: C0006
    title: 验证「发布包校验」 变更信息显示正常（Hive + 底层执行SQL + 一键发布)
    priority: P1
    precondition: |-
      1) 存在2个项目（test_project_01 和 prod_project_01）

      2) 源表&目标表——建表语句：
      DROP TABLE IF EXISTS source_table;
      CREATE TABLE IF NOT EXISTS source_table (
          id INT,
          name STRING,
          age INT,
          update_time TIMESTAMP
      )
      PARTITIONED BY (dt STRING)
      STORED AS ORC;
      DESC source_table;

      3) 源表变更SQL
      ALTER TABLE source_table CHANGE COLUMN update_time create_time TIMESTAMP CASCADE;
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 进入成功
      - action: 「对象类型」切换为「表」, 选择Hive表source_table并打包
        expected: 打包成功, 跳转到「发布至目标项目」页面
      - action: 点击「发布」按钮
        expected: 进入「发布包校验」弹窗
      - action: 检查「表」模块信息
        expected: "显示: 校验通过"
      - action: "底层执行SQL: ALTER TABLE source_table CHANGE update_time create_time string AFTER id;"
        expected: 执行成功
      - action: 检查「表」模块信息
        expected: 存在表结构变更
    tags:
      - 任务发布/发布至目标项目 ❯
      - Hive ❯
  - case_id: C0007
    title: 验证「发布包校验」 变更说明按风险顺序(修改→新增)正确展示(Hive + 一键发布）
    priority: P2
    precondition: |-
      1、 源表&目标表——建表语句：
      DROP TABLE IF EXISTS source_table_multi;
      CREATE TABLE IF NOT EXISTS source_table_multi (
          id INT,
          name STRING,
          old_field INT,
          age STRING
      )
      PARTITIONED BY (dt STRING)
      STORED AS ORC;
      DESC source_table_multi;

      2、 源表变更SQL
      ALTER TABLE source_table_multi CHANGE COLUMN age age INT;
      ALTER TABLE source_table_multi REPLACE COLUMNS (id INT, name STRING, age INT);
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 进入成功
      - action: 「对象类型」切换为「表」, 选择Hive表source_table_multi并打包
        expected: 打包成功, 跳转到「发布至目标项目」页面
      - action: 点击「发布」按钮
        expected: 进入「发布包校验」弹窗
      - action: 检查「表」模块信息
        expected: "显示: 校验通过"
      - action: |-
          平台执行 hive sql:
          ALTER TABLE source_table_multi
          REPLACE COLUMNS (
              id INT COMMENT '主键ID',
              name STRING COMMENT '姓名',
              age INT COMMENT '年龄',
              new_field STRING COMMENT '新增字段'
          ) CASCADE;
        expected: ""
      - action: 查看「变更说明」区域的变更项排序
        expected: |-
          变更项按照风险顺序正确排列：
          修改字段  age (STRING -> INT）
          新增字段  new_field(STRING)
    tags:
      - 任务发布/发布至目标项目 ❯
      - Hive ❯
  - case_id: C0008
    title: 验证「发布包校验」差异对比正常（Hive + 单表 + 单字段变更）
    priority: P1
    precondition: |-
      1、 源表&目标表——建表语句
      DROP TABLE IF EXISTS source_table_single;
      CREATE TABLE IF NOT EXISTS source_table_single (
          id INT,
          name STRING,
          age STRING
      )
      PARTITIONED BY (dt STRING)
