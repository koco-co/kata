  - action: 进入【离线开发 → 任务发布→创建发布包】页面
    expected: 已进入【离线开发 → 任务发布→创建发布包】页面，显示页面标题与主要操作区域
  - action: 选择周期任务A, 点击【添加关联】按钮
    expected: 显示【添加关联】弹窗
  - action: 切换到【关联表】tab页
    expected: 列表正确显示周期任务A中所有创建的表, 包含Hive表test_source_tableA
  - action: 选择test_source_tableA，点击【确认】
    expected: test_source_tableA成功添加到右侧【发布列表】
  - action: 选择「对象类型」为「手动任务」, 选择手动任务B, 点击【添加关联】按钮
    expected: 显示【添加关联】弹窗
  - action: 切换到【关联表】, 选择test_source_tableB，点击【确认】
    expected: test_source_tableB成功添加到右侧【发布列表】
  tags:
  - 任务发布/创建发布包 ❯
- case_id: C0004
