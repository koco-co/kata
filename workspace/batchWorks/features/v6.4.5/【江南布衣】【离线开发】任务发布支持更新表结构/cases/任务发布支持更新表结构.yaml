  - action: 进入【离线开发 → 任务发布→创建发布包】页面
    expected: 已进入【离线开发 → 任务发布→创建发布包】页面，显示页面标题与主要操作区域
  - action: 「对象类型」切换为「表」
    expected: 列表数据刷新
  - action: 检查表列表中的表信息
    expected: '列表正确显示test_project_01中周期任务/手动任务/临时查询创建的所有表：

      1) task_table01（所属任务：周期任务1）

      2) task_table02（所属任务：手动任务1）

      3) task_table03（所属任务：临时查询1）'
  - action: 勾选task_table01~03
    expected: 表成功添加到右侧【发布列表】
  tags:
  - 任务发布/创建发布包 ❯
- case_id: C0005
  title: 验证「发布包校验」 变更信息显示目标记录及字段值（Hive + 一键发布)
  priority: P2
  precondition: "1) 存在2个项目（test_project_01 和 prod_project_01）\n\n2) 源表&目标表——建表语句：\nDROP TABLE IF EXISTS source_table;\nCREATE\
    \ TABLE IF NOT EXISTS source_table (\n    id INT,\n    name STRING,\n    age INT,\n    update_time TIMESTAMP\n)\nPARTITIONED\
    \ BY (dt STRING)\nSTORED AS ORC;\nDESC source_table;\n\n3) 源表变更SQL\nALTER TABLE source_table CHANGE COLUMN update_time\
    \ create_time TIMESTAMP CASCADE;"
  steps:
  - action: 进入【离线开发 → 发布包校验 变更信息显示目标记录及字段值】页面
    expected: 已进入【离线开发 → 发布包校验 变更信息显示目标记录及字段值】页面，显示页面标题与主要操作区域
  - action: 进入【离线开发 → 任务发布→创建发布包】页面
    expected: 已进入【离线开发 → 任务发布→创建发布包】页面，显示页面标题与主要操作区域
  - action: 「对象类型」切换为「表」, 选择Hive表source_table并打包
    expected: 打包成功, 跳转到「发布至目标项目」页面
  - action: 点击「发布」按钮
    expected: 进入「发布包校验」弹窗
  - action: 检查「表」模块信息
    expected: '“表”模块icon变更为黄色警告, 表格列信息:

      1) 标题: 本项目表结构存在变更

      2) 问号icon悬浮提示: 当前仅支持对 Doris、Hive 表的字段新增、字段删除及字段类型修改进行提示。

      在表格左侧勾选对应变更项后，系统将在发布过程中自动执行对应的表结构变更 SQL，变更将直接作用于目标项目的数据表结构，当对下游任务及数据产生影响，请谨慎操作。

      3) 表格列包括:

      - 数据源名称：${数据源名称}（${数据源类型}）

      - Schema名称：展示表结构存在差异的表所在的schema名称

      - 表名：展示结构存在差异的表名

      - 变更说明：展示当前表内字段变更的情况，包括修改字段、新增字段。按照变更风险从高到低的顺序展示，依次为： 修改字段 → 新增字段

      - 修改：修改字段 ${字段名称}（${原字段类型} -> ${新字段类型}}）

      - 新增：新增字段 ${字段名称}（${字段类型}）'
  tags:
  - 任务发布/发布至目标项目 ❯
  - Hive ❯
- case_id: C0006
  title: 验证「发布包校验」 变更信息显示目标记录及字段值（Hive + 底层执行SQL + 一键发布)
  priority: P1
  precondition: "1) 存在2个项目（test_project_01 和 prod_project_01）\n\n2) 源表&目标表——建表语句：\nDROP TABLE IF EXISTS source_table;\nCREATE\
    \ TABLE IF NOT EXISTS source_table (\n    id INT,\n    name STRING,\n    age INT,\n    update_time TIMESTAMP\n)\nPARTITIONED\
    \ BY (dt STRING)\nSTORED AS ORC;\nDESC source_table;\n\n3) 源表变更SQL\nALTER TABLE source_table CHANGE COLUMN update_time\
    \ create_time TIMESTAMP CASCADE;"
  steps:
  - action: 进入【离线开发 → 发布包校验 变更信息显示目标记录及字段值】页面
    expected: 已进入【离线开发 → 发布包校验 变更信息显示目标记录及字段值】页面，显示页面标题与主要操作区域
  - action: 进入【离线开发 → 任务发布→创建发布包】页面
    expected: 已进入【离线开发 → 任务发布→创建发布包】页面，显示页面标题与主要操作区域
  - action: 「对象类型」切换为「表」, 选择Hive表source_table并打包
    expected: 打包成功, 跳转到「发布至目标项目」页面
  - action: 点击「发布」按钮
    expected: 进入「发布包校验」弹窗
  - action: 检查「表」模块信息
    expected: '显示: 校验通过'
  - action: '底层执行SQL: ALTER TABLE source_table CHANGE update_time create_time string AFTER id;'
    expected: 执行成功
  - action: 检查「表」模块信息
    expected: 存在表结构变更
  tags:
  - 任务发布/发布至目标项目 ❯
  - Hive ❯
