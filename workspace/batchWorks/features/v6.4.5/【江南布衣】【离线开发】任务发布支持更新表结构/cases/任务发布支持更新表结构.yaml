- case_id: C0009
  title: 验证「发布包校验」差异对比正常（Hive + 多表 + 多变更类型）
  priority: P1
  precondition: "1、 源表&目标表——建表语句(这里源表也是目标表的SQL)：\nDROP TABLE IF EXISTS source_table1;\nCREATE TABLE IF NOT EXISTS source_table1\
    \ (\n    id INT,\n    name STRING,\n    age INT\n)\nSTORED AS ORC;\nDESC source_table1;\n\nDROP TABLE IF EXISTS source_table2;\n\
    CREATE TABLE IF NOT EXISTS source_table2 (\n    id INT,\n    order_id STRING,\n    order_date STRING,\n    amount DECIMAL(10,2)\n\
    )\nSTORED AS ORC;\nDESC source_table2;\n\n2、 源表变更SQL\n-- 表1变更：修改字段名并新增字段\nALTER TABLE source_table1 CHANGE COLUMN name\
    \ username STRING;\nALTER TABLE source_table1 ADD COLUMNS (phone STRING);\n\n-- 表2变更：删除字段（Hive在默认配置下采用替换方式实现删除）\nALTER\
    \ TABLE source_table2 REPLACE COLUMNS (\n    id INT,\n    order_id STRING\n);"
  steps:
  - action: 进入【离线开发 → 发布包校验差异对比正常】页面
    expected: 已进入【离线开发 → 发布包校验差异对比正常】页面，显示页面标题与主要操作区域
  - action: 进入【离线开发 → 任务发布→创建发布包】页面
    expected: 已进入【离线开发 → 任务发布→创建发布包】页面，显示页面标题与主要操作区域
  - action: 「对象类型」切换为「表」, 选择Hive表source_table1, source_table2并打包
    expected: 打包成功, 跳转到「发布至目标项目」页面
  - action: 点击「发布」按钮
    expected: 进入「发布包校验」弹窗
  - action: 查看「表」模块信息
    expected: '存在表结构变更:

      1) 表名: source_table1

      变更说明:

      - 新增字段 new_field (string)

      2) 表名: source_table2

      变更说明:

      - 修改字段 amount (DECIMAL(18,2) -> DECIMAL(10,2))

      - 修改字段 status (int -> string)'
  tags:
  - 任务发布/发布至目标项目 ❯
  - Hive ❯
