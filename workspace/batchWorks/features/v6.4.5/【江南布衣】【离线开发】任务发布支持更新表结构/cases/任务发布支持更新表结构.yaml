    \    id INT,\n    name STRING,\n    create_time TIMESTAMP\n) PARTITIONED BY (dt STRING);\n\nCREATE TABLE test_db.tb_create_in_task2\
    \ (\n    id INT,\n    name STRING,\n    create_time TIMESTAMP\n) PARTITIONED BY (dt STRING);\n\n3、 该任务已提交并至少运行成功一次（表已实际创建）"
