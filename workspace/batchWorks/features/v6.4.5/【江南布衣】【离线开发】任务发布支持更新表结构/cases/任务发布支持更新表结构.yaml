meta:
  title: 【江南布衣】任务发布支持更新表结构
  requirement_id: '15375'
  case_module_id: '10147'
  imports:
  - 202601-离线开发v6.4.5.xmind
  exports:
  - 任务发布支持更新表结构.xmind
cases:
- case_id: C0001
  title: 验证周期任务/手动任务打包时，通过「添加关联」可正确关联任务中创建的表（sparkthrift）
  priority: P1
  precondition: "1) 进入系统，账号具有任务发布权限\n2) 系统中存在至少2个项目（测试项目test_project_01和生产项目prod_project_01）\n3) 测试项目test_project_01和生产项目prod_project_01均配置了Hive数据源\n\
    4) 测试项目test_project_01中存在至少1个周期任务A或手动任务B，且任务中包含CREATE TABLE语句\n5) 建表语句如下:\n周期任务A\nCREATE TABLE IF NOT EXISTS test_source_tableA\
    \ (\n    id INT COMMENT '主键ID',\n    name STRING COMMENT '姓名',\n    age INT COMMENT '年龄'\n)\nSTORED AS ORC;\n\n\n手动任务B\n\
    CREATE TABLE IF NOT EXISTS test_source_tableB (\n    id INT COMMENT '主键ID',\n    name STRING COMMENT '姓名',\n    age INT\
    \ COMMENT '年龄'\n)\nSTORED AS ORC;"
  steps:
  - action: 进入【离线开发 → 创建发布包】页面
    expected: 已进入【离线开发 → 创建发布包】页面，显示页面标题与主要操作区域
  - action: 进入【离线开发 → 任务发布→创建发布包】页面
    expected: 已进入【离线开发 → 任务发布→创建发布包】页面，显示页面标题与主要操作区域
  - action: 选择周期任务A, 点击【添加关联】按钮
    expected: 显示【添加关联】弹窗
  - action: 切换到【关联表】tab页
    expected: 列表正确显示周期任务A中所有创建的表, 包含Hive表test_source_tableA
  - action: 选择test_source_tableA，点击【确认】
    expected: test_source_tableA成功添加到右侧【发布列表】
  - action: 选择「对象类型」为「手动任务」, 选择手动任务B, 点击【添加关联】按钮
    expected: 显示【添加关联】弹窗
  - action: 切换到【关联表】, 选择test_source_tableB，点击【确认】
    expected: test_source_tableB成功添加到右侧【发布列表】
  tags:
  - 任务发布/创建发布包 ❯
- case_id: C0002
  title: 验证「对象类型」选择「表」时，可正确展示当前项目中周期任务/手动任务/临时查询创建的表(Hive)
  priority: P1
  precondition: "1) 存在2个项目（test_project_01 和 prod_project_01）\n\n2) 建表语句如下:\n\n周期任务1\nCREATE TABLE IF NOT EXISTS task_table01\
    \ (\n    task_id INT COMMENT '任务ID',\n    task_name STRING COMMENT '任务名称',\n    task_status STRING COMMENT '任务状态'\n)\n\
    STORED AS ORC;\n\n手动任务1\nCREATE TABLE IF NOT EXISTS task_table02 (\n    manual_id INT COMMENT '手动任务ID',\n    manual_name\
    \ STRING COMMENT '手动任务名称',\n    manual_desc STRING COMMENT '手动任务描述'\n)\nSTORED AS ORC;\n\n临时查询1\nCREATE TABLE IF NOT EXISTS\
    \ task_table03 (\n    query_id INT COMMENT '查询ID',\n    query_sql STRING COMMENT '查询SQL',\n    query_result STRING COMMENT\
    \ '查询结果'\n)\nSTORED AS ORC;"
  steps:
  - action: 进入【离线开发 → 对象类型】页面
    expected: 已进入【离线开发 → 对象类型】页面，显示页面标题与主要操作区域
  - action: 进入【离线开发 → 任务发布→创建发布包】页面
    expected: 已进入【离线开发 → 任务发布→创建发布包】页面，显示页面标题与主要操作区域
  - action: 「对象类型」切换为「表」
    expected: 列表数据刷新
  - action: 检查表列表中的表信息
    expected: '列表正确显示test_project_01中周期任务/手动任务/临时查询创建的所有表：

      1) task_table01（所属任务：周期任务1）

      2) task_table02（所属任务：手动任务1）

      3) task_table03（所属任务：临时查询1）'
  - action: 勾选task_table01~03
    expected: 表成功添加到右侧【发布列表】
  tags:
  - 任务发布/创建发布包 ❯
