      - Hive ❯
  - case_id: C0009
    title: 验证「发布包校验」差异对比正常（Hive + 多表 + 多变更类型）
    priority: P1
    precondition: |-
      1、 源表&目标表——建表语句(这里源表也是目标表的SQL)：
      DROP TABLE IF EXISTS source_table1;
      CREATE TABLE IF NOT EXISTS source_table1 (
          id INT,
          name STRING,
          age INT
      )
      STORED AS ORC;
      DESC source_table1;

      DROP TABLE IF EXISTS source_table2;
      CREATE TABLE IF NOT EXISTS source_table2 (
          id INT,
          order_id STRING,
          order_date STRING,
          amount DECIMAL(10,2)
      )
      STORED AS ORC;
      DESC source_table2;

      2、 源表变更SQL
      -- 表1变更：修改字段名并新增字段
      ALTER TABLE source_table1 CHANGE COLUMN name username STRING;
      ALTER TABLE source_table1 ADD COLUMNS (phone STRING);

      -- 表2变更：删除字段（Hive通常采用替换方式实现删除）
      ALTER TABLE source_table2 REPLACE COLUMNS (
          id INT,
          order_id STRING
      );
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
        expected: 进入成功
      - action: 「对象类型」切换为「表」, 选择Hive表source_table1, source_table2并打包
        expected: 打包成功, 跳转到「发布至目标项目」页面
      - action: 点击「发布」按钮
        expected: 进入「发布包校验」弹窗
      - action: 查看「表」模块信息
        expected: |-
          存在表结构变更:
          1) 表名: source_table1
          变更说明:
          - 新增字段 new_field (string)
          2) 表名: source_table2
          变更说明:
          - 修改字段 amount (DECIMAL(18,2) -> DECIMAL(10,2))
          - 修改字段 status (int -> string)
    tags:
      - 任务发布/发布至目标项目 ❯
      - Hive ❯
