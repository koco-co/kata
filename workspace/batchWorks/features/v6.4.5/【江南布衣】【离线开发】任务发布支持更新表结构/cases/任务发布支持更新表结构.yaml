    title: 验证「发布包校验」变更SQL发布后, 目标表结构不变（Hive + 一键发布 + 分区字段新增/删除/类型变更)
    priority: P1
    precondition: |-
      1、 源表&目标表——建表语句：
      -- source_table_partition_type
      DROP TABLE IF EXISTS source_table_partition_type;
      CREATE TABLE IF NOT EXISTS source_table_partition_type (
          id INT,
          name STRING,
          age INT
      )
      PARTITIONED BY (dt STRING)
      STORED AS ORC;
      DESC source_table_partition_type;

      -- source_table_partition_add
      DROP TABLE IF EXISTS source_table_partition_add;
      CREATE TABLE IF NOT EXISTS source_table_partition_add (
          id INT,
          name STRING,
          age INT
      )
      PARTITIONED BY (dt STRING)
      STORED AS ORC;
      DESC source_table_partition_add;

      -- source_table_partition_del
      DROP TABLE IF EXISTS source_table_partition_del;
      CREATE TABLE IF NOT EXISTS source_table_partition_del (
          id INT,
          name STRING,
          age INT
      )
      PARTITIONED BY (dt STRING, region STRING)
      STORED AS ORC;
      DESC source_table_partition_del;

      2、 源表变更SQL
      -- 场景1：分区字段类型变更（Hive不支持直接通过ALTER修改分区列类型，通常需删表重建或迁移数据）
      -- 建议操作：
      DROP TABLE source_table_partition_type;
      CREATE TABLE source_table_partition_type (
          id INT,
          name STRING,
          age INT
      )
      PARTITIONED BY (dt DATE)
      STORED AS ORC;

      -- 场景2：分区字段新增（Hive不支持向已有表直接追加分区键，需重建表）
      -- 建议操作：
      DROP TABLE source_table_partition_add;
      CREATE TABLE source_table_partition_add (
          id INT,
          name STRING,
