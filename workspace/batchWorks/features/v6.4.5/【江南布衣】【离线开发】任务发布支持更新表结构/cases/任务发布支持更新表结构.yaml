    DISTRIBUTED BY HASH(id) BUCKETS 10;\n\n-- 手动任务B\nCREATE TABLE IF NOT EXISTS table02 (\n    id INT,\n    name VARCHAR(100)\n\
    )\nDUPLICATE KEY(id)\nDISTRIBUTED BY HASH(id) BUCKETS 10;\n\n-- 临时查询C\nCREATE TABLE IF NOT EXISTS table03 (\n    id INT,\n\
    \    name VARCHAR(100)\n)\nDUPLICATE KEY(id)\nDISTRIBUTED BY HASH(id) BUCKETS 10;"
