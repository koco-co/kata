    tags:
      - 任务发布/发布至目标项目 ❯
      - Hive ❯
  - case_id: C0012
    title: 验证「发布包校验」变更SQL发布后, 目标表结构变更成功（Hive + 一键发布 + 新增字段)
    priority: P0
    precondition: |-
      1) 存在2个项目（test_project_01 和 prod_project_01）

      2) 源表&目标表——建表语句：
      DROP TABLE IF EXISTS source_table_addcol;
      CREATE TABLE IF NOT EXISTS source_table_addcol (
          id INT,
          name STRING,
          age INT
      )
      STORED AS ORC;
      DESC source_table_addcol;

      3) 源表变更SQL
      ALTER TABLE source_table_addcol ADD COLUMNS (
          phone STRING,
          email STRING
      );
    steps:
      - action: 进入【测试项目test_project_01】→【任务发布】→【创建发布包】页面
