      -- 创建银行客户账户与交易测试表，涵盖多种 openGauss 支持的数据类型
      drop table if exists bank_customer_account;
      CREATE TABLE bank_customer_account (
          customer_id            BIGINT,                          -- 数值类型（整型）
          account_number          INTEGER,                         -- 账号（整型）
          credit_limit             NUMERIC(18,2),                  -- 任意精度（货币类型）
          is_premium               BOOLEAN,                         -- 布尔类型
          customer_name             VARCHAR(200),                   -- 字符类型
          remarks_blob              BYTEA,                           -- 二进制类型
          open_date                 DATE,                            -- 日期类型
          last_transaction_ts        TIMESTAMP,                       -- 时间戳类型
          transaction_interval        TSTZRANGE,                      -- 范围类型 (带时区范围)
          customer_uuid              UUID,                            -- UUID 类型 :contentReference[oaicite:0]{index=0}
          metadata_json               JSONB,                           -- JSONB 类型 :contentReference[oaicite:1]{index=1}
          login_hll                   hll,                             -- HLL 类型 :contentReference[oaicite:2]{index=2}
          permission_bits              BIT VARYING(16),                 -- 位串类型 :contentReference[oaicite:3]{index=3}
          transaction_counts          INTEGER[],                       -- 数组类型 :contentReference[oaicite:4]{index=4}
          object_oid                   OID,                             -- 对象标识符类型 (OID) :contentReference[oaicite:5]{index=5}
          config_xml                    XML,                             -- XML 类型 :contentReference[oaicite:6]{index=6}
          acct_balance_double         DOUBLE PRECISION,              -- 浮点数 (双精度)
          small_balance                 SMALLINT                        -- 小整数
      );

      -- 插入一条模拟银行客户账户数据
      INSERT INTO bank_customer_account VALUES (
          1000000000001,                     -- customer_id
          12345678,                           -- account_number
          250000. 50,                          -- credit_limit
          TRUE,                               -- is_premium
          '李四-高端客户',                      -- customer_name
          E'\\xDEADBEEFCAFE',                  -- 备注 (bytea, 十六进制)
          DATE '2022-01-15',                   -- open_date
          TIMESTAMP '2025-11-17 09:45:30',     -- last_transaction_ts
          tstzrange(
             TIMESTAMP WITH TIME ZONE '2025-11-01 00:00:00+08',
             TIMESTAMP WITH TIME ZONE '2025-11-17 23:59:59+08'
          ),                                   -- transaction_interval
          '3f50f5a2-9d0b-4f3d-b244-9adbe1f12345', -- customer_uuid
          '{"preferred_channel":"mobile","alerts": ["sms","email"]}'::JSONB,  -- metadata_json
          hll_empty(),                         -- login_hll (初始 HLL)
          B'1011001110001111',                 -- permission_bits (16 位二进制)
          ARRAY[5, 10, 15],                     -- transaction_counts (示例数组)
          9999::OID,                           -- object_oid (示范一个 OID 值)
          '<settings><tier>gold</tier><region>asia</region></settings>'::XML,  -- config_xml
          12345. 6789,                          -- acct_balance_double
          32000                                -- small_balance
      );

      -- 查询所有列，验证插入
      SELECT * FROM bank_customer_account;
    steps:
      - action: 进入projectA(测试项目) -> 数据开发-周期任务
        expected: 进入成功
      - action: 创建gaussdb sql任务taskA, 执行建表语句后, 保存并发布
