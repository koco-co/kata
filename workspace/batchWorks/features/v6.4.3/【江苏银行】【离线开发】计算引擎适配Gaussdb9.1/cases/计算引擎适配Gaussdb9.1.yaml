        expected: 发布状态由「待发布」 -> 「发布成功」
      - action: 切换到projectB(生产项目) -> 数据开发-周期任务
        expected: 新增周期任务taskA, 任务内容与projectA(测试项目)中的taskA保持一致
      - action: 临时运行任务taskA后删除
        expected: 运行/删除成功, GaussDB 任务一键发布功能正常
      - action: 进入projectB(生产项目) -> 任务发布 -> 发布至本项目
        expected: 进入成功
      - action: 点击「导入发布包」, 选择zip文件${fileA}后, 点击「发布」按钮
        expected: 弹出「发布包校验」弹窗, 「数据源」需要手动配置, 其他配置均校验通过
