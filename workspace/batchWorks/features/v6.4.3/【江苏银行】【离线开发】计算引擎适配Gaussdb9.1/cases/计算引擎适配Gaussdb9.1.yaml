  - case_id: C0012
    title: 验证 GaussDB 任务支持系统函数
    priority: P0
    precondition: |-
      gaussdb建表语句
      -- 创建测试表
      DROP TABLE IF EXISTS customer_transactions;
      CREATE TABLE customer_transactions (
          customer_id       BIGINT,
          transaction_id     BIGINT,
          amount             NUMERIC(12,2),
          transaction_time   TIMESTAMP WITH TIME ZONE,
          channel            VARCHAR(50),
          tags               TEXT[],
          login_count_hll    hll,  -- 用 HLL 统计客户登录 / 交易来源
          remarks            TEXT
      );

      -- 插入一些示例数据
      INSERT INTO customer_transactions VALUES
          (1, 1001, 200.00, '2025-11-15 10:00:00+08', 'web', ARRAY['first', 'promo'], hll_add(hll_empty(), hll_hash_integer(1)), '首次登录'),
          (1, 1002, 150.00, '2025-11-16 12:10:00+08', 'mobile', ARRAY['repeat'], hll_add(hll_empty(), hll_hash_integer(2)), '常规交易'),
          (2, 2001, 300.00, '2025-11-15 09:00:00+08', 'web', ARRAY['vip'], hll_add(hll_empty(), hll_hash_integer(1)), 'VIP 客户交易'),
          (2, 2002, 450.00, '2025-11-17 14:30:00+08', 'mobile', ARRAY['vip', 'promo'], hll_add(hll_empty(), hll_hash_integer(2)), '促销交易'),
          (3, 3001, 500.00, '2025-11-17 08:05:00+08', 'atm', ARRAY['offline'], hll_add(hll_empty(), hll_hash_integer(3)), 'ATM 取款');

      WITH agg AS (
        SELECT
          customer_id,
          -- 聚合函数
          COUNT(*) AS txn_count,
          SUM(amount) AS total_amount,
          AVG(amount) AS avg_amount,
          MIN(amount) AS min_amount,
          MAX(amount) AS max_amount,
          MIN(transaction_time) AS first_txn_time,
          MAX(transaction_time) AS last_txn_time
        FROM customer_transactions
        GROUP BY customer_id
      )
      SELECT
        customer_id,
        txn_count,
        total_amount,
        avg_amount,
        min_amount,
        max_amount,

        -- 窗口函数
        ROW_NUMBER()     OVER (ORDER BY total_amount DESC)        AS rn_by_amt,
        RANK()           OVER (ORDER BY total_amount DESC)        AS rank_by_amount,
        DENSE_RANK()     OVER (ORDER BY total_amount DESC)        AS dense_rank_by_amount,
        FIRST_VALUE(total_amount) OVER (ORDER BY customer_id)     AS first_total_amount,
        LAST_VALUE(total_amount)  OVER (
          ORDER BY customer_id
          ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
        ) AS last_total_amount,
        PERCENT_RANK()   OVER (ORDER BY total_amount)              AS pct_rank_amount,

        -- 日期函数
        current_date                                               AS today,
        current_timestamp                                          AS now_ts,
        date_trunc('day', first_txn_time)                          AS first_txn_day,
        EXTRACT(YEAR FROM first_txn_time)                           AS first_txn_year,
        FLOOR( EXTRACT(EPOCH FROM (now_ts - first_txn_time)) / 3600 ) AS hours_since_first_txn

      FROM agg
      ORDER BY total_amount DESC;



      窗口函数：RANK()、ROW_NUMBER()、DENSE_RANK()、LAG、LEAD、FIRST_VALUE()、LAST_VALUE()、PERCENT_RANK()
      https://support.huaweicloud.com/distributed-devg-v8-gaussdb/gaussdb-12-0374.html

      聚集函数：sum(expression)、max(expression)、min(expression)、avg(expression)、count(expression)、count(*)
      https://support.huaweicloud.com/distributed-devg-v8-gaussdb/gaussdb-12-2648.html

      数组函数：array_except(anyarray, anyarray)、array_append(anyarray, anyelement)、array_prepend(anyelement, anyarray)、array_cat(anyarray, anyarray)
      https://support.huaweicloud.com/distributed-devg-v8-gaussdb/gaussdb-12-2645.html

      日期函数：current_date、current_timestamp、trunc(arg1, arg2)、year()、timediff()、subtime(expr1,expr2)
      https://support.huaweicloud.com/distributed-devg-v8-gaussdb/gaussdb-12-2620.html
    steps:
      - action: 进入「离线开发-数据开发-周期任务」页面
        expected: 进入成功
      - action: 新建 GaussDB SQL 任务
        expected: 创建成功
