meta:
  title: 【5.2】表生命周期统一
  requirement_id: "14895"
  case_module_id: "9647"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - 5.2表生命周期统一.xmind
cases:
  - case_id: C0001
    title: 验证【数据地图】-【数据表管理】修改表生命周期，生命周期同步更新并生成审计记录
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14895_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14895_c0001 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_14895_c0001 VALUES
           (1, '记录一'),
           (2, '记录二');
      5) test_table_14895_c0001 已同步至离线开发和数据资产，生命周期均为 9999 天
    steps:
      - action: 进入【数据地图 → 数据表管理】页面
        expected: 进入成功
      - action: 查询 test_table_14895_c0001
        expected: 初始生命周期显示 9999 天
      - action: 勾选 test_table_14895_c0001 并将生命周期批量修改为 3 天
        expected: 离线开发表列表生命周期显示 3 天
      - action: 打开 test_table_14895_c0001 单表编辑并将生命周期修改为 1 天
        expected: 离线开发表列表生命周期显示 1 天
      - action: 进入【元数据 → 元数据管理】页面并查看 test_table_14895_c0001
        expected: 生命周期显示 1 天
      - action: 进入【安全审计 → 离线开发】页面并查看该表记录
        expected: 审计新增两条「修改生命周期」记录，变更内容为「9999 天调整为 3 天」和「3 天调整为 1 天」
    tags: ["数据地图", "数据表管理"]

  - case_id: C0002
    title: 验证【数据源管理】同步元数据并修改表生命周期，生命周期同步更新并生成审计记录
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14895_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14895_c0002 (id BIGINT, name STRING, age INT);
         INSERT INTO ${SchemaA}.test_table_14895_c0002 VALUES
           (1, '黄娟', 30),
           (2, '周杰', 40),
           (3, '徐丽', 33);
      5) test_table_14895_c0002 尚未同步至离线开发和数据资产
    steps:
      - action: 进入【数据源管理】页面
        expected: 进入成功
      - action: 选择 ${DataSourceA} 并点击「同步元数据」
        expected: 打开同步元数据配置
      - action: 将同步范围设为 ${SchemaA}.test_table_14895_c0002，表类目设为「类目管理」，生命周期输入 9999 天并提交
        expected: 同步任务状态为「成功」
      - action: 进入【数据地图 → 数据表管理】页面并查询 test_table_14895_c0002
        expected: 表列表新增 test_table_14895_c0002，生命周期为 9999 天
      - action: 进入【元数据 → 元数据管理】页面并查询 test_table_14895_c0002
        expected: 表详情生命周期为 9999 天
      - action: 将 test_table_14895_c0002 生命周期批量修改为 3 天
        expected: 离线开发和元数据页面均显示 3 天，安全审计新增「9999 天调整为 3 天」记录
    tags: ["数据源管理"]

  - case_id: C0003
    title: 验证【数据开发】-【周期任务】新建任务建表并修改生命周期，生命周期同步更新并生成审计记录
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}，且不存在 ${SchemaA}.test_table_14895_c0003
      4) 创建并写入数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14895_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14895_c0003 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_14895_c0003 VALUES (1, '记录一'), (2, '记录二');
      5) 离线开发项目的默认表生命周期为 9999 天
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建 SparkSQL 周期任务并保存任务
        expected: 任务列表新增该任务
      - action: 执行建表和写入 SQL：CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14895_c0003 (id BIGINT, name STRING); INSERT INTO ${SchemaA}.test_table_14895_c0003 VALUES (1, '记录一'), (2, '记录二');
        expected: 表创建完成并写入 2 行记录
      - action: 执行 SELECT COUNT(*) FROM ${SchemaA}.test_table_14895_c0003
        expected: 查询结果为 2
      - action: 进入【数据地图 → 数据表管理】页面并查询 test_table_14895_c0003
        expected: 表列表新增 test_table_14895_c0003，生命周期为 9999 天
      - action: 将 test_table_14895_c0003 生命周期由 9999 天修改为 1 天并保存
        expected: 离线开发表列表生命周期显示 1 天
      - action: 进入【元数据 → 元数据管理】页面并查看 test_table_14895_c0003
        expected: 生命周期显示 1 天，安全审计新增「9999 天调整为 1 天」记录
    tags: ["数据开发", "周期任务"]

  - case_id: C0004
    title: 验证【安全审计】-【离线开发】多次修改生命周期后筛选，按时间倒序展示三条变更记录
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14895_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14895_c0004 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_14895_c0004 VALUES
           (1, '记录一'),
           (2, '记录二');
      5) test_table_14895_c0004 已纳管且生命周期为 9999 天
    steps:
      - action: 进入【安全审计 → 离线开发】页面
        expected: 进入成功
      - action: 进入【数据地图 → 数据表管理】页面
        expected: 进入成功
      - action: 将 test_table_14895_c0004 生命周期修改为 500 天并保存
        expected: Toast提示:「保存成功」,生命周期显示 500 天
      - action: 将 test_table_14895_c0004 生命周期修改为 50 天并保存
        expected: Toast提示:「保存成功」,生命周期显示 50 天
      - action: 将 test_table_14895_c0004 生命周期修改为 1 天并保存
        expected: Toast提示:「保存成功」,生命周期显示 1 天
      - action: 进入【安全审计 → 离线开发】页面并按操作对象「表」、动作「修改生命周期」筛选
        expected: 审计按时间倒序展示三条记录，变更内容依次为「50 天调整为 1 天」「500 天调整为 50 天」「9999 天调整为 500 天」
      - action: 在修改为 1 天后的第 2 个自然日查询 test_table_14895_c0004
        expected: 离线开发与元数据页面均不再展示该表
    tags: ["安全审计", "离线开发"]
