      - action: 检查「安全审计-离线开发」的审计日志列表记录
        expected: "存在一条「动作」为「修改生命周期」的操作记录, 详细内容为: 更新${tableA}的生命周期，由 3 天调整为 1 天"
  - case_id: C0004
    title: 验证审计日志-离线开发正确展示表生命周期变更记录
    priority: P0
    precondition: |-
      1) 存在Hive数据源${datasourceA}, 该数据源下有数据库${schemaA}, 该数据库下有数据表${tableA}

      2) 离线开发-数据地图-数据表管理中已存在表${tableA}, 生命周期为9999天
    steps:
      - action: 进入【离线开发 → 审计日志】页面
        expected: 已进入【离线开发 → 审计日志】页面，显示页面标题与主要操作区域
      - action: 进入离线开发-数据地图-数据表管理-我管理的表
        expected: 进入成功
      - action: 查看表名为${tableA}的生命周期
        expected: 生命周期为9999天
      - action: 依次编辑并保存表${tableA}的生命周期, 由9999天 -> 500天 -> 50天 -> 1天
        expected: 生命周期变更成功
      - action: 进入「离线开发-安全审计-离线开发」页面
        expected: |-
          存在三条「动作」为「修改生命周期」的操作记录, 详细内容依次为:
          1) 更新${tableA}的生命周期，由 50 天调整为 1 天
          2) 更新${tableA}的生命周期，由 500 天调整为 50 天
          3) 更新${tableA}的生命周期，由 9999 天调整为 500 天
      - action: 「按操作对象筛选」选择「表」后, 展开「安全审计-离线开发-按动作筛选」选项
        expected: 新增筛选项「修改生命周期」
      - action: 选择「修改生命周期」后, 检查筛选结果
        expected: 仅展示操作对象为「表」, 且动作为「修改生命周期」的记录
      - action: 等待一天后, 进入「离线开发-数据地图-数据表管理-我管理的表」, 检查表${tableA}
        expected: 表${tableA}不存在 (生命周期已过期)
