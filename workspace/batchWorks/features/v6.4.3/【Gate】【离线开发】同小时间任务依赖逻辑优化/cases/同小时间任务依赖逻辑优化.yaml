meta:
  title: 【Gate】同小时间任务依赖逻辑优化
  requirement_id: "15102"
  case_module_id: "9646"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - 同小时间任务依赖逻辑优化.xmind
cases:
  - case_id: C0001
    title: 验证【项目管理】-【操作设置】编辑任务依赖周期默认值，依赖方式切换为优先寻找同小时上游实例时隐藏偏移配置
    priority: P0
    precondition: |-
      1) 存在小时调度周期任务 TaskP、hour_downstream_c0001
      2) hour_downstream_c0001 依赖 TaskP
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 查看「任务依赖周期默认值」并点击「编辑」
        expected: 打开「任务依赖周期默认值配置」弹窗，「依赖周期」默认选中「默认」
      - action: 将「依赖周期」切换为「自定义」
        expected: 展示「依赖方式」且默认选中「基于默认依赖周期的偏移」，同时展示「偏移方向」「偏移量」
      - action: 将「依赖方式」切换为「优先寻找同小时的上游实例」
        expected: 「偏移方向」「偏移量」隐藏
      - action: 将鼠标悬停在依赖方式说明图标上
        expected: 提示仅在所编辑任务与上游任务均为小时调度时生效，任一任务为非小时调度时使用系统默认依赖规则
    tags: ["项目管理", "操作设置"]

  - case_id: C0002
    title: 验证【数据开发】-【周期任务】添加依赖并切换优先寻找同小时上游实例，选择周期展示且保存回显
    priority: P0
    precondition: |-
      1) 项目的「任务依赖周期默认值」为「默认」
      2) 存在小时调度周期任务 TaskQ、hour_downstream_c0002
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 打开 hour_downstream_c0002 的「调度属性 → 任务间依赖」，点击「添加依赖」并选择 TaskQ
        expected: 「依赖周期」默认选中「默认」，依赖推荐列表展示「依赖周期」「依赖方式」「选择周期」三列
      - action: 将「依赖周期」切换为「自定义」
        expected: 展示「依赖方式」，选项为「基于默认依赖周期的偏移」「优先寻找同小时的上游实例」，默认选中前者
      - action: 配置偏移依赖：依赖方式选择「基于默认依赖周期的偏移」，偏移方向选择 T-，偏移量输入 1
        expected: 「选择周期」展示 T-1
      - action: 将依赖方式切换为「优先寻找同小时的上游实例」
        expected: 偏移配置隐藏，「选择周期」展示「-」
      - action: 查看依赖推荐列表并保存任务
        expected: |-
          1) 推荐列表最多展示10行，超过10行时支持纵向滚动
          2) 手动依赖和自动依赖均展示依赖周期、依赖方式、选择周期
          3) 保存后任务间依赖列表回显 TaskQ、依赖周期「自定义」、依赖方式「优先寻找同小时的上游实例」、选择周期「-」
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0003
    title: 验证【数据开发】-【周期任务】项目依赖默认值为自定义偏移，添加依赖回显默认依赖周期与偏移
    priority: P1
    precondition: |-
      1) 项目的「任务依赖周期默认值」为「自定义」
      2) 项目默认依赖方式为「基于默认依赖周期的偏移」，偏移方向为 T-，偏移量为 1
      3) 存在小时调度周期任务 TaskR、hour_downstream_c0003
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 打开 hour_downstream_c0003 的「调度属性 → 任务间依赖」，点击「添加依赖」并选择 TaskR
        expected: 依赖周期默认展示「自定义」，依赖方式默认展示「基于默认依赖周期的偏移」，选择周期默认展示 T-1
      - action: 保存任务后再次打开 hour_downstream_c0003 的依赖配置
        expected: 依赖周期、依赖方式、选择周期分别回显「自定义」「基于默认依赖周期的偏移」「T-1」
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0004
    title: 验证【数据开发】-【周期任务】项目默认依赖方式为优先寻找同小时上游实例，添加依赖回显默认配置
    priority: P1
    precondition: |-
      1) 项目的「任务依赖周期默认值」为「自定义」
      2) 项目默认依赖方式为「优先寻找同小时的上游实例」
      3) 存在小时调度周期任务 TaskS、hour_downstream_c0004
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 打开 hour_downstream_c0004 的「调度属性 → 任务间依赖」，点击「添加依赖」并选择 TaskS
        expected: 依赖周期默认展示「自定义」，依赖方式默认展示「优先寻找同小时的上游实例」，选择周期展示「-」
      - action: 保存任务后再次打开 hour_downstream_c0004 的依赖配置
        expected: 依赖周期、依赖方式、选择周期分别回显「自定义」「优先寻找同小时的上游实例」「-」
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0005
    title: 验证【数据开发】-【周期任务】上游非小时调度任务时，优先寻找同小时上游实例置灰并提示限制
    priority: P1
    precondition: |-
      1) 项目的默认依赖方式为「优先寻找同小时的上游实例」
      2) 存在日调度周期任务 TaskA
      3) 存在小时调度周期任务 TaskB
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 打开 TaskB 的「调度属性 → 任务间依赖」，点击「添加依赖」并选择 TaskA
        expected: 依赖周期使用系统默认值「默认」，「优先寻找同小时的上游实例」置灰且不可选择
      - action: 将鼠标悬停在置灰选项上
        expected: 提示所编辑任务与上游任务必须均为小时调度
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0006
    title: 验证【数据开发】-【周期任务】单级依赖为优先寻找同小时上游实例时，双方调度周期改为非小时均阻止保存
    priority: P0
    precondition: |-
      1) 存在小时调度周期任务 TaskT、hour_downstream_c0006
      2) hour_downstream_c0006 依赖 TaskT，依赖方式为「优先寻找同小时的上游实例」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 将 TaskT 调度周期改为「分钟」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 TaskT 调度周期改为「天」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 TaskT 调度周期改为「周」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 TaskT 调度周期改为「月」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 TaskT 调度周期改为「Cron表达式」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 hour_downstream_c0006 调度周期改为「自定义调度周期」并保存
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0007
    title: 验证【数据开发】-【周期任务】双任务同小时间隔匹配，补数据与次日实例依赖关系一致
    priority: P0
    precondition: |-
      1) 存在小时调度周期任务 TaskU，运行区间 11:50 至 14:50，间隔 1 小时
      2) 存在小时调度周期任务 TaskC，运行区间 10:30 至 13:30，间隔 1 小时
      3) TaskC 依赖 TaskU，依赖方式为「优先寻找同小时的上游实例」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 提交 TaskU、TaskC
        expected: 两个任务状态均为「已提交」且依赖关系展示 TaskU → TaskC
      - action: 前往【运维中心 → 周期任务 → 周期任务管理】，对 TaskU 执行「当前任务及下游」补数据，业务日期选择连续2天
        expected: |-
          1) 同小时依赖：11:50 → 11:30、12:50 → 12:30、13:50 → 13:30
          2) 最近实例回退：当日14:50 → 次日10:30
          3) 当日10:30无可匹配上游实例并独立运行
      - action: 在第二个自然日查看自动生成的周期任务实例依赖
        expected: |-
          1) 同小时依赖：11:50 → 11:30、12:50 → 12:30、13:50 → 13:30
          2) 最近实例回退：当日14:50 → 次日10:30
          3) 当日10:30无可匹配上游实例并独立运行
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0008
    title: 验证【数据开发】-【周期任务】双任务上游间隔小于下游，实例匹配回退关系正确
    priority: P1
    precondition: |-
      1) 存在小时调度周期任务 TaskV，运行区间 22:50 至次日01:50，间隔 1 小时
      2) 存在小时调度周期任务 TaskD，运行区间 21:50 至次日03:50，间隔 2 小时
      3) TaskD 依赖 TaskV，依赖方式为「优先寻找同小时的上游实例」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 提交两个任务，并对 TaskV 执行「当前任务及下游」补数据，业务日期选择连续2天
        expected: |-
          1) 同小时依赖：当日23:50 → 当日23:50、次日01:50 → 次日01:50
          2) 最近实例回退：次日01:50 → 次日03:50
          3) 当日21:50无可匹配上游实例并独立运行
      - action: 在第二个自然日查看自动生成的周期任务实例依赖
        expected: |-
          1) 同小时依赖和最近实例回退关系与补数据批次一致
          2) 当日21:50无可匹配上游实例并独立运行
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0009
    title: 验证【数据开发】-【周期任务】双任务上游间隔大于下游，实例匹配回退关系正确
    priority: P1
    precondition: |-
      1) 存在小时调度周期任务 TaskW，运行区间 21:00 至次日03:00，间隔 2 小时
      2) 存在小时调度周期任务 TaskE，运行区间 20:01 至次日02:01，间隔 1 小时
      3) TaskE 依赖 TaskW，依赖方式为「优先寻找同小时的上游实例」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 提交两个任务，并对 TaskW 执行「当前任务及下游」补数据，业务日期选择连续2天
        expected: |-
          1) 同小时依赖：21:00 → 21:01、23:00 → 23:01、次日01:00 → 次日01:01
          2) 最近实例回退：21:00 → 22:01、23:00 → 次日00:01、次日01:00 → 次日02:01、次日03:00 → 再次日20:01
          3) 当日20:01无可匹配上游实例并独立运行
      - action: 在第二个自然日查看自动生成的周期任务实例依赖
        expected: |-
          1) 同小时依赖和最近实例回退关系与补数据批次一致
          2) 当日20:01无可匹配上游实例并独立运行
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0010
    title: 验证【数据开发】-【周期任务】多级三组依赖为优先寻找同小时上游实例时，任务调度周期改为非小时均阻止保存
    priority: P1
    precondition: |-
      1) 存在小时调度周期任务 TaskF、hour_task_b_c0010、hour_task_c_c0010
      2) 依赖关系为 TaskF → hour_task_b_c0010、TaskF → hour_task_c_c0010、hour_task_b_c0010 → hour_task_c_c0010
      3) 三组依赖方式均为「优先寻找同小时的上游实例」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 将 TaskF 调度周期改为「分钟」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 hour_task_b_c0010 调度周期改为「天」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 hour_task_c_c0010 调度周期改为「周」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 TaskF 调度周期改为「月」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 hour_task_b_c0010 调度周期改为「Cron表达式」并保存，校验后恢复为「小时」
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
      - action: 将 hour_task_c_c0010 调度周期改为「自定义调度周期」并保存
        expected: 阻止保存并提示「依赖方式选择优先同小时依赖，当前任务及其上游任务的调度周期必须为‘小时’，请修改后再保存」
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0011
    title: 验证【数据开发】-【周期任务】三任务同小时间隔匹配，多级依赖回退关系正确
    priority: P1
    precondition: |-
      1) 存在小时调度周期任务 TaskG，运行区间 11:50 至 14:50，间隔 1 小时
      2) 存在小时调度周期任务 TaskJ，运行区间 10:30 至 13:30，间隔 1 小时
      3) 存在小时调度周期任务 TaskM，运行区间 09:30 至 11:30，间隔 1 小时
      4) 依赖关系为 A → B、A → C、B → C，依赖方式均为「优先寻找同小时的上游实例」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 提交三个任务，并对 TaskG 执行「当前任务及下游」补数据，业务日期选择连续2天
        expected: |-
          1) A → B 同小时依赖：11:50 → 11:30、12:50 → 12:30、13:50 → 13:30
          2) A → C 同小时依赖：11:50 → 11:30
          3) B → C 同小时依赖：10:30 → 10:30、11:30 → 11:30
          4) 最近实例回退：A当日14:50 → B次日10:30、A当日14:50 → C次日09:30和10:30、B当日13:30 → C次日09:30
          5) B当日10:30、C当日09:30和10:30在无可匹配上游时独立运行
      - action: 在第二个自然日查看自动生成的周期任务实例依赖
        expected: 多级同小时依赖、最近实例回退和独立运行关系与补数据批次一致
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0012
    title: 验证【数据开发】-【周期任务】三任务上游间隔小于下游，多级依赖回退关系正确
    priority: P1
    precondition: |-
      1) 存在小时调度周期任务 TaskH，运行区间 11:15 至 14:15，间隔 1 小时
      2) 存在小时调度周期任务 TaskK，运行区间 10:10 至 16:10，间隔 2 小时
      3) 存在小时调度周期任务 TaskN，运行区间 09:05 至 18:05，间隔 3 小时
      4) 依赖关系为 A → B、A → C、B → C，依赖方式均为「优先寻找同小时的上游实例」
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 提交三个任务，并对 TaskH 执行「当前任务及下游」补数据，业务日期选择连续2天
        expected: |-
          1) 同小时依赖：A12:15 → B12:10、A12:15 → C12:05、A14:15 → B14:10、B12:10 → C12:05
          2) A最近实例回退：A14:15 → B16:10和次日10:10，A14:15 → C15:05、18:05和次日09:05
          3) B最近实例回退：B14:10 → C15:05，B16:10 → C18:05和次日09:05
          4) A11:15、A13:15在无可匹配下游时独立运行
      - action: 在第二个自然日查看自动生成的周期任务实例依赖
        expected: 多级同小时依赖、最近实例回退和独立运行关系与补数据批次一致
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0013
    title: 验证【数据开发】-【周期任务】三任务上游间隔大于下游，多级依赖回退关系正确
    priority: P1
    precondition: |-
      1) 存在小时调度周期任务 TaskI，运行区间 09:00 至 18:00，间隔 3 小时
      2) 存在小时调度周期任务 TaskL，运行区间 10:01 至 16:01，间隔 2 小时
      3) 存在小时调度周期任务 TaskO，运行区间 11:02 至 14:02，间隔 1 小时
