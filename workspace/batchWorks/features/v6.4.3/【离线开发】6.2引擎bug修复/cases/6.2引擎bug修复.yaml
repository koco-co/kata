          目标类型：Hive
          目标数据源：${DataSourceB}
          目标数据库：${SchemaB}
          目标表：test_table_15008_c0003_target_01
          建表方式：一键生成目标表
          写入模式：覆盖
          字段映射：同名映射
        expected: 映射区展示 id、name、amount 三个同名字段且目标表状态为「待创建」
      - action: 保存并运行 TaskE
        expected: |-
          1) 任务运行状态：「成功」
          2) 执行SQL：SELECT COUNT(*) FROM ${SchemaB}.test_table_15008_c0003_target_01;
             查询结果：3
    tags: ["数据开发", "周期任务"]

