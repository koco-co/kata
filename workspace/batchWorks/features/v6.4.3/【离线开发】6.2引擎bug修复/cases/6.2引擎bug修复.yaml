meta:
  title: 【6.2】引擎bug修复
  requirement_id: "15008"
  case_module_id: "9645"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - 6.2引擎bug修复.xmind
cases:
  - case_id: C0001
    title: 验证【数据开发】-【周期任务】新建并运行HiveSQL任务，展示两分区统计且每分区行数均为1
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15008_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15008_c0001 (
           id BIGINT,
           name STRING
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15008_c0001 PARTITION (dt)
         SELECT 1, 'previous_day', date_format(date_sub(current_date(), 1), 'yyyy-MM-dd')
         UNION ALL
         SELECT 2, 'current_day', date_format(current_date(), 'yyyy-MM-dd');
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          新建HiveSQL周期任务：
          任务名称：TaskA
          数据源：${DataSourceA}
          SQL：SELECT dt, COUNT(*) AS row_count FROM ${SchemaA}.test_table_15008_c0001 GROUP BY dt ORDER BY dt;
        expected: 任务编辑器展示分区统计SQL且语法检查无错误
      - action: 保存并运行 TaskA
        expected: |-
          1) 任务运行状态：「成功」
          2) 查询结果展示前一日、当日两个分区且每个分区的 row_count 均为 1
    tags: ["数据开发", "周期任务"]

  - case_id: C0002
    title: 验证【数据开发】-【周期任务】新建并运行数据同步任务，目标表同步3行数据(MySQL→Hive)
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 数据源 A 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建MySQL源表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15008_c0002_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15008_c0002_source_01 (
           id BIGINT PRIMARY KEY,
           name VARCHAR(64),
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_15008_c0002_source_01 VALUES
           (1, 'alpha', 10.00),
           (2, 'beta', 20.00),
           (3, 'gamma', 30.00);
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：Hive2.x
      7) 数据源 B 存在数据库：${SchemaB}
      8) 在 ${SchemaB} 创建写入权限校验表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15008_c0002_dimension_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15008_c0002_dimension_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaB}.test_table_15008_c0002_dimension_01 VALUES (1, 'permission_check');
      9) ${SchemaB} 中不存在 test_table_15008_c0002_target_01
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          新建数据同步周期任务：
          任务名称：TaskD
          来源类型：MySQL
          来源数据源：${DataSourceA}
          来源数据库：${SchemaA}
          来源表：test_table_15008_c0002_source_01
          目标类型：Hive
          目标数据源：${DataSourceB}
          目标数据库：${SchemaB}
          目标表：test_table_15008_c0002_target_01
          建表方式：一键生成目标表
          写入模式：覆盖
          字段映射：同名映射
        expected: 映射区展示 id、name、amount 三个同名字段且目标表状态为「待创建」
      - action: 保存并运行 TaskD
        expected: |-
          1) 任务运行状态：「成功」
          2) 执行SQL：SELECT COUNT(*) FROM ${SchemaB}.test_table_15008_c0002_target_01;
             查询结果：3
    tags: ["数据开发", "周期任务"]

  - case_id: C0003
    title: 验证【数据开发】-【周期任务】新建并运行数据同步任务，目标表同步3行数据(StarRocks→Hive)
    priority: P2
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：StarRocks3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建StarRocks源表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15008_c0003_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15008_c0003_source_01 (
           id BIGINT,
           name VARCHAR(64),
           amount DECIMAL(10,2)
         ) PRIMARY KEY (id)
         DISTRIBUTED BY HASH(id) BUCKETS 1
         PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_15008_c0003_source_01 VALUES
           (1, 'alpha', 10.00),
           (2, 'beta', 20.00),
