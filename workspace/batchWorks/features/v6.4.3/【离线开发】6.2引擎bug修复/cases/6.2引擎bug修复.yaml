         DROP TABLE IF EXISTS ${SchemaB}.test_table_15008_c0003_dimension_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15008_c0003_dimension_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaB}.test_table_15008_c0003_dimension_01 VALUES (1, 'permission_check');
      9) ${SchemaB} 中不存在 test_table_15008_c0003_target_01
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          新建数据同步周期任务：
          任务名称：TaskE
          来源类型：StarRocks
          来源数据源：${DataSourceA}
          来源数据库：${SchemaA}
