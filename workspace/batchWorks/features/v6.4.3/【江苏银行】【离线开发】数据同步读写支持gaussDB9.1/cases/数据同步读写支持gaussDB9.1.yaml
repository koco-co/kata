  - case_id: C0011
    title: 验证【数据源】-【整库同步】GaussDB作为来源整库同步，任务运行成功且目标表数据一致
    priority: P0
    precondition: |-
      1) 控制台已经配置对应组件
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击 GaussDB 操作列「整库同步」按钮
        expected: 进入整库同步界面
      - action: |-
          勾选需要整库同步的表
          选择数据同步目标（如 mysql）、schema
          同步方式：全量
          并发配置：整批上传
          保存目录：默认
          点击发布任务
        expected: 任务发布完成
      - action: 进入数据开发界面查看对应目录下内容
        expected: 包含整库同步所创建的数据同步任务，表名为所配置表表名，目标库新建对应表
      - action: 数据同步任务点击临时运行
        expected: 任务运行成功
      - action: 查看目标表数据
        expected: 成功从 GaussDB 中表同步过来，包括各类型字段值
    tags:
      - 数据源
      - 整库同步

