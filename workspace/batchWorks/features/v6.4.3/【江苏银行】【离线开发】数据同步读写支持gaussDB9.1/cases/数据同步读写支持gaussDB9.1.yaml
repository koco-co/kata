      - action: 点击「确定」
        expected: 取消引入成功
    tags:
      - 数据源
      - 取消引入

  - case_id: C0006
    title: 验证【数据源】筛选GaussDB类型数据源，列表仅展示对应数据源且支持名称搜索
    priority: P2
    precondition: |-
      1) 离线测试项目中已经成功引入 GaussDB 数据源
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击数据源页面筛选按钮
        expected: 显示数据源类型列表，新增 GaussDB 数据源类型，顺序与数据源中心一致
      - action: 选中 GaussDB，点击「确定」
        expected: GaussDB 类型的数据源被成功筛选出来，对应信息正确回显，类型正确展示 GaussDB
      - action: 在搜索框中输入 GaussDB 名称
        expected: 满足条件的 GaussDB 数据源被筛选出来
    tags:
      - 数据源

  - case_id: C0007
    title: 验证【数据源】配置GaussDB数据源映射关系，发布目标选择后映射状态为已配置
    priority: P0
    precondition: |-
      1) 离线测试项目与生产项目中已经成功引入 GaussDB 数据源
      2) 当前项目（测试项目）已经成功绑定发布目标项目
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击 GaussDB 数据源操作列的「映射配置」
        expected: 操作支持取消引入和映射配置
      - action: 点击「映射配置」
        expected: 弹出 GaussDB 数据源映射配置弹窗，在本项目文本框下显示的为用户名
      - action: 点击「发布目标」
        expected: 下拉弹窗中显示出生产项目中成功引入的 GaussDB 数据源
      - action: 选择其中一个，点击「确定」
        expected: 映射配置弹窗关闭，GaussDB 数据源映射配置关系设置成功，映射关系变更为「已配置」
    tags:
      - 数据源

  - case_id: C0008
    title: 验证【数据源】生产项目中GaussDB数据源操作列仅展示取消引入，无映射配置选项
    priority: P1
    precondition: |-
