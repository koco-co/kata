meta:
  title: 【江苏银行】数据同步读写支持gaussDB9.1
  requirement_id: '14912'
  case_module_id: '9648'
  imports:
  - 202511-离线开发v6.4.3.xmind
  exports:
  - 数据同步读写支持gaussDB9.1.xmind
cases:
  - case_id: C0001
    title: 验证【数据源】-【引入数据源】引入GaussDB数据源，列表新增且类型展示GaussDB
    priority: P1
    precondition: |-
      1) 已成功进入测试项目
      2) 数据源中心存在授权给离线计算的 GaussDB 数据源
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击「引入数据源」
        expected: 打开引入数据源弹窗并展示数据源列表
      - action: 点击数据源类型下拉框
        expected: 下拉选项包含 GaussDB
      - action: 选择 GaussDB 类型的数据源
        expected: GaussDB 的对应信息在离线项目页面中正确回显
      - action: 选中 GaussDB 数据源，点击「确定」
        expected: Toast提示:「引入成功」,弹窗关闭且列表新增该 GaussDB 数据源
    tags:
      - 数据源
      - 引入数据源

  - case_id: C0002
    title: 验证【平台管理】-【数据源中心】修改GaussDB的jdbc与高可用配置，数据同步任务中信息同步更新
    priority: P0
    precondition: |-
      1) 离线测试项目中已经成功引入 GaussDB 数据源
    steps:
      - action: 进入【平台管理 → 数据源中心】页面
        expected: 进入成功
      - action: 编辑已经被任务引用的 GaussDB 数据源，修改 jdbc、高可用配置，查看离线数据同步任务中对应的 GaussDB 信息
        expected: 离线数据同步任务中的 GaussDB 数据源信息、高可用配置同步修改
    tags:
      - 平台管理
      - 数据源中心

  - case_id: C0003
    title: 验证【平台管理】-【数据源中心】修改GaussDB的描述与jdbc，离线数据源信息同步更新
    priority: P1
    precondition: |-
      1) 离线测试项目中已经成功引入 GaussDB 数据源
    steps:
      - action: 进入【平台管理 → 数据源中心】页面
        expected: 进入成功
      - action: 编辑已经引入到离线项目中的 GaussDB 数据源，修改描述、jdbc 等，查看离线中对应的 GaussDB 数据源信息
        expected: 离线中的 GaussDB 数据源信息同步修改
    tags:
      - 平台管理
      - 数据源中心

  - case_id: C0004
    title: 验证【数据源】取消已被任务使用的GaussDB数据源引入，弹二次确认且取消失败
    priority: P1
    precondition: |-
      1) 存在已被任务使用的 GaussDB 数据源
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击已被任务使用的 GaussDB 数据源操作列的「取消引入」
        expected: 弹出二次确认弹窗
      - action: 点击「确定」
        expected: 取消引入失败，页面弹出对应的提示信息
    tags:
      - 数据源
      - 取消引入

  - case_id: C0005
    title: 验证【数据源】取消未被任务使用的GaussDB数据源引入，弹二次确认且取消成功
    priority: P1
    precondition: |-
      1) 已成功进入测试项目
      2) 数据源中心存在授权给离线计算的 GaussDB 数据源，且该数据源未在离线任务中使用
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击未被使用的 GaussDB 数据源操作列的「取消引入」
