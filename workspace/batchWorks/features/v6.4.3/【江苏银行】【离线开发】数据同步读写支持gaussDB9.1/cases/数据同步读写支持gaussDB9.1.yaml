        expected: 进入成功
      - action: 进入生产项目，点击 GaussDB 数据源操作列的「操作」
        expected: 操作支持取消引入，无映射配置选项
    tags:
      - 数据源

  - case_id: C0009
    title: 验证【项目管理】-【创建项目】勾选GaussDB数据源创建项目，数据源列表新增对应meta数据源
    priority: P0
    precondition: |-
