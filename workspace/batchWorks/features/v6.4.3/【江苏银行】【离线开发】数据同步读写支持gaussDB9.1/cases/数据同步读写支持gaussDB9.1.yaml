  - case_id: C0014
    title: 验证【数据开发】-【数据同步】向导模式配置GaussDB来源表并数据预览，展示过滤后前三条数据
    priority: P0
    precondition: |-
      1) 当前项目中已经成功引入 GaussDB 数据源
      2) GaussDB 中存在分区表 test_fenqu_001，按业务日期 bir 分区并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS test_fenqu_001;
         CREATE TABLE IF NOT EXISTS test_fenqu_001 (id INT, name VARCHAR(255)) PARTITIONED BY (bir STRING);
         INSERT INTO test_fenqu_001 PARTITION (bir)
         SELECT 1, 'mengfei', date_format(date_sub(current_date(), 1), 'yyyy-MM-dd')
         UNION ALL
         SELECT 2, 'kako', date_format(date_sub(current_date(), 1), 'yyyy-MM-dd')
         UNION ALL
         SELECT 3, 'lala', date_format(current_date(), 'yyyy-MM-dd')
         UNION ALL
         SELECT 4, 'puxi', date_format(current_date(), 'yyyy-MM-dd');
    steps:
      - action: 进入【数据开发 → 数据同步】页面
        expected: 进入成功
      - action: 新建向导模式的数据同步任务
        expected: 新建成功
      - action: 配置数据来源为 GaussDB 数据源，选择表 test_fenqu_001
        expected: 表配置成功
      - action: 数据过滤输入 id > 1，点击数据预览按钮
        expected: 下拉展示当前所选表 id > 1 的前三条数据
    tags:
      - 数据开发
      - 数据同步
      - 数据预览

  - case_id: C0015
    title: 验证【数据开发】-【数据同步】向导模式自定义sql读取GaussDB同步，任务运行成功且目标表数据一致
    priority: P1
    precondition: |-
      1) 当前项目中已经成功引入 GaussDB 数据源
      2) GaussDB 中存在表 test_zidingyi_001、test_zidingyi_002，建表语句为：
         DROP TABLE IF EXISTS test_zidingyi_001;
         CREATE TABLE IF NOT EXISTS test_zidingyi_001 (
           order_header_id STRING COMMENT '订单头id',
           order_date BIGINT COMMENT '订单日期',
           shop_id STRING COMMENT '店铺id',
           customer_id STRING COMMENT '客户id',
           order_status BIGINT COMMENT '订单状态',
           pay_date DATE COMMENT '支付日期',
           pay_boolen BOOLEAN COMMENT '是否支付',
           pay_decli DECIMAL(10,2) COMMENT '支付金额'
         ) COMMENT '销售订单明细表';
         DROP TABLE IF EXISTS test_zidingyi_002;
         CREATE TABLE IF NOT EXISTS test_zidingyi_002 (
           order_header_id STRING COMMENT '订单头id',
           order_date BIGINT COMMENT '订单日期',
           shop_id STRING COMMENT '店铺id',
           customer_id STRING COMMENT '客户id',
           order_status BIGINT COMMENT '订单状态',
           pay_date DATE COMMENT '支付日期',
           pay_boolen BOOLEAN COMMENT '是否支付',
           pay_decli DECIMAL(10,2) COMMENT '支付金额'
         ) COMMENT '销售订单明细表';
      3) test_zidingyi_001 插入 10 行数据：
         INSERT INTO test_zidingyi_001 VALUES
           ('OH001', 20250101, 'S001', 'C001', 1, '2025-01-02', TRUE, 199.99),
           ('OH002', 20250102, 'S002', 'C002', 1, '2025-01-03', TRUE, 59.50),
           ('OH003', 20250103, 'S001', 'C003', 0, NULL, FALSE, 0.00),
           ('OH004', 20250104, 'S003', 'C004', 2, '2025-01-05', TRUE, 350.75),
           ('OH005', 20250105, 'S002', 'C005', 1, '2025-01-06', TRUE, 120.00),
           ('OH006', 20250106, 'S004', 'C006', 3, NULL, FALSE, 0.00),
           ('OH007', 20250107, 'S003', 'C007', 1, '2025-01-08', TRUE, 499.00),
           ('OH008', 20250108, 'S002', 'C008', 0, NULL, FALSE, 0.00),
           ('OH009', 20250109, 'S005', 'C009', 2, '2025-01-10', TRUE, 80.20),
           ('OH010', 20250110, 'S001', 'C010', 1, '2025-01-11', TRUE, 260.45);
      4) 查询 sql 内容：
         SELECT * FROM test_zidingyi_001;
         SELECT order_header_id, customer_id, pay_decli FROM test_zidingyi_001 WHERE pay_boolen = TRUE;
         SELECT shop_id, SUM(pay_decli) AS total_amount, COUNT(*) AS order_count FROM test_zidingyi_001 WHERE pay_boolen = TRUE GROUP BY shop_id;
         SELECT order_header_id, customer_id, pay_decli FROM test_zidingyi_001 ORDER BY pay_decli DESC;
         SELECT order_header_id, customer_id, pay_decli FROM test_zidingyi_001 WHERE pay_decli BETWEEN 100 AND 300;
    steps:
      - action: 进入【数据开发 → 数据同步】页面
        expected: 进入成功
      - action: 新建向导模式的数据同步任务
        expected: 新建成功
      - action: |-
          选择数据来源
          勾选自定义sql
          输入 sql 内容：前置条件查询 sql 依次校验
          点击下一步
        expected: |-
          1) 进入选择目标界面
          2) 执行SQL：SELECT * FROM test_zidingyi_001;
             查询结果：10 行
      - action: |-
          选择数据目标
          数据库
          schema
          表名：test_zidingyi_002
          点击下一步
        expected: |-
          进入选择字段映射界面
          源字段为源表的所有字段
          可正常进行添加常量、修改、删除、字段转换等
      - action: 配置同字段映射，点击下一步
        expected: 进入通道控制页面
      - action: 点击下一步，点击保存，进行临时运行
        expected: 配置以及环境无误的话，任务成功
      - action: 查看目标表数据
        expected: 成功从 GaussDB 中表同步过来，包括各类型字段值
    tags:
      - 数据开发
      - 数据同步
      - 自定义sql

