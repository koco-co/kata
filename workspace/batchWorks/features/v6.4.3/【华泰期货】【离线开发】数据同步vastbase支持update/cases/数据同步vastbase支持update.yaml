  - case_id: C0007
    title: 验证【数据开发】-【周期任务】MySQL 来源 Vastbase 目标，主键冲突选择 insert 任务运行成功
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建 MySQL 源表并插入冲突数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15051_c0007_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15051_c0007_source_01 (id BIGINT PRIMARY KEY, name VARCHAR(64));
         INSERT INTO ${SchemaA}.test_table_15051_c0007_source_01 VALUES (1, 'Alice_new');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：Vastbase
      7) 数据源 B 存在数据库：${SchemaB}
      8) 创建 Vastbase 目标表并插入同主键数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15051_c0007_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15051_c0007_target_01 (id BIGINT PRIMARY KEY, name VARCHAR(64));
         INSERT INTO ${SchemaB}.test_table_15051_c0007_target_01 VALUES (1, 'Alice_old');
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建 MySQL 到 Vastbase 周期同步任务，主键冲突选择「insert」，脏数据阈值设置为 0，保存并运行
        expected: 任务状态为「失败」，日志包含目标表主键 id=1 冲突信息
      - action: 在 Vastbase 执行 SELECT id, name FROM ${SchemaB}.test_table_15051_c0007_target_01;
        expected: 查询结果为 (1, Alice_old)，目标记录未被覆盖
      - action: 进入【运维中心 → 周期实例】页面，打开该失败实例的脏数据
        expected: 脏数据展示源记录 (1, Alice_new) 和主键冲突原因
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0008
    title: 验证【数据开发】-【周期任务】运行未映射字段的同步任务，目标端未映射字段保持不变
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建 MySQL 源表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15051_c0008_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15051_c0008_source_01 (id BIGINT PRIMARY KEY, name VARCHAR(64), status VARCHAR(32));
         INSERT INTO ${SchemaA}.test_table_15051_c0008_source_01 VALUES (1, 'source_name', 'active');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：Vastbase
      7) 数据源 B 存在数据库：${SchemaB}
      8) 创建 Vastbase 目标表并插入同主键数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15051_c0008_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15051_c0008_target_01 (id BIGINT PRIMARY KEY, name VARCHAR(64), status VARCHAR(32));
         INSERT INTO ${SchemaB}.test_table_15051_c0008_target_01 VALUES (1, 'target_name', 'inactive');
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建 MySQL 到 Vastbase 周期同步任务，主键冲突选择「on duplicate key update」，仅映射 id 和 status，保存并运行
        expected: 任务运行状态为「成功」
      - action: 在 Vastbase 执行 SELECT id, name, status FROM ${SchemaB}.test_table_15051_c0008_target_01;
        expected: 查询结果为 (1, target_name, active)，未映射的 name 保持 target_name
    tags: ["离线开发", "数据开发", "周期任务"]

