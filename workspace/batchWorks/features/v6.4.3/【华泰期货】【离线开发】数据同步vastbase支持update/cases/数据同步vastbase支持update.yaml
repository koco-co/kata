  - case_id: C0008
    title: 验证未映射字段保持不变
    priority: P1
    precondition: |-
      vastbase建表语句：
      DROP TABLE IF EXISTS test_table;
      CREATE TABLE test_table (
          id INT PRIMARY KEY,
          name VARCHAR(255),
          bir VARCHAR(255)
      );
      INSERT INTO test_table VALUES (1, 'Alice','mengfei');
      INSERT INTO test_table VALUES (2, 'Bob','kako');
      SELECT * FROM test_table;
      mysql建表语句：
      DROP TABLE IF EXISTS test_table;
      CREATE TABLE test_table (
          id INT PRIMARY KEY,
          name VARCHAR(255),
          bir VARCHAR(255)
      );
      INSERT INTO test_table VALUES (1, 'Alice_chongtu','mengfei_chongtu');
      INSERT INTO test_table VALUES (3, 'keke','kako_chongtu');
    steps:
      - action: 进入数据开发模块，新建向导模式的数据同步任务
        expected: 新建成功
      - action: |-
          选择数据来源mysql
          schema
          表名：前置表
          点击下一步
        expected: 进入选择目标界面
      - action: |-
          选择数据目标vastbase
          schema
          表名：前置表
          主键冲突选择on duplicate key update
          点击下一步
        expected: 进入选择字段映射界面
      - action: 配置字段映射，name字段不进行映射，点击下一步
        expected: 进入通道控制页面
      - action: 点击下一步，点击保存，点击运行
        expected: 任务保存、运行成功
      - action: select查询vastbase数据表结果
        expected: |-
          对应主键冲突的数据被update，未冲突的数据正常插入，未映射的字段数据不做更改，结果应当是：
          1, 'Alice','mengfei_chogntu'
          2, 'Bob','kako'
          3, 'keke','kako_chongtu'
    tags:
      - 周期任务
