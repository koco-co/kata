  - case_id: C0005
    title: 验证【数据开发】-【周期任务】提交 update 数据同步任务，按周期调度运行成功
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：MySQL
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建 MySQL 源表并插入 2 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15051_c0005_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15051_c0005_source_01 (id BIGINT PRIMARY KEY, name VARCHAR(64));
         INSERT INTO ${SchemaA}.test_table_15051_c0005_source_01 VALUES (1, 'Alice_updated'), (3, 'Carol');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：Vastbase
      7) 数据源 B 存在数据库：${SchemaB}
      8) 创建 Vastbase 目标表并插入 2 行数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15051_c0005_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15051_c0005_target_01 (id BIGINT PRIMARY KEY, name VARCHAR(64));
         INSERT INTO ${SchemaB}.test_table_15051_c0005_target_01 VALUES (1, 'Alice'), (2, 'Bob');
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建并保存 MySQL 到 Vastbase 周期数据同步任务 TaskD，主键冲突选择「on duplicate key update」
        expected: 任务列表新增 TaskD，状态为「未提交」
      - action: 提交 TaskD 至运维中心
        expected: Toast 提示：「提交成功」，任务状态更新为「已提交」
      - action: 进入【运维中心 → 周期任务运维】页面，对该任务发起当日补数据并打开实例
        expected: |-
          1) 补数据实例状态：「成功」
          2) 执行SQL：SELECT id, name FROM ${SchemaB}.test_table_15051_c0005_target_01 ORDER BY id;
             查询结果：(1, Alice_updated)、(2, Bob)、(3, Carol)
