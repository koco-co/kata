meta:
  title: 【华泰期货】数据同步vastbase支持update
  requirement_id: "15051"
  case_module_id: "9649"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - 数据同步vastbase支持update.xmind
cases:
  - case_id: C0001
    title: 验证【数据开发】-【周期任务】向导模式 Inceptor、MySQL、Oracle 来源 Vastbase 目标，主键冲突可选 update
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Hive2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 在 Inceptor 创建源表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15051_c0001_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15051_c0001_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15051_c0001_source_01 VALUES (1, 'inceptor');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：MySQL
      7) 数据源 B 存在数据库：${SchemaB}
      8) 在 MySQL 创建源表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15051_c0001_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15051_c0001_source_02 (id BIGINT PRIMARY KEY, name VARCHAR(64));
         INSERT INTO ${SchemaB}.test_table_15051_c0001_source_02 VALUES (1, 'mysql');
      9) 授权数据源 C：${DataSourceC}
      10) 数据源 C 类型：Oracle
      11) 数据源 C 存在数据库：${SchemaC}
      12) 在 Oracle 创建源表并插入 1 行数据：
          BEGIN
            EXECUTE IMMEDIATE 'DROP TABLE ${SchemaC}.test_table_15051_c0001_source_03';
          EXCEPTION
            WHEN OTHERS THEN
              IF SQLCODE != -942 THEN RAISE; END IF;
          END;
          /
          CREATE TABLE ${SchemaC}.test_table_15051_c0001_source_03 (id NUMBER PRIMARY KEY, name VARCHAR2(64));
          INSERT INTO ${SchemaC}.test_table_15051_c0001_source_03 VALUES (1, 'oracle');
          COMMIT;
      13) 授权数据源 D：${DataSourceD}
      14) 数据源 D 类型：Vastbase
      15) 数据源 D 存在数据库：${SchemaD}
      16) 在 Vastbase 创建目标表并插入 1 行数据：
          DROP TABLE IF EXISTS ${SchemaD}.test_table_15051_c0001_target_01;
          CREATE TABLE IF NOT EXISTS ${SchemaD}.test_table_15051_c0001_target_01 (id BIGINT PRIMARY KEY, name VARCHAR(64));
          INSERT INTO ${SchemaD}.test_table_15051_c0001_target_01 VALUES (1, 'target');
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          依次新建三条向导模式数据同步任务：
          来源：${DataSourceA}.${SchemaA}.test_table_15051_c0001_source_01、${DataSourceB}.${SchemaB}.test_table_15051_c0001_source_02、${DataSourceC}.${SchemaC}.test_table_15051_c0001_source_03
          目标：${DataSourceD}.${SchemaD}.test_table_15051_c0001_target_01
        expected: 三条任务均进入「选择目标」步骤，目标表识别主键 id
      - action: 分别展开三条任务的「主键冲突」下拉框
        expected: Inceptor、MySQL、Oracle 三种来源的下拉选项均包含「on duplicate key update」
    tags: ["离线开发", "数据开发", "周期任务"]

  - case_id: C0002
    title: 验证【数据开发】-【周期任务】Inceptor 来源 Vastbase 目标，主键冲突选择 update 任务运行成功
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Hive2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建 Inceptor 源表并插入 2 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15051_c0002_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15051_c0002_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15051_c0002_source_01 VALUES (1, 'Alice_updated'), (3, 'Carol');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：Vastbase
      7) 数据源 B 存在数据库：${SchemaB}
      8) 创建 Vastbase 目标表并插入 2 行数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15051_c0002_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15051_c0002_target_01 (id BIGINT PRIMARY KEY, name VARCHAR(64));
         INSERT INTO ${SchemaB}.test_table_15051_c0002_target_01 VALUES (1, 'Alice'), (2, 'Bob');
    steps:
      - action: 进入【离线开发 → 数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          新建向导模式数据同步周期任务：
          任务名称：TaskB
          来源：${DataSourceA}.${SchemaA}.test_table_15051_c0002_source_01
          目标：${DataSourceB}.${SchemaB}.test_table_15051_c0002_target_01
          主键冲突：on duplicate key update
          字段映射：id → id、name → name
        expected: 字段映射区展示 id、name 两组映射，主键冲突值为「on duplicate key update」
      - action: 保存并运行 TaskB
        expected: |-
          1) 任务运行状态：「成功」
          2) 执行SQL：SELECT id, name FROM ${SchemaB}.test_table_15051_c0002_target_01 ORDER BY id;
             查询结果：(1, Alice_updated)、(2, Bob)、(3, Carol)
    tags: ["离线开发", "数据开发", "周期任务"]

