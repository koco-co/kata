meta:
  title: 【华泰期货】数据同步vastbase支持update
  requirement_id: "15051"
  case_module_id: "9649"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证数据来源为inceptor、mysql、oracle数据源，vastbase作为目标端时，主键冲突支持可选update
    priority: P0
    steps:
      - action: 进入数据开发模块，新建向导模式的数据同步任务
        expected: 新建成功
      - action: |-
          选择数据来源分别选择inceptor/mysql/oracle
          schema
          表名：test_zhouqi_001
          点击下一步
        expected: 进入选择目标界面
      - action: 点击主键冲突下拉框
        expected: 展示on duplicate key update可选
    tags:
      - 周期任务
  - case_id: C0002
    title: 验证数据来源为inceptor数据源，vastbase作为目标端时，主键冲突选择on duplicate key update任务正常运行
    priority: P0
    precondition: |-
      vastbase建表语句：
      DROP TABLE IF EXISTS test_table;
      CREATE TABLE test_table (
          id INT PRIMARY KEY,
          name VARCHAR(255)
      );
      INSERT INTO test_table VALUES (1, 'Alice');
      INSERT INTO test_table VALUES (2, 'Bob');
      SELECT * FROM test_table;
      inceptor建表语句：
      DROP TABLE IF EXISTS test_table;
      CREATE TABLE test_table (
          id INT,
          name VARCHAR(255),
          PRIMARY KEY(id)
      )
      STORED AS ORC
      TBLPROPERTIES (
          'transactional' = 'true'
      );
      INSERT INTO test_table VALUES (1, 'Alice_chongtu');
      INSERT INTO test_table VALUES (3, 'Bob');
    steps:
      - action: 进入数据开发模块，新建向导模式的数据同步任务
        expected: 新建成功
      - action: |-
          选择数据来源inceptor
          schema
          表名：前置表
          点击下一步
        expected: 进入选择目标界面
      - action: |-
          选择数据目标vastbase
          schema
          表名：前置表
          主键冲突选择on duplicate key update
          点击下一步
        expected: 进入选择字段映射界面
      - action: 配置同字段映射，点击下一步
        expected: 进入通道控制页面
      - action: 点击下一步，点击保存，点击运行
        expected: 任务保存、运行成功
      - action: select查询vastbase数据表结果
        expected: 对应主键冲突的数据被update，未冲突的数据正常插入
    tags:
      - 周期任务
