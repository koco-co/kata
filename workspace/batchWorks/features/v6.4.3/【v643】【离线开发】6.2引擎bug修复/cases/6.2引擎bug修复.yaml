meta:
  title: 【6.2】引擎bug修复
  version: v6.4.3
  feature_id: v6.4.3/【v643】【离线开发】6.2引擎bug修复
  requirement_id: "15008"
  case_module_id: "9645"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证HiveSQL任务正常运行
    priority: P1
    precondition: |-
      Hive分区表

      CREATE TABLE example_partitioned_table (
          id INT,
          name STRING,
          age SMALLINT,
          bio STRING,
          last_seen TIMESTAMP,
          is_active BOOLEAN,
          height DECIMAL(3,2),
          email STRING,
          registration_date TIMESTAMP,
          profile_picture BINARY,
          salary DOUBLE,
          revision INT
      )
      COMMENT 'Example Partitioned Table'
      PARTITIONED BY (birth_date DATE)
      ROW FORMAT DELIMITED
      FIELDS TERMINATED BY ','
      STORED AS TEXTFILE;

      INSERT INTO TABLE example_partitioned_table PARTITION (birth_date = '1994-06-14') VALUES
      (3001, '黄娟', 30, 'UI设计师，注重界面美观与交互体验。', '2025-06-04 10:00:00', TRUE, 1.62, 'huangjuan@example.com', '2024-12-12 08:30:00', NULL, 14000.0, 1);

      INSERT INTO TABLE example_partitioned_table PARTITION (birth_date = '1985-02-08') VALUES
      (3002, '周杰', 40, '高级运维工程师，熟悉Kubernetes与云计算。', '2025-06-04 09:30:00', TRUE, 1.76, 'zhoujie@example.com', '2025-01-05 14:00:00', NULL, 20000.0, 2);

      INSERT INTO TABLE example_partitioned_table PARTITION (birth_date = '1992-09-19') VALUES
      (3003, '徐丽', 33, '市场营销专家，擅长品牌推广与社交媒体运营。', '2025-06-03 15:20:00', FALSE, 1.67, 'xuli@example.com', '2024-11-30 13:15:00', NULL, 16000.0, 1);
    steps:
      - action: 进入离线开发-周期任务
        expected: 进入成功
      - action: 创建HiveSQL任务
        expected: 创建成功
      - action: 执行HiveSQL语句
        expected: 执行成功
      - action: "查询: SELECT * FROM example_partitioned_table;"
        expected: 查询成功
  - case_id: C0002
    title: 验证数据同步任务正常运行(MySQL ❯ Hive)
    priority: P0
    precondition: |-
      MySQL建表语句

      CREATE TABLE example_table (
          id INT AUTO_INCREMENT PRIMARY KEY COMMENT '自增主键ID',
          name VARCHAR(255) NOT NULL COMMENT '用户名，不能为空',
          age TINYINT UNSIGNED COMMENT '年龄，非负数',
          bio TEXT COMMENT '个人简介',
          birth_date DATE COMMENT '出生日期',
          last_seen TIMESTAMP DEFAULT CURRENT_TIMESTAMP COMMENT '最后一次在线时间，默认当前时间',
          is_active BOOLEAN COMMENT '是否活跃',
          height DECIMAL(3,2) COMMENT '身高，单位米，保留两位小数',
          email VARCHAR(255) UNIQUE COMMENT '邮箱，唯一',
          registration_date DATETIME COMMENT '注册日期和时间',
          profile_picture BLOB COMMENT '头像图片二进制数据',
          salary DOUBLE COMMENT '薪资',
          revision INT DEFAULT 1 COMMENT '版本号，默认1',
          metadata JSON COMMENT '额外元数据信息，JSON格式'
      );


      INSERT INTO example_table (name, age, bio, birth_date, is_active, height, email, registration_date, profile_picture, salary, metadata)
      VALUES
      ('张三', 28, '热爱编程的软件工程师', '1997-05-30', TRUE, 1.75, 'zhangsan@example.com', '2020-01-01 10:00:00', NULL, 12000.50, '{"department":"研发部","level":"中级"}'),
      ('李四', 34, '经验丰富的项目经理', '1989-08-15', TRUE, 1.80, 'lisi@example.com', '2019-03-12 09:30:00', NULL, 15000.75, '{"department":"项目管理部","level":"高级"}'),
      ('王五', 22, '新晋的数据分析师', '2003-02-20', FALSE, 1.65, 'wangwu@example.com', '2022-06-01 14:20:00', NULL, 8000.00, '{"department":"数据分析部","level":"初级"}'),
      ('赵六', 45, '资深的产品设计师', '1978-12-11', TRUE, 1.70, 'zhaoliu@example.com', '2018-07-23 16:45:00', NULL, 20000.00, '{"department":"产品设计部","level":"专家"}'),
      ('孙七', 30, '专业的前端开发人员', '1995-04-04', TRUE, 1.78, 'sunqi@example.com', '2021-02-28 11:11:11', NULL, 13000.00, '{"department":"前端开发部","level":"中级"}'),
      ('周八', 26, '移动应用开发者', '1999-11-22', FALSE, 1.68, 'zhouba@example.com', '2023-09-15 08:50:00', NULL, 9500.25, '{"department":"移动端开发部","level":"初级"}');
    steps:
      - action: 进入离线开发-周期任务
        expected: 进入成功
      - action: 创建MySQL2Hive数据同步任务
        expected: 创建成功
      - action: |-
          源端配置：
          数据源: MySQL
          Schema: ${schemaA}
          表名: ${tableA}
        expected: 配置成功
      - action: |-
          选择目标配置:
          数据源: Hive
          Schema: ${schemaB}
          表名: 一键生成目标表
          写入模式: 覆盖
        expected: 配置成功
      - action: |-
          其他配置:
          字段映射: 同名映射
          通道控制: 默认
        expected: 配置成功
      - action: 保存任务后运行
        expected: 运行成功
      - action: "新建HiveSQL任务, 执行SQL: SELECT * FROM ${schemaB}.${tableA};"
        expected: 查询成功, 表记录与MySQL表记录一致
  - case_id: C0003
    title: 验证数据同步任务正常运行(SR ❯ Hive)
    priority: P2
    precondition: |-
      SR建表语句
      CREATE TABLE example_primary_key_table (
          id LARGEINT NOT NULL COMMENT '主键 ID',
          registration_date DATETIME NOT NULL COMMENT '注册时间',
          name VARCHAR(255) COMMENT '用户名',
          age TINYINT COMMENT '年龄',
          bio VARCHAR(65533) COMMENT '个人简介',
          birth_date DATE COMMENT '出生日期',
          last_seen DATETIME COMMENT '最后在线时间',
          is_active BOOLEAN COMMENT '是否活跃',
          height DECIMAL(3,2) COMMENT '身高（米）',
          email VARCHAR(255) COMMENT '邮箱',
          profile_picture STRING COMMENT '头像图片',
          salary DOUBLE COMMENT '薪资',
          revision INT COMMENT '修订版本号',
          metadata STRING COMMENT '元数据'
      )
      PRIMARY KEY (id, registration_date)
      PARTITION BY RANGE (registration_date) (
          PARTITION p2020 VALUES LESS THAN ("2021-01-01 00:00:00"),
          PARTITION p2021 VALUES LESS THAN ("2022-01-01 00:00:00"),
          PARTITION p2022 VALUES LESS THAN ("2023-01-01 00:00:00"),
          PARTITION p2023 VALUES LESS THAN ("2024-01-01 00:00:00"),
          PARTITION pmax VALUES LESS THAN ("9999-12-31 00:00:00")
      )
      DISTRIBUTED BY HASH(id) BUCKETS 1
      PROPERTIES (
          "replication_num" = "1"
      );


      -- 插入第一条数据
      INSERT INTO example_primary_key_table (
          id, registration_date, name, age, bio, birth_date, last_seen, is_active, height,
          email, profile_picture, salary, revision, metadata
      ) VALUES (
          5001,
          '2024-03-15 10:30:00',
          '杨帆',
          28,
          '数据库管理员，专长MySQL与PostgreSQL优化。',
          '1996-06-10',
          '2025-06-04 10:00:00',
          TRUE,
          1. 74,
          'yangfan@example.com',
          'https://example.com/pic/yangfan.jpg',
          13000. 0,
          1,
          '{"经验": "DBA", "公司": "某金融机构"}'
      );

      -- 插入第二条数据
      INSERT INTO example_primary_key_table (
          id, registration_date, name, age, bio, birth_date, last_seen, is_active, height,
          email, profile_picture, salary, revision, metadata
      ) VALUES (
          5002,
          '2024-07-22 09:15:00',
          '孙倩',
          31,
          'UX设计师，关注用户行为与界面交互设计。',
          '1993-04-18',
          '2025-06-04 09:30:00',
          TRUE,
          1. 65,
          'sunqian@example.com',
          'https://example.com/pic/sunqian.jpg',
          15000. 0,
          2,
          '{"技能": ["Figma", "Sketch"], "城市": "杭州"}'
      );

      -- 插入第三条数据
      INSERT INTO example_primary_key_table (
          id, registration_date, name, age, bio, birth_date, last_seen, is_active, height,
          email, profile_picture, salary, revision, metadata
      ) VALUES (
          5003,
          '2025-01-10 14:20:00',
          '马超',
          42,
          '技术总监，具备多年团队管理与项目规划经验。',
          '1982-11-05',
          '2025-06-03 18:45:00',
          TRUE,
          1. 78,
          'machao@example.com',
          'https://example.com/pic/machao.jpg',
          24000. 0,
          1,
          '{"经历": ["创业", "大厂"], "国家": "中国"}'
      );
    steps:
      - action: 进入离线开发-周期任务
        expected: 进入成功
      - action: 创建SR2Hive数据同步任务
        expected: 创建成功
      - action: |-
          源端配置：
          数据源: SR
          Schema: ${schemaA}
          表名: ${tableA}
        expected: 配置成功
      - action: |-
          选择目标配置:
          数据源: Hive
          Schema: ${schemaB}
          表名: 一键生成目标表
          写入模式: 覆盖
        expected: 配置成功
      - action: |-
          其他配置:
          字段映射: 同名映射
          通道控制: 默认
        expected: 配置成功
      - action: 保存任务后运行
        expected: 运行成功
      - action: "新建HiveSQL任务, 执行SQL: SELECT * FROM ${schemaB}.${tableA};"
        expected: 查询成功, 表记录与SR表记录一致
