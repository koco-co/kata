meta:
  title: 【Gate】告警规则触发条件新增未按计划时间运行
  requirement_id: "15087"
  case_module_id: "9644"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - 告警规则触发条件新增未按计划时间运行.xmind
cases:
  - case_id: C0001
    title: 验证【监控告警】-【告警规则】创建规则勾选未按计划时间运行，阈值输入框自动校正
    priority: P1
    precondition: 无
    steps:
      - action: 进入【运维中心 → 监控告警 → 告警规则】页面
        expected: 进入成功
      - action: 点击「创建告警规则」，告警对象选择「周期任务」，勾选触发条件「未按计划时间运行」
        expected: 触发条件下方展示「计划时间后 [小时] [分钟] 未运行」，小时默认为 0，分钟默认为 30
      - action: 小时输入 -1、分钟输入 1 后移出输入框
        expected: 小时校正为 0，分钟校正为 2
      - action: 小时输入 48、分钟输入 70 后移出输入框
        expected: 小时保持 48，分钟校正为 59
      - action: 小时输入 abc、分钟输入 xyz 后移出输入框
        expected: 小时校正为 0，分钟校正为 2
    tags: ["运维中心", "监控告警", "告警规则"]

  - case_id: C0002
    title: 验证【监控告警】-【告警规则】告警对象选择周期任务，触发条件仅周期任务展示未按计划时间运行
    priority: P0
    precondition: |-
      1) 存在周期任务 TaskB
      2) 钉钉、邮箱、短信、自定义告警通道均为「可用」
    steps:
      - action: 进入【运维中心 → 监控告警 → 告警规则】页面
        expected: 进入成功
      - action: 点击「创建告警规则」
        expected: 打开「创建告警规则」弹窗
      - action: 告警对象选择「周期任务」
        expected: 触发条件展示「未按计划时间运行」
      - action: 告警对象选择「手动任务」
        expected: 触发条件不展示「未按计划时间运行」
      - action: 告警对象选择「基线」
        expected: 触发条件不展示「未按计划时间运行」
      - action: |-
          配置告警规则：
          告警规则名称：RuleC
          告警对象：周期任务
          监控任务：TaskB
          触发条件：未按计划时间运行(0小时5分钟)
          告警方式：钉钉、邮箱、短信、自定义通道
          点击「保存」
        expected: Toast提示:「保存成功」,列表新增 RuleC 且告警对象为「周期任务」、触发条件包含「未按计划时间运行」
    tags: ["运维中心", "监控告警", "告警规则"]

  - case_id: C0003
    title: 验证【监控告警】-【告警规则】编辑已有规则新增未按计划时间运行触发方式，保存后条件并存
    priority: P1
    precondition: |-
      1) 存在告警规则 RuleA，告警对象为「周期任务」，触发条件仅包含「完成」
    steps:
      - action: 进入【运维中心 → 监控告警 → 告警规则】页面
        expected: 进入成功
      - action: 编辑 RuleA，勾选「未按计划时间运行」，阈值设置为 0 小时 5 分钟并点击「确认」
        expected: Toast提示:「修改成功」,RuleA 的触发条件展示「完成」「未按计划时间运行」
    tags: ["运维中心", "监控告警", "告警规则"]

  - case_id: C0004
    title: 验证【监控告警】-【告警规则】编辑已有规则去除未按计划时间运行触发方式，保存后条件移除
    priority: P2
    precondition: |-
      1) 存在告警规则 RuleB，告警对象为「周期任务」，触发条件包含「完成」「未按计划时间运行」
    steps:
      - action: 进入【运维中心 → 监控告警 → 告警规则】页面
        expected: 进入成功
      - action: 编辑 RuleB，取消勾选「未按计划时间运行」并点击「确认」
        expected: Toast提示:「修改成功」,RuleB 的触发条件仅展示「完成」
    tags: ["运维中心", "监控告警", "告警规则"]

  - case_id: C0005
    title: 验证【监控告警】-【告警信息】触发方式筛选未按计划时间运行，列表仅展示对应记录
    priority: P2
    precondition: |-
      1) 告警信息列表存在 alarm_info_not_started，触发方式为「未按计划时间运行」
      2) 告警信息列表存在 alarm_info_failed，触发方式为「失败」
      3) 告警信息列表存在 alarm_info_stopped，触发方式为「停止」
    steps:
      - action: 进入【运维中心 → 监控告警 → 告警信息】页面
        expected: 进入成功
      - action: 触发方式仅勾选「未按计划时间运行」并确定
        expected: 仅展示 alarm_info_not_started
      - action: 触发方式勾选「失败」「停止」「未按计划时间运行」并确定
        expected: 展示 alarm_info_not_started、alarm_info_failed、alarm_info_stopped
    tags: ["运维中心", "监控告警", "告警信息"]

  - case_id: C0006
    title: 验证【监控告警】-【告警信息】任务未按计划时间运行，触发告警且内容展示任务与责任人
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在日调度周期任务 TaskC、TaskA，任务SQL均为 SELECT SLEEP(10);
      4) TaskA 依赖 TaskC
      5) 钉钉、邮箱告警通道均为「可用」
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          配置并提交两个周期任务：
          TaskC：日调度，计划开始时间 12:00，实例生成方式「立即生成」
          TaskA：日调度，计划开始时间 11:30，实例生成方式「立即生成」
        expected: 周期任务实例列表生成两个当日实例，计划开始时间分别为 12:00、11:30，TaskA 状态为「等待运行」
      - action: |-
          前往【运维中心 → 监控告警 → 告警规则】创建规则：
          告警规则名称：RuleD
          告警对象：周期任务
          监控任务：TaskA
          触发条件：未按计划时间运行(0小时5分钟)
          告警方式：钉钉、邮箱
        expected: 列表新增 RuleD，触发条件展示「未按计划时间运行(0小时5分钟)」
      - action: 在当日 11:35 查看钉钉、邮箱和告警信息列表
        expected: |-
          1) 钉钉、邮箱各收到1条 TaskA 未按计划时间运行告警
          2) 告警信息列表新增1条计划时间 11:30、触发时间 11:35、当前状态「等待运行」的记录
          3) 告警内容展示任务 TaskA、项目 ${ProjectName}、租户 ${TenantName}、调度类型「周期调度」、开始时间「-」、结束时间「-」、运行时长「-」、责任人 ${AlarmReceiver}
    tags: ["数据开发", "周期任务"]

  - case_id: C0007
    title: 验证【监控告警】-【告警信息】配置两个相同监控的告警规则，各自按阈值触发且不重复
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在日调度周期任务 TaskD、alarm_downstream_c0007，任务SQL均为 SELECT SLEEP(10);
      4) alarm_downstream_c0007 依赖 TaskD
      5) 钉钉、邮箱告警通道均为「可用」
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          配置并提交两个周期任务：
          TaskD：日调度，计划开始时间 12:00，实例生成方式「立即生成」
          alarm_downstream_c0007：日调度，计划开始时间 11:30，实例生成方式「立即生成」
        expected: alarm_downstream_c0007 当日实例的计划开始时间为 11:30 且状态为「等待运行」
      - action: |-
          前往【运维中心 → 监控告警 → 告警规则】创建两个规则：
          RuleE：监控 alarm_downstream_c0007，阈值 0 小时 2 分钟，告警方式「钉钉」
          alarm_not_started_c0007_b：监控 alarm_downstream_c0007，阈值 0 小时 3 分钟，告警方式「邮箱」
        expected: 列表新增两个规则，阈值分别展示 0 小时 2 分钟、0 小时 3 分钟
      - action: 在当日 11:32 至 11:33 查看钉钉、邮箱和告警信息列表
        expected: |-
          1) 11:32 钉钉收到1条 RuleE 告警，告警信息列表新增对应记录
          2) 11:33 邮箱收到1条 alarm_not_started_c0007_b 告警，告警信息列表新增对应记录
          3) 两个规则均不重复发送告警
    tags: ["数据开发", "周期任务"]

  - case_id: C0008
    title: 验证【监控告警】-【告警信息】调度服务重启后任务未按时运行，告警正常触发
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在日调度周期任务 TaskE、alarm_downstream_c0008，任务SQL均为 SELECT SLEEP(10);
      4) alarm_downstream_c0008 依赖 TaskE
      5) 存在规则 RuleF，监控 alarm_downstream_c0008，阈值为 0 小时 30 分钟，告警方式为钉钉、邮箱
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          配置并提交两个周期任务：
          TaskE：日调度，计划开始时间 12:00，实例生成方式「立即生成」
          alarm_downstream_c0008：日调度，计划开始时间 11:00，实例生成方式「立即生成」
        expected: alarm_downstream_c0008 当日实例的计划开始时间为 11:00 且状态为「等待运行」
      - action: 在当日 11:00 后、11:30 前重启调度服务，并在服务恢复后查看 alarm_downstream_c0008 实例
        expected: 调度服务恢复后该实例仍为「等待运行」，计划开始时间保持 11:00
      - action: 在当日 11:30 查看钉钉、邮箱和告警信息列表
        expected: 钉钉、邮箱各收到1条告警，告警信息列表仅新增1条 RuleF 记录且触发时间为 11:30
    tags: ["数据开发", "周期任务"]

  - case_id: C0009
    title: 验证【监控告警】-【告警信息】周期任务实例取消后未按时运行，告警正常触发
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在日调度周期任务 TaskF、alarm_downstream_c0009，任务SQL均为 SELECT SLEEP(10);
      4) alarm_downstream_c0009 依赖 TaskF
      5) 存在规则 RuleG，监控 alarm_downstream_c0009，阈值为 0 小时 30 分钟，告警方式为钉钉、邮箱
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          配置并提交两个周期任务：
          TaskF：日调度，计划开始时间 12:00，实例生成方式「立即生成」
          alarm_downstream_c0009：日调度，计划开始时间 11:00，实例生成方式「立即生成」
        expected: alarm_downstream_c0009 当日实例的计划开始时间为 11:00 且状态为「等待运行」
      - action: 在 11:00 后取消 alarm_downstream_c0009 当日实例
        expected: 实例状态变为「取消」
      - action: 在当日 11:30 查看钉钉、邮箱和告警信息列表
        expected: 钉钉、邮箱各收到1条告警，告警信息列表新增1条 RuleG 记录且当前状态为「取消」
    tags: ["数据开发", "周期任务"]

  - case_id: C0010
    title: 验证【监控告警】-【告警信息】周期任务冻结后未按时运行，告警正常触发
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在日调度周期任务 TaskG、alarm_downstream_c0010，任务SQL均为 SELECT SLEEP(10);
      4) alarm_downstream_c0010 依赖 TaskG
      5) 存在规则 RuleH，监控 alarm_downstream_c0010，阈值为 0 小时 30 分钟，告警方式为钉钉、邮箱
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          配置并提交两个周期任务：
          TaskG：日调度，计划开始时间 12:00，实例生成方式「立即生成」
          alarm_downstream_c0010：日调度，计划开始时间 11:00，实例生成方式「立即生成」
        expected: alarm_downstream_c0010 当日实例的计划开始时间为 11:00 且状态为「等待运行」
      - action: 在实例生成后冻结 alarm_downstream_c0010
        expected: 任务状态变为「冻结」，当日实例保留且状态为「等待运行」
      - action: 在当日 11:30 查看钉钉、邮箱和告警信息列表
        expected: 钉钉、邮箱各收到1条告警，告警信息列表新增1条 RuleH 记录且任务状态为「冻结」
    tags: ["数据开发", "周期任务"]

  - case_id: C0011
    title: 验证【监控告警】-【告警信息】YARN 资源队列阻塞导致任务等待提交，触发未按计划时间告警
    priority: P0
    precondition: |-
      1) Flink on YARN 1.12 的 yarnAccepterTaskNumber 配置为 1
      2) 存在Shell周期任务 TaskI、yarn_blocker_02，调度周期为5分钟且单次运行时长超过10分钟
      3) 存在日调度周期任务 TaskH，计划开始时间为 12:00
      4) 存在规则 RuleI，监控 TaskH，阈值为 0 小时 2 分钟，告警方式为钉钉、邮箱
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 提交 TaskI、yarn_blocker_02 并运行至YARN提交队列占满
        expected: 两个任务中1个状态为「运行中」，另1个状态为「等待提交」
      - action: 提交 TaskH 并在当日 12:00 查看任务实例
        expected: TaskH 实例状态为「等待提交」，计划开始时间为 12:00
      - action: 在当日 12:02 查看钉钉、邮箱和告警信息列表
        expected: 钉钉、邮箱各收到1条告警，告警信息列表新增1条 RuleI 记录且当前状态为「等待提交」
    tags: ["数据开发", "周期任务"]
