meta:
  title: 【Gate】告警规则触发条件新增未按计划时间运行
  requirement_id: '15087'
  case_module_id: '9644'
  imports:
  - 202511-离线开发v6.4.3.xmind
  exports:
  - 告警规则触发条件新增未按计划时间运行.xmind
cases:
- case_id: C0001
  title: 验证告警规则配置 新增触发方式「未按计划时间运行」 与 输入框交互校验
  priority: P1
  steps:
  - action: 进入【离线开发 → 告警规则】页面
    expected: 已进入【离线开发 → 告警规则】页面，显示页面标题与主要操作区域
  - action: 进入运维中心 → 监控告警 → 告警规则 → 点击 “创建告警规则”
    expected: 进入“创建告警规则”弹窗
  - action: 在“触发方式”区域勾选 “未按计划时间运行”
    expected: 该选项底下出现两输入框：“计划时间后 [小时] [分钟] 未运行”
  - action: 小时输入框保留默认0，分钟输入框保留默认30，点击保存
    expected: 规则保存成功，能看到新规则列表中触发方式包括“未按计划时间运行”
  - action: 在小时输入框输入 –1，分钟输入框输入 1，失焦后
    expected: 小时自动调整为0，分钟自动调整为2
  - action: 小时输入框输入 48，分钟输入框输入 70，失焦后
    expected: 小时自动调整为48（最大值），分钟自动调整为59（最大值）
  - action: 小时输入框输入 abc（非数字），分钟输入框输入 xyz（非数字），失焦后
    expected: 小时自动调整为0，分钟自动调整为2
- case_id: C0002
  title: 验证告警规则(未按计划时间运行)支持对象仅为周期任务
  priority: P0
  precondition: '1) 已创建一个周期任务 TaskA

    2) 已配置钉钉、邮箱、短信、自定义通道等告警方式'
  steps:
  - action: 进入【离线开发 → 告警规则】页面
    expected: 已进入【离线开发 → 告警规则】页面，显示页面标题与主要操作区域
  - action: 进入运维中心 → 监控告警 → 告警规则 → 点击 “创建告警规则”
    expected: 进入“创建告警规则”弹窗
  - action: 告警对象选择「周期任务」
    expected: 触发条件中可以选择到「未按计划时间运行」
  - action: 告警对象选择「手动任务」
    expected: 触发条件中没有「未按计划时间运行」
  - action: 告警对象选择「基线」
    expected: 触发条件中没有「未按计划时间运行」
  - action: '配置如下:

      告警规则名称: test_alarm_rule

      告警对象: 周期任务

      监控任务: TaskA

      触发条件: 未按计划时间运行(0h5min)

      告警方式: 钉钉、邮箱、短信、自定义通道全部勾选'
    expected: 配置成功
  - action: 保存规则后，列表展示该规则且告警对象显示为周期任务
    expected: 告警规则列表中“告警对象”列显示“周期任务”且对应触发方式 「未按计划时间运行」
- case_id: C0003
  title: 验证 修改已有告警规则，新增触发方式「未按计划时间运行」
  priority: P1
  precondition: '1) 已创建一个周期任务 TaskA

    2) 已配置钉钉、邮箱、短信、自定义通道等告警方式'
  steps:
  - action: 进入【离线开发 → 修改已有告警规则，新增触发方式未按计划时间运行】页面
    expected: 已进入【离线开发 → 修改已有告警规则，新增触发方式未按计划时间运行】页面，显示页面标题与主要操作区域
  - action: 进入运维中心 → 监控告警 → 告警规则
    expected: 存在告警规则A，触发方式仅为 「完成」
  - action: 点击「编辑」，勾选触发方式 「未按计划时间运行」，点击「确认」
    expected: 修改成功
  - action: 查看 列表告警规则的触发方式
    expected: 触发方式 存在 「完成」「未按计划时间运行」
- case_id: C0004
  title: 验证 修改已有告警规则，去除触发方式「未按计划时间运行」
  priority: P2
  precondition: '1) 已创建一个周期任务 TaskA

    2) 已配置钉钉、邮箱、短信、自定义通道等告警方式'
  steps:
  - action: 进入【离线开发 → 修改已有告警规则，去除触发方式未按计划时间运行】页面
    expected: 已进入【离线开发 → 修改已有告警规则，去除触发方式未按计划时间运行】页面，显示页面标题与主要操作区域
  - action: 进入运维中心 → 监控告警 → 告警规则
    expected: 存在告警规则A，触发方式为全部
  - action: 操作「编辑」，去除勾选触发方式 「未按计划时间运行」，点击「确认」
    expected: 修改成功
  - action: 查看 列表告警规则的触发方式
    expected: 触发方式 不存在 「未按计划时间运行」
- case_id: C0005
  title: 验证告警信息页面支持筛选 「未按计划时间运行」
  priority: P2
  precondition: 已存在“未按计划时间运行”触发的告警记录A
  steps:
  - action: 进入【离线开发 → 告警信息页面支持筛选 未按计划时间运行】页面
    expected: 已进入【离线开发 → 告警信息页面支持筛选 未按计划时间运行】页面，显示页面标题与主要操作区域
  - action: 进入运维中心 → 监控告警 → 告警信息页面
    expected: 进入成功
  - action: 在“触发方式”筛选框中勾选“未按计划时间运行”
    expected: 列表仅显示触发方式包含“未按计划时间运行”的记录
  - action: 在“触发方式”筛选框中勾选“失败”,“停止”,“未按计划时间运行”
    expected: 列表显示触发方式包含“失败”或“停止”或“未按计划时间运行”的记录
- case_id: C0006
  title: 验证告警触发保存后页面展示步骤要求的状态和数据
  priority: P0
  precondition: '1. 已创建周期任务 TaskA和 TaskB

    2. 任务B(下游)设置为任务A(上游)的下游依赖

    3. 已配置钉钉、邮箱、短信、自定义通道等告警方式'
  steps:
  - action: 进入【离线开发 → 告警触发保存后页面展示步骤要求的状态和数据】页面
    expected: 已进入【离线开发 → 告警触发保存后页面展示步骤要求的状态和数据】页面，显示页面标题与主要操作区域
  - action: 进入离线开发 → 周期任务页面
    expected: 进入成功
  - action: '任务A (上游) → 调度属性配置如下:

      实例生成方式: 立即生成

      调度周期: 天

      开始时间: 12:00


      任务B (下游) → 调度属性配置如下:

      实例生成方式: 立即生成

      调度周期: 天

      开始时间: 11:30


      保存并提交任务A, B到运维中心'
    expected: '运维中心-周期任务实例中生成A, B的任务实例

      上游任务A计划开始时间: 12:00

      下游任务B计划开始时间: 11:30'
  - action: '进入运维中心 → 监控告警 → 告警规则 → 点击 “创建告警规则”

      配置如下:

      告警规则名称: test_alarm_rule

      告警对象: 周期任务

      监控任务: 任务B (下游)

      触发条件: 未按计划时间运行(0h5min)

      告警方式: 钉钉、邮箱'
    expected: 配置成功
  - action: 等待11:35左右, 检查告警触发结果
    expected: '1) 11:35左右告警信息发送成功

      2) 告警信息列表新增一条11:35左右的告警记录'
  - action: 检查告警记录的告警内容
    expected: '告警内容格式如下:


      [BatchWorks]离线任务：${任务名称} 超过计划时间 ${配置小时数} 小时 ${配置分钟数} 分钟未运行告警

      任务：${当前任务名称}

      项目：${当前项目名称}

      租户：${当前租户名称}

      调度类型：周期调度

      计划时间：${当前任务在调度内运行的计划时间}

      开始时间：-

      结束时间：-

      运行时长：-

      当前状态：等待运行

      责任人：${创建告警规则配置的接收人}

      请及时处理!'
