      实例生成方式: 立即生成

      调度周期: 天

      开始时间: 11:00


      保存并提交任务A, B到运维中心'
    expected: 提交成功, 运维中心-周期任务实例中生成A, B的任务实例
  - action: '进入运维中心 → 监控告警 → 告警规则 → 点击 “创建告警规则”

