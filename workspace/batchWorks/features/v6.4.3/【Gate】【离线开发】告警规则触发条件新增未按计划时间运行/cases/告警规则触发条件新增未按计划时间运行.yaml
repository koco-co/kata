- case_id: C0011
  title: 验证yarn 资源队列阻塞，触发【未按计划时间】告警
  priority: P0
  precondition: '1) 进入控制台-多集群管理-集群配置-Flink计算组件, 将 Flink on YARN 1.12 的yarnAccepterTaskNumber 参数设置为1


    2) 配置2 个离线周期任务, 并设置最短调度周期'
  steps:
  - action: 进入【离线开发 → yarn 资源队列阻塞，触发未按计划时间告警】页面
    expected: 已进入【离线开发 → yarn 资源队列阻塞，触发未按计划时间告警】页面，显示页面标题与主要操作区域
  - action: 进入离线开发 → 周期任务页面
    expected: 进入成功
  - action: '配置2 个Shell任务, 并设置最短调度周期, 配置如下:

      实例生成方式: 立即生成

      调度周期: 分钟

      开始时间: 00:00

      间隔时间: 5分钟

      结束时间: 23:59


      保存并提交这些任务到运维中心'
    expected: '1) 运维中心-周期任务实例中生成2 个「等待提交」的任务实例

      2) Yarn资源队列阻塞, 后续任务实例状态一直处于「等待提交」'
  - action: '配置周期任务A → 调度属性配置如下:

      实例生成方式: 立即生成

      调度周期: 天

      开始时间: 12:00


      保存并提交任务A到运维中心'
    expected: 运维中心-周期任务实例中生成任务A的实例, 状态为「等待提交」
  - action: '进入运维中心 → 监控告警 → 告警规则, 创建告警规则, 配置如下:

      告警规则名称: test_alarm_rule

      告警对象: 周期任务

      监控任务: 任务A

      触发条件: 未按计划时间运行(0h2min)

      告警方式: 钉钉、邮箱'
