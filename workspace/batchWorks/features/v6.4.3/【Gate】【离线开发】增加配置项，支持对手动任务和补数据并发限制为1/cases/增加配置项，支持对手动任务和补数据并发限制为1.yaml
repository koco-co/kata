meta:
  title: 【Gate】增加配置项，支持对手动任务和补数据并发限制为1
  requirement_id: "15075"
  case_module_id: "9643"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - 增加配置项，支持对手动任务和补数据并发限制为1.xmind
cases:
  - case_id: C0001
    title: 验证【项目管理】-【操作设置】查看手动任务与补数据实例默认并发数配置项，展示说明与编辑按钮
    priority: P2
    precondition: 无
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 查看「手动任务/补数据实例默认并发数」配置项
        expected: 配置项展示手动任务、补数据任务两个配置值，均为「不限制」，右侧展示「编辑」按钮
      - action: 将鼠标悬停在配置项说明图标上
        expected: |-
          1) 提示说明该配置限制单个批次内同时运行的最大实例数
          2) 「不限制」说明为在资源允许时同时提交该批次内的全部实例
          3) 「限制」说明为超出最大实例数的任务排队等待运行
      - action: 点击「编辑」
        expected: 打开「任务实例默认并发数配置」弹窗并展示手动任务、补数据任务两个配置区
    tags: [项目管理, 操作设置]

  - case_id: C0002
    title: 验证【项目管理】-【操作设置】编辑并发限制输入值，越界值自动校正且保存后回显
    priority: P1
    precondition: |-
      1) 手动任务、补数据任务的默认并发数均为「不限制」
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 点击「手动任务/补数据实例默认并发数」右侧的「编辑」
        expected: 打开配置弹窗，手动任务、补数据任务均选中「不限制」
      - action: 将手动任务的并发限制选择为「限制」
        expected: 展示并发数输入框，placeholder 为「请输入数值」
      - action: 输入 -1 后移出输入框
        expected: -1 校正为 0
      - action: 输入 101 后移出输入框
        expected: 101 校正为 100
      - action: 输入 abc 后移出输入框
        expected: abc 被清空
      - action: 输入 0 并保存
        expected: 保存后配置值展示「限制：0」
      - action: 重新编辑，输入 100 并保存
        expected: 保存后配置值展示「限制：100」
      - action: 重新编辑，输入 50 并保存后再次打开配置弹窗
        expected: 再次打开弹窗时输入框回显 50
    tags: [项目管理, 操作设置]

  - case_id: C0003
    title: 验证【项目管理】-【操作设置】设置手动任务默认并发数为限制1，运行弹窗默认值联动
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在已提交至运维中心的手动任务 TaskA，任务SQL为 SELECT SLEEP(20);
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 将手动任务默认并发数设置为「限制：1」并保存
        expected: Toast提示:「保存成功」,配置值展示「限制：1」
      - action: 前往【运维中心 → 手动任务管理】，选择 TaskA 并点击「运行」
        expected: 打开运行弹窗且「最大并行实例数」默认展示「限制：1」
      - action: 将「最大并行实例数」改为「不限制」并点击「确定」
        expected: 手动任务实例列表新增 TaskA 运行记录，最大并行实例数展示「不限制」
    tags: [项目管理, 操作设置]

  - case_id: C0004
    title: 验证【项目管理】-【操作设置】设置补数据任务默认并发数为限制1，补数据弹窗默认值联动
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在已提交至运维中心的日调度周期任务 TaskA，任务SQL为 SELECT SLEEP(20);
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 将补数据任务默认并发数设置为「限制：1」并保存
        expected: Toast提示:「保存成功」,配置值展示「限制：1」
      - action: 前往【运维中心 → 周期任务管理】，选择 TaskA 并点击「补数据」
        expected: 打开补数据弹窗且「最大并行实例数」默认展示「限制：1」
      - action: 将「最大并行实例数」改为「不限制」，业务日期选择当日并点击「确定」
        expected: 补数据任务实例列表新增 TaskA 运行记录，最大并行实例数展示「不限制」
    tags: [项目管理, 操作设置]

  - case_id: C0005
    title: 验证【运维中心】-【手动任务管理】手动任务并发限制为1，下游任务排队依次运行
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在已提交至运维中心的手动任务 TaskA、TaskB、TaskC、TaskD、TaskE，每个任务的SQL均为 SELECT SLEEP(20);
      4) TaskA、TaskB、TaskC、TaskD 均依赖 TaskE
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 将手动任务默认并发数设置为「限制：1」并保存
        expected: Toast提示:「保存成功」,配置值展示「限制：1」
      - action: 前往【运维中心 → 手动任务管理】，运行 TaskE 并勾选运行全部下游任务
        expected: 手动任务实例列表新增包含 TaskA 至 TaskE 的批次记录
      - action: 打开该批次的任务实例详情
        expected: TaskE 完成后，TaskA 至 TaskD 中仅1个状态为「运行中」，其余3个状态为「等待运行」并依次进入「运行中」
      - action: 返回手动任务管理，再次运行 TaskE 及全部下游任务，将「最大并行实例数」改为「不限制」并确认
        expected: 新批次中 TaskE 完成后，TaskA 至 TaskD 同时显示为「运行中」
    tags: [项目管理, 操作设置]

  - case_id: C0006
    title: 验证【运维中心】-【周期任务管理】补数据多任务单实例并发限制为1，实例排队依次运行
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在已提交至运维中心且无依赖关系的日调度周期任务 TaskA、TaskB、TaskC、TaskD、TaskE，每个任务的SQL均为 SELECT SLEEP(20);
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 将补数据任务默认并发数设置为「限制：1」并保存
        expected: Toast提示:「保存成功」,配置值展示「限制：1」
      - action: 前往【运维中心 → 周期任务管理】，勾选 TaskA 至 TaskE，对当日业务日期执行批量补数据
        expected: 补数据任务实例列表新增包含5个任务实例的批次记录
      - action: 打开该批次的任务实例详情
        expected: 5个任务实例中仅1个状态为「运行中」，其余4个状态为「等待运行」并依次进入「运行中」
      - action: 返回周期任务管理，对 TaskA 至 TaskE 再次执行批量补数据，将「最大并行实例数」改为「不限制」并确认
        expected: 新批次中的5个任务实例同时显示为「运行中」
    tags: [项目管理, 操作设置]

  - case_id: C0007
    title: 验证【运维中心】-【周期任务管理】补数据单任务多实例并发限制为1，实例排队依次运行
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在已提交至运维中心的日调度周期任务 TaskA，任务SQL为 SELECT SLEEP(20);
      4) TaskA 支持按业务日期生成独立任务实例
    steps:
      - action: 进入【项目管理 → 操作设置】页面
        expected: 进入成功
      - action: 将补数据任务默认并发数设置为「限制：1」并保存
        expected: Toast提示:「保存成功」,配置值展示「限制：1」
      - action: 前往【运维中心 → 周期任务管理】，对 TaskA 执行补数据，业务日期选择当日前9日至当日前5日
        expected: 补数据批次详情展示5个不同业务日期的任务实例
      - action: 查看该批次的任务实例状态
        expected: 5个任务实例中仅1个状态为「运行中」，其余4个状态为「等待运行」并依次进入「运行中」
      - action: 对 TaskA 再次执行补数据，业务日期选择当日前4日至当日，将「最大并行实例数」改为「不限制」并确认
        expected: 新批次的5个不同业务日期任务实例同时显示为「运行中」
    tags: [项目管理, 操作设置]

  - case_id: C0008
    title: 验证【平台管理】-【角色管理】权限点未授予时隐藏编辑按钮，授予后可修改并发配置
    priority: P1
    precondition: |-
      1) 使用管理员账号进入离线开发平台
      2) 存在数据开发角色 test_user
      3) test_user 未获得「项目管理-项目配置-编辑」权限
    steps:
      - action: 进入【平台管理 → 角色管理】页面
        expected: 进入成功
      - action: 查看 test_user 的「项目管理-项目配置-编辑」权限点
        expected: 权限点未勾选
      - action: 切换使用 test_user 进入【项目管理 → 操作设置】页面，查看「手动任务/补数据实例默认并发数」配置项
        expected: 配置项不展示「编辑」按钮，test_user 无法打开配置弹窗
      - action: 切换使用管理员账号，为 test_user 勾选「项目管理-项目配置-编辑」权限并保存
        expected: Toast提示:「保存成功」,权限点展示为已勾选
      - action: 切换使用 test_user 进入【项目管理 → 操作设置】页面，将手动任务默认并发数设置为「限制：1」并保存
        expected: Toast提示:「保存成功」,配置值展示「限制：1」
    tags: [平台管理, 角色管理]
