meta:
  title: 【Gate】增加配置项，支持对手动任务和补数据并发限制为1
  version: v6.4.3
  feature_id: v6.4.3/【v643】【Gate】【离线开发】增加配置项，支持对手动任务和补数据并发限制为1
  requirement_id: "15075"
  case_module_id: "9643"
  imports:
    - 202511-离线开发v6.4.3.xmind
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证项目管理页新增配置项展示
    priority: P2
    steps:
      - action: 进入【项目管理】-【操作设置】页面, 检查配置项列表
        expected: 新增配置项“手动任务/补数据实例默认并发数”显示在操作设置区域
      - action: 查看悬停问号图标提示信息
        expected: |-
          限制运行的最大实例数，该配置适用于手动任务和补数据任务
          选择 「不限制」 时，系统将在资源允许的情况下，将同一批次内的所有实例同时提交至 Yarn 运行；
          选择 「限制」 时，可设置单个批次内允许同时运行的最大实例数，超出部分将排队等待资源释放后再运行。
      - action: 点击“编辑”按钮
        expected: 弹出“任务实例默认并发数配置”弹窗, 分别展示手动任务和补数据任务的并行实例数配置
      - action: 检查默认状态
        expected: 均默认展示为「不限制」并显示“编辑”按钮
  - case_id: C0002
    title: 验证并发配置项输入逻辑正常
    priority: P1
    steps:
      - action: 进入【项目管理】-【操作设置】页面
        expected: 进入成功
      - action: 在操作设置页点击并发实例数的“编辑”按钮
        expected: 弹出弹窗，手动任务/补数据任务均默认选中“不限制”
      - action: 选择手动任务的“限制”
        expected: 显示输入框，placeholder 为“请输入数值”
      - action: 输入“-1”后失焦
        expected: 重置为 0
      - action: 输入“0”后保存
        expected: 成功保存为 0
      - action: 输入“100”并保存
        expected: 成功保存为 100
      - action: 输入“101”后失焦
        expected: 重置为 100
      - action: 输入“abc”后失焦
        expected: 输入框自动清空
      - action: 输入“50”确定后, 点击编辑按钮, 查看回显内容
        expected: 页面回显正常
  - case_id: C0003
    title: 验证配置保存后影响手动任务运行页面
    priority: P0
    precondition: 存在一条手动任务A
    steps:
      - action: 进入【项目管理】-【操作设置】，将手动任务默认并发数设置为“限制 1”
        expected: 配置成功保存
      - action: 进入【运维中心】-【手动任务管理】, 选择手动任务A, 点击“运行”按钮打开运行弹窗
        expected: 弹窗中“最大并行实例数”默认显示为“限制：1”
      - action: 切换为“不限制”并点击确定
        expected: 输入框消失，状态切换正确
  - case_id: C0004
    title: 验证配置保存后影响补数据任务运行页面
    priority: P0
    precondition: 存在一条补数据任务A
    steps:
      - action: 进入【项目管理】-【操作设置】，将补数据任务默认并发数设置为“限制 1”
        expected: 配置成功保存
      - action: 进入【运维中心】-【补数据任务管理】, 选择补数据任务A, 点击“运行”按钮打开运行弹窗
        expected: 弹窗中“最大并行实例数”默认显示为“限制：1”
      - action: 切换为“不限制”并点击确定
        expected: 输入框消失，状态切换正确
  - case_id: C0005
    title: 验证手动任务限制为1时并发控制生效
    priority: P1
    precondition: |-
      存在五个手动任务taskA~taskE, 且taskA~taskD任务均依赖于任务taskE
      任务taskA:
      select sleep(10);
      SELECT 1;

      任务taskB:
      select sleep(10);

      任务taskC:
      select sleep(10);

      任务taskD:
      select sleep(10);

      任务taskE:
      select sleep(10);
    steps:
      - action: 进入【项目管理】-【操作设置】, 将手动任务的默认并发数设置为“限制 1”
        expected: 配置成功保存
      - action: 进入「数据开发-手动任务」, 保存并提交mysql任务taskA~taskE (任务taskA~taskD依赖于任务taskE)
        expected: 成功提交至运维中心
      - action: 进入「运维中心-手动任务管理」, 运行任务taskE(包含下游任务taskA~taskD), 其他配置项保持默认后确定
        expected: 「手动任务实例」中新增实例a (该实例包含taskA~taskE)
      - action: 进入「手动任务-手动任务实例」, 实例a详情页面
        expected: 任务taskE执行完毕后, 任务taskA~taskD按照并发为1的规则依次执行, 未执行的任务状态处于「等待运行」
      - action: 返回「手动任务-手动任务管理」页面, 重新运行taskE(包含下游任务taskA~taskD, 且「最大并行实例数」为不限制)
        expected: 「手动任务实例」中新增实例b
      - action: 进入「手动任务-手动任务实例」, 手动任务实例b详情页面
        expected: 任务taskE执行完毕后, 任务taskA~taskD按照并发为「不限制」的规则执行, 任务taskA~taskD立马进入到「运行中」状态
  - case_id: C0006
    title: 验证补数据任务【存在多任务单实例】限制为1时并发控制生效
    priority: P0
    precondition: |-
      存在五个周期任务taskA~taskE
      任务taskA:
      select sleep(10);
      SELECT 1;

      任务taskB:
      select sleep(10);

      任务taskC:
      select sleep(10);

      任务taskD:
      select sleep(10);

      任务taskE:
      select sleep(10);
    steps:
      - action: 进入【项目管理】-【操作设置】, 将补数据任务的默认并发数设置为“限制 1”
        expected: 配置成功保存
      - action: 进入数据开发-周期任务, 保存并提交mysql任务taskA~taskE
        expected: 成功提交至运维中心
      - action: 进入运维中心-周期任务管理, 选择任务taskA~E, 批量补数据, 配置保持默认后, 点击确定
        expected: 「补数据任务实例」中新增实例a (该实例包含taskA~E)
      - action: 进入「补数据任务-补数据任务实例」, 进入补数据任务实例a详情页面
        expected: 任务taskA~taskE按照并发为1的规则依次执行, 未执行的任务状态处于「等待运行」
      - action: 返回「周期任务-周期任务管理」,  选择任务taskA~taskE重新批量补数据, 修改配置项「最大并行实例数」为不限制后, 点击确定
        expected: 「补数据任务-补数据任务实例」中新增实例b
      - action: 进入「补数据任务-补数据任务实例」, 实例b详情页面
        expected: 任务taskA~E按照并发为不限制的规则执行, 5个任务立马进入到「运行中」状态
  - case_id: C0007
    title: 验证补数据任务【存在单任务多实例】限制为1时并发控制生效
    priority: P1
    precondition: |-
      存在五个周期任务taskA~taskE
      任务taskA:
      select sleep(10);
      SELECT 1;

      任务taskB:
      select sleep(10);

      任务taskC:
      select sleep(10);

      任务taskD:
      select sleep(10);

      任务taskE:
      select sleep(10);
    steps:
      - action: 进入【项目管理】-【操作设置】, 将补数据任务的默认并发数设置为“限制 1”
        expected: 配置成功保存
      - action: 进入数据开发-周期任务, 保存并提交mysql任务taskA~taskE
        expected: 成功提交至运维中心
      - action: 进入运维中心-周期任务管理, 选择任务taskA~E, 每个任务单独补数据, 配置保持默认后, 点击确定
        expected: 「补数据任务实例」中新增5个实例a~e (每个实例仅包含一个任务) ，且计划运行时间均不相同
      - action: 进入「补数据任务-补数据任务实例」
        expected: 实例a~e均进入「运行中」状态, 每个实例中的任务按照并发为1的规则依次执行
  - case_id: C0008
    title: 验证权限点对并发设置生效
    priority: P1
    precondition: 当前离线项目已有数据开发角色test_user, 并使用该角色登陆
    steps:
      - action: 进入离线开发-角色管理-离线开发, 查看「项目管理-项目配置-编辑」的数据开发权限点
        expected: 默认未勾选
      - action: 进入离线开发-项目管理-项目设置-操作设置, 编辑「手动任务/补数据实例默认并发数」
        expected: 没有编辑权限
      - action: 登陆管理员账号, 勾选数据开发对于「项目管理-项目配置-编辑」的权限点
        expected: 编辑成功
      - action: 重新登陆test_user账号, 编辑「手动任务/补数据实例默认并发数」
        expected: 编辑成功
