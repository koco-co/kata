    title: 验证【数据开发】-【周期任务】上传 .csv 文件并提交导入，目标表新增 ID=1 记录且 EMAIL 为 alice@example.com
    priority: P0
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
