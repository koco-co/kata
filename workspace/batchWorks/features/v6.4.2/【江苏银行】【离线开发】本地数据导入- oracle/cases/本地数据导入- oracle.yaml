  - case_id: C0013
    title: 验证上传文件大小上限正常(1000列+500M)
    priority: P2
    precondition: |-
      使用如下py脚本生成两个csv文件

      #!/usr/bin/env python3
      """
      生成规范的 CSV 文件：
       - UTF-8 编码，无 BOM
       - 逗号分隔
       - 每个字段均加双引号包裹，内部引号自动转义
       - 适合平台 CSV 导入与 Oracle 表解析
      """

      import csv
      import os
      import math
      from datetime import datetime

      def generate_ddl_csv(out_path, table_name, ncols):
          """生成建表语句CSV"""
          col_defs = [f'"C{i}" VARCHAR2(100)' for i in range(1, ncols + 1)]
          ddl = f'CREATE TABLE "{table_name}" (\n    ' + ",\n    ".join(col_defs) + "\n);"

          with open(out_path, "w", encoding="utf-8", newline="") as f:
              writer = csv.writer(f, quoting=csv.QUOTE_ALL)
              writer.writerow(["table_name", "ddl"])
              writer.writerow([table_name, ddl])

          print(f"写入 DDL -> {out_path} (列数={ncols})")


      def generate_data_csv(out_path, ncols, target_size_bytes, header=True):
          """生成规范的 CSV 数据文件"""
          os.makedirs(os.path.dirname(out_path), exist_ok=True)

          preferred_rows = 1000
          est_L = max(1, (target_size_bytes // preferred_rows - (ncols - 1) - 1) // ncols)
          if est_L > 1000:
              est_L = 1000

          str2 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
          cell_value = str2 * est_L
          row_data = [cell_value] * ncols

          # 计算每行大约大小
          sample_row = '"' + '","'.join(row_data) + '"\n'
          bytes_per_row = len(sample_row.encode("utf-8"))
          rows_needed = math.ceil(target_size_bytes / bytes_per_row)

          print(f"每行约 {bytes_per_row} 字节，预计写入 {rows_needed} 行，每字段长度 {est_L}")

          with open(out_path, "w", encoding="utf-8", newline="") as f:
              writer = csv.writer(f, quoting=csv.QUOTE_ALL)
              if header:
                  writer.writerow([f"C{i}" for i in range(1, ncols + 1)])

              for i in range(rows_needed):
                  writer.writerow(row_data)
                  if (i + 1) % 1000 == 0:
                      print(f"已写入 {i + 1}/{rows_needed} 行", end="\r")

          final_size = os.path.getsize(out_path)
          print(f"\n写入 Data -> {out_path} (实际大小 {final_size} bytes)")


      if __name__ == "__main__":
          # === DEMO 示例 ===
          # 生成一个符合 Oracle 平台导入规范的 CSV
          # 1000 列，约 450MB
          table_name = "TEST_1000COLS"
          ncols = 1000
          size_mb = 450
          out_dir = "./demo_out_valid"
          os.makedirs(out_dir, exist_ok=True)

          ddl_path = os.path.join(out_dir, "ddl.csv")
          data_path = os.path.join(out_dir, "data.csv")

          start = datetime.now()
          generate_ddl_csv(ddl_path, table_name, ncols)
          generate_data_csv(data_path, ncols, size_mb * 1024 * 1024, header=True)
          end = datetime.now()

          print(f"\n生成完成，用时 {round((end - start).total_seconds(), 2)} 秒")
          print(f"输出目录: {os.path.abspath(out_dir)}")
    steps:
      - action: 进入离线开发-数据开发页面
        expected: 进入成功
      - action: 点击导入, 上传test.xls文件
        expected: 上传成功
