      CREATE TABLE demo_user ( id NUMBER(12) PRIMARY KEY, username VARCHAR2(100) NOT NULL, email VARCHAR2(200) UNIQUE, is_active CHAR(1) DEFAULT 'Y' NOT NULL, salary NUMBER(12,2), created_date DATE                 DEFAULT SYSDATE, updated_ts TIMESTAMP, locale NCHAR(5), uuid_raw RAW(16), profile_text CLOB, avatar_blob BLOB, notes NVARCHAR2(2000), CONSTRAINT chk_is_active CHECK (is_active IN ('Y','N'))
      );
