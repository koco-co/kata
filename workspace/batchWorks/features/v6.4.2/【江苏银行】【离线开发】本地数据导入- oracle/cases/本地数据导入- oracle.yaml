  - case_id: C0013
    title: 验证【数据开发】-【周期任务】上传 500MB 1000 列文件并解析，解析结果包含 1000 个字段列且无大小超限提示(1000列+500M)
    priority: P2
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
      2) 文件「oracle_rows_c0013」包含 1000 个表头字段，文件大小为 500 MB
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传名为「oracle_rows_c0013.xlsx」的 500 MB 文件
        expected: 上传进度完成，文件未被前端拒绝
      - action: 查看文件解析结果
        expected: 解析结果包含 1000 个字段列，页面未展示大小超限提示
    tags:
      - 数据开发
      - 周期任务
      - 大小上限
