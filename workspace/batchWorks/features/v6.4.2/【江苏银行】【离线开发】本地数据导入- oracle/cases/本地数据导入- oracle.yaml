meta:
  title: 【江苏银行】本地数据导入- oracle
  requirement_id: '15080'
  case_module_id: '9405'
  imports:
    - 202510-离线开发v6.4.2.xmind
  exports:
    - 本地数据导入- oracle.xmind
cases:
  - case_id: C0001
    title: 验证【数据开发】-【周期任务】上传字段文件并按追加模式导入，目标表保留 ID=99 且新增 ID=1、2 记录
    priority: P1
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
      2) 文件「oracle_rows_c0001」包含表头 ID,USERNAME,EMAIL,IS_ACTIVE 和记录「1,alice,alice@example.com,Y」「2,bob,bob@example.com,Y」
      3) Oracle 目标表「demo_user」已存在记录 ID=99
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传「oracle_rows_c0001」并选择 ${DataSourceA} 的「demo_user」表
        expected: 字段映射区域展示 ID、USERNAME、EMAIL、IS_ACTIVE 四个字段
      - action: 选择导入模式「追加」并提交导入
        expected: Toast提示:「导入成功」,demo_user 保留 ID=99 且新增 ID=1、2 两条记录
    tags:
      - 数据开发
      - 周期任务
      - 追加导入

  - case_id: C0002
    title: 验证【数据开发】-【周期任务】上传字段文件并按覆盖模式导入，目标表仅保留 ID=1、2 记录
    priority: P0
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
      2) 文件「oracle_rows_c0002」包含表头 ID,USERNAME,EMAIL 和记录「1,alice,alice@example.com」「2,bob,bob@example.com」
      3) Oracle 目标表「demo_user」已存在 ID=99 记录
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传「oracle_rows_c0002」并选择已存在的 Oracle 表「demo_user」
        expected: 字段映射区域展示 ID、USERNAME、EMAIL 三个字段
      - action: 选择导入模式「覆盖」并提交导入
        expected: Toast提示:「导入成功」,demo_user 仅保留 ID=1、2 两条记录
    tags:
      - 数据开发
      - 周期任务
      - 覆盖导入

  - case_id: C0003
    title: 验证【数据开发】-【周期任务】上传乱序字段文件并按位置匹配导入，目标表记录 NAME 为 F 且 SEX 为 alice
    priority: P2
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
      2) 文件「oracle_rows_c0003」表头顺序为 SEX,NAME，Line1 为「F,alice」
      3) Oracle 目标表「demo_user」包含字段 NAME、SEX
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传「oracle_rows_c0003」并选择按位置匹配
        expected: 第 1 个来源字段映射到 NAME，第 2 个来源字段映射到 SEX
      - action: 提交导入
        expected: Toast提示:「导入成功」,demo_user 的 NAME 为「F」且 SEX 为「alice」
    tags:
      - 数据开发
      - 周期任务
      - 按位置匹配

  - case_id: C0004
    title: 验证【数据开发】-【周期任务】上传字段文件并按名称匹配导入，目标表新增记录 NAME 为 alice 且 SEX 为 F
    priority: P0
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
      2) 文件「oracle_rows_c0004」表头为 NAME,SEX，Line1 为「alice,F」
      3) Oracle 目标表「demo_user」包含字段 NAME、SEX
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传「oracle_rows_c0004」并选择按名称匹配
        expected: NAME 映射到 NAME，SEX 映射到 SEX
      - action: 提交导入
        expected: Toast提示:「导入成功」,demo_user 新增记录的 NAME 为「alice」且 SEX 为「F」
    tags:
      - 数据开发
      - 周期任务
      - 按名称匹配

  - case_id: C0005
    title: 验证【数据开发】-【周期任务】查看导入配置项，页面展示文件上传、数据源、目标表和追加/覆盖两个导入模式
    priority: P2
    precondition: 1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 查看导入文件、目标数据源、目标表和导入模式配置项
        expected: 页面展示文件上传、${DataSourceA}、目标表选择和追加/覆盖两个导入模式
    tags:
      - 数据开发
      - 周期任务

  - case_id: C0006
    title: 验证【数据开发】-【周期任务】上传 .log 文件并提交导入，目标表新增 ID=1、USERNAME=alice 记录
    priority: P2
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
      2) 文件「oracle_rows_c0006」每行使用逗号分隔，首行包含 ID,USERNAME，Line1 为「1,alice」
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传名为「oracle_rows_c0006.log」的文件并选择 ${DataSourceA}
        expected: 文件解析为 ID、USERNAME 两列，预览包含「1」「alice」
      - action: 提交导入
        expected: Toast提示:「导入成功」,目标表新增 ID=1、USERNAME=alice 记录
    tags:
      - 数据开发
      - 周期任务
      - 文件格式

