  - case_id: C0009
    title: 验证【数据开发】-【周期任务】上传 .xls 文件并切换 Sheet2 提交导入，Sheet 下拉框展示两个 Sheet 且导入成功(2 个sheet)
    priority: P2
    precondition: |-
      1) 离线项目「${ProjectA}」已授权 Oracle 数据源「${DataSourceA}」
      2) 工作簿「oracle_rows_c0009」包含 Sheet1 和 Sheet2
      3) Sheet1 的 Title 为 ID,USERNAME、Line1 为「1,alice」
      4) Sheet2 的 Title 为 ID,USERNAME、Line1 为「2,bob」
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传名为「oracle_rows_c0009.xls」的文件并选择 Sheet1
        expected: Sheet 下拉框展示 Sheet1、Sheet2，预览展示 Sheet1 的「1,alice」
      - action: 切换到 Sheet2 并提交导入
        expected: 预览展示 Sheet2 的「2,bob」，Toast提示:「导入成功」
    tags:
      - 数据开发
      - 周期任务
      - 多Sheet

