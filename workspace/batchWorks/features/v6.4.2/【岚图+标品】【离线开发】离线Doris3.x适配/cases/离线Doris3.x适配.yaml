    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：MySQL
      3) 存在数据库：${SchemaB}
      4) 创建数据表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_14835_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_14835_c0007 (id BIGINT, order_no VARCHAR(32), amount DECIMAL(10,2));
         INSERT INTO ${SchemaB}.test_table_14835_c0007 VALUES (1, 'O1', 10.00), (2, 'O2', 20.00), (3, 'O3', 30.00);
      5) 授权数据源：${DataSourceA}
      6) 数据源类型：Doris3.x
      7) 存在数据库：${SchemaA}
      8) 创建目标表，该表为空表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14835_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14835_c0007 (id BIGINT, order_no VARCHAR(32), amount DECIMAL(10,2));
      9) 目标数据库 ${DataSourceA}.${SchemaA} 已授权
    steps:
      - action: 进入【数据开发 → 数据同步】页面
        expected: 进入成功
      - action: 新建数据同步任务，源端选择 ${DataSourceB}.${SchemaB}.test_table_14835_c0007，目标端选择 ${DataSourceA}.${SchemaA}.test_table_14835_c0007
        expected: 源表、目标表和字段映射区域展示完整
      - action: 执行模式选择「per_job」，同步方式选择「全量」，点击「发布」
        expected: Toast提示:「发布成功」，任务状态变为「运行完成」
      - action: 执行 `SELECT COUNT(*) FROM ${SchemaA}.test_table_14835_c0007`
        expected: 查询结果为 3，目标表 amount 汇总值与源表一致
    tags:
      - 数据开发
      - 数据同步
      - per_job模式

  - case_id: C0008
    title: 验证【数据开发】-【数据同步】导入任务配置，任务详情保留源表目标表与执行模式
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14835_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14835_c0008 (id BIGINT, order_no STRING);
         INSERT INTO ${SchemaA}.test_table_14835_c0008 VALUES (1, 'O1');
      5) 授权数据源：${DataSourceC}
      6) 数据源类型：SparkThrift2.x
      7) 存在数据库：${SchemaC}
      8) 创建目标表，该表为空表：
         DROP TABLE IF EXISTS ${SchemaC}.test_table_14835_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_14835_c0008 (id BIGINT, order_no STRING);
      9) 创建导入文件 `doris_sync_config.yaml`：
         Title: source,target,mode
         Line1: ${DataSourceA}.${SchemaA}.test_table_14835_c0008,${DataSourceC}.${SchemaC}.test_table_14835_c0008,session
    steps:
      - action: 进入【数据开发 → 数据同步】页面
        expected: 进入成功
      - action: 点击「导入任务配置」并上传 `doris_sync_config.yaml`
        expected: 导入预览展示源端、目标端和执行模式，分别为 ${DataSourceA}.${SchemaA}.test_table_14835_c0008、${DataSourceC}.${SchemaC}.test_table_14835_c0008、session
      - action: 点击「确认导入」并查看任务详情
        expected: 任务详情保留源表、目标表和 session 执行模式，配置内容可编辑
    tags:
      - 数据开发
      - 数据同步
      - 导入配置

  - case_id: C0009
    title: 验证【平台管理】-【组件版本管理】新增Doris3.x组件版本，列表新增且状态启用
    priority: P1
    precondition: |-
      1) 使用租户管理员账号进入平台管理，具备组件版本管理权限
      2) 组件列表中不存在版本「Doris3.x-3.0.3」
    steps:
      - action: 进入【平台管理 → 组件版本管理】页面
        expected: 进入成功
      - action: 点击「新增」
        expected: 打开新增组件版本表单，展示组件名称、版本号和备注字段
      - action: 组件名称选择「Doris」，版本号输入「Doris3.x-3.0.3」，备注输入「离线适配」，点击「保存」
        expected: Toast提示:「保存成功」，列表新增版本「Doris3.x-3.0.3」且状态为「启用」
    tags:
      - 平台管理
      - 组件版本管理
      - Doris3.x

  - case_id: C0010
    title: 验证【项目管理】-【创建项目】以创建方式创建项目并添加Doris3.x数据源，连接测试成功且详情展示
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表，该表为空表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14835_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14835_c0010 (id BIGINT);
      5) 使用租户管理员账号进入项目管理，具备项目创建权限
      6) 数据源连接信息为 host=doris3.example、port=8030、database=${SchemaA}，连接测试可返回成功
      7) 项目名称「${ProjectB}」不存在
    steps:
      - action: 进入【项目管理】页面
        expected: 进入成功
      - action: 点击「创建项目」，填写项目名称「${ProjectB}」并选择初始化方式「创建」
        expected: 表单展示数据源类型、地址、端口、数据库、账号和密码字段
      - action: 选择数据源类型「Doris3.x」，填写 host=doris3.example、port=8030、database=${SchemaA}，点击「连接测试」
        expected: Toast提示:「连接成功」，连接测试状态为「成功」
      - action: 点击「保存」并打开项目详情
        expected: 项目列表新增「${ProjectB}」，详情展示数据源类型「Doris3.x」、地址 doris3.example、端口 8030、数据库 ${SchemaA}
    tags:
      - 项目管理
      - 创建项目
      - Doris3.x

