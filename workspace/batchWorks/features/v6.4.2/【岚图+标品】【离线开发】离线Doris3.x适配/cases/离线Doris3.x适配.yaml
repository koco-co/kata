  - case_id: C0006
    title: 验证【数据开发】-【数据同步】配置Doris3.x到Other的session模式数据同步任务，目标端同步3行数据
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14835_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14835_c0006 (id BIGINT, order_no STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_14835_c0006 VALUES (1, 'O1', 10.00), (2, 'O2', 20.00), (3, 'O3', 30.00);
      5) 授权数据源：${DataSourceC}
      6) 数据源类型：SparkThrift2.x
      7) 存在数据库：${SchemaC}
      8) 创建目标表，该表为空表：
         DROP TABLE IF EXISTS ${SchemaC}.test_table_14835_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_14835_c0006 (id BIGINT, order_no STRING, amount DECIMAL(10,2));
      9) 目标数据库 ${DataSourceC}.${SchemaC} 已授权
    steps:
      - action: 进入【数据开发 → 数据同步】页面
        expected: 进入成功
      - action: 新建数据同步任务，源端选择 ${DataSourceA}.${SchemaA}.test_table_14835_c0006，目标端选择 ${DataSourceC}.${SchemaC}.test_table_14835_c0006
        expected: 源表、目标表和字段映射区域展示完整
      - action: 执行模式选择「session」，同步方式选择「全量」，点击「发布」
        expected: Toast提示:「发布成功」，任务状态变为「运行完成」
      - action: 执行 `SELECT COUNT(*) FROM ${SchemaC}.test_table_14835_c0006`
        expected: 查询结果为 3，目标表字段 id、order_no、amount 均有值
