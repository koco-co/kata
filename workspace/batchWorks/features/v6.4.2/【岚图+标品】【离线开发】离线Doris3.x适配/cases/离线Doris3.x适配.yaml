cases:
  - case_id: C0001
    title: 验证【数据源】-【引入数据源】引入并筛选Doris3.x数据源，列表仅展示该类型
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 公共管理数据源中心存在该数据源，连接状态为「可用」
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 点击「引入数据源」并展开「数据源类型」
        expected: 下拉列表包含「Doris3.x」选项
      - action: 选择「${DataSourceA}」并确认引入
        expected: 数据源列表新增「${DataSourceA}」，类型列为「Doris3.x」
      - action: 在数据源类型筛选中选择「Doris3.x」
        expected: 列表仅展示类型为「Doris3.x」的数据源
    tags:
      - 数据源
      - 引入数据源
      - Doris3.x

  - case_id: C0002
    title: 验证【数据源】-【整库同步】配置Doris3.x到Other的整库同步任务，目标端同步3行数据
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14835_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14835_c0002 (id BIGINT, name STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_14835_c0002 VALUES (1, 'A', 10.00), (2, 'B', 20.00), (3, 'C', 30.00);
      5) 授权数据源：${DataSourceC}
      6) 数据源类型：SparkThrift2.x
      7) 存在数据库：${SchemaC}
      8) 创建目标表，该表为空表：
         DROP TABLE IF EXISTS ${SchemaC}.test_table_14835_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_14835_c0002 (id BIGINT, name STRING, amount DECIMAL(10,2));
      9) 目标数据库 ${DataSourceC}.${SchemaC} 已授权给离线开发项目
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 选择「${DataSourceA}」并点击「整库同步」
        expected: 打开整库同步配置页，源端显示 ${DataSourceA}
      - action: |-
          配置整库同步：
          源库：${SchemaA}
          源表：test_table_14835_c0002
          目标数据源：${DataSourceC}
          目标数据库：${SchemaC}
          同步方式：全量
          点击「发布任务」
        expected: Toast提示:「发布成功」，同步历史新增 1 条记录且状态为「运行完成」
      - action: 在目标端执行 `SELECT COUNT(*) FROM ${SchemaC}.test_table_14835_c0002`
        expected: 查询结果为 3，`SELECT SUM(amount) FROM ${SchemaC}.test_table_14835_c0002` 查询结果为 60.00
    tags:
      ["数据源", "整库同步"]
