          '2024-07-22 09:15:00',
          '孙倩',
          31,
          'UX设计师，关注用户行为与界面交互设计。',
          '1993-04-18',
          '2025-06-04 09:30:00',
          TRUE,
          1. 65,
          'sunqian@example.com',
          'https://example.com/pic/sunqian.jpg',
          15000. 0,
          2,
          '{"技能": ["Figma", "Sketch"], "城市": "杭州"}'
      );

      -- 插入第三条数据
