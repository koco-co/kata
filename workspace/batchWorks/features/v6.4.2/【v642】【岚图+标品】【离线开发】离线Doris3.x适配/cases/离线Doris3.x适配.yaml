      );

      SELECT * FROM example_primary_key_table;
    steps:
      - action: 进入「离线开发-数据源」页面
        expected: 进入成功
      - action: 选择一条Doris3.x类型的数据源记录, 点击「整库同步」
        expected: 进入整库同步页面
      - action: |-
          配置如下:
          源表: 勾选${tableA}
          目标: SparkThrift2.x
          Schema: 选择${schemaA}
          方式: 全量
          日期、时间: 默认
          并发配置: 整批上传
          保存目录: 默认
        expected: 配置成功
      - action: 点击发布任务
        expected: 发布成功, 「同步历史」新增同步记录
      - action: "T+1后, 新建SparkSQL任务, 执行SQL: SELECT * FROM ${schemaA}.${tableA};"
        expected: 查询成功, 表记录与Doris3.x表记录一致
      - action: |-
          再次配置Doris3.x「整库同步」:
          源表: 勾选${tableB}
          目标: Hive2.x
          Schema: ${schemaB}
          方式: 全量
          日期、时间: 默认
          并发配置: 整批上传
          保存目录: 默认
        expected: 配置成功
      - action: 点击发布任务
        expected: 发布成功, 「同步历史」新增同步记录
      - action: "T+1后, 新建HiveSQL任务, 执行SQL: SELECT * FROM ${schemaB}.${tableB};"
        expected: 查询成功, 表记录与Doris3.x表记录一致
      - action: |-
          再次配置Doris3.x「整库同步」:
          源表: 勾选${tableC}
