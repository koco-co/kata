          '2025-01-10 14:20:00',
          '马超',
          42,
          '技术总监，具备多年团队管理与项目规划经验。',
          '1982-11-05',
          '2025-06-03 18:45:00',
          TRUE,
          1. 78,
          'machao@example.com',
          'https://example.com/pic/machao.jpg',
          24000. 0,
