        expected: 配置成功
      - action: 点击发布任务
        expected: 发布成功, 「同步历史」新增同步记录
      - action: "T+1后, 新建DorisSQL任务, 执行SQL: SELECT * FROM ${schemaC}.${tableC};"
        expected: 查询成功, 表记录与Doris3.x表记录一致
