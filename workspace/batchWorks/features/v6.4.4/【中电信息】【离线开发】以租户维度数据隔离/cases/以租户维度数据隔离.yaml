      - action: "进入项目管理, 分别添加Hive、Doris、DMMySQL计算引擎, 初始化方式: 创建"
        expected: "引擎添加成功, 三个数据源的连接信息均存在Schema: project12"
      - action: 切换到租户 B 创建项目, 展开Hive计算引擎「对接已有 Schema」, 检查Schema列表
        expected: 不展示租户 A 中创建的 Schema(project12)
      - action: 「Schema」输入框搜索project12
        expected: 暂无数据, 无法查询到对应的Schema
      - action: 展开Doris计算引擎「对接已有 Schema」, 检查Schema列表并搜索查询
