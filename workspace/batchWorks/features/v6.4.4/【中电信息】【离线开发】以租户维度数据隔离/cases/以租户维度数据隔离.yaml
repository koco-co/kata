meta:
  title: 【中电信息】以租户维度数据隔离
  requirement_id: "15174"
  case_module_id: "9825"
  imports:
    - 202512-离线开发v6.4.4.xmind
  exports:
    - 以租户维度数据隔离.xmind
cases:
  - case_id: C0001
    title: "验证「Schema列表」租户隔离功能生效(初始化方式: 创建)"
    priority: P1
    precondition: |-
      1、 控制台已配置Hive、Doris、Dmmysql计算组件
      2、 数据源中心已配置Doris、Dmmysql数据源
      3、 已存在至少两个租户TenantA, TenantB (对接同一套集群和数据源)

      4、 租户 A、租户 B 均无项目
    steps:
      - action: 进入【离线开发 → Schema列表租户隔离功能生效】页面
        expected: 已进入【离线开发 → Schema列表租户隔离功能生效】页面，显示页面标题与主要操作区域
      - action: |-
          进入离线开发, 使用租户 A 创建项目, 配置如下:
          1) 项目名称&标识: Project01
          2) 计算引擎配置勾选Hive, Doris, Dmmysql (创建)
        expected: |-
          1) 项目创建成功, Project01项目-数据源页面存在hive, doris, dmmysql的meta数据源
          2) 连接信息中的Schema均为project01
      - action: 切换到租户 B 创建项目, 展开Hive计算引擎「对接已有 Schema」, 检查Schema列表
        expected: 不展示租户 A 中创建的 Schema(project01)
      - action: 「Schema」输入框搜索project01
        expected: 暂无数据, 无法查询到对应的Schema
      - action: 展开Doris计算引擎「对接已有 Schema」, 检查Schema列表并搜索查询
        expected: 均不展示租户 A 中创建的 Schema(project01)
      - action: 展开DMMySQL计算引擎「对接已有 Schema」, 检查Schema列表并搜索查询
        expected: 均不展示租户 A 中创建的 Schema(project01)
    tags:
      - 创建项目 ❯
  - case_id: C0002
    title: "验证「Schema列表」租户隔离功能生效(初始化方式: 对接已有Schema)"
    priority: P0
    precondition: |-
      1、 控制台已配置Hive、Doris、Dmmysql计算组件
      2、 数据源中心已配置Doris、Dmmysql数据源
      3、 已存在至少两个租户TenantA, TenantB (对接同一套集群和数据源)

      4、 租户 A 项目 Project01 已对接 schema(hive、doris、dmmysql)

      5、 租户 B 尚未创建任何项目
    steps:
      - action: 进入【离线开发 → Schema列表租户隔离功能生效】页面
        expected: 已进入【离线开发 → Schema列表租户隔离功能生效】页面，显示页面标题与主要操作区域
      - action: 进入离线开发, 使用租户 B 创建项目 → 选择Hive计算引擎「对接已有 Schema」
        expected: Hive的Schema列表中不展示Schema(project01)
      - action: Schema输入框中输入project01, 检查schema列表
        expected: 暂无数据, 依旧不展示Schema(project01)
      - action: 选择Doris引擎-对接已有Doris Schema, 重复步骤1~2
        expected: Doris计算引擎Schema列表不展示Schema(project01)
      - action: 选择DMMySQL引擎-对接已有DMMySQL Schema, 重复步骤1~2
        expected: DMMySQL计算引擎Schema列表不展示Schema(project01)
      - action: |-
          创建项目配置:
          1) 项目名称&标识: Project02
          2) 列表中选择可用 Schema 创建项目
        expected: |-
          1) 项目创建成功, Project01项目-数据源页面存在hive, doris, dmmysql的meta数据源
          2) 连接信息中的Schema为各自对接的schema名称
    tags:
      - 创建项目 ❯
  - case_id: C0003
    title: "验证「Schema列表」租户隔离功能生效(初始化方式: 不创建且不对接Schema)"
    priority: P1
    precondition: |-
      1、 控制台已配置Hive、Doris、Dmmysql计算组件
      2、 数据源中心已配置Doris、Dmmysql数据源
      3、 已存在至少两个租户TenantA, TenantB (对接同一套集群和数据源)

      4、 租户 A 项目 Project01 已创建或对接 schema(hive、doris、dmmysql)
    steps:
      - action: 进入【离线开发 → Schema列表租户隔离功能生效】页面
        expected: 已进入【离线开发 → Schema列表租户隔离功能生效】页面，显示页面标题与主要操作区域
      - action: |-
          进入离线开发, 使用租户 B 创建项目, 配置如下:
          1) 项目名称&标识: Project03
          2) 计算引擎配置勾选Hive, Doris, Dmmysql (不创建且不对接Schema)
        expected: |-
          1) 项目创建成功, Project03项目-数据源页面存在hive, doris, dmmysql的meta数据源
          2) 连接信息中无Schema
      - action: 租户 B 后续创建项目 → 对接已有 Schema
        expected: hive、doris、dmmysql计算引擎均不展示 Schema(Project01)
    tags:
      - 创建项目 ❯
  - case_id: C0004
    title: "验证「项目删除」后租户隔离功能仍生效(初始化方式: 创建)"
    priority: P0
    precondition: |-
      1、 控制台已配置Hive、Doris、Dmmysql计算组件
      2、 数据源中心已配置Doris、Dmmysql数据源
      3、 控制台配置：Schema 租户隔离开关已开启
      4、 已存在至少两个租户TenantA, TenantB (对接同一套集群和数据源)

      5、 租户 A 项目 Project01 已对接 schema(hive、doris、dmmysql)
    steps:
      - action: 进入【离线开发 → 项目删除后租户隔离功能仍生效】页面
        expected: 已进入【离线开发 → 项目删除后租户隔离功能仍生效】页面，显示页面标题与主要操作区域
      - action: 进入离线开发, 租户 A 删除项目 Project01
        expected: 项目删除成功
      - action: 租户 B 创建项目 → 对接已有 Schema
        expected: hive, doris, dmmysql计算引擎均不展示Schema(project01)
      - action: "租户 B 创建项目 → 创建新Schema(项目标识: project01)"
        expected: "报错提示: Schema(project01)已存在"
    tags:
      - 创建项目 ❯
  - case_id: C0005
    title: "验证「项目删除」后租户隔离功能仍生效(初始化方式: 对接已有Schema)"
    priority: P1
