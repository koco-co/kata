meta:
  title: 【岚图】发布映射schema功能代码迁移
  requirement_id: '15099'
  case_module_id: '9735'
  imports:
    - 202512-离线开发v6.4.4.xmind
  exports:
    - 发布映射schema功能代码迁移.xmind
cases:
  - case_id: C0001
    title: 验证【数据源】-【映射配置】查看数据源映射配置弹窗，展示Schema映射区域与新增按钮
    priority: P1
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) 项目A和项目B均已引入数据源doris1、doris2
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击数据源doris1的映射配置按钮
        expected: |-
          1) 弹出映射配置弹窗, 下方新增Schema映射
          2) schema映射列表展示暂无数据, 有本项目schema、目标项目schema、操作三个字段和新增按钮
      - action: 点击ftp映射配置按钮, 查看是否新增schema映射配置
        expected: 未新增该字段
    tags: [数据源, 映射配置]

  - case_id: C0002
    title: 验证【数据源】-【映射配置】保存空Schema映射配置，非必填且空值校验提示
    priority: P1
    precondition: 1) 项目A绑定项目B为发布目标
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击数据源doris1的映射配置按钮
        expected: 弹出映射配置弹窗
      - action: 不点击新增按钮, 直接点击确定
        expected: 保存成功
      - action: 点击新增按钮, 不填写内容, 点击保存
        expected: 提示不能为空
      - action: 点击新增按钮, 添加多行, 不填写内容, 点击保存
        expected: 提示不能为空
      - action: 只选择本项目schema/目标项目schema, 另一个为空, 点击确定
        expected: 另一个选择框提示不能为空
    tags: [数据源, 映射配置]

  - case_id: C0003
    title: 验证【数据源】-【映射配置】查看非meta数据源Schema下拉框，展示全部schema且搜索匹配
    priority: P1
    precondition: 1) 项目A绑定项目B为发布目标
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击非meta数据源doris1的映射配置按钮
        expected: 弹出映射配置弹窗
      - action: 查看本项目schema下拉框
        expected: 返回doris1数据源下的所有schema
      - action: 发布目标选择非meta数据源doris1, 查看目标项目schema下拉框
        expected: 返回doris1数据源下的所有schema
      - action: 目标项目schema选择schemaA, 然后切换发布目标, 查看目标项目schema回填
        expected: 回填清空
      - action: 两个下拉框分别模糊搜索test
        expected: 结果与预期记录一致
    tags: [数据源, 映射配置]

  - case_id: C0004
    title: 验证【数据源】-【映射配置】查看meta数据源Schema下拉框，展示全部schema(配置项开启)
    priority: P0
    precondition: |-
      1) 添加或更改离线配置项: default.data.source.show.all.schema = true
      2) 项目A绑定项目B为发布目标
      3) 项目A、B对接三个doris集群, 初始化方式分别为: 创建、对接已有doris schema、不创建且不对接schema
      4) 三个doris集群分别为dorisA1、dorisA2、dorisA3和dorisB1、dorisB2、dorisB3
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击dorisA1的映射配置按钮, 查看本项目schema下拉框
        expected: |-
          1) 弹出映射配置弹窗
          2) 返回dorisA1数据源下的所有schema
      - action: 点击dorisA2的映射配置按钮, 查看本项目schema下拉框
        expected: 返回dorisA2数据源下的所有schema
      - action: 点击dorisA3的映射配置按钮, 查看本项目schema下拉框
        expected: 返回dorisA3数据源下的所有schema
      - action: 发布目标选择meta数据源dorisB1, 查看目标项目schema下拉框
        expected: 返回dorisB1数据源下的所有schema
      - action: 发布目标选择meta数据源dorisB2, 查看目标项目schema下拉框
        expected: 返回dorisB2数据源下的所有schema
      - action: 发布目标选择meta数据源dorisB3, 查看目标项目schema下拉框
        expected: 返回dorisB3数据源下的所有schema
    tags: [数据源, 映射配置]

  - case_id: C0005
    title: 验证【数据源】-【映射配置】查看meta数据源Schema下拉框，展示默认schema(配置项关闭)
    priority: P1
    precondition: '1) 添加或更改离线配置项: default.data.source.show.all.schema = false'
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击dorisA1的映射配置按钮, 查看本项目schema下拉框
        expected: |-
          1) 弹出映射配置弹窗
          2) 返回dorisA1的默认Schema(数据源列表连接信息中的schema)
      - action: 点击dorisA2的映射配置按钮, 查看本项目schema下拉框
        expected: 返回dorisA2的默认Schema(数据源列表连接信息中的schema)
      - action: 点击dorisA3的映射配置按钮, 查看本项目schema下拉框
        expected: 展示该数据源下的所有schema
      - action: 发布目标选择meta数据源dorisB1, 查看目标项目schema下拉框
        expected: 返回dorisB1的默认Schema(数据源列表连接信息中的schema)
      - action: 发布目标选择meta数据源dorisB2, 查看目标项目schema下拉框
        expected: 返回dorisB2的默认Schema(数据源列表连接信息中的schema)
      - action: 发布目标选择meta数据源dorisB3, 查看目标项目schema下拉框
        expected: 返回dorisB3的默认Schema(数据源列表连接信息中的schema)
    tags: [数据源, 映射配置]

  - case_id: C0006
    title: 验证【数据源】-【映射配置】配置单行Schema映射，保存后回填正确
    priority: P1
    precondition: 1) 项目A绑定项目B为发布目标
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击doris1的映射配置按钮, 发布目标选择doris2, 查看目标项目schema下拉框
        expected: |-
          1) 弹出映射配置弹窗
          2) 返回doris2数据源下的所有schema
      - action: 本项目schema选择schemaA, 目标项目schema选择schemaA, 点击确定
        expected: 保存成功
      - action: 点击映射配置查看展示
        expected: 回填正确
      - action: 目标项目schema选择schemaB, 点击确定
        expected: 保存成功
    tags: [数据源, 映射配置]

  - case_id: C0007
    title: 验证【数据源】-【映射配置】配置多行Schema映射，重复schema不可选且回填完整
    priority: P1
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) default.data.source.show.all.schema = true
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击doris1的映射配置按钮, 发布目标选择doris2, 查看目标项目schema下拉框
        expected: |-
          1) 弹出映射配置弹窗
          2) 返回doris2数据源下的所有schema
      - action: 本项目schema选择schemaA, 目标项目schema选择schemaA
        expected: 选择成功
      - action: 点击+按钮
        expected: 下方添加一行schema配置
      - action: 查看新增行的本项目schema和目标项目schema
        expected: |-
          1) 本项目schema中, schemaA不允许选择
          2) 目标项目schema中, 所有schema都允许选择
      - action: 选择schemaB-schemaA
        expected: 选择成功
      - action: 点击+按钮, 查看新增行的本项目schema和目标项目schema
        expected: |-
          1) 本项目schema中, schemaA、schemaB不允许选择
          2) 目标项目schema中, 所有schema都允许选择
      - action: 配置多行, 点击确定
        expected: 保存成功
      - action: 点击映射配置, 查看展示
        expected: 回填字段值与配置一致, 上限20行
    tags: [数据源, 映射配置]

  - case_id: C0008
    title: 验证【数据源】-【映射配置】删除Schema映射行，行数据按操作移除
    priority: P1
    precondition: 1) 项目A绑定项目B为发布目标
    steps:
      - action: 进入【数据源】页面
        expected: 进入成功
      - action: 进入离线开发-项目A-数据源, 点击doris1的映射配置按钮, 发布目标选择doris2, 查看目标项目schema下拉框
        expected: |-
          1) 弹出映射配置弹窗
          2) 返回doris2数据源下的所有schema
      - action: '添加多行配置: schemaA-schemaA、schemaB-schemaB、schemaC-schemaC、schemaD-schemaD、schemaE-schemaE'
        expected: 添加成功, 每一行后边都有增加和删除按钮
      - action: 删除第一行
        expected: 剩余schemaB-schemaB、schemaC-schemaC、schemaD-schemaD、schemaE-schemaE
      - action: 删除第二行
        expected: 剩余schemaB-schemaB、schemaD-schemaD、schemaE-schemaE
      - action: 删除最后一行
        expected: 剩余schemaB-schemaB、schemaD-schemaD
      - action: 删除所有
        expected: 允许删除
    tags: [数据源, 映射配置]

  - case_id: C0009
    title: 验证【项目管理】-【发布包管理】一键发布doris2doris任务，数据源回填映射目标(无Schema映射)
    priority: P2
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) 数据源映射关系: dorisA(meta)映射至dorisB(meta)
      3) Schema映射关系: 无
      4) 离线配置项default.data.source.show.all.schema = true
    steps:
      - action: 进入【项目管理 → 发布包管理】页面
        expected: 进入成功
      - action: 进入离线开发-项目A, 创建doris2doris数据同步任务, 配置source端为dorisA-schemaA-table1, sink端为dorisA-scheamB-table2, 保存提交任务
        expected: 提交成功
      - action: 进入发布任务页面, 打包doris2doris
        expected: 打包成功
      - action: 进入发布至目标项目页面, 点击发布
        expected: 弹出校验弹窗, 校验都通过
      - action: 点击确定
        expected: 发布成功
      - action: 查看项目B中doris2doris任务
        expected: 任务数据源回填dorisB, schema和table回填与创建任务时一致
      - action: 临时运行任务, 查看结果
        expected: 运行成功, 写入字段值与步骤中列出的固定输入值一致
    tags: [项目管理, 发布包管理, 一键发布]

  - case_id: C0010
    title: 验证【项目管理】-【发布包管理】一键发布doris2doris任务，schema缺失校验报错(配置项关闭)
    priority: P2
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) meta数据源dorisA映射至meta数据源dorisB
      3) 离线配置项default.data.source.show.all.schema = false
    steps:
      - action: 进入【项目管理 → 发布包管理】页面
        expected: 进入成功
      - action: 进入离线开发-项目A, 创建doris2doris数据同步任务, 配置source端为dorisA-schemaA-table1, sink端为dorisA-scheamA-table2, 保存提交任务
        expected: 提交成功
      - action: 进入发布任务页面, 打包doris2doris
        expected: 打包成功
      - action: 进入发布至目标项目页面, 点击发布
        expected: 弹出校验弹窗, 校验都通过
      - action: 点击确定
        expected: 发布成功
      - action: 查看项目B中doris2doris任务
        expected: 任务数据源回填dorisB, schema和table回填与创建任务时一致
      - action: 点击上一步, 进入source端
        expected: 报错schema不存在
    tags: [项目管理, 发布包管理, 一键发布]

  - case_id: C0011
    title: 验证【项目管理】-【发布包管理】一键发布映射不同数据源任务，sink端schema校验报错
    priority: P2
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) show.all.schema = true
      3) meta数据源dorisA映射至非meta数据源doris1, 不同集群, doris1下存在schemaA, 不存在schemaB
      4) 离线配置项default.data.source.show.all.schema = true
    steps:
      - action: 进入【项目管理 → 发布包管理】页面
        expected: 进入成功
      - action: 进入离线开发-项目A, 创建doris2doris数据同步任务, 配置source端为dorisA-schemaA-table1, sink端为dorisA-scheamB-table2, 保存提交任务
        expected: 提交成功
      - action: 进入发布任务页面, 打包doris2doris
        expected: 打包成功
      - action: 进入发布至目标项目页面, 点击发布
        expected: 弹出校验弹窗, 校验都通过
      - action: 点击确定
        expected: 发布成功
      - action: 查看项目B中doris2doris任务
        expected: 任务数据源回填doris1, schema和table回填与创建任务时一致
      - action: 点击上一步, 进入source端和sink端
        expected: |-
          1) source端不报错
          2) sink端报错schema不存在
    tags: [项目管理, 发布包管理, 一键发布]

  - case_id: C0012
    title: 验证【项目管理】-【发布包管理】一键发布一对一Schema映射任务，source与sink按映射回填
    priority: P2
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) meta数据源dorisA映射至meta数据源dorisB
      3) schema映射配置: schemaA-schemaB, scheamB-scheamA
      4) 离线配置项default.data.source.show.all.schema = true
    steps:
      - action: 进入【项目管理 → 发布包管理】页面
        expected: 进入成功
      - action: 进入离线开发-项目A, 创建doris2doris数据同步任务, 配置source端为dorisA-schemaA-table1, sink端为dorisA-scheamB-table2, 保存提交任务
        expected: 提交成功
      - action: 进入发布任务页面, 打包doris2doris
        expected: 打包成功
      - action: 进入发布至目标项目页面, 点击发布
        expected: 弹出校验弹窗, 校验都通过
      - action: 点击确定
        expected: 发布成功
      - action: 查看项目B中doris2doris任务
        expected: |-
          1) 任务数据源回填dorisB
          2) source端: dorisB-schemaB-table1
          3) sink端: dorisB-schemaA-table2
      - action: 映射schema下表不存在, 运行任务, 查看结果
        expected: 运行报错, 表不存在
      - action: 映射schema下创建对应表, 临时运行, 查看结果
        expected: 运行成功, schemaA-table2中写入scheamB-table1数据, 写入正确
    tags: [项目管理, 发布包管理, 一键发布]

  - case_id: C0013
    title: 验证【项目管理】-【发布包管理】一键发布不同数据源一对一映射任务，按映射回填且运行成功
    priority: P2
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) meta数据源dorisA映射至非meta数据源doris1
      3) schema映射配置: schemaA-schema1, scheamB-scheam2
      4) 离线配置项default.data.source.show.all.schema = true
    steps:
      - action: 进入【项目管理 → 发布包管理】页面
        expected: 进入成功
      - action: 进入离线开发-项目A, 创建doris2doris数据同步任务, 配置source端为dorisA-schemaA-table1, sink端为dorisA-scheamB-table2, 保存提交任务
        expected: 提交成功
      - action: 进入发布任务页面, 打包doris2doris
        expected: 打包成功
      - action: 进入发布至目标项目页面, 点击发布
        expected: 弹出校验弹窗, 校验都通过
      - action: 点击确定
        expected: 发布成功
      - action: 查看项目B中doris2doris任务
        expected: |-
          1) 任务数据源回填doris1
          2) source端: doris1-schema1-table1
          3) sink端: doris1-schema2-table2
      - action: 映射schema下表不存在, 运行任务, 查看结果
        expected: 运行报错, 表不存在
      - action: 映射schema下创建对应表, 临时运行, 查看结果
        expected: 运行成功, schemaA-table2中写入scheamB-table1数据, 写入正确
    tags: [项目管理, 发布包管理, 一键发布]

  - case_id: C0014
    title: 验证【项目管理】-【发布包管理】一键发布多对一Schema映射任务，source与sink按映射回填
    priority: P2
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) meta数据源dorisA映射至meta数据源dorisB
      3) schema映射配置: schemaA-schemaB, scheamB-scheamB
      4) 离线配置项default.data.source.show.all.schema = true
