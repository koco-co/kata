  - case_id: C0015
    title: 验证【项目管理】-【发布包管理】一键发布不同数据源多对一映射任务，按映射回填且运行成功
    priority: P2
    precondition: |-
      1) 项目A绑定项目B为发布目标
      2) meta数据源dorisA映射至非meta数据源doris1
      3) schema映射配置: schemaA-schema1, scheamB-scheam1
