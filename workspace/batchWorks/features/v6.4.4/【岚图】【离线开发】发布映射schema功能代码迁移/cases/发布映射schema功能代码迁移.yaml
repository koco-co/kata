          2) source端: dorisB-schemaB-table1
          3) sink端: dorisB-schemaB-table2
      - action: schemaB下不存在表table1, 运行任务, 查看结果
        expected: 运行报错, 表不存在
      - action: schemaB下创建表table1, 然后临时运行, 查看结果
        expected: 运行成功, 写入字段值与步骤中列出的固定输入值一致
