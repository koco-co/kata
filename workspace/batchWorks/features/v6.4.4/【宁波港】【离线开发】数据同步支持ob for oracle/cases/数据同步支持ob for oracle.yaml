  title: 验证支持引入OBOracle数据源完成目标操作且状态更新
  priority: P1
  precondition: '1. 成功进入测试项目

    2. 数据源中心存在授权给离线计算的OBOracle数据源'
  steps:
  - action: 进入【离线开发 → 数据源 ❯】页面
    expected: 已进入【离线开发 → 数据源 ❯】页面，显示页面标题与主要操作区域
  - action: 点击数据源--引入数据源
    expected: 当前页面弹窗引入数据源列表
  - action: 点击数据源类型下拉框
    expected: 展示OBOracle选项
  - action: 选择OBOracle类型的数据源
    expected: OBOracle的对应信息在离线项目页面中正确回显
  - action: 选中OBOracle数据源，点击确定
    expected: 引入OBOracle数据源成功，当前弹窗关闭
