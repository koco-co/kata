  - action: 进入【数据开发 → 任务开发】页面
    expected: 进入成功
  - action: 在自定义 SQL 中选择源表字段 id 作为切分键并设置并发数 2
    expected: 切分键显示 id,并发数显示 2
  - action: 保存、发布并运行任务
