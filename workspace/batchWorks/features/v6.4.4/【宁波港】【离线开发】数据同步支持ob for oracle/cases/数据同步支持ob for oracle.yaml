- case_id: C0009
  title: 验证【数据同步任务】-【整库同步】配置OBOracle到Hive整库同步并临时运行，任务运行成功且目标表记录数为2
  priority: P0
  precondition: |-
    1) 授权数据源 A：${DataSourceA}
    2) 数据源 A 类型：OceanBaseOracle
    3) 数据源 A 存在数据库：${SchemaA}
    4) 在 ${SchemaA} 创建源表并插入 2 行数据：
       BEGIN
         EXECUTE IMMEDIATE 'DROP TABLE ${SchemaA}.test_table_15077_c0009_source_01';
       EXCEPTION
         WHEN OTHERS THEN
           IF SQLCODE != -942 THEN RAISE; END IF;
       END;
       /
       CREATE TABLE ${SchemaA}.test_table_15077_c0009_source_01 (
         id NUMBER,
         code VARCHAR2(20)
       );
       INSERT INTO ${SchemaA}.test_table_15077_c0009_source_01 VALUES (1, 'A001');
       INSERT INTO ${SchemaA}.test_table_15077_c0009_source_01 VALUES (2, 'A002');
       COMMIT;
    5) 授权数据源 B：${DataSourceB}
    6) 数据源 B 类型：Hive
    7) 数据源 B 存在数据库：${SchemaB}
    8) 在 ${SchemaB} 预建目标表结构，该表为空表：
       DROP TABLE IF EXISTS ${SchemaB}.test_table_15077_c0009_target_01;
       CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15077_c0009_target_01 (
         id BIGINT,
         code STRING
       );
  steps:
  - action: 进入【数据源】页面
    expected: 进入成功
  - action: 点击「${DataSourceA}」操作列的「整库同步」
    expected: 打开整库同步配置页
  - action: 选择 schema「${SchemaA}」、表「test_table_15077_c0009_source_01」、目标数据源「${DataSourceB}」并点击「发布任务」
    expected: Toast提示:「发布成功」,任务列表新增 1 条同步任务
  - action: 进入【数据开发 → 任务开发】页面
    expected: 进入成功
  - action: 点击该任务的「临时运行」
    expected: 运行状态：「成功」
  - action: 查看目标表「${SchemaB}.test_table_15077_c0009_target_01」记录
    expected: 目标表记录数为 2，字段 id 的值为 1、2
  tags:
  - 数据源
  - 整库同步
- case_id: C0010
  title: 验证【数据同步任务】-【整库同步】配置MySQL到OBOracle整库同步并临时运行，任务运行成功且目标表记录数为2
  priority: P1
  precondition: |-
    1) 授权数据源 A：${DataSourceA}
    2) 数据源 A 类型：OceanBaseOracle
    3) 授权数据源 C：${DataSourceC}
    4) 数据源 C 类型：MySQL
    5) 数据源 C 存在数据库：${SchemaC}
    6) 在 ${SchemaC} 创建源表并插入 2 行数据：
       DROP TABLE IF EXISTS ${SchemaC}.test_table_15077_c0010;
       CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_15077_c0010 (
         id BIGINT,
         code VARCHAR(20)
       );
       INSERT INTO ${SchemaC}.test_table_15077_c0010 VALUES (1, 'A001'), (2, 'A002');
  steps:
  - action: 进入【数据开发 → 任务开发】页面
    expected: 进入成功
  - action: 新建数据同步任务，来源选择「${DataSourceC}.${SchemaC}.test_table_15077_c0010」，目标选择非 Meta 数据源「${DataSourceA}」
    expected: 来源表和目标数据源显示在任务配置中
  - action: 点击「保存」并「发布任务」
    expected: Toast提示:「发布成功」,任务状态显示「未运行」
  - action: 点击「临时运行」
    expected: 运行状态：「成功」,目标表记录数为 2
  tags:
  - 数据开发
  - 任务开发
  - 整库同步
