meta:
  title: 【宁波港】数据同步支持ob for oracle
  feature_id: offline-oceanbase-oracle-data-sync
  requirement_id: '15077'
  case_module_id: '9736'
  imports:
  - 202512-离线开发v6.4.4.xmind
  exports:
  - 数据同步支持ob for oracle.xmind
cases:
- case_id: C0001
  title: 验证【数据源】-【引入数据源】选择OBOracle类型并勾选引入，列表新增数据源且类型显示OBOracle
  priority: P1
  precondition: |-
    1) 数据源中心存在类型为「OceanBaseOracle」的数据源「${DataSourceA}」
    2) 「${DataSourceA}」已授权给离线项目「${ProjectA}」
  steps:
  - action: 进入【数据源】页面
    expected: 进入成功
  - action: 点击「引入数据源」并打开数据源类型下拉框
    expected: 下拉选项包含「OBOracle」
  - action: 选择「OBOracle」并勾选「${DataSourceA}」后点击「确定」
    expected: Toast提示:「引入成功」,列表新增「${DataSourceA}」且类型显示「OBOracle」
  tags:
  - 数据源
  - 引入数据源
- case_id: C0002
  title: 验证【数据源中心】-【编辑数据源】修改OBOracle配置并保存，离线数据源详情同步显示新配置
  priority: P0
  precondition: |-
    1) 离线项目「${ProjectA}」已引入「${DataSourceA}」
    2) 数据源中心中「${DataSourceA}」的 JDBC 地址为 `jdbc:oceanbase://ob-15077:2883`，描述为「OBOracle-15077」
  steps:
  - action: 进入【平台管理 → 数据源中心】页面
    expected: 进入成功
  - action: 编辑「${DataSourceA}」，将 JDBC 地址改为 `jdbc:oceanbase://ob-15077-new:2883`、描述改为「OBOracle-15077-new」并点击「保存」
    expected: Toast提示:「保存成功」,数据源列表显示新 JDBC 地址和新描述
  - action: 进入【数据源】页面
    expected: 进入成功
  - action: 查看「${DataSourceA}」详情
    expected: JDBC 地址为 `jdbc:oceanbase://ob-15077-new:2883`,描述为「OBOracle-15077-new」
  tags:
  - 平台管理
  - 数据源中心
  - 编辑数据源
- case_id: C0003
  title: 验证【数据源】-【取消引入】取消被任务引用的数据源，提示无法取消且列表保留该数据源
  priority: P1
  precondition: |-
    1) 离线项目「${ProjectA}」已引入「${DataSourceA}」
    2) 任务「${TaskA}」使用「${DataSourceA}」作为来源数据源
  steps:
  - action: 进入【数据源】页面
    expected: 进入成功
  - action: 点击「${DataSourceA}」操作列的「取消引入」
    expected: 打开二次确认弹窗
  - action: 点击确认弹窗中的「确定」
    expected: Toast提示:「数据源正在被任务使用，无法取消引入」,「${DataSourceA}」仍在列表中
  tags:
  - 数据源
  - 取消引入
- case_id: C0004
  title: 验证【数据源】-【取消引入】取消未被任务引用的数据源，提示取消成功且列表不再显示该数据源
  priority: P1
  precondition: |-
    1) 离线项目「${ProjectA}」已引入「${DataSourceA}」
    2) 离线项目中不存在引用「${DataSourceA}」的任务
  steps:
  - action: 进入【数据源】页面
    expected: 进入成功
  - action: 点击「${DataSourceA}」操作列的「取消引入」
    expected: 点击成功
  - action: 「确定」
    expected: Toast提示:「取消引入成功」,列表不再显示「${DataSourceA}」
  tags:
  - 数据源
  - 取消引入
- case_id: C0005
  title: 验证【数据源】-【筛选】按类型筛选并搜索OBOracle数据源，列表仅展示匹配的数据源
  priority: P2
  precondition: |-
    1) 离线项目「${ProjectA}」已引入「${DataSourceA}」和「${DataSourceC}」
  steps:
  - action: 进入【数据源】页面
    expected: 进入成功
  - action: 打开筛选下拉框并选择数据源类型「OBOracle」
    expected: 下拉框显示「OBOracle」已选
  - action: 点击「确定」
    expected: 列表仅显示「${DataSourceA}」,类型列显示「OBOracle」
  - action: 在搜索框输入 `${DataSourceA}`
    expected: 列表保留 1 条名称为「${DataSourceA}」的记录
  tags:
  - 数据源
  - 筛选
- case_id: C0006
  title: 验证【数据源】-【映射配置】配置项目间数据源映射，映射状态显示已配置且生产项目仅展示取消引入
  priority: P0
  precondition: |-
    1) 测试项目「${ProjectA}」和生产项目「${ProjectB}」均已引入「${DataSourceA}」
    2) 测试项目已绑定发布目标「${ProjectB}」
  steps:
  - action: 进入【数据源】页面
    expected: 进入成功
  - action: 点击测试项目中「${DataSourceA}」操作列的「映射配置」
    expected: 打开映射配置弹窗，本项目数据源名称显示「${DataSourceA}」
  - action: 在发布目标下拉框选择「${ProjectB}」中的「${DataSourceA}」并点击「确定」
    expected: 弹窗关闭,测试项目中的映射状态显示「已配置」
  - action: 切换至生产项目查看「${DataSourceA}」操作列
    expected: 生产项目仅显示「取消引入」,不显示「映射配置」
  tags:
  - 数据源
  - 数据源映射
