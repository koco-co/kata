  priority: P1
  precondition: |-
    1) 授权数据源 A：${DataSourceA}
    2) 数据源 A 类型：OceanBaseOracle
    3) 数据源 A 存在数据库：${SchemaA}、${SchemaA2}
    4) 创建分区表并写入前一日和当日两个分区：
       BEGIN
         EXECUTE IMMEDIATE 'DROP TABLE ${SchemaA}.test_table_15077_c0020';
       EXCEPTION
         WHEN OTHERS THEN
           IF SQLCODE != -942 THEN RAISE; END IF;
       END;
       /
       CREATE TABLE ${SchemaA}.test_table_15077_c0020 (
         id NUMBER,
         code VARCHAR2(20),
         dt DATE
       ) PARTITION BY RANGE (dt) (
         PARTITION p_prev VALUES LESS THAN (DATE '2026-01-01'),
         PARTITION p_curr VALUES LESS THAN (DATE '2027-01-01'),
         PARTITION p_future VALUES LESS THAN (MAXVALUE)
       );
       INSERT INTO ${SchemaA}.test_table_15077_c0020 (id, code, dt) VALUES (1, 'A001', current_date - interval '1 day');
       INSERT INTO ${SchemaA}.test_table_15077_c0020 (id, code, dt) VALUES (2, 'A002', current_date);
       COMMIT;
    5) 任务并发数为 2，目标 schema 为「${SchemaA2}」
