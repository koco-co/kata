- case_id: C0012
  title: 验证「数据来源-数据预览」完成目标操作且状态更新
  priority: P0
  precondition: "1. 当前项目中已经成功引入OBOracle数据源\n\n2. OBOracle中存在含有2 个字段的表, 建表语句如下:\n\nBEGIN\n    EXECUTE IMMEDIATE 'DROP TABLE\
    \ PORT_VESSEL_OPERATION_RECORD';\nEXCEPTION\n    WHEN OTHERS THEN\n        IF SQLCODE != -942 THEN\n            RAISE;\n\
    \        END IF;\nEND;\n\nCREATE TABLE PORT_VESSEL_OPERATION_RECORD (\n    VESSEL_CODE SMALLINT,\n    CARGO_DENSITY BINARY_DOUBLE,\n\
    \    BERTH_CODE CHAR(3),\n    VESSEL_NAME VARCHAR(100),\n    VOYAGE_NO VARCHAR2(50),\n    NATIONALITY_CODE NCHAR(2),\n\
    \    SHIPPING_COMPANY NVARCHAR2(120),\n    CONTAINER_COUNT INT,\n    CREW_GROUP_ID INTEGER,\n    TOTAL_WEIGHT_TON NUMBER(12,3),\n\
    \    CARGO_VOLUME_M3 DECIMAL(10,2),\n    FUEL_CONSUMPTION_RATE FLOAT,\n    SCHEDULED_BERTHING_DATE DATE,\n    AIS_DEVICE_MAC\
    \ RAW(6),\n    LOG_SNAPSHOT BLOB,\n    DRAFT_DEPTH_M BINARY_FLOAT,\n    ACTUAL_BERTHING_TS TIMESTAMP,\n    RECORD_CREATED_TSLTZ\
    \ TIMESTAMP WITH LOCAL TIME ZONE,\n    ESTIMATED_DEPARTURE_TSTZ TIMESTAMP WITH TIME ZONE,\n    CONTRACT_VALIDITY INTERVAL\
    \ YEAR TO MONTH,\n    MAX_BERTHING_DELAY INTERVAL DAY TO SECOND\n)\nPARTITION BY RANGE (SCHEDULED_BERTHING_DATE) (\n \
    \   PARTITION p_2025_q1 VALUES LESS THAN (DATE '2025-04-01'),\n    PARTITION p_2025_q2 VALUES LESS THAN (DATE '2025-07-01'),\n\
    \    PARTITION p_2025_q3 VALUES LESS THAN (DATE '2025-10-01'),\n    PARTITION p_2025_q4 VALUES LESS THAN (DATE '2026-01-01'),\n\
    \    PARTITION p_max VALUES LESS THAN (MAXVALUE)\n);\n\nCOMMENT ON TABLE PORT_VESSEL_OPERATION_RECORD IS '宁波港船舶靠泊与货物装卸作业记录表';\n\
    COMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.VESSEL_CODE IS '船舶内部编号';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.CARGO_DENSITY\
    \ IS '货物密度（吨/立方米）';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.BERTH_CODE IS '靠泊码头代码';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.VESSEL_NAME\
    \ IS '船名';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.VOYAGE_NO IS '航次号';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.NATIONALITY_CODE\
    \ IS '船舶国籍代码';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.SHIPPING_COMPANY IS '船公司名称';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.CONTAINER_COUNT\
    \ IS '集装箱数量';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.CREW_GROUP_ID IS '装卸工人班组ID';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.TOTAL_WEIGHT_TON\
    \ IS '货物总重量（吨）';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.CARGO_VOLUME_M3 IS '货物体积（立方米）';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.FUEL_CONSUMPTION_RATE\
    \ IS '燃油消耗率估算';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.SCHEDULED_BERTHING_DATE IS '计划靠泊日期';\nCOMMENT ON COLUMN\
    \ PORT_VESSEL_OPERATION_RECORD.AIS_DEVICE_MAC IS 'AIS设备MAC地址';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.LOG_SNAPSHOT\
    \ IS '船舶电子日志快照';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.DRAFT_DEPTH_M IS '实时吃水深度（米）';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.ACTUAL_BERTHING_TS\
    \ IS '实际靠泊时间戳';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.RECORD_CREATED_TSLTZ IS '操作记录创建时间（本地时区）';\nCOMMENT ON\
    \ COLUMN PORT_VESSEL_OPERATION_RECORD.ESTIMATED_DEPARTURE_TSTZ IS '预期离港时间（带时区）';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.CONTRACT_VALIDITY\
    \ IS '合同有效期（年-月间隔）';\nCOMMENT ON COLUMN PORT_VESSEL_OPERATION_RECORD.MAX_BERTHING_DELAY IS '最大允许靠泊延迟时间（天-秒间隔）';\n\nALTER\
    \ SESSION SET TIME_ZONE = '+08:00';\n\nINSERT INTO PORT_VESSEL_OPERATION_RECORD VALUES (\n    101,\n    1. 842375642389,\n\
    \    'NCT',\n    'COSCO SHIPPING AQUARIUS',\n    '2508E',\n    N'CN',\n    N'中远海运集团',\n    2845,\n    7,\n    32567. 890,\n\
    \    41250. 75,\n    12. 5,\n    DATE '2025-12-10',\n    HEXTORAW('A1B2C3D4E5F6'),\n    NULL,\n    14. 25,\n    TIMESTAMP\
    \ '2025-12-10 14:30:22.123',\n    TIMESTAMP '2025-12-10 14:35:00.000',\n    TIMESTAMP '2025-12-12 09:00:00.000 +08:00',\n\
    \    INTERVAL '2' YEAR,\n    INTERVAL '1 06:30:00' DAY TO SECOND\n);\n\nINSERT INTO PORT_VESSEL_OPERATION_RECORD VALUES\
    \ (\n    205,\n    0. 921456789012,\n    'MXT',\n    'MAERSK HANGZHOU',\n    '345W',\n    N'DK',\n    N'Maersk Line',\n\
    \    4120,\n    3,\n    45890. 123,\n    58760. 50,\n    18. 7,\n    DATE '2025-12-11',\n    HEXTORAW('112233445566'),\n\
    \    NULL,\n    15. 8,\n    TIMESTAMP '2025-12-11 08:15:45.678',\n    TIMESTAMP '2025-12-11 08:20:00.000',\n    TIMESTAMP\
    \ '2025-12-13 18:00:00.000 +08:00',\n    INTERVAL '1-6' YEAR TO MONTH,\n    INTERVAL '2 12:00:00' DAY TO SECOND\n);\n\n\
    INSERT INTO PORT_VESSEL_OPERATION_RECORD VALUES (\n    99,\n    2. 310987654321,\n    'ZGT',\n    'OOCL NINGBO',\n   \
    \ '888N',\n    N'HG',\n    N'东方海外',\n    3560,\n    12,\n    39876. 456,\n    49820. 25,\n    15. 2,\n    DATE '2025-12-09',\n\
    \    HEXTORAW('AAABBBCCCDDD'),\n    NULL,\n    13. 95,\n    TIMESTAMP '2025-12-09 22:45:10.999',\n    TIMESTAMP '2025-12-09\
    \ 22:50:00.000',\n    TIMESTAMP '2025-12-11 06:00:00.000 +08:00',\n    INTERVAL '3' YEAR,\n    INTERVAL '0 04:15:30' DAY\
    \ TO SECOND\n);\n\nSELECT * FROM PORT_VESSEL_OPERATION_RECORD;"
  steps:
  - action: 进入【离线开发 → 数据预览】页面
    expected: 已进入【离线开发 → 数据预览】页面，显示页面标题与主要操作区域
  - action: 进入数据开发模块，新建向导模式的数据同步任务
    expected: 新建成功
  - action: 配置数据来源为{OBOracle}数据源(非meta)，选择表PORT_VESSEL_OPERATION_RECORD
    expected: 表配置成功
  - action: 点击数据预览按钮
    expected: 下拉展示当前所选表前三条数据
  - action: 数据过滤输入VESSEL_CODE > 100，点击数据预览按钮
    expected: 下拉展示当前所选表VESSEL_CODE > 100的前三条数据
  - action: 选择自定义sql, 输入SELECT * FROM PORT_VESSEL_OPERATION_RECORD WHERE VESSEL_CODE > 100;，点击数据预览按钮
    expected: 下拉展示当前所选表VESSEL_CODE > 100的前三条数据
  tags:
  - 数据开发 ❯
- case_id: C0013
  title: 验证「数据来源&选择目标」Schema下拉框展示数据正常
  priority: P2
  precondition: "1. 当前项目中已经成功引入oboracle数据源\n\n2. oboracle中存在含有2 个字段的表\n\nBEGIN\n    EXECUTE IMMEDIATE 'DROP TABLE test_duoziduan_001';\n\
    EXCEPTION\n    WHEN OTHERS THEN\n        IF SQLCODE != -942 THEN\n            RAISE;\n        END IF;\nEND;\n\nCREATE\
    \ TABLE test_duoziduan_001 (\n    order_header_id VARCHAR2(4000),\n    order_date      NUMBER,\n    shop_id         VARCHAR2(4000),\n\
    \    customer_id     VARCHAR2(4000),\n    order_status    NUMBER,\n    pay_date        DATE,\n    pay_boolen      NUMBER(1,0),\n\
    \    pay_decli       NUMBER(10,2)\n);\n\nCOMMENT ON TABLE test_duoziduan_001 IS '销售订单明细表';\nCOMMENT ON COLUMN test_duoziduan_001.order_header_id\
    \ IS '订单头id';\nCOMMENT ON COLUMN test_duoziduan_001.order_date IS '订单日期';\nCOMMENT ON COLUMN test_duoziduan_001.shop_id\
