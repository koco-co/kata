meta:
  title: 【gate】任务提交至调度前需先通过审批
  feature_id: offline-task-submission-approval
  requirement_id: '15030'
  case_module_id: '9826'
  imports:
    - 202512-离线开发v6.4.4.xmind
  exports:
    - 任务提交至调度前需先通过审批.xmind
cases:
  - case_id: C0001
    title: 验证【平台管理】-【审批中心】查看流程管理列表，展示「离线任务提交审批」内置流程
    priority: P1
    precondition: 无
    steps:
      - action: 进入【平台管理 → 审批中心 → 流程管理】页面
        expected: 进入成功
      - action: 检查页面列表记录
        expected: 新增内置流程「离线任务提交审批」
      - action: 检查「离线任务提交审批」流程的信息
        expected: |-
          1) 流程名称: 离线任务提交审批(置于发布申请下方)
          2) 流程描述: 用于离线周期任务 / 手动任务提交前的申请与审批
          3) 对接内容: 离线开发: 任务提交审批
          4) 应用租户: 全部租户(默认)
          5) 是否启用: 关闭(默认)
    tags: [平台管理, 审批中心, 流程管理]

  - case_id: C0002
    title: 验证【平台管理】-【审批中心】编辑「离线任务提交审批」流程，保存后配置完整回显
    priority: P1
    precondition: 无
    steps:
      - action: 进入【平台管理 → 审批中心 → 流程管理】页面
        expected: 进入成功
      - action: 选择「离线任务提交审批」并点击编辑
        expected: |-
          进入「流程管理 > 编辑流程」页面, 默认进入设置基础信息流程, 回显内容如下:
          1) 流程名称: 默认展示离线任务提交审批
          2) 流程描述: 默认展示离线周期任务 / 手动任务提交前的申请与审批
          3) 对接内容: 默认勾选离线开发-任务提交审批(新增选项)
          4) 应用对象: 默认选中全部租户
      - action: 点击下一步, 进入设置审批流程, 检查节点详情
        expected: |-
          右侧展开组件配置详情:
          1) 节点名称: 默认显示为任务提交申请内置流程
          2) 审批人: 默认展示所有租户下的超级管理员、租户管理员、租户所有者角色作为审批人, 支持编辑修改
      - action: 新增审批人并保存后, 检查编辑后的回显内容
        expected: 编辑后的流程信息完整回显, 新增审批人保存在节点详情中
    tags: [平台管理, 审批中心, 流程管理]

  - case_id: C0003
    title: 验证【平台管理】-【审批中心】按对接内容筛选流程，筛出「离线任务提交审批」记录
    priority: P2
    precondition: 无
    steps:
      - action: 进入【平台管理 → 审批中心 → 流程管理】页面
        expected: 进入成功
      - action: 检查页面列表记录
        expected: 新增内置流程「离线任务提交审批」
      - action: 展开「对接内容」下拉框
        expected: 对接内容下拉框新增「离线开发-离线任务提交审批」筛选项
      - action: 筛选选项「离线任务提交审批」
        expected: 列表仅展示「离线任务提交审批」流程记录
    tags: [平台管理, 审批中心, 流程管理]

  - case_id: C0004
    title: 验证【平台管理】-【审批中心】查看审批单列表与详情弹窗，字段状态按规则展示
    priority: P1
    precondition: |-
      1) 已在「平台管理-审批中心-流程管理-离线任务提交审批」中开启选项
      2) 已创建非 admin 的普通账号 UserA
      3) 已配置「离线任务提交审批」流程的审批人为 userA 以外的用户
      4) 「平台管理-审批中心-审批授权」存在一个审批单, 审批单中存在一个审批任务 TaskA
    steps:
      - action: 进入【平台管理 → 审批中心 → 审批授权】页面
        expected: 进入成功
      - action: '使用审批人账号, 进入「审批授权-全部审批-离线开发」, 筛选「对接内容: 任务提交」'
        expected: 筛选成功
      - action: 检查审批单列表页
        expected: |-
          显示userA用户提交taskA任务的申请单, 回显内容及生成规则如下:
          1) 申请单: 任务每次提交都生成一个审批单, 点击可进入到申请单详情页面, 申请单号: AP-日期-编号
          2) 任务数量: 展示申请单内的任务总数
          3) 申请人: ${审批发起用户名称}
          4) 租户: ${任务所属租户}
          5) 项目: ${任务所属项目}
          6) 审批状态: ${审批流程状态}, 支持筛选: 已通过、已拒绝、审批中、已取消
          7) 审批人: ${当前审批用户名称}
          8) 申请时间: ${审批发起时间}
          9) 审批时间: ${审批完成时间}
          10) 操作: 审批详情(以抽屉形式在右侧展开)
      - action: 点击审批详情, 检查审批详情抽屉
        expected: |-
          展示如下内容:
          1) 标题: userA提交的离线任务提交审批
          2) 审批单状态: 已通过、已拒绝、审批中、已取消
          3) 申请信息: 所属租户、申请时间、所属项目、申请单名称、任务数量
          4) 申请理由: ${与任务提交时的备注一致}
          5) 审批流程: 发起申请(申请人: ${申请人}) → 任务提交申请内置流程(审批人: ${审批人}) → 流程结束
          6) 按钮: 上一条/下一条
      - action: 点击申请单名称, 检查审批单详情弹窗页
        expected: |-
          展示如下字段:
          1) 申请人: ${审批发起用户名称}
          2) 任务名称: ${审批任务名称}, 业务流程需要右侧加上标识
          3) 调度模式: ${任务调度模式}, 支持筛选: 周期任务、手动任务
          4) 任务类型: ${审批任务类型}, 支持筛选: 除业务流程外的所有任务类型(默认展示8条数据, 超出滚动展示)
          5) 租户: ${任务所属租户}
          6) 项目: ${任务所属项目}
          7) 申请时间: ${审批发起时间}
      - action: '进入「我已审批」页面, 筛选「对接内容: 任务提交」, 检查审批单列表页'
        expected: '去掉「审批人」字段, 审批状态支持筛选: 已通过、已拒绝、已取消, 其余字段与「全部审批」相同'
      - action: 检查「我已审批」的审批详情抽屉
        expected: 与「全部审批-审批详情」一致
      - action: 检查「我已审批」的审批单详情弹窗页
        expected: 与「全部审批-审批详情」一致
      - action: '进入「待我审批」页面, 筛选「对接内容: 任务提交」, 检查审批单列表页'
        expected: 去掉「审批状态 & 审批人 & 审批时间」字段, 操作列展示审批、批量通过/拒绝, 其余字段与「全部审批」相同
      - action: 检查「待我审批」的审批抽屉
        expected: 在「全部审批-审批详情」的基础上, 新增「审批理由」输入框、拒绝/通过按钮
      - action: 检查「待我审批」的审批单详情弹窗页
        expected: 与「全部审批-审批详情」一致
    tags: [平台管理, 审批中心, 审批授权]

  - case_id: C0005
    title: 验证【平台管理】-【审批中心】查看审批单审批详情，回显字段与状态完整
    priority: P1
    precondition: |-
      1) 已在「平台管理-审批中心-流程管理-离线任务提交审批」中开启选项
      2) 已创建非 admin 的普通账号 UserA
      3) 已配置「离线任务提交审批」流程的审批人为 userA 以外的用户
      4) 「平台管理-审批中心-审批授权」存在一个审批单, 审批单中存在一个审批任务 TaskA
    steps:
      - action: 进入【平台管理 → 审批中心 → 审批授权】页面
        expected: 进入成功
      - action: '使用审批人账号, 进入「审批授权-全部审批-离线开发」, 筛选「对接内容: 离线任务提交审批」'
        expected: 存在taskA任务的申请单
      - action: 点击申请单的「审批详情」
        expected: |-
          进入审批详情抽屉, 回显内容如下:
          1) 表单标题: ${任务提交人}提交的离线任务提交审批
          2) 任务状态: ${当前任务审批状态, 审批中 & 已结束}
          3) 申请信息: 包含所属租户、申请时间、所属项目、申请单名称、任务数量
          4) 申请理由: ${任务提交时的备注信息, 可为空}
          5) 审批流程: 发起申请(申请人: ${任务提交人}) → 任务提交申请内置流程(审批人: ${任务审批人}, 当前审批人、审批时间、审批状态、审批意见) → 流程结束
          6) 按钮: 上一条 / 下一条
      - action: 进入「我已审批」页面, 检查申请单的「审批详情」抽屉
        expected: 回显内容与「全部审批」中一致
      - action: 进入「待我审批」页面, 点击申请单的「审批」
        expected: |-
          进入审批详情表单, 回显内容如下:
          1) 表单标题: ${任务提交人}提交的离线任务提交审批
          2) 申请信息: 包含所属租户、申请时间、所属项目、申请单名称、任务数量
          3) 申请理由: ${任务提交时的备注信息, 可为空}
          4) 审批流程: 发起申请(申请人: ${任务提交人}) → 任务提交申请内置流程(审批人: ${任务审批人}, 审批状态: 审批中) → 流程结束
          5) 审批理由, 上限200字符
          6) 按钮: 上一条 / 下一条, 拒绝/通过
    tags: [平台管理, 审批中心, 审批授权]

  - case_id: C0006
    title: 验证【平台管理】-【审批中心】输入审批理由通过或拒绝，校验200字符上限
    priority: P1
    precondition: |-
      1) 已在「平台管理-审批中心-流程管理-离线任务提交审批」中开启选项
      2) 已创建非 admin 的普通账号 UserA
      3) 已配置「离线任务提交审批」流程的审批人为 userA 以外的用户
      4) 「平台管理-审批中心-审批授权」存在一个审批单, 审批单中存在一个审批任务 TaskA, 调度属性当日有时间可生成
    steps:
      - action: 进入【平台管理 → 审批中心 → 审批授权】页面
        expected: 进入成功
      - action: '使用审批人账号, 进入「待我审批」, 筛选「对接内容: 离线任务提交审批」, 「租户: ${taskA所在租户}」'
        expected: 存在taskA任务的申请单
      - action: 点击申请单的「审批」
        expected: 进入审批详情页面
      - action: 审批理由输入201字符
        expected: '提示: 审批理由上限200字符'
      - action: 审批理由输入200字符并通过
        expected: |-
          1) 申请单通过成功
          2) 「我已审批 & 全部审批」中, 申请单-审批详情中的审批意见与审批理由一致
          3) 「我的申请-已结束」中, 申请单-审批详情中的审批意见和审批理由一致
      - action: 选择申请单, 点击批量通过
        expected: 进入批量通过弹窗
      - action: 审批理由输入201字符
        expected: '提示: 审批理由上限200字符'
      - action: 审批理由输入200字符
        expected: |-
          1) 申请单通过成功, 任务提交至周期调度并生成周期实例
          2) 「我已审批 & 全部审批」中, 申请单-审批详情中的审批意见与审批理由一致
          3) 「我的申请-已结束」中, 申请单-审批详情中的审批意见和审批理由一致
      - action: 选择申请单, 点击批量拒绝
        expected: 进入批量拒绝弹窗
      - action: 审批理由输入201字符
        expected: '提示: 审批理由上限200字符'
      - action: 审批理由输入200字符
        expected: |-
          1) 申请单拒绝成功, 任务进入未提交状态
          2) 「我已审批 & 全部审批」中, 申请单-审批详情中的审批意见与审批理由一致
          3) 「我的申请-已结束」中, 申请单-审批详情中的审批意见和审批理由一致
    tags: [平台管理, 审批中心, 审批授权]

  - case_id: C0007
    title: 验证【平台管理】-【审批中心】批量提交后撤回与审批，申请单状态按动作更新
    priority: P1
    precondition: |-
      1) 已在「平台管理-审批中心-流程管理-离线任务提交审批」中开启选项
      2) 已创建非 admin 的普通账号 UserA
      3) 已配置「离线任务提交审批」流程的审批人为 userA 以外的用户
    steps:
      - action: 进入【平台管理 → 审批中心 → 审批授权】页面
        expected: 进入成功
      - action: 使用userA, 进入「离线开发-周期任务」, 新建Doris任务taskA~taskD并批量提交
        expected: |-
          1) 任务窗口提示: 任务已提交审批, 审批完成前不可编辑. 支持「查看进度」和「撤回」
          2) taskA~taskD任务变为「只读」状态
          3) 申请人账号: 审批中心生成申请单(含4个任务), 申请人: userA, 审批人: --, 审批状态: 审批中
          4) 审批人账号: 审批中心生成审批单(含4个任务), 申请人: userA, 审批人: --, 审批状态: 审批中
      - action: 使用userA, 在任务窗口中撤回任务
        expected: 撤回按钮置灰不可点击, hover提示“批量提交的任务仅支持申请单整体撤回”
      - action: 使用userA, 在审批中心中撤回申请单, 检查申请单状态和申请单详情中的任务状态
        expected: |-
          1) 任务窗口提示消失
          2) taskA~taskD任务变更为未提交状态
          3) 申请人账号: 申请单, 审批人: --, 审批状态: 已取消
          4) 审批人账号: 审批单, 审批人: --, 审批状态: 已取消
      - action: 使用审批人账号, 拒绝申请单, 检查申请单状态和申请单详情中的任务状态
        expected: |-
          1) 任务窗口提示消失
          2) taskA~taskD任务变更为未提交状态
          3) 申请人账号: 申请单, 审批人: ${审批人}, 审批状态: 已拒绝
          4) 审批人账号: 审批单, 审批人: ${审批人}, 审批状态: 已拒绝
      - action: 使用userA重新批量提交任务后, 切换到审批人账号, 通过申请单, 检查申请单状态和申请单详情中的任务状态
        expected: |-
          1) 任务窗口提示消失
          2) taskA~taskD任务变更为已提交状态, 运维中心生成计划时间的任务实例
          3) 申请人账号: 申请单, 审批人: ${审批人}, 审批状态: 已通过
          4) 审批人账号: 审批单, 审批人: ${审批人}, 审批状态: 已通过
    tags: [平台管理, 审批中心, 审批授权]

  - case_id: C0008
    title: 验证【平台管理】-【审批中心】批量通过申请单，任务提交至调度并生成实例
    priority: P0
    precondition: |-
      1) 已在「平台管理-审批中心-流程管理-离线任务提交审批」中开启选项
      2) 已创建非 admin 的普通账号 UserA、userB
      3) 已配置「离线任务提交审批」流程的审批人为 userA、userB 以外的用户
      4) 已创建申请单AP01~10, AP01~05由userA用户提交, AP06~10由userB用户提交
      5) AP01~10中的所有任务的调度周期为: 立即生成, 且可在当日生成实例(e.g. 生成时间可选在当前时间的2h后)
    steps:
      - action: 进入【平台管理 → 审批中心 → 审批授权】页面
        expected: 进入成功
      - action: 使用userA用户创建5个申请单AP01~05, 使用userB用户创建5个申请单AP06~10
        expected: |-
          1) userA-审批中心-我的申请: 存在AP01~05申请单, 审批状态: 「审批中」
          2) userB-审批中心-我的申请: 存在AP06~10申请单, 审批状态: 「审批中」
          3) 审批人账号-审批中心-审批授权: 存在AP01~10申请单, 审批状态: 「审批中」
      - action: 使用审批人账号, 进入「审批授权-待我审批」, 选中申请单(AP01~05)并批量通过
        expected: |-
          弹出「批量通过」弹窗:
          1) 标题: 批量通过
          2) 内容: 审批意见输入框, 置灰提示: 请输入审批意见
          3) 按钮: 取消 / 确定
      - action: 输入审批意见并确定
        expected: |-
          1) AP01~05中的所有任务窗口提示消失, 所有任务状态变更为「已提交」状态
          2) 申请人账号: 申请单审批状态: AP01~05(已通过)
          3) 审批人账号: 申请单审批状态: AP01~05(已通过)
      - action: 使用userA账号, 检查「运维中心-周期任务实例」页面
        expected: 存在「申请单AP01~05中所有任务实例-计划时间」在设定时间的实例
    tags: [平台管理, 审批中心, 审批授权]

  - case_id: C0009
    title: 验证【平台管理】-【审批中心】批量拒绝申请单，任务回退未提交状态
    priority: P0
    precondition: |-
      1) 已在「平台管理-审批中心-流程管理-离线任务提交审批」中开启选项
      2) 已创建非 admin 的普通账号 UserA、userB
      3) 已配置「离线任务提交审批」流程的审批人为 userA、userB 以外的用户
      4) 已创建申请单AP01~10, AP01~05由userA用户提交, AP06~10由userB用户提交
    steps:
