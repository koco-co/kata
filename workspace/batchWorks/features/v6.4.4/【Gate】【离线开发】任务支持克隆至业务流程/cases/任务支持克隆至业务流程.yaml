  - case_id: C0016
    title: 验证【数据开发】-【批量操作】批量克隆弹窗表单校验，提示信息按规则展示
    priority: P1
    precondition: |-
      1) 任务开发中已存在MySQL任务
      2) 业务流程中已存在业务流程任务${task_process}
    steps:
      - action: 进入【数据开发 → 批量操作】页面
        expected: 进入成功
      - action: 进入数据开发-批量操作中, 批量勾选任务后, 选择更多操作中的「克隆至业务流程」
        expected: 弹出“批量克隆至业务流程”弹窗
      - action: 「克隆至」置空后, 提交表单
        expected: '置红提示: 请选择业务流程'
      - action: 选择任一「克隆后任务名称」, 置空后提交表单
        expected: '置红提示: 任务名称不能为空'
      - action: 选择任一「克隆后任务名称」, 输入128+字符后, 提交表单
        expected: '置红提示: 任务名称不得超过128个字符！'
      - action: 选择任一「克隆后任务名称」, 输入#¥¥特殊字符后, 提交表单
        expected: '置红提示: 任务名称只能由字母、数字、中文、下划线组成！'
      - action: 选择任一「克隆后任务名称」, 输入${已存在的任务开发中的任务名称}后, 提交表单
        expected: '正常提交, 不会进行异常提示: 名称已存在. 而是在克隆结束后, 以失败日志来展示: ${任务名称}名称已存在'
      - action: 选择任一「克隆后任务名称」, 输入${已存在的业务流程子任务名称}后, 提交表单
        expected: '正常提交, 不会进行异常提示: 名称已存在. 而是在克隆结束后, 以失败日志来展示: ${任务名称}名称已存在'
      - action: '填写表单配置如下: 克隆至: ${task_process}, 任务名称: 均输入不重名的128个合法字符, 点击确定提交表单'
        expected: 表单提交成功, 进入任务克隆中状态, 等待一段时间后, 任务克隆结束
    tags: [数据开发, 批量操作, 批量任务克隆]

