  - case_id: C0014
    title: 验证【数据开发】-【批量操作】批量克隆PySpark任务至业务流程，任务运行成功
    priority: P2
    precondition: |-
      1) 业务流程中已存在业务流程任务task_process01、task_process02
      2) 任务开发、业务流程中均存在一条可成功运行的PySpark任务(pysparkDev、pyspark_process01、pyspark_process02), 脚本内容如下:
         from pyspark import SparkConf, SparkContext
         conf = SparkConf().setAppName("ThreeBody-WordFrequency")
         sc = SparkContext(conf=conf)
         lines = sc.parallelize([
             "不要回答！不要回答！不要回答！",
             "给岁月以文明，而不是给文明以岁月。",
             "我消灭你，与你无关。",
             "弱小和无知不是生存的障碍，傲慢才是。",
             "面壁者，破壁人。",
             "生存还是毁灭，这是个问题。",
             "前方高能预警。",
             "世界是一个巨大的拼图，每个人都是一块。",
             "想象力比知识更重要。",
             "文明要在宇宙中播种，就要接受被收割的风险。"
         ])
         words = lines.flatMap(lambda line: line.replace("，", "").replace("。", "").replace("！", "").split())
         word_counts = words.map(lambda word: (word, 1)).reduceByKey(lambda a, b: a + b)
         top_words = word_counts.takeOrdered(10, key=lambda x: -x[1])
         for rank, (word, count) in enumerate(top_words, 1):
             print("No.%d \"%s\" 出现了 %d 次。" % (rank, word, count))
         sc.stop()
    steps:
      - action: 进入【数据开发 → 批量操作】页面
        expected: 进入成功
