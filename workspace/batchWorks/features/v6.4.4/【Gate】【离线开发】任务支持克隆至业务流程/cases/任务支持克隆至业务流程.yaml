- case_id: C0007
  title: 验证「克隆至业务流程」表单校验提示完成目标操作且状态更新
  priority: P1
  precondition: '1) 任务开发中已存在MySQL任务

    2) 业务流程中已存在业务流程任务${task_process}'
  steps:
  - action: 进入【离线开发 → 克隆至业务流程表单校验提示完成目标操作且状态更新】页面
    expected: 已进入【离线开发 → 克隆至业务流程表单校验提示完成目标操作且状态更新】页面，显示页面标题与主要操作区域
  - action: 进入离线开发-周期任务, 选择MySQL任务并点击「克隆至业务流程」
    expected: 弹出“克隆至业务流程”弹窗
  - action: 「克隆至」置空后, 提交表单
    expected: '置红提示: 请选择业务流程'
  - action: 「任务名称」置空后, 提交表单
    expected: '置红提示: 任务名称不能为空'
