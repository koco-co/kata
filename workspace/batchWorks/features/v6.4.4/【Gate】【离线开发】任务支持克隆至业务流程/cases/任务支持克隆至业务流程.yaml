- case_id: C0014
  title: 验证 PySpark 任务-「批量克隆至业务流程」完成目标操作且状态更新
  priority: P2
  precondition: "1) 业务流程中已存在业务流程任务task_process01、 task_process02\n\n2) 任务开发、业务流程中均存在一条可成功运行的PySpark任务(pyspark_dev、pyspark_process01、pyspark_process02)\n\
    \n\nfrom pyspark import SparkConf, SparkContext\n\n# 初始化 Spark\nconf = SparkConf().setAppName(\"ThreeBody-WordFrequency\"\
    )\nsc = SparkContext(conf=conf)\n\nlines = sc.parallelize([\n    \"不要回答！不要回答！不要回答！\",\n    \"给岁月以文明，而不是给文明以岁月。\",\n  \
    \  \"我消灭你，与你无关。\",\n    \"弱小和无知不是生存的障碍，傲慢才是。\",\n    \"面壁者，破壁人。\",\n    \"生存还是毁灭，这是个问题。\",\n    \"前方高能预警。\",\n    \"世界是一个巨大的拼图，每个人都是一块。\"\
    ,\n    \"想象力比知识更重要。\",\n    \"文明要在宇宙中播种，就要接受被收割的风险。\"\n])\n\n# 词频处理\nwords = lines.flatMap(lambda line: line.replace(\"\
    ，\", \"\").replace(\"。\", \"\").replace(\"！\", \"\").split())\nword_counts = words.map(lambda word: (word, 1)).reduceByKey(lambda\
    \ a, b: a + b)\n\n# 排序 + 输出\ntop_words = word_counts.takeOrdered(10, key=lambda x: -x[1])\n\n# 输出结果\nprint(\"\U0001F4DA\
    《三体》台词词频排行榜 Top 10：\\n\")\nfor rank, (word, count) in enumerate(top_words, 1):\n    print(\"No.%d  \\\"%s\\\" 出现了 %d 次。\"\
    \ % (rank, word, count))\n\nsc.stop()"
  steps:
  - action: 进入【离线开发 → PySpark 任务】页面
    expected: 已进入【离线开发 → PySpark 任务】页面，显示页面标题与主要操作区域
  - action: 进入数据开发-批量操作中, 勾选PySpark任务 pyspark_dev后, 选择更多操作中的「克隆至业务流程」
    expected: 弹出“克隆至业务流程”弹窗
  - action: '填写表单配置如下:

      克隆至: task_process02

      任务名称: pyspark_dev_copy

      点击确定提交表单'
    expected: '1) 表单提交成功, 进入任务克隆中状态, 等待一段时间后, 任务克隆结束, 克隆状态为: 成功

      2) 业务流程task_process02存在两个未形成依赖关系的子任务'
  - action: 运行业务流程task_process02
    expected: 运行成功
  - action: 再次进入批量操作页面, 勾选任务pyspark_process01 并「批量克隆至业务流程」到task_process02后, 临时运行task_process02
    expected: 运行成功, 业务流程task_process02存在三个未形成依赖关系的子任务
