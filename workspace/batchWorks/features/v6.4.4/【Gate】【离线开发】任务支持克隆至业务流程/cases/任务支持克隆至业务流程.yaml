meta:
  title: 【gate】任务支持克隆至业务流程
  requirement_id: '15270'
  case_module_id: '9734'
  imports:
  - 202512-离线开发v6.4.4.xmind
  exports:
  - 任务支持克隆至业务流程.xmind
cases:
- case_id: C0001
  title: 验证支持「克隆至业务流程」的操作范围
  priority: P1
  precondition: '数据开发-周期任务-任务开发&业务路程目录下分别存在至少一条任务类型:

    数据同步、Hive SQL、Spark SQL、Flink、Doris SQL、StarRocks SQL、MySQL、SQL Server、PySpark、Spark、Impala SQL、Inceptor SQL、Shell、Python、HadoopMR、Oracle
    SQL、Greenplum SQL、Shell on Agent、Python on Agent、AnalyticDB PostgreSQL、TiDB SQL、GaussDB SQL、Trino SQL、HANA SQL、HashData
    SQL、虚节点、条件任务、工作流、工作流节点'
  steps:
  - action: 进入【离线开发 → 支持克隆至业务流程的操作范围】页面
    expected: 已进入【离线开发 → 支持克隆至业务流程的操作范围】页面，显示页面标题与主要操作区域
  - action: 进入离线开发-周期任务-任务开发中, 选择HiveSQL任务, 右键展开选项
    expected: 新增「克隆至业务流程」操作
  - action: 点击「克隆至业务流程」
    expected: '弹出“克隆至业务流程”弹窗, 表单配置如下:

      1) 克隆至：必选项, 置灰提示: 按业务流程名称搜索. 需要选择目标业务流程；下拉列表展示当前已创建的所有业务流程名称，并支持模糊搜索。

      2) 任务名称：必填项。默认以原任务名称追加“_copy”生成，可编辑。

      3) 描述：非必填项。默认展示“请输入任务描述”

      4) 操作按钮:

      - 「取消 & X」: 关闭弹窗，不执行任何操作；

      - 「确定」: 将当前任务克隆至所选业务流程，若业务流程内有名称相同的任务异常提示“名称已存在”，克隆成功后 toast 提示“任务成功克隆至业务流程”。'
  - action: 依次选中除工作流及其子节点外的所有任务类型, 右键任务检查展开选项
    expected: 均可选择「克隆至业务流程」操作, 点击后将弹出“克隆至业务流程”弹窗
  - action: 依次选中工作流、工作流子节点任务, 右键任务检查展开选项
    expected: 无「克隆至业务流程」选项, 不支持克隆该任务类型
  - action: 进入业务流程中, 依次选择业务流程子任务(包含所有任务类型), 右键任务检查展开选项
    expected: 均可选择「克隆至业务流程」操作, 点击后将弹出“克隆至业务流程”弹窗
  - action: 进入批量操作中, 点击「更多操作」, 检查展开选项
    expected: 新增「克隆至业务流程」操作
  - action: 批量选择任务后, 点击「克隆至业务流程」
    expected: '弹出“批量克隆至业务流程”弹窗, 表单配置如下:

      1) 已选任务数信息：展示”已选中的任务数：${已选中的任务数量}“

      2) 克隆至：必选项。需选择目标业务流程；下拉列表展示当前已创建的所有业务流程名称，并支持模糊搜索。

      3) 任务名称：必填项，以列表形式展示“原任务名称”和“克隆后任务名称”两列

      4) 操作按钮：

      - 「取消 & X」: 关闭弹窗，不执行任何操作；

      - 点击「确定」后进入批量克隆处理流程，展示批量克隆状态与结果'
- case_id: C0002
  title: 验证「克隆至业务流程」完成目标操作且状态更新(仅复制任务配置信息)
  priority: P0
  precondition: '1) 业务流程中已存在业务流程任务task_process01、 task_process02


    2) 数据开发-周期任务-任务开发&业务流程任务(task_process01、 task_process02)目录下分别存在至少一条如下任务:

    HiveSQL任务:

    SQL内容: SELECT 1;

    调度属性:

    - 实例生成方式: 立即生成

    - 调度周期: 分钟

    - 开始时间: 00:00

    - 间隔时间: 5分钟

    - 结束时间: 23:59

    任务参数:

    - 运行参数: run01、自定义参数、1234

    - 输出参数: output01、自定义运行参数、run01

    环境参数:

    - # hello hive


    SparkSQL 任务

    SQL内容: SELECT ${input01};

    调度属性:

    - 实例生成方式: 立即生成

    - 调度周期: 小时

    - 开始时间: 00:00

    - 间隔时间: 1 小时

    - 结束时间: 23:59

    任务参数:

    - 输入参数: intput01、${hivesql任务}、output01

    环境参数:

    - # hello spark


    DorisSQL任务:

    SQL内容: SELECT ${input02};

    调度属性:

    - 实例生成方式: 立即生成

    - 调度周期: 天

    - 具体时间: 00:00

    任务参数:

    - 输入参数: intput02、${hivesql任务}、output01

    环境参数:

    - # hello doris



    依赖关系:  HiveSQL > SparkSQL&DorisSQL'
  steps:
  - action: 进入【离线开发 → 克隆至业务流程完成目标操作且状态更新】页面
    expected: 已进入【离线开发 → 克隆至业务流程完成目标操作且状态更新】页面，显示页面标题与主要操作区域
  - action: 进入离线开发-周期任务-任务开发中, 依次选择HiveSQL、Spark SQL、Doris SQL任务, 右键展开选项
    expected: 均可选择「克隆至业务流程」操作, 点击后将弹出“克隆至业务流程”弹窗
  - action: '分别点击「克隆至业务流程」, 配置如下:

      克隆至: task_process02

      任务名称: ${原名称}_copy

      描述: 空

      点击确定提交表单'
    expected: '配置完成后, 均会有Toast提示: 任务成功克隆至业务流程！'
  - action: 进入业务流程- task_process02中, 检查业务流程子任务
    expected: '克隆至业务流程内的三个子任务依次「水平存放」:

      1) ${原HiveSQL任务名称}_copy

      2) ${原SparkSQL任务名称}_copy

      3) ${原DorisSQL任务名称}_copy'
  - action: 依次检查三个业务流程子任务的配置信息(SQL内容、调度属性、依赖视图、任务参数、环境参数)
    expected: 子任务的配置信息均页面展示步骤要求的字段、状态和结果, 克隆仅复制任务配置信息（SQL、调度属性、任务参数、环境参数）到业务流程，不包含任务依赖关系, 下游任务的任务参数中不包含输入参数
  - action: 临时运行业务流程
    expected: 业务流程task_process02运行失败
  - action: 将从任务开发中克隆过来的三个任务连线构成依赖路径后, 并补充下游两个任务的输入参数, 再次运行
    expected: 业务流程task_process02运行成功
  - action: 进入业务流程- task_process01, 选择该业务流程中的3个子任务并「克隆至业务流程」到task_process02后, 依次检查从task_process01克隆过来的三个子任务的配置信息, 并临时运行task_process02
    expected: '1) 子任务的配置信息均页面展示步骤要求的字段、状态和结果, 克隆仅复制任务配置信息（SQL、调度属性、任务参数、环境参数）到业务流程，不包含任务依赖关系, 下游任务的任务参数中不包含输入参数

      2) 业务流程task_process02运行失败'
  - action: 将从其他业务流程中克隆过来的三个任务连线构成依赖路径后, 并补充下游两个任务的输入参数, 再次运行
    expected: 业务流程task_process02运行成功
  - action: 进入业务流程- task_process02, 选择该业务流程中的3个子任务并「克隆至业务流程」到task_process02后, 依次检查从task_process02克隆过来的三个子任务的配置信息, 并临时运行task_process02
    expected: '1) 子任务的配置信息均页面展示步骤要求的字段、状态和结果, 克隆仅复制任务配置信息（SQL、调度属性、任务参数、环境参数）到业务流程，不包含任务依赖关系, 下游任务的任务参数中不包含输入参数

      2) 业务流程task_process02运行失败'
  - action: 将从本身业务流程中克隆过来的三个任务连线构成依赖路径后, 并补充下游两个任务的输入参数, 再次运行
    expected: 业务流程task_process02运行成功
  tags:
  - 单个任务克隆 ❯
- case_id: C0003
  title: 验证数据同步任务-「克隆至业务流程」完成目标操作且状态更新
  priority: P0
  precondition: "1) 业务流程中已存在业务流程任务task_process01、 task_process02\n\n2) 任务开发、业务流程中均存在一条可成功运行的数据同步任务(mysql2doris_dev、mysql2doris_process01、mysql2doris_process02)\n\
    \nmysql建表语句:\nDROP TABLE IF EXISTS user;\nCREATE TABLE user (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    name VARCHAR(50)\
    \ NOT NULL,\n    age TINYINT,\n    email VARCHAR(100) UNIQUE\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\nINSERT INTO\
    \ user (name, age, email) VALUES\n('Alice', 25, 'alice@example.com'),\n('Bob',   30, 'bob@example.com'),\n('Coco',  28,\
    \ 'coco@example.com');\n\nsource端: mysql的user表\nsink端: doris数据源, 一键建表\n其他配置项保持默认"
  steps:
  - action: 进入【离线开发 → 任务开发】页面
    expected: 已进入【离线开发 → 任务开发】页面，显示页面标题与主要操作区域
  - action: 进入离线开发-周期任务-任务开发, 选择数据同步任务 mysql2doris_dev 并点击「克隆至业务流程」
    expected: 弹出“克隆至业务流程”弹窗
  - action: '填写表单配置如下:

      克隆至: task_process02

      任务名称: mysql2doris_dev_copy

      描述: 空

      点击确定提交表单'
    expected: '1) 表单提交成功, 并Toast提示: 任务成功克隆至业务流程！

      2) 业务流程task_process02存在两个未形成依赖关系的子任务'
  - action: 运行业务流程task_process02
    expected: 运行成功
  - action: 进入业务流程-task_process01, 选择任务mysql2doris_process01 并「克隆至业务流程」后, 运行task_process02
    expected: 运行成功, 业务流程task_process02存在三个未形成依赖关系的子任务
  - action: 进入业务流程-task_process02, 选择任务mysql2doris_process02并 「克隆至业务流程」后, 运行task_process02
    expected: 运行成功, 业务流程task_process02存在四个未形成依赖关系的子任务
  tags:
  - 单个任务克隆 ❯
- case_id: C0004
  title: 验证StarRocks SQL任务-「克隆至业务流程」完成目标操作且状态更新
  priority: P2
  precondition: "1) 业务流程中已存在业务流程任务task_process01、 task_process02\n\n2) 任务开发、业务流程中均存在一条可成功运行的SR SQL任务(sr_dev、sr_process01、sr_process02)\n\
    \nSQL内容:\nDROP TABLE IF EXISTS employees_sr;\nCREATE TABLE employees_sr (\n    employee_id INT COMMENT '员工ID',\n    full_name\
    \ VARCHAR(50) COMMENT '姓名',\n    job_title VARCHAR(30) COMMENT '职位',\n    salary DECIMAL(10,2) COMMENT '薪资',\n    hire_date\
    \ DATE COMMENT '入职日期',\n    is_fulltime BOOLEAN COMMENT '是否全职',\n    tech_stack VARCHAR(200) COMMENT '技术栈',\n    last_login\
    \ DATETIME COMMENT '最后登录时间',\n    resume TEXT COMMENT '简历'\n)\nDUPLICATE KEY(employee_id)\nCOMMENT '员工信息表_StarRocks'\n\
    DISTRIBUTED BY HASH(employee_id) BUCKETS 3\nPROPERTIES(\"replication_num\" = \"1\");\n\nINSERT INTO employees_sr VALUES\n\
    (1, 'zhangsan', '后端工程师', 25000.00, '2022-03-15', true, 'Java,Spring,MySQL', '2024-05-20 09:15:23', '5年Java开发经验，精通微服务架构'),\n\
    (102, 'lisi', '数据科学家', 32000.50, '2021-11-01', true, 'Python,TensorFlow,Spark', '2024-05-21 14:30:45', '机器学习专家，主导过2 个AI项目'),\n\
    (103, 'wangwu', '前端工程师', 22000.00, '2023-01-10', true, 'JavaScript,React,Vue', '2024-05-19 11:22:33', '前端架构师，组件化开发专家'),\n\
    (104, 'zhaoliu', 'DevOps工程师', 28000.75, '2020-07-22', true, 'Kubernetes,Docker,AWS', '2024-05-22 10:05:17', '云原生基础设施专家'),\n\
    (105, 'chenqi', '产品经理', 30000.00, '2021-05-30', true, 'Axure,SQL,PPT', '2024-05-18 16:45:21', '主导Taier数据调度平台设计'),\n(106,\
    \ 'liuba', '测试工程师', 18000.00, '2023-08-14', false, 'Selenium,Jmeter,Python', '2024-05-20 13:18:56', '自动化测试专家');"
  steps:
  - action: 进入【离线开发 → StarRocks SQL任务】页面
    expected: 已进入【离线开发 → StarRocks SQL任务】页面，显示页面标题与主要操作区域
  - action: 进入离线开发-周期任务-任务开发, 选择SR任务 sr_dev 并点击「克隆至业务流程」
    expected: 弹出“克隆至业务流程”弹窗
  - action: '填写表单配置如下:

      克隆至: task_process02

      任务名称: sr_dev_copy

      描述: 空

      点击确定提交表单'
    expected: '1) 表单提交成功, 并Toast提示: 任务成功克隆至业务流程！

      2) 业务流程task_process02存在两个未形成依赖关系的子任务'
  - action: 运行业务流程task_process02
    expected: 运行成功
  - action: 进入业务流程-task_process01, 选择任务sr_process01 并「克隆至业务流程」后, 运行task_process02
    expected: 运行成功, 业务流程task_process02存在三个未形成依赖关系的子任务
  - action: 进入业务流程-task_process02, 选择任务sr_process02并 「克隆至业务流程」后, 运行task_process02
    expected: 运行成功, 业务流程task_process02存在四个未形成依赖关系的子任务
  tags:
  - 单个任务克隆 ❯
- case_id: C0005
  title: 验证 Python 任务-「克隆至业务流程」完成目标操作且状态更新
  priority: P2
  precondition: "1) 业务流程中已存在业务流程任务task_process01、 task_process02\n\n2) 任务开发、业务流程中均存在一条可成功运行的Python任务(py_dev、py_process01、py_process02)\n\
    \n\ncount = 0  # 全局计数器\n\ndef hanoi_tower(num, a, b, c):\n    \"\"\"\n    功能：输出num个轮盘移动的顺序并统计总步骤\n    :param num: 轮盘数量\n\
    \    :param a: A柱子\n    :param b: B柱子\n    :param c: C柱子\n    :return:\n    \"\"\"\n    global count\n    if num == 1:\n\
    \        count += 1\n        print(f\"第{count}步: 第1个轮盘从:{a}柱->{c}柱\")\n    else:\n        hanoi_tower(num - 1, a, c, b)\n\
    \        count += 1\n        print(f\"第{count}步: 第{num}个轮盘从:{a}柱->{c}柱\")\n        hanoi_tower(num - 1, b, a, c)\n\nhanoi_tower(5,\
    \ \"A\", \"B\", \"C\")\nprint(f\"\\n总移动步数: {count}\") # count = 2**num - 1"
  steps:
  - action: 进入【离线开发 → Python 任务】页面
    expected: 已进入【离线开发 → Python 任务】页面，显示页面标题与主要操作区域
  - action: 进入离线开发-周期任务-任务开发, 选择Python3任务 py_dev 并点击「克隆至业务流程」
    expected: 弹出“克隆至业务流程”弹窗
  - action: '填写表单配置如下:

      克隆至: task_process02

      任务名称: py_dev_copy

      描述: 空

      点击确定提交表单'
    expected: '1) 表单提交成功, 并Toast提示: 任务成功克隆至业务流程！

      2) 业务流程task_process02存在两个未形成依赖关系的子任务'
  - action: 运行业务流程task_process02
    expected: 运行成功
  - action: 进入业务流程-task_process01, 选择任务py_process01 并「克隆至业务流程」后, 运行task_process02
    expected: 运行成功, 业务流程task_process02存在三个未形成依赖关系的子任务
  - action: 进入业务流程-task_process02, 选择任务py_process02并 「克隆至业务流程」后, 运行task_process02
    expected: 运行成功, 业务流程task_process02存在四个未形成依赖关系的子任务
  tags:
  - 单个任务克隆 ❯
