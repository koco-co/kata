  - case_id: C0005
    title: 验证【数据开发】-【任务开发】克隆Python任务至业务流程，任务运行成功
    priority: P2
    precondition: |-
      1) 业务流程中已存在业务流程任务task_process01、task_process02
      2) 任务开发、业务流程中均存在一条可成功运行的Python任务(pyDev、py_process01、py_process02), 脚本内容如下:
         count = 0  # 全局计数器
         def hanoi_tower(num, a, b, c):
             global count
             if num == 1:
                 count += 1
                 print(f"第{count}步: 第1个轮盘从:{a}柱->{c}柱")
             else:
                 hanoi_tower(num - 1, a, c, b)
                 count += 1
                 print(f"第{count}步: 第{num}个轮盘从:{a}柱->{c}柱")
                 hanoi_tower(num - 1, b, a, c)
         hanoi_tower(5, "A", "B", "C")
         print(f"\n总移动步数: {count}") # count = 2**num - 1
    steps:
      - action: 进入【数据开发 → 任务开发】页面
        expected: 进入成功
      - action: 进入数据开发-周期任务-任务开发, 选择Python3任务pyDev并点击「克隆至业务流程」
        expected: 弹出“克隆至业务流程”弹窗
      - action: '填写表单配置如下: 克隆至: task_process02, 任务名称: ${原任务名称}_copy, 描述: 空, 点击确定提交表单'
        expected: |-
          1) 表单提交成功, 并Toast提示: 任务成功克隆至业务流程！
          2) 业务流程task_process02存在两个未形成依赖关系的子任务
      - action: 运行业务流程task_process02
        expected: 运行成功
      - action: 进入业务流程-task_process01, 选择任务py_process01并「克隆至业务流程」后, 运行task_process02
        expected: 运行成功, 业务流程task_process02存在三个未形成依赖关系的子任务
      - action: 进入业务流程-task_process02, 选择任务py_process02并「克隆至业务流程」后, 运行task_process02
        expected: 运行成功, 业务流程task_process02存在四个未形成依赖关系的子任务
    tags: [数据开发, 任务开发, 单个任务克隆]

  - case_id: C0006
    title: 验证【数据开发】-【周期任务】克隆弹窗按名称搜索业务流程，结果匹配关键字
    priority: P2
    precondition: 1) 业务流程中已存在2个业务流程任务task_process01 ~ task_process10
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 进入数据开发-周期任务, 选择MySQL任务并点击「克隆至业务流程」
        expected: 弹出“克隆至业务流程”弹窗
      - action: 点击「克隆至」, 检查展开的下拉选项
        expected: 展示当前已创建的所有业务流程名称
      - action: '输入关键字: task_process'
        expected: 仅显示或包含业务流程名称中包含task_process的业务流程
      - action: '输入关键字: task_process01'
        expected: 仅显示或包含业务流程名称中包含task_process01的业务流程
    tags: [数据开发, 周期任务, 单个任务克隆]

  - case_id: C0007
    title: 验证【数据开发】-【周期任务】克隆弹窗表单校验，提示信息按规则展示
    priority: P1
    precondition: |-
      1) 任务开发中已存在MySQL任务
      2) 业务流程中已存在业务流程任务${task_process}
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 进入数据开发-周期任务, 选择MySQL任务并点击「克隆至业务流程」
        expected: 弹出“克隆至业务流程”弹窗
      - action: 「克隆至」置空后, 提交表单
        expected: '置红提示: 请选择业务流程'
      - action: 「任务名称」置空后, 提交表单
        expected: '置红提示: 任务名称不能为空'
      - action: 「任务名称」输入128+字符后, 提交表单
        expected: '置红提示: 任务名称不得超过128个字符！'
      - action: 「任务名称」输入#¥¥特殊字符后, 提交表单
        expected: '置红提示: 任务名称只能由字母、数字、中文、下划线组成！'
      - action: 「任务名称」输入${已存在的任务开发中的任务名称}后, 提交表单
        expected: '异常提示: 名称已存在'
      - action: 「任务名称」输入${已存在的业务流程子任务名称}后, 提交表单
        expected: '异常提示: 名称已存在'
      - action: 「描述」输入200+个字符, 提交表单
        expected: '置红提示: 请控制在200个字符以内！'
      - action: '填写表单配置如下: 克隆至: ${task_process}, 任务名称: 不重名的128个合法字符, 描述: 200个字符, 点击确定提交表单'
        expected: '表单提交成功, 并Toast提示: 任务成功克隆至业务流程！'
    tags: [数据开发, 周期任务, 单个任务克隆]

  - case_id: C0008
    title: 验证【数据开发】-【周期任务】克隆至已有500子任务业务流程，提示超过上限
    priority: P2
    precondition: 1) 业务流程中已存在业务流程任务task_process01、task_process02, 且业务流程task_process02已存在500个子任务
    steps:
