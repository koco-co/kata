    priority: P0
    precondition: |-
      1) 任务开发中已存在工作流任务task_workflow、非工作流任务task01
      2) 业务流程子任务中已存在非工作流任务task02
      3) 业务流程中已存在业务流程任务${task_process}
    steps:
      - action: 进入【数据开发 → 批量操作】页面
        expected: 进入成功
      - action: 进入数据开发-批量操作中, 勾选任务task_workflow、task01、task02后, 选择更多操作中的「克隆至业务流程」
        expected: 弹出“批量克隆至业务流程”弹窗
      - action: '填写表单配置如下: 克隆至: ${task_process}, 任务名称填写为task_workflow_copy、task01、task02, 点击确定提交表单'
        expected: 表单提交成功, 进入任务克隆中状态, 等待一段时间后, 任务克隆结束
      - action: 检查3个任务的克隆状态
        expected: |-
          任务克隆状态全部为: 失败. 失败日志如下:
