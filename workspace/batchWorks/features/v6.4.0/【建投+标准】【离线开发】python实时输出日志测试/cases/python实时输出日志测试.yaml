meta:
  title: 【建投+标准】python实时输出日志测试
  feature_id: offline-python-task-realtime-logs
  case_module_id: "9244"
  imports:
    - 202508-离线开发v6.4.0.xmind
  exports:
    - python实时输出日志测试.xmind
cases:
  - case_id: C0001
    title: 验证【数据开发】-【周期任务】运行Python Agent任务，实时打印任务运行日志
    priority: P0
    precondition: |-
      1) 周期任务运行节点标签为 agent_py2
      2) Python2 实时输出脚本为：
         #!/usr/bin/env python2
         # -*- coding: utf-8 -*-
         from __future__ import print_function
         import sys
         import time
         for index in range(1, 6):
             sys.stdout.write("LOG_%02d\n" % index)
             sys.stdout.flush()
             time.sleep(2)
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建 Python2 Agent 周期任务 TaskB，节点标签选择 agent_py2
        expected: 任务编辑器显示节点标签 agent_py2
      - action: 填入实时输出脚本并点击「临时运行」
        expected: 运行状态依次显示「正在提交」「运行中」
      - action: 等待 LOG_02 出现后向上滚动日志面板
        expected: 新日志到达时滚动位置保持在用户当前位置
      - action: 等待任务完成
        expected: 运行状态显示「成功」,日志按约 2 秒间隔依次出现 LOG_01～LOG_05
      - action: 下载完整日志
        expected: 下载日志包含 LOG_01～LOG_05 且顺序一致，并展示任务执行时长
    tags: [数据开发, 周期任务, Python2日志]

  - case_id: C0002
    title: 验证【数据开发】-【周期任务】运行Python Agent任务，实时打印任务运行日志
    priority: P1
    precondition: |-
      1) 周期任务运行节点标签为 agent_py3
      2) Python3 持续输出脚本为：
         import time
         for index in range(1, 6):
             print(f"LOG_{index:02d}", flush=True)
             time.sleep(2)
      3) Python3 连续输出脚本为：
         for index in range(60):
             print(index, flush=True)
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 新建 Python3 Agent 周期任务 TaskD，节点标签选择 agent_py3
        expected: 任务编辑器显示节点标签 agent_py3
      - action: 填入持续输出脚本并点击「临时运行」
        expected: 运行日志依次展示 LOG_01～LOG_05
      - action: 使用连续输出脚本再次运行该任务
        expected: 运行日志首行为 0、末行为 59且无缺号
      - action: 下载两次运行日志
        expected: 两个下载地址不同，文件内容分别与对应日志面板的总行数一致
    tags: [数据开发, 周期任务, Python3日志]

