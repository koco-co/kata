        expected: 仅显示状态为取消或等待运行，且执行人为${owner}的记录
    tags:
      - 运维中心-周期任务-补数据实例-
  - case_id: C0009
    title: 验证GP任务运行进度展示显示&交互正确
    priority: P0
    steps:
      - action: 进入「数据开发-周期任务」页面, 创建GP任务
        expected: 创建成功
      - action: "执行测试语句: Select 1; 检查日志区域内容展示"
        expected: |-
          1) 第一条日志记录时间为: ${start_time}, 最后一条日志记录时间为${end_time}
          2) 初始时长为: 00:00, 每秒刷新一次, 最终格式为: 任务执行时长：${end_time - start_time}
    tags:
      - 数据开发-
      - 周期任务-
