meta:
  title: 【建投】补数据状态支持筛选&任务运行进度展示测试
  version: v6.4.0
  feature_id: v6.4.0/【v640】【建投】【离线开发】补数据状态支持筛选&任务运行进度展示测试
  case_module_id: "9246"
  imports:
    - 202508-离线开发v6.4.0.xmind
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证「状态」筛选项显示&交互正确
    priority: P0
    steps:
      - action: 进入【运维中心-周期任务-补数据实例】页面, 点击状态旁的筛选icon, 检查筛选内容
        expected: |-
          1) 支持等待运行、运行中、成功、取消、失败5种筛选状态
          2) 重置和确定两个按钮
          3) 重置默认置灰, 勾选任一状态后可点击重置按钮
      - action: 选择状态筛选并点击【确定】，刷新页面
        expected: 筛选条件清空
      - action: 选择状态筛选，点击【重置】按钮
        expected: 清除所有状态筛选，显示全部数据
    tags:
      - 运维中心-周期任务-补数据实例-
  - case_id: C0002
    title: 验证补数据实例状态校验(成功)
    priority: P0
    precondition: |-
      1) 在【数据开发】中新建 3 个 MySQL 任务：
      task01：SELECT sleep(10);
      task02：SELECT sleep(20);
      task03：SELECT sleep(30);

      2) 保存并提交上述任务。
    steps:
      - action: |-
          进入 【运维中心 → 周期任务 → 周期任务管理】 页面，勾选 task0
          1、 task0
          2、 task03，点击 补数据 按钮
        expected: 右侧弹出「批量任务补数据」页面
      - action: 在「批量任务补数据」弹窗中保持默认选项，点击 确定. 在补数据实例页面找到刚提交的 ${补数据实例} 记录，进入其详情页查看 3 个任务实例的状态
        expected: ""
      - action: |-
          1) 确保 3 个任务实例的状态均为 等待运行。
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例状态为「等待运行」
      - action: |-
          1) 等待 3 个任务实例中至少有 1 个任务实例状态变为 运行中（其余状态任意）。
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例的状态为「运行中」
      - action: |-
          1) 等待 3 个任务实例均为 成功 状态。
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例的状态为「成功」
    tags:
      - 运维中心-周期任务-补数据实例-
  - case_id: C0003
    title: 验证补数据实例状态校验(失败)
    priority: P1
    precondition: |-
      1) 在【数据开发】中新建 3 个 MySQL 任务：
      task04：SELECT sleep(10);
      task05：SELECT sleep(20);
      task06：SELECT sleep(30); 1 select;

      2) 保存并提交上述任务。
    steps:
      - action: 进入 【运维中心 → 周期任务 → 周期任务管理】 页面，勾选 task04、task05、task06，点击 补数据 按钮
        expected: 右侧弹出「批量任务补数据」页面
      - action: 在「批量任务补数据」弹窗中保持默认选项，点击 确定. 在补数据实例页面找到刚提交的 ${补数据实例} 记录，进入其详情页查看 3 个任务实例的状态
        expected: ""
      - action: |-
          1) 确保 3 个任务实例的状态均为 等待运行。
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例状态为「等待运行」
      - action: |-
          1) 等待 3 个任务实例中至少有 1 个任务实例状态变为 运行中（其余状态任意）。
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例的状态为「运行中」
      - action: |-
          1) 等待task04、task05状态变为成功；task06状态变为失败。
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例的状态为「失败」
    tags:
      - 运维中心-周期任务-补数据实例-
  - case_id: C0004
    title: 验证补数据实例状态校验(取消)
    priority: P1
    precondition: |-
      1) 在【数据开发】中新建 3 个 GP 任务：
      task07：
      SELECT pg_sleep(10);

      task08：
      SELECT pg_sleep(20);

      task09：
      SELECT pg_sleep(30);


      2) 保存并提交上述任务。
      ​
    steps:
      - action: 进入 【运维中心 → 周期任务 → 周期任务管理】 页面，勾选 task07、task08、task09，点击 补数据 按钮
        expected: 右侧弹出「批量任务补数据」页面
      - action: 在「批量任务补数据」弹窗中保持默认选项，点击 确定. 在补数据实例页面找到刚提交的 ${补数据实例} 记录，进入其详情页查看 3 个任务实例的状态
        expected: |-
          1) 3 个任务实例的状态均为 等待运行
          2) 补数据实例状态为「等待运行」
      - action: |-
          1) 确保task07任务实例的状态为运行中, task08手动取消, task09成功
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例的状态为「运行中」
      - action: |-
          1) 确保task08任务实例的状态为取消, task07和task09任务已结束(成功或失败)
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例的状态为「取消」
      - action: |-
          1) 确保 3个任务实例的状态均取消(杀死全部实例)
          2) 返回「补数据实例」页面查看该补数据实例的状态。
        expected: 补数据实例状态为 「取消」
    tags:
      - 运维中心-周期任务-补数据实例-
  - case_id: C0005
    title: 验证「状态」筛选功能正确(单选场景)
    priority: P0
    precondition: |-
      已有不同状态的补数据实例（运行中、成功、取消、失败、等待运行）。

      任务和实例状态关联关系：
      1. 等待运行：所有实例状态均为等待运行，则补数据实例的状态为等待运行。

      2. 运行中：有运行中状态的实例，则补数据实例的状态为运行中。

      3. 失败：没有等待中、运行中状态的实例，只要有一个失败状态实例，则补数据实例的状态即为失败。

      4. 成功：所有实例的状态均为成功，则补数据实例的状态即为成功。

      5. 取消：补数据实例存在手动取消或自动取消，任务变为取消状态
    steps:
      - action: 进入【运维中心-周期任务-补数据实例】页面, 点击状态筛选框，仅勾选「运行中」→ 确定
        expected: 仅显示状态为运行中的记录
      - action: 点击状态筛选框，仅勾选「成功」→ 确定
        expected: 仅显示状态为成功的记录
      - action: 点击状态筛选框，仅勾选「取消」→ 确定
        expected: 仅显示状态为取消的记录
      - action: 点击状态筛选框，仅勾选「失败」→ 确定
        expected: 仅显示状态为失败的记录
      - action: 点击状态筛选框，仅勾选「等待运行」→ 确定
        expected: 仅显示状态为等待运行的记录
    tags:
      - 运维中心-周期任务-补数据实例-
  - case_id: C0006
    title: 验证「状态」筛选功能正确(多选场景)
    priority: P1
    precondition: |-
      已有不同状态的补数据实例（运行中、成功、取消、失败、等待运行）。

      任务和实例状态关联关系：
      1. 等待运行：所有实例状态均为等待运行，则补数据实例的状态为等待运行。

      2. 运行中：有运行中状态的实例，则补数据实例的状态为运行中。

      3. 失败：没有等待中、运行中状态的实例，只要有一个失败状态实例，则补数据实例的状态即为失败。

      4. 成功：所有实例的状态均为成功，则补数据实例的状态即为成功。

      5. 取消：补数据实例存在手动取消或自动取消，任务变为取消状态
    steps:
      - action: 进入【运维中心-周期任务-补数据实例】页面, 点击状态筛选框，仅勾选「运行中 + 成功」→ 确定
        expected: 显示状态为运行中或成功的记录
      - action: 点击状态筛选框，仅勾选「失败 + 成功」→ 确定
        expected: 显示状态为失败或成功的记录
      - action: 点击状态筛选框，仅勾选「运行中 + 取消 + 失败」→ 确定
        expected: 显示状态为运行中、取消、失败的记录
      - action: 点击状态筛选框，仅勾选「等待运行 + 成功」→ 确定
        expected: 显示状态为等待运行或成功的记录
    tags:
      - 运维中心-周期任务-补数据实例-
