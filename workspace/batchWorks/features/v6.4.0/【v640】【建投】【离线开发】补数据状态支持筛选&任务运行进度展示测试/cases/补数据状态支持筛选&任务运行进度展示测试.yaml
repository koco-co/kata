  - case_id: C0008
    title: 验证「状态」筛选功能正确(多条件筛选)
    priority: P0
    precondition: |-
      已有不同状态的补数据实例（运行中、成功、取消、失败、等待运行）。

      任务和实例状态关联关系：
      1. 等待运行：所有实例状态均为等待运行，则补数据实例的状态为等待运行。

      2. 运行中：有运行中状态的实例，则补数据实例的状态为运行中。

      3. 失败：没有等待中、运行中状态的实例，只要有一个失败状态实例，则补数据实例的状态即为失败。

      4. 成功：所有实例的状态均为成功，则补数据实例的状态即为成功。

      5. 取消：补数据实例存在手动取消或自动取消，任务变为取消状态
    steps:
      - action: 进入【运维中心-周期任务-补数据实例】页面, 点击状态筛选框，勾选「运行中」，再输入任务名称${task_name} → 确定
        expected: 仅显示状态为运行中且任务名称包含${task_name} 的记录
      - action: 点击状态筛选框，勾选「失败 + 成功」，再选择业务日期${start_time}~${end_time} → 确定
        expected: 仅显示状态为失败或成功，且在业务日期${start_time}~${end_time}内的记录
