      is_fulltime BOOLEAN COMMENT '是否全职',
      tech_stack VARCHAR(200) COMMENT '技术栈'
      )
      UNIQUE KEY(employee_id)
      COMMENT '员工信息表_StarRocks'
      DISTRIBUTED BY HASH(employee_id) BUCKETS 3
      PROPERTIES("replication_num" = "1");

      SR无约束表:
      CREATE TABLE if not exists ${schema}.dtstack_employees_sr2 (
      employee_id INT COMMENT '员工ID',
