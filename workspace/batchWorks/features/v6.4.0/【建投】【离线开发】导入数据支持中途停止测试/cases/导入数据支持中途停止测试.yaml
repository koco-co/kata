          2) 执行select * from 得到的表存在未回滚的脏数据
      - action: 重新点击导入, 依次选择相同的csv文件、SR表类型和表名(选择上述的脏数据表), 导入模式选择「追加」后, 点击导入
        expected: |-
          导入成功, 触发数据库的upsert操作, 页面窗口右上角显示:
          1) 正在导入的loading
          2) 导入的表名+进度条
          3) 「取消导入」按钮
          执行select * from 得到的表数据存在一份csv文件记录
      - action: 重新点击导入, 选择相同的csv文件, 表类型选择SR, 点击新建表, 输入SR无约束表语句后确定, 导入模式选择「覆盖」后, 点击「导入」
        expected: |-
          导入成功, 触发数据库的insert操作, 页面窗口右上角显示:
          1) 正在导入的loading
          2) 导入的表名+进度条
          3) 「取消导入」按钮
          执行 select * from 得到的表数据与csv文件内容一致
      - action: 重新点击导入, 选择相同的csv文件, SR表类型和表名(无约束表),  点击新建表, 输入SR无约束表语句后确定, 导入模式选择「追加」后, 点击「导入」
        expected: |-
          导入成功, 触发数据库的insert操作, 页面窗口右上角显示:
          1) 正在导入的loading
          2) 导入的表名+进度条
          3) 「取消导入」按钮
          执行select * from 得到的表数据存在两份csv文件记录
