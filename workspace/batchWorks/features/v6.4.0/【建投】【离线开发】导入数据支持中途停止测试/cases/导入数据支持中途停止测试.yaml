meta:
  title: 【建投】导入数据支持中途停止测试
  case_module_id: "9245"
  imports:
    - 202509-离线开发v6.4.0.xmind
  exports:
    - 导入数据支持中途停止测试.xmind
cases:
  - case_id: C0001
    title: 验证本地数据导入时取消导入完成目标操作且状态更新(MySQL)
    priority: P0
    precondition: |-
      csv文件内容如下:

      id,name,job_title,salary,hire_date,is_active,skills
      1,zhangsan,后端工程师,25000.0,2022-03-15,True,"Java,Spring,MySQL"
      102,lisi,数据科学家,32000.5,2021-11-01,True,"Python,TensorFlow,Spark"
      103,wangwu,前端工程师,22000.0,2023-01-10,True,"JavaScript,React,Vue"
      104,zhaoliu,DevOps工程师,28000.75,2020-07-22,True,"Kubernetes,Docker,AWS"
      105,chenqi,产品经理,22000.0,2021-05-30,True,"Axure,SQL,PPT"
      106,liuba,测试工程师,21000.0,2023-08-14,False,"Selenium,Jmeter,Python"


      MySQL唯一约束表:
      CREATE TABLE dtstack_employees_mysql (
          employee_id INT PRIMARY KEY COMMENT '员工ID',
          full_name VARCHAR(50) COMMENT '姓名',
          job_title VARCHAR(30) COMMENT '职位',
          salary DECIMAL(10,2) COMMENT '薪资',
          hire_date DATE COMMENT '入职日期',
          is_fulltime BOOLEAN COMMENT '是否全职',
          tech_stack VARCHAR(200) COMMENT '技术栈'
      ) COMMENT '员工信息表_MySQL'
      ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
    steps:
      - action: 进入【离线开发 → 本地数据导入时取消导入完成目标操作且状态更新】页面
        expected: 已进入【离线开发 → 本地数据导入时取消导入完成目标操作且状态更新】页面，显示页面标题与主要操作区域
      - action: 进入数据开发-周期任务页面, 选中任一任务后, 点击导入, 选择csv文件后, 点击下一步
        expected: |-
          1) 导入csv文件后, 弹出本地数据导入页面, 并将csv文件内容自动解析
          2) 点击下一步后, 可以选择表类型和表
      - action: 表类型选择MySQL, 点击新建表, 输入MySQL建表语句后确定
        expected: 建表成功
      - action: 导入模式选择「覆盖」后, 点击导入, 检查页面窗口右上角样式
        expected: |-
          1) 正在导入的loading
          2) 导入的表名+进度条
          3) 「取消导入」按钮
      - action: 点击「取消导入」
        expected: |-
          展示二次确认弹窗:
          1) 确认取消导入吗?
          2) 按钮: 取消、确认
      - action: 点击「确认」
        expected: toast提示“已取消导入”
      - action: "创建mysql任务, 执行sql: select * from dtstack_employees_mysql; 检查表数据"
        expected: |-
          1) 数据库操作为非事务，已导入的数据无需回滚，「停止」后的未导入的数据停止insert操作
          2) 执行select * from 得到的表存在未回滚的脏数据
      - action: 重新点击导入, 依次选择相同的csv文件、MySQL表类型和表名(选择上述的脏数据表), 导入模式选择「追加」后, 点击导入
        expected: employee_id有唯一约束, 导入失败并给出弹窗报错
      - action: "创建msyql任务, 删除唯一约束: ALTER TABLE dtstack_employees_mysql DROP PRIMARY KEY;"
        expected: 约束删除成功
      - action: 重新点击导入, 依次选择相同的csv文件、MySQL表类型和表名(选择上述的脏数据表), 导入模式选择「覆盖」后, 点击导入
        expected: |-
          导入成功, 触发数据库的insert操作, 页面窗口右上角显示:
          1) 正在导入的loading
          2) 导入的表名+进度条
          3) 「取消导入」按钮
          执行 select * from 得到的表数据与csv文件内容一致
      - action: 重新点击导入, 依次选择相同的csv文件、MySQL表类型和表名(选择上述的脏数据表), 导入模式选择「追加」后, 点击导入
        expected: |-
          导入成功, 触发数据库的insert操作, 页面窗口右上角显示:
          1) 正在导入的loading
          2) 导入的表名+进度条
          3) 「取消导入」按钮
          执行select * from 得到的表数据存在两份csv文件记录
