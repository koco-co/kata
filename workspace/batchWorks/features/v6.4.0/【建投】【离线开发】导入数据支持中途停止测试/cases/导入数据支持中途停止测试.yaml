      1,zhangsan,后端工程师,25000.0,2022-03-15,True,"Java,Spring,MySQL"
      102,lisi,数据科学家,32000.5,2021-11-01,True,"Python,TensorFlow,Spark"
      103,wangwu,前端工程师,22000.0,2023-01-10,True,"JavaScript,React,Vue"
      104,zhaoliu,DevOps工程师,28000.75,2020-07-22,True,"Kubernetes,Docker,AWS"
      105,chenqi,产品经理,22000.0,2021-05-30,True,"Axure,SQL,PPT"
      106,liuba,测试工程师,21000.0,2023-08-14,False,"Selenium,Jmeter,Python"


      SR唯一约束表
      CREATE TABLE if not exists ${schema}.dtstack_employees_sr (
      employee_id INT COMMENT '员工ID',
      full_name VARCHAR(50) COMMENT '姓名',
      job_title VARCHAR(30) COMMENT '职位',
      salary DECIMAL(10,2) COMMENT '薪资',
