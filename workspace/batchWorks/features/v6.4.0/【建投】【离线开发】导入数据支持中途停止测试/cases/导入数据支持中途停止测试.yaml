meta:
  title: 【建投】导入数据支持中途停止测试
  feature_id: offline-local-data-import-cancellation
  project_id: batch-works
  case_module_id: "9245"
  imports:
    - 202509-离线开发v6.4.0.xmind
  exports:
    - 导入数据支持中途停止测试.xmind
cases:
  - case_id: C0001
    requirement_id: 9245
    title: 验证【数据开发】-【周期任务】MySQL 本地数据导入中途取消，进度停止且部分行已写入
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在数据库：${SchemaA}
      4) 使用以下一次性 Bash 命令生成 local_import_9245_c0001.csv：
      bash <<'BASH'
      set -euo pipefail
      output_file="local_import_9245_c0001.csv"
      printf '%s\n' 'employee_id,full_name,job_title,salary,hire_date,is_fulltime,tech_stack' > "${output_file}"
      for ((id=1; id<=100000; id++)); do
        printf '%d,user_%06d,engineer,%.2f,2026-08-01,1,SQL\n' "${id}" "${id}" "${id}.00" >> "${output_file}"
      done
      BASH
      5) 在 ${SchemaA} 创建带唯一约束的目标表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_9245_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_9245_c0001 (
           employee_id INT PRIMARY KEY,
           full_name VARCHAR(50),
           job_title VARCHAR(30),
           salary DECIMAL(12,2),
           hire_date DATE,
           is_fulltime BOOLEAN,
           tech_stack VARCHAR(200)
         ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
      6) 建表完成后，该表为空表
      7) 行数据由 local_import_9245_c0001.csv 写入
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传 local_import_9245_c0001.csv
        expected: 解析出 7 个字段和 100000 行数据
      - action: 点击「下一步」
        expected: 进入目标表配置步骤
      - action: |-
          配置导入任务：
          表类型：MySQL
          数据源：${DataSourceA}
          数据库：${SchemaA}
          数据表：test_table_9245_c0001
          导入模式：覆盖
          点击「导入」
        expected: 右上角展示表名「test_table_9245_c0001」、导入进度条和「取消导入」按钮
      - action: 当导入进度大于0%且小于100%时点击「取消导入」
        expected: 弹窗提示「确认取消导入吗?」，展示「取消」「确认」按钮
      - action: 点击「确认」
        expected: Toast提示:「已取消导入」，导入进度停止增长
      - action: 在 ${DataSourceA} 执行 SELECT COUNT(*) FROM ${SchemaA}.test_table_9245_c0001;
        expected: 查询结果大于0且小于100000
      - action: 使用相同文件和目标表执行「追加」导入
        expected: 唯一键冲突导致导入失败，目标表记录数小于100000
      - action: 在 ${DataSourceA} 执行 ALTER TABLE ${SchemaA}.test_table_9245_c0001 DROP PRIMARY KEY;
        expected: 主键约束从目标表定义中移除
      - action: 使用相同文件和目标表执行「覆盖」导入
        expected: 导入完成，SELECT COUNT(*) FROM ${SchemaA}.test_table_9245_c0001; 返回100000
      - action: 使用相同文件和目标表执行「追加」导入
        expected: 导入完成，SELECT COUNT(*) FROM ${SchemaA}.test_table_9245_c0001; 返回200000
    tags: [数据开发, 周期任务, 本地数据导入]

  - case_id: C0002
    requirement_id: 9245
    title: 验证【数据开发】-【周期任务】StarRocks3.x 本地数据导入中途取消，进度停止且部分行已写入
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：StarRocks3.x
      3) 存在数据库：${SchemaA}
      4) 使用以下一次性 Bash 命令生成 local_import_9245_c0002.csv：
      bash <<'BASH'
      set -euo pipefail
      output_file="local_import_9245_c0002.csv"
      printf '%s\n' 'employee_id,full_name,job_title,salary,hire_date,is_fulltime,tech_stack' > "${output_file}"
      for ((id=1; id<=100000; id++)); do
        printf '%d,user_%06d,engineer,%.2f,2026-08-01,1,SQL\n' "${id}" "${id}" "${id}.00" >> "${output_file}"
      done
      BASH
      5) 在 ${SchemaA} 创建 Unique Key 目标表和 Duplicate Key 对照表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_9245_c0002_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_9245_c0002_target_01 (
           employee_id INT,
           full_name VARCHAR(50),
           job_title VARCHAR(30),
           salary DECIMAL(12,2),
           hire_date DATE,
           is_fulltime BOOLEAN,
           tech_stack VARCHAR(200)
         ) UNIQUE KEY(employee_id)
         DISTRIBUTED BY HASH(employee_id) BUCKETS 3
         PROPERTIES("replication_num" = "1");
         DROP TABLE IF EXISTS ${SchemaA}.test_table_9245_c0002_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_9245_c0002_comparison_01 (
           employee_id INT,
           full_name VARCHAR(50),
           job_title VARCHAR(30),
           salary DECIMAL(12,2),
           hire_date DATE,
           is_fulltime BOOLEAN,
           tech_stack VARCHAR(200)
         ) DUPLICATE KEY(employee_id)
         DISTRIBUTED BY HASH(employee_id) BUCKETS 3
         PROPERTIES("replication_num" = "1");
      6) 建表完成后，该表为空表
      7) 两张表均由 local_import_9245_c0002.csv 写入行数据
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: 点击「导入」
        expected: 打开「本地数据导入」窗口
      - action: 上传 local_import_9245_c0002.csv
        expected: 解析出 7 个字段和 100000 行数据
      - action: 点击「下一步」
        expected: 进入目标表配置步骤
      - action: |-
          配置导入任务：
          表类型：StarRocks
          数据源：${DataSourceA}
          数据库：${SchemaA}
          数据表：test_table_9245_c0002_target_01
          导入模式：覆盖
          点击「导入」
        expected: 右上角展示目标表名、导入进度条和「取消导入」按钮
      - action: 当导入进度大于0%且小于100%时点击「取消导入」并在确认弹窗点击「确认」
        expected: Toast提示:「已取消导入」，导入进度停止增长
      - action: 在 ${DataSourceA} 执行 SELECT COUNT(*) FROM ${SchemaA}.test_table_9245_c0002_target_01;
        expected: 查询结果大于0且小于100000
      - action: 使用相同文件向 Unique Key 目标表执行「追加」导入
        expected: 导入完成，SELECT COUNT(*) FROM ${SchemaA}.test_table_9245_c0002_target_01; 返回100000
      - action: 使用相同文件向 Duplicate Key 对照表执行「覆盖」导入
        expected: 导入完成，SELECT COUNT(*) FROM ${SchemaA}.test_table_9245_c0002_comparison_01; 返回100000
      - action: 使用相同文件向 Duplicate Key 对照表执行「追加」导入
        expected: 导入完成，SELECT COUNT(*) FROM ${SchemaA}.test_table_9245_c0002_comparison_01; 返回200000
    tags: [数据开发, 周期任务, 本地数据导入]

