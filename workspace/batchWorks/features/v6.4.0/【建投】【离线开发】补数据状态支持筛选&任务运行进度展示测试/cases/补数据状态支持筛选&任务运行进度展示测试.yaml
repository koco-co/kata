meta:
  title: 【建投】补数据状态支持筛选&任务运行进度展示测试
  feature_id: offline-backfill-status-and-task-progress
  case_module_id: "9246"
  imports:
    - 202508-离线开发v6.4.0.xmind
  exports:
    - 补数据状态支持筛选&任务运行进度展示测试.xmind
cases:
  - case_id: C0001
    title: 验证【周期任务】-【补数据实例】打开状态筛选面板，五个选项与重置确定按钮展示正确
    priority: P0
    precondition: |-
      1) 补数据实例列表至少存在 1 条记录
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 点击「状态」列的筛选图标
        expected: |-
          1) 展示「等待运行」「运行中」「成功」「取消」「失败」五个选项
          2) 展示「重置」「确定」按钮
          3) 未勾选状态时「重置」按钮禁用，勾选任一状态后「重置」按钮启用
      - action: 勾选「成功」并点击「确定」，随后刷新页面
        expected: 页面刷新后状态筛选条件清空，列表恢复展示全部记录
      - action: 勾选「失败」后点击「重置」
        expected: 五个状态均未勾选，列表恢复展示全部记录
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0002
    title: 验证【周期任务】-【补数据实例】批量补数据全部成功，批次状态依次为等待运行、运行中、成功
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在已提交至运维中心的日调度周期任务 TaskL，任务SQL为 SELECT SLEEP(10);
      4) 存在已提交至运维中心的日调度周期任务 TaskD，任务SQL为 SELECT SLEEP(20);
      5) 存在已提交至运维中心的日调度周期任务 TaskE，任务SQL为 SELECT SLEEP(30);
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 前往【运维中心 → 周期任务 → 周期任务管理】，勾选 TaskL、TaskD、TaskE 并对当日业务日期执行批量补数据
        expected: 补数据实例列表新增包含3个任务实例的批次记录
      - action: 在3个任务实例均为「等待运行」时查看批次状态
        expected: 补数据批次状态为「等待运行」
      - action: 在至少1个任务实例为「运行中」时查看批次状态
        expected: 补数据批次状态为「运行中」
      - action: 在3个任务实例均为「成功」时查看批次状态
        expected: 补数据批次状态为「成功」
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0003
    title: 验证【周期任务】-【补数据实例】批量补数据含失败任务，批次状态依次为等待运行、运行中、失败
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：MySQL
      3) 存在已提交至运维中心的日调度周期任务 TaskJ，任务SQL为 SELECT SLEEP(10);
      4) 存在已提交至运维中心的日调度周期任务 TaskC，任务SQL为 SELECT SLEEP(20);
      5) 存在已提交至运维中心的日调度周期任务 TaskK，任务SQL为 SELECT missing_column FROM missing_table;
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 前往【运维中心 → 周期任务 → 周期任务管理】，勾选 TaskJ、TaskC、TaskK 并对当日业务日期执行批量补数据
        expected: 补数据实例列表新增包含3个任务实例的批次记录
      - action: 在3个任务实例均为「等待运行」时查看批次状态
        expected: 补数据批次状态为「等待运行」
      - action: 在至少1个任务实例为「运行中」时查看批次状态
        expected: 补数据批次状态为「运行中」
      - action: 在 TaskJ、TaskC 为「成功」且 TaskK 为「失败」时查看批次状态
        expected: 补数据批次状态为「失败」
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0004
    title: 验证【周期任务】-【补数据实例】批量补数据取消部分实例后，批次状态为取消
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Greenplum
      3) 存在已提交至运维中心的日调度周期任务 TaskI，任务SQL为 SELECT pg_sleep(30);
      4) 存在已提交至运维中心的日调度周期任务 TaskA，任务SQL为 SELECT pg_sleep(60);
      5) 存在已提交至运维中心的日调度周期任务 TaskB，任务SQL为 SELECT pg_sleep(90);
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 前往【运维中心 → 周期任务 → 周期任务管理】，勾选 TaskI、TaskA、TaskB 并对当日业务日期执行批量补数据
        expected: 补数据实例列表新增包含3个任务实例的批次记录
      - action: 在 TaskI 为「运行中」时取消 TaskA
        expected: TaskA 状态变为「取消」，批次状态保持「运行中」
      - action: 在 TaskI、TaskB 均结束且批次内不存在「等待运行」「运行中」「失败」实例时查看批次状态
        expected: 补数据批次状态为「取消」
      - action: 新建相同任务范围的补数据批次并点击「取消全部」
        expected: 3个任务实例和补数据批次的状态均为「取消」
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0005
    title: 验证【周期任务】-【补数据实例】单选状态筛选，列表仅展示对应状态的实例
    priority: P0
    precondition: |-
      1) 补数据实例列表存在 supplement_waiting、supplement_running、supplement_success、supplement_cancel、supplement_failed，状态依次为「等待运行」「运行中」「成功」「取消」「失败」
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 仅勾选「等待运行」并点击「确定」
        expected: 仅展示 supplement_waiting
      - action: 仅勾选「运行中」并点击「确定」
        expected: 仅展示 supplement_running
      - action: 仅勾选「成功」并点击「确定」
        expected: 仅展示 supplement_success
      - action: 仅勾选「取消」并点击「确定」
        expected: 仅展示 supplement_cancel
      - action: 仅勾选「失败」并点击「确定」
        expected: 仅展示 supplement_failed
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0006
    title: 验证【周期任务】-【补数据实例】多选状态筛选，列表仅展示勾选状态的实例
    priority: P1
    precondition: |-
      1) 补数据实例列表存在 supplement_waiting、supplement_running、supplement_success、supplement_cancel、supplement_failed，状态依次为「等待运行」「运行中」「成功」「取消」「失败」
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 勾选「运行中」「成功」并点击「确定」
        expected: 仅展示 supplement_running、supplement_success
      - action: 勾选「失败」「成功」并点击「确定」
        expected: 仅展示 supplement_failed、supplement_success
      - action: 勾选「运行中」「取消」「失败」并点击「确定」
        expected: 仅展示 supplement_running、supplement_cancel、supplement_failed
      - action: 勾选「等待运行」「成功」并点击「确定」
        expected: 仅展示 supplement_waiting、supplement_success
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0007
    title: 验证【周期任务】-【补数据实例】全选或全不选状态筛选，列表展示全部实例
    priority: P1
    precondition: |-
      1) 补数据实例列表存在 supplement_waiting、supplement_running、supplement_success、supplement_cancel、supplement_failed，状态依次为「等待运行」「运行中」「成功」「取消」「失败」
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 勾选五个状态并点击「确定」
        expected: 列表展示 supplement_waiting、supplement_running、supplement_success、supplement_cancel、supplement_failed
      - action: 取消勾选五个状态并点击「确定」
        expected: 列表展示 supplement_waiting、supplement_running、supplement_success、supplement_cancel、supplement_failed
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0008
    title: 验证【周期任务】-【补数据实例】状态与任务名称、业务日期、执行人组合筛选，列表仅展示符合条件实例
    priority: P0
    precondition: |-
      1) 列表存在 supplement_filter_running，状态「运行中」，任务名称「TaskA」，业务日期为当日，执行人「filter_owner_a」
      2) 列表存在 supplement_filter_success，状态「成功」，任务名称「TaskB」，业务日期为前一日，执行人「filter_owner_b」
      3) 列表存在 supplement_filter_failed，状态「失败」，任务名称「TaskD」，业务日期为前一日，执行人「filter_owner_a」
      4) 列表存在 supplement_filter_cancel，状态「取消」，任务名称「TaskC」，业务日期为当日，执行人「filter_owner_b」
    steps:
      - action: 进入【运维中心 → 周期任务 → 补数据实例】页面
        expected: 进入成功
      - action: 状态选择「运行中」，任务名称输入「TaskA」并确定
        expected: 仅展示 supplement_filter_running
      - action: 状态选择「失败」「成功」，业务日期选择前一日并确定
        expected: 仅展示 supplement_filter_success、supplement_filter_failed
      - action: 状态选择「取消」「运行中」，执行人选择「filter_owner_b」并确定
        expected: 仅展示 supplement_filter_cancel
    tags: ["运维中心", "周期任务", "补数据实例"]

  - case_id: C0009
    title: 验证【数据开发】-【周期任务】运行 GP 任务，展示实时执行时长与日志起止时间
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Greenplum
    steps:
      - action: 进入【数据开发 → 周期任务】页面
        expected: 进入成功
      - action: |-
          新建Greenplum周期任务：
          任务名称：TaskF
          数据源：${DataSourceA}
          SQL：SELECT pg_sleep(3);
        expected: 打开任务编辑器并展示SQL执行区域、日志区域
      - action: 点击「运行」并观察任务执行时长，任务结束后查看日志首尾时间
        expected: |-
          1) 执行开始时展示「任务执行时长：00:00」并每秒更新
          2) 任务结束后日志展示开始时间、结束时间
          3) 最终任务执行时长等于结束时间与开始时间的差值
    tags: ["数据开发", "周期任务", "实时执行时长"]

