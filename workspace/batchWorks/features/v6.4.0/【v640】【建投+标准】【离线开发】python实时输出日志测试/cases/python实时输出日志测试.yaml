cases:
  - case_id: C0001
    title: 验证py2agent任务运行支持实时打印任务运行日志
    priority: P0
    precondition: |-
      -- 复杂py2任务

      # -*- coding: utf-8 -*-
      from __future__ import print_function
      import sys, time

      if sys.version_info[0] < 3:
          # Py2：打印中文时编码为 UTF-8
          def uprint(s):
              sys.stdout.write((s if isinstance(s, str) else s.encode('utf-8')) + '\n')
      else:
          # Py3：正常打印
          def uprint(s):
              print(s)

      count = 0  # 全局计数器

      def hanoi_tower(num, a, b, c):
          global count
          if num == 1:
              count += 1
              uprint(u"第{}步: 第1个轮盘从:{}柱->{}柱".format(count, a, c))
          else:
              hanoi_tower(num - 1, a, c, b)
              count += 1
              uprint(u"第{}步: 第{}个轮盘从:{}柱->{}柱".format(count, num, a, c))
              hanoi_tower(num - 1, b, a, c)
          time.sleep(1)


      if __name__ == "__main__":
          hanoi_tower(5, u"A", u"B", u"C")
          uprint(u"\n总移动步数: {}".format(count))


      -- 简单py2任务
      import time
      for i in range(60):
          print(i)
          time.sleep(1)
    steps:
      - action: 进入数据开发-周期任务页面, 创建py2agent任务, 配置环境参数中的节点标签后, 临时运行py2复杂脚本
        expected: |-
          1) 日志内容支持滚动, 不会被新的日志中断
          2) pyagent日志内容格式大致如下:
          [17:24:12] <info> 正在提交...
          [17:24:12] <info> 任务开始执行
          ===========任务信息===========
          ${py脚本内容}
          ============================
          [17:24:13] <info> 等待运行.....
          [17:25:16] <info> 等待运行.....
          2025-08-11 17:24:57: 第1步: 第1个轮盘从:A柱->C柱
          2025-08-11 17:24:59: 第2步: 第2个轮盘从:A柱->B柱
          ........
          2025-08-11 17:25:30: 第31步: 第1个轮盘从:A柱->C柱
          2025-08-11 17:25:33: 总移动步数: 31
