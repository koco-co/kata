schema_version: 1
project: dataAssets
env: ltqc-local

urls:
  base_url: "http://shuzhan63-test-ltqc.k8s.dtstack.cn"
  data_assets_base_url: "http://shuzhan63-test-ltqc.k8s.dtstack.cn/dataAssets"
  offline_base_url: "http://shuzhan63-test-ltqc.k8s.dtstack.cn/batch"
  portal_base_url: "http://shuzhan63-test-ltqc.k8s.dtstack.cn/portal"

auth:
  session_path: "workspace/dataAssets/.kata/auth/dataAssets/session-ltqc-local.json"
  tenant_id: 10481
  tenant_name: "pw_test"
  derive_from_session: true

projects:
  quality: { id: 157, name: "pw" }
  offline: { id: 218, name: "pw_test" }
  owner: { id: 1 }
  engines: ["default", "doris3"]

datasources:
  sparkthrift:
    enabled: true
    ui_label: "SparkThrift2.x"
    precondition_type: "SparkThrift"
    aliases: ["sparkthrift", "hadoop", "pw_test_HADOOP"]
    batch: { id: 9, name: "pw_test_HADOOP", type_id: 45, database: "pw_test", schema: "pw_test" }
    metadata: { id: 606, name: "pw_test_HADOOP", type_id: 45 }
    assets: { id: 606, name: "pw_test_HADOOP" }
    sql: { database: "pw_test", schema: "pw_test", warehouse_uri: "hdfs://ns1/dtInsight/hive/warehouse/pw_test.db" }

  doris:
    enabled: true
    ui_label: "Doris3.x"
    precondition_type: "Doris"
    aliases: ["doris", "doris3", "doris70", "pw_test_DORIS_doris70"]
    batch: { id: 504, name: "pw_test_DORIS_doris70", type_id: 129, database: "pw_test", schema: "pw_test", cluster_name: "doris" }
    metadata: { id: 614, name: "doris70", type_id: 129 }
    assets: { id: 614, name: "doris70" }
    ui: { source_type_id: 129 }
    sql: { database: "pw_test", schema: "pw_test" }

runtime:
  default_datasource: "doris"
  active_datasources: ["doris", "sparkthrift"]
  table_prefix: "qa_auto"
  skip_preconditions: false
  cleanup: true
  allow_write: true
  timeouts: { project_api_ms: 120000, precondition_request_ms: 120000, metadata_sync_ms: 180000 }
  playwright: { headless: true, workers: 1, fully_parallel: false, step_capture: "all" }
