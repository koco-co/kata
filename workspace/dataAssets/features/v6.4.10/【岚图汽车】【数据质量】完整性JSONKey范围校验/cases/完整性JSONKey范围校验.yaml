meta:
  title: 完整性JSONKey范围校验
  requirement_id: "15693"
  case_module_id: ""
  exports:
    - 完整性JSONKey范围校验.xmind
cases:
  - case_id: C0001
    automation:
      spec_file: c0001-key-range-single-field-selection.spec.ts
    title: 验证【数据质量】-【规则集管理】选择 key 范围校验统计函数，字段选择框切换为单选
    priority: P0
    precondition: |-
      1) JSON 格式校验管理中已存在 key1（姓名）、key2（年龄）
      2) 规则集「RuleSetF」已关联字段 info，规则包为「key范围规则包」
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 编辑规则集「RuleSetF」的「key范围规则包」，新增一条规则并选择统计函数「空值数」
        expected: 字段选择框支持同时选择 id、info 两个字段
      - action: 将统计函数切换为「key范围校验」
        expected: 字段选择框切换为单选模式，统计函数旁展示提示「选择 key 范围校验时字段仅支持单选」
      - action: 先选择 info，再选择 id
        expected: 字段选择框始终只保留 1 个字段，最终选中 id
    tags:
      - 数据质量
      - 规则集管理
      - JSONKey范围校验

  - case_id: C0002
    automation:
      spec_file: c0002-include-exclude-method-results.spec.ts
    title: 验证【数据质量】-【规则任务管理】切换包含与不包含校验方法并执行，异常明细与校验方法一致
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建 JSON 字段表并插入 2 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15693_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15693_c0002 (id BIGINT, info STRING);
         INSERT INTO ${SchemaA}.test_table_15693_c0002 VALUES (1, '{"key1":"张三","key2":25}'), (2, '{"key1":"李四"}');
      5) JSON 格式校验管理中存在 key1、key2
      6) 规则包「包含规则包」已关联 info 字段
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新建规则任务，选择 ${DataSourceA}、${SchemaA}.test_table_15693_c0002，引用「包含规则包」，校验方法选择「包含」并选择 key1、key2
        expected: 规则任务展示 info 字段、包含方法和 key1、key2
      - action: 保存任务并点击【立即执行】
        expected: 最新实例状态为「校验异常」，id=1 状态为「通过」，id=2 状态为「不通过」
      - action: 将校验方法改为「不包含」并再次执行
        expected: 最新实例状态为「校验异常」，id=1 和 id=2 均为「不通过」，详情说明包含 key1、key2 范围不满足不包含条件
    tags:
      - 数据质量
      - 规则任务管理
      - 包含与不包含

  - case_id: C0003
    automation:
      spec_file: c0003-key-range-select-all.spec.ts
    title: 验证【数据质量】-【规则集管理】多选与全选校验内容，6 个 key 全部选中并回显
    priority: P1
    precondition: |-
      1) JSON 格式校验管理中存在第一层 key1（姓名）、key2（年龄）、key3（性别）和第二层 key11（省份）、key22（城市）、key33（区县）
      2) 规则集「RuleSetF」已关联字段 info
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 编辑「RuleSetF」并新增 key 范围校验规则
        expected: 规则编辑区域展示字段、校验方法和校验内容控件
      - action: 在校验内容下拉框勾选 key1、key2、key3
        expected: 下拉框已选数量为 3，三个 key 的复选框为选中状态
      - action: 点击【全部】再点击【确认】
        expected: 第一层和第二层共 6 个 key 均为选中状态，规则表单回显 6 个 key
      - action: 再次打开下拉框点击【全部】
        expected: 6 个 key 全部取消选中，已选数量为 0
    tags:
      - 数据质量
      - 规则集管理
      - 全选

  - case_id: C0004
    automation:
      spec_file: c0004-search-validation-content.spec.ts
    title: 验证【数据质量】-【规则集管理】输入关键词搜索校验内容，下拉框命中过滤并展示暂无数据
    priority: P1
    precondition: |-
      1) JSON 格式校验管理中存在 key1（姓名）、key11（省份）、key2（年龄）
      2) 规则集「RuleSetF」已关联字段 info
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 编辑「RuleSetF」并打开 key 范围校验规则的校验内容下拉框
        expected: 下拉框展示 key 搜索输入框
      - action: 输入「key1」
        expected: 下拉框展示 key1、key11，不展示 key2
      - action: 清空搜索框并输入「省份」
        expected: 下拉框仅展示 key11（省份）
      - action: 清空搜索框并输入「not_exist_key」
        expected: 下拉框显示「暂无数据」
    tags:
      - 数据质量
      - 规则集管理
      - 搜索

  - case_id: C0005
    automation:
      spec_file: c0005-key-range-default-200-search.spec.ts
    title: 验证【数据质量】-【规则集管理】加载校验内容下拉框，默认展示前 200 条且搜索可命中未加载 key(校验内容条数 > 200)
    priority: P1
    precondition: |-
      1) 使用以下一次性 Bash 命令生成 json_key_range_import_250.xlsx：
      python3 - <<'PY'
      from openpyxl import Workbook
      workbook = Workbook()
      sheet = workbook.active
      sheet.title = "一层"
      sheet.append(["key", "中文名称", "value格式"])
      for index in range(1, 251):
          sheet.append([f"key_{index:03d}", f"名称{index}", ""])
      workbook.save("json_key_range_import_250.xlsx")
      PY
      2) 在 JSON 格式校验管理中导入 json_key_range_import_250.xlsx，导入后 key_001 至 key_250 均存在
      3) 规则集「RuleSetF」已关联字段 info
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 编辑「RuleSetF」并打开 key 范围校验规则的校验内容下拉框
        expected: 下拉框展示 key_001 至 key_200，共 200 条
      - action: 滚动下拉框到底部
        expected: 下拉框仍展示 200 条，未自动追加 key_201 至 key_250
      - action: 在搜索框输入「key_201」
        expected: 搜索结果展示 key_201，且结果数量为 1
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0006
    automation:
      spec_file: c0006-key-range-display-format.spec.ts
    title: 验证【数据质量】-【规则集管理】保存多层级校验内容，回显为同层横线拼接与层级分号分隔
    priority: P1
    precondition: |-
      1) JSON 格式校验管理中存在第一层 key1、key2 和第二层 key11、key22
      2) 规则集「RuleSetF」已关联字段 info
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 编辑「RuleSetF」并打开 key 范围校验规则的校验内容下拉框
        expected: 下拉框展示第一层和第二层 key
      - action: 第一层勾选 key1、key2，第二层勾选 key11、key22，点击【确认】
        expected: 校验内容回显为「key1-key2;key11-key22」
      - action: 点击【保存】后重新打开规则
        expected: 校验内容仍回显「key1-key2;key11-key22」，同层级使用「-」，层级组使用「;」
    tags:
      - 数据质量
      - 规则集管理
      - 层级回显

  - case_id: C0007
    automation:
      spec_file: c0007-key-range-report-tooltip.spec.ts
    title: 验证【数据质量】-【数据质量报告】查看校验内容列，默认展示前两个 key 且悬浮展示全部
    priority: P1
    precondition: |-
      1) 规则任务「TaskB」已执行完成，规则校验内容为「key1-key2;key11-key22」
      2) 质量报告列表存在该任务的最新报告
    steps:
      - action: 进入【数据质量 → 数据质量报告】页面
        expected: 进入成功
      - action: 打开「TaskB」最新报告详情
        expected: 报告详情展示 key 范围校验规则行
      - action: 查看校验内容列的默认文本
        expected: 默认文本展示前两个 key，超出部分使用截断符
      - action: 将鼠标悬浮在校验内容列
        expected: Tooltip完整展示「key1-key2;key11-key22」
    tags:
      - 数据质量
      - 数据质量报告
      - Tooltip

  - case_id: C0008
    automation:
      spec_file: c0008-json-string-field-types.spec.ts
    title: 验证【数据质量】-【规则任务管理】执行 JSON 与 string 字段 key 范围规则，异常记录包含缺失 key 行
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建 JSON 字段表并插入 2 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15693_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15693_c0008 (id BIGINT, info STRING);
         INSERT INTO ${SchemaA}.test_table_15693_c0008 VALUES (1, '{"key1":"A","key2":"B"}'), (2, '{"key1":"C"}');
      5) JSON 格式校验管理中存在 key1、key2
      6) 规则包「key范围执行包」已关联 info 字段
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新建规则任务，选择 ${DataSourceA}、${SchemaA}.test_table_15693_c0008，引用「key范围执行包」，校验方法选择「包含」并选择 key1、key2
        expected: 规则任务保存成功，任务列表新增「key范围执行任务」
      - action: 点击【立即执行】并打开最新实例
        expected: 实例状态为「校验异常」，异常记录包含 id=2
      - action: 将字段类型切换为 JSON 兼容字段并再次保存执行
        expected: 规则任务仍生成实例，字段类型与 key 范围规则匹配
    tags:
      - 数据质量
      - 规则任务管理
      - JSON字段
      - 字符串字段

  - case_id: C0009
    title: 验证【数据质量】-【规则集管理】不选择字段保存 key 范围校验规则，字段置红提示请选择字段
    priority: P1
    precondition: |-
      1) JSON 格式校验管理中存在 key1、key2
      2) 规则集「RuleSetF」已进入新增规则表单
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 在新增规则表单选择统计函数「key范围校验」，不选择字段
        expected: 点击成功
      - action: 【保存】
        expected: 「字段」置红提示「请选择字段」，规则行不新增
    tags:
      - 数据质量
      - 规则集管理
      - 必填校验

  - case_id: C0010
    title: 验证【数据质量】-【规则集管理】不选择校验内容或校验方法保存规则，分别置红提示必填
    priority: P1
    precondition: |-
      1) JSON 格式校验管理中存在 key1、key2
      2) 规则集「RuleSetF」已进入新增规则表单，字段为 info
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 选择统计函数「key范围校验」和字段 info，不选择校验内容，点击【保存】
        expected: 「校验内容」置红提示「请选择校验内容」，规则行不新增
      - action: 选择 key1、key2，清空校验方法后点击【保存】
        expected: 「校验方法」置红提示「请选择校验方法」，规则行不新增
    tags:
      - 数据质量
      - 规则集管理
      - 必填校验

  - case_id: C0011
    title: 验证【数据质量】-【规则任务管理】导入 string 字段规则集并执行 key 范围校验，异常明细定位到缺 key 记录
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建 JSON 字段表并插入 3 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15693_c0011;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15693_c0011 (id BIGINT, info STRING);
         INSERT INTO ${SchemaA}.test_table_15693_c0011 VALUES (1, '{"key1":"A","key2":"B"}'), (2, '{"key1":"C"}'), (3, '{"key1":"D","key2":"E"}');
      5) 规则集「RuleSetE」包含 info 字段的 key 范围规则，校验内容为 key1-key2
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新建监控规则，选择 ${DataSourceA}、${SchemaA}.test_table_15693_c0011，导入规则集「RuleSetE」
        expected: 监控规则表格展示 key 范围规则和校验内容 key1-key2
      - action: 保存任务并点击【立即执行】
        expected: 最新实例状态为「校验异常」，异常数量为 1
      - action: 打开实例详情
        expected: 异常明细定位到 id=2，字段 info 标红
    tags:
      - 数据质量
      - 规则任务管理
      - 规则包导入

  - case_id: C0012
    title: 验证【数据质量】-【规则库配置】查看 key 范围校验内置规则，列表与详情展示配置说明
    priority: P1
    precondition: |-
      1) 规则库页面中已发布 key 范围校验内置规则
      2) JSON 格式校验管理中存在 key1、key2
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 点击【内置规则】Tab并搜索「key范围校验」
        expected: 列表展示规则名称、规则说明、规则类型、适用字段类型和启用状态
      - action: 打开规则详情
        expected: 详情展示字段单选限制、校验方法和校验内容配置说明
    tags:
      - 数据质量
      - 规则库配置
      - 内置规则

  - case_id: C0013
    title: 验证【数据质量】-【规则集管理】在千级 key 中搜索选择并保存规则，校验内容回显命中 key
    priority: P1
    precondition: |-
      1) JSON 格式校验管理中存在第一层 key_001 至 key_500、第二层 key_501 至 key_1000
      2) 规则集「RuleSetH」已关联字段 info
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 编辑「RuleSetH」并打开 key 范围校验规则的校验内容下拉框
        expected: 下拉框按层级展示 1000 个 key，首屏加载完成
      - action: 搜索 key_750 并选择该 key，点击【确认】和【保存】
        expected: 规则保存成功，校验内容回显包含 key_750
      - action: 打开关联任务并立即执行
        expected: 实例生成成功，规则详情展示 key_750
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0014
    title: 验证【数据质量】-【JSON格式校验管理】删除规则引用的 key，规则集保留引用且不被改写
    priority: P1
    precondition: |-
      1) JSON 格式校验管理中存在 key1、key2
      2) 规则集「RuleSetB」的规则内容引用 key1、key2
    steps:
      - action: 进入【数据质量 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 删除 key2 并确认删除
        expected: Toast提示:「删除成功」，key2 不再出现在可选 key 列表
      - action: 进入【数据质量 → 规则集管理】页面，编辑「RuleSetB」
        expected: 规则编辑页仍展示已保存的 key1-key2 引用，引用状态可识别
      - action: 保存规则集
        expected: Toast提示:「保存成功」，规则内容未被静默改写
    tags:
      - 数据质量
      - JSON格式校验管理
      - 引用关系

  - case_id: C0015
    title: 验证【数据质量】-【规则任务管理】开启百分比抽样执行 key 范围规则，实例详情展示抽样数量与结果
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建 JSON 字段表并插入 6 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15693_c0015;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15693_c0015 (id BIGINT, info STRING);
         INSERT INTO ${SchemaA}.test_table_15693_c0015 SELECT id, CASE WHEN id % 2 = 0 THEN '{"key1":"A","key2":"B"}' ELSE '{"key1":"A"}' END FROM range(1, 7);
      5) 规则集「RuleSetC」包含 info 字段的 key 范围规则
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新建监控规则，选择 ${DataSourceA}、${SchemaA}.test_table_15693_c0015，开启百分比抽样并导入「RuleSetC」
        expected: 抽样设置展示为启用，规则列表展示 key 范围规则
      - action: 保存任务并立即执行
        expected: 实例状态为「运行完成」或「校验异常」，实例详情展示抽样数量和 key 范围结果
      - action: 查看生成 SQL
        expected: SQL 包含抽样函数或临时抽样表，结果记录数量不超过抽样行数
    tags:
      ["数据质量", "规则任务管理"]
  - case_id: C0016
    title: 验证【数据质量】-【规则任务管理】按当日分区执行 key 范围规则，生成 SQL 仅含当日分区过滤条件
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并插入前一日和当日数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15693_c0016;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15693_c0016 (id BIGINT, info STRING, dt DATE) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15693_c0016 SELECT id, '{"key1":"A"}', DATE_SUB(CURRENT_DATE(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15693_c0016 SELECT id, '{"key1":"A","key2":"B"}', CURRENT_DATE() FROM range(4, 7);
      5) 规则集「RuleSetA」包含 info 字段 key1-key2 包含规则
    steps:
