  - case_id: C0003
    title: 验证「多表数据一致性比对」不通过任务查看明细正确
    priority: P1
    steps:
      - action: 进入「资产-数据质量-规则任务配置-监控对象」页面
        expected: 页面正常打开
      - action: 「规则名称」输入「test_rule」 「选择数据源」选择「${DATASOURCE}」 「选择数据库」选择「${DATABASE}」 「选择数据表」选择「${TABLE}」
        expected: 监控对象配置成功； 进入「监控规则」配置页
      - action: |-
          「监控规则」配置如下：
          1） （选择校验字段且不配置对比细节：） 「监控规则1」新增「一致性校验」 「校验类型」选择为「多表数据一致性比对」 「选择校验字段」选择为「user_name；age」 「选择校验表主键」选择为「id」 「选择对比表」为「${TABLE}」 「选择对比表主键」为「id」 「比对字段设置」配置为 「校验表-user_name-->对比表-age；校验表-age-->对比表-user_name」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」 不配置「对比细节设置」
          2） （选择校验字段且配置对比细节：） 「监控规则2」新增「一致性校验」 「校验类型」选择为「多表数据一致性比对」 「选择校验字段」选择为「phone 」 「选择校验表主键」选择为「id」 「选择对比表」为「${TABLE}」 「选择对比表主键」为「id」 「比对字段设置」配置为 「校验表-phone -->对比表-age」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」 配置「对比细节设置」为「数值差异百分比-小于等于0%」
          3） （不选择校验字段：） 「监控规则3」新增「一致性校验」 「校验类型」选择为「多表数据一致性比对」 不配置「选择校验字段」 「选择校验表主键」选择为「id」 「选择对比表」为「${TABLE}」 「选择对比表主键」为「id」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」 不配置「对比细节设置」
        expected: 监控规则配置完成； 进入「调度属性」页面
      - action: 配置「调度属性」，保存规则，且「调度属性」中配置「规则报告」为最新结果
        expected: 规则保存成功
      - action: 临时运行规则
        expected: 实例运行结果不通过
      - action: 点击查看不通过明细
        expected: |-
          1） 标题显示为“查看“一致性校验-多表数据一致性比对”明细”
          2） 记录所有不符合规则的数据
          3） 列表显示，表头为规则校验的「表.主键」、「表.字段」
          4） 不做标红处理
      - action: 点击【下载明细】按钮
        expected: 支持下载明细，内容正确
