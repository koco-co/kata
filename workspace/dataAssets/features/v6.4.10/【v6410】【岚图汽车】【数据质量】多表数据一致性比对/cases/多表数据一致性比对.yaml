meta:
  title: 多表数据一致性比对
  version: v6.4.10
  feature_id: v6.4.10/【v6410】【岚图汽车】【数据质量】多表数据一致性比对
  case_module_id: ""
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证「多表数据一致性比对」任务不通过质量报告正确
    priority: P0
    steps:
      - action: 进入「资产-数据质量-规则任务配置-监控对象」页面
        expected: 页面正常打开
      - action: 「规则名称」输入「test_rule」 「选择数据源」选择「${DATASOURCE}」 「选择数据库」选择「${DATABASE}」 「选择数据表」选择「${TABLE}」
        expected: 监控对象配置成功； 进入「监控规则」配置页
      - action: 「监控规则」配置如下： 「监控规则」新增「一致性校验」 「校验类型」选择为「多表数据一致性比对」 「选择校验字段」选择为「user_name；age」 「选择校验表主键」选择为「id」 「选择对比表」为「${TABLE}」 「选择对比表主键」为「id」 「比对字段设置」配置为「校验表-user_name-->对比表-age；校验表-age-->对比表-user_name」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」 不配置「对比细节设置」
        expected: 监控规则配置完成； 进入「调度属性」页面
      - action: 配置「调度属性」，保存规则，且「调度属性」中配置「规则报告」为最新结果
        expected: 规则保存成功
      - action: 临时运行规则，查看质量报告
        expected: |-
          页面包含：
          1） 报告进入目录
          2） 质量评估汇总区域
          3） 规则校验明细区域
      - action: 查看「质量评估汇总」区域
        expected: |-
          显示为：
          1） 规则名：「test_rule」
          2） 数据源：「${DATASOURCE}」
          3） 数据库：「${DATABASE}」
          4） 检测数据范围：-
          -
          5） 表行数： 「${表行数}」
          6） 抽样行数：-
          -
          7） 字段数： 「${字段数}」
          8） 车辆数：「${车辆数}」
          9） 校验规则数：2
          10） 校验通过率：50%
      - action: 查看「规则校验明细」区域
        expected: |-
          显示为：
          1） 规则类型：一致性校验
          2） 规则名称：多表数据一致性校验
          3） 字段名称：user_name;age
          4） 字段类型：STRING;TINYINT
          5） 质验结果：校验未通过
          6） 未通过原因：多表数据一致性校验未通过
          7） 详情说明：对比表为「${TABLE}」，逻辑主键未匹配的共0条数据，逻辑主键匹配，但数据不匹配的共2条数据
          8） 最近一次校验结束时间：「${校验结束时间}」
          9） 操作：查看详情
      - action: 点击「查看详情」按钮
        expected: 显示不通过的明细数据
    precondition: |-
      已存在spark表A
      CREATE TABLE IF NOT EXISTS
      tableA (
      create_date DATE COMMENT '日期类型',
      update_datetime TIMESTAMP COMMENT '日期时间类型（替代原DATETIME）',
      work_time STRING COMMENT '时间类型（Spark无TIME类型，用STRING存储HH:mm:ss）',
      sync_timestamp TIMESTAMP COMMENT '时间戳类型',
      date_str_ymd STRING COMMENT '字符串日期(yyyy-MM-dd)，强转DATE',
      date_str_ymd_hms STRING COMMENT '字符串日期时间(yyyy-MM-dd HH:mm:ss)，强转TIMESTAMP',
      date_str_mdy STRING COMMENT '字符串时间(HH:mm:ss)，强转STRING（Spark无TIME类型）',
      date_str_ymd_hms_ms STRING COMMENT '字符串日期时间(yyyy-MM-dd HH:mm:ss.SSS)，强转TIMESTAMP',
      date_str_irregular STRING COMMENT '字符串日期(非标准格式，如20260204)，强转DATE',
      id INT COMMENT '主键ID',
      user_name STRING COMMENT '用户名（Spark中VARCHAR等价于STRING）',
      age TINYINT COMMENT '年龄',
      phone BIGINT COMMENT '手机号',
      email STRING COMMENT '邮箱',
      salary DECIMAL(10, 2) COMMENT '薪资',
      is_active BOOLEAN COMMENT '是否激活',
