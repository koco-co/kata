        expected: 弹出「比对规则」内容配置
      - action: 查看「比对规则」内容
        expected: |-
          可勾选：
          1） 数值差异百分比，对比表之间的数值型数据时，差距百分比小于等于xx%时候，计为成功匹配
          2） 数值差异绝对值，对比表之间的数值型数据时，差距绝对值小于等于xx时候，计为成功匹配
          3） 数值对比忽略小数点，忽略小数点后xx位
          4） 字符不区分大小写，对比左右表的字符串型数据时，不区分大小写
          5） 空值与NULL等价，对比左右表的数据时，认为空值与NULL值是相等的
      - action: 鼠标hover“？”
        expected: 悬浮提示：“若不勾选配置具体规则细节，则正常按照主键校验数据是否存在差异，只要存在差异判断校验不通过。”
    precondition: 无
    tags:
      - 内置规则
      - 一致性校验
      - 多表数据一致性比对
