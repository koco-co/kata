       DROP TABLE IF EXISTS ${SchemaA}.test_table_15694_c0007;
       CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15694_c0007 (id INT, info STRING, name VARCHAR(255));
    6) 已在资产平台引入该表
    7) 已生成导入文件 json_value_format_import_15694.xlsx（共210条一层key数据，均设置value格式）：
       Sheet: 一层
       Title: key, 中文名称, value格式
       Line1: test-key-001, 测试键001, ^.+$
    8) 使用以下一次性 Bash 命令生成 json_value_format_import_15694.xlsx：
    python3 - <<'PY'
    from openpyxl import Workbook
    workbook = Workbook()
    ws1 = workbook.active
    ws1.title = "一层"
    ws1.append(["key", "中文名称", "value格式"])
    for i in range(1, 211):
        ws1.append([f"test-key-{i:03d}", f"测试键{i:03d}", "^.+$"])
    workbook.save("json_value_format_import_15694.xlsx")
    PY
    9) 已通过【规则集管理】创建规则集 RuleSetA，关联 SparkThrift2.x 数据源 ${SchemaA} 库 test_table_15694_c0007 表，规则包名称「大数据量key测试包」
