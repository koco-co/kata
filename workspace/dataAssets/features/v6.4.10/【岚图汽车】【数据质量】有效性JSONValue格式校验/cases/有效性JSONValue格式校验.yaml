meta:
  title: 有效性JSONValue格式校验
  feature_id: quality-json-value-format-validation
  requirement_id: '15694'
  case_module_id: ''
  exports:
  - 有效性JSONValue格式校验.xmind
cases:
- case_id: C0001
  automation:
    spec_file: c0001-json-rule-option-order.spec.ts
  title: 验证【数据质量】-【规则集管理】查看统计规则下拉选项顺序，格式-json格式校验选项位于格式校验-自定义正则上方
  priority: P1
  steps:
  - action: 进入【数据质量 → 规则集管理】页面
    expected: 进入成功
  - action: 等待规则集列表加载完成
    expected: 规则集管理页面加载完成且显示目标控件打开，列表加载完成
  - action: 找到规则集 RuleSetA，点击操作列的【编辑】按钮，进入 Step 2 监控规则页面，在「value格式校验UI测试包」中点击【新增规则】，选择「有效性校验」，「字段」下拉框选择「info（json）」，展开「统计规则」下拉框并向下滚动查看完整选项列表
    expected: 「统计规则」下拉框中出现「格式-json格式校验」选项，且该选项位于「格式校验-自定义正则」选项的上方
  - action: 使用 Doris3.x 数据源重复以上步骤
    expected: 使用 Doris3.x 数据源执行后结果与 SparkThrift2.x 数据源一致
  precondition: |-
    1) 使用 admin 账号登录系统
    2) 授权数据源：${DataSourceA}
    3) 数据源类型：SparkThrift2.x
    4) 存在数据库：${SchemaA}
    5) 创建数据表，该表为空表：
       DROP TABLE IF EXISTS ${SchemaA}.test_table_15694_c0001;
       CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15694_c0001 (id INT, info STRING, name VARCHAR(255));
    6) 已在资产平台引入该表
    7) 已在「通用配置 → json格式校验管理」中维护 key 路径「person-name」，中文名称「人员姓名」，value格式正则：^[一-龥]+$
    8) 已通过【规则集管理】创建规则集 RuleSetA，关联 SparkThrift2.x 数据源 ${SchemaA} 库 test_table_15694_c0001 表（含字段 info（STRING类型）、name（VARCHAR类型）），规则包名称「value格式校验UI测试包」
    9) 规则集 RuleSetA 中已创建普通统计函数规则行并保存
  tags:
  - 数据质量
  - 规则集管理
  - 规则配置-选项UI
