    2) 授权数据源：${DataSourceA}
    3) 数据源类型：SparkThrift2.x
    4) 存在数据库：${SchemaA}
    5) 创建数据表，该表为空表：
       DROP TABLE IF EXISTS ${SchemaA}.test_table_15694_c0002;
       CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15694_c0002 (id INT, info STRING, name VARCHAR(255));
    6) 已在资产平台引入该表
    7) 已在「通用配置 → json格式校验管理」中维护 key 路径「person-name」，中文名称「人员姓名」，value格式正则：^[一-龥]+$
    8) 已通过【规则集管理】创建规则集 RuleSetA，关联 SparkThrift2.x 数据源 ${SchemaA} 库 test_table_15694_c0002 表，规则包名称「提示测试包」
    9) 规则集 RuleSetA 中已创建普通统计函数规则行并保存
