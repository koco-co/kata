- case_id: C0004
  automation:
    spec_file: c0004-select-configured-value-format-keys.spec.ts
  title: 验证【数据质量】-【规则集管理】选择校验key，已配置value格式的key可选且未配置的key不可选
  priority: P0
  steps:
  - action: 进入【数据质量 → 规则集管理】页面
    expected: 进入成功
  - action: 等待规则集列表加载完成
    expected: 规则集管理页面加载完成且显示目标控件打开，列表加载完成
  - action: |-
      找到规则集 RuleSetA，点击操作列的【编辑】按钮，进入 Step 2 监控规则页面，在「key选择测试包」中点击【新增规则】，添加有效性校验规则，按如下配置：
      字段：info（json）
      统计规则：格式-json格式校验
      展开「校验key」下拉选择框，查看列表中各 key 的可选状态
    expected: |-
      「校验key」下拉框列表中：

      1) 「person-name」（已配置 value 格式）显示为可选状态，可点击勾选

      2) 「person-age」（已配置 value 格式）显示为可选状态，可点击勾选

      3) 「person-email」（未配置 value 格式）显示为不可选状态，置灰禁用
  - action: 点击「person-email」进行选中操作
    expected: 「person-email」无法被选中，复选框保持未勾选状态
  - action: 点击勾选「person-name」和「person-age」
    expected: 「person-name」和「person-age」均成功勾选，下拉框输入框内回显对应已选 key
  - action: 使用 Doris3.x 数据源重复以上步骤
    expected: 使用 Doris3.x 数据源执行后结果与 SparkThrift2.x 数据源一致
  precondition: |-
    1) 使用 admin 账号登录系统
    2) 授权数据源：${DataSourceA}
    3) 数据源类型：SparkThrift2.x
    4) 存在数据库：${SchemaA}
    5) 创建数据表，该表为空表：
       DROP TABLE IF EXISTS ${SchemaA}.test_table_15694_c0004;
       CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15694_c0004 (id INT, info STRING, name VARCHAR(255));
    6) 已在资产平台引入该表
    7) 已在「通用配置 → json格式校验管理」中维护以下层级数据：
       - 父节点「person」下子节点「name」，勾选后回显为 key 路径「person-name」，已配置 value 格式
       - 父节点「person」下子节点「age」，勾选后回显为 key 路径「person-age」，已配置 value 格式
       - 父节点「person」下子节点「email」，勾选后回显为 key 路径「person-email」，未配置 value 格式
    8) 已通过【规则集管理】创建规则集 RuleSetA，关联 SparkThrift2.x 数据源 ${SchemaA} 库 test_table_15694_c0004 表，规则包名称「key选择测试包」
    9) 规则集 RuleSetA 中已创建非空值数规则行并保存
  tags:
  - 数据质量
  - 规则集管理
  - 规则配置-校验key选择
