         INSERT INTO ${SchemaA}.test_table_10183_c0005_comparison_08 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_09;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0005_comparison_09 (id BIGINT, value STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0005_comparison_09 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_10;
