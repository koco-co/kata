  - case_id: C0006
    title: 验证【数据质量】-【规则集管理】不选主键保存规则，主键置红且保存按钮禁用(必填校验)
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建校验表和对比表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0006_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0006_source_01 (id BIGINT, value STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0006_source_01 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0006_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0006_comparison_01 (id BIGINT, value STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0006_comparison_01 VALUES (1, 'v1');
      5) 新建规则集时已选择 ${SchemaA}.test_table_10183_c0006_source_01 和 ${SchemaA}.test_table_10183_c0006_comparison_01
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 添加多表一致性比对，选择 ${SchemaA}.test_table_10183_c0006_source_01 和 ${SchemaA}.test_table_10183_c0006_comparison_01，不选择校验表主键并点击【保存】
        expected: 「校验表主键」置红提示「请选择主键字段」，「保存」按钮禁用
      - action: 选择校验表主键 id 和对比表主键 id
        expected: 两个主键字段均回显 id，保存按钮恢复可用
    tags:
      - 数据质量
      - 规则集管理
      - 一致性校验
      - 必填校验
