         INSERT INTO ${SchemaA}.test_table_10183_c0005_comparison_03 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_04;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0005_comparison_04 (id BIGINT, value STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0005_comparison_04 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_05;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0005_comparison_05 (id BIGINT, value STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0005_comparison_05 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_06;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0005_comparison_06 (id BIGINT, value STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0005_comparison_06 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_07;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0005_comparison_07 (id BIGINT, value STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0005_comparison_07 VALUES (1, 'v1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_08;
