         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0005_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0005_comparison_01 (id BIGINT, value STRING);
