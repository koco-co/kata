meta:
  title: 多表数据一致性比对
  case_module_id: ""
  requirement_id: "10183"
  exports:
    - 多表数据一致性比对.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则集管理】新建多表一致性比对规则并执行，实例不达标且明细展示差异记录(数据不一致)
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建校验表和对比表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0001_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0001_source_01 (id BIGINT, user_name STRING, age INT);
         INSERT INTO ${SchemaA}.test_table_10183_c0001_source_01 VALUES (1, 'Alice', 20), (2, 'Bob', 30);
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0001_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0001_comparison_01 (id BIGINT, user_name STRING, age INT);
         INSERT INTO ${SchemaA}.test_table_10183_c0001_comparison_01 VALUES (1, 'Alice', 20), (2, 'Bobby', 31);
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 新建规则集，监控对象选择 ${SchemaA}.test_table_10183_c0001_source_01，添加多表数据一致性比对，主键选择 id，字段映射 user_name→user_name、age→age，对比表选择 ${SchemaA}.test_table_10183_c0001_comparison_01 并保存执行
        expected: 规则实例状态为「不达标」，不一致记录数为 1
      - action: 进入【数据质量 → 校验结果查询】页面并打开该实例的【查看明细】
        expected: 明细展示 id=2，user_name 为 Bob/Bobby，age 为 30/31
    tags:
      - 数据质量
      - 规则集管理
      - 一致性校验
      - 多表对比
      - 异常结果

  - case_id: C0002
    title: 验证【数据质量】-【规则集管理】新建多表一致性比对规则并执行，实例达标且查看明细按钮不可用(数据一致)
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建校验表和对比表并插入相同数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0002_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0002_source_01 (id BIGINT, user_name STRING, age INT);
         INSERT INTO ${SchemaA}.test_table_10183_c0002_source_01 VALUES (1, 'Alice', 20), (2, 'Bob', 30);
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0002_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0002_comparison_01 (id BIGINT, user_name STRING, age INT);
         INSERT INTO ${SchemaA}.test_table_10183_c0002_comparison_01 VALUES (1, 'Alice', 20), (2, 'Bob', 30);
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 新建规则集，选择 ${SchemaA}.test_table_10183_c0002_source_01，添加多表数据一致性比对，主键选择 id，字段映射 user_name→user_name、age→age，对比表选择 ${SchemaA}.test_table_10183_c0002_comparison_01 并保存执行
        expected: 规则实例状态为「达标」，不一致记录数为 0
      - action: 进入【数据质量 → 校验结果查询】页面并打开实例详情
        expected: 质量报告展示两张表行数均为 2，规则结果为「达标」，【查看明细】按钮不可用
    tags:
      - 数据质量
      - 规则集管理
      - 一致性校验
      - 多表对比
      - 达标结果

  - case_id: C0003
    title: 验证【数据质量】-【规则集管理】执行多表一致性比对规则，下载明细包含差异与独有记录(数据不一致)
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建校验表和对比表并插入三类记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0003_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0003_source_01 (id BIGINT, user_name STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0003_source_01 VALUES (1, 'Alice'), (2, 'Bob'), (3, 'Carol');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0003_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0003_comparison_01 (id BIGINT, user_name STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0003_comparison_01 VALUES (1, 'Alice'), (2, 'Bobby'), (4, 'Dave');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 新建多表一致性规则，选择 ${SchemaA}.test_table_10183_c0003_source_01 和 ${SchemaA}.test_table_10183_c0003_comparison_01，主键选择 id，字段映射 user_name→user_name 并执行
        expected: 规则实例状态为「不达标」，异常主键包含 id=2、id=3、id=4
      - action: 进入【数据质量 → 校验结果查询】页面，打开实例详情并点击【下载明细】
        expected: 下载文件包含 id=2 的字段差异、id=3 的校验表独有记录和 id=4 的对比表独有记录
    tags:
      - 数据质量
      - 规则集管理
      - 一致性校验
      - 明细下载

  - case_id: C0004
    title: 验证【数据质量】-【规则集管理】执行多表一致性比对规则，删除对比表后失败且日志正确(对比表不存在)
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建校验表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0004_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0004_source_01 (id BIGINT, user_name STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0004_source_01 VALUES (1, 'Alice');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10183_c0004_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10183_c0004_comparison_01 (id BIGINT, user_name STRING);
         INSERT INTO ${SchemaA}.test_table_10183_c0004_comparison_01 VALUES (1, 'Alicia');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 新建多表一致性规则，选择两张 test_table_10183_c0004 表并执行一次
        expected: 第一条实例状态为「不达标」
      - action: 在 ${DataSourceA} 对应平台删除 ${SchemaA}.test_table_10183_c0004_comparison_01 后再次执行规则
        expected: 第二条实例状态为「失败」
      - action: 进入【数据质量 → 校验结果查询】页面并查看第二条实例日志
        expected: 日志包含对比表 test_table_10183_c0004_comparison_01 不存在
    tags:
      - 数据质量
      - 规则集管理
      - 一致性校验
      - 执行日志

  - case_id: C0005
