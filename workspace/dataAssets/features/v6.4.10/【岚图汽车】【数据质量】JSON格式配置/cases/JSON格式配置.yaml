  - action: 清空搜索框，等待列表恢复
    expected: 列表恢复显示所有第一层级数据
  precondition: |-
    1) 使用 admin 账号登录系统
    2) 已通过【新增】创建第一层级 key 为 orderInfo 的记录
    3) 已通过【新增子层级】为 orderInfo 创建子层级 key 为 orderStatus
  tags:
