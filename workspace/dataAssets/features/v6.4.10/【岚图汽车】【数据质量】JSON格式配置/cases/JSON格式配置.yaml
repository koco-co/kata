    expected: 进入成功
  - action: 等待json格式校验管理列表数据加载完成
    expected: json格式校验管理页面打开，列表显示已有key数据
  - action: 逐层点击「+」展开，依次展开第1层 level1Root 到第4层 level4Node，找到第5层key为 level5Key 的记录，查看其操作列
    expected: 第5层 level5Key 记录的操作列中，【新增子层级】按钮存在但处于置灰禁用状态（disabled），不可点击；【编辑】和【删除】按钮正常可用
  precondition: |-
    1) 使用 admin 账号登录系统
    2) 已通过逐层【新增子层级】创建5层嵌套层级数据，第1层key为 level1Root，第2层key为 level2Node，第3层key为 level3Node，第4层key为 level4Node，第5层key为 level5Key
