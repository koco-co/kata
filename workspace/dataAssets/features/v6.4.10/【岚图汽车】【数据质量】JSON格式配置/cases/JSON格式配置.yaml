  title: 验证【数据质量】-【通用配置-json格式校验管理】按key名模糊搜索，列表仅展示命中记录且子层级key可命中
  priority: P0
  steps:
  - action: 进入【数据质量 → 通用配置-json格式校验管理】页面
    expected: 进入成功
  - action: 等待json格式校验管理列表数据加载完成
