- case_id: C0001
  automation:
    effects:
      platform_write: true
    business_record:
      policy: required
    implementations:
      - executor: playwright-web-ui
        state: planned
  title: 验证【数据质量】-【通用配置-json格式校验管理】新增key并执行正则匹配测试，列表新增key且正则测试显示匹配成功
  priority: P0
  steps:
  - action: 进入【数据质量 → 通用配置-json格式校验管理】页面
    expected: 进入成功
  - action: 等待json格式校验管理列表数据加载完成
    expected: |-
      页面标题显示「json格式校验管理」，列表正常展示，包含以下列：

      1) key

      2) 中文名称

      3) value格式

      4) 数据源类型

      5) 创建人

      6) 创建时间

      7) 更新人

      8) 更新时间

      9) 操作
  - action: 点击列表右上角【新增】按钮
    expected: |-
      弹出弹窗，标题为「新增」，包含以下字段：

      1) key（必填）

      2) 中文名称（非必填）

      3) value格式（非必填）

      4) 数据源类型（必选，默认选中「sparkthrift2.x」）

      弹窗中暂不显示「固定输入记录」输入框及「正则匹配测试」按钮
  - action: |-
      在新增弹窗中填写表单，内容如下：
      key：userInfo
      中文名称：用户信息
      value格式：^[a-zA-Z]+$
      数据源类型：hive2.x
    expected: 各字段输入内容与填写值一致；value格式填写内容后，弹窗内动态显示「固定输入记录」输入框和「正则匹配测试」按钮
  - action: 在「固定输入记录」输入框中填写 testValue，点击【正则匹配测试】按钮
    expected: 正则匹配测试执行，显示匹配结果为「匹配成功」
  - action: 点击弹窗【确定】按钮，等待接口响应完成
    expected: |-
      弹窗关闭，列表自动刷新，新增的key userInfo 出现在列表中：

      1) 数据源类型显示为「hive2.x」

      2) 中文名称显示「用户信息」

      3) value格式显示 ^[a-zA-Z]+$

      4) 创建人为 admin（当前登录用户）
  precondition: |-
    1) 使用 admin 账号登录系统
    2) json格式校验管理列表已存在至少1条数据
  tags:
  - 数据质量
  - 通用配置-json格式校验管理
  - 新增key
