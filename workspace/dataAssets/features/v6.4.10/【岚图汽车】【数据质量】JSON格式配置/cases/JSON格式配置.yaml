  - action: 进入【数据质量 → 规则任务管理】页面，点击【新建监控规则】，在 Step 1 基础信息中配置规则名称=TaskA，并关联 ${DataSourceA} 数据源的 ${SchemaA}.test_table_15696_c0041 表，点击【下一步】
