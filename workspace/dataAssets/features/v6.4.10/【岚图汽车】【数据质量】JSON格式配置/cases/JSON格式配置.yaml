    expected: 进入成功
  - action: 等待json格式校验管理列表数据加载完成
    expected: 页面标题显示「json格式校验管理」，列表加载完成，显示已有key数据行
  - action: |-
      点击【新增】按钮，弹窗出现后填写表单，内容如下：
      key：留空不填
      数据源类型：sparkthrift2.x（保持默认）
      点击【确定】按钮
    expected: 表单校验触发，key输入框下方显示「请输入key」，弹窗不关闭，数据未提交
  precondition: |-
    1) 使用 admin 账号登录系统
  tags:
