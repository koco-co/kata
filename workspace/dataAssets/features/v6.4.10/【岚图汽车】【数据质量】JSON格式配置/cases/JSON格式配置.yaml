  title: 验证【数据质量】-【通用配置-json格式校验管理】新增子层级key，父级key展开显示子层级记录
  priority: P0
  steps:
  - action: 进入【数据质量 → 通用配置-json格式校验管理】页面
    expected: 进入成功
  - action: 等待json格式校验管理列表数据加载完成
    expected: 页面加载完成且显示目标控件加载，列表显示 parentKey 记录
  - action: 在key为 parentKey 的行，点击操作列的【新增子层级】按钮
    expected: |-
      弹出弹窗，标题为「新增子层级」，包含以下字段：

      1) key（必填）

      2) 中文名称（非必填）

      3) value格式（非必填）

      弹窗中不包含数据源类型选项
  - action: |-
      在弹窗中填写表单，内容如下：
      key：childKey
      中文名称：子层级键
      value格式：^[0-9]+$
      点击【确定】按钮，等待接口响应完成
    expected: |-
      弹窗关闭，列表刷新，parentKey 行显示「+」展开图标，点击「+」后展开子层级，可见key为 childKey 的子层级记录：

      1) 中文名称显示「子层级键」

      2) value格式显示 ^[0-9]+$
  precondition: |-
    1) 使用 admin 账号登录系统
    2) 已通过【新增】创建第一层级 key 为 parentKey 的记录
  tags:
