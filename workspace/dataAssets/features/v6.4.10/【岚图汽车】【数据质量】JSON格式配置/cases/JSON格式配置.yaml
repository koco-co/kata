    expected: 各字段显示已填写的内容，数据源类型显示「sparkthrift2.x」
  - action: 将数据源类型下拉框从「sparkthrift2.x」切换为「hive2.x」
    expected: 数据源类型切换为「hive2.x」，表单中其他字段（key、中文名称、value格式）内容仍保留填写时的原值，未被清空
