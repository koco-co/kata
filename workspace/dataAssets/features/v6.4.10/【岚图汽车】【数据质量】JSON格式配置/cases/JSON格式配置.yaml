  - action: 在搜索框中输入 orderInfo，等待搜索结果返回
    expected: 列表仅显示key包含 orderInfo 的第一层级记录，key名称中不含 orderInfo 的记录均不显示
  - action: 清空搜索框，重新输入 orderStatus（子层级key名），等待搜索结果返回
