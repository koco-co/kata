  title: 验证【数据质量】-【通用配置-json格式校验管理】编辑key名称、value格式与数据源类型并保存，列表记录更新且更新人更新时间更新
  priority: P0
  steps:
  - action: 进入【数据质量 → 通用配置-json格式校验管理】页面
    expected: 进入成功
  - action: 等待json格式校验管理列表数据加载完成
    expected: 页面加载完成且显示目标控件加载，列表显示key editTarget 的记录
  - action: 在key为 editTarget 的行，点击操作列的【编辑】按钮
    expected: 弹出编辑弹窗，key输入框显示当前值「editTarget」，value格式、数据源类型显示当前值
  - action: |-
      在编辑弹窗中修改表单，内容如下：
      key：editTargetV2
      value格式：^\d{4}$
      数据源类型：doris3.x
      点击【确定】按钮，等待接口响应完成
    expected: |-
      弹窗关闭，列表刷新，原key editTarget 记录更新为：

      1) key显示 editTargetV2

      2) value格式显示 ^\d{4}$

      3) 数据源类型显示「doris3.x」

      4) 更新人为 admin（当前登录用户）

      5) 更新时间字段不为空，且晚于编辑操作前的时间
  precondition: |-
    1) 使用 admin 账号登录系统
    2) 已通过【新增】创建 key 为 editTarget、数据源类型为「sparkthrift2.x」的记录
  tags:
  - 数据质量
  - 通用配置-json格式校验管理
  - 编辑key
