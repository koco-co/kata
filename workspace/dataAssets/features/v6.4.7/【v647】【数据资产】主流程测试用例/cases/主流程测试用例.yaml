meta:
  title: 数据资产主流程测试用例
  version: v6.4.7
  feature_id: v6.4.7/【v647】【数据资产】主流程测试用例
cases:
- id: C001
  title: 验证已接入数据源统计数据正确
  priority: P1
  steps:
  - action: 进入资产-【资产盘点】页面
    expected: 进入成功
  - action: 查看“已接入数据源”
    expected: 显示截止前一天为止接入的数据源类型的统计卡片
  - action: 查看统计数据：昨日新增表数、源数、库数、表数以及存储量
    expected: 统计数据为对应数据源类型下前一天的统计数据
  precondition: 无
  tags:
  - 主流程v6.3
  - 资产盘点
- id: C002
  title: 验证【数据表】表数量统计正确
  priority: P1
  steps:
  - action: |-
      1. 新增元数据同步-周期同步任务
      2. 选择${DataSourceType}数据源，选择catalog||schema||database
      3. 选择数据表-table1
      4. 勾选【全部内容】
      5. 点击【临时同步】按钮
    expected: 元数据同步任务创建成功，任务状态-运行中(实例状态运行中)
  - action: 任务运行完成,实例运行成功
    expected: 【数据表】统计数量+1
  - action: 数据地图选择table1，删除元表
    expected: 【数据表】统计数量-1
  precondition: ${DataSourceType}数据源下存在表 table1
  tags:
  - 主流程v6.3
  - 元数据
  - 数据地图
  - 首页【资产类型】功能验证
- id: C003
  title: 验证【离线任务】任务数量统计正确
  priority: P1
  steps:
  - action: |-
      1. 离线平台新增SQL 建表任务
      2. 临时运行/提交
    expected: 【离线任务】任务统计数量+1
  precondition: ${DataSourceType}数据源下存在表 table1
  tags:
  - 主流程v6.3
  - 元数据
  - 数据地图
  - 首页【资产类型】功能验证
- id: C004
  title: 验证筛选条件组合查询功能正常
  priority: P1
  steps:
  - action: 选择【查询结果类型】为【数据表】
    expected: 选择成功
  - action: 选择【数据源类型】为${DATASOURCE_TYPE}
    expected: |-
      1. 筛选框展示资产平台引入的所有数据源类型
      2. 数据源类型数量统计正确
      3. 选择成功
  - action: 选择【数据源】为${DATASOURCE_NAME}
    expected: |-
      1. 展示资产平台已引入${DATASOURCE_TYPE}类型的所有数据源名称
      2. 选择成功
  - action: 选择【数据库】为${DATABASE}
    expected: |-
      1. 如果当前数据源-数据库下没有同步任何表到资产平台，则展示为空
      2. 如果当前数据源-数据库下已经同步${TABLE_NAME}到资产平台，则【数据库】选择${DATABASE}成功
  - action: 选择【负责人】为${TABLE_OWNER}
    expected: |-
      1. 如果存在表指定负责人，则【负责人】选择${TABLE_OWNER}成功
      2. 如果没有表指定负责人，则【负责人】展示为空
  - action: 选择【表标签】为${TABLE_TAG}
    expected: |-
      1. 如果存在表设置表标签，则【表标签】选择${TABLE_TAG}成功
      2. 如果没有表设置表标签，则【表标签】展示为空
  - action: 设置完所有筛选条件后，筛选
    expected: |-
      1. 过滤出所有符合组合条件的数据
      2. 没有匹配条件的数据则展示“暂无数据”缺省页
  precondition: 无
  tags:
  - 主流程v6.3
  - 元数据
  - 数据地图
  - 【数据地图】-二级页面【筛选过滤】功能验证
- id: C005
  title: 验证【表结构】-【建表语句】模块功能正常
  priority: P1
  steps:
  - action: 点击【建表语句】按钮
    expected: 建表语句显示正确
  - action: 复制建表语句，去底层执行SQL
    expected: 执行成功
  precondition: |-
    create table if not exists test_table(id int COMMENT '主键' ,name varchar(255) COMMENT '姓名',info varchar(255) COMMENT '信息');
    insert into test_table values(1,'one','desc 1');
    insert into test_table values(2,'two','desc 2');
    insert into test_table values(3,'three','desc 3');
  tags:
  - 主流程v6.3
  - 元数据
  - 数据地图
  - 【数据地图】-【数据表】详情页面功能验证
- id: C006
  title: 验证【血缘关系】功能正常
  priority: P0
  steps:
  - action: 点击表详情【血缘关系】按钮
    expected: 展示【表级血缘】【字段级血缘】【展示文字信息】【资产类型】【导航器】【表按钮】
  - action: 点击【表级血缘】按钮
    expected: 展示当前表的上下游表
  - action: ！文案校验
    expected: 每个节点都可右击查看该节点的全链路血缘，存在逆向可展开节点时建议右击查看~
  - action: 点击中央【表按钮】
    expected: 弹表详情弹窗
  - action: 表详情弹窗内容校验
    expected: 展示“表名””复制按钮”“技术属性模块”“业务属性模块“字段信息”“非分区字段”“分区字段””字段名称字段中文名搜索框“
  - action: 输入存在的字段名称，字段中文名，点击搜索
    expected: 返回匹配的字段信息
  - action: 输入不存在的字段名称，字段中文名，点击搜索
    expected: 展示“暂无数据”
  - action: 点击分页，切换pagesize
    expected: pagesize切换成功，数据展示正确，跳转正确
  - action: 点击【字段级血缘】
    expected: 展示当前表所有字段及血缘关系
  - action: 点击【字段名称】
    expected: 存在血缘字段时，弹血缘字段，没有血缘字段时，提示“字段血缘关系为空”
  - action: 点击【展示文字信息】按钮
    expected: 展示当前表全名
  - action: 点击【居中】按钮
    expected: 图居中展示
  - action: 点击【放大】按钮
    expected: 图放大
  - action: 点击【放小】按钮
    expected: 图放小
  - action: 点击【下载】按钮
    expected: 下载血缘PNG成功，查看内容正确
  - action: 点击【展示/隐藏】按钮
    expected: 展示/不展示导航器
  precondition: "1. 当前离线项目已存在血缘SQL\n\nCREATE TABLE  wwz_001 (\n    id INT COMMENT \"用户ID\",\n    name VARCHAR(50) COMMENT\
    \ \"用户姓名\"\n)\nDISTRIBUTED BY HASH(id) BUCKETS 10\nPROPERTIES (\n    \"replication_num\" = \"1\"\n);\n\nCREATE TABLE \
    \ wwz_002 (\n    id INT COMMENT \"用户ID\",\n    name VARCHAR(50) COMMENT \"用户姓名\"\n)\nDISTRIBUTED BY HASH(id) BUCKETS 10\n\
    PROPERTIES (\n    \"replication_num\" = \"1\"\n);\n\nCREATE TABLE  wwz_003 (\n    id INT COMMENT \"用户ID\",\n    name VARCHAR(50)\
    \ COMMENT \"用户姓名\"\n)\nDISTRIBUTED BY HASH(id) BUCKETS 10\nPROPERTIES (\n    \"replication_num\" = \"1\"\n);\n\n--样例一\
    \ 需先执行wwz_001、wwz_002建表\n-- insert into ... select\ninsert into wwz_001 select id,name from wwz_002;\n\n--样例二 需先执行wwz_002建表\n\
    -- create as ... select \ncreate table wwz_001 DISTRIBUTED BY HASH(id) BUCKETS 10\nPROPERTIES (\n    \"replication_num\"\
    \ = \"1\"\n) as select * from wwz_002;\n\n--样例三  需先执行wwz_001、wwz_002、wwz_003建表\n-- insert into ... select union all \n\
    insert into wwz_001 select * from wwz_002 union all  select * from wwz_003;\n\n--样例四  需先执行wwz_001、wwz_002、wwz_003建表\n\
    -- insert overwrite ... select ... union all\ninsert OVERWRITE table wwz_001 select * from wwz_002 union all  select *\
    \ from wwz_003;\n\n--样例五  需先执行wwz_001、wwz_002、wwz_003建表\n-- insert into ... select + 子查询\ninsert into wwz_001 select id,name\
    \ from wwz_002 where id in (select id from wwz_003 where id>1);\n\n--样例六  需先执行wwz_001、wwz_002建表\n-- insert into ... with\
    \ as ...\nINSERT INTO wwz_001 (id, name) WITH wwz_003 AS (SELECT id, name FROM wwz_002) SELECT id, name FROM wwz_003;\n\
    INSERT INTO wwz_001 (id, name) WITH wwz_003 AS (SELECT * FROM wwz_002) SELECT * FROM wwz_003;\n\ndrop table wwz_001;\n\
    drop table wwz_002;\ndrop table wwz_003;"
  tags:
  - 主流程v6.3
  - 元数据
  - 数据地图
  - 【数据地图】-【数据表】详情页面功能验证
- id: C007
  title: 验证元数据同步任务创建流程正常
  priority: P0
  steps:
  - action: |-
      1）点击【元数据】-【元数据同步】-【新增周期同步任务】
      2）选择数据源${DATASOURCE_TYPE}
      3）选择数据库${DATABASE}
      4）选择数据表${TABLE}
      5）依次点击【添加】_【下一步】_【新增】按钮
    expected: “新增周期同步任务”成功，任务列表展示同步任务，列信息正确，同步状态展示正常
  precondition: 无
  tags:
  - 主流程v6.3
  - 元数据
  - 元数据同步
- id: C008
  title: 验证通用业务属性-新增功能-逻辑正常
  priority: P1
  steps:
  - action: |-
      新增枚举属性：
      1）属性类型为“枚举”
      2）输入表单内容
      3）点击【确定】
    expected: 列表中显示新建的业务属性，且数据正确
  - action: |-
      新增string类型文本框属性：
      1）属性类型为“文本框”，字段类型为“string”
      2）输入表单内容
      3）点击【确定】
    expected: 列表中显示新建的业务属性，且数据正确
  - action: |-
      新增bigint类型文本框属性：
      1）属性类型为“文本框”，字段类型为“bigint”
      2）输入表单内容
      3）点击【确定】
    expected: 列表中显示新建的业务属性，且数据正确
  - action: |-
      新增树形目录属性：
      1）属性类型为“树形目录”
      2）输入表单内容
      3）点击【确定】
    expected: 列表中显示新建的业务属性，且数据正确
  - action: 进入${DATASOURCE_TYPE}数据源类型的数据表详情页，查看「业务属性」
    expected: 显示此新增的业务属性名
  precondition: 无
  tags:
  - 主流程v6.3
  - 元数据
  - 元模型管理
- id: C009
  title: 验证通用业务属性-删除功能-逻辑正常
  priority: P1
  steps:
  - action: 删除业务属性${SX}
    expected: 列表不显示业务属性${SX}
  - action: 进入${DATASOURCE_TYPE}数据源类型的数据表详情页，查看「业务属性」
    expected: 该业务属性不显示
  precondition: 无
  tags:
  - 主流程v6.3
  - 元数据
  - 元模型管理
- id: C010
  title: 验证数据表列表-数据展示正确
  priority: P0
  steps:
  - action: |-
      位置：元数据-元数据管理-${DATASOURCE _TYPE}数据源-某数据库
      查看列表
    expected: "列表展示当前数据库下数据表+视图信息正确（数据与表详情页一直即可）：\n\t\t表名、表中文名、创建时间、存储大小、更新时间"
  precondition: 无
  tags:
  - 主流程v6.3
  - 元数据
  - 元数据管理
- id: C011
  title: 验证数据库列表-生命周期应用功能正确
  priority: P1
  steps:
  - action: |-
      tableB（未同步至资产）所属数据源和所属数据库为：datasourceB、schemaB
      只配置datasourceB的生命周期为3天；schemaB未设置生命周期；
      将tableB同步至资产；
      查看tableB的生命周期
    expected: tableB的生命周期为3天
  - action: |-
      tableC（未同步至资产）所属数据源和所属数据库为：datasourceC、schemaC
      datasourceC未设置生命周期；schemaC设置生命周期为10天；
      将tableC同步至资产；
      查看tableC的生命周期
    expected: tableC的生命周期为10天
  - action: |-
      tableA（未同步至资产）所属数据源和所属数据库为：datasourceA、schemaA
      先配置datasourceA的生命周期为3天；后配置schemaA的生命周期为10天；
      将tableA同步至资产；
      查看tableA的生命周期
    expected: tableA的生命周期为10天
  precondition: 无
  tags:
  - 主流程v6.3
  - 元数据
  - 元数据管理
- id: C012
  title: 验证数据标准-新建标准
  priority: P0
  steps:
  - action: |-
      1）点击新建标准
      2）输入合格的所有业务属性值和所有技术属性值，点击【保存】|【上线】
    expected: |-
      1）页面跳转至数据标准列表页
      2）列表刷新展示新建的数据标准，且状态为“待上线”|"已上线"
  - action: |-
      1）点击新建标准
      2）输入合格的所有业务属性值和所有技术属性值，点击【取消】
    expected: 页面跳转至数据标准列表页
  precondition: 无
  tags:
  - 主流程v6.3
  - 数据标准
  - 标准管理
  - 标准定义
- id: C013
  title: 验证数据标准-查看详情
  priority: P1
  steps:
  - action: 点击标准的标准名称
    expected: |-
      1）右侧标准详情抽屉的弹出
      2）头部显示标准中文名、发布状态、创建时间、最近发布时间、最近发布用户
      3）tab页显示“标准信息”和“版本变更”
  precondition: 无
  tags:
  - 主流程v6.3
  - 数据标准
  - 标准管理
  - 标准定义
- id: C014
  title: 验证标准映射-创建标准映射功能正常
  priority: P1
  steps:
  - action: |-
      1）点击【标准映射】
      2）查看创建标准映射弹窗
    expected: ''
  - action: “数据源类型”选择${DATASOURCE_TYPE}数据源类型
    expected: “数据源”下拉项显示${DATASOURCE_TYPE}数据源类型下的数据源
  - action: “数据源”选择${DATASOURCE_TYPE}数据源类型下的数据源
    expected: “数据库”下拉项显示所选数据源下所有已同步的数据库
  - action: |-
      1）选择数据库
      2）点击【添加】
      3）点击【确定】
    expected: 创建标准映射成功
  precondition: |-
    准备表：
    create table active_users (
        user_id bigint NOT NULL COMMENT '用户ID',
        name string NOT NULL COMMENT '用户姓名',
        email string NULL COMMENT '邮箱地址',
        address string NULL COMMENT '住址（邮寄地址）',
        age tinyint NULL COMMENT '用户年龄',
        sex tinyint NULL COMMENT '用户性别（男/女）',
        last_active datetime COMMENT '最近活跃时间 最近登陆时间',
        property0 tinyint NOT NULL,
        property1 tinyint NOT NULL,
        property2 tinyint NOT NULL,
        property3 tinyint NOT NULL
    )
    DISTRIBUTED BY HASH(`user_id`)
    PROPERTIES(
        "replication_num" = "1"
    );


    准备数据标准：
    email（邮箱地址）
  tags:
  - 主流程v6.3
  - 数据标准
  - 标准管理
  - 标准映射
