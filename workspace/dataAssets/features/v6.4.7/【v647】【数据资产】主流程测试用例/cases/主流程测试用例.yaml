- id: C019
  title: 验证数据库拾取-拾取流程
  priority: P1
  steps:
  - action: 点击数据库拾取页面的新建拾取icon
    expected: 弹出新建拾取弹窗
  - action: 点击拾取来源下拉框
    expected: 新增数据源类型下拉项
  - action: |-
