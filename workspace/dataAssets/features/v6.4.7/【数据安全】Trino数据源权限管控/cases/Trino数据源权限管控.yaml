meta:
  title: Trino数据源权限管控
  feature_id: security-trino-data-source-permissions
  project_id: data-assets
  requirement_id: "none"
  case_module_id: ""
  exports:
    - Trino数据源权限管控.xmind
cases:
  - case_id: C0001
    title: 验证【数据安全】-【权限回收】回收已分配的数据源权限，访客用户无法预览与查询表数据
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0001 VALUES (1, 'A'), (2, 'B');
      5) 【权限分配】列表已存在 ${DataSourceA} 的权限行：数据源 ${DataSourceA}、数据库 ${SchemaA}、数据表 test_table_none_c0001、表权限 DQL
      6) 存在访客用户「${UserA}」
    steps:
      - action: 进入【数据安全 → 权限回收】页面
        expected: 进入成功
      - action: 选中 ${DataSourceA} 权限行，点击【权限回收】按钮
        expected: Toast 提示「权限回收成功」，该权限行状态置灰
      - action: 切换用户「${UserA}」，打开【元数据 → 数据地图】查看数据表 test_table_none_c0001 的数据预览
        expected: 不支持查看
      - action: 打开【离线开发】，查询 ${SchemaA}.test_table_none_c0001
        expected: 不支持查询
    tags:
      - 数据安全
      - 权限回收
  - case_id: C0002
    title: 验证【数据安全】-【权限分配】删除已分配的权限行，二次确认后权限行删除成功
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0002 VALUES (1, 'A'), (2, 'B');
      5) 【权限分配】列表已存在 ${DataSourceA} 的权限行：数据源 ${DataSourceA}、数据库 ${SchemaA}、数据表 test_table_none_c0002、表权限 DQL
    steps:
      - action: 进入【数据安全 → 权限分配】页面
        expected: 进入成功
      - action: 选中 ${DataSourceA} 权限行，点击【删除】按钮
        expected: 弹出二次确认弹窗
      - action: 点击【确定】
        expected: Toast 提示「删除成功」，该权限行不再展示
    tags:
      - 数据安全
      - 权限分配
  - case_id: C0003
    title: 验证【数据安全】-【权限分配】编辑权限策略修改数据表，访客用户可预览与查询新数据表
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建 2 张数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003_source (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0003_source VALUES (1, 'A'), (2, 'B');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003_target_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0003_target_01 VALUES (1, 'C'), (2, 'D');
      5) 【权限分配】列表已存在 ${DataSourceA} 的权限行：数据源 ${DataSourceA}、数据库 ${SchemaA}、数据表 test_table_none_c0003_source、表权限 DQL
      6) 存在访客用户「${UserB}」
    steps:
      - action: 进入【数据安全 → 权限分配】页面
        expected: 进入成功
      - action: 选中 ${DataSourceA} 权限行，点击【编辑】按钮
        expected: 进入【编辑权限策略】页面，数据回显与权限行一致
      - action: 数据表修改为 test_table_none_c0003_target_01，点击【保存】
        expected: Toast 提示「编辑成功」，权限行数据表更新为 test_table_none_c0003_target_01
      - action: 切换用户「${UserB}」，打开【元数据 → 数据地图】查看数据表 test_table_none_c0003_target_01 的数据预览
        expected: 支持查看
      - action: 打开【离线开发】，查询 ${SchemaA}.test_table_none_c0003_target_01
        expected: 支持查询
    tags:
      - 数据安全
      - 权限分配
  - case_id: C0004
    title: 验证【数据安全】-【我的权限查看】查看页面，展示查询配置区域与数据权限列表
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0004 VALUES (1, 'A'), (2, 'B');
      5) ${DataSourceA} 内存在 catalog：catalog1、catalog2，数据库 ${SchemaA} 位于 catalog1 下
      6) 平台已存在身份为「数据开发」的用户「${UserC}」
    steps:
      - action: 进入【数据安全 → 我的权限查看】页面
        expected: 进入成功
      - action: 切换用户「${UserC}」，进入【数据安全 → 我的权限查看】页面
        expected: 页面加载完成
      - action: 查看页面
        expected: |-
          1） 查询配置区域：数据表输入框、数据源类型下拉框、数据源下拉框、数据库下拉框、负责人、表权限下拉框、【重置】与【查询】按钮
          2） 数据权限列表：表名、表中文名、所属数据源、catalog、所属数据库、表负责人、表权限、列级权限、行级权限
    tags:
      - 数据安全
      - 我的权限查看
  - case_id: C0005
    title: 验证【数据安全】-【权限申请】申请表级 DQL 权限并配置行列级，数据预览与查询仅展示所选字段
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005 (id BIGINT, field1 STRING, field2 STRING, field3 STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0005 VALUES (1, 'A1', 'B1', 'C1'), (2, 'A2', 'B2', 'C2');
      5) ${DataSourceA} 内存在 catalog：catalog1、catalog2，数据库 ${SchemaA} 位于 catalog1 下
      6) 平台已存在身份为「数据开发」的用户「${UserC}」
    steps:
      - action: 进入【数据安全 → 权限申请】页面
        expected: 进入成功
      - action: 切换用户「${UserC}」，进入【元数据 → 数据地图】页面
        expected: 页面加载完成
      - action: 选择数据表 ${SchemaA}.test_table_none_c0005，点击【批量申请权限】
        expected: 抽屉式展开表权限申请页
      - action: 鼠标悬浮【表级权限】处的“？”
        expected: 提示「hive、sparkthrift、starrocks、doris、trino、inceptor 类型数据源配置权限信息后可在离线开发平台生效，其他类型数据源配置权限信息后仅在资产平台生效」
      - action: 查看【权限】区域
        expected: 展示 DQL、DML、DDL，仅支持勾选 DQL
      - action: 【权限】勾选 DQL，【行列权限配置】开启行列级，【行列权限】配置为 test_table_none_c0005 的 field1 与 field2 字段，【有效期】保持默认永久，【申请原因】输入「权限申请测试」，点击【确定】
        expected: Toast 提示「申请成功」
      - action: 打开【元数据 → 数据地图】查看数据表 test_table_none_c0005 的数据预览
        expected: 1） 支持查看数据表字段；2） 仅展示 field1 与 field2 字段的数据
      - action: 打开【数据质量】，新建规则任务，选择 ${DataSourceA}-catalog1-${SchemaA}-test_table_none_c0005，查看数据预览
        expected: 1） 支持数据预览；2） 仅展示 field1 与 field2 字段的数据
      - action: 切换至【离线开发】，查询 ${SchemaA}.test_table_none_c0005
        expected: 支持查询，行列级权限生效，仅返回 field1 与 field2 字段
    tags:
      - 数据安全
      - 权限申请
  - case_id: C0006
    title: 验证【数据安全】-【审批详情】查看已审批的表权限申请详情，抽屉展示完整申请信息
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0006 VALUES (1, 'A'), (2, 'B');
      5) 已存在 ${DataSourceA} 数据源表权限申请的已审批记录，申请数据表为 test_table_none_c0006
    steps:
      - action: 进入【数据安全 → 审批详情】页面
        expected: 进入成功
      - action: 切换账号为管理员，进入【公共管理 → 审批中心】页面
        expected: 页面加载完成
      - action: 点击【我已审批】页签下的「元数据资产」
        expected: 列表展示已审批的 ${DataSourceA} 数据源表权限申请
      - action: 点击【审批详情】按钮
        expected: 抽屉展开表权限申请详情
      - action: 查看详情
        expected: 展示所属租户、申请时间、表名称、表类型、数据源、catalog、数据库、有效期、权限详情、审批流程
    tags:
      - 数据安全
      - 审批详情
  - case_id: C0007
    title: 验证【数据安全】-【审批】通过待审批的表权限申请，申请状态变更为已通过
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0007 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0007 VALUES (1, 'A'), (2, 'B');
      5) 已发起 ${DataSourceA} 数据源的表权限申请，申请数据表为 test_table_none_c0007，状态为「待审批」
    steps:
      - action: 进入【数据安全 → 审批】页面
        expected: 进入成功
      - action: 切换账号为管理员，进入【公共管理 → 审批中心】页面
        expected: 页面加载完成
      - action: 点击【待我审批】页签下的「元数据资产」
        expected: 列表展示 ${DataSourceA} 数据源的表权限申请
      - action: 点击【审批】按钮
        expected: 抽屉展开表权限申请详情，展示所属租户、申请时间、表名称、表类型、数据源、catalog、数据库、有效期、权限详情、审批流程以及【拒绝】与【通过】按钮
      - action: 点击【通过】按钮
        expected: 该表权限申请状态变更为「已通过」
    tags:
      - 数据安全
      - 审批
  - case_id: C0008
    title: 验证【数据安全】-【权限回收】查看页面，展示查询配置区域与数据权限列表
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0008 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0008 VALUES (1, 'A'), (2, 'B');
      5) 权限分配列表已存在 ${DataSourceA} 的权限行（数据表 test_table_none_c0008，状态为已回收）
    steps:
      - action: 进入【数据安全 → 权限回收】页面
        expected: 进入成功
      - action: 点击【权限回收】页签
        expected: 权限回收页签正常打开
      - action: 查看页面
        expected: |-
          1） 查询配置区域：数据源下拉框、数据库下拉框、数据表输入框、表权限下拉框、申请人输入框、【重置】与【查询】按钮
          2） 数据权限列表：申请人、数据源、catalog、数据库、数据表、表权限、有效期、状态、审批时间、操作
          3） catalog 无内容时显示为「--」，操作为「权限回收」，已回收内容置灰显示
    tags:
      - 数据安全
      - 权限回收
  - case_id: C0009
    title: 验证【数据安全】-【新增权限策略】新增表级 DQL 权限，访客用户可预览与查询数据表
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0009;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0009 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0009 VALUES (1, 'A'), (2, 'B');
      5) ${DataSourceA} 内存在 catalog：catalog1、catalog2，数据库 ${SchemaA} 位于 catalog1 下
      6) 平台已存在身份为「访客」的用户「${UserB}」
    steps:
      - action: 进入【数据安全 → 新增权限策略】页面
        expected: 进入成功
      - action: 选择【数据源】为 ${DataSourceA}，【catalog】为 catalog1，【数据库】为 ${SchemaA}，【数据表】为 test_table_none_c0009
        expected: 选择成功
      - action: 选择【DQL】
        expected: 下方展示【有效期】与【是否开启行列权限配置】
      - action: 【有效期】保持默认永久，【是否开启行列权限配置】保持默认不开启，选择【用户】为「${UserB}」，点击【新增】按钮
        expected: Toast 提示「新增成功」，自动切回【权限分配】页面
      - action: 查看【权限分配】页面列表
        expected: 新增数据源为 ${DataSourceA} 的权限行，数据源、catalog、数据库、数据表与步骤输入值一致
      - action: 切换用户「${UserB}」，打开【元数据 → 数据地图】查看数据表 test_table_none_c0009 的数据预览
        expected: 支持查看该表数据
      - action: 切换用户「${UserB}」，打开【数据质量】，新建规则任务，选择 ${DataSourceA}-catalog1-${SchemaA}-test_table_none_c0009，查看数据预览
        expected: 支持数据预览
      - action: 切换用户「${UserB}」，打开【离线开发】，查询 ${SchemaA}.test_table_none_c0009
        expected: 支持查询
    tags:
      - 数据安全
      - 新增权限策略
  - case_id: C0010
    title: 验证【数据安全】-【新增权限策略】查看表级权限下拉框，仅 DQL 可选
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0010 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0010 VALUES (1, 'A'), (2, 'B');
      5) ${DataSourceA} 内存在 catalog：catalog1、catalog2，数据库 ${SchemaA} 位于 catalog1 下
    steps:
      - action: 进入【数据安全 → 新增权限策略】页面
        expected: 进入成功
      - action: 选择【数据源】为 ${DataSourceA}，【catalog】为 catalog1，【数据库】为 ${SchemaA}，【数据表】为 test_table_none_c0010
        expected: 选择成功
      - action: 鼠标悬浮【表级权限】处的“？”
        expected: 提示「hive、sparkthrift、starrocks、doris、trino、inceptor 类型数据源配置权限信息后可在离线开发平台生效，其他类型数据源配置权限信息后仅在资产平台生效」
      - action: 查看【表级权限】下拉框
        expected: 包含【DML】、【DQL】、【DDL】，仅【DQL】可选，其余两项置灰不可选
    tags:
      - 数据安全
      - 新增权限策略
  - case_id: C0011
    title: 验证【数据安全】-【新增权限策略】选择数据源后展示 catalog 配置，catalog 下拉仅支持单选
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) ${DataSourceA} 内存在 catalog：catalog1、catalog2
    steps:
      - action: 进入【数据安全 → 新增权限策略】页面
        expected: 进入成功
      - action: 点击【新增】按钮
        expected: 进入【数据权限分配-新增权限策略】页面
      - action: 点击【数据源】下拉框
        expected: 下拉项包含 ${DataSourceA}
      - action: 选择 ${DataSourceA}
        expected: 右侧展示【catalog】配置下拉框
      - action: 点击【catalog】下拉框
        expected: 展示 ${DataSourceA} 内的 catalog1、catalog2
      - action: 多选 catalog 下拉项
        expected: 仅支持单选
    tags:
      - 数据安全
      - 新增权限策略
