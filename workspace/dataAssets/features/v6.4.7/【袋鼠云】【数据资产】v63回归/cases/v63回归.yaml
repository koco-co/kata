meta:
  title: v63回归
  requirement_id: "none"
  case_module_id: ""
  exports:
    - v63回归.xmind
cases:
  - case_id: C0001
    automation:
      spec_file: c0001-rule-set-independent-run.spec.ts
    title: 验证【数据资产】-【规则集创建与运行】创建规则集并导入 4 条明细 SQL 规则，立即执行后生成任务查询记录
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001 (id BIGINT, user_code STRING, user_name STRING, nick_name STRING, score DECIMAL(10,2), user_type STRING, status STRING, age INT, gender INT, remark STRING, id_card_no STRING, mobile_no STRING, email STRING, salary DECIMAL(12,2));
         INSERT INTO ${SchemaA}.test_table_none_c0001 VALUES (1, 'U001', '张三', 'nick_a', 90.50, 'VIP', 'A', 25, 1, '备注1', '330102199001011234', '13800000001', 'a@test.com', 10000.00), (2, NULL, '李四', 'nick_a', -5.00, 'NORMAL', 'I', 30, 0, NULL, '330102199002021235', '13800000002', 'b@test.com', 20000.00), (3, 'U003', '', 'nick_c', 60.00, 'GUEST', 'D', 17, 1, '备注3', NULL, '13800000003', 'c@test.com', 30000.00), (4, 'U004', '王五', 'nick_d', 80.00, 'NORMAL', 'A', 22, 0, NULL, '330102199003031236', NULL, NULL, 40000.00), (5, 'U005', '', 'nick_e', 70.00, 'VIP', 'A', 28, 1, '备注5', '330102199004041237', '13800000005', 'e@test.com', NULL);
      5) 已配置规则集导入文件「v63规则集导入模板.xlsx」，内容如下：
         Sheet: 规则内容
         Title: 规则名称,规则描述,表名,字段名,校验SQL
         Line1: v63_user_code_null,user_code 为空,test_table_none_c0001,user_code,SELECT id FROM ${SchemaA}.test_table_none_c0001 WHERE user_code IS NULL
         另 3 条规则分别为 user_name 为空串、nick_name 重复、score 负值的明细查询 SQL
    steps:
      - action: 进入【数据资产 → 规则集创建与运行】页面
        expected: 进入成功
      - action: 进入【数据质量 → 规则任务配置】页面，等待任务列表和规则集区域加载完成
        expected: 页面 URL 为 `#/dq/rule`，页面展示【新建监控规则】入口，规则集区域展示【新建规则集】入口
      - action: |-
          在规则集区域点击【新建规则集】，配置基础信息如下：
          * 规则集名称：${RuleSetA}
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_none_c0001
          规则集描述：${RuleSetA} 回归验证
          等待规则集配置页加载完成
        expected: 进入【新建规则集】页面，步骤条展示【基础信息】【规则内容】【调度配置】
      - action: 在【基础信息】中输入规则集名称「${RuleSetA}」，等待名称唯一性校验完成
        expected: 规则集名称输入框无重复名称报错
      - action: 选择校验数据源为 ${DataSourceA}
        expected: 选择数据库下拉框开始加载
      - action: 选择数据库 ${SchemaA}，输入规则集描述「${RuleSetA} 回归验证」
        expected: 基础信息展示校验数据源、数据库、规则集描述
      - action: 点击【下一步】，等待【规则内容】页面加载完成
        expected: 页面展示【导入规则】按钮和规则内容表格，表格列包含规则名称、规则描述、表名、字段名、校验 SQL、操作
      - action: 点击【导入规则】，上传「v63规则集导入模板.xlsx」，点击导入弹窗【确定】，等待上传处理完成
        expected: 提示文件上传成功，规则内容表格展示 4 条导入规则
      - action: 查看规则内容表格中的规则名称
        expected: 规则名称展示 v63_user_code_null、v63_user_name_empty、v63_nick_name_duplicate、v63_score_negative
      - action: 查看规则内容表格中的表名和字段名
        expected: 表名均为 test_table_none_c0001，字段名包含 user_code、user_name、nick_name、score
      - action: 查看规则内容表格中的校验 SQL
        expected: |-
          4 条规则的校验 SQL 均非空，明细如下：
          `SELECT id FROM ${SchemaA}.test_table_none_c0001 WHERE user_code IS NULL`，查询结果：{user_code_null_cnt} 条
          `SELECT id FROM ${SchemaA}.test_table_none_c0001 WHERE user_name = ''`，查询结果：{user_name_empty_cnt} 条
          `SELECT id FROM ${SchemaA}.test_table_none_c0001 WHERE score < 0`，查询结果：{score_negative_cnt} 条
          `SELECT nick_name FROM ${SchemaA}.test_table_none_c0001 GROUP BY nick_name HAVING COUNT(*) > 1`，查询结果：{nick_name_dup_cnt} 条
      - action: |-
          点击【下一步】，等待【调度配置】页面加载完成，配置如下：
          * 调度周期：手动触发
          规则拼接包：1
          资源组：默认资源组
          超时时间：不限制
          无需生成报告：勾选
        expected: 页面展示调度配置、规则拼接包、资源组、高级配置、告警配置、实例生成方式
      - action: 设置实例生成方式为【立即生成】，规则拼接包保持默认 1，点击【完成】，等待返回规则任务配置页面
        expected: 提示规则集创建完成，规则集列表或卡片展示「${RuleSetA}」
      - action: 在「${RuleSetA}」卡片点击【立即执行】，等待提交完成
        expected: 页面提示稍后可在任务查询中查看详情，规则集卡片仍展示为可执行状态
      - action: 进入【数据质量 → 任务实例查询】页面，按规则集名称「${RuleSetA}」搜索并等待列表刷新完成
        expected: 列表生成该规则集的执行记录，实例状态为「通过」或「校验异常」，与各规则明细查询结果一致
    tags:
      - 数据资产
      - 规则集创建与运行
      - 规则集管理
  - case_id: C0002
    automation:
      spec_file: c0002-rule-set-edit-delete-prompt.spec.ts
    title: 验证【数据资产】-【规则集变更与删除】编辑规则内容并删除规则集，编辑保存生效且删除前提示清除历史任务
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002 (id BIGINT, user_code STRING, user_name STRING, nick_name STRING, score DECIMAL(10,2), user_type STRING, status STRING, age INT, gender INT, remark STRING, id_card_no STRING, mobile_no STRING, email STRING, salary DECIMAL(12,2));
         INSERT INTO ${SchemaA}.test_table_none_c0002 VALUES (1, 'U001', '张三', 'nick_a', 90.50, 'VIP', 'A', 25, 1, '备注1', '330102199001011234', '13800000001', 'a@test.com', 10000.00), (2, NULL, '李四', 'nick_a', -5.00, 'NORMAL', 'I', 30, 0, NULL, '330102199002021235', '13800000002', 'b@test.com', 20000.00), (3, 'U003', '', 'nick_c', 60.00, 'GUEST', 'D', 17, 1, '备注3', NULL, '13800000003', 'c@test.com', 30000.00), (4, 'U004', '王五', 'nick_d', 80.00, 'NORMAL', 'A', 22, 0, NULL, '330102199003031236', NULL, NULL, 40000.00), (5, 'U005', '', 'nick_e', 70.00, 'VIP', 'A', 28, 1, '备注5', '330102199004041237', '13800000005', 'e@test.com', NULL);
      5) 已创建规则集「${RuleSetA}」，包含 4 条导入规则
      6) 已配置规则集更新文件「v63规则集导入模板-更新.xlsx」，内容如下：
         Sheet: 规则内容
         Title: 规则名称,规则描述,表名,字段名,校验SQL
         Line1: v63_user_code_null,user_code 为空,test_table_none_c0002,user_code,SELECT id FROM ${SchemaA}.test_table_none_c0002 WHERE user_code IS NULL
         共 5 条规则，在原 4 条规则基础上新增 1 条测试规则
    steps:
      - action: 进入【数据资产 → 规则集变更与删除】页面
        expected: 进入成功
      - action: 进入【数据质量 → 规则任务配置】页面，等待规则集区域加载完成
        expected: 规则集区域展示「${RuleSetA}」
      - action: 点击「${RuleSetA}」卡片【编辑】，等待编辑规则集页面加载完成
        expected: 进入【编辑规则集】页面，步骤条展示基础信息、规则内容、调度配置
      - action: 在【基础信息】修改规则集描述为「${RuleSetA} 回归-已编辑」，点击【下一步】，等待【规则内容】页面加载完成
        expected: 规则内容表格展示该规则集已有导入规则
      - action: 在【规则内容】点击【导入规则】，上传「v63规则集导入模板-更新.xlsx」，点击【确定】，等待上传完成
        expected: 规则内容表格刷新为 5 条规则
      - action: 删除规则内容表格中 1 条测试规则，点击删除确认弹窗【确定】，等待表格刷新完成
        expected: 表格剩余 4 条规则，被删除规则不再展示
      - action: |-
          进入【调度配置】，配置如下：
          * 调度周期：手动触发
          规则拼接包：1
          资源组：默认资源组
          超时时间：不限制
          无需生成报告：勾选
          点击【完成】，等待返回规则任务配置页面
        expected: 提示规则集编辑完成
      - action: 展开或查看「${RuleSetA}」详情
        expected: 基础信息中的规则集描述展示为「${RuleSetA} 回归-已编辑」，规则内容数量为 4
      - action: 点击「${RuleSetA}」卡片【删除】
        expected: 弹出确认提示，提示删除规则集会同步清除历史任务
      - action: 点击【取消】关闭确认弹窗，等确认弹窗关闭
        expected: 规则集未删除，仍展示在规则集区域
    tags:
      - 数据资产
      - 规则集变更与删除
      - 规则集管理
  - case_id: C0003
    automation:
      spec_file: c0003-field-integrity-rule-result.spec.ts
    title: 验证【数据资产】-【完整性校验】添加单字段与多字段完整性规则并执行，实际值与统计 SQL 预期值一致
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (id BIGINT, user_code STRING, user_name STRING, nick_name STRING, score DECIMAL(10,2), user_type STRING, status STRING, age INT, gender INT, remark STRING, id_card_no STRING, mobile_no STRING, email STRING, salary DECIMAL(12,2));
         INSERT INTO ${SchemaA}.test_table_none_c0003 VALUES (1, 'U001', '张三', 'nick_a', 90.50, 'VIP', 'A', 25, 1, '备注1', '330102199001011234', '13800000001', 'a@test.com', 10000.00), (2, NULL, '李四', 'nick_a', -5.00, 'NORMAL', 'I', 30, 0, NULL, '330102199002021235', '13800000002', 'b@test.com', 20000.00), (3, 'U003', '', 'nick_c', 60.00, 'GUEST', 'D', 17, 1, '备注3', NULL, '13800000003', 'c@test.com', 30000.00), (4, 'U004', '王五', 'nick_d', 80.00, 'NORMAL', 'A', 22, 0, NULL, '330102199003031236', NULL, NULL, 40000.00), (5, 'U005', '', 'nick_e', 70.00, 'VIP', 'A', 28, 1, '备注5', '330102199004041237', '13800000005', 'e@test.com', NULL);
      5) 已执行基础统计 SQL 获取单字段空值/空串预期值，以及多字段 `and`、`or` 逻辑预期值：{user_code_null_cnt}、{user_code_null_rate}、{user_name_empty_cnt}、{user_name_empty_rate}、{user_code_remark_null_and_cnt}、{user_code_remark_null_and_rate}、{user_code_remark_null_or_cnt}、{user_code_remark_null_or_rate}、{user_name_remark_empty_and_cnt}、{user_name_remark_empty_and_rate}、{user_name_remark_empty_or_cnt}、{user_name_remark_empty_or_rate}
      6) 规则库配置中的完整性校验处于开启状态
    steps:
      - action: 进入【数据资产 → 完整性校验】页面
        expected: 进入成功
      - action: 进入【数据质量 → 规则任务配置】页面，等待任务列表加载完成
        expected: 页面展示【新建监控规则】按钮，列表列包含表、规则名称、类型、数据源、执行周期、规则状态
      - action: 点击【新建监控规则】，等待【新建单表校验规则】页面加载完成
        expected: 步骤条展示【监控对象】【监控规则】【调度属性】
      - action: 在【监控对象】「规则名称」输入「${TaskA}」
        expected: 规则名称输入框展示「${TaskA}」
      - action: 选择 ${DataSourceA}
        expected: 数据库下拉框加载完成
      - action: 选择数据库 ${SchemaA}
        expected: 数据表下拉框加载完成
      - action: 选择数据表 ${SchemaA}.test_table_none_c0003
        expected: 表单展示所选数据库和数据表，数据预览区域可查看表字段
      - action: 点击【下一步】，等待【监控规则】页面加载完成
        expected: 页面展示【添加规则】按钮和监控规则区域
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 表单展示规则类型、字段、统计函数、校验方法、期望值、强弱规则配置项
      - action: 选择规则类型【完整性校验】，规则类型选择【字段级】，字段选择 user_code
        expected: 规则编辑表单展示字段 user_code 和统计规则配置区域
      - action: 在统计规则中选择【空值数】，校验方法选择固定值，操作符选择等于，期望值输入 {user_code_null_cnt}，强弱规则选择强规则，点击规则行【保存】，等待规则卡片保存完成
        expected: 规则卡片展示完整性校验、字段 user_code、空值数、期望值等于 {user_code_null_cnt}
      - action: 再次点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段选择 user_code，统计规则选择【空值率】，校验方法选择占比，操作符选择等于，期望值输入 {user_code_null_rate}，点击规则行【保存】，等待规则列表刷新完成
        expected: 规则列表新增 user_code 空值率规则，期望值等于 {user_code_null_rate}
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段选择 user_name，统计规则选择【空串数】，期望值等于 {user_name_empty_cnt}，点击规则行【保存】，等待规则列表刷新完成
        expected: 规则列表新增 user_name 空串数规则，期望值等于 {user_name_empty_cnt}
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段选择 user_name，统计规则选择【空串率】，校验方法选择占比，期望值输入 {user_name_empty_rate}，点击规则行【保存】，等待规则列表刷新完成
        expected: 规则列表新增 user_name 空串率规则，期望值等于 {user_name_empty_rate}
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段同时选择 user_code 和 remark，字段间规则逻辑选择 and
        expected: 字段选择框展示 user_code、remark 两个字段，字段间规则逻辑展示 and
      - action: 统计函数选择【空值数】，校验方法选择固定值，操作符选择等于，期望值输入 {user_code_remark_null_and_cnt}，点击【保存】，等待规则列表刷新完成
        expected: 多字段 and 空值数规则保存成功，规则卡片展示 user_code + remark、and、空值数、期望值等于 {user_code_remark_null_and_cnt}
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段同时选择 user_code 和 remark，字段间规则逻辑选择 and
        expected: 字段选择框展示 user_code、remark 两个字段，字段间规则逻辑展示 and
      - action: 统计函数选择【空值率】，校验方法选择占比，操作符选择等于，期望值输入 {user_code_remark_null_and_rate}，点击【保存】，等待规则列表刷新完成
        expected: 多字段 and 空值率规则保存成功，规则卡片展示 user_code + remark、and、空值率、期望值等于 {user_code_remark_null_and_rate}
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段同时选择 user_code 和 remark，字段间规则逻辑选择 or
        expected: 字段选择框展示 user_code、remark 两个字段，字段间规则逻辑展示 or
      - action: 统计函数选择【空值数】，校验方法选择固定值，操作符选择等于，期望值输入 {user_code_remark_null_or_cnt}，点击【保存】，等待规则列表刷新完成
        expected: 多字段 or 空值数规则保存成功，规则卡片展示 user_code + remark、or、空值数、期望值等于 {user_code_remark_null_or_cnt}
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段同时选择 user_code 和 remark，字段间规则逻辑选择 or
