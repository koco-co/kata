  - id: C004
    automation:
      spec_file: t04-quality-report-project-menu-contract.ts
    title: 验证完整性表级表行数规则直接添加后结果正确
    priority: P1
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面，等待任务列表加载完成
        expected: 页面展示【新建监控规则】按钮
      - action: 点击【新建监控规则】，等待【监控对象】页面加载完成
        expected: 步骤条停留在监控对象
      - action: 输入规则名称“v63表行数任务”，选择 SparkThrift 数据源
        expected: 数据库下拉框加载完成
      - action: 选择数据库 pw_test
        expected: 数据表下拉框加载完成
      - action: 选择数据表 dq_test_user_info_300
        expected: 表单展示所选表 dq_test_user_info_300
      - action: 点击【下一步】，等待【监控规则】页面加载完成
