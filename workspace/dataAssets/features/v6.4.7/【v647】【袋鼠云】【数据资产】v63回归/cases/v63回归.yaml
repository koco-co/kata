meta:
  title: v63回归
  version: v6.4.7
  feature_id: v6.4.7/【v647】【袋鼠云】【数据资产】v63回归
cases:
  - id: C001
    automation:
      spec_file: t01-environment-preflight.ts
    title: 验证规则集创建后可独立运行并生成任务查询记录
    priority: P0
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面，等待任务列表和规则集区域加载完成
        expected: 页面 URL 为 `#/dq/rule`，页面展示【新建监控规则】入口，规则集区域展示【新建规则集】入口
      - action: 在规则集区域点击【新建规则集】，等待规则集配置页加载完成
        expected: 进入【新建规则集】页面，步骤条展示【基础信息】【规则内容】【调度配置】
      - action: 在【基础信息】中输入规则集名称“v63标品规则集”，等待名称唯一性校验完成
        expected: 规则集名称输入框无重复名称报错
      - action: 选择校验数据源为 SparkThrift 数据源
        expected: 选择数据库下拉框开始加载
      - action: 选择数据库 pw_test，输入规则集描述“v63标品规则集回归”
        expected: 基础信息展示校验数据源、数据库、规则集描述
      - action: 点击【下一步】，等待【规则内容】页面加载完成
        expected: 页面展示【导入规则】按钮和规则内容表格，表格列包含规则名称、规则描述、表名、字段名、校验 SQL、操作
      - action: 点击【导入规则】，上传“v63规则集导入模板.xlsx”，点击导入弹窗【确定】，等待上传处理完成
        expected: 提示文件上传成功，规则内容表格展示 4 条导入规则
      - action: 查看规则内容表格中的规则名称
        expected: 规则名称展示 v63_user_code_null、v63_user_name_empty、v63_nick_name_duplicate、v63_score_negative
      - action: 查看规则内容表格中的表名和字段名
        expected: 表名均为 dq_test_user_info_300，字段名包含 user_code、user_name、nick_name、score
      - action: 查看规则内容表格中的校验 SQL
        expected: 4 条规则的校验 SQL 均非空，且与“v63规则集导入模板.xlsx”中的明细查询 SQL 一致
      - action: 点击【下一步】，等待【调度配置】页面加载完成
        expected: 页面展示调度配置、规则拼接包、资源组、高级配置、告警配置、实例生成方式
      - action: 设置实例生成方式为【立即生成】，规则拼接包保持默认 1，点击【完成】，等待返回规则任务配置页面
        expected: 提示规则集创建完成，规则集列表或卡片展示“v63标品规则集”
      - action: 在“v63标品规则集”卡片点击【立即执行】，等待提交完成
        expected: 页面提示稍后可在任务查询中查看详情，规则集卡片仍展示为可执行状态
      - action: 进入【数据质量 → 任务实例查询】页面，按规则集名称“v63标品规则集”搜索并等待列表刷新完成
        expected: 列表生成该规则集的执行记录，状态展示为校验通过或校验异常，状态与导入规则阈值一致
    precondition: |-
      已准备规则集导入文件“v63规则集导入模板.xlsx”。
      文件表头与后端模板完全一致，包含 user_code 为空、user_name 为空串、nick_name 重复、score 负值 4 条明细 SQL 规则。
    tags:
      - Part1 规则集与单表完整性/唯一性/自定义规则
      - 规则集管理
      - 规则集创建与运行
  - id: C002
    automation:
      spec_file: t02-rule-task-entry-contract.ts
    title: 验证规则集编辑规则内容和删除提示符合标品逻辑
    priority: P2
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面，等待规则集区域加载完成
        expected: 规则集区域展示“v63标品规则集”
      - action: 点击“v63标品规则集”卡片【编辑】，等待编辑规则集页面加载完成
        expected: 进入【编辑规则集】页面，步骤条展示基础信息、规则内容、调度配置
      - action: 在【基础信息】修改规则集描述为“v63标品规则集回归-已编辑”，点击【下一步】，等待【规则内容】页面加载完成
        expected: 规则内容表格展示该规则集已有导入规则
      - action: 在【规则内容】点击【导入规则】，上传“v63规则集导入模板-更新.xlsx”，点击【确定】，等待上传完成
        expected: 规则内容表格刷新为 5 条规则
      - action: 删除规则内容表格中 1 条测试规则，点击删除确认弹窗【确定】，等待表格刷新完成
        expected: 表格剩余 4 条规则，被删除规则不再展示
      - action: 进入【调度配置】点击【完成】，等待返回规则任务配置页面
        expected: 提示规则集编辑完成
      - action: 展开或查看“v63标品规则集”详情
        expected: 基础信息中的规则集描述展示为“v63标品规则集回归-已编辑”，规则内容数量为 4
      - action: 点击测试规则集卡片【删除】
        expected: 弹出确认提示，提示删除规则集会同步清除历史任务
      - action: 点击【取消】关闭确认弹窗，等待确认弹窗关闭
        expected: 规则集未删除，仍展示在规则集区域
    precondition: |-
      已创建规则集“v63标品规则集”。
      已准备包含 5 条规则的更新文件“v63规则集导入模板-更新.xlsx”。
    tags:
      - Part1 规则集与单表完整性/唯一性/自定义规则
      - 规则集管理
      - 规则集变更与删除
  - id: C003
