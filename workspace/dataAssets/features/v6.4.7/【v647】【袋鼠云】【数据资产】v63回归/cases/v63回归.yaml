      - action: 点击【下一步】，等待【监控规则】页面加载完成
        expected: 页面展示【添加规则】按钮和监控规则区域
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 表单展示规则类型、字段、统计函数、校验方法、期望值、强弱规则配置项
      - action: 选择规则类型【完整性校验】，规则类型选择【字段级】，字段选择 user_code
        expected: 规则编辑表单展示字段 user_code 和统计规则配置区域
      - action: 在统计规则中选择【空值数】，校验方法选择固定值，操作符选择等于，期望值输入 `{user_code_null_cnt}`，强弱规则选择强规则，点击规则行【保存】，等待规则卡片保存完成
        expected: 规则卡片展示完整性校验、字段 user_code、空值数、期望值等于 `{user_code_null_cnt}`
      - action: 再次点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段选择 user_code，统计规则选择【空值率】，校验方法选择占比，操作符选择等于，期望值输入 `{user_code_null_rate}`，点击规则行【保存】，等待规则列表刷新完成
        expected: 规则列表新增 user_code 空值率规则，期望值等于 `{user_code_null_rate}`
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段选择 user_name，统计规则选择【空串数】，期望值等于 `{user_name_empty_cnt}`，点击规则行【保存】，等待规则列表刷新完成
        expected: 规则列表新增 user_name 空串数规则，期望值等于 `{user_name_empty_cnt}`
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段选择 user_name，统计规则选择【空串率】，校验方法选择占比，期望值输入 `{user_name_empty_rate}`，点击规则行【保存】，等待规则列表刷新完成
        expected: 规则列表新增 user_name 空串率规则，期望值等于 `{user_name_empty_rate}`
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
      - action: 选择完整性校验字段级，字段同时选择 user_code 和 remark，字段间规则逻辑选择 and
        expected: 字段选择框展示 user_code、remark 两个字段，字段间规则逻辑展示 and
      - action: 统计函数选择【空值数】，校验方法选择固定值，操作符选择等于，期望值输入 `{user_code_remark_null_and_cnt}`，点击【保存】，等待规则列表刷新完成
        expected: 多字段 and 空值数规则保存成功，规则卡片展示 user_code + remark、and、空值数、期望值等于 `{user_code_remark_null_and_cnt}`
      - action: 点击【添加规则】，等待规则编辑表单加载完成
        expected: 新增规则编辑表单展示为空白可编辑状态
