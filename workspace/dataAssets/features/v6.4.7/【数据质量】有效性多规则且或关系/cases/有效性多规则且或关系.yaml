  - case_id: C0020
    title: 验证【数据质量】-【规则任务配置】分区表指定分区执行规则，结果仅含指定分区记录
    priority: P2
    precondition: |-
      1) 规则集「RuleSetC」已被任务「TaskA」引用
      2) 任务「TaskA」当前状态为「停用」
      3) 授权数据源：${DataSourceA}
      4) 数据源类型：SparkThrift2.x
      5) 存在数据库：${SchemaA}
      6) 创建分区表并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0020;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0020 (id BIGINT, score INT, category STRING) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0020 PARTITION (dt)
         SELECT id, id, CONCAT('C', CAST(id AS STRING)), date_format(date_sub(current_date(), 1), 'yyyy-MM-dd') FROM range(1, 3)
         UNION ALL
         SELECT id + 2, id + 2, CONCAT('C', CAST(id + 2 AS STRING)), date_format(current_date(), 'yyyy-MM-dd') FROM range(1, 3);
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 删除规则集「RuleSetC」并在确认弹窗点击【确定】
        expected: Toast提示:「删除成功」，规则集列表不再展示「RuleSetC」
      - action: 进入【数据质量 → 规则任务配置】页面，打开任务「TaskA」
        expected: 任务详情不再展示已删除规则集的规则包，任务状态保持「停用」
    tags:
      ["数据质量", "规则集管理"]
