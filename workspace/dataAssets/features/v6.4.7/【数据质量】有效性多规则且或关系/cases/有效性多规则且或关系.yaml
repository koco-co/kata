meta:
  title: 有效性多规则且或关系
  feature_id: quality-validity-rule-boolean-logic
  project_id: data-assets
  requirement_id: "15695"
  case_module_id: ""
  exports:
    - 有效性多规则且或关系.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则集管理】配置取值范围与枚举范围且关系规则，保存后列表新增且启用
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数值表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0001 (id BIGINT, score DOUBLE, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0001 VALUES (1, 5.0, '1'), (2, 15.0, '4'), (3, 3.0, '2'), (4, -1.0, '3'), (5, 8.0, '5');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15695_c0001
          规则集描述：空
          点击【新增规则】并选择「取值范围&枚举范围」
        expected: 规则表单展示字段、取值范围、枚举值、且或关系和强弱规则
      - action: 字段选择 score，范围设置为「>1 且 <10」，枚举值选择 in「1、2、3」，且或关系选择「且」，强弱规则选择「强规则」
        expected: 表单回显范围 >1 且 <10、枚举值 in 1,2,3 和关系「且」
      - action: 点击【保存】
        expected: Toast提示:「保存成功」，规则列表新增 1 条且关系规则，状态为「启用」
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0002
    title: 验证【数据质量】-【规则集管理】配置取值范围与枚举范围或关系规则，保存后回显关系为或
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数值表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0002 (id BIGINT, score DOUBLE, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0002 VALUES (1, 5.0, '1'), (2, 15.0, '4'), (3, 3.0, '2'), (4, -1.0, '3'), (5, 8.0, '5');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetB
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15695_c0002
          规则集描述：空
          新增「取值范围&枚举范围」规则
        expected: 规则表单展示范围行和枚举值行
      - action: 字段选择 score，范围设置为「>1」，枚举值选择 in「1、2、3」，且或关系选择「或」，强弱规则选择「强规则」
        expected: 表单回显范围 >1、枚举值 in 1,2,3 和关系「或」
      - action: 点击【保存】并重新打开规则
        expected: Toast提示:「保存成功」，规则回显关系为「或」
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0003
    title: 验证【数据质量】-【规则集管理】仅填写取值范围保存规则，规则列表新增记录
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数值表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0003 (id BIGINT, score DOUBLE, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0003 VALUES (1, 5.0, '1'), (2, 15.0, '4'), (3, 3.0, '2'), (4, -1.0, '3'), (5, 8.0, '5');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetC
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15695_c0003
          规则集描述：空
          新增「取值范围&枚举范围」规则
        expected: 规则表单展示取值范围行和枚举值行
      - action: 字段选择 score，范围设置为「>=0」，枚举值保持空，点击【保存】
        expected: Toast提示:「保存成功」，规则列表范围列显示 >=0，枚举值列为空
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0004
    title: 验证【数据质量】-【规则集管理】仅填写枚举值保存规则，规则列表新增记录
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建字符串表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0004 (id BIGINT, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0004 VALUES (1, '1'), (2, '4'), (3, '2'), (4, '3'), (5, '5');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetD
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15695_c0004
          规则集描述：空
          新增「取值范围&枚举范围」规则
        expected: 规则表单展示枚举值类型和枚举值输入区
      - action: 字段选择 category，范围保持空，枚举值类型选择 in，输入 1、2、3，点击【保存】
        expected: Toast提示:「保存成功」，规则列表枚举值列显示 in 1,2,3，范围列为空
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0005
    title: 验证【数据质量】-【规则集管理】枚举值选择 not in 保存规则，列表新增记录
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建字段类型表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0005 (id BIGINT, score DOUBLE, category STRING, flag BOOLEAN);
         INSERT INTO ${SchemaA}.test_table_15695_c0005 VALUES (1, 5.0, '1', TRUE), (2, 15.0, '4', FALSE), (3, 3.0, '2', TRUE);
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 新增「取值范围&枚举范围」规则并查看字段下拉框
        expected: 字段下拉框包含 score、category、flag，并展示字段类型
      - action: 选择 score 配置范围条件
        expected: 范围输入控件可编辑
      - action: 选择 category 配置枚举条件
        expected: 枚举输入控件可编辑
      - action: 选择 flag
        expected: 范围和枚举配置控件按布尔字段限制展示不可用状态
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0006
    title: 验证【数据质量】-【规则集管理】原有枚举值规则新增 not in 选项，保存后规则正常
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入规则表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0006 (id BIGINT, score BIGINT, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0006 VALUES (1, 1, '1'), (2, 2, '2'), (3, 3, '3');
      5) 规则集「RuleSetD」已关联 ${DataSourceA}、${SchemaA}.test_table_15695_c0006
      6) 规则包中存在 score 范围 >1 且 <10、枚举 in 1,2,3 的规则
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「RuleSetD」的规则编辑页
        expected: 规则行展示范围 >1 且 <10、枚举 in 1,2,3 和关系「且」
      - action: 修改枚举值为 1、2、3、4，点击【保存】
        expected: Toast提示:「保存成功」，规则行枚举值更新为 in 1,2,3,4
      - action: 刷新规则集详情
        expected: 规则配置仍展示更新后的枚举值和原范围条件
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0007
    title: 验证【数据质量】-【规则集管理】string 类型字段配置取值范围与枚举范围规则，保存成功
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数值表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0007 (id BIGINT, score DOUBLE, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0007 VALUES (1, 5.0, '2'), (2, 15.0, '4'), (3, 3.0, '1'), (4, -1.0, '3'), (5, 8.0, '5');
      5) 规则集「RuleSetB」包含 score >1 且 <10、category in 1,2,3 的且关系规则
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务，选择 ${DataSourceA}、${SchemaA}.test_table_15695_c0007，导入规则集「RuleSetB」
        expected: 规则列表展示取值范围、枚举范围和关系「且」
      - action: 保存任务并立即执行
        expected: 最新实例状态为「校验异常」，通过记录为 id=1、id=3
      - action: 查看异常明细
        expected: 异常记录为 id=2、id=4、id=5，异常原因分别包含范围或枚举条件
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0008
    title: 验证【数据质量】-【规则集管理】期望值已填但操作符未选时保存，提示校验错误
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数值表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0008 (id BIGINT, score DOUBLE, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0008 VALUES (1, 5.0, '2'), (2, 15.0, '4'), (3, 3.0, '1'), (4, -1.0, '3'), (5, 8.0, '5');
      5) 规则集「RuleSetE」包含 score >1、category in 1,2,3 的或关系规则
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务，选择 ${DataSourceA}、${SchemaA}.test_table_15695_c0008，导入规则集「RuleSetE」
        expected: 规则列表展示取值范围、枚举范围和关系「或」
      - action: 保存任务并立即执行
        expected: 最新实例状态为「校验异常」，通过记录数量为 4
      - action: 查看异常明细
        expected: 异常记录为 id=2，异常原因同时展示范围和枚举条件均未满足
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0009
    title: 验证【数据质量】-【规则集管理】保存规则，提示校验错误(枚举值 = in 且值输入框 = 为空)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0009;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0009 (id BIGINT, score DOUBLE, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0009 VALUES (1, 5.0, '2'), (2, 15.0, '4'), (3, 3.0, '1'), (4, -1.0, '3'), (5, 8.0, '5');
      5) 规则集「RuleSetH」包含强规则 score >1 和弱规则 category in 1,2,3
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 创建任务并导入规则集「RuleSetH」
        expected: 规则列表展示 1 条强规则和 1 条弱规则
      - action: 保存并立即执行
        expected: 实例状态由强规则结果决定，规则详情分别展示两条规则的状态和异常数量
      - action: 打开质量报告
        expected: 报告展示强弱标识、规则名称、实际值和异常明细入口
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0010
    title: 验证【数据质量】-【规则集管理】范围与枚举均已填但关系未选时保存，提示校验错误
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入 5 行：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0010 (id BIGINT, score DOUBLE, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0010 VALUES (1, 5.0, '2'), (2, 15.0, '4'), (3, 3.0, '1'), (4, -1.0, '3'), (5, 8.0, '5');
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务，选择 ${DataSourceA}、${SchemaA}.test_table_15695_c0010，添加 score >1 且 <10 规则，过滤条件填写 id <= 3
        expected: 规则卡片展示范围条件和过滤条件 id <= 3
      - action: 保存并立即执行任务
        expected: 实例详情统计 id=1、id=2、id=3 三行，范围异常数量为 1
      - action: 查看异常明细
        expected: 明细唯一记录为 id=2，id=4 和 id=5 未进入本次统计
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0011
    title: 验证【数据质量】-【规则集管理】范围与枚举均未填时保存，提示至少填写一项
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入规则表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0011;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0011 (id BIGINT, score BIGINT, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0011 SELECT id, id, CAST(id AS STRING) FROM range(1, 6);
      5) 规则集「RuleSetI」已关联 ${DataSourceA}、${SchemaA}.test_table_15695_c0011，包含「range_pack」和「enum_pack」两个规则包
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务并导入规则集「RuleSetI」
        expected: 监控规则区域展示 range_pack、enum_pack 两个规则包
      - action: 保存任务并立即执行
        expected: 最新实例包含两个规则包的执行结果，实例状态由强规则结果决定
      - action: 查看任务详情
        expected: 两个规则包分别展示规则数量、通过数量、异常数量和执行耗时
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0012
    title: 验证【数据质量】-【规则集管理】已保存且关系规则编辑切换为或关系，保存后回显或
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入规则表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15695_c0012;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15695_c0012 (id BIGINT, score BIGINT, category STRING);
         INSERT INTO ${SchemaA}.test_table_15695_c0012 SELECT id, id, CAST(id AS STRING) FROM range(1, 6);
      5) 规则集「RuleSetA」已关联 ${DataSourceA}、${SchemaA}.test_table_15695_c0012，仅包含「range_pack」规则包
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务并导入规则集「RuleSetA」
        expected: 监控规则区域仅展示 range_pack 规则包
      - action: 保存并立即执行
        expected: 最新实例仅包含 range_pack 结果，规则包数量为 1
      - action: 查看质量报告
        expected: 报告展示 range_pack 规则结果和执行耗时
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0013
    title: 验证【数据质量】-【规则集管理】克隆取值范围与枚举范围规则，克隆后配置与原规则一致
    priority: P1
    precondition: |-
      1) 规则集「RuleSetF」已进入新增有效性规则表单
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 选择统计函数「取值范围&枚举范围」，不选择字段，点击【保存】
        expected: 「字段」置红提示「请选择字段」，规则行未新增
      - action: 选择字段 score，不填写范围和枚举值，点击【保存】
        expected: 「取值范围或枚举值」置红提示「请至少配置一项」，规则行未新增
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0014
    title: 验证【数据质量】-【规则集管理】配置过滤条件后保存规则，规则列表新增记录
    priority: P2
    precondition: |-
      1) 规则集「RuleSetG」已进入新增有效性规则表单
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 选择字段 score，仅配置范围「>=0」
        expected: 规则表单展示范围条件，且或关系控件不显示或不可用
      - action: 保存并重新打开规则
        expected: 规则列表仅展示范围条件，未生成关系字段
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0015
    title: 验证【数据质量】-【规则集管理】双数据源分别配置且关系规则，保存后类型与配置保留
    priority: P1
