meta:
  title: 有效性多规则且或关系
  requirement_id: "15695"
  case_module_id: ""
  exports:
    - xmind
cases:
  - case_id: C0001
    automation:
      spec_file: c0001-range-enum-and-numeric-flow.spec.ts
    title: 验证在规则集中配置取值范围&枚举范围规则且关系完整流程（数值类型字段）
    priority: P0
    steps:
      - action: 进入【数据质量 → 规则集管理】页面，等待规则集列表加载完成
        expected: 规则集管理页面正常打开，列表加载完成，无报错
      - action: 找到规则集"ruleset_15695_and"，点击操作列的【编辑】按钮，进入 Step 2 监控规则页面，在规则包"且关系校验包"中点击【新增规则】，在统计函数下拉框中选择【取值范围&枚举范围】
        expected: 规则配置区域展开，显示「有效性校验」标题，包含字段下拉框、统计规则配置区域（取值范围行和枚举值行）、强弱规则下拉框和规则描述输入框
      - action: |-
          在规则配置表单中按顺序填写如下：
          - 字段: score
          - 取值范围行-第一组: 期望值输入 1，操作符选择 >
          - 取值范围行-第二组: 点击右侧【+】添加第二条，期望值输入 10，操作符选择 <
          - 取值范围行-且或关系: 选择【且】单选按钮
          - 枚举值行-枚举值类型: 选择 in
          - 枚举值行-枚举值信息: 依次输入 1、2、3
          - 强弱规则: 强规则
          - 规则描述: score取值范围1到10且枚举值in 1,2,3
        expected: 各表单项可正常输入/选择，无异常提示
      - action: 点击【保存】按钮，再点击页面底部【保存】完成规则集保存
        expected: |-
          规则保存成功，规则配置页规则列表中新增一条规则，显示如下：
          1) 规则类型显示「取值范围&枚举范围」
          2) 字段显示 score
          3) 取值范围显示 >1 且 <10
          4) 枚举值显示 in '1,2,3'
          5) 且或关系显示「且」
          6) 强弱规则显示「强规则」
      - action: 切换至 doris3.x 数据源，按相同表、规则包和配置重复以上步骤。
        expected: 切换至 doris3.x 数据源重复以上步骤后，规则新增、保存、回显结果与 sparkthrift2.x 场景一致。
    precondition: |-
      1) 使用 admin 账号登录数据资产平台
      2) 已分别在 SparkThrift2.x 与 Doris3.x 数据源中准备同名测试表及数据：
      SparkThrift2.x 数据源建表及数据准备 SQL：
      DROP TABLE IF EXISTS test_db.quality_test_num;
      CREATE TABLE test_db.quality_test_num (
        id INT,
        score DOUBLE,
        category STRING
      ) STORED AS PARQUET;
      INSERT INTO TABLE test_db.quality_test_num
      SELECT 1, 5.0, '2'
      UNION ALL
      SELECT 2, 15.0, '4'
      UNION ALL
      SELECT 3, 3.0, '1'
      UNION ALL
      SELECT 4, -1.0, '3'
      UNION ALL
      SELECT 5, 8.0, '5';

      Doris3.x 数据源建表及数据准备 SQL：
      DROP TABLE IF EXISTS test_db.quality_test_num;
      CREATE TABLE test_db.quality_test_num (
        id INT NOT NULL,
        score DOUBLE,
        category VARCHAR(50)
      ) DISTRIBUTED BY HASH(id) BUCKETS 3 PROPERTIES("replication_num"="1");
      INSERT INTO test_db.quality_test_num VALUES
        (1, 5.0, '2'),
        (2, 15.0, '4'),
        (3, 3.0, '1'),
        (4, -1.0, '3'),
        (5, 8.0, '5');

      -- 说明：score 字段期望 >1 且 <10；category 枚举值期望 in '1,2,3'
      -- 符合且关系（两者均满足）的记录：id=1(score=5,category=2)、id=3(score=3,category=1)
      -- 不符合的记录：id=2(score=15越界)、id=4(score=-1越界)、id=5(category=5不在枚举)
      3) 已通过【数据质量 → 规则集管理】页面创建规则集"ruleset_15695_and"，关联 sparkthrift2.x 数据源 test_db 库 quality_test_num 表，规则包名称"且关系校验包"
    tags:
      - 数据质量
      - 规则集管理
      - 规则配置-新增取值范围&枚举范围规则（P0核心流程）
