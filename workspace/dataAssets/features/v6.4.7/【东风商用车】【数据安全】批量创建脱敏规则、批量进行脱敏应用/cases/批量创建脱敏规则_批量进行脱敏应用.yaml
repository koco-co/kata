      - 数据资产-数据安全-数据脱敏管理
      - -导入规则-脱敏方式
  - case_id: C0002
    title: 验证[导入脱敏表]功能正常功能_取消
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏应用]页面，点击导入脱敏表，点击”取消“
        expected: |-
          1） 关闭弹窗
          2） [脱敏应用]页面不增加数据
      - action: 点击导入脱敏表，进入[导入规则]页面，点击”×“
        expected: |-
          1） 关闭弹窗
          2） [脱敏应用]页面不增加数据
    precondition: "[数据脱敏管理]页面至少有1条脱敏规则"
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0003
    title: 验证[导入脱敏表]功能正常_ 必填项未填_数据源&数据库&数据表&脱敏字段
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏引用]页面，点击[导入脱敏表]，[重复处理]任意选择一个，点击“下载模板”，根据模板文件填写需要导入的脱敏表，填写5条脱敏表记录： 第1条记录的[数据源名称]不填写，其他字段正常填写； 第2条记录的[数据库名称]不填写，其他字段正常填写； 第3条记录的[数据表名称]不填写，其他字段正常填写； 第4条记录的[脱敏字段]不填写，其他字段正常填写； 第5条记录正确填写所有字段； 保存该文件并上传，点击“确定”
        expected: 1) 5条数据都导入失败 2）弹出提示弹窗： 导入表格中存在错误数据，请检查后重新导入，点击导出错误文件
      - action: 点击导出错误文件，查看错误文件
        expected: |-
          1） 错误文件命名为：table_import_error_20240520.xlsx
          2） 第1条记录[数据源名称]字段标红，并标注提示：必填项未填写 第2条记录[数据库名称]字段标红，并标注提示：必填项未填写 第3条记录[数据表名称]字段标红，并标注提示：必填项未填写 第4条记录[脱敏字段]字段标红，并标注提示：必填项未填写
    precondition: "[数据脱敏管理]页面至少存在一条脱敏规则"
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0004
    title: 验证[导入脱敏表]功能正常_ 导入不存在的数据_数据源&数据库&数据表&脱敏字段
    priority: P0
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏引用]页面，点击[导入脱敏表]，点击“下载模板”，根据模板文件填写需要导入的脱敏表，填写5条脱敏表记录： 第1条记录的[数据源名称]填写一个未引入的数据源，其他字段正常填写； 第2条记录的[数据库名称]填写为不存在的数据库名称，其他字段正常填写； 第3条记录的[数据表名称]填写为不存在的数据表名称，其他字段正常填写； 第4条记录的[脱敏字段]填写为不存在的字段，其他字段正常填写； 第5条记录正确填写所有字段； 保存该文件并上传，点击“确定”
        expected: 1） 5条数据都导入失败 2）弹出提示弹窗： 导入表格中存在错误数据，请检查后重新导入，点击导出错误文件
      - action: 点击导出错误文件，查看错误文件
        expected: |-
          1） 错误文件命名为：table_import_error_20240520.xlsx
          2） 第1条记录[数据源名称]字段标红，并标注提示：不存在的数据，请检查后输入 第2条记录[数据库名称]字段标红，并标注提示：不存在的数据，请检查后输入 第3条记录[数据表名称]字段标红，并标注提示：不存在的数据，请检查后输入 第4条记录[脱敏字段]字段标红，并标注提示：不存在的数据，请检查后输入
    precondition: "[数据脱敏管理]页面至少存在一条脱敏规则"
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0005
    title: 验证[导入脱敏表]功能正常_四个字段都一致
    priority: P0
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏引用]页面，点击[导入脱敏表]，点击“下载模板”，根据模板文件填写需要导入的脱敏表，填写1条脱敏表数据： 1）[数据源名称]填写为A，[数据库名称]填写为“B”，[数据表字段]填写为“C”,[脱敏字段]填写为“D”。 保存该文件并上传，点击“确定”
        expected: |-
          1） 脱敏表导入失败
          2） 弹出提示弹窗
      - action: 点击导出错误文件，查看文件内容
        expected: |-
          1） 错误文件命名为：table_import_error_20240520.xlsx
          2） 填写重复的[脱敏字段]提示为：不存在的数据，请检查后输入
    precondition: 脱敏表列表存在1条脱敏表记录数据源是A，数据库是B，数据表是C，脱敏字段是D，并开启该条脱敏表的血缘启动状态
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0006
    title: 验证[导入脱敏表]功能正常_脱敏字段不一致
    priority: P0
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏引用]页面，点击[导入脱敏表]，点击“下载模板”，根据模板文件填写需要导入的脱敏表，填写1条脱敏表数据： 1）[数据源名称]填写为A，[数据库名称]填写为“B”，[数据表字段]填写为“C”,[脱敏字段]填写为“D2”。 保存该文件并上传，点击“确定”
        expected: |-
          1） 导入成功
          2） 列表新增一条脱敏表的记录
      - action: 查看该条脱敏表的信息
        expected: |-
          1） 数据源、数据库、数据表、脱敏字段信息和导入文件中填写的内容保持一致
          2） 血缘启用状态是“关闭”
    precondition: 脱敏表列表存在1条脱敏表记录数据源是A，数据库是B，数据表是C，脱敏字段是D1，并开启该条脱敏表的血缘状态，同时存在另一个数据源A，有数据库名是B，下面有一个数据表是C，下面有一个脱敏字段是D2
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0007
    title: 验证[导入脱敏表]功能正常_数据表不一致
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏引用]页面，点击[导入脱敏表]，点击“下载模板”，根据模板文件填写需要导入的脱敏表，填写1条脱敏表数据： 1）[数据源名称]填写为A，[数据库名称]填写为“B”，[数据表字段]填写为“C2”,[脱敏字段]填写为“D”。 保存该文件并上传，点击“确定”
        expected: |-
          1） 导入成功
          2） 列表新增一条脱敏表的记录
      - action: 查看该条脱敏表的信息
        expected: |-
          1） 数据源、数据库、数据表、脱敏字段信息和导入文件中填写的内容保持一致
          2） 血缘启用状态是“关闭”
    precondition: 脱敏表列表存在1条脱敏表记录数据源是A，数据库是B，数据表是C1，脱敏字段是D，并开启该条脱敏表的血缘状态，同时存在另一个数据源A，有数据库名是B，下面有一个数据表是C2，下面有一个脱敏字段是D
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0008
    title: 验证[导入脱敏表]功能正常_数据库不一致
    priority: P0
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏引用]页面，点击[导入脱敏表]，点击“下载模板”，根据模板文件填写需要导入的脱敏表，填写1条脱敏表数据： 1）[数据源名称]填写为A，[数据库名称]填写为“B2”，[数据表字段]填写为“C”,[脱敏字段]填写为“D”。 保存该文件并上传，点击“确定”
        expected: |-
          1） 导入成功
          2） 列表新增一条脱敏表的记录
      - action: 查看该条脱敏表的信息
        expected: |-
          1） 数据源、数据库、数据表、脱敏字段信息和导入文件中填写的内容保持一致
          2） 血缘启用状态是“关闭”
    precondition: 脱敏表列表存在1条脱敏表记录数据源是A，数据库是B1，数据表是C，脱敏字段是D，并开启该条脱敏表的血缘状态，同时存在另一个数据源A，有数据库名是B2，下面有一个数据表是C，下面有一个脱敏字段是D
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0009
    title: 验证[导入脱敏表]功能正常_数据源不一致
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一条脱敏规则，点击[脱敏应用]，进入[脱敏引用]页面，点击[导入脱敏表]，点击“下载模板”，根据模板文件填写需要导入的脱敏表，填写1条脱敏表数据： 1）[数据源名称]填写为A2，[数据库名称]填写为“B”，[数据表名称]填写为“C”,[脱敏字段]填写为“D”。 保存该文件并上传，点击“确定”
        expected: |-
          1） 导入成功
          2） 列表新增一条脱敏表的记录
      - action: 查看该条脱敏表的信息
        expected: |-
          1） 数据源、数据库、数据表、脱敏字段信息和导入文件中填写的内容保持一致
          2） 血缘启用状态是“关闭”
    precondition: 脱敏表列表存在1条脱敏表记录，数据源是A1，数据库是B，数据表是C，脱敏字段是D，并开启该条脱敏表的血缘状态，同时存在另一个数据源A2（该数据源在脱敏表列表中不存在），有数据库名是B，下面有一个数据表是C，下面有一个脱敏字段是D
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0010
    title: 验证[上传文件]显示&交互正确
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一个脱敏规则，点击[脱敏应用]按钮，进入【脱敏表】页面，点击[导入脱敏表]按钮查看[上传文件]
        expected: 1） 必填
      - action: 点击”下载模板“
        expected: 脱敏表导入模板文件下载成功
      - action: 查看脱敏表导入模板文件
        expected: |-
          1） 文件命名为：table_import_template.xlsx
          2） 文件中的字段依次显示为：数据源名称、数据库名称、数据表名称、脱敏字段。（后面标注提示：必填）
    precondition: "[数据脱敏管理]页面已经存在至少1条脱敏规则"
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0011
    title: 验证[导入脱敏表]页面显示正确
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一个脱敏规则，点击[脱敏应用]，进入【脱敏表】页面，点击[导入脱敏表]按钮，查看[导入脱敏表]弹窗显示
        expected: |-
          1） title：导入脱敏表
          2） 字段显示：上传文件
          3） 按钮：取消、确定、×
    precondition: "[数据脱敏管理]页面已经存在至少1条脱敏规则"
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0012
    title: 验证[脱敏应用]页面显示正确
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，选择一个脱敏规则，点击[脱敏应用]，进入[脱敏应用]页面，查看页面显示
        expected: "[添加脱敏表]右边新增一个[导入脱敏表]按钮"
    precondition: "[数据脱敏管理]页面已经存在至少1条脱敏规则"
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -脱敏应用
      - -导入脱敏表
  - case_id: C0013
    title: 验证[导入规则]功能正常功能_取消
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，点击[导入规则]按钮，进入[导入规则]页面，点击”取消“
        expected: |-
          1） 关闭弹窗
          2） [数据脱敏管理]页面不增加数据
      - action: 点击[导入规则]按钮，进入[导入规则]页面，点击”×“
        expected: |-
