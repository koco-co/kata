      - 数据资产-数据安全-数据脱敏管理
      - -导入规则
  - case_id: C0014
    title: 验证[导入规则]功能正常_导入新规则且重复则覆盖更新
    priority: P0
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，点击[导入规则]按钮，进入[导入规则]页面，[重复处理规则]选择“重复则覆盖更新”，点击“下载模板”，根据模板文件填写需要导入的脱敏规则，填写一条脱敏规则，[规则名称]填写为列表尚不存在的规则名，正常填写剩下的字段，保存该文件并上传，点击“确定”
        expected: |-
          1） 导入成功
          2） 列表新增一条脱敏规则的记录
      - action: 选中新增的该条脱敏规则，点击[编辑]，查看回显的脱敏规则信息
        expected: 1） [规则名称]与[脱敏效果]和导入文件中填写的内容保持一致
    precondition: 无
    tags:
      - 数据资产-数据安全-数据脱敏管理
      - -导入规则
  - case_id: C0015
    title: 验证[导入规则]功能正常_导入新规则且重复则跳过
    priority: P1
    steps:
      - action: 进入【数据安全-数据脱敏管理】页面，点击[导入规则]按钮，进入[导入规则]页面，[重复处理规则]选择“重复则跳过”，点击“下载模板”，根据模板文件填写需要导入的脱敏规则，填写一条脱敏规则，[规则名称]填写为列表尚不存在的规则名，正常填写剩下的字段，保存该文件并上传，点击“确定”
        expected: |-
          1） 导入成功
          2） 列表新增一条脱敏规则的记录
      - action: 选中新增的该条脱敏规则，点击[编辑]，查看回显的脱敏规则信息
        expected: 1） [规则名称]与[脱敏效果]和导入文件中填写的内容保持一致
    precondition: 无
    tags:
