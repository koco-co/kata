meta:
  title: 批量创建脱敏规则_批量进行脱敏应用
  requirement_id: "14700"
  case_module_id: ""
  exports:
    - 批量创建脱敏规则_批量进行脱敏应用.xmind
cases:
  - case_id: C0001
    title: 验证【数据安全】-【数据脱敏管理】导入规则文件，列表新增4条规则
    priority: P0
    precondition: |-
      1) 创建导入文件 `mask_rules.csv`：
         Title: 规则名称,脱敏效果,脱敏起始位数,脱敏结束位数,脱敏替换符号,原字符,替换字符
         Line1: mask_all,全部脱敏,,,,,
         Line2: mask_partial,部分脱敏,1,3,*, ,
         Line3: mask_escape,转义,,,,ab,**
         Line4: mask_algorithm,算法脱敏,,,,,
      2) 文件中的 4 条规则名称在数据脱敏管理列表中不存在
    steps:
      - action: 进入【数据安全 → 数据脱敏管理】页面
        expected: 进入成功
      - action: 点击「导入规则」，选择重复处理「重复则跳过」，上传 `mask_rules.csv` 并点击「确定」
        expected: |-
          1) Toast提示:「导入成功」
          2) 列表新增「mask_all」「mask_partial」「mask_escape」「mask_algorithm」4 条规则
      - action: 打开 4 条规则详情并核对脱敏参数
        expected: |-
          1) 「mask_all」脱敏效果为「全部脱敏」
          2) 「mask_partial」脱敏效果为「部分脱敏」，起始位数为 1、结束位数为 3、替换符号为「*」
          3) 「mask_escape」脱敏效果为「转义」，原字符为「ab」、替换字符为「**」
          4) 「mask_algorithm」脱敏效果为「算法脱敏」
    tags:
      - 数据安全
      - 数据脱敏管理
      - 导入规则

  - case_id: C0002
    title: 验证【数据安全】-【数据脱敏管理】导入脱敏表后取消，记录数保持不变
    priority: P1
    precondition: |-
      1) 数据脱敏管理列表存在规则「RuleD」，脱敏效果为「全部脱敏」
      2) 脱敏应用列表当前记录数为 0
    steps:
      - action: 进入【数据安全 → 数据脱敏管理】页面
        expected: 进入成功
      - action: 选择「RuleD」并点击「脱敏应用」
        expected: 进入「脱敏应用」页面，展示「添加脱敏表」和「导入脱敏表」按钮
      - action: 点击「导入脱敏表」，点击「取消」
        expected: 弹窗关闭，脱敏应用列表记录数仍为 0
      - action: 再次点击「导入脱敏表」，点击右上角「×」
        expected: 弹窗关闭，脱敏应用列表记录数仍为 0
    tags:
      ["数据安全", "数据脱敏管理"]
  - case_id: C0003
    title: 验证【数据安全】-【数据脱敏管理】导入脱敏表，提示导入错误且不新增记录(脱敏表必填项 = 空)
    priority: P1
    precondition: |-
      1) 数据脱敏管理列表存在规则「RuleD」
      2) 创建导入文件 `table_import_required.xlsx`：
         Sheet: Sheet1
         Title: 数据源名称,数据库名称,数据表名称,脱敏字段
         Line1: ,${SchemaA},customer_info,phone
         Line2: ${DataSourceA},,customer_info,phone
         Line3: ${DataSourceA},${SchemaA},,phone
         Line4: ${DataSourceA},${SchemaA},customer_info,
         Line5: ${DataSourceA},${SchemaA},customer_info,phone
      3) 授权数据源：${DataSourceA}
      4) 数据源类型：SparkThrift2.x
      5) 存在数据库：${SchemaA}
      6) 创建导入对象表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14700_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14700_c0003 (id BIGINT, phone STRING);
         INSERT INTO ${SchemaA}.test_table_14700_c0003 VALUES (1, '13800000000');
    steps:
      - action: 进入【数据安全 → 数据脱敏管理】页面
        expected: 进入成功
      - action: 选择「RuleD」，进入「脱敏应用」并点击「导入脱敏表」
        expected: 打开「导入脱敏表」弹窗，展示上传文件控件
      - action: 上传 `table_import_required.xlsx` 并点击「确定」
        expected: |-
          1) Toast提示:「导入表格中存在错误数据，请检查后重新导入」
          2) 脱敏表列表不新增记录
          3) 弹窗展示「导出错误文件」入口
      - action: 点击「导出错误文件」并打开下载文件
        expected: |-
          1) 文件名为 `table_import_error.xlsx`
          2) 第 1～4 条对应空字段单元格标红，并显示「必填项未填写」
    tags:
      ["数据安全", "数据脱敏管理"]
  - case_id: C0004
    title: 验证【数据安全】-【数据脱敏管理】导入脱敏表，错误单元格标红(对象为空)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 数据脱敏管理列表存在规则「RuleD」
      5) 数据源「${DataSourceA}」中存在数据库「${SchemaA}」、数据表「customer_info」及字段「phone」
      6) 创建导入文件 `table_import_not_found.xlsx`：
         Sheet: Sheet1
         Title: 数据源名称,数据库名称,数据表名称,脱敏字段
         Line1: ${DataSourceB},${SchemaA},customer_info,phone
         Line2: ${DataSourceA},${SchemaB},customer_info,phone
         Line3: ${DataSourceA},${SchemaA},table_missing,phone
         Line4: ${DataSourceA},${SchemaA},customer_info,field_missing
      7) 创建导入对象表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_14700_c0004_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_14700_c0004_source (id BIGINT, phone STRING);
         INSERT INTO ${SchemaA}.test_table_14700_c0004_source VALUES (1, '13800000000');
      8) 授权数据源：${DataSourceB}
      9) 数据源类型：SparkThrift2.x
      10) 存在数据库：${SchemaB}
      11) 创建数据表，该表为空表：
          DROP TABLE IF EXISTS ${SchemaB}.test_table_14700_c0004_target;
          CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_14700_c0004_target (id BIGINT, phone STRING);
    steps:
      - action: 进入【数据安全 → 数据脱敏管理】页面
        expected: 进入成功
      - action: 选择「RuleD」，进入「脱敏应用」并点击「导入脱敏表」
        expected: 打开「导入脱敏表」弹窗，展示上传文件控件
      - action: 上传 `table_import_not_found.xlsx` 并点击「确定」
        expected: |-
          1) Toast提示:「导入表格中存在错误数据，请检查后重新导入」
          2) 脱敏表列表不新增记录
          3) 弹窗展示「导出错误文件」入口
      - action: 点击「导出错误文件」并打开下载文件
        expected: |-
          1) 第 1～4 条对应不存在对象的单元格标红
          2) 每个错误单元格显示「不存在的数据，请检查后输入」
    tags:
      ["数据安全", "数据脱敏管理"]
