        expected: ""
      - action: 不填写原字符与替换字符
        expected: ""
      - action: 在csv文件中新增一条规则
        expected: ""
      - action: 填写不存在的规则名称
        expected: ""
      - action: 脱敏方式为转义
        expected: ""
      - action: 不填写脱敏起始位与脱敏结束位
        expected: ""
      - action: 不填写脱敏替换符号
        expected: ""
      - action: 原字符为：ab,89,test
        expected: ""
      - action: 替换字符：**
        expected: ""
      - action: 在csv文件中新增一条规则
        expected: ""
      - action: 填写不存在的规则名称
        expected: ""
      - action: 脱敏方式为：算法脱敏
        expected: ""
      - action: 不填写脱敏起始位与脱敏结束位
        expected: ""
      - action: 不填写脱敏替换符号
