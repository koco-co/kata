cases:
  - case_id: C0001
    title: 验证
    priority: P0
    steps:
      - action: 在csv文件中新增一条规则
        expected: 1. 该成功上传该文件
      - action: 填写不存在的规则名称
        expected: 点击【确定】，列表跟新展示添加的数据，值与csv文件中的记录完全相同
      - action: 脱敏方式为全部脱敏
        expected: 1. 该成功上传该文件
      - action: 不填写脱敏起始位数
        expected: 点击【确定】，列表跟新展示添加的数据，值与csv文件中的记录完全相同
      - action: 脱敏替换符号为：*，
        expected: 1. 该成功上传该文件
      - action: 不填写原字符与替换字符
        expected: 点击【确定】，列表跟新展示添加的数据，值与csv文件中的记录完全相同
      - action: 在csv文件中新增一条规则
        expected: 1. 该成功上传该文件
      - action: 填写不存在的规则名称
        expected: 点击【确定】，列表跟新展示添加的数据，值与csv文件中的记录完全相同
