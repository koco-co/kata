    title: 验证标准映射-创建标准映射功能正常
    priority: P1
    steps:
      - action: 进入数据标准-标准映射，点击【标准映射】按钮，查看创建标准映射弹窗
        expected: 弹窗打开，显示”数据源类型””数据源””数据库”级联选择控件
      - action: “数据源类型”选择 Doris
        expected: “数据源”下拉项展示平台内所有 Doris 类型数据源名称
      - action: “数据源”选择目标 Doris 数据源
        expected: “数据库”下拉项展示该数据源下所有已同步的数据库（包含 active_users 所在库）
      - action: 选择 active_users 所在数据库，点击【添加】，再点击【确定】
        expected: 全局提示”创建标准映射成功”；标准映射列表新增对应数据库的映射记录
    precondition: |-
      - 数据源类型：Doris（Meta数据源）
      - 依赖表：active_users（见 sql/active-users.sql）
        字段：
          user_id   BIGINT NOT NULL   '用户ID'
          name      VARCHAR(50) NOT NULL  '用户姓名'
          email     VARCHAR(200) NULL  '邮箱地址'
          address   VARCHAR(500) NULL  '住址'
          age       TINYINT NULL      '用户年龄'
          sex       TINYINT NULL      '用户性别'
          last_active DATETIME        '最近活跃时间'
          property0~3 TINYINT NOT NULL
        数据：2 条（user_id: 1/2）
      - active_users 已完成元数据同步至资产平台
      - 已在【数据标准-标准管理-标准定义】中创建并上线数据标准：
          标准名：email，中文名：邮箱地址，对应字段类型为字符串
    tags:
