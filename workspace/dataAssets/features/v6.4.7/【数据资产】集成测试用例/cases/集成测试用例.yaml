meta:
  title: 集成测试用例
  case_module_id: ""
  exports:
    - xmind
cases:
  - case_id: C0001

    title: 验证已接入数据源统计数据正确
    priority: P0
    steps:
      - action: 进入资产-【资产盘点】页面
        expected: 进入成功，URL不包含login
      - action: 查看”已接入数据源”
        expected: 显示截止前一天为止接入的数据源类型的统计卡片
      - action: 查看统计数据：昨日新增表数、源数、库数、表数以及存储量
        expected: 统计数据为对应数据源类型下前一天的统计数据，页面包含数据源/表数/库数/存储等文本
    tags:
      - 资产盘点（#10373）
      - 未分类
      - 未分类
  - case_id: C0002

    title: 验证【数据表】表数量统计正确
    priority: P0
    steps:
      - action: |-
          1. 新增元数据同步-周期同步任务
          2. 选择 Doris 数据源，选择对应 database
          3. 选择数据表 test_table
          4. 勾选【全部内容】
          5. 点击【临时同步】按钮
        expected: 元数据同步任务创建成功，任务状态显示"运行中"，实例状态显示"运行中"
      - action: 等待任务运行完成，实例状态变为"运行成功"
        expected: 数据地图首页【数据表】统计数量显示 N+1，页面数字与同步前相差恰好为 1
      - action: 在数据地图中找到 test_table，点击【删除元表】并确认
        expected: 【数据表】统计数量恢复为 N，页面数字与删除前相差恰好为 1
    precondition: |-
      - 数据源类型：Doris（Meta数据源）
      - 离线项目：env_rebuild_test
      - Doris 数据源下已存在表 test_table（见 sql/base-tables.sql）
        字段：id INT, name VARCHAR(255), info VARCHAR(255)
      - 记录同步前【数据表】当前统计数量 N（用于后续断言 N+1 / N-1）
    tags:
      - 元数据（#10374）
      - 数据地图
      - 首页【资产类型】功能验证
  - case_id: C0003

    title: 验证【离线任务】任务数量统计正确
    priority: P0
    steps:
      - action: |-
          1. 在离线平台（项目 env_rebuild_test）新增 SQL 建表任务，目标表为 test_table
          2. 点击【临时运行】或【提交】
        expected: 【离线任务】任务统计数量显示 M+1，页面数字与操作前相差恰好为 1
    precondition: |-
      - 数据源类型：Doris（Meta数据源）
      - 离线项目：env_rebuild_test
      - Doris 数据源下已存在表 test_table（见 sql/base-tables.sql）
        字段：id INT, name VARCHAR(255), info VARCHAR(255)
      - 记录操作前【离线任务】当前统计数量 M
    tags:
      - 元数据（#10374）
      - 数据地图
      - 首页【资产类型】功能验证
  - case_id: C0004

    title: 验证筛选条件组合查询功能正常
    priority: P0
    steps:
      - action: 选择【查询结果类型】为【数据表】
        expected: 选择成功
      - action: 选择【数据源类型】为 Doris
        expected: |-
          1. 筛选框展示资产平台引入的所有数据源类型
          2. Doris 选项可见且可选中
          3. 选择成功
      - action: 选择【数据源】为 env_rebuild_test 项目绑定的 Doris 数据源
        expected: |-
          1. 数据源下拉仅展示已引入的 Doris 数据源名称
          2. 可选中 `env_rebuild_test_DORIS_doris`（或同项目下等价 Doris 数据源）
          3. 选择成功
      - action: 选择包含 `test_table` 的数据库
        expected: |-
          1. 如果当前数据源下没有已同步数据库，则展示为空
          2. 如果已同步 `test_table`/`active_users` 等表，则可成功选中对应数据库
      - action: 选择负责人
        expected: |-
          1. 如果目标表已配置负责人，则下拉可选中对应负责人
          2. 如果未配置负责人，则下拉为空或不展示候选项
      - action: 选择表标签
        expected: |-
          1. 如果目标表已配置表标签，则下拉可选中对应标签
          2. 如果未配置表标签，则下拉为空或不展示候选项
      - action: 设置完所有筛选条件后，筛选
        expected: |-
          1. 过滤出所有符合组合条件的数据
          2. 没有匹配条件的数据则展示“暂无数据”缺省页
    tags:
      - 元数据（#10374）
      - 数据地图
      - 【数据地图】-二级页面【筛选过滤】功能验证
  - case_id: C0005

    title: 验证【表结构】-【建表语句】模块功能正常
    priority: P1
    steps:
      - action: 进入 test_table 表详情页，点击【建表语句】按钮
        expected: 建表语句弹窗打开，内容包含"test_table"表名、字段 id/name/info 及其类型和 COMMENT，语法与 sql/base-tables.sql 保持一致
      - action: 点击【复制】按钮，将建表语句粘贴至离线平台 SQL 编辑器执行
        expected: SQL 执行成功，无报错；在 Doris 数据源中可查到结构一致的新表
    precondition: |-
      - 数据源类型：Doris（Meta数据源）
      - 离线项目：env_rebuild_test
      - 表名：test_table（见 sql/base-tables.sql）
      - 表字段结构：
          id    INT           COMMENT '主键'
          name  VARCHAR(255)  COMMENT '姓名'
          info  VARCHAR(255)  COMMENT '信息'
      - 表数据：3 条（id=1/2/3）
      - test_table 已完成元数据同步至资产平台，可在【数据地图】中查到该表详情
    tags:
      - 元数据（#10374）
      - 数据地图
      - 【数据地图】-【数据表】详情页面功能验证
  - case_id: C0006

    title: 验证【血缘关系】功能正常
    priority: P0
    steps:
      - action: 在数据地图中打开 wwz_001 表详情，点击【血缘关系】按钮
        expected: 页面顶部/侧边展示【表级血缘】【字段级血缘】切换按钮；工具栏可见【展示文字信息】【居中】【放大】【放小】【下载】【展示/隐藏导航器】按钮；画布中央显示 wwz_001 表节点
      - action: 点击【表级血缘】按钮
        expected: 画布中显示 wwz_001 的上游节点（wwz_002、wwz_003）和下游节点；上下游节点数量与离线血缘 SQL 一致
      - action: 查看血缘图提示文案
        expected: 页面存在文字”每个节点都可右击查看该节点的全链路血缘，存在逆向可展开节点时建议右击查看~”
      - action: 点击画布中央的 wwz_001 【表按钮】
        expected: 弹出表详情弹窗，弹窗可见
      - action: 查看表详情弹窗内容
        expected: 弹窗中显示”wwz_001”表名及复制按钮；技术属性模块、业务属性模块可见；字段列表展示 id、name 两个非分区字段；页面包含”字段名称”和”字段中文名”搜索框
      - action: 在搜索框输入字段名”id”，点击搜索
        expected: 字段列表过滤后仅显示 id 字段一行，字段类型为 INT，中文名为”用户ID”
      - action: 在搜索框输入不存在的字段名”xyz_not_exist”，点击搜索
        expected: 字段列表区域显示”暂无数据”
      - action: 调整分页 pagesize（如改为 5/10/20），切换页码
        expected: pagesize 切换后列表行数与所选值一致；页码跳转后数据对应正确，无重复/丢失
      - action: 点击【字段级血缘】
        expected: 画布切换为字段级视图，展示 wwz_001 的所有字段（id、name）及各字段对应的上游字段连线
      - action: 点击字段”id”节点
        expected: 因 wwz_002.id → wwz_001.id 存在血缘，弹出血缘字段面板并显示来源字段信息；点击无血缘字段时提示”字段血缘关系为空”
      - action: 点击【展示文字信息】按钮
        expected: 画布中各节点显示完整表全名（如 database.wwz_001）
      - action: 点击【居中】按钮
        expected: 血缘图在视口内居中展示，画布偏移量归零
      - action: 点击【放大】按钮
        expected: 血缘图比例放大，节点变大
      - action: 点击【放小】按钮
        expected: 血缘图比例缩小，节点变小
      - action: 点击【下载】按钮
        expected: |-
          下载成功，生成 PNG 文件；PNG 内容包含 wwz_001、wwz_002、wwz_003 节点及连线
      - action: 点击【展示/隐藏导航器】按钮
        expected: 导航器小地图在显示/隐藏状态间切换，当前状态与按钮图标一致
    precondition: |-
      - 数据源类型：Doris（Meta数据源）
      - 离线项目：env_rebuild_test
      - 已在 Doris 数据源中创建以下三张表（见 sql/lineage-tables.sql）：
          wwz_001（id INT COMMENT '用户ID', name VARCHAR(50) COMMENT '用户姓名'）
          wwz_002（id INT COMMENT '用户ID', name VARCHAR(50) COMMENT '用户姓名'）
          wwz_003（id INT COMMENT '用户ID', name VARCHAR(50) COMMENT '用户姓名'）
      - 在离线项目 env_rebuild_test 中，已存在以下血缘 SQL 任务（任务已运行成功并产生血缘）：
          样例一：INSERT INTO wwz_001 SELECT id, name FROM wwz_002;
          样例三：INSERT INTO wwz_001 SELECT * FROM wwz_002 UNION ALL SELECT * FROM wwz_003;
      - 上述三张表已完成元数据同步至资产平台，在数据地图中可查到对应表详情
    tags:
      - 元数据（#10374）
      - 数据地图
      - 【数据地图】-【数据表】详情页面功能验证
