meta:
  title: 数据资产集成测试用例
  requirement_id: "none"
  case_module_id: ""
  exports:
    - 集成测试用例.xmind
cases:
  - case_id: C0001
    title: 验证【数据资产】-【资产盘点】查看已接入数据源统计，昨日新增库表数与存储量正确
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建统计基线表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001_source_01 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0001_source_01 VALUES (1, '订单一'), (2, '订单二');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：SparkThrift2.x
      7) 数据源 B 存在数据库：${SchemaB}
      8) 创建统计基线表并插入记录：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0001_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0001_source_02 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaB}.test_table_none_c0001_source_02 VALUES (1, '订单一'), (2, '订单二');
      9) ${DataSourceA} 昨日新增数据库数为 1、数据表数为 2，${DataSourceB} 昨日新增数据库数为 1、数据表数为 1
    steps:
      - action: 进入【数据资产 → 资产盘点】页面
        expected: 进入成功
      - action: 查看「已接入数据源」模块
        expected: 展示 ${DataSourceA}、${DataSourceB} 两种数据源类型及昨日新增源数、库数、表数和存储量
      - action: 查看统计卡片数值
        expected: ${DataSourceA} 昨日新增表数为 2，${DataSourceB} 昨日新增表数为 1
    tags:
      - 数据资产
      - 资产盘点

  - case_id: C0002
    title: 验证【数据资产】-【资产盘点】查看六类资产数量统计，与平台存量一致
    priority: P0
    precondition: |-
      1) 资产平台存在数据表 3 张、离线任务 2 个、实时任务 1 个、API 1 个、智能标签 2 个、指标 1 个
      2) 上述资产均已完成同步或发布
    steps:
      - action: 进入【数据资产 → 资产盘点】页面
        expected: 进入成功
      - action: 查看资产类型统计区域
        expected: 展示数据表、离线任务、实时任务、API、智能标签、指标六类图标
      - action: 对照各类统计数量
        expected: 六类数量分别为 3、2、1、1、2、1
    tags:
      - 数据资产
      - 资产盘点
      - 资产统计

  - case_id: C0003
    title: 验证【数据资产】-【数据地图】按类型与关键词搜索，结果仅含匹配资产
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0003 VALUES (1, 'order_1'), (2, 'order_2');
      5) 数据地图存在 ${SchemaA}.test_table_none_c0003 数据表、离线任务 ${TaskA}
      6) 数据地图存在 ${DataSourceB} 下数据表 customers
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 选择资产类型「数据表」、数据源类型「Doris」并搜索「order」
        expected: 结果列表仅展示 ${DataSourceA}.orders，资产类型为「数据表」
      - action: 将资产类型切换为「离线任务」并搜索「order」
        expected: 结果列表仅展示 ${DataSourceA}.${TaskA}，不展示 orders 或 customers
    tags:
      - 数据资产
      - 数据地图
      - 筛选

  - case_id: C0004
    title: 验证【数据资产】-【数据地图】打开表详情查看属性与字段，字段类型正确
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004 (id INT, name VARCHAR(50), amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0004 VALUES (1, '订单', 10.00);
      5) orders 已配置表标签「订单表」
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 搜索 orders 并打开数据表详情
        expected: 详情展示数据源 ${DataSourceA}、数据库 ${SchemaA}、表名 orders 和表标签「订单表」
      - action: 查看「技术属性」和字段列表
        expected: 字段列表展示 id INT、name VARCHAR、amount DECIMAL(10,2)，技术属性展示数据源类型 Doris
    tags:
      - 数据资产
      - 数据地图
      - 表详情

  - case_id: C0005
    title: 验证【数据资产】-【数据地图】为字段添加标签并刷新，标签持久化且计数为 1
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005 (id BIGINT, name VARCHAR(50), amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0005 VALUES (1, '订单', 10.00);
      5) amount 字段当前没有字段标签「金额」
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 打开 orders 详情，在 amount 字段添加标签「金额」并保存
        expected: Toast提示:「保存成功」，amount 字段标签显示「金额」
      - action: 刷新 orders 详情
        expected: amount 字段仍显示标签「金额」，标签使用次数为 1
    tags:
      - 数据资产
      - 数据地图
      - 字段标签
      - 持久化

  - case_id: C0006
    title: 验证【数据资产】-【数据地图】依次搜索资产，最近查询记录与回填正确
    priority: P1
    precondition: |-
      1) 最近查询记录为空
      2) 数据地图存在关键词 orders、customers、${TaskA} 对应资产
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 依次搜索 orders、customers、${TaskA}
        expected: 每次搜索生成对应结果，最近查询区域记录 3 条关键词
      - action: 点击最近查询中的 orders
        expected: 搜索框回填 orders，结果列表展示 orders 资产
    tags:
      - 数据资产
      - 数据地图
      - 最近查询

  - case_id: C0007
    title: 验证【元数据】-【数据目录】新增目录并移入表，目录树与归属更新
    priority: P1
    precondition: |-
      1) 目录树不存在「CatalogA」
      2) 数据表 orders 当前未分配目录，当前用户具有目录维护权限
    steps:
      - action: 进入【元数据 → 数据目录 → 目录管理】页面
        expected: 进入成功
      - action: 新增目录「CatalogA」，保存后将 orders 移入该目录
        expected: Toast提示:「保存成功」，目录树新增CatalogA，orders 归属该目录
      - action: 刷新目录树并打开CatalogA
        expected: CatalogA仍存在，内容包含 orders
    tags:
      - 元数据
      - 数据目录
      - 目录管理

  - case_id: C0008
    title: 验证【元数据】-【数据表】按表名查询与重置，列表记录正确
    priority: P1
    precondition: |-
      1) 数据表列表存在 orders、order_detail、customers 三张表
      2) 三张表均已完成元数据同步
    steps:
      - action: 进入【元数据 → 数据目录 → 数据表】页面
        expected: 进入成功
      - action: 在表名输入框填写 orders 并点击【查询】
        expected: 列表仅展示 orders 1 条记录，表名列为 orders
      - action: 点击【重置】
        expected: 表名输入框清空，列表恢复展示三张表
    tags:
      - 元数据
      - 数据目录
      - 数据表
      - 查询

  - case_id: C0009
    title: 验证【元数据】-【数据表】打开表详情预览数据，首行字段值正确
    priority: P1
    precondition: |-
      1) 数据表 orders 包含 id=1、name=Alice、amount=10.00 一行记录
      2) 当前用户具有数据预览权限
    steps:
      - action: 进入【元数据 → 数据目录 → 数据表】页面
        expected: 进入成功
      - action: 打开 orders 详情并点击【数据预览】
        expected: 预览表格展示 id、name、amount 三列
      - action: 查看首行
        expected: 首行字段值为 1、Alice、10.00
    tags:
      - 元数据
      - 数据目录
      - 数据表
      - 数据预览

  - case_id: C0010
    title: 验证【元数据】-【元数据同步】立即同步新表，资产盘点统计增量正确
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0010 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0010 VALUES (1, 'order_1'), (2, 'order_2');
      5) 数据源 ${DataSourceA} 下存在 orders 表，资产盘点当前数据表统计为 2
      6) orders 尚未同步至资产平台
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: 新增周期同步任务，选择 ${DataSourceA}、${SchemaA}、orders 并点击【立即同步】
        expected: Toast提示:「同步成功」，任务最新实例状态为「运行成功」
      - action: 进入【数据资产 → 资产盘点】页面
        expected: 数据表统计变为 3，增量为 1
    tags:
      - 元数据
      - 元数据同步
      - 资产盘点
      - 统计

  - case_id: C0011
    title: 验证【离线开发】-【任务开发】发布 SQL 任务，离线任务统计增加
    priority: P0
    precondition: |-
      1) 离线开发平台项目「${ProjectA}」存在 SQL 任务「${TaskA}」
      2) ${TaskA} 发布前数据地图离线任务统计为 1
    steps:
      - action: 进入【离线开发 → 任务开发】页面
        expected: 进入成功
      - action: 打开 ${TaskA}，点击【提交】并确认发布
        expected: Toast提示:「发布成功」，任务状态为「已发布」
      - action: 进入【数据资产 → 数据地图】页面并选择资产类型「离线任务」
        expected: 结果列表新增 ${TaskA}，离线任务统计增加 1
    tags:
      - 离线开发
      - 任务开发
      - 数据地图
      - 任务同步

  - case_id: C0012
    title: 验证【实时开发】-【任务管理】发布实时任务，实时任务统计增加
    priority: P1
    precondition: |-
      1) 实时开发平台存在实时任务「${TaskB}」，状态为「已发布」
      2) 数据地图实时任务统计未包含 ${TaskB}
    steps:
      - action: 进入【实时开发 → 任务管理】页面
        expected: 进入成功
      - action: 打开 ${TaskB} 并点击【发布】
        expected: Toast提示:「发布成功」，任务状态为「运行中」
      - action: 进入【数据资产 → 数据地图】页面并选择资产类型「实时任务」
        expected: 结果列表包含 ${TaskB}，实时任务统计增加 1
    tags:
      - 实时开发
      - 任务管理
      - 数据地图
      - 任务同步

  - case_id: C0013
    title: 验证【数据服务】-【API管理】发布 API，API 统计增加
    priority: P1
    precondition: |-
      1) 数据服务平台存在 API「${TaskC}」，状态为「未发布」
      2) 数据地图 API 统计未包含 ${TaskC}
    steps:
      - action: 进入【数据服务 → API管理】页面
        expected: 进入成功
      - action: 打开 ${TaskC} 并点击【发布】
        expected: Toast提示:「发布成功」，API 状态为「已发布」
      - action: 进入【数据资产 → 数据地图】页面并选择资产类型「API」
        expected: 结果列表包含 ${TaskC}，API 统计增加 1
    tags:
      - 数据服务
      - API管理
      - 数据地图
      - API

  - case_id: C0014
    title: 验证【数据资产】-【数据地图】删除元表，数据表统计减少
    priority: P1
    precondition: |-
      1) 数据地图存在数据表 orders，数据表统计当前为 3
      2) 当前用户具有元数据删除权限
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 搜索 orders，在操作列点击【删除元表】并确认
        expected: Toast提示:「删除成功」，orders 从结果列表移除
      - action: 查看资产类型统计
        expected: 数据表统计变为 2，其他资产类型统计不变
    tags:
      - 数据资产
      - 数据地图
      - 删除

  - case_id: C0015
    title: 验证【数据资产】-【数据地图】切换排序方式，数据源列表顺序正确
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 授权数据源 B：${DataSourceB}
      4) 数据源 B 类型：SparkThrift2.x
      5) 授权数据源 C：${DataSourceC}
      6) 数据源 C 类型：MySQL
      7) 数据地图统计 ${DataSourceA} 有 4 张表、${DataSourceB} 有 2 张表、${DataSourceC} 有 1 张表
      8) 数据源统计区域处于有数据状态
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 查看数据源统计区域并选择「按表数量排序」
        expected: ${DataSourceA}、${DataSourceB}、${DataSourceC} 按 4、2、1 的顺序排列
      - action: 切换到「按名称排序」
        expected: 列表按数据源名称字典序排列，排序条件显示「按名称排序」
    tags:
      - 数据资产
      - 数据地图
      - 数据源
      - 排序

  - case_id: C0016
    title: 验证【数据资产】-【数据地图】无标签记录时展示空状态，资产搜索不受影响
    priority: P2
    precondition: |-
      1) 数据地图没有字段标签、表标签、视图标签和物化视图标签记录
      2) 数据地图页面可正常加载资产统计
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 查看标签统计区域
        expected: 展示「暂无数据」空状态，不展示标签排行
      - action: 切换到数据表资产类型
        expected: 数据表列表可用，标签空状态不影响资产搜索
    tags:
      - 数据资产
      - 数据地图
      - 标签
      - 空状态

  - case_id: C0017
    title: 验证【数据资产】-【数据地图】打开血缘图，上下游节点与详情正确
    priority: P0
    precondition: |-
      1) 数据表 orders 的上游为 ${TaskA}，下游为 ${TaskD}
      2) 上游和下游节点均已完成元数据同步
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 搜索 orders 并打开「血缘关系」
        expected: 血缘图展示 ${TaskA}、orders、${TaskD} 三个节点
      - action: 点击 ${TaskD} 节点
        expected: 节点详情展示资产类型「数据表」、表名 ${TaskD} 和上下游连接方向
    tags:
      - 数据资产
      - 数据地图
      - 血缘

  - case_id: C0018
    title: 验证【数据质量】-【规则库配置】执行非空校验规则，结果查询展示达标与异常数
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0018;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0018 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0018 VALUES (1, 10.00), (2, 20.00), (3, 30.00);
      5) 规则任务「TaskR」配置 amount 非空校验，状态为「启用」
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 打开 TaskR 并点击【立即执行】
        expected: Toast提示:「执行成功」，任务状态为「运行中」
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 最新实例状态为「运行成功」，amount 非空校验结果为「达标」，异常数量为 0
    tags:
      - 数据质量
      - 规则库配置
      - 资产平台
      - 结果查询

  - case_id: C0019
    title: 验证【元数据】-【数据表】修改业务属性并保存，数据地图详情同步
    priority: P1
    precondition: |-
      1) 数据表 orders 的业务属性「业务域」当前为「订单域」
      2) 当前用户具有业务属性维护权限
    steps:
      - action: 进入【元数据 → 数据目录 → 数据表】页面
        expected: 进入成功
      - action: 打开 orders 详情，将业务属性「业务域」改为「交易域」并保存
        expected: Toast提示:「保存成功」，详情显示「业务域：交易域」
      - action: 进入【数据资产 → 数据地图】页面搜索 orders
        expected: orders 详情摘要显示业务域「交易域」
    tags:
      - 元数据
      - 数据目录
      - 数据表
      - 业务属性
      - 数据地图

  - case_id: C0020
    title: 验证【平台管理】-【数据源管理】连接测试不可达数据源，状态异常且资产提示不可用
    priority: P1
    precondition: |-
      1) 数据源「${DataSourceD}」连接地址 doris.invalid.local:9030 不可达
      2) 数据源列表已记录 ${DataSourceD}，当前连接状态为「异常」
    steps:
      - action: 进入【平台管理 → 数据源管理】页面
        expected: 进入成功
      - action: 查看 ${DataSourceD} 的连接状态并点击【连接测试】
        expected: 状态显示「异常」，Toast提示:「连接失败」，错误信息包含 doris.invalid.local:9030
      - action: 进入【数据资产 → 数据地图】页面
        expected: 搜索 ${DataSourceD} 资产时列表提示「数据源不可用」，不展示过期的统计数字
    tags:
      - 平台管理
      - 数据源管理
      - 数据源
      - 异常处理
