meta:
  title: 数据资产主流程测试用例
  requirement_id: "none"
  case_module_id: ""
  exports:
    - 主流程测试用例.xmind
cases:
  - case_id: C0001
    title: 验证【数据资产】-【资产盘点】查看已接入数据源统计，昨日新增库表数与存储量正确
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0001 VALUES (1, '订单一'), (2, '订单二');
      5) 数据地图已同步 ${SchemaA}.test_table_none_c0001，昨日新增数据库数为 1、数据表数为 1
    steps:
      - action: 进入【数据资产 → 资产盘点】页面
        expected: 进入成功
      - action: 查看「已接入数据源」统计卡片
        expected: 展示已接入的数据源类型及昨日新增源数、库数、表数与存储量
      - action: 查看 ${DataSourceA} 的统计数值
        expected: 昨日新增数据表数为 1、数据库数为 1，存储量随同步数据累计
    tags:
      - 数据资产
      - 资产盘点

  - case_id: C0002
    title: 验证【数据资产】-【数据地图】新增周期同步任务同步数据表，数据表统计数量加一
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0002 VALUES (1, '记录一'), (2, '记录二');
      5) 记录同步前【数据表】统计数量 N
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 新增元数据同步周期任务，选择数据源 ${DataSourceA}、数据库 ${SchemaA} 与数据表 test_table_none_c0002，勾选【全部内容】并点击【临时同步】
        expected: 同步任务创建成功，任务状态为运行中
      - action: 等待任务实例运行完成
        expected: 实例状态变为运行成功
      - action: 查看数据地图首页【数据表】统计数量
        expected: 统计数量展示为 N+1，与同步前相差 1
      - action: 在数据地图中选择 test_table_none_c0002，点击【删除元表】并确认
        expected: 元表删除成功
      - action: 再次查看【数据表】统计数量
        expected: 统计数量恢复为 N
    tags:
      - 数据资产
      - 数据地图
      - 元数据同步

  - case_id: C0003
    title: 验证【数据资产】-【数据地图】运行离线建表任务，离线任务统计数量加一
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0003 VALUES (1, '记录一'), (2, '记录二');
      5) 离线平台存在项目 ${ProjectA} 与 SQL 建表任务 ${TaskA}，目标表为 ${SchemaA}.test_table_none_c0003
      6) 记录操作前【离线任务】统计数量 M
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 在离线平台项目 ${ProjectA} 中运行 SQL 建表任务 ${TaskA}
        expected: 任务实例运行成功
      - action: 查看数据地图首页【离线任务】统计数量
        expected: 统计数量展示为 M+1，与操作前相差 1
    tags:
      - 数据资产
      - 数据地图
      - 离线任务

  - case_id: C0004
    title: 验证【数据资产】-【数据地图】按资产类型与数据源等条件组合筛选，结果仅含匹配资产
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004_source_01 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0004_source_01 VALUES (1, 'order_1'), (2, 'order_2');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004_source_02 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0004_source_02 VALUES (3, 'other_1');
      5) 数据地图已同步 ${SchemaA}.test_table_none_c0004_source_01（负责人为 ${UserA}，表标签为「标签A」）与 ${SchemaA}.test_table_none_c0004_source_02（无表标签）
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 选择【查询结果类型】为【数据表】
        expected: 选择成功
      - action: 选择【数据源类型】为 Doris3.x
        expected: 下拉展示资产平台引入的全部数据源类型，选择成功
      - action: 选择【数据源】为 ${DataSourceA}
        expected: 下拉展示该类型下的全部数据源名称，选择成功
      - action: 选择【数据库】为 ${SchemaA}
        expected: 选择成功
      - action: 选择【负责人】为 ${UserA}
        expected: 选择成功
      - action: 选择【表标签】为「标签A」
        expected: 选择成功
      - action: 点击【筛选】
        expected: 结果列表仅展示同时满足全部条件的资产，无匹配数据时展示「暂无数据」缺省页
    tags:
      - 数据资产
      - 数据地图
      - 筛选

  - case_id: C0005
    title: 验证【数据资产】-【数据地图】打开表详情查看建表语句并复制执行，底层建表成功
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005 (id INT COMMENT '主键', name VARCHAR(255) COMMENT '姓名', info VARCHAR(255) COMMENT '信息');
         INSERT INTO ${SchemaA}.test_table_none_c0005 VALUES (1, 'one', 'desc 1'), (2, 'two', 'desc 2'), (3, 'three', 'desc 3');
      5) 数据地图已同步 ${SchemaA}.test_table_none_c0005
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 搜索并打开 ${SchemaA}.test_table_none_c0005 表详情
        expected: 详情页展示表基本信息与字段列表
      - action: 点击【建表语句】
        expected: 展示完整建表语句，字段与注释与前置建表语句一致
      - action: 复制建表语句，在 ${DataSourceA} 对应平台或底层执行
        expected: 执行成功
    tags:
      - 数据资产
      - 数据地图
      - 表详情

  - case_id: C0006
    title: 验证【数据资产】-【数据地图】打开表详情查看血缘关系，表级与字段级血缘展示正确
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建血缘基线表并写入前一日与当日分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006_source_01 (id INT COMMENT "用户ID", name VARCHAR(50) COMMENT "用户姓名") PARTITIONED BY (dt STRING);
         INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_01 PARTITION (dt = date_sub(current_date(), 1)) VALUES (1, '记录一');
         INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_01 PARTITION (dt = current_date()) VALUES (2, '记录二');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006_source_02 (id INT COMMENT "用户ID", name VARCHAR(50) COMMENT "用户姓名") PARTITIONED BY (dt STRING);
         INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_02 PARTITION (dt = date_sub(current_date(), 1)) VALUES (1, '记录一');
         INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_02 PARTITION (dt = current_date()) VALUES (2, '记录二');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006_source_03;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006_source_03 (id INT COMMENT "用户ID", name VARCHAR(50) COMMENT "用户姓名") PARTITIONED BY (dt STRING);
         INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_03 PARTITION (dt = date_sub(current_date(), 1)) VALUES (1, '记录一');
         INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_03 PARTITION (dt = current_date()) VALUES (2, '记录二');
      5) 当前离线项目 ${ProjectA} 已存在血缘 SQL 任务，覆盖以下血缘场景：
         样例一：INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_01 PARTITION (dt = date_sub(current_date(), 1)) SELECT id, name FROM ${SchemaA}.test_table_none_c0006_source_02 WHERE dt = date_sub(current_date(), 1);
         样例二：INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_01 PARTITION (dt = current_date()) SELECT id, name FROM ${SchemaA}.test_table_none_c0006_source_02 UNION ALL SELECT id, name FROM ${SchemaA}.test_table_none_c0006_source_03;
         样例三：INSERT INTO TABLE ${SchemaA}.test_table_none_c0006_source_01 PARTITION (dt = date_sub(current_date(), 1)) SELECT id, name FROM ${SchemaA}.test_table_none_c0006_source_02 WHERE id IN (SELECT id FROM ${SchemaA}.test_table_none_c0006_source_03 WHERE id > 0);
      6) 三张血缘基线表已同步至资产平台
      7) 血缘 SQL 覆盖 insert 查询、union all 与子查询三类血缘场景
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 打开 ${SchemaA}.test_table_none_c0006_source_01 的表详情并点击【血缘关系】
        expected: 展示【表级血缘】【字段级血缘】【展示文字信息】【资产类型】【导航器】【表按钮】等控件
      - action: 点击【表级血缘】
        expected: 展示当前表的上下游表
      - action: 右击血缘节点查看全链路血缘
        expected: 展示该节点的全链路血缘，文案为「每个节点都可右击查看该节点的全链路血缘」
      - action: 点击中央【表按钮】
        expected: 弹出表详情弹窗
      - action: 查看表详情弹窗内容
        expected: 展示「表名」「复制按钮」「技术属性模块」「业务属性模块」「字段信息」「非分区字段」「分区字段」「字段名称/字段中文名搜索框」
      - action: 输入存在的字段名称与字段中文名并点击搜索
        expected: 返回匹配的字段信息
      - action: 输入不存在的字段名称与字段中文名并点击搜索
        expected: 展示「暂无数据」
      - action: 点击分页并切换每页条数
        expected: 每页条数切换成功，数据展示与页码跳转正确
      - action: 点击【字段级血缘】
        expected: 展示当前表全部字段及血缘关系
      - action: 点击字段名称
        expected: 存在血缘字段时弹出字段血缘，无血缘字段时提示「字段血缘关系为空」
      - action: 点击【展示文字信息】
        expected: 展示当前表全名
      - action: 点击【居中】
        expected: 血缘图居中展示
      - action: 点击【放大】
        expected: 血缘图放大
      - action: 点击【放小】
        expected: 血缘图放小
      - action: 点击【下载】
        expected: 下载血缘 PNG 成功
      - action: 点击【展示/隐藏】
        expected: 导航器展示或隐藏
    tags:
      - 数据资产
      - 数据地图
      - 血缘关系

  - case_id: C0007
    title: 验证【数据资产】-【元数据同步】新增周期同步任务，任务列表展示同步任务且字段正确
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0007 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0007 VALUES (1, '记录一'), (2, '记录二');
    steps:
      - action: 进入【数据资产 → 元数据同步】页面
        expected: 进入成功
      - action: 点击【新增周期同步任务】
        expected: 打开新增周期同步任务弹窗
      - action: 选择数据源 ${DataSourceA}、数据库 ${SchemaA} 与数据表 test_table_none_c0007
        expected: 选择成功
      - action: 依次点击【添加】【下一步】【新增】
        expected: 「新增周期同步任务」成功，任务列表展示该同步任务且字段信息正确
      - action: 打开任务详情并查看同步状态
        expected: 同步状态页面展示数据表、库与状态字段信息
