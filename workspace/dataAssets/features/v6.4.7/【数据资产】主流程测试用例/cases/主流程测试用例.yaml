      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0008 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0008 VALUES (1, '记录一'), (2, '记录二');
      5) 该表已同步至资产平台
    steps:
      - action: 进入【数据资产 → 元模型管理】页面
        expected: 进入成功
      - action: 新增属性，属性类型为「枚举」，填写表单内容并点击【确定】
