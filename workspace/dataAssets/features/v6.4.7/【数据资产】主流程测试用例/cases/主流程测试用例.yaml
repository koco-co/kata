  - case_id: C0011
    title: 验证【数据资产】-【元数据管理】配置数据源与库生命周期并同步数据表，表生命周期取配置值
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0011_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0011_source_01 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaA}.test_table_none_c0011_source_01 VALUES (1, '记录一'), (2, '记录二');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：Doris3.x
      7) 数据源 B 存在数据库：${SchemaB}
      8) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0011_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0011_source_02 (id BIGINT, name VARCHAR(50));
         INSERT INTO ${SchemaB}.test_table_none_c0011_source_02 VALUES (1, '记录一'), (2, '记录二');
      9) 授权数据源 C：${DataSourceC}
      10) 数据源 C 类型：Doris3.x
      11) 数据源 C 存在数据库：${SchemaC}
      12) 创建数据表并插入记录：
          DROP TABLE IF EXISTS ${SchemaC}.test_table_none_c0011_source_03;
          CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_none_c0011_source_03 (id BIGINT, name VARCHAR(50));
          INSERT INTO ${SchemaC}.test_table_none_c0011_source_03 VALUES (1, '记录一'), (2, '记录二');
      13) 三张表均未同步至资产平台，${DataSourceB} 生命周期已配置为 3 天且 ${SchemaB} 未配置
      14) ${DataSourceC} 未配置生命周期且 ${SchemaC} 生命周期已配置为 10 天
