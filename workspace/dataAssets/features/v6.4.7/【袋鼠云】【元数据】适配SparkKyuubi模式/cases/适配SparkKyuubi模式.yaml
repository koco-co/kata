  - action: 新增「元数据同步任务」，选择spark的数据源，选择库表，库表选择情况见前置条件，点击「临时运行」
    expected: 新增一条元数据同步实例，运行中
  - action: 结束后查看同步结果
    expected: 同步成功，同步结果与前置结果一致
  - action: 进入数据地图首页查看
    expected: 数据源类型表数量及数据表数量统计新增正确
