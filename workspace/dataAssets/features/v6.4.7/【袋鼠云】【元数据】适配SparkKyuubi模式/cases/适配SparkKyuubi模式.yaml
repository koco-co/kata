cases:
  - case_id: C0001
    title: 验证【元数据】-【血缘解析】运行 SQL 任务后打开血缘详情，表级与字段级血缘完整展示
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Kyuubi
      3) 存在数据库：${SchemaA}
      4) Kyuubi 数据源「${DataSourceA}」类型为 Kyuubi，数据库为「${SchemaA}」
      5) 创建源表和目标表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001_source;
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001_target;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001_source (id BIGINT, name STRING, amount DECIMAL(10,2));
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001_target (id BIGINT, name STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0001_source SELECT id, CONCAT('name_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)) FROM range(1, 4);
      6) 离线项目「${ProjectA}」已引入 ${DataSourceA}
    steps:
      - action: 进入【元数据 → 血缘解析】页面
        expected: 进入成功
      - action: 在离线项目「${ProjectA}」创建 SQL 任务，执行 `INSERT INTO ${SchemaA}.test_table_none_c0001_target SELECT id, name, amount FROM ${SchemaA}.test_table_none_c0001_source`
        expected: SQL 任务状态为「运行完成」
      - action: 打开目标表的血缘详情
        expected: 表级血缘展示 source 到 target 的上游关系，字段级血缘展示 id、name、amount 一一对应
    tags:
      - 元数据
      - 血缘解析
      - Kyuubi

  - case_id: C0002
    title: 验证【元数据】-【数据地图】执行建视图 SQL 后搜索视图，血缘指向源表且字段对应
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Kyuubi
      3) 存在数据库：${SchemaA}
      4) 创建源表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0002 VALUES (1, '记录一'), (2, '记录二');
      5) 离线项目「${ProjectA}」已引入 ${DataSourceA}
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 在离线项目执行 `CREATE VIEW ${SchemaA}.test_view_kyuubi_c0002 AS SELECT id, name FROM ${SchemaA}.test_table_none_c0002`
        expected: SQL 任务状态为「运行完成」
      - action: 搜索视图「test_view_kyuubi_c0002」并打开血缘详情
        expected: 资产类型为「视图」，表级血缘指向源表，字段级血缘包含 id、name
    tags:
      - 元数据
      - 数据地图
      - 视图血缘

  - case_id: C0003
    title: 验证【元数据】-【数据地图】离线建表后搜索表，资产列表新增记录且详情字段正确
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Kyuubi
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0003 VALUES (1, '记录一'), (2, '记录二');
      5) 离线项目「${ProjectA}」已引入 ${DataSourceA}
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 在离线项目执行 `CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (id BIGINT, name STRING)`
        expected: SQL 任务状态为「运行完成」
      - action: 在数据地图搜索「test_table_none_c0003」
        expected: 搜索结果新增 1 条数据表资产，资产类型为「数据表」
      - action: 打开表详情
        expected: 基本信息展示数据源 ${DataSourceA}、数据库 ${SchemaA} 和字段 id、name
    tags:
      - 元数据
      - 数据地图
      - 自动同步

  - case_id: C0004
    title: 验证【元数据】-【元数据同步】新增周期同步任务并立即同步，表字段与元数据一致
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Kyuubi
      3) 存在数据库：${SchemaA}
      4) ${DataSourceA} 类型为 Kyuubi，数据库为「${SchemaA}」
      5) 创建全类型字段表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004 (id BIGINT, amount DECIMAL(10,2), name STRING, event_date DATE, event_time TIMESTAMP, is_valid BOOLEAN);
         INSERT INTO ${SchemaA}.test_table_none_c0004 VALUES (1, 10.00, '甲', '2026-08-01', '2026-08-01 10:00:00', TRUE), (2, 20.00, '乙', '2026-08-02', '2026-08-02 10:00:00', TRUE), (3, 30.00, '丙', '2026-08-03', '2026-08-03 10:00:00', FALSE);
      6) 字段数量为 6
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: 点击【新增周期同步任务】，选择 ${DataSourceA}、${SchemaA} 和 test_table_none_c0004，点击【添加】和【下一步】
        expected: 调度配置回显数据源、数据库和数据表，字段数量为 6
      - action: 选择每天执行并点击【新增】
        expected: Toast提示:「新增成功」，任务列表新增同步任务
      - action: 点击任务【立即同步】并打开表详情
        expected: 同步实例状态为「同步完成」，字段名称和类型与表结构一致
    tags:
      - 元数据
      - 元数据同步
      - 全类型字段

  - case_id: C0005
    title: 验证【元数据】-【元数据同步】按表名过滤临时运行，仅匹配表生成资产
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Kyuubi
      3) 存在数据库：${SchemaA}
      4) 创建 3 张表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005_source;
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005_target;
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005_dimension_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005_source (id BIGINT, name STRING);
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005_target (id BIGINT, name STRING);
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005_dimension_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0005_source VALUES (1, 'a');
         INSERT INTO ${SchemaA}.test_table_none_c0005_target VALUES (1, 'b');
         INSERT INTO ${SchemaA}.test_table_none_c0005_dimension_01 VALUES (1, 'c');
      5) ${DataSourceA} 已引入数据资产
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: 点击【临时运行】，选择 ${DataSourceA}、数据库 ${SchemaA}、表过滤条件 `test_table_.*`
        expected: 临时运行表单展示过滤条件，匹配表为 test_table_none_c0005_source 和 test_table_none_c0005_target
      - action: 点击【运行】并查看同步实例
        expected: 新增 1 条临时同步实例，实例状态从「运行中」变为「同步完成」
      - action: 在数据地图搜索 3 张表
        expected: 两张 test_table 表存在资产，archive_table 表不在本次同步实例中
    tags:
      - 元数据
      - 元数据同步
      - 临时运行
      - 表过滤

  - case_id: C0006
    title: 验证【数据质量】-【规则任务配置】多规则包弱规则表行数不通过，实例校验异常且明细完整
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Kyuubi
      3) 存在数据库：${SchemaA}
      4) 创建表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006 (id BIGINT, name STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0006 VALUES (1, '甲', 10.00), (2, '乙', 20.00), (3, '丙', 30.00);
      5) 数据质量规则任务「TaskF」已绑定离线周期任务，表行数期望值为 4，规则强弱为「弱规则」
      6) 离线周期任务「TaskG」包含 3 个规则包
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 打开「TaskF」并查看绑定的离线周期任务
        expected: 规则任务展示离线周期任务名称和 3 个规则包
      - action: 进入【离线开发 → 运维中心 → 周期任务实例】页面
        expected: 进入成功
      - action: 打开「TaskG」最新实例
        expected: 离线周期任务状态为「运行完成」，规则任务实例状态为「校验异常」
      - action: 查看规则结果
        expected: 表行数实际值为 3，期望值为 4，未通过明细包含 3 条记录
    tags:
      - 数据质量
      - 规则任务配置
      - 离线联动
      - 失败结果

