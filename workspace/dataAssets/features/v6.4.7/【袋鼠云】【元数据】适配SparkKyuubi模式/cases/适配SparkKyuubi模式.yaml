    expected: 存在元数据同步选择的表，表信息正确
  precondition: '样例一：全部数据库



    样例二：数据库test-全部表



    样例三：数据库test-表demo、demo1



    样例四：数据库test-表demo



    样例五：数据库test-全部表，过滤表demo.*



    同步结果：



    样例一：同步所选数据源下的所有数据库下的所有表



    样例二：同步数据库test下的所有表



    样例三：只同步数据库下的表demo、demo1



    样例四：只同步数据库下的表demo



    样例五：同步数据库下的除去demo开头的所有表'
- case_id: C0006
  title: 验证质量和离线绑定，多规则包-【表行数-弱规则-校验不通过】-校验结果与预期记录一致
  priority: P1
  steps:
  - action: 进入【元数据 → 校验不通过】页面
    expected: 已进入【元数据 → 校验不通过】页面，显示页面标题与主要操作区域
  - action: 进入【元数据 → 联动】页面
    expected: 已进入【元数据 → 联动】页面，显示页面标题与主要操作区域
  - action: 进入「数据资产-数据质量」，新建单表校验，选择表doris2 规则：选择表行数，固定值>3,弱规则。再任意添加其他两种类型的规则，使校验通过 调度：自动关联离线调度周期。规则包个数3 绑定任务：前置条件doris2doris
    expected: 新建成功
  - action: 等待离线周期实例运行，进入「数据资产-数据质量-任务实例查询」
    expected: '1） 页面生成一条实例，校验未通过

      2） 查看明细展示doris1中的三条数据'
  - action: 进入「离线开发-运维中心-周期任务实例」
    expected: 离线任务运行成功
  - action: 进入「离线开发-运维中心-周期任务」，对doris2doris任务补当前数据及下游，查看结果
    expected: '1） 补数据质量工作流中有3个规则包，任务都运行成功

      2） 质量生成一条实例，校验未通过'
  precondition: '1、 doris数据源已存在表

    建表语句：

    drop table if exists doris1;

    CREATE TABLE IF NOT EXISTS doris_demo_data_types_source (

    user_id BIGINT COMMENT “用户ID“,

    created_date DATE COMMENT “创建日期“,

    name VARCHAR(50) COMMENT “姓名“,

    age TINYINT COMMENT “年龄“,

    status SMALLINT COMMENT “状态码“,

    price DECIMAL(10, 2) COMMENT “价格“,

    weight FLOAT COMMENT “重量“,

    rating DOUBLE COMMENT “评分“,

    description STRING COMMENT “描述信息“,

    gender VARCHAR(10) COMMENT “性别“,

    department VARCHAR(20) COMMENT “部门“,

    created_time DATETIME COMMENT “创建时间“,

    birth_date DATE COMMENT “出生日期“,

    is_active BOOLEAN COMMENT “是否激活“,

    tags VARCHAR(100) COMMENT “标签“,

    total_amount BIGINT COMMENT “总金额“,

    order_count INT COMMENT “订单数量“

    )

    ENGINE=olap

    DUPLICATE KEY(user_id, created_date, name)

    DISTRIBUTED BY HASH(user_id) BUCKETS 10

    PROPERTIES (

    “replication_num“ = “1“

    );


    -- 插入示例数据

    INSERT INTO doris1 VALUES

    (

    1001, ''2024-01-15'', ''张三'', 25, 1,

    99. 99, 65.5, 4.5,

    ''技术部员工'', ''男'', ''技术部'',

