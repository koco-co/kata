  - case_id: C0008
    title: 验证【数据质量】-【规则任务配置】单规则包弱规则表行数不通过，差异明细正确
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Kyuubi
      3) 存在数据库：${SchemaA}
      4) 创建源表和对比表并插入记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0008_source;
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0008_comparison;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0008_source (id BIGINT, amount DECIMAL(10,2));
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0008_comparison (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0008_source VALUES (1, 10.00), (2, 20.00);
         INSERT INTO ${SchemaA}.test_table_none_c0008_comparison VALUES (1, 10.00), (2, 21.00);
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建多表一致性规则，源表选择 test_table_none_c0008_source，对比表选择 test_table_none_c0008_comparison，主键选择 id
        expected: 规则配置展示源表、对比表、主键 id 和比对字段 amount
      - action: 保存任务并立即执行
        expected: 最新实例状态为「校验异常」，差异记录数量为 1
      - action: 查看差异明细
        expected: 明细展示 id=2，源表 amount=20.00，对比表 amount=21.00
    tags:
      - 数据质量
      - 规则任务配置
      - 多表一致性

