      - action: 点击【新增】按钮
        expected: 进入【数据权限分配-新增权限策略】页面
      - action: 点击【数据源】下拉框
        expected: 下拉项支持选择trino数据源：trino_test
      - action: 选择trino数据源
        expected: 右侧显示【catalog】配置下拉框
      - action: 点击【catalog】下拉框
        expected: 显示trino数据源内所有catalog：catalog1、catalog2
