  - case_id: C0009
    title: 验证【管理员】-【资产-数据安全-数据权限管理-新增权限策略】-【trino数据源】-新增功能正确
    priority: P0
    steps:
      - action: 选择【数据源】：trino_test； 选择【catalog】：catalog1； 选择【数据库】：schema1； 选择【数据表】：table1
        expected: 选择成功
      - action: 选择【DQL】
        expected: 下方显示【有效期】、【是否开启行列权限配置】
      - action: 【有效期】默认永久，【是否开启行列权限配置】默认不开启，选择【用户】为tytest，点击【新增】按钮
        expected: 提示“新增成功”，自动切回【权限分配】页面
      - action: 查看【权限分配】页面列表
