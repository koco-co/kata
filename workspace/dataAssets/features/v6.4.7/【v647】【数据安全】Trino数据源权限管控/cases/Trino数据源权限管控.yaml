      - action: 选择【数据源】：trino_test； 选择【catalog】：catalog1； 选择【数据库】：schema1； 选择【数据表】：table1
        expected: 选择成功
      - action: 鼠标悬浮【表级权限】处的“？”
        expected: 显示为：“hive、sparkthrift、starrocks、doris、trino、inceptor类型数据源配置权限信息后可在离线开发平台生效，其他类型数据源配置权限信息后仅在资产平台生效”
      - action: 查看【表级权限】下拉框
        expected: 包含【DML】、【DQL】、【DDL】，仅可选择【DQL】，其余两个置灰不可选
