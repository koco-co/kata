meta:
  title: Trino数据源权限管控
  version: v6.4.7
  feature_id: v6.4.7/【v647】【数据安全】Trino数据源权限管控
cases:
  - case_id: C0001
    title: 验证【资产-数据安全-数据权限管理-权限回收】-【trino数据源】权限回收功能正确
    priority: P2
    steps:
      - action: 选中trino_test，点击【权限回收】按钮
        expected: 权限回收成功
      - action: 切换用户tytest1，打开【资产-元数据-数据地图-数据表table1】，查看数据预览
        expected: 不支持查看
      - action: 打开【离线开发】，查询trino表table1
        expected: 不支持查询
    precondition: |-
      1、【权限分配】列表已存在trino数据源的权限行：
      数据源：trino_test；
      数据库：schema1；
      数据表：table1
      2、管理员已进入【资产-数据安全-数据权限管理-权限回收】页面
      3、存在访客用户：tytest1
    tags:
      - 未分类
      - 未分类
