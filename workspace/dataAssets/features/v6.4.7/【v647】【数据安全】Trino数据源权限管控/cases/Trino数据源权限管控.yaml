  - case_id: C0004
    title: 验证【开发用户】-【资产-数据安全-我的权限查看】页面UI正确
    priority: P2
    steps:
      - action: 登录ty用户账密，进入【资产-数据安全-我的权限查看】页面
        expected: 页面正常打开
      - action: 查看页面
        expected: 从上往下依次显示为： 1）查询配置区域：数据表输入框、数据源类型下拉框、数据源下拉框、数据库下拉框、负责人、表权限下拉框、【重置】&【查询】按钮 2）数据权限列表：表名、表中文名、所属数据源、catalog、所属数据库、表负责人、表权限、列级权限、行级权限
    precondition: |-
      1、平台存在trino数据源：trino_test
      2、trino数据源内存在catalog：catalog1、catalog2
      3、该数据源-catalog1下存在数据库：schema1
      4、schema1下存在数据表table1
      5、管理员已进入【资产-数据安全-数据权限管理-新增权限策略】页面
      6、平台已存在身份为数据开发的用户：ty
    tags:
      - 未分类
      - 未分类
  - case_id: C0005
    title: 验证【开发用户】-【资产-元数据-数据地图-数据表】-【权限申请】-【trino数据源】配置功能正确
    priority: P0
    steps:
      - action: 登录ty用户账密，进入【资产-元数据-数据地图】页面
        expected: 页面正常打开
      - action: 选择trino数据表：table1，点击【批量申请权限】
        expected: 抽屉式展开表权限申请页
      - action: 鼠标悬浮【表级权限】处的“？”
        expected: 提示：“hive、sparkthrift、starrocks、doris、trino、inceptor类型数据源配置权限信息后可在离线开发平台生效，其他类型数据源配置权限信息后仅在资产平台生效”
      - action: 查看【权限】区域
        expected: 显示DQL、DML、DDL，仅支持勾选DQL
      - action: 【权限】勾选DQL，【行列权限配置】开启行列级，配置【行列权限】为schema1-table1-字段1&字段2；【有效期】默认为永久，【申请原因】输入test，点击【确定】
        expected: 配置成功
      - action: 打开【资产-元数据-数据地图-数据表table1】，查看数据预览
        expected: 1）支持查看表table1的字段 2）只支持显示字段1和字段2的数据
      - action: 打开【数据质量】，新建规则任务，选择trino_test-catalog1-schema1-table1，查看数据预览
        expected: 1）支持数据预览 2）只有字段1和字段2的数据显示
      - action: 切换至【离线开发】，查询trino表table1
        expected: 支持查询，结果为行列级：table1：字段1和字段2
    precondition: |-
      1、平台存在trino数据源：trino_test
      2、trino数据源内存在catalog：catalog1、catalog2
      3、该数据源-catalog1下存在数据库：schema1
      4、schema1下存在数据表table1
      5、管理员已进入【资产-数据安全-数据权限管理-新增权限策略】页面
      6、平台已存在身份为数据开发的用户：ty
    tags:
      - 未分类
      - 未分类
  - case_id: C0006
    title: 验证【管理员】-【公共管理-审批中心-我已审批-元数据资产-表权限申请】-【审批详情】正确
    priority: P2
    steps:
      - action: 管理员切换至【公共管理-审批中心】页
        expected: 【公共管理-审批中心】页正常打开
      - action: 点击【我已审批-元数据资产】tab页
        expected: 页面正常打开，显示已审批的trino数据源的表权限申请
      - action: 点击【审批详情】按钮
        expected: 抽屉展开表权限申请详情
      - action: 查看详情
        expected: 包含所属租户、申请时间、表名称、表类型、数据源、catalog、数据库、有效期、权限详情、审批流程
    precondition: 1、资产平台发起trino数据源的表权限申请已审批
    tags:
      - 未分类
      - 未分类
  - case_id: C0007
    title: 验证【管理员】-【公共管理-审批中心-待我审批-元数据资产-表权限申请】-【审批】正确
    priority: P2
    steps:
      - action: 管理员切换至【公共管理-审批中心】页
        expected: 【公共管理-审批中心】页正常打开
      - action: 点击【待我审批-元数据资产】tab页
        expected: 页面正常打开，显示trino数据源的表权限申请
      - action: 点击【审批】按钮
        expected: 抽屉展开表权限申请详情
      - action: 查看详情
        expected: 包含所属租户、申请时间、表名称、表类型、数据源、catalog、数据库、有效期、权限详情、审批流程、【拒绝】&【通过】按钮
      - action: 点击【通过】按钮
        expected: 该表权限申请成功通过
    precondition: 1、资产平台已发起trino数据源的表权限申请
    tags:
      - 未分类
      - 未分类
  - case_id: C0008
    title: 验证【管理员】-【资产-数据安全-数据权限管理-权限回收】页面UI正确
    priority: P2
    steps:
      - action: 点击【权限回收】tab
        expected: 【权限回收】tab页正常打开
      - action: 查看页面
        expected: 从上往下依次显示为： 1）查询配置区域：数据源下拉框、数据库下拉框、数据表输入框、表权限下拉框、申请人输入框、【重置】&【查询】按钮 2）数据权限列表：申请人、数据源、catalog、数据库、数据表、表权限、有效期、状态、审批时间、操作 3）catalog无内容时显示为“--”，操作为“权限回收”，已回收内容置灰显示
    precondition: |-
      1、平台存在trino数据源：trino_test
      2、trino数据源内存在catalog：catalog1、catalog2
      3、该数据源-catalog1下存在数据库：schema1
      4、schema1下存在数据表table1
      5、管理员已进入【资产-数据安全-数据权限管理】页面
    tags:
