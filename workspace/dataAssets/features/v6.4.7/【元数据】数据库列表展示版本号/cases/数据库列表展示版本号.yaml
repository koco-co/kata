cases:
  - case_id: C0001
    title: 验证「元数据管理」页面，「导出元数据」的文件中，「版本号」正常展示的功能
    priority: P0
    steps:
      - action: 进入「元数据-元数据管理」页面
        expected: 页面正常打开
      - action: 查看页面信息展示
        expected: 「hive、sparkthrift、trino、mysql、oracle、sqlserver、达梦、PostgreSQL、doris」数据源的版本号正常展示
    precondition: |-
      1、 进入元数据-元数据管理页面
      2、 资产成功引入以下数据源：
      hive、sparkthrift、trino、mysql、oracle、sqlserver、达梦、PostgreSQL、doris
    tags:
      - 未分类
      - 未分类
