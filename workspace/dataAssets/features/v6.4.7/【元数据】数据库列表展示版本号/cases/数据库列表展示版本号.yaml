meta:
  title: 数据库列表展示版本号
  feature_id: metadata-database-version-display
  project_id: data-assets
  case_module_id: ""
  exports:
    - 数据库列表展示版本号.xmind
cases:
  - case_id: C0001
    title: 验证【元数据】-【元数据管理】导出元数据文件并核对版本号列，九种数据源版本号与底层一致
    priority: P0
    precondition: |-
      1) 元数据管理已引入Hive数据源「${DataSourceA}」，底层版本号记录为「${HiveVersion}」
      2) 元数据管理已引入SparkThrift数据源「${DataSourceB}」，底层版本号记录为「${SparkVersion}」
      3) 元数据管理已引入Trino数据源「${DataSourceC}」，底层版本号记录为「${TrinoVersion}」
      4) 元数据管理已引入MySQL数据源「${DataSourceD}」，底层版本号记录为「${MySQLVersion}」
      5) 元数据管理已引入Oracle数据源「${DataSourceE}」，底层版本号记录为「${OracleVersion}」
      6) 元数据管理已引入SQL Server数据源「${DataSourceF}」，底层版本号记录为「${SQLServerVersion}」
      7) 元数据管理已引入DM数据源「${DataSourceG}」，底层版本号记录为「${DMVersion}」
      8) 元数据管理已引入PostgreSQL数据源「${DataSourceH}」，底层版本号记录为「${PostgreSQLVersion}」
      9) 元数据管理已引入Doris数据源「${DataSourceI}」，底层版本号记录为「${DorisVersion}」
    steps:
      - action: 进入【元数据 → 元数据管理】页面
        expected: 进入成功
      - action: 查看九条数据源记录
        expected: 列表展示九条记录
      - action: 核对版本号列
        expected: 九条记录均展示非空版本号，取值分别等于对应前置条件中的底层版本号
    tags:
      - 元数据
      - 元数据管理
      - 版本号

