meta:
  title: 【数据质量】质量校验不通过时支持发送邮件，邮件信息需要包含未通过的明细数据
  requirement_id: "15602"
  case_module_id: "10307"
  exports:
    - 校验失败邮件通知含明细数据.xmind
cases:
  - case_id: C0001
    title: 验证编辑规则集修改「是否发送明细数据」后功能正确
    priority: P0
    steps:
      - action: 进入【数据质量 → 规则集】页面
        expected: 已进入【数据质量 → 规则集】页面，显示页面标题与主要操作区域
      - action: 进入【数据资产】-【数据质量】-【规则任务配置】页面
        expected: 成功进入【规则任务配置】页面，页面内容正常加载显示，无报错
      - action: 选择规则A，点击【编辑调度属性】按钮
        expected: 弹出「编辑调度属性」弹窗
      - action: 在「是否发送明细数据」字段选择「是」
        expected: 「是否发送明细数据」修改为「是」，选项高亮显示
      - action: 点击【保存】按钮
        expected: 保存成功，系统给出成功反馈
      - action: 选择规则A，点击【立即运行】按钮，等待任务执行完成
        expected: 任务执行完成，校验结果为「不通过」
      - action: 登录用户A邮箱，查看收到的告警邮件
        expected: ZIP附件命名为「不符合规则的明细数据」，解压后包含Excel文件，每个校验不通过的规则生成一个Excel，命名格式为「{规则名称}.xlsx」
    precondition: |-
      | 已存在单表校验规则A，告警配置如下：
      - 告警方式：邮箱
      - 是否发送明细数据：否
      - 告警接收人：用户A
      数据表包含不符合规则的数据
    tags:
      - 规则集
  - case_id: C0002
    title: 验证编辑规则集-告警配置回显「是否发送明细数据」正确
    priority: P1
    steps:
      - action: 进入【数据质量 → 规则集】页面
        expected: 已进入【数据质量 → 规则集】页面，显示页面标题与主要操作区域
      - action: 进入【数据资产】-【数据质量】-【规则任务配置】页面
        expected: 成功进入【规则任务配置】页面，页面内容正常加载显示，无报错
      - action: 选择规则集C，点击右上角【…】-【编辑】按钮
        expected: 进入规则集编辑页面
      - action: 点击【下一步】按钮进入「调度配置」页面
        expected: 成功进入「调度配置」页面
      - action: 查看「告警配置」区域「是否发送明细数据」回显内容
        expected: 「是否发送明细数据」回显为「是」，与原配置一致
    precondition: |-
      | 已存在规则集C，告警配置如下：
      - 告警方式：邮箱
      - 是否发送明细数据：是
      - 告警接收人：用户C
    tags:
      - 规则集
  - case_id: C0003
    title: 验证规则集脏数据存储关闭时不发送明细数据附件
    priority: P1
    steps:
      - action: 进入【数据质量 → 规则集】页面
        expected: 已进入【数据质量 → 规则集】页面，显示页面标题与主要操作区域
      - action: 进入【数据质量】-【脏数据管理】页面
        expected: 成功进入【数据源管理】页面
      - action: 选择${datasource}数据源，确认脏数据存储状态为「关闭」
        expected: ${datasource}数据源脏数据存储状态为「关闭」
      - action: 进入【数据资产】-【数据质量】-【规则任务配置】页面
        expected: 成功进入【规则任务配置】页面
      - action: 新建规则集，配置基础信息并导入规则集文件，使规则校验不通过
        expected: 规则集配置成功
      - action: 在「告警配置」区域勾选「邮箱」告警方式，在「是否发送明细数据」字段选择「是」，选择告警接收人为用户A
        expected: 告警配置成功
      - action: 保存规则集并立即运行，等待任务执行完成
        expected: 任务执行完成，校验结果为「不通过」
      - action: 登录用户A邮箱，查看收到的告警邮件
        expected: 用户A收到告警邮件，邮件内容为文本告警信息，不包含明细数据附件
    precondition: |-
      | 数据源中心已添加${datasource}数据源并授权给资产平台，且已关闭脏数据存储
      已配置邮箱告警通道
      已存在用户A（邮箱已配置）
    tags:
      - 规则集
