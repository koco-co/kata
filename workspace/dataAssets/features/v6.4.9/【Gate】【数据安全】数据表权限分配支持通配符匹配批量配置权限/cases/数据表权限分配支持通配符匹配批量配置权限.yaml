meta:
  title: 数据表权限分配支持通配符匹配批量配置权限
  feature_id: security-wildcard-table-permissions
  requirement_id: "15648"
  case_module_id: ""
  exports:
    - 数据表权限分配支持通配符匹配批量配置权限.xmind
cases:
  - case_id: C0001
    title: 验证【数据安全】-【数据表权限】仅勾选DDL权限新增策略，行列权限配置开关不展示
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0001 (id BIGINT, name STRING, dept STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0001 VALUES (1, 'user1', 'rd'), (2, 'user2', 'mkt');
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 权限分配】页面
        expected: 进入成功
      - action: 点击【新增】，选择 ${DataSourceA}、${SchemaA}、test_table_15648_c0001，仅勾选表级权限「DDL」
        expected: 「DDL」为选中状态，「DQL」「DML」为未选中状态
      - action: 查看权限配置区域
        expected: 「是否开启行列权限配置」开关不展示
    tags:
      - 数据安全
      - 数据权限管理
      - 权限分配
      - DDL

  - case_id: C0002
    title: 验证【数据安全】-【数据表权限】配置行列权限并预览数据，列级过滤与行级条件均生效
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并写入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0002 (id BIGINT, name STRING, dept STRING, salary BIGINT);
         INSERT INTO ${SchemaA}.test_table_15648_c0002 VALUES (1, 'user1', 'rd', 100), (2, 'user2', 'mkt', 200), (3, 'user3', 'rd', 300);
      5) 权限策略已分配给用户「UserA」，表级权限为「DQL」，列权限为 id、name、dept，行条件为 dept='rd'
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 权限分配】页面
        expected: 进入成功
      - action: 打开 UserA 的权限策略，查看行列权限配置
        expected: 列权限选中 id、name、dept，salary 未选中，行条件显示 dept='rd'
      - action: 使用用户「UserA」进入【元数据 → 数据目录 → 数据表】页面并预览 test_table_15648_c0002
        expected: 预览仅展示 id、name、dept 三列及 id=1、id=3 两行，不展示 salary 和 id=2
    tags:
      - 数据安全
      - 数据权限管理
      - 权限分配
      - 行列权限

  - case_id: C0003
    title: 验证【数据安全】-【数据表权限】按无匹配通配符筛选权限，我的权限列表展示空状态
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0003 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0003 VALUES (1, 'user1');
      5) ${SchemaA} 下不存在名称以 xyz_nonexist 开头的数据表
      6) 用户「UserA」的权限策略匹配表名为 xyz_nonexist*，表级权限为「DQL」
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 我的权限查看】页面
        expected: 进入成功
      - action: 使用用户「UserA」筛选数据源 ${DataSourceA}、数据库 ${SchemaA}
        expected: 数据表列表为空，页面展示「暂无数据」
      - action: 刷新页面
        expected: 页面仍展示「暂无数据」，不出现错误提示
    tags:
      - 数据安全
      - 数据权限管理
      - 我的权限查看
      - 通配符

  - case_id: C0004
    title: 验证【数据安全】-【数据表权限】新建匹配通配符的数据表，权限自动生效
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0004 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0004 VALUES (1, 'user1');
      5) 用户「UserA」的权限策略匹配表名为 test_table_15648_c0004*，表级权限为「DQL」
      6) ${SchemaA} 中不存在 test_table_15648_c0004_new
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 我的权限查看】页面
        expected: 进入成功
      - action: 使用管理员账号在 ${DataSourceA}.${SchemaA} 创建数据表 test_table_15648_c0004_new
        expected: Toast提示:「创建成功」，test_table_15648_c0004_new 出现在数据表列表
      - action: 使用用户「UserA」刷新我的权限查看页面
        expected: 权限列表新增 test_table_15648_c0004_new，表级权限包含「DQL」，无需新增策略
    tags:
      - 数据安全
      - 数据权限管理
      - 我的权限查看
      - 通配符

  - case_id: C0005
    title: 验证【数据安全】-【数据表权限】使用通配符批量配置权限，我的权限列表批量生效
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建两张数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0005_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0005_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0005_source_01 VALUES (1, 'user1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0005_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0005_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0005_source_02 VALUES (1, 'user2');
      5) 用户「UserA」当前没有这两张表的权限策略
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 权限分配】页面
        expected: 进入成功
      - action: 点击【新增】，选择 ${DataSourceA}、${SchemaA}，表名输入 test_table_15648_c0005_source_*，勾选表级权限「DQL」「DML」并保存
        expected: Toast提示:「保存成功」，策略列表新增表名 test_table_15648_c0005_source_*，表级权限显示 DQL、DML
      - action: 进入【数据安全 → 数据权限管理 → 我的权限查看】页面查看 UserA
        expected: 权限列表包含 test_table_15648_c0005_source_01、test_table_15648_c0005_source_02，两张表均显示 DQL、DML
    tags:
      - 数据安全
      - 数据权限管理
      - 权限分配
      - 通配符

  - case_id: C0006
    title: 验证【数据安全】-【数据表权限】新增策略选择生效对象，用户与用户组互斥选择
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0006 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0006 VALUES (1, 'user1');
      5) 用户「UserA」和用户组「UserGroupA」均已存在
      6) ${DataSourceA}.${SchemaA}.test_table_15648_c0006 已设置权限策略
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 权限分配】页面
        expected: 进入成功
      - action: 点击【新增】，在权限生效用户中选择用户「UserA」
        expected: 用户选择框显示 UserA，用户组选择框置灰禁用
      - action: 清空用户并选择用户组「UserGroupA」
        expected: 用户选择框置灰禁用，生效对象仅显示 UserGroupA
    tags:
      - 数据安全
      - 数据权限管理
      - 权限分配
      - 用户与用户组

  - case_id: C0007
    title: 验证【数据安全】-【数据表权限】按数据库与表通配符筛选权限，匹配记录正确展示
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}、${SchemaA1}
      4) ${SchemaA} 下创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0007_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0007_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0007_source_01 VALUES (1, 'user1');
      5) ${SchemaA1} 下创建数据表：
         DROP TABLE IF EXISTS ${SchemaA1}.test_table_15648_c0007_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA1}.test_table_15648_c0007_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA1}.test_table_15648_c0007_source_02 VALUES (1, 'user2');
      6) 用户「UserA」的策略数据库通配符「${SchemaA}*」可匹配 ${SchemaA}、${SchemaA1}，表名通配符 test_table_15648_c0007_source_* 可匹配两张表
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 我的权限查看】页面
        expected: 进入成功
      - action: 使用用户「UserA」筛选 ${DataSourceA}，数据库输入通配符「${SchemaA}*」
        expected: 权限列表展示 ${SchemaA}.test_table_15648_c0007_source_01 和 ${SchemaA1}.test_table_15648_c0007_source_02
      - action: 查看两条权限记录
        expected: 两条记录的数据库均匹配「${SchemaA}*」，数据表均匹配 test_table_15648_c0007_source_*
    tags:
      - 数据安全
      - 数据权限管理
      - 我的权限查看
      - 通配符

  - case_id: C0008
    title: 验证【数据安全】-【数据表权限】编辑策略表名通配符，生效表列表同步更新
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建两张数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0008_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0008_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0008_source_01 VALUES (1, 'user1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0008_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0008_source_02 (id BIGINT, order_id STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0008_source_02 VALUES (1, 'O1');
      5) 用户「UserA」已有策略表名为 test_table_15648_c0008_source_*，表级权限为「DQL」
    steps:
