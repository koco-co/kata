  - case_id: C0015
    title: 验证【数据安全】-【数据表权限】按数据源筛选权限列表，重置后恢复全部记录
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0015_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0015_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0015_source_01 VALUES (1, 'user1');
      5) 授权数据源：${DataSourceB}
      6) 数据源类型：Doris3.x
      7) 存在数据库：${SchemaB}
      8) 创建数据表：
