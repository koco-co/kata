        expected: test_table_15648_c0010 权限记录显示有效期「永久」，状态为「生效」
    tags:
      - 数据安全
      - 数据权限管理
      - 权限分配
      - 有效期

  - case_id: C0011
    title: 验证【数据安全】-【数据表权限】策略有效期到期，权限状态变为已失效
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0011;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0011 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0011 VALUES (1, 'user1');
      5) 用户「UserA」策略 test_table_15648_c0011* 有效期截止 2026-02-01 23:59:59
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 权限分配】页面
        expected: 进入成功
      - action: 打开 UserA 的 test_table_15648_c0011* 策略并查看有效期
        expected: 有效期显示截止日期 2026-02-01 23:59:59
      - action: 将系统日期推进至 2026-02-02 并进入【数据安全 → 数据权限管理 → 我的权限查看】页面
        expected: test_table_15648_c0011 权限状态为「已失效」，数据预览不再允许读取该表
    tags:
      - 数据安全
      - 数据权限管理
      - 权限分配
      - 有效期

  - case_id: C0012
    title: 验证【数据安全】-【数据表权限】勾选表级权限，行列权限配置开关联动展示
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
