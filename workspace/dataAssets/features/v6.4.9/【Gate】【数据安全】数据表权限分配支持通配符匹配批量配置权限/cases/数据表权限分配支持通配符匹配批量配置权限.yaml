      - 数据安全
      - 数据权限管理
      - 权限分配
      - 通配符

  - case_id: C0009
    title: 验证【数据安全】-【数据表权限】删除通配符策略，我的权限列表同步移除
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建两张数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0009_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0009_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0009_source_01 VALUES (1, 'user1');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0009_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0009_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0009_source_02 VALUES (1, 'user2');
