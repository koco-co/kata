        expected: 进入成功
      - action: 删除 UserA 的 test_table_15648_c0009_source_* 策略并确认
        expected: Toast提示:「删除成功」，策略列表不再展示该策略
      - action: 进入【数据安全 → 数据权限管理 → 我的权限查看】页面
        expected: UserA 的权限列表不再包含 test_table_15648_c0009_source_01、test_table_15648_c0009_source_02
    tags:
      - 数据安全
      - 数据权限管理
      - 权限分配
      - 通配符

  - case_id: C0010
    title: 验证【数据安全】-【数据表权限】新增策略并保存，有效期与状态正确展示
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15648_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15648_c0010 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15648_c0010 VALUES (1, 'user1');
      5) 用户「UserA」待新增 test_table_15648_c0010* 的 DQL 权限策略
    steps:
      - action: 进入【数据安全 → 数据权限管理 → 权限分配】页面
        expected: 进入成功
