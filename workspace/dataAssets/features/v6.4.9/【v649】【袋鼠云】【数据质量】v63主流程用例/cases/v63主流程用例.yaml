meta:
  title: v63主流程用例
  version: v6.4.9
  feature_id: v6.4.9/【v649】【袋鼠云】【数据质量】v63主流程用例
  case_module_id: ""
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证数据地图首页资产类型统计正确
    priority: P2
    steps:
      - action: 进入元数据 → 数据地图首页，查看"资产类型统计"区域
        expected: 显示资产类型统计卡片，包含数据表、视图、离线任务等类型
      - action: 查看"数据表"类型的统计数量
        expected: 数据表数量与元数据管理中已同步的数据表总数一致
      - action: 查看"视图"类型的统计数量
        expected: 视图数量与已同步的视图总数一致
      - action: 查看"离线任务"类型的统计数量
        expected: 离线任务数量与离线平台中已提交任务数一致
      - action: 点击"数据表"统计卡片
        expected: 跳转至搜索结果页，资产类型自动选中"数据表"
    tags:
      - 元数据
      - 数据地图
      - 首页资产类型统计
  - case_id: C0002
    title: 验证搜索结果页支持按数据源类型筛选查询
    priority: P2
    steps:
      - action: 进入数据地图，在搜索框输入任意关键字后点击搜索按钮，进入搜索结果页
        expected: 显示搜索结果页，左侧显示筛选区域
      - action: 查看"数据源类型"下拉选项
        expected: 下拉列表包含 Hive2.x 和 Doris3.x 等已引入的数据源类型
      - action: '"数据源类型"选择 Hive2.x'
        expected: '"数据源"下拉项仅显示 Hive2.x 类型的数据源'
      - action: '"数据源"选择某个 Hive2.x 数据源'
        expected: '"数据库"下拉项显示所选数据源下所有已同步至资产的数据库'
      - action: 选择某个数据库
        expected: 搜索结果页展示所选数据库下所有已同步的表
      - action: 清空"数据源类型"筛选，改选 Doris3.x
        expected: '"数据源"下拉项切换为 Doris3.x 类型的数据源，三级联动正常'
    tags:
      - 元数据
      - 数据地图
      - 搜索结果页筛选查询
  - case_id: C0003
    title: 验证视图搜索功能正常
    priority: P2
    steps:
      - action: 进入数据地图搜索结果页，在资产类型下拉框中选择"数据表/视图"
        expected: 展示数据表/视图筛选子选项
      - action: 在子选项中选择"视图"进行搜索
        expected: 搜索结果仅显示已同步的视图资产
      - action: 查看搜索结果列表中的"资产类型"列
        expected: 资产类型显示为"视图"
      - action: 查看搜索结果列表中的中文名标签
        expected: 标签名称显示为"视图中文名"而非"表中文名"
      - action: 点击某个视图名称进入详情页
        expected: 正确跳转至视图详情页，显示视图基本信息
    tags:
      - 元数据
      - 数据地图
      - 视图搜索
  - case_id: C0004
    title: 验证表详情页-批量编辑功能
    priority: P2
    steps:
      - action: 进入数据地图，搜索并点击某个 Hive2.x 数据表进入详情页
        expected: 显示表详情页，包含字段信息Tab
      - action: 点击字段信息区域的【批量编辑】按钮
        expected: 进入批量编辑状态，字段描述、中文名、标签列变为可编辑状态
      - action: 修改第一个字段的"字段描述"为"测试描述_自动化"
        expected: 字段描述输入框显示修改后的值
      - action: 修改第二个字段的"字段中文名"为"测试中文名"
        expected: 字段中文名输入框显示修改后的值
      - action: 为第三个字段新增标签"测试标签"
        expected: 标签添加成功，显示新标签
      - action: 点击【保存】
        expected: 提示保存成功，退出批量编辑状态
      - action: 刷新页面，查看修改后的字段信息
        expected: 字段描述、中文名、标签均显示为修改后的值
    tags:
      - 元数据
      - 数据地图
      - 批量编辑
  - case_id: C0005
    title: 验证表删除功能（删除元数据表/删除源表）
    priority: P2
    steps:
      - action: 进入数据地图，搜索 test_delete_meta 并进入详情页，点击删除图标，选择"删除元数据表"
        expected: 弹出二次确认弹窗
      - action: 确认删除
        expected: 提示删除成功，数据地图中无法搜索到该表
      - action: 在 Hive2.x 中通过 SQL 查询 test_delete_meta
        expected: 表仍然存在于底层数据源中（仅删除元数据）
      - action: 进入数据地图，搜索 test_delete_source 并进入详情页，点击删除图标，选择"删除源表"
        expected: 弹出二次确认弹窗，提示将同时删除底层数据
      - action: 确认删除
        expected: 提示删除成功，数据地图中无法搜索到该表
      - action: 在 Hive2.x 中通过 SQL 查询 test_delete_source
        expected: 表在底层数据源中也被删除
      - action: 进入元数据管理 → 某数据库 → 数据表列表，勾选测试表后点击批量删除
        expected: 批量删除操作正常执行，逻辑与单条删除一致
    tags:
      - 元数据
      - 数据地图
      - 表删除
  - case_id: C0006
    title: 验证离线任务详情页-血缘解析功能
    priority: P2
    steps:
      - action: 进入数据地图，搜索该离线任务名称，点击进入详情页
        expected: 显示离线任务详情页
      - action: 点击【查看SQL】→【SQL解析日志】
        expected: 显示 SQL 解析记录列表，包含解析结果、解析时间、操作列
      - action: 查看 INSERT...SELECT 语句的解析记录
        expected: 解析结果显示"成功"，操作列显示【查看血缘】链接
      - action: 查看 SELECT 语句的解析记录
        expected: 解析结果显示"成功"，操作列无【查看血缘】链接（纯查询无血缘）
      - action: 点击【查看血缘图谱】→【表级血缘】
        expected: 显示表级血缘关系图，上下游表关系正确
    tags:
      - 元数据
      - 数据地图
      - 离线任务血缘解析
  - case_id: C0007
    title: 验证元数据同步任务创建与执行
    priority: P0
    steps:
      - action: 进入元数据 → 元数据同步，点击【新增周期同步任务】
        expected: 弹出新增周期同步任务配置页
      - action: 选择数据源为 Doris3.x 类型数据源，选择数据库，选择数据表
        expected: 数据源、数据库、数据表三级联动正常
      - action: 点击【添加】将所选表加入同步列表，点击【下一步】
        expected: 进入调度配置步骤
      - action: 配置同步周期为"每天"，点击【新增】
        expected: 提示新增周期同步任务成功，任务列表显示新任务
      - action: 在任务列表中找到新建的任务，点击【立即同步】
        expected: 生成同步实例，状态从"运行中"变为"同步完成"
    tags:
      - 元数据
      - 元数据同步
      - 同步任务创建与执行
  - case_id: C0008
    title: 验证同步数据正确性（数据库/数据表/字段）
    priority: P0
    steps:
      - action: 进入数据地图，搜索已同步的 Hive2.x 表名
        expected: 搜索结果中显示该表
      - action: 点击表名进入详情页，查看基本信息
        expected: 表名、数据库名、数据源名称均正确
      - action: 查看字段信息Tab
        expected: 字段名称、字段类型、字段描述与底层 Hive 表的 DDL 一致
      - action: 进入元数据管理，逐级进入该数据源 → 数据库
        expected: 数据库列表中包含已同步的数据库，数据表数量正确
    tags:
      - 元数据
      - 元数据同步
      - 同步任务创建与执行
  - case_id: C0009
    title: 验证过滤表功能
    priority: P2
    steps:
      - action: 进入元数据同步，创建新的同步任务，选择对应数据源和数据库
        expected: 配置页正常显示
      - action: 在"数据表过滤条件"中输入正则表达式：customer.*
        expected: 过滤条件设置成功
      - action: 点击【立即同步】，等待同步完成
        expected: 同步实例显示同步完成，"已同步"数量不包含 customer 开头的表
      - action: 进入数据地图搜索 customer_order
        expected: 搜索结果中不显示该表（被过滤）
      - action: 进入数据地图搜索 product_info
        expected: 搜索结果中显示该表（未被过滤）
    tags:
      - 元数据
      - 元数据同步
      - 过滤表
  - case_id: C0010
    title: 验证离线建表自动同步至数据地图
    priority: P0
    steps:
      - action: 在离线开发中创建并执行 SQL 任务：CREATE TABLE IF NOT EXISTS auto_sync_test (id INT, name STRING)
        expected: SQL 任务执行成功
      - action: 等待自动同步完成，进入数据地图搜索 auto_sync_test
        expected: 数据地图中可搜索到该表
      - action: 进入表详情页，查看操作记录
        expected: 操作记录中显示 DDL 变更记录（CREATE TABLE），记录时间正确
    tags:
      - 元数据
      - 元数据同步
      - 离线建表自动同步
  - case_id: C0011
    title: 验证离线建视图同步至数据地图
    priority: P1
    steps:
      - action: 在离线开发中执行 SQL：CREATE VIEW auto_sync_view AS SELECT id, name FROM auto_sync_test
        expected: SQL 任务执行成功
      - action: 等待自动同步完成，进入数据地图搜索 auto_sync_view
        expected: 数据地图中可搜索到该视图
      - action: 点击进入详情页，查看资产类型
        expected: 资产类型显示为"视图"，字段信息与视图定义一致
    tags:
      - 元数据
      - 元数据同步
      - 离线建表自动同步
  - case_id: C0012
    title: 验证同步任务编辑功能
    priority: P1
    steps:
      - action: 进入元数据同步，找到已有同步任务，点击【编辑】
        expected: 进入编辑页面，数据源和数据库字段回显正确
      - action: 修改同步周期为"每周"
        expected: 修改成功
      - action: 点击【保存】
        expected: 提示保存成功，任务列表中该任务的执行周期更新为"每周"
    tags:
      - 元数据
      - 元数据同步
      - 同步任务编辑
  - case_id: C0013
    title: 验证同步任务删除功能
    priority: P1
    steps:
      - action: 进入元数据同步，找到可删除的同步任务，点击【删除】
        expected: 弹出二次确认弹窗
      - action: 点击【确定】
        expected: 提示删除成功，任务列表中不再显示该任务
    tags:
      - 元数据
      - 元数据同步
      - 同步任务删除
  - case_id: C0014
    title: 验证同步实例日志查看
    priority: P2
    steps:
      - action: 进入元数据同步，点击某同步任务的【查看实例】
        expected: 显示该任务的同步实例列表
      - action: 查看实例列表信息
        expected: 显示同步状态、同步时间、已同步数量、总数量等信息
      - action: 点击某个实例的【查看日志】
        expected: 弹出日志详情，显示同步过程日志信息
    tags:
      - 元数据
      - 元数据同步
      - 同步实例日志
  - case_id: C0015
    title: 验证技术属性初始化显示正确
    priority: P2
    steps:
      - action: 进入元数据 → 元模型管理，选择 Hive2.x 元模型卡片
        expected: 进入 Hive2.x 元模型管理页面
      - action: 点击"技术属性"Tab，查看技术属性列表
        expected: Hive2.x 技术属性列表初始化显示正确，包含表级和字段级技术属性
      - action: 切换至 Doris3.x 元模型，查看技术属性列表
        expected: Doris3.x 技术属性列表初始化显示正确
      - action: 查看支持视图的数据源类型元模型（如 Hive2.x）的技术属性
        expected: 技术属性列表中包含视图相关属性："源表名"、"视图描述"
    tags:
      - 元数据
      - 元模型管理
      - 技术属性
  - case_id: C0016
    title: 验证通用业务属性CRUD功能
    priority: P0
    steps:
      - action: 进入元模型管理 → Hive2.x 元模型 → 通用业务属性页面
        expected: 显示通用业务属性列表
      - action: 点击【新增】按钮，输入属性名"测试通用属性"，选择属性类型，点击【保存】
        expected: 提示新建成功，列表中显示新增的业务属性
      - action: 在搜索框输入"测试通用属性"进行查询
        expected: 列表筛选显示匹配的业务属性
      - action: 点击该属性的【编辑】按钮，修改属性描述，点击【保存】
        expected: 提示编辑成功，属性描述更新正确
      - action: 点击该属性的"生效"开关
        expected: 属性生效状态切换成功
      - action: 进入 Hive2.x 数据源类型的数据表详情页，查看"业务属性"区域
        expected: 显示已生效的"测试通用属性"
      - action: 返回通用业务属性页面，点击该属性的【删除】按钮，二次确认
        expected: 提示删除成功，列表不再显示该属性
    tags:
      - 元数据
      - 元模型管理
      - 通用业务属性
  - case_id: C0017
    title: 验证个性业务属性-新增（枚举/文本框/树形目录）
    priority: P1
    steps:
      - action: 进入元模型管理 → Hive2.x 元模型 → 个性业务属性页面，选择某子模型，点击【新增个性属性】
        expected: 显示新增弹窗
      - action: 查看"属性类型"下拉选项
        expected: 选项包括"枚举"、"文本框"、"树形目录"
      - action: 选择属性类型为"枚举"
        expected: 下方显示"选项"配置区，可添加枚举选项
      - action: 输入属性名"测试枚举属性"，添加枚举选项"选项A"和"选项B"，点击【保存】
        expected: 弹窗关闭，提示新建成功，列表显示新属性
      - action: 再次点击【新增个性属性】，属性类型选择"文本框"
        expected: 下方显示"字段类型"下拉，选项为 string 和 bigint
      - action: 选择字段类型为"string"，输入属性名"测试文本属性"，点击【保存】
        expected: 弹窗关闭，提示新建成功
      - action: 再次点击【新增个性属性】，属性类型选择"树形目录"
        expected: 下方显示"编辑目录"配置项
      - action: 输入属性名"测试树形目录属性"，配置目录结构，点击【保存】
        expected: 弹窗关闭，提示新建成功，列表显示三个新增属性
    tags:
      - 元数据
      - 元模型管理
      - 个性业务属性-新增
  - case_id: C0018
    title: 验证个性业务属性-编辑
    priority: P1
    steps:
      - action: 选择已有个性业务属性，点击【编辑】
        expected: 显示编辑弹窗
      - action: 查看"属性名"和"属性类型"字段
        expected: 属性名、属性类型为不可编辑（禁用）状态
      - action: 修改其他可编辑字段（如属性描述），点击【保存】
        expected: 弹窗关闭，提示编辑成功，列表数据更新正确
    tags:
      - 元数据
      - 元模型管理
      - 个性业务属性-编辑
  - case_id: C0019
    title: 验证个性业务属性-删除
    priority: P1
    steps:
      - action: 选择可删除的个性业务属性，点击【删除】
        expected: 显示二次确认弹窗
      - action: 点击【确定】
        expected: 提示删除成功，列表刷新，不再显示该属性
    tags:
      - 元数据
      - 元模型管理
      - 个性业务属性-删除
  - case_id: C0020
    title: 验证业务属性在数据表详情页生效
    priority: P2
    steps:
      - action: 进入 Hive2.x 数据源类型的某数据表详情页
        expected: 显示表详情页
      - action: 查看右侧"业务属性"区域
        expected: 显示已生效的通用业务属性和个性业务属性名称
      - action: 编辑业务属性值（如填写枚举属性、文本框属性），点击【保存】
        expected: 保存成功，业务属性值更新正确
      - action: 刷新页面，查看业务属性
        expected: 业务属性值保持为修改后的值
    tags:
      - 元数据
      - 元模型管理
      - 业务属性在详情页生效
  - case_id: C0021
    title: 验证页面跳转和面包屑导航正确
    priority: P1
    steps:
      - action: 进入元数据 → 元数据管理
        expected: 显示数据源列表页
      - action: 点击 Hive2.x 类型的数据源
        expected: 进入该数据源的数据库列表页；面包屑显示：[数据源名称]（Hive2.x）> 数据库
      - action: 点击某个数据库
        expected: 进入该数据库的数据表列表页；面包屑显示：[数据源名称]（Hive2.x）> [数据库名称] > 数据表
      - action: 点击面包屑中的数据源名称
        expected: 返回该数据源的数据库列表页
    tags:
      - 元数据
      - 元数据管理
      - 页面跳转和面包屑
  - case_id: C0022
    title: 验证数据源列表展示
    priority: P1
    steps:
      - action: 进入元数据管理，查看数据源列表
        expected: 列表展示：数据源名称、数据库数量、数据表数量、数据源类型、存储大小、更新时间
      - action: 验证 Hive2.x 数据源的数据库数量
        expected: 数量与该数据源已同步至资产的数据库总数一致
      - action: 验证该数据源的数据表数量
        expected: 数量与该数据源已同步至资产的数据表总数一致
    tags:
      - 元数据
      - 元数据管理
      - 数据源列表
  - case_id: C0023
    title: 验证数据库列表展示
    priority: P1
    steps:
      - action: 查看数据库列表
        expected: 列表展示：数据库名称、数据表数量、存储大小、更新时间
      - action: 验证某数据库的数据表数量
        expected: 数量为该数据库已同步至资产的数据表+视图总数
      - action: 验证更新时间
        expected: 显示该数据库下最近更新的数据表/视图的更新时间
    tags:
      - 元数据
