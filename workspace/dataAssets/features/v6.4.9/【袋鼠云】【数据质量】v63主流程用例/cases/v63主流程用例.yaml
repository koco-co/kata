meta:
  title: v63主流程用例
  feature_id: data-platform-v63-main-flow-regression-suite
  requirement_id: "none"
  case_module_id: ""
  exports:
    - v63主流程用例.xmind
cases:
  - case_id: C0001
    title: 验证【元数据】-【数据地图】查看首页资产类型统计，卡片展示各类资产数量
    priority: P1
    precondition: |-
      1) 元数据平台已同步数据表 3 张、视图 1 张和离线任务 2 个
      2) 统计刷新任务「TaskC」状态为「完成」
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 查看首页「资产类型统计」区域
        expected: 卡片展示数据表 3、视图 1、离线任务 2
      - action: 点击「数据表」统计卡片
        expected: 跳转至搜索结果页，资产类型筛选为「数据表」，列表记录数为 3
    tags:
      - 元数据
      - 数据地图
      - 首页统计

  - case_id: C0002
    title: 验证【元数据】-【数据地图】按数据源类型筛选搜索结果，数据源与数据表下拉联动
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaB}
      4) 创建 2 张数据表：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0002_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0002_source_01 (id BIGINT, order_id STRING);
         INSERT INTO ${SchemaB}.test_table_none_c0002_source_01 VALUES (1, 'O1');
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0002_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0002_source_02 (id BIGINT, order_id STRING);
         INSERT INTO ${SchemaB}.test_table_none_c0002_source_02 VALUES (1, 'O2');
      5) 授权数据源：${DataSourceA}
      6) 数据源类型：Doris3.x
      7) 存在数据库：${SchemaA}
      8) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002_source_03;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002_source_03 (id BIGINT, order_id STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0002_source_03 VALUES (1, 'O3');
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 输入「order」并点击【搜索】进入结果页
        expected: 结果页展示数据源类型、数据源、数据库和数据表筛选控件
      - action: 数据源类型选择「Hive2.x」
        expected: 数据源下拉框仅展示 ${DataSourceB}
      - action: 选择 ${DataSourceB} 和数据库 ${SchemaB}
        expected: 数据表下拉框展示 ${SchemaB} 下 2 张表，结果列表仅包含该数据库记录
      - action: 切换数据源类型为「Doris3.x」
        expected: 数据源下拉框切换为 ${DataSourceA}，数据库下拉框展示 ${SchemaA}
    tags:
      - 元数据
      - 数据地图
      - 筛选

  - case_id: C0003
    title: 验证【元数据】-【数据地图】按资产类型搜索视图，详情展示字段信息
    priority: P1
    precondition: |-
      1) 数据地图存在视图「v_order_summary」，资产类型为「视图」
      2) 视图包含字段 order_id、total_amount，中文名为「订单汇总」
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 在资产类型中选择「视图」并搜索「v_order_summary」
        expected: 列表仅展示 1 条记录，资产类型为「视图」，中文名为「订单汇总」
      - action: 点击视图名称
        expected: 详情页展示视图基本信息和字段 order_id、total_amount
    tags:
      - 元数据
      - 数据地图
      - 视图

  - case_id: C0004
    title: 验证【元数据】-【数据地图】批量编辑字段信息，保存后描述与标签生效
    priority: P1
    precondition: |-
      1) 数据地图存在数据表「customer_profile」，字段 id、name、status
      2) 使用数据管理员账号进入元数据平台，具备元数据字段编辑权限
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 搜索「customer_profile」并打开字段信息，点击【批量编辑】
        expected: id、name、status 的描述、中文名和标签控件变为可编辑
      - action: 将 name 描述改为「客户名称」，为 status 添加标签「客户状态」，点击【保存】
        expected: Toast提示:「保存成功」，name 描述为「客户名称」，status 标签包含「客户状态」
      - action: 刷新页面
        expected: 修改后的描述和标签仍展示，字段数量保持为 3
    tags:
      ["元数据", "数据地图"]
  - case_id: C0005
    title: 验证【元数据】-【数据地图】删除元数据表与源表，底层表分别保留或删除
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaB}
      4) 创建两张数据表：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0005_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0005_source_01 (id BIGINT);
         INSERT INTO ${SchemaB}.test_table_none_c0005_source_01 VALUES (1);
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0005_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0005_source_02 (id BIGINT);
         INSERT INTO ${SchemaB}.test_table_none_c0005_source_02 VALUES (1);
      5) 数据地图存在资产表「test_table_none_c0005_source_01」，底层 ${DataSourceB}.${SchemaB}.test_table_none_c0005_source_01 仍存在
      6) 数据地图存在资产表「test_table_none_c0005_source_02」，底层 ${DataSourceB}.${SchemaB}.test_table_none_c0005_source_02 仍存在
      7) 数据管理员账号已具备元数据管理权限
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 打开 test_table_none_c0005_source_01，选择【删除元数据表】并确认
        expected: Toast提示:「删除成功」，数据地图无法搜索 test_table_none_c0005_source_01，底层表仍存在
      - action: 打开 test_table_none_c0005_source_02，选择【删除源表】并确认
        expected: Toast提示:「删除成功」，数据地图无法搜索 test_table_none_c0005_source_02，底层表同步删除
    tags:
      ["元数据", "数据地图"]
  - case_id: C0006
    title: 验证【元数据】-【元数据同步】新增周期同步任务并执行，数据地图新增资产
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006 (id BIGINT, order_id STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0006 VALUES (1, 'O1');
      5) 使用数据管理员账号进入元数据平台，具备元数据同步任务管理权限
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: 点击【新增周期同步任务】，选择 ${DataSourceA}、${SchemaA} 和 test_table_none_c0006，点击【添加】和【下一步】
        expected: 调度配置展示数据源、数据库和数据表，任务名称输入框可编辑
      - action: 选择每天执行并点击【新增】
        expected: Toast提示:「新增成功」，任务列表新增 1 条周期同步任务
      - action: 点击任务【立即同步】
        expected: 同步实例状态从「运行中」变为「同步完成」，数据地图新增或更新 test_table_none_c0006 资产
    tags:
      - 元数据
      - 元数据同步

  - case_id: C0007
    title: 验证【元数据】-【元数据同步】配置表过滤并同步，过滤表不同步且目标表已同步
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaB}
      4) 创建 3 张数据表：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0007_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0007_source_01 (id BIGINT);
         INSERT INTO ${SchemaB}.test_table_none_c0007_source_01 VALUES (1);
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0007_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0007_source_02 (id BIGINT);
         INSERT INTO ${SchemaB}.test_table_none_c0007_source_02 VALUES (1);
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0007_source_03;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0007_source_03 (id BIGINT);
         INSERT INTO ${SchemaB}.test_table_none_c0007_source_03 VALUES (1);
      5) 已创建可编辑的元数据同步任务「TaskA」
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: 编辑「TaskA」，表过滤条件填写 `test_table_none_c0007_source_0[12]` 并点击【保存】
        expected: Toast提示:「保存成功」，任务详情展示过滤条件 test_table_none_c0007_source_0[12]
      - action: 点击【立即同步】并查看同步实例
        expected: 同步完成，已同步数量不包含 test_table_none_c0007_source_01、test_table_none_c0007_source_02
      - action: 在数据地图搜索 test_table_none_c0007_source_03
        expected: 搜索结果包含 test_table_none_c0007_source_03，资产状态为「已同步」
    tags:
      - 元数据
      - 元数据同步
      - 表过滤

  - case_id: C0008
    title: 验证【元数据】-【数据地图】离线建表与视图后自动同步，资产类型正确展示
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaB}
      4) 创建数据表，该表为空表：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0008 (id BIGINT);
      5) 离线项目「${ProjectA}」已关联 ${DataSourceB}
      6) ${DataSourceB}.${SchemaB} 不存在 auto_sync_table、auto_sync_view
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 在离线项目执行 `CREATE TABLE IF NOT EXISTS ${SchemaB}.auto_sync_table (id BIGINT, name STRING)`
        expected: SQL 任务状态为「运行完成」
      - action: 执行 `CREATE VIEW ${SchemaB}.auto_sync_view AS SELECT id, name FROM ${SchemaB}.auto_sync_table`
        expected: SQL 任务状态为「运行完成」
      - action: 搜索两个资产名称
        expected: 数据地图展示 auto_sync_table 资产类型「数据表」和 auto_sync_view 资产类型「视图」
    tags:
      ["元数据", "数据地图"]
  - case_id: C0009
    title: 验证【元数据】-【元模型管理】切换数据源类型模型，技术属性列表联动展示
    priority: P1
    precondition: |-
      1) 元模型管理存在 Hive2.x、Doris3.x 两个数据源类型模型
      2) Hive2.x 模型包含表级和字段级技术属性，Doris3.x 模型包含表级技术属性
    steps:
      - action: 进入【元数据 → 元模型管理】页面
        expected: 进入成功
      - action: 选择 Hive2.x 模型并打开【技术属性】Tab
        expected: 列表展示表级和字段级属性，属性名称和类型均有值
      - action: 切换 Doris3.x 模型
        expected: 技术属性列表切换为 Doris3.x 模型属性，未混入 Hive2.x 专属属性
    tags:
      - 元数据
      - 元模型管理
      - 技术属性

  - case_id: C0010
    title: 验证【元数据】-【数据地图】编辑业务属性值，保存后详情页保留
    priority: P1
    precondition: |-
      1) 元模型管理存在已生效通用业务属性「数据责任人」
      2) 数据表「customer_profile」详情页可编辑业务属性
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 搜索 customer_profile 并打开【业务属性】区域
        expected: 区域展示「数据责任人」属性及编辑控件
      - action: 将「数据责任人」填写为「data_owner_a」并点击【保存】
        expected: Toast提示:「保存成功」，属性值显示 data_owner_a
      - action: 刷新详情页
        expected: 「数据责任人」仍显示 data_owner_a
    tags:
      ["元数据", "数据地图"]
  - case_id: C0011
    title: 验证【数据标准】-【标准定义】新增上线下线数据标准，状态与描述同步更新
    priority: P0
    precondition: |-
      1) 标准目录「CatalogA」存在，标准名称「StandardA」当前不存在
      2) 使用数据标准管理员账号进入数据标准平台，具备数据标准管理权限
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: 在CatalogA点击【新增数据标准】，填写中文名称「邮箱地址」、英文名称「email」、数据类型「STRING」，点击【保存】
        expected: Toast提示:「保存成功」，标准列表新增「StandardA」，状态为「待上线」
      - action: 编辑标准描述为「邮箱格式回归」，点击【保存】并点击【上线】
        expected: Toast提示:「保存成功」，标准状态变为「已上线」，描述为「邮箱格式回归」
      - action: 点击【下线】
        expected: Toast提示:「下线成功」，标准状态变为「待上线」
    tags:
      - 数据标准
      - 标准定义
      - CRUD

  - case_id: C0012
    title: 验证【数据标准】-【标准定义】导出删除导入数据标准，列表恢复记录
    priority: P1
    precondition: |-
      1) 标准定义列表存在「StandardA」，状态为「已上线」
      2) 创建导入文件「standard_export.xlsx」：
         Sheet: Sheet1
         Title: 标准中文名,英文名称,数据类型
         Line1: 邮箱地址,email,STRING
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: 勾选「StandardA」并点击【导出】
        expected: 浏览器下载 standard_export.xlsx，文件包含标准中文名、英文名、数据类型和状态
      - action: 删除「StandardA」并确认
        expected: Toast提示:「删除成功」，列表不再展示该标准
      - action: 点击【导入】上传 standard_export.xlsx
        expected: Toast提示:「导入成功」，列表恢复「StandardA」记录
    tags:
      ["数据标准", "标准定义"]
  - case_id: C0013
    title: 验证【数据标准】-【标准映射】为标准配置字段映射，映射记录展示完整路径
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaB}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0013;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0013 (id BIGINT, email STRING);
         INSERT INTO ${SchemaB}.test_table_none_c0013 VALUES (1, 'a@example.com');
      5) 标准「StandardA」已上线
      6) 数据表 ${DataSourceB}.${SchemaB}.test_table_none_c0013 存在字段 email
    steps:
      - action: 进入【数据标准 → 标准映射】页面
        expected: 进入成功
      - action: 打开「StandardA」并点击【字段映射】
        expected: 映射弹窗展示数据源类型、数据源、数据库、数据表和字段选择
      - action: 选择 Hive2.x、${DataSourceB}、${SchemaB}、test_table_none_c0013、email 并点击【保存】
        expected: Toast提示:「保存成功」，映射记录展示完整字段路径
    tags:
      - 数据标准
      - 标准映射

  - case_id: C0014
    title: 验证【数据模型】-【规范建表】解析建表语句，字段与分区列表完整展示
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaB}
      4) 创建分区表并插入前一日和当日数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_none_c0014;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_none_c0014 (id BIGINT, amount DECIMAL(10,2)) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaB}.test_table_none_c0014 SELECT id, CAST(id AS DECIMAL(10,2)), date_sub(current_date(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaB}.test_table_none_c0014 SELECT id, CAST(id AS DECIMAL(10,2)), current_date() FROM range(4, 7);
      5) 数据模型支持 Hive2.x 规范建表，解析目标为第 4) 项中的建表语句
    steps:
      - action: 进入【数据模型 → 规范建表】页面
        expected: 进入成功
      - action: 选择 Hive2.x 数据源并选择【建表语句解析】
        expected: 页面展示 SQL 输入框和解析按钮
      - action: 输入前置条件中的建表语句并点击【解析】
        expected: 字段列表展示 id BIGINT、amount DECIMAL(10,2)，分区列表展示 dt STRING
      - action: 点击【保存】
        expected: Toast提示:「保存成功」，模型列表新增 test_table_none_c0014
    tags:
      ["数据模型", "规范建表"]
  - case_id: C0015
    title: 验证【数据质量】-【规则库配置】切换内置规则开关，状态在启用停用间变化
    priority: P1
    precondition: |-
      1) 规则库存在内置规则「RuleC」，当前状态为「启用」
      2) 数据质量管理员账号已具备规则库配置权限
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 在【内置规则】Tab找到「RuleC」并关闭开关
        expected: Switch状态变为「停用」，Toast提示:「操作成功」
      - action: 再次打开开关
        expected: Switch状态变为「启用」，Toast提示:「操作成功」
    tags:
      - 数据质量
      - 规则库配置
      - 内置规则

  - case_id: C0016
    title: 验证【数据质量】-【规则任务配置】新建规则集并执行，实例状态运行完成且异常明细为0
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceC}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaC}
      4) 创建数据表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaC}.test_table_none_c0016;
         CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_none_c0016 (id BIGINT);
         INSERT INTO ${SchemaC}.test_table_none_c0016 VALUES (1), (2), (3);
      5) 规则库内置规则「RuleB」状态为「启用」
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: |-
          点击【新建规则集】，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceC}
          * 选择数据库：${SchemaC}
          * 选择数据表：test_table_none_c0016
          规则集描述：空
          新增 RuleB 等于 3 的规则
        expected: 规则配置展示RuleB统计函数和期望值 3
      - action: 点击【保存】并【立即执行】
        expected: Toast提示:「保存成功」，最新实例状态为「运行完成」
      - action: 打开实例详情
        expected: RuleB实际值为 3，规则状态为「通过」，异常明细数量为 0
