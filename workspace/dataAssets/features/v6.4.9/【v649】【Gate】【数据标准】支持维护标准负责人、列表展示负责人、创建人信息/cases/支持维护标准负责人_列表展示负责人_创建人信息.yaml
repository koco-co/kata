  version: v6.4.9
  feature_id: v6.4.9/【v649】【Gate】【数据标准】支持维护标准负责人、列表展示负责人、创建人信息
cases:
  - id: C001
    title: 验证【数据标准-标准定义】历史标准数据编辑正确
    priority: P2
    steps:
      - action: 进入【资产-数据标准-标准定义】页面
        expected: 页面正常打开
      - action: 查看标准“ID”的详情
        expected: 展示数据正确，【标准负责人】、【标准安全分类】、【标准安全分级】都显示为“--”
      - action: 编辑标准“ID”，填写【标准负责人】：user2；【标准安全分类】：类1；【标准安全分级】：机密，点击保存按钮
        expected: 提示数据标准保存成功
      - action: 查看标准“ID”详情
        expected: 展示数据正确，【标准负责人】：user2；【标准安全分类】：类1；【标准安全分级】：机密
    precondition: 1、平台-标准定义存在历史标准数据：【中文名称】：ID，无【标准负责人】、【标准安全分类】、【标准安全分级】
    tags:
      - 未分类
      - 未分类
  - id: C002
    title: 验证【数据标准-标准定义】负责人、创建人查询条件交互正确
    priority: P1
    steps:
      - action: 进入【资产-数据标准-标准定义】页面
        expected: 页面正常打开
      - action: 点击负责人下拉框，输入：use
        expected: 成功搜索出下拉项：user1、user2
      - action: 多选user1、user2
        expected: 支持多选
      - action: 点击创建人下拉框，输入：admin
        expected: 成功搜索出下拉项：admin@dtstack.com1、admin@dtstack.com2
      - action: 多选admin@dtstack.com1、admin@dtstack.com2
        expected: 支持多选
      - action: 点击查询
        expected: 成功查询出标准“姓名”和标准“年龄”
    precondition: |-
      1、标准定义列表已存在admin@dtstack.com创建的标准：
      1）【中文名称】：姓名；【英文名称】：name；【英文缩写】：na；【标准编号】：test1；【标准目录】：test；【标准负责人】：user1；【标准安全分类】：类1；【标准安全分级】：机密；【业务定义】：测试；【标准来源】：测试；【自定义属性】：属性一：1
      2）【中文名称】：年龄；【英文名称】：age；【英文缩写】：ag；【标准编号】：test1；【标准目录】：test；【标准负责人】：user2；【标准安全分类】：类2；【标准安全分级】：机密；【业务定义】：测试；【标准来源】：测试；【自定义属性】：属性一：1
      2、创建人有admin@dtstack.com1、admin@dtstack.com2
    tags:
      - 未分类
      - 未分类
