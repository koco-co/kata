    tags:
      - 元数据
      - 元数据同步
      - 数据目录

  - case_id: C0005
    title: 验证【元数据】-【元数据同步】同步 Doris3.x 日期分区表，同步记录展示 2 个日期分区
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建按日期分区的数据表并写入前一日与当日分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15603_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15603_c0005 (
           id BIGINT,
           name STRING,
           dt DATE
         )
         PARTITION BY RANGE (dt) ()
         DISTRIBUTED BY HASH(id) BUCKETS 3
         PROPERTIES (
           "replication_num" = "1",
           "dynamic_partition.enable" = "true",
           "dynamic_partition.time_unit" = "DAY",
           "dynamic_partition.start" = "-3",
           "dynamic_partition.end" = "1",
           "dynamic_partition.prefix" = "p"
         );
         INSERT INTO ${SchemaA}.test_table_15603_c0005 VALUES
           (1, 'A', DATE_SUB(CURRENT_DATE(), 1)),
           (2, 'B', DATE_SUB(CURRENT_DATE(), 1)),
           (3, 'C', CURRENT_DATE()),
           (4, 'D', CURRENT_DATE());
      5) 元数据同步任务「${TaskB}」已配置 ${SchemaA}.test_table_15603_c0005 的立即同步
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: 执行 ${TaskB} 的【立即同步】
        expected: 同步任务状态为「运行成功」，同步记录显示 2 个日期分区
      - action: 打开 test_table_15603_c0005 数据表详情
        expected: 表结构展示分区字段 dt，分区列表包含前一日和当日日期
    tags:
      - 元数据
      - 元数据同步
      - 分区同步

