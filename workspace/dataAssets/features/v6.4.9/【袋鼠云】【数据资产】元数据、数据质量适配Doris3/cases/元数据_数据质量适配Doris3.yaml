      2) 数据源 A 类型：Doris3.x
      3) 同步任务表单要求数据库名称仅包含字母、数字和下划线
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: 新增 ${DataSourceA} 同步任务，数据库名称输入「doris-db-invalid」并点击【提交】
        expected: 「数据库名称」置红提示「仅支持字母、数字和下划线」，提交按钮禁用
      - action: 将数据库名称改为「dorisdb」
        expected: 红色提示消失，提交按钮恢复可用
    tags:
      - 元数据
      - 元数据同步
      - 必填校验

