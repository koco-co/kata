cases:
  - case_id: C0001
    title: 验证【平台管理】-【数据源管理】引入 Doris3.x 数据源并授权质量项目，Toast 提示引入成功与授权成功
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据质量存在质量项目 ${ProjectA}
    steps:
      - action: 进入【平台管理 → 数据源管理】页面
        expected: 进入成功
      - action: 点击【引入数据源】，选择 ${DataSourceA} 并确认
        expected: Toast提示:「引入成功」，列表新增 ${DataSourceA}，类型为 Doris3.x
      - action: 在 ${DataSourceA} 操作列点击【质量项目授权】，选择 ${ProjectA} 并确认
        expected: Toast提示:「授权成功」，授权项目列显示 ${ProjectA}
    tags:
      - 平台管理
      - 数据源管理
      - Doris3.x

  - case_id: C0002
    title: 验证【平台管理】-【数据源管理】打开带 Meta 标识的 Doris3.x 数据源详情，元数据同步自动新增周期任务且运行成功
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15603_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15603_c0002 (
           id BIGINT,
           name STRING,
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_15603_c0002 VALUES (1, 'A', 10.00), (2, 'B', 20.00);
      5) ${DataSourceA} 带 Meta 标识，来自离线项目 ${ProjectA}
      6) 数据质量存在质量项目 ${ProjectB}，且 ${DataSourceA} 已授权 ${ProjectB}
    steps:
      - action: 进入【平台管理 → 数据源管理】页面
        expected: 进入成功
      - action: 搜索 ${DataSourceA} 并打开详情
        expected: 数据源类型显示 Doris3.x，Meta 标识显示「是」，质量项目授权状态为「已授权」
      - action: 进入【元数据 → 元数据同步】页面
        expected: 自动新增周期同步任务，数据库为 ${SchemaA}，数据表范围为「全部」，周期为「周」，最新执行状态为「运行成功」
    tags:
      - 平台管理
      - 数据源管理
      - 元数据同步

