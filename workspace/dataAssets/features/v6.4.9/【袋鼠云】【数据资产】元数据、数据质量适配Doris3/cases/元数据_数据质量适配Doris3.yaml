  - case_id: C0031
    title: 验证「血缘分析」中 Doris 3.x 数据源的孤立血缘表（无血缘）统计功能正常
    priority: P2
    steps:
      - action: 进入【数据资产】-【元数据】-【血缘分析】页面
        expected: 进入成功，展示已添加监控的数据库列表
      - action: 点击「添加数据库」按钮
        expected: 弹出「添加数据库」弹窗
      - action: 「数据源」选择 Doris 3.x 数据源，「数据库」选择已同步的数据库，点击确定
        expected: 添加成功，列表中新增一条 Doris 3.x 数据库记录，「数据源类型」列显示 Doris 3.x
      - action: 查看列表中新增的 Doris 3.x 数据库记录的「表数量（总数）」和「表数量（无血缘）」列
        expected: 1) 「表数量（总数）」列显示该数据库的总表数，与实际同步的表数一致
      - action: 点击该数据库记录的「查看」按钮
        expected: 「表数量（无血缘）」列显示无上下游血缘关系的孤立表数量
      - action: ""
        expected: 「表数量（无血缘）」≤「表数量（总数）」
      - action: ""
        expected: 跳转至该数据库下的表列表页，可查看各表的血缘状态详情
    precondition: |-
      1) Doris 3.x 数据源已引入资产平台，元数据同步完成
      2) Doris
      3. x 数据库中存在多张表，部分表已通过离线任务建立血缘关系（如通过INSERT INTO/CREATE TABLE AS SELECT等SQL），部分表无任何上下游血缘关系
    tags:
      - 元数据
      - 血缘分析
