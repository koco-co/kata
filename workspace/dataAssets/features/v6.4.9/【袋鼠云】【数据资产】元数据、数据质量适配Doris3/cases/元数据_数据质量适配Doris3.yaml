        expected: 1) 从周期同步页面切换到自动同步页面
      - action: "1) 配置内容如下: 规则名称: test_rule 自动同步过滤维度: 数据表表名 过滤内容: vehicle_info_part* 数据源:  Doirs 3.x 数据库: ${离线平台中创建项目时指定的项目标识}"
