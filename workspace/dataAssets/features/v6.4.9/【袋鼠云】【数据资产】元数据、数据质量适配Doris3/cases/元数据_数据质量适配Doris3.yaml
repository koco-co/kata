  - case_id: C0010
    title: 验证「规则任务配置」中 Doris 3.x 数据源规则任务的编辑功能正常
    priority: P2
    steps:
      - action: 进入【数据资产】-【数据质量】-【规则任务配置】页面
        expected: 进入成功
      - action: 选择规则${rule}, 点击「编辑」
        expected: 进入编辑页面的「监控对象」部分
      - action: 点击「下一步」
        expected: 配置项回显内容为${最近保存的数据}
      - action: "编辑「完整性校验」规则: 「校验类型」选择「单表」 「统计函数」 选择「表行数」 「过滤条件」 无 「校验方法」选择「固定值」 「期望值」选择「<5」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」"
        expected: 支持修改规则名称
      - action: 点击「保存」按钮
        expected: 数据源/库/表呈现置灰状态, 不支持修改
      - action: 点击「下一步」, 点击「完成」
        expected: 进入编辑页面的「监控规则」部分
      - action: 立即运行、周期运行
        expected: 配置项回显内容为${最近保存的数据}
      - action: ""
        expected: 所有选项均支持修改
      - action: ""
        expected: 配置完成
      - action: ""
        expected: 规则配置保存正确
      - action: ""
        expected: 规则编辑成功
      - action: ""
        expected: 任务实例状态由「运行中」 > 「校验异常」
    precondition: 「规则任务配置」页面已存在一条「完整性校验-单表校验」规则配置记录${rule}
    tags:
      - 数据质量
      - 规则任务配置
  - case_id: C0011
    title: 验证「规则任务配置」中 Doris 3.x 数据源「规则集」功能正常
    priority: P0
    steps:
      - action: 进入【数据资产】-【数据质量】-【规则任务配置】页面
        expected: 成功进入【规则任务配置】页面，页面内容正常加载显示，无报错
      - action: 点击【新建规则集】按钮，配置基础信息
        expected: 进入规则集配置页面
      - action: 导入规则集文件，点击【下一步】按钮
        expected: 规则集文件导入成功，显示规则内容
      - action: 点击【完成】按钮保存规则集
        expected: 规则集保存成功
      - action: 选择该规则集，点击【立即运行】按钮，等待任务执行完成
        expected: 任务执行完成，校验结果为「不通过」
    precondition: |-
      「数据资产-平台管理-数据源管理」中已存在Doris 3.x数据源并且已授权.
      数据源下存在Doirs表, 可进入离线平台中创建并执行DorisSQL任务:

      DROP TABLE IF EXISTS vehicle_info_part1;

      CREATE TABLE vehicle_info_part1 (
        vin           VARCHAR(64) COMMENT '车辆唯一识别码',
        car_series    STRING COMMENT '车系',
        car_power     STRING COMMENT '动力类型',
        car_config    STRING COMMENT '车型配置',
        car_endurance STRING COMMENT '续航类型',
        drive_type    STRING COMMENT '驱动形式',
        car_equipment STRING COMMENT '车辆配置版本',
        is_certific   INT COMMENT '是否认证',
        delivery_time DATE COMMENT '交付日期'
      )
      ENGINE=OLAP
      DUPLICATE KEY(vin)
      PARTITION BY RANGE(delivery_time) (
        PARTITION p20251001 VALUES [('2025-10-01'), ('2025-10-02')),
        PARTITION p20251002 VALUES [('2025-10-02'), ('2025-10-03'))
      )
      DISTRIBUTED BY HASH(vin) BUCKETS 10
      PROPERTIES (
        replication_num = 1
      );
      -- p20251001 分区（2025-10-01）
