meta:
  title: 【数据资产】元数据、数据质量适配doris3.x
  requirement_id: "15603"
  case_module_id: "10306"
  exports:
    - xmind
cases:
  - case_id: C0001
    title: 验证「平台管理」中 Doris 3.x 数据源质量项目授权功能正常
    priority: P0
    steps:
      - action: 进入【数据资产】-【平台管理】-【数据源管理】页面
        expected: 进入成功
      - action: 点击「引入数据源」
        expected: 显示平台中所有还未被引入至资产平台的数据源
      - action: 选择${datasource1}数据源后引入
        expected: 成功引入至资产平台
      - action: 点击「质量项目授权」, 选择质量项目后确定
        expected: 1) 质量项目授权成功
      - action: 选择${datasource2}数据源后引入
        expected: 资产平台其他模块都可以加载到该数据源
      - action: 点击「质量项目授权」, 选择质量项目后确定
        expected: 成功引入至资产平台
      - action: ""
        expected: 1) 质量项目授权成功
      - action: ""
        expected: 资产平台其他模块都可以加载到该数据源
    precondition: |-
      1) 「公共管理-数据源中心」已存在Doris 3.x数据源${datasource1}
      2) 「离线开发」已存在Meta标识的Doris
      3. x数据源${datasource2}
    tags:
      - 平台管理
      - 数据源管理
  - case_id: C0002
    title: 验证 「元数据」中 Doris 3.x 从离线 Meta 到资产的自动引入与同步功能
    priority: P0
    steps:
      - action: 进入【离线开发】页面, 点击创建项目, 「计算引擎」中对接Doris 3.x集群, 其他必填项正常填写后, 点击「创建项目」
        expected: 离线项目创建成功
      - action: 进入离线项目, 点击「数据源」
        expected: 1) 从数据开发界面切换到数据源界面, 展示已对接的数据源列表
      - action: 进入【数据资产】-【平台管理】-【数据源管理】页面
        expected: 存在带Meta标识的Doris 3.x数据源记录
      - action: 进入【数据资产】-【元数据】-【元数据同步】页面
        expected: 1) 进入成功
      - action: ""
        expected: 资产平台自动引入离线平台中的带Meta标识的Doris 3.x数据源, 并且已授权给质量项目
      - action: ""
        expected: 1) 进入成功
      - action: ""
        expected: 自动为Doris 3.x数据源新增了一条周期同步任务, 并且自动「立即同步」一次
      - action: ""
        expected: "周期同步任务配置为: 数据库: ${离线平台中创建项目时指定的项目标识} 数据表: 「全部」 调度周期为「周」"
    precondition: 控制台-多集群管理-计算组件中已配置Doris 3.x数据源
    tags:
      - 平台管理
      - 数据源管理
  - case_id: C0003
    title: 验证「脏数据管理」中 Doris 3.x 数据源处理脏数据功能正常
    priority: P2
    steps:
      - action: 进入【数据资产】-【数据质量】-【脏数据管理】页面
        expected: 1) 进入成功
      - action: 点击「编辑」按钮, 「数据存储时效」改为1天后确定
        expected: 授权的质量项目的数据源默认开启脏数据存储
      - action: 进入「规则任务配置」页面, 点击「新建监控规则」按钮，进入监控规则配置页面
        expected: 修改成功
      - action: 配置「数据源」「数据库」「数据表」等信息，选择【完整性校验】规则
        expected: 进入成功
      - action: 「校验类型」选择「字段级」 「字段」选择「vin」 「统计函数」 选择「空值数」 「期望值」选择「=0」 「过滤条件」 无 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
        expected: 选择成功，展示【完整性校验】规则配置项
      - action: 保存后, 配置周期调度后完成新建监控规则
        expected: 配置完成
      - action: 立即执行
        expected: 规则添加成功
      - action: 第二天查看该脏数据表
        expected: 1) 执行成功, 任务实例的状态由运行中 > 校验失败
      - action: ""
        expected: 脏数据表生成，且表数据正确
      - action: ""
        expected: 该脏数据表被删除
    precondition: |-
      Doris 3.x 数据源已成功接入数据资产平台，并完成元数据同步配置；

      建表语句如下:
      CREATE TABLE IF NOT EXISTS vehicle_sales (
          sale_id BIGINT COMMENT '销售记录ID',
          vin VARCHAR(17) COMMENT '车辆VIN码',
          model_name VARCHAR(50) COMMENT '车型名称',
          sale_price DECIMAL(18,2) COMMENT '销售价格(万元)',
          sale_date DATE COMMENT '销售日期',
          dealer_name VARCHAR(100) COMMENT '经销商名称',
          customer_name VARCHAR(50) COMMENT '客户姓名'
      )
      ENGINE=OLAP
      DUPLICATE KEY(sale_id)
      DISTRIBUTED BY HASH(sale_id) BUCKETS 10
      PROPERTIES (
          replication_num = 1);

      INSERT INTO vehicle_sales VALUES
      (1001, 'LFPHFDEB3R2S12345', '岚图FREE', 31.88, '2025-09-01', '武汉岚图中心', '张三'),
      (1002, 'LFPHFDEB3R2S12346', '岚图梦想家', 45.99, '2025-09-02', '北京岚图体验店', '李四');

      INSERT INTO vehicle_sales VALUES
      (1003, 'LFPHFDEB3R2S12347', '岚图追光', -5.00, '2025-09-03', '上海岚图空间', '王五'),  -- 价格非法
      (1004, '', '岚图FREE', 32.88, '2025-09-04', '广州岚图展厅', '赵六');               -- VIN为空
    tags:
      - 数据质量
      - 脏数据管理
  - case_id: C0004
    title: 验证「质量报告」中 Doris 3.x 功能正常
    priority: P0
    steps:
      - action: 进入【数据资产】-【数据质量】-【规则任务配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」按钮，进入监控规则配置页面
        expected: 进入成功
      - action: 配置「数据源」「数据库」「数据表」等信息，选择【完整性校验】规则
        expected: 选择成功，展示【完整性校验】规则配置项
      - action: 「校验类型」选择「表级」 「统计函数」 选择「表行数」 「过滤条件」 无 「校验方法」选择「固定值」 「期望值」选择「>5」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
        expected: 配置完成
      - action: 点击「保存」按钮
        expected: 规则配置保存正确
      - action: 点击「下一步」，配置「调度属性」
        expected: 调度属性配置完成
      - action: 点击「完成」按钮
        expected: 规则保存成功
      - action: 立即运行、周期运行
        expected: 任务实例状态由「运行中」 > 「校验通过」
      - action: 进入【数据资产】-【数据质量】-【质量报告】页面
        expected: 任务运行完成后, 自动生成对应质量报告
      - action: 点击查看报告
        expected: 下钻到数据表质量报告页面, 数据显示正常
    precondition: 无
    tags:
      - 数据质量
      - 质量报告
  - case_id: C0005
    title: 验证「质量报告」中 Doris 3.x 数据源质量报告的查询功能正常
    priority: P1
    steps:
      - action: 进入【数据资产】-【数据质量】-【质量报告】页面
        expected: 进入成功
      - action: 输入报告名称 ${name}, 进行查询
        expected: 查询出报告名称中所有包含${name}的记录
      - action: 置空所有查询条件, 输入表名${name3}, 修改人${person3}, 进行查询
        expected: 查询出表名包含${name3}且最近修改人为${person3}的规则记录
      - action: 置空所有查询条件, 切换分页组件为「10条/页」
        expected: 当前页面规则数量变更为10条
      - action: 点击页码
        expected: 跳转至对应的页码页面
      - action: 点击“<”
        expected: 向前翻页
      - action: 点击“>”
        expected: 向后翻页
      - action: 切换每页展示数量
        expected: 每页展示记录数为切换后的数量
    precondition: 无
    tags:
      - 数据质量
      - 质量报告
  - case_id: C0006
    title: 验证「任务实例查询」中 Doris 3.x 数据源任务实例的查询功能正常
    priority: P1
    steps:
      - action: 进入【数据资产】-【数据质量】-【任务实例查询】页面
        expected: 进入成功
      - action: 输入表名/任务名称 ${name}, 进行查询
        expected: 查询出「表」的表名中所有包含${name}的规则记录
      - action: 置空所有查询条件, 输入不存在表名${name2}, 进行查询
        expected: 显示「暂无数据」
      - action: 置空所有查询条件, 输入表名${name3}, 修改人${person3}, 进行查询
        expected: 查询出表名包含${name3}且最近修改人为${person3}的规则记录
      - action: 置空所有查询条件, 勾选「我收藏的表」
        expected: 查询出操作中仅为「取消收藏」的表
      - action: 置空所有查询条件, 切换分页组件为「10条/页」
        expected: 当前页面规则数量变更为10条
      - action: 点击页码
        expected: 跳转至对应的页码页面
      - action: 点击“<”
        expected: 向前翻页
      - action: 点击“>”
        expected: 向后翻页
      - action: 切换每页展示数量
        expected: 每页展示记录数为切换后的数量
    precondition: 无
    tags:
      - 数据质量
      - 任务实例查询
  - case_id: C0007
    title: 验证「规则任务配置」中 Doris 3.x 数据源规则任务的周期调度设置功能正常
    priority: P0
    steps:
      - action: 进入【数据资产】-【数据质量】-【规则任务配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」按钮，进入监控规则配置页面
        expected: 进入成功
      - action: 配置「数据源」「数据库」「数据表」等信息，选择【完整性校验】规则
        expected: 选择成功，展示【完整性校验】规则配置项
      - action: 「校验类型」选择「表级」 「统计函数」 选择「表行数」 「过滤条件」 无 「校验方法」选择「固定值」 「期望值」选择「>5」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
        expected: 配置完成
      - action: 点击「保存」按钮
        expected: 规则配置保存正确
      - action: 点击「下一步」，保持默认「调度配置」
        expected: 调度属性配置完成
      - action: 点击「保存」按钮
        expected: 规则保存成功
      - action: 等待周期运行
        expected: T+1 00:00 生成任务实例, 状态由「运行中」 > 「校验通过」
    precondition: |-
      「数据资产-平台管理-数据源管理」中已存在Doris 3.x数据源并且已授权.
      数据源下存在Doirs表, 可进入离线平台中创建并执行DorisSQL任务:

      DROP TABLE IF EXISTS vehicle_info_part6;

      CREATE TABLE vehicle_info_part6 (
        vin           VARCHAR(64) COMMENT '车辆唯一识别码',
        car_series    STRING COMMENT '车系',
        car_power     STRING COMMENT '动力类型',
        car_config    STRING COMMENT '车型配置',
        car_endurance STRING COMMENT '续航类型',
        drive_type    STRING COMMENT '驱动形式',
        car_equipment STRING COMMENT '车辆配置版本',
        is_certific   INT COMMENT '是否认证',
        delivery_time DATE COMMENT '交付日期'
      )
      ENGINE=OLAP
      DUPLICATE KEY(vin)
      PARTITION BY RANGE(delivery_time) (
        PARTITION p20251001 VALUES [('2025-10-01'), ('2025-10-02')),
        PARTITION p20251002 VALUES [('2025-10-02'), ('2025-10-03'))
      )
      DISTRIBUTED BY HASH(vin) BUCKETS 10
      PROPERTIES (
        replication_num = 1
      );
      -- p20251001 分区（2025-10-01）
      INSERT INTO vehicle_info_part6 VALUES
      ('LDP91C60PE200001','追光','EV','H53a','常规','四驱','N3',1,'2025-10-01'),
      ('LDP91C60PE200002','追光','EV','H53a','常规','四驱','N3',0,'2025-10-01'),
      ('LDP91C60PE200003','追光','EV','H53a','常规','四驱','N3',1,'2025-10-01'),
      ('LDP91C60PE200004','追光','EV','H53a','常规','四驱','N3',NULL,'2025-10-01'),
      ('LDP91C60PE200005','追光','EV','H53a','常规','四驱','N3',1,'2025-10-01'),
      ('LDP91C60PE200001','追光','EV','H53a','常规','四驱','N3',1,'2025-10-01'),
      ('LDP91C60PE200002','追光','EV','H53a','常规','四驱','N3',1,'2025-10-01'),
      ('LDP91C60PE200003','追光','EV','H53a','常规','四驱','N3',1,'2025-10-01');

      SELECT * FROM vehicle_info_part6;
    tags:
      - 数据质量
      - 规则任务配置
