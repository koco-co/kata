    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15603_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15603_c0004 (
           id BIGINT,
           name STRING,
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_15603_c0004 VALUES (1, 'A', 10.00), (2, 'B', 20.00);
      5) 元数据同步任务「${TaskA}」已配置 ${SchemaA}.test_table_15603_c0004 的立即同步
    steps:
