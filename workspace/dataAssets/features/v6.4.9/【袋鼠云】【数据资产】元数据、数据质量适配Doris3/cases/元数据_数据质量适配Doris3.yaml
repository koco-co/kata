    title: 验证【数据质量】-【脏数据管理】编辑数据源脏数据存储时效，列表展示保存后的时效与开启状态
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源 A 类型：Doris3.x
      3) ${DataSourceA} 已授权质量项目 ${ProjectA}，脏数据存储状态为「开启」
      4) 当前用户具有脏数据配置权限
    steps:
      - action: 进入【数据质量 → 脏数据管理】页面
        expected: 进入成功
      - action: 编辑 ${DataSourceA} 的脏数据存储时效为 1 天并保存
        expected: Toast提示:「保存成功」，列表显示存储时效 1 天
      - action: 刷新脏数据管理页面
        expected: ${DataSourceA} 仍显示存储状态「开启」和时效 1 天
    tags:
      - 数据质量
      - 脏数据管理
      - Doris3.x

