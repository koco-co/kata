- case_id: C0001
  title: 验证【数据标准】-【标准定义】编辑历史标准并维护负责人与安全分级，保存后详情回显维护信息
  priority: P2
  precondition: |-
    1) 标准定义列表已存在历史标准数据：
       中文名称：ID
       标准负责人：未维护
       标准安全分类：未维护
       标准安全分级：未维护
    2) 数据安全模块已存在安全分类 类1 与安全分级 机密
  steps:
  - action: 进入【数据标准 → 标准定义】页面
    expected: 进入成功
  - action: 查看标准「ID」的详情
    expected: 详情展示字段值与录入值一致，标准负责人、标准安全分类、标准安全分级均显示「--」
  - action: 编辑标准「ID」，填写标准负责人：UserA，标准安全分类：类1，标准安全分级：机密，点击【保存】
    expected: 提示数据标准保存成功
  - action: 查看标准「ID」的详情
    expected: 详情展示标准负责人：UserA，标准安全分类：类1，标准安全分级：机密
  tags:
  - 数据标准
  - 标准定义
  - 编辑
- case_id: C0002
  title: 验证【数据标准】-【标准定义】按负责人与创建人筛选标准，列表仅展示匹配标准
  priority: P1
  precondition: |-
    1) 标准定义列表已存在账号 UserA 创建的标准：
       中文名称：姓名
       英文名称：name
       英文缩写：na
       标准编号：StandardCodeA
       标准目录：CatalogA
       标准负责人：UserB
       标准安全分类：类1
       标准安全分级：机密
       业务定义：测试
       标准来源：测试
       自定义属性：属性一：1
    2) 标准定义列表已存在账号 UserA 创建的标准：
       中文名称：StandardA
       英文名称：age
       英文缩写：ag
       标准编号：StandardCodeB
       标准目录：CatalogB
       标准负责人：UserC
       标准安全分类：类2
       标准安全分级：机密
       业务定义：测试
       标准来源：测试
       自定义属性：属性一：1
    3) 创建人下拉框可选项包含 UserA、UserD
  steps:
  - action: 进入【数据标准 → 标准定义】页面
    expected: 进入成功
  - action: 点击负责人下拉框，输入：User
    expected: 下拉项展示 UserB、UserC
  - action: 多选 UserB、UserC
    expected: 两个下拉项均被勾选
  - action: 点击创建人下拉框，输入：User
    expected: 下拉项展示 UserA、UserD
  - action: 多选 UserA、UserD
    expected: 两个下拉项均被勾选
  - action: 点击查询
    expected: 列表展示标准「姓名」与标准「StandardA」
  tags:
  - 数据标准
  - 标准定义
  - 筛选查询
