  - case_id: C0001
    title: 验证【规则集管理】-【新建规则集】配置数据变化趋势统计函数，展示维度字段选择框
    source_ref: TP-001
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15915_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15915_c0001 (
           id BIGINT,
           city STRING,
           vin STRING,
           month STRING,
           sales BIGINT
         );
         INSERT INTO ${SchemaA}.test_table_15915_c0001 VALUES
           (1, '北京', 'A', '2026-01', 120),
           (2, '北京', 'A', '2026-02', 135),
           (3, '北京', 'B', '2026-01', 80),
           (4, '北京', 'B', '2026-02', 95);
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15915_c0001
          规则集描述：空
          点击「下一步」
        expected: 进入规则配置步骤，基础信息回显规则集名称、描述、数据源、数据库和数据表
      - action: |-
          配置规则包「packA」的规则（合理性校验-数据变化趋势）：
          * 字段：sales
          * 统计函数：数据变化趋势
        expected: 规则配置区展示「选择排序字段」「校验方法」配置项，并新增「维度字段」选择框（非必填，支持多选）
      - action: 点击「维度字段」选择框，展开候选字段列表
        expected: 候选字段展示当前数据表全部字段，字段项前展示复选框
    tags:
      - 数据质量
      - 规则集管理
  - case_id: C0002
    title: 验证【维度字段】选择字段，保存被阻止并提示上限(字段数 > 10)
    source_ref: TP-002
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建包含 12 个字段的数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15915_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15915_c0002 (
           id BIGINT, f01 STRING, f02 STRING, f03 STRING, f04 STRING,
           f05 STRING, f06 STRING, f07 STRING, f08 STRING, f09 STRING,
           f10 STRING, f11 STRING, sales BIGINT
         );
         INSERT INTO ${SchemaA}.test_table_15915_c0002 VALUES
           (1, 'a01','a02','a03','a04','a05','a06','a07','a08','a09','a10','a11', 100);
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15915_c0002
          规则集描述：空
          点击「下一步」
        expected: 进入规则配置步骤
      - action: |-
          配置规则包「packA」的规则（合理性校验-数据变化趋势）：
          * 字段：sales
          * 统计函数：数据变化趋势
        expected: 规则配置区展示「维度字段」选择框
      - action: 在「维度字段」中勾选 f01 至 f10 共 10 个字段
        expected: 10 个字段全部被选中，已选数量显示 10
      - action: 继续勾选第 11 个字段 f11
        expected: 第 11 个字段不可勾选或提示「最多选择10个」，已选字段保持 10 个
    tags:
      - 数据质量
      - 规则集管理
  - case_id: C0003
    title: 验证【规则集管理】配置维度字段的规则保存成功，规则详情展示维度字段
    source_ref: TP-003
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15915_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15915_c0003 (
           id BIGINT,
           city STRING,
           vin STRING,
           month STRING,
           sales BIGINT
         );
         INSERT INTO ${SchemaA}.test_table_15915_c0003 VALUES
           (1, '北京', 'A', '2026-01', 120),
           (2, '北京', 'A', '2026-02', 135),
           (3, '北京', 'B', '2026-01', 80),
           (4, '北京', 'B', '2026-02', 95);
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15915_c0003
          规则集描述：空
          点击「下一步」
        expected: 进入规则配置步骤
      - action: |-
          配置规则包「packA」的规则（合理性校验-数据变化趋势）：
          * 字段：sales
          * 统计函数：数据变化趋势
          维度字段：city、vin
          过滤条件：空
          * 选择排序字段：month
          * 校验方法：单调递增
          * 强弱规则：弱规则
          规则描述：空
          点击「保存」
        expected: Toast提示:「保存成功」,规则集列表新增 RuleSetA
      - action: 点击「规则集详情」打开 RuleSetA 详情
        expected: 进入 RuleSetA 详情页，展示基本信息与监控规则
      - action: 在监控规则区域查看「合理性校验」规则
        expected: 规则详情展示「维度字段：city、vin」，同时展示「排序字段：month」「校验方法：单调递增」
    tags:
      - 数据质量
      - 规则集管理
