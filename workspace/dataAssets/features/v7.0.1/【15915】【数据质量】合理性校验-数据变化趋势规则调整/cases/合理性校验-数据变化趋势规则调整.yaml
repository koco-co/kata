  - case_id: C0005
    title: 验证【规则任务管理】-【规则任务详情】打开任务详情，展示维度字段
    source_ref: TP-005
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入两个分区：2026-08-04 分区为全部符合规则（达标）的正确数据，2026-08-05 分区为含违反规则的异常数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15915_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15915_c0005 (
           id BIGINT,
           city STRING,
           vin STRING,
           month STRING,
           sales BIGINT
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15915_c0005 PARTITION (dt)
         SELECT 1, '北京', 'A', '2026-01', 120, '2026-08-04'
         UNION ALL SELECT 2, '北京', 'A', '2026-02', 135, '2026-08-04'
         UNION ALL SELECT 1, '北京', 'A', '2026-01', 120, '2026-08-05'
         UNION ALL SELECT 2, '北京', 'A', '2026-02', 100, '2026-08-05';
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15915_c0005
          规则集描述：空
          点击「下一步」
        expected: 进入规则配置步骤，基础信息回显规则集名称、描述、数据源、数据库和数据表
      - action: |-
          配置规则包「packA」的规则（合理性校验-数据变化趋势）：
          * 字段：sales
          * 统计函数：数据变化趋势
          维度字段：city
          过滤条件：空
          * 选择排序字段：month
          * 校验方法：单调递增
          * 强弱规则：弱规则
          规则描述：空
          点击「保存」
        expected: Toast提示:「保存成功」,规则集列表新增 RuleSetA，规则包 packA 规则数量为 1
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击「新建规则任务」
        expected: 打开「新建规则任务」创建向导
      - action: |-
          新建监控任务：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15915_c0005
          选择分区：选择已有分区(dt=2026-08-04)
          抽样检查设置：关闭
          点击「下一步」
        expected: 进入「监控规则」步骤
      - action: |-
          引入规则包：
          * 规则包：packA
          * 规则类型：全部
          点击「引入」并「确定」
        expected: 规则包区域展示 packA，规则行数量为 1
      - action: |-
          配置调度属性：
          * 调度周期：手动触发
          * 规则拼接包：1
          * 资源组：default
          * 超时时间：不限制
          告警方式：无
          无需生成报告：不勾选
          报告名称：质量报告A
          点击「保存」
        expected: Toast提示:「保存成功」,规则任务列表新增 RuleA
      - action: 点击「表名」进入 RuleA 规则任务详情页
        expected: 进入 RuleA 详情页，展示规则配置
      - action: 在规则配置区查看「合理性校验」规则
        expected: 规则详情展示「维度字段：city」，同时展示「字段：sales」「统计函数：数据变化趋势」「排序字段：month」「校验方法：单调递增」
    tags:
      - 数据质量
      - 规则任务管理
