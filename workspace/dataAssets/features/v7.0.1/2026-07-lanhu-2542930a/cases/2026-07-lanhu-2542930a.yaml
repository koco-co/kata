cases:
  - case_id: C0001
    title: 验证中文名称空格策略在新增和编辑中生效
    priority: P0
    steps:
      - action: 进入【数据标准 → 标准管理 → 标准定义】, 点击「新建标准」
        expected: 新建标准表单打开，显示「中文名称」「英文名称」「英文缩写」「标准编号」「标准目录」字段。
      - action: |-
          填写表单：
          - 「中文名称」:「车辆 颜色」
          - 「英文名称」:「vehicle_color_16208」
          - 「英文缩写」:「vc_16208」
          - 「标准编号」:「STD-16208-001」
          - 「标准目录」:「16208-字符限制测试目录」
          - 点击「保存」
        expected: |-
          1) 五个字段均显示输入值；
          2) 「中文名称」中的单个内部空格未触发校验提示；
          3) 保存成功，标准定义列表存在「STD-16208-001」。
      - action: |-
          在标准定义列表搜索「STD-16208-001」，打开编辑页：
          - 将「中文名称」改为「车辆 颜色 2」
          - 保持「英文名称」和「英文缩写」不变
          - 点击「保存」
          - 重新打开详情
        expected: |-
          1) 保存成功；
          2) 中文名称完整显示为「车辆 颜色 2」；
          3) 两个内部空格均保留；
          4) 英文名称、英文缩写和标准目录未被修改。
    precondition: |-
      -- 全局「标准中文名称校验策略」已配置为「取消“中文名”空格字符限制」。
      -- 标准目录「16208-字符限制测试目录」已存在，目录内不存在标准编号「STD-16208-001」。
    tags:
      - 未分类
      - 未分类
  - case_id: C0002
    title: 验证中文名称非法字符和长度边界仍受控
    priority: P1
    steps:
      - action: |-
          进入【数据标准 → 标准管理 → 标准定义】, 点击「新建标准」
          - 「英文名称」:「vehicle_color_boundary_16208」
          - 「英文缩写」:「vcb_16208」
          - 「标准编号」:「STD-16208-002」
          - 「标准目录」:「16208-字符限制边界目录」
          - 在「中文名称」依次输入「车辆 颜色」「车辆  颜色」「 车辆颜色」「车辆颜色 」
          - 每次输入后移出焦点
        expected: |-
          1) 「车辆 颜色」不提示空格错误；
          2) 连续两个内部空格触发连续空格校验；
          3) 首部空格触发首尾空格校验；
          4) 尾部空格触发首尾空格校验。
      - action: 将「中文名称」改为「车辆@颜色」，移出焦点并点击「保存」
        expected: |-
          1) 保存被拦截；
          2) 「中文名称」显示非法字符校验提示；
          3) 标准编号「STD-16208-002」不出现在标准定义列表。
      - action: |-
          将「中文名称」改为长度达到当前字段上限的合法中文名称并点击「保存」
          - 再在末尾追加一个合法中文字符
          - 再次点击「保存」
        expected: |-
          1) 达到上限的值可以按当前长度规则提交；
          2) 超出上限的值被拦截或超出部分不可继续输入；
          3) 不因放宽单个内部空格限制而绕过长度校验。
    precondition: |-
      -- 全局「标准中文名称校验策略」已配置为「取消“中文名”空格字符限制」。
      -- 标准目录「16208-字符限制边界目录」已存在，目录内不存在标准编号「STD-16208-002」。
      -- 新建标准表单中的「英文名称」固定填写「vehicle_color_boundary_16208」，「英文缩写」固定填写「vcb_16208」。
    tags:
      - 未分类
      - 未分类
  - case_id: C0003
    title: 验证标准导入支持含空格的中文名称
    priority: P0
    steps:
      - action: |-
          进入【数据标准 → 标准管理 → 标准定义】, 点击「导入标准」
          - 上传「standard_import_16208.xlsx」
          - 执行导入
        expected: |-
          1) 导入校验完成；
          2) 第2行不因中文名称包含单个内部空格失败；
          3) 第3行被识别为中文名称非法字符错误。
      - action: 查看导入结果中的第2行并打开「STD-16208-003」
        expected: |-
          1) 第2行导入成功；
          2) 详情中的中文名称为「车辆 颜色」；
          3) 内部空格未被删除；
          4) 英文名称和英文缩写与文件一致。
      - action: 查看导入结果中的第3行失败详情
        expected: |-
          1) 第3行未生成标准记录；
          2) 失败原因指向「中文名称」非法字符；
          3) 失败原因不是中文名称空格限制。
    precondition: |-
      -- 全局「标准中文名称校验策略」已配置为「取消“中文名”空格字符限制」。
      -- 标准目录「16208-标准导入目录」已存在。
      -- 已准备文件「standard_import_16208.xlsx」，数据如下：
      -- 第2行：标准编号「STD-16208-003」、中文名称「车辆 颜色」、英文名称「vehicle_color_import_16208」、英文缩写「vci_16208」、标准目录「16208-标准导入目录」。
      -- 第3行：标准编号「STD-16208-004」、中文名称「车辆@颜色」、英文名称「vehicle_color_invalid_16208」、英文缩写「vcii_16208」、标准目录「16208-标准导入目录」。
    tags:
      - 未分类
      - 未分类
  - case_id: C0004
    title: 验证仅中文名称必填策略允许英文名称为空
    priority: P0
    steps:
      - action: |-
          进入【数据标准 → 标准管理 → 标准定义】, 点击「新建标准」
          - 「中文名称」:「车辆颜色中文标准」
          - 「英文名称」留空
          - 「英文缩写」:「vcs_16208」
          - 「标准编号」:「STD-16208-005」
          - 「标准目录」:「16208-英文名称可空目录」
        expected: |-
          1) 「中文名称」显示为已填写；
          2) 「英文名称」为空不显示必填错误；
          3) 其余已填写字段值保持不变。
      - action: 点击「保存」，在标准定义列表搜索「STD-16208-005」并打开详情
        expected: |-
          1) 保存成功；
          2) 详情中的中文名称为「车辆颜色中文标准」；
          3) 英文名称为空；
          4) 未自动生成英文名称。
      - action: |-
          编辑「STD-16208-005」
          - 保持「英文名称」为空
          - 将「业务定义」改为「英文名称可为空的标准」
          - 点击「保存」
          - 重新打开详情
        expected: |-
          1) 保存成功；
          2) 英文名称仍为空；
          3) 业务定义回显为「英文名称可为空的标准」；
          4) 不出现英文名称必填提示。
    precondition: |-
      -- 全局「标准必填项策略」已配置为「仅中文名必填」。
      -- 标准目录「16208-英文名称可空目录」已存在，目录内不存在标准编号「STD-16208-005」。
    tags:
      - 未分类
      - 未分类
  - case_id: C0005
    title: 验证英文名称填写时仍执行原有格式校验
    priority: P1
    steps:
      - action: |-
          进入【数据标准 → 标准管理 → 标准定义】, 点击「新建标准」
          - 「中文名称」:「车辆颜色格式标准」
          - 「英文名称」:「vehicle_color_format_16208」
          - 「英文缩写」:「vcf_16208」
          - 「标准编号」:「STD-16208-006」
          - 「标准目录」:「16208-英文名称格式目录」
          - 点击「保存」
        expected: |-
          1) 保存成功；
          2) 标准详情保存合法英文名称「vehicle_color_format_16208」。
      - action: |-
          编辑「STD-16208-006」
          - 将「英文名称」改为「车辆颜色」
          - 点击「保存」
        expected: |-
          1) 保存被拦截；
          2) 「英文名称」显示格式校验提示；
          3) 原标准详情中的合法英文名称未被非法值覆盖。
      - action: |-
          将「英文名称」改为空
          - 保持「中文名称」=「车辆颜色格式标准」及其他必填字段不变
          - 点击「保存」
        expected: |-
          1) 保存成功；
          2) 英文名称为空；
          3) 「英文名称」非必填没有取消中文名称等其他字段的校验。
    precondition: |-
      -- 全局「标准必填项策略」已配置为「仅中文名必填」。
      -- 标准目录「16208-英文名称格式目录」已存在，目录内不存在标准编号「STD-16208-006」。
    tags:
      - 未分类
      - 未分类
