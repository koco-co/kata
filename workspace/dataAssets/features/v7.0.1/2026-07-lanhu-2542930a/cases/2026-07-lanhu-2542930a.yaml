  - case_id: C0007
    title: 验证标准映射按中文字段匹配并可补录英文名称
    priority: P1
    steps:
      - action: 进入【数据标准 → 标准管理 → 标准映射】
        expected: 标准映射页面打开。
      - action: |-
          打开对象「table_standard_mapping_16208」
          - 执行标准匹配
          - 按中文字段名称搜索「车辆颜色中文标准」
        expected: |-
          1) 搜索结果包含标准「STD-16208-005」；
          2) 标准英文名称为空不影响中文字段匹配。
      - action: 选中「STD-16208-005」完成匹配，查看匹配后的字段行
        expected: |-
          1) 字段行的「字段名（英文名称）」显示可编辑输入框；
          2) 当前值为空；
          3) 所属标准显示「车辆颜色中文标准」。
      - action: |-
          在「字段名（英文名称）」输入「vehicle_color_mapping_16208」
          - 提交映射
          - 重新打开对象
        expected: |-
          1) 映射保存成功；
          2) 字段英文名称显示「vehicle_color_mapping_16208」；
          3) 所属标准仍为「STD-16208-005」；
          4) 中文字段名称未改变。
    precondition: |-
      -- 全局「标准必填项策略」已配置为「仅中文名必填」。
      -- 标准「STD-16208-005」的中文名称为「车辆颜色中文标准」，英文名称为空。
      -- 「标准映射」中已准备待匹配对象「table_standard_mapping_16208」，其中字段中文名称为「车辆颜色中文标准」，字段英文名称为空。
    tags:
      - 未分类
      - 未分类
  - case_id: C0008
    title: 验证数据模型表结构字段导入允许英文名称为空
    priority: P1
    steps:
      - action: 进入【数据模型 → 规范建表】
        expected: 规范建表页面打开。
      - action: |-
          进入「表解析模式」
          - 输入「CREATE TABLE model_standard_16208 (vehicle_color STRING COMMENT '车辆 颜色模型标准');」
          - 执行解析
        expected: |-
          1) 表结构解析成功；
          2) 字段中文名称显示「车辆 颜色模型标准」；
          3) 单个内部空格不触发字符格式错误。
      - action: |-
          对字段「车辆 颜色模型标准」执行标准关联
          - 选择「STD-16208-007」
          - 保持「字段名（英文名称）」为空
        expected: |-
          1) 标准关联成功；
          2) 英文名称为空不阻断字段导入；
          3) 「字段名（英文名称）」仍显示可编辑输入框。
      - action: |-
          在「字段名（英文名称）」输入「vehicle_color_model_16208」
          - 完成字段导入
          - 重新打开表结构
        expected: |-
          1) 字段导入成功；
          2) 英文名称保存并回显为「vehicle_color_model_16208」；
          3) 所属标准仍为「STD-16208-007」；
          4) 中文字段名称仍为「车辆 颜色模型标准」。
    precondition: |-
      -- 全局「标准必填项策略」已配置为「仅中文名必填」。
      -- 标准「STD-16208-007」的中文名称为「车辆 颜色模型标准」，英文名称为空。
      -- 已准备数据模型表解析语句：
      -- CREATE TABLE model_standard_16208 (vehicle_color STRING COMMENT '车辆 颜色模型标准');
    tags:
      - 未分类
      - 未分类
