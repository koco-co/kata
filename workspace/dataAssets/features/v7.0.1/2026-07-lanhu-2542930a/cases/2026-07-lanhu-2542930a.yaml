      -- 标准「STD-16208-005」的中文名称为「车辆颜色中文标准」，英文名称为空。
      -- 数据质量规则「rule_standard_16208」已存在，规则配置页可编辑，引用对象为字段「车辆颜色中文标准」。
    tags:
      - 未分类
      - 未分类
