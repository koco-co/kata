cases:
  - id: C1
    title: 验证表中文名组合使用允许字符后可进入表结构
    priority: P0
    steps:
      - action: |-
          进入【数据模型 → 建表】, 点击「新建表」
          - 写入数据源: 「${DataSourceA}」
          - 写入数据库: 「${SchemaA}」
          - 数仓层级: 「${WarehouseLevelA}」
          - 表名: 「model_cn_name_001」
          - 表中文名: 「车辆A123 (新能源)-_」
          - 存储格式: 「PARQUET」
          - 生命周期: 「9999」天
          - 表类型: 「内部表」
          - hdfs存储路径: 留空
          - 点击「下一步」
        expected: |-
          1)基础信息校验通过；
          2)进入「表结构」步骤；
          3)「表中文名」保留为「车辆A123 (新能源)-_」，中文、英文、数字、单个内部空格、括号、连字符和下划线均未被删除或改写。
    precondition: |-
      -- 已准备可在「数据模型 → 建表」中选择的数据源「${DataSourceA}」、数据库「${SchemaA}」和数仓层级「${WarehouseLevelA}」。
      -- 「${DataSourceA}」为可配置「存储格式」「表类型」和「hdfs存储路径」的数据源。
    tags:
      - 未分类
      - 未分类
  - id: C2
    title: 验证表中文名逐项支持中文英文数字空格及符号
    priority: P0
    steps:
      - action: |-
          进入【数据模型 → 建表】, 点击「新建表」
          - 写入数据源: 「${DataSourceA}」
          - 写入数据库: 「${SchemaA}」
          - 数仓层级: 「${WarehouseLevelA}」
          - 表名: 依次使用「model_cn_name_002_01」至「model_cn_name_002_07」
          - 表中文名: 依次使用「车辆」「Vehicle」「123」「车辆 颜色」「车辆(新能源)」「车辆-新能源」「车辆_新能源」
          - 存储格式: 「PARQUET」
          - 生命周期: 「9999」天
          - 表类型: 「内部表」
          - hdfs存储路径: 留空
          - 每组值填写完成后点击「下一步」，返回建表页继续下一组
        expected: |-
          1)七组「表中文名」值均通过基础信息校验；
          2)每组值均进入「表结构」步骤；
          3)单个内部空格、括号、连字符和下划线均保留在表中文名中。
    precondition: |-
      -- 已准备可在「数据模型 → 建表」中选择的数据源「${DataSourceA}」、数据库「${SchemaA}」和数仓层级「${WarehouseLevelA}」。
      -- 「${DataSourceA}」为可配置「存储格式」「表类型」和「hdfs存储路径」的数据源。
      -- 待验证的「表中文名」值已准备：中文「车辆」、英文「Vehicle」、数字「123」、单个内部空格「车辆 颜色」、括号「车辆(新能源)」、连字符「车辆-新能源」、下划线「车辆_新能源」。
    tags:
      - 未分类
      - 未分类
  - id: C3
    title: 验证表中文名首部空格不能通过建表校验
    priority: P1
    steps:
      - action: |-
          进入【数据模型 → 建表】, 点击「新建表」
          - 写入数据源: 「${DataSourceA}」
          - 写入数据库: 「${SchemaA}」
          - 数仓层级: 「${WarehouseLevelA}」
          - 表名: 「model_cn_name_003」
          - 表中文名: 「 车辆颜色」
          - 存储格式: 「PARQUET」
          - 生命周期: 「9999」天
          - 表类型: 「内部表」
          - hdfs存储路径: 留空
          - 点击「下一步」
        expected: |-
          1)表单保持在基础信息步骤，不能进入「表结构」步骤；
          2)「表中文名」出现校验失败状态，首部空格不能以成功建表基础信息的值提交。
    precondition: |-
      -- 已准备可在「数据模型 → 建表」中选择的数据源「${DataSourceA}」、数据库「${SchemaA}」和数仓层级「${WarehouseLevelA}」。
      -- 「${DataSourceA}」为可配置「存储格式」「表类型」和「hdfs存储路径」的数据源。
