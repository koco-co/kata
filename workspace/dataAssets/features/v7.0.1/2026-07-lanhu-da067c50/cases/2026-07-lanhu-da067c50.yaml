    priority: P1
    steps:
      - action: |-
          进入【数据模型 → 建表】, 点击「新建表」
          - 写入数据源: 「${DataSourceA}」
          - 写入数据库: 「${SchemaA}」
          - 数仓层级: 「${WarehouseLevelA}」
          - 表名: 依次使用「model_cn_name_006_01」「model_cn_name_006_02」「model_cn_name_006_03」
          - 表中文名: 依次使用「车辆/颜色」「车辆@颜色」「车辆.颜色」
          - 存储格式: 「PARQUET」
          - 生命周期: 「9999」天
          - 表类型: 「内部表」
