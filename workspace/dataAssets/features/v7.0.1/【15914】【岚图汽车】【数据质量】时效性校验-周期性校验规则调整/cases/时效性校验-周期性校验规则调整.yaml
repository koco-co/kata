    title: 验证【校验结果查询】-【数据源兼容】在SparkThrift2.x与Doris3.x执行等价分组数据，结果与违规明细一致
    source_ref: TP-015
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 在 ${DataSourceA} 创建分区表，dt=2026-08-04 为全部符合规则的正确数据，dt=2026-08-05 为仅 VIN-B 分组含 90 分钟违规间隔的异常数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15914_c0015_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15914_c0015_source (
           id BIGINT,
           vin STRING,
           event_seq BIGINT,
           event_time STRING
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15914_c0015_source PARTITION (dt='2026-08-04') VALUES
           (1, 'VIN-A', 1, '2026-08-05 08:00:00'),
           (2, 'VIN-A', 2, '2026-08-05 08:30:00');
         INSERT INTO ${SchemaA}.test_table_15914_c0015_source PARTITION (dt='2026-08-05') VALUES
           (3, 'VIN-A', 1, '2026-08-05 08:00:00'),
           (4, 'VIN-B', 1, '2026-08-05 08:30:00'),
           (5, 'VIN-B', 2, '2026-08-05 10:00:00');
      5) 授权数据源：${DataSourceB}
      6) 数据源类型：Doris3.x
      7) 存在数据库：${SchemaB}
      8) 在 ${DataSourceB} 创建分区表并写入与 ${DataSourceA} 等价的正确、异常数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15914_c0015_target;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15914_c0015_target (
           id BIGINT,
           vin VARCHAR(32),
           event_seq BIGINT,
           event_time DATETIME,
           dt DATE
         )
         DUPLICATE KEY(id)
         PARTITION BY RANGE(dt) (
           PARTITION p20260804 VALUES LESS THAN ("2026-08-05"),
           PARTITION p20260805 VALUES LESS THAN ("2026-08-06"),
           PARTITION pmax VALUES LESS THAN (MAXVALUE)
         )
         DISTRIBUTED BY HASH(id) BUCKETS 1
         PROPERTIES ("replication_num" = "1");
