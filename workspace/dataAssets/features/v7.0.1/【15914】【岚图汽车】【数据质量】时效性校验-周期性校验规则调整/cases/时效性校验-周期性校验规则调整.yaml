  - case_id: C0004
    title: 验证【规则任务管理】-【规则任务详情】执行含维度字段的周期性校验，任务详情与监控报告展示维度字段
    source_ref: TP-004
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入两个分区，dt=2026-08-04 为全部符合规则的正确数据，dt=2026-08-05 为全部不符合规则的异常数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15914_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15914_c0004 (
           id BIGINT,
           vin STRING,
           event_seq BIGINT,
           event_time STRING
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15914_c0004 PARTITION (dt='2026-08-04') VALUES
           (1, 'VIN-A', 1, '2026-08-05 08:00:00'),
           (2, 'VIN-A', 2, '2026-08-05 08:30:00');
         INSERT INTO ${SchemaA}.test_table_15914_c0004 PARTITION (dt='2026-08-05') VALUES
           (3, 'VIN-B', 1, '2026-08-05 08:00:00'),
           (4, 'VIN-B', 2, '2026-08-05 10:00:00');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15914_c0004
          规则集描述：空
          点击「下一步」
        expected: 进入规则配置步骤
      - action: |-
          配置规则包「PackA」的规则（时效性校验-周期性校验（单字段时间差校验））：
          * 字段：event_time
          * 统计函数：周期性校验（单字段时间差校验）
          维度字段：vin
          过滤条件：空
          * 选择排序字段：event_seq
          * 时间差：<= 60 分钟
          * 强弱规则：弱规则
          规则描述：空
          点击「保存」
        expected: Toast提示:「保存成功」,规则集列表新增 RuleSetA，规则包 PackA 规则数量为 1
      - action: |-
          进入【数据质量 → 规则任务管理】页面，点击「新建规则任务」：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15914_c0004
          选择分区：选择已有分区(dt=2026-08-04)
          抽样检查设置：关闭
          点击「下一步」
        expected: 进入「监控规则」步骤
      - action: |-
          引入规则包：
          * 规则包：PackA
          * 规则类型：全部
          点击「引入」并「确定」
        expected: 规则包区域展示 PackA，规则行数量为 1
      - action: |-
          配置调度属性：
          * 调度周期：手动触发
          * 规则拼接包：2
          * 资源组：default
          * 超时时间：30分钟
          告警方式：无
          无需生成报告：不勾选
          报告名称：质量报告A
          点击「保存」
        expected: Toast提示:「保存成功」,规则任务列表新增 RuleA
      - action: 点击「表名」进入 RuleA 规则任务详情页
        expected: 进入 RuleA 详情页，展示规则配置和「立即执行」操作
      - action: 在规则配置区查看周期性校验规则
        expected: 任务详情展示「维度字段：vin」，并展示字段 event_time、排序字段 event_seq 和时间差 <= 60 分钟
      - action: 点击「立即执行」
        expected: 提示执行成功，任务进入调度
      - action: 进入【数据质量 → 校验结果查询】页面，定位 RuleA 最新运行实例
        expected: 任务状态为「运行成功」，结果状态为「达标」
      - action: 打开最新运行实例的「监控报告」并查看周期性校验规则
        expected: 监控报告展示「维度字段：vin」，并完整展示字段 event_time、排序字段 event_seq 和时间差 <= 60 分钟
    tags:
      - 数据质量
      - 规则任务管理

  - case_id: C0005
    title: 验证【校验结果查询】-【无维度周期性校验】按全表排序比较交错车辆数据，保留全表比较行为
    source_ref: TP-005
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入两个分区，dt=2026-08-04 为全表相邻间隔 30 分钟的正确数据，dt=2026-08-05 为各车辆组内不违规但全表存在跨车辆 120 分钟间隔的异常数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15914_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15914_c0005 (
           id BIGINT,
           vin STRING,
           event_seq BIGINT,
           event_time STRING
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15914_c0005 PARTITION (dt='2026-08-04') VALUES
           (1, 'VIN-A', 1, '2026-08-05 08:00:00'),
           (2, 'VIN-B', 2, '2026-08-05 08:30:00');
         INSERT INTO ${SchemaA}.test_table_15914_c0005 PARTITION (dt='2026-08-05') VALUES
           (3, 'VIN-A', 1, '2026-08-05 08:00:00'),
           (4, 'VIN-B', 2, '2026-08-05 10:00:00'),
           (5, 'VIN-A', 3, '2026-08-05 08:30:00');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15914_c0005
          规则集描述：无维度历史兼容验证
          点击「下一步」
        expected: 进入规则配置步骤
      - action: |-
          配置规则包「PackA」的规则（时效性校验-周期性校验（单字段时间差校验））：
          * 字段：event_time
          * 统计函数：周期性校验（单字段时间差校验）
          维度字段：空
          过滤条件：空
          * 选择排序字段：event_seq
          * 时间差：<= 60 分钟
          * 强弱规则：弱规则
          规则描述：无维度历史兼容验证
          点击「保存」
        expected: Toast提示:「保存成功」,规则集列表新增 RuleSetA，维度字段保持为空
      - action: |-
          进入【数据质量 → 规则任务管理】页面，点击「新建规则任务」：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15914_c0005
          选择分区：选择已有分区(dt=2026-08-05)
          抽样检查设置：关闭
          点击「下一步」
        expected: 进入「监控规则」步骤
      - action: |-
          引入规则包：
          * 规则包：PackA
          * 规则类型：全部
          点击「引入」并「确定」
        expected: 规则包区域展示 PackA，规则行数量为 1
      - action: |-
          配置调度属性：
          * 调度周期：手动触发
          * 规则拼接包：2
          * 资源组：default
          * 超时时间：30分钟
          告警方式：无
          无需生成报告：不勾选
          报告名称：质量报告A
          点击「保存」
        expected: Toast提示:「保存成功」,规则任务列表新增 RuleA
      - action: 点击「表名」进入 RuleA 规则任务详情页
        expected: 进入 RuleA 详情页，周期性校验规则的维度字段为空
      - action: 点击「立即执行」
        expected: 提示执行成功，任务进入调度
      - action: 进入【数据质量 → 校验结果查询】页面，定位 RuleA 最新运行实例
        expected: |-
          1) 任务状态为「运行成功」，结果状态为「不达标」
          2) 按 event_seq 全表比较时，id=3 与 id=4 的跨车辆相邻时间差为 120 分钟并违反 <= 60 分钟规则
          3) 结果未按 vin 分组，符合未配置维度时的历史全表比较行为
    tags:
      - 数据质量
      - 校验结果查询

