cases:
  - case_id: C0001
    title: 验证【规则集管理】-【周期性校验】选择单字段时间差统计函数，展示非必填多选维度字段
    source_ref: TP-001
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15914_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15914_c0001 (
           id BIGINT,
           vin STRING,
           city STRING,
           event_seq BIGINT,
           event_time STRING
         );
         INSERT INTO ${SchemaA}.test_table_15914_c0001 VALUES
           (1, 'VIN-A', '武汉', 1, '2026-08-05 08:00:00'),
           (2, 'VIN-A', '武汉', 2, '2026-08-05 08:30:00');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15914_c0001
          规则集描述：空
          点击「下一步」
        expected: 进入规则配置步骤，基础信息回显规则集名称、描述、数据源、数据库和数据表
      - action: |-
          配置规则包「PackA」的规则（时效性校验-周期性校验（单字段时间差校验））：
          * 字段：event_time
          * 统计函数：周期性校验（单字段时间差校验）
          维度字段：空
          过滤条件：空
          * 选择排序字段：event_seq
          * 时间差：<= 60 分钟
          * 强弱规则：弱规则
          规则描述：空
        expected: 「维度字段」选择框展示在统计函数之后，标识为非必填并支持多选
      - action: 在「维度字段」中依次选择 vin、city
        expected: vin、city 同时保持选中，已选项以两个独立标签回显且可分别移除
    tags:
      - 数据质量
      - 规则集管理

  - case_id: C0002
    title: 验证【规则集管理】-【维度字段】选择10个维度后继续选择第11个，限制选择并完整保存上限值
    source_ref: TP-002
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建包含 14 个字段的数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15914_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15914_c0002 (
           id BIGINT,
           d01 STRING, d02 STRING, d03 STRING, d04 STRING, d05 STRING,
           d06 STRING, d07 STRING, d08 STRING, d09 STRING, d10 STRING,
           d11 STRING,
           event_seq BIGINT,
           event_time STRING
         );
         INSERT INTO ${SchemaA}.test_table_15914_c0002 VALUES
           (1, 'a01', 'a02', 'a03', 'a04', 'a05', 'a06', 'a07', 'a08', 'a09', 'a10', 'a11', 1, '2026-08-05 08:00:00'),
           (2, 'a01', 'a02', 'a03', 'a04', 'a05', 'a06', 'a07', 'a08', 'a09', 'a10', 'a11', 2, '2026-08-05 08:30:00');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15914_c0002
          规则集描述：空
          点击「下一步」
        expected: 进入规则配置步骤
      - action: |-
          配置规则包「PackA」的规则（时效性校验-周期性校验（单字段时间差校验））：
          * 字段：event_time
          * 统计函数：周期性校验（单字段时间差校验）
          维度字段：d01、d02、d03、d04、d05、d06、d07、d08、d09、d10
          过滤条件：空
          * 选择排序字段：event_seq
          * 时间差：<= 60 分钟
          * 强弱规则：弱规则
          规则描述：十维度上限验证
        expected: d01 至 d10 共 10 个维度字段全部保持选中，已选数量为 10
      - action: 继续在「维度字段」中选择 d11
        expected: d11 不会新增到已选项或页面提示「最多选择10个」，已选字段仍为 d01 至 d10
      - action: 点击「保存」
        expected: Toast提示:「保存成功」,规则集列表新增 RuleSetA，规则包 PackA 规则数量为 1
      - action: 点击「规则集详情」打开 RuleSetA 详情并查看周期性校验规则
        expected: 维度字段完整回显 d01 至 d10，不包含 d11，其他规则参数与保存值一致
    tags:
      - 数据质量
      - 规则集管理

