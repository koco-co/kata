  - case_id: C0006
    title: 验证【数据模型】-【建表】配置未列入允许集合字符的表中文名，校验失败且字符不被改写
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16210_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16210_c0006 (id BIGINT);
         INSERT INTO ${SchemaA}.test_table_16210_c0006 VALUES (1);
      5) 存在数仓层级：${WarehouseLevelA}
      6) 表名与表中文名映射为：
         test_table_16210_c0006_source_01：车辆/颜色
         test_table_16210_c0006_source_02：车辆@颜色
         test_table_16210_c0006_source_03：车辆.颜色
    steps:
      - action: 进入【数据模型 → 建表】页面
