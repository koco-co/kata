meta:
  title: 【数据模型】建表中文名增加支持字符
  feature_id: modeling-table-display-name-characters
  requirement_id: "16210"
  case_module_id: ""
  exports:
    - 建表中文名增加支持字符.xmind
cases:
  - case_id: C0001
    title: 验证【数据模型】-【建表】组合使用允许字符配置表中文名，进入表结构步骤且字符完整保留
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16210_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16210_c0001 (id BIGINT);
         INSERT INTO ${SchemaA}.test_table_16210_c0001 VALUES (1);
      5) 存在数仓层级：${WarehouseLevelA}
      6) ${DataSourceA} 支持存储格式「PARQUET」和表类型「内部表」
    steps:
      - action: 进入【数据模型 → 建表】页面
        expected: 进入成功
      - action: 点击「新建表」
        expected: 配置完成
      - action: |-
          基础信息：
          数据源：${DataSourceA}
          数据库：${SchemaA}
          数仓层级：${WarehouseLevelA}
          表名：test_table_16210_c0001
          表中文名：车辆 A123(新能源)-_
          存储格式：PARQUET
          生命周期：9999 天
          表类型：内部表
          HDFS 存储路径：留空
          点击「下一步」
        expected: |-
          1) 进入「表结构」步骤
          2) 「表中文名」显示为「车辆 A123(新能源)-_」
          3) 中文、英文、数字、单个内部空格、括号、连字符和下划线均保留
    tags:
      - 数据模型
      - 建表
      - 表中文名

  - case_id: C0002
    title: 验证【数据模型】-【建表】逐项配置中文、英文、数字、空格及符号表中文名，均进入表结构步骤
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16210_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16210_c0002 (id BIGINT);
         INSERT INTO ${SchemaA}.test_table_16210_c0002 VALUES (1);
      5) 存在数仓层级：${WarehouseLevelA}
      6) 表名与表中文名映射为：
         test_table_16210_c0002_source_01：车辆
         test_table_16210_c0002_source_02：Vehicle
         test_table_16210_c0002_source_03：123
         test_table_16210_c0002_source_04：车辆 颜色
         test_table_16210_c0002_source_05：车辆(新能源)
         test_table_16210_c0002_source_06：车辆-新能源
         test_table_16210_c0002_source_07：车辆_新能源
    steps:
      - action: 进入【数据模型 → 建表】页面
        expected: 进入成功
      - action: |-
          按前置条件中的 7 组映射依次新建表，每组配置：
          数据源：${DataSourceA}
          数据库：${SchemaA}
          数仓层级：${WarehouseLevelA}
          存储格式：PARQUET
          生命周期：9999 天
          表类型：内部表
          HDFS 存储路径：留空
        expected: 表单配置完成
      - action: 点击「下一步」，记录结果后返回建表页
        expected: |-
          1) 7 组数据均进入「表结构」步骤
          2) 「表中文名」分别保留中文、英文、数字、单个内部空格、括号、连字符和下划线
    tags:
      - 数据模型
      - 建表
      - 表中文名

