meta:
  title: 【数据标准】支持配置标准中英文字符限制条件
  feature_id: standards-name-character-constraints
  requirement_id: "16208"
  case_module_id: ""
  exports:
    - 支持配置标准中英文字符限制条件.xmind
cases:
  - case_id: C0001
    title: 验证【数据标准】-【标准定义】新建与编辑标准录入含内部空格中文名称，保存成功且内部空格保留
    priority: P0
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: 点击「新建标准」
        expected: 新建标准表单打开，显示「中文名称」「英文名称」「英文缩写」「标准编号」「标准目录」字段
      - action: |-
          填写表单：
          中文名称：车辆 颜色
          英文名称：vehicle_color_16208
          英文缩写：vc_16208
          标准编号：StandardCodeA
          标准目录：CatalogA
          点击「保存」
        expected: |-
          1) 五个字段均显示输入值
          2) 「中文名称」中的单个内部空格未触发校验提示
          3) 保存成功，标准定义列表存在 StandardCodeA
      - action: |-
          在标准定义列表搜索 StandardCodeA，打开编辑页：
          将「中文名称」改为「车辆 颜色 2」
          保持「英文名称」和「英文缩写」不变
          点击「保存」
          重新打开详情
        expected: |-
          1) 保存成功
          2) 中文名称完整显示为「车辆 颜色 2」
          3) 两个内部空格均保留
          4) 英文名称、英文缩写和标准目录未被修改
    precondition: |-
      1) 全局「标准中文名称校验策略」已配置为「取消“中文名”空格字符限制」
      2) 标准目录 CatalogA 已存在，目录内不存在标准编号 StandardCodeA
    tags:
      - 数据标准
      - 标准定义
      - 新建标准
  - case_id: C0002
    title: 验证【数据标准】-【标准定义】新建标准并校验中文名称边界，非法与超长输入被拦截(字符非法或长度超长)
    priority: P1
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: |-
          点击「新建标准」
          英文名称：vehicle_color_boundary_16208
          英文缩写：vcb_16208
          标准编号：StandardCodeA
          标准目录：CatalogA
          在「中文名称」依次输入「车辆 颜色」「车辆  颜色」「 车辆颜色」「车辆颜色 」
          每次输入后移出焦点
        expected: |-
          1) 「车辆 颜色」不提示空格错误
          2) 连续两个内部空格触发连续空格校验
          3) 首部空格触发首尾空格校验
          4) 尾部空格触发首尾空格校验
      - action: 将「中文名称」改为「车辆@颜色」，移出焦点并点击「保存」
        expected: |-
          1) 保存被拦截
          2) 「中文名称」显示非法字符校验提示
          3) 标准编号 StandardCodeA 不出现在标准定义列表
      - action: |-
          将「中文名称」改为长度达到当前字段上限的合法中文名称并点击「保存」
          再在末尾追加一个合法中文字符
          再次点击「保存」
        expected: |-
          1) 达到上限的值可以按当前长度规则提交
          2) 超出上限的值被拦截或超出部分不可继续输入
          3) 不因放宽单个内部空格限制而绕过长度校验
    precondition: |-
      1) 全局「标准中文名称校验策略」已配置为「取消“中文名”空格字符限制」
      2) 标准目录 CatalogA 已存在，目录内不存在标准编号 StandardCodeA
      3) 标准表单中的「英文名称」固定为「vehicle_color_boundary_16208」，「英文缩写」固定为「vcb_16208」
    tags:
      - 数据标准
      - 标准定义
      - 字符校验
  - case_id: C0003
    title: 验证【数据标准】-【标准定义】导入含空格中文名称的标准文件，合法行导入成功且非法行报错
    priority: P0
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: |-
          点击「导入标准」
          上传 standard_import_16208.xlsx
          执行导入
        expected: |-
          1) 导入校验完成
          2) 第2行不因中文名称包含单个内部空格失败
          3) 第3行被识别为中文名称非法字符错误
      - action: 查看导入结果中的第2行并打开 StandardCodeA 对应标准
        expected: |-
          1) 第2行导入成功
          2) 详情中的中文名称为「车辆 颜色」
          3) 内部空格未被删除
          4) 英文名称和英文缩写与文件一致
      - action: 查看导入结果中的第3行失败详情
        expected: |-
          1) 第3行未生成标准记录
          2) 失败原因指向「中文名称」非法字符
          3) 失败原因不是中文名称空格限制
    precondition: |-
      1) 全局「标准中文名称校验策略」已配置为「取消“中文名”空格字符限制」
      2) 标准目录 CatalogA 已存在
      3) 创建导入文件 standard_import_16208.xlsx：
         Sheet: Sheet1
         Title: * 标准编号, 标准目录, 中文名称, 英文名称, 英文缩写
         Line1: StandardCodeA, CatalogA, 车辆 颜色, vehicle_color_import_16208, vci_16208
         Line2: StandardCodeB, CatalogA, 车辆@颜色, vehicle_color_invalid_16208, vcii_16208
    tags:
      - 数据标准
      - 标准定义
      - 导入标准
  - case_id: C0004
    title: 验证【数据标准】-【标准定义】新建与编辑标准时保持英文名称未填写，保存成功且不自动生成英文名称(英文名称 = 空)
    priority: P0
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: |-
          点击「新建标准」
          中文名称：车辆颜色中文标准
          英文名称：留空
          英文缩写：vcs_16208
          标准编号：StandardCodeA
          标准目录：CatalogA
        expected: |-
          1) 「中文名称」显示为已填写
          2) 「英文名称」为空不显示必填错误
          3) 其余已填写字段值保持不变
      - action: 点击「保存」，在标准定义列表搜索 StandardCodeA 并打开详情
        expected: |-
          1) 保存成功
          2) 详情中的中文名称为「车辆颜色中文标准」
          3) 英文名称为空
          4) 未自动生成英文名称
      - action: |-
          编辑 StandardCodeA 对应标准
          保持「英文名称」为空
          将「业务定义」改为「英文名称可为空的标准」
          点击「保存」
          重新打开详情
        expected: |-
          1) 保存成功
          2) 英文名称仍为空
          3) 业务定义回显为「英文名称可为空的标准」
          4) 不出现英文名称必填提示
    precondition: |-
      1) 全局「标准必填项策略」已配置为「仅中文名必填」
      2) 标准目录 CatalogA 已存在，目录内不存在标准编号 StandardCodeA
    tags:
      - 数据标准
      - 标准定义
      - 必填策略
  - case_id: C0005
    title: 验证【数据标准】-【标准定义】新建与编辑标准时填写英文名称，格式校验拦截且可留空保存(英文名称非法或为空)
    priority: P1
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: |-
          点击「新建标准」
          中文名称：车辆颜色格式标准
          英文名称：vehicle_color_format_16208
          英文缩写：vcf_16208
          标准编号：StandardCodeA
          标准目录：CatalogA
          点击「保存」
        expected: |-
          1) 保存成功
          2) 标准详情保存合法英文名称「vehicle_color_format_16208」
      - action: |-
          编辑 StandardCodeA 对应标准
          将「英文名称」改为「车辆颜色」
          点击「保存」
        expected: |-
          1) 保存被拦截
          2) 「英文名称」显示格式校验提示
          3) 原标准详情中的合法英文名称未被非法值覆盖
      - action: |-
          将「英文名称」改为空
          保持「中文名称」=「车辆颜色格式标准」及其他必填字段不变
          点击「保存」
        expected: |-
          1) 保存成功
          2) 英文名称为空
          3) 「英文名称」非必填没有取消中文名称等其他字段的校验
    precondition: |-
      1) 全局「标准必填项策略」已配置为「仅中文名必填」
      2) 标准目录 CatalogA 已存在，目录内不存在标准编号 StandardCodeA
    tags:
      - 数据标准
      - 标准定义
      - 编辑标准
  - case_id: C0006
    title: 验证【数据标准】-【标准定义】默认策略下新建标准，含空格中文名称与空英文名称均被拦截
    priority: P1
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: |-
          点击「新建标准」
          中文名称：车辆 颜色默认策略
          英文名称：vehicle_color_default_16208
          英文缩写：vcd_16208
          标准编号：StandardCodeA
          标准目录：CatalogA
          点击「保存」
        expected: |-
          1) 保存被拦截
          2) 「中文名称」仍按全局默认策略提示不允许内部空格
          3) 标准编号 StandardCodeA 未生成标准记录
      - action: |-
          点击「新建标准」
          中文名称：车辆颜色默认必填
          英文名称：留空
          英文缩写：vcd_required_16208
          标准编号：StandardCodeB
          标准目录：CatalogA
          点击「保存」
        expected: |-
          1) 保存被拦截
          2) 「英文名称」仍提示必填
          3) 标准编号 StandardCodeB 未生成标准记录
      - action: |-
          点击「新建标准」
          中文名称：车辆颜色默认合法
          英文名称：vehicle_color_default_valid_16208
          英文缩写：vcdv_16208
          标准编号：StandardCodeC
          标准目录：CatalogA
          点击「保存」
        expected: |-
          1) 保存成功
          2) 标准定义列表存在 StandardCodeC
          3) 默认全局策略未被前两次失败提交改变
    precondition: |-
      1) 全局「标准中文名称校验策略」保持默认值，未启用「取消“中文名”空格字符限制」
      2) 全局「标准必填项策略」保持默认值，英文名称仍为必填
      3) 标准目录 CatalogA 已存在，目录内不存在本用例使用的标准编号
    tags:
      - 数据标准
      - 标准定义
      - 默认策略
  - case_id: C0007
    title: 验证【数据标准】-【标准映射】按中文字段匹配标准并补录英文名称，匹配成功且英文名称可编辑
    priority: P1
    steps:
      - action: 进入【数据标准 → 标准映射】页面
        expected: 进入成功
      - action: |-
          打开对象 test_table_16208_c0007
          执行标准匹配
          按中文字段名称搜索「车辆颜色中文标准」
        expected: |-
          1) 搜索结果包含标准 StandardA
          2) 标准英文名称为空不影响中文字段匹配
      - action: 选中 StandardA 完成匹配，查看匹配后的字段行
        expected: |-
          1) 字段行的「字段名（英文名称）」显示可编辑输入框
          2) 当前值为空
          3) 所属标准显示「车辆颜色中文标准」
      - action: |-
          在「字段名（英文名称）」输入「vehicle_color_mapping_16208」
          提交映射
          重新打开对象
        expected: |-
          1) 映射保存成功
          2) 字段英文名称显示「vehicle_color_mapping_16208」
          3) 所属标准仍为 StandardA
          4) 中文字段名称未改变
    precondition: |-
      1) 全局「标准必填项策略」已配置为「仅中文名必填」
      2) 标准 StandardA 的中文名称为「车辆颜色中文标准」，英文名称为空
      3) 标准映射中已配置待匹配对象 test_table_16208_c0007，其中字段中文名称为「车辆颜色中文标准」，字段英文名称为空
    tags:
      - 数据标准
      - 标准映射
      - 字段匹配
  - case_id: C0008
    title: 验证【数据模型】-【规范建表】解析含空格中文名称字段并关联标准，字段导入成功且英文名称可补录
    priority: P1
    steps:
      - action: 进入【数据模型 → 规范建表】页面
        expected: 进入成功
      - action: |-
          进入「表解析模式」
          输入「CREATE TABLE test_table_16208_c0008 (vehicle_color STRING COMMENT '车辆 颜色模型标准');」
          执行解析
        expected: |-
          1) 表结构解析成功
          2) 字段中文名称显示「车辆 颜色模型标准」
          3) 单个内部空格不触发字符格式错误
      - action: |-
          对字段「车辆 颜色模型标准」执行标准关联
          选择 StandardA
          保持「字段名（英文名称）」为空
        expected: |-
          1) 标准关联成功
          2) 英文名称为空不阻断字段导入
          3) 「字段名（英文名称）」仍显示可编辑输入框
      - action: |-
          在「字段名（英文名称）」输入「vehicle_color_model_16208」
          完成字段导入
          重新打开表结构
        expected: |-
          1) 字段导入成功
          2) 英文名称保存并回显为「vehicle_color_model_16208」
          3) 所属标准仍为 StandardA
          4) 中文字段名称仍为「车辆 颜色模型标准」
    precondition: |-
      1) 全局「标准必填项策略」已配置为「仅中文名必填」
      2) 标准 StandardA 的中文名称为「车辆 颜色模型标准」，英文名称为空
      3) 已配置数据模型表解析语句：
         CREATE TABLE test_table_16208_c0008 (vehicle_color STRING COMMENT '车辆 颜色模型标准');
    tags:
      - 数据模型
      - 规范建表
      - 标准关联
  - case_id: C0009
    title: 验证【数据标准】-【标准定义】编辑标准补录英文名称，中文字段映射关联不丢失
    priority: P1
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: |-
          编辑 StandardA
          将「英文名称」补录为「vehicle_color_edited_16208」
          保持「中文名称」=「车辆颜色中文标准」不变
          点击「保存」
        expected: |-
          1) 保存成功
          2) 标准中文名称未改变
          3) 英文名称更新为「vehicle_color_edited_16208」
      - action: 进入【数据标准 → 标准映射】，打开对象 test_table_16208_c0007 的映射详情
        expected: |-
          1) 映射记录仍存在
          2) 所属标准编号为 StandardCodeA
          3) 中文字段名称为「车辆颜色中文标准」
      - action: 查看该字段的英文名称和所属标准信息
        expected: |-
          1) 字段关联未被删除或重新解绑
          2) 字段英文名称和所属标准展示与保存后的标准信息一致
    precondition: |-
      1) 标准 StandardA 已通过标准映射关联到对象 test_table_16208_c0007 的中文字段「车辆颜色中文标准」
      2) 标准 StandardA 当前英文名称为空，标准映射记录可打开查看
    tags:
      - 数据标准
      - 标准定义
      - 关联映射
  - case_id: C0010
    title: 验证【数据质量】-【规则任务管理】规则配置引用标准，保存成功且回显正常(英文名称 = 空)
    priority: P1
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: |-
          打开规则 RuleA 的配置页
          在标准引用控件搜索「车辆颜色中文标准」
        expected: 搜索结果包含标准 StandardA；标准英文名称为空不影响查找和选择
      - action: |-
          选择 StandardA
          点击「保存」
          重新打开规则 RuleA
        expected: |-
          1) 保存成功
          2) 规则配置中仍展示中文名称「车辆颜色中文标准」和标准编号 StandardCodeA
          3) 不出现英文名称必填错误
      - action: 查看规则引用的标准字段
        expected: |-
          1) 引用对象未被替换为空值
          2) 规则仍关联 StandardA
    precondition: |-
      1) 全局「标准必填项策略」已配置为「仅中文名必填」
      2) 标准 StandardA 的中文名称为「车辆颜色中文标准」，英文名称为空
      3) 数据质量规则 RuleA 已存在，规则配置页可编辑，引用对象为字段「车辆颜色中文标准」
    tags:
      - 数据质量
      - 规则任务管理
      - 标准引用
