  - case_id: C0004
    title: 验证【规则配置】-【新建多表比对规则】展开调度周期下拉，提供自定义调度日期选项
    source_ref: TP-005
    priority: P1
    precondition: |-
      1) 质量项目：${ProjectA}
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：StarRocks3.x
      4) 存在数据库：${SchemaA}
      5) 在 ${SchemaA} 创建两张同构数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0004_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0004_source_01 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0004_source_01 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0004_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0004_target_01 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0004_target_01 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
      6) 存在「自定义调度日期」日历「调度日历A」（年月日格式），模板文件 calendar_template_yyyyMMdd.csv 内容如下：
         Title: 调度日期1. 按yyyyMMdd格式填写2. 日期上限1000个3. 从第二行开始解析
         Line1: 20260809
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「多表比对规则」
        expected: 打开「多表比对规则」创建向导并进入「选择左侧表」步骤
      - action: |-
          配置左侧表：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择左侧表：test_table_16212_c0004_source_01
          点击「下一步」
        expected: 进入「选择右侧表」步骤
      - action: |-
          配置右侧表：
          * 选择数据源：${DataSourceA}
          * 选择右侧表：test_table_16212_c0004_target_01
          点击「下一步」
        expected: 进入「选择字段」步骤并展示左右两侧字段映射
      - action: 点击「同名映射」映射字段 id 后点击「下一步」
        expected: 进入「执行配置」步骤
      - action: 展开「调度周期」下拉查看选项
        expected: 下拉包含「自定义调度日期」
      - action: 选择「自定义调度日期」，选择「调度日历A」
        expected: 「自定义调度日期」显示「调度日历A」
