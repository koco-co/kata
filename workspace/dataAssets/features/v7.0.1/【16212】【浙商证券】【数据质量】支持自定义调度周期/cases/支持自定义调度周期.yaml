  - case_id: C0005
    title: 验证【规则配置】-【新建多表比对规则】展开调度周期下拉，提供自定义调度日期选项
    source_ref: TP-005
    priority: P1
    precondition: |-
      1) 质量项目：${ProjectA}
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：StarRocks3.x
      4) 存在数据库：${SchemaA}
      5) 在 ${SchemaA} 创建两张同构数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0005_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0005_source_01 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0005_source_01 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0005_target_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0005_target_01 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0005_target_01 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
      6) 存在「自定义调度日期」日历：「调度日历A」（年月日格式）
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「多表比对规则」
        expected: 打开「多表比对规则」创建向导并进入「选择左侧表」步骤
      - action: |-
          配置左侧表：
          数据源：${DataSourceA}
          数据表：test_table_16212_c0005_source_01
          点击「下一步」
        expected: 进入「选择右侧表」步骤
      - action: |-
          配置右侧表：
          数据源：${DataSourceA}
          数据表：test_table_16212_c0005_target_01
          点击「下一步」
        expected: 进入「选择字段」步骤并展示左右两侧字段映射
      - action: 点击「同名映射」映射字段 id 后点击「下一步」
        expected: 进入「执行配置」步骤
      - action: 展开「调度周期」下拉查看选项
        expected: 下拉包含「自定义调度日期」
      - action: 选择「自定义调度日期」，选择「调度日历A」
        expected: 「自定义调度日期」显示「调度日历A」
    tags:
      - 数据质量
      - 规则配置

  - case_id: C0006
    title: 验证【任务查询】-【自定义调度日期】日历命中日期，实例生成并按计划运行
    source_ref: TP-006
    priority: P0
    precondition: |-
      1) 质量项目：${ProjectA}
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：StarRocks3.x
      4) 存在数据库：${SchemaA}
      5) 在 ${SchemaA} 创建数据表并插入无空值数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0006 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0006 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
      6) 测试执行当天记为 D
      7) 存在「自定义调度日期」日历：「调度日历A」（年月日格式），日期集合包含 D 及 D 之后 3 天
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「单表校验规则」
        expected: 打开「单表校验规则」创建向导并进入「监控对象」步骤
      - action: |-
          配置监控对象：
          数据源：${DataSourceA}
          Schema：${SchemaA}
          数据表：test_table_16212_c0006
          点击「下一步」
        expected: 进入「监控规则」步骤并展示校验字段与统计函数配置区
      - action: |-
          配置监控规则：
          点击「添加规则」选择「完整性校验」
          字段：id
          统计函数：空值数
          校验方法：固定值
          期望值：= 0
          点击「下一步」
        expected: 进入「调度属性」步骤
      - action: |-
          配置调度属性：
          * 调度周期：自定义调度日期
          自定义调度日期：调度日历A
          具体时间：设为当前时刻后约 10 分钟的时间点
          规则拼接包：2
          资源组：默认资源组
          超时时间：不限制
          无需生成报告：勾选
          点击「保存」
        expected: Toast提示:「保存成功」,规则列表新增该规则，执行周期展示「自定义调度日期」
      - action: 等待至设置的「具体时间」后刷新，进入【数据质量 → 任务查询】页面，按该规则任务名称搜索
        expected: 列表展示该规则任务的一条任务实例（D 日命中日历生成）
      - action: 查看该实例的任务状态与结果状态
        expected: 任务状态为「运行成功」，结果状态为「达标」
    tags:
      - 数据质量
      - 规则配置

