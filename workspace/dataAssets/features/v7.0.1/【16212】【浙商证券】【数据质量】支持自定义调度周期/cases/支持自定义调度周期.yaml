cases:
  - case_id: C0001
    title: 验证【规则配置】-【新建单表校验规则】展开调度周期下拉，提供自定义调度日期选项
    source_ref: TP-001
    priority: P0
    precondition: |-
      1) 质量项目：${ProjectA}
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：StarRocks3.x
      4) 存在数据库：${SchemaA}
      5) 在 ${SchemaA} 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0001 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0001 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
      6) 存在「自定义调度日期」日历「调度日历A」（年月日格式），模板文件 calendar_template_yyyyMMdd.csv 内容如下：
         Title: 调度日期1. 按yyyyMMdd格式填写2. 日期上限1000个3. 从第二行开始解析
         Line1: 20260809
      7) 存在「自定义调度日期」日历「调度日历B」（年月日时分格式），模板文件 calendar_template_yyyyMMddHHmm.csv 内容如下：
         Title: 调度日期1. 按yyyyMMddHHmm格式填写2. 日期上限1000个3. 从第二行开始解析
         Line1: 202608071540
         Line2: 202608071550
         Line3: 202608071600
         Line4: 202608080000
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「单表校验规则」
        expected: 打开「单表校验规则」创建向导并进入「监控对象」步骤
      - action: |-
          配置监控对象：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择数据表：test_table_16212_c0001
          点击「下一步」
        expected: 进入「监控规则」步骤并展示校验字段与统计函数配置区
      - action: |-
          配置监控规则：
          点击「添加规则」选择「完整性校验」
          * 规则类型：字段级
          * 字段：id
          * 统计函数：空值数
          过滤条件：空
          * 校验方法：固定值
          * 期望值：= 0
          强弱规则：弱规则
          规则描述：空
          点击「下一步」
        expected: 进入「调度属性」步骤
      - action: 展开「调度周期」下拉查看选项
        expected: 下拉包含「天」「周」「月」「自定义调度日期」「手动触发」，其中「自定义调度日期」位于「月」与「手动触发」之间
      - action: 选择「自定义调度日期」
        expected: 「调度周期」显示「自定义调度日期」，下方展示「自定义调度日期」选择器与「预览」入口
    tags:
      - 数据质量
      - 规则配置

