    source_ref: TP-002
    priority: P0
    precondition: |-
      1) 质量项目：${ProjectA}
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：StarRocks3.x
      4) 存在数据库：${SchemaA}
      5) 在 ${SchemaA} 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0002;
