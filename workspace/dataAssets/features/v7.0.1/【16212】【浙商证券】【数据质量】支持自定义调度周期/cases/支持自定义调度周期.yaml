  - case_id: C0005
    title: 验证【任务查询】-【自定义调度日期】单表规则年月日日历命中日期，实例生成并按计划运行
    source_ref: TP-006
    priority: P0
    precondition: |-
      1) 质量项目：${ProjectA}
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：StarRocks3.x
      4) 存在数据库：${SchemaA}
      5) 在 ${SchemaA} 创建数据表并插入无空值数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0005 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0005 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
      6) 测试执行当天记为 D
      7) 存在「自定义调度日期」日历「调度日历A」（年月日格式），模板文件 calendar_template_yyyyMMdd.csv 内容如下：
         Title: 调度日期1. 按yyyyMMdd格式填写2. 日期上限1000个3. 从第二行开始解析
         Line1: 20260809
      8) 「调度日历A」日期集合包含 D 及 D 之后 3 天
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「单表校验规则」
        expected: 打开「单表校验规则」创建向导并进入「监控对象」步骤
      - action: |-
          配置监控对象：
          * 规则名称：RuleE
          * 选择数据源：${DataSourceA}
          * 选择数据表：test_table_16212_c0005
          点击「下一步」
        expected: 进入「监控规则」步骤并展示校验字段与统计函数配置区
      - action: |-
          配置监控规则：
          点击「添加规则」选择「完整性校验」
          * 规则类型：字段级
          * 字段：id
          * 统计函数：空值数
          过滤条件：空
          * 校验方法：固定值
          * 期望值：= 0
          强弱规则：弱规则
          规则描述：空
          点击「下一步」
        expected: 进入「调度属性」步骤
      - action: |-
          配置调度属性：
          * 调度周期：自定义调度日期
          生效日期：开始日期为当天、结束日期为当天+100年（保持默认）
          * 自定义调度日期：调度日历A
          * 起调周期：设为当前时刻后约 10 分钟的时/分
          * 规则拼接包：1
          告警方式：空
          点击「新建」
        expected: Toast提示:「添加成功！」,规则列表新增 RuleE，执行周期展示「自定义调度日期」
      - action: 进入【数据质量 → 任务查询】页面
        expected: 进入成功
      - action: 等待至「起调周期」设置时刻后刷新，按规则名称 RuleE 搜索
        expected: 列表展示该规则任务的一条任务实例（D 日命中日历生成）
      - action: 查看该实例的任务状态与结果状态
        expected: 任务状态为「运行成功」，结果状态为「达标」
    tags:
      - 数据质量
      - 任务查询

