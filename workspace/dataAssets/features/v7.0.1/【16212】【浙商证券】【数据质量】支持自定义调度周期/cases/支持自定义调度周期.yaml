meta:
  title: 【数据质量】支持自定义调度周期
  requirement_id: "16212"
  case_module_id: ""
  source: "蓝湖需求 #16212"
  test_points_digest: "sha256:4df5965a79b030bc9921f8db681a07fe96b4c57dd2e1f3a17581754427bc5f43"
  exports:
    - 支持自定义调度周期.xmind
cases:
  - case_id: C0001
    title: 验证【规则配置】-【新建单表校验规则】展开调度周期下拉，提供自定义调度日期选项
    source_ref: TP-001
    priority: P0
    precondition: |-
      1) 质量项目：${ProjectA}
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：StarRocks3.x
      4) 存在数据库：${SchemaA}
      5) 在 ${SchemaA} 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16212_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16212_c0001 (id BIGINT, amount DECIMAL(10,2))
         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0001 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
      6) 存在「自定义调度日期」日历：「调度日历A」（年月日格式）、「调度日历B」（年月日时分格式）
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「单表校验规则」
        expected: 打开「单表校验规则」创建向导并进入「监控对象」步骤
      - action: |-
          配置监控对象：
          数据源：${DataSourceA}
          Schema：${SchemaA}
          数据表：test_table_16212_c0001
          点击「下一步」
        expected: 进入「监控规则」步骤并展示校验字段与统计函数配置区
      - action: |-
          配置监控规则：
          点击「添加规则」选择「完整性校验」
          字段：id
          统计函数：空值数
          校验方法：固定值
          期望值：= 0
          点击「下一步」
        expected: 进入「调度属性」步骤
      - action: 展开「调度周期」下拉查看选项
        expected: 下拉包含「时」「天」「周」「月」「自定义调度日期」「手动触发」，其中「自定义调度日期」位于「月」与「手动触发」之间
      - action: 选择「自定义调度日期」
        expected: 「调度周期」显示「自定义调度日期」，下方展示「自定义调度日期」选择器与「预览」入口
    tags:
      - 数据质量
      - 规则配置

  - case_id: C0002
