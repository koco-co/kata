         ENGINE=OLAP DUPLICATE KEY(id)
         DISTRIBUTED BY HASH(id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaA}.test_table_16212_c0002 VALUES (1, 100.00), (2, 200.00), (3, 300.00);
      6) 存在「自定义调度日期」日历：「调度日历A」（年月日格式）、「调度日历B」（年月日时分格式）
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: 点击「新建监控规则」，选择「单表校验规则」
        expected: 打开「单表校验规则」创建向导并进入「监控对象」步骤
      - action: |-
          配置监控对象：
          数据源：${DataSourceA}
          Schema：${SchemaA}
          数据表：test_table_16212_c0002
          点击「下一步」
        expected: 进入「监控规则」步骤并展示校验字段与统计函数配置区
      - action: |-
          配置监控规则：
          点击「添加规则」选择「完整性校验」
          字段：id
          统计函数：空值数
          校验方法：固定值
          期望值：= 0
          点击「下一步」
        expected: 进入「调度属性」步骤
      - action: 选择「自定义调度日期」，选择「调度日历A」（年月日格式）
        expected: 「自定义调度日期」显示「调度日历A」，并展示「具体时间」配置项
      - action: 将「自定义调度日期」切换为「调度日历B」（年月日时分格式）
        expected: 「具体时间」配置项不再展示
      - action: 将「自定义调度日期」切回「调度日历A」
        expected: 「具体时间」配置项重新展示
    tags:
      - 数据质量
      - 规则配置

