  - case_id: C0006
    title: 验证【脏数据明细】-【数据表唯一性】再次新建配置，已配置数据表不再出现在候选项中
    source_ref: TP-006
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建两张数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15912_c0006_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15912_c0006_source (
           record_id BIGINT,
           vin STRING
         );
         INSERT INTO ${SchemaA}.test_table_15912_c0006_source VALUES
           (1, 'VIN0001');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15912_c0006_target;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15912_c0006_target (
           record_id BIGINT,
           vin STRING
         );
         INSERT INTO ${SchemaA}.test_table_15912_c0006_target VALUES
           (2, 'VIN0002');
    steps:
      - action: 进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 进入成功
      - action: 切换至「脏数据明细」页签
        expected: 展示公共字段配置列表和「新建公共字段」入口
      - action: |-
          点击「新建公共字段」，按顺序完成配置：
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15912_c0006_source
          * 选择字段：vin
          点击「确定」
        expected: 列表新增 test_table_15912_c0006_source，且仅有一条同名配置
      - action: |-
          再次点击「新建公共字段」并选择：
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          展开「选择数据表」候选项
        expected: |-
          1) 候选项包含 test_table_15912_c0006_target
          2) 候选项不包含 test_table_15912_c0006_source
    tags:
      - 数据质量
      - 脏数据明细

