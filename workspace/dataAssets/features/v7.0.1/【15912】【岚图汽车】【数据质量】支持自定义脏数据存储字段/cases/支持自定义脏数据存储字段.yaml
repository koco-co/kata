    title: 验证【校验结果查询】-【合理性规则明细】配置趋势与两种字段计算对比，明细均展示源表全部字段
    source_ref: TP-045
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 数据源已开启脏数据存储
      5) 创建数据表并插入不满足趋势和计算关系的数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15912_c0045;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15912_c0045 (
           record_id BIGINT,
           amount DECIMAL(10,2),
           tax DECIMAL(10,2),
           total_amount DECIMAL(10,2),
           event_time STRING,
           vehicle_type STRING
         );
         INSERT INTO ${SchemaA}.test_table_15912_c0045 VALUES
           (1, 100.00, 10.00, 50.00, '2026-08-11 10:00:00', 'SUV'),
           (2, 50.00, 10.00, 40.00, '2026-08-11 11:00:00', 'MPV');
    steps:
      - action: 进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 进入成功
      - action: |-
          切换至「脏数据明细」，点击「新建公共字段」并配置：
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15912_c0045
          * 选择字段：event_time、vehicle_type
          点击「确定」
        expected: 列表新增 test_table_15912_c0045，公共字段为 event_time、vehicle_type
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15912_c0045
          规则集描述：合理性全字段矩阵
          点击「下一步」
        expected: 进入规则配置步骤，基础信息按填写值回显
      - action: |-
          配置规则包「PackC0045」的合理性校验-数据变化趋势：
          * 统计函数：数据变化趋势
          * 排序字段：record_id
          * 校验字段：amount
          * 校验方法：单调递增
          过滤条件：空
          * 强弱规则：弱规则
          规则描述：amount 按 record_id 单调递增
          点击「添加」
        expected: PackC0045 新增数据变化趋势规则，配置值完整回显
      - action: |-
          配置规则包「PackC0045」的合理性校验-字段值计算对比（计算结果与字段对比）：
          * 统计函数：字段值计算对比
          * 校验字段：amount、tax
          * 计算表达式：amount + tax
          * 对比方式：计算结果与字段对比
          * 对比字段：total_amount
          * 对比关系：=
          过滤条件：空
          * 强弱规则：弱规则
          规则描述：amount 加 tax 必须等于 total_amount
          点击「添加」
        expected: PackC0045 新增“计算结果与字段对比”规则，配置值完整回显
      - action: |-
          配置规则包「PackC0045」的合理性校验-字段值计算对比（计算结果值判断）：
          * 统计函数：字段值计算对比
          * 校验字段：amount、tax
          * 计算表达式：amount + tax
          * 对比方式：计算结果值判断
          * 结果值：<= 60
          过滤条件：空
          * 强弱规则：弱规则
          规则描述：amount 加 tax 不得超过六十
          点击「保存」
        expected: Toast提示:「保存成功」，PackC0045 中三条合理性规则均已保存
      - action: 进入【数据质量 → 规则任务管理】页面，点击「新建规则任务」
        expected: 打开「新建规则任务」创建向导
      - action: |-
          新建监控任务：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15912_c0045
          选择分区：不设置分区
          抽样检查设置：关闭
          点击「下一步」
        expected: 进入「监控规则」步骤
      - action: |-
          引入规则包：
          * 规则包：PackC0045
          * 规则类型：全部
          点击「引入」并「确定」
        expected: 规则包区域展示 PackC0045，规则行数量为 3
      - action: |-
          配置调度属性：
          * 调度周期：手动触发
          * 规则拼接包：2
          * 资源组：default
          * 超时时间：30分钟
          * 告警方式：无
          * 无需生成报告：不勾选
          * 报告名称：ReportA
          点击「保存」
        expected: Toast提示:「保存成功」，规则任务列表新增 RuleA
      - action: 打开 RuleA 详情并点击「立即执行」
        expected: 任务运行完成，三条合理性规则均生成最新实例结果
      - action: 在【校验结果查询】打开数据变化趋势规则明细
        expected: 明细展示 record_id、amount、tax、total_amount、event_time、vehicle_type
      - action: 打开“计算结果与字段对比”规则明细
        expected: 明细展示 record_id、amount、tax、total_amount、event_time、vehicle_type
      - action: 打开“计算结果值判断”规则明细
        expected: 明细展示 record_id、amount、tax、total_amount、event_time、vehicle_type，各字段只出现一次
    tags:
      - 数据质量
      - 校验结果查询
