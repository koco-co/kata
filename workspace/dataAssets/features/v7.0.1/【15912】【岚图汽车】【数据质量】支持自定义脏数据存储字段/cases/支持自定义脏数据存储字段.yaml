    title: 验证【权限配置】-【脏数据管理子权限】查看默认授权，管理员和数据开发可见双页签且访客不可见
    source_ref: TP-026
    priority: P0
    precondition: |-
      1) 存在管理员账号、数据开发账号和访客账号
      2) 当前项目尚未人工调整「脏数据明细」和「脏数据存储」两个子级权限的默认授权
    steps:
      - action: 进入【数据质量】页面
        expected: 进入成功
      - action: 使用管理员账号打开当前项目的数据质量功能权限配置
        expected: |-
          1) 「脏数据明细」默认勾选管理员、数据开发，未勾选访客
          2) 「脏数据存储」默认勾选管理员、数据开发，未勾选访客
      - action: 分别使用管理员账号和数据开发账号进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 两类账号均可看到「脏数据明细」和「脏数据存储」两个页签
      - action: 使用访客账号进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 访客看不到「脏数据明细」和「脏数据存储」两个页签，也不能进入对应功能
    tags:
      - 数据质量
      - 权限配置

