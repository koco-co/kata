      - action: |-
          点击「新建公共字段」，按顺序完成配置：
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15912_c0004
          * 选择字段：空
          点击「确定」
        expected: |-
          1) 「选择字段」项提示必须选择字段
          2) 新建表单保持打开
          3) 列表未新增 test_table_15912_c0004
    tags:
