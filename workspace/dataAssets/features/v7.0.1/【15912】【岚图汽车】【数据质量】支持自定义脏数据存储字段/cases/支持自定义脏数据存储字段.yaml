meta:
  title: 【岚图汽车】【数据质量】支持自定义脏数据存储字段
  feature_id: quality-custom-dirty-data-fields
  requirement_id: "15912"
  case_module_id: ""
  source: "蓝湖需求 #15912"
  test_points_digest: "sha256:3729bcdd1db7d4c22a69b0fbf9eb03e45246539ac1401a4d124cf1827f14d9a8"
  exports:
    - 支持自定义脏数据存储字段.xmind
cases:
  - case_id: C0001
    title: 验证【脏数据管理】-【脏数据明细】进入配置列表，展示双页签和完整列表列
    source_ref: TP-001
    priority: P0
    precondition: 1) 使用具备「脏数据明细」权限的账号进入质量项目 ${ProjectA}
    steps:
      - action: 进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 进入成功
      - action: 切换至「脏数据明细」页签
        expected: 页面展示「脏数据存储」和「脏数据明细」两个页签，当前选中「脏数据明细」
      - action: 查看列表工具栏
        expected: 展示数据表名称搜索框、数据源筛选和「新建公共字段」入口
      - action: 查看列表列与操作列
        expected: |-
          1) 列表按顺序展示数据表、数据源、数据库、公共字段、更新人、最近更新时间和操作列
          2) 操作列提供编辑和删除入口
    tags:
      - 数据质量
      - 脏数据明细

  - case_id: C0002
    title: 验证【脏数据明细】-【新建公共字段】配置SparkThrift2.x表，列表新增单表公共字段配置(数据源 = SparkThrift2.x)
    source_ref: TP-002
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15912_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15912_c0002 (
           record_id BIGINT,
           vin STRING,
           event_time STRING,
           vehicle_type STRING
         );
         INSERT INTO ${SchemaA}.test_table_15912_c0002 VALUES
           (1, 'VIN0001', '2026-08-06 10:00:00', 'SUV');
    steps:
      - action: 进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 进入成功
      - action: 切换至「脏数据明细」页签
        expected: 展示公共字段配置列表和「新建公共字段」入口
      - action: |-
          点击「新建公共字段」，按顺序完成配置：
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15912_c0002
          * 选择字段：vin、event_time
          点击「确定」
        expected: |-
          1) 选择数据源后数据库候选项刷新，选择数据库后数据表候选项刷新，选择数据表后字段候选项刷新
          2) 列表新增 test_table_15912_c0002
          3) 数据源、数据库和公共字段分别显示 ${DataSourceA}、${SchemaA}、vin、event_time
          4) 同一数据表仅生成一条配置记录
    tags:
      - 数据质量
      - 脏数据明细

  - case_id: C0003
    title: 验证【脏数据明细】-【新建公共字段】配置Doris3.x多字段，详情读取源表字段名称和类型(数据源 = Doris3.x)
    source_ref: TP-003
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceB}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaB}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15912_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15912_c0003 (
           record_id BIGINT,
           vin VARCHAR(64),
           event_time DATETIME,
           vehicle_type VARCHAR(32)
         )
         DUPLICATE KEY(record_id)
         DISTRIBUTED BY HASH(record_id) BUCKETS 1
         PROPERTIES ("replication_num" = "1");
         INSERT INTO ${SchemaB}.test_table_15912_c0003 VALUES
           (1, 'VIN0001', '2026-08-06 10:00:00', 'SUV');
    steps:
      - action: 进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 进入成功
      - action: 切换至「脏数据明细」页签
        expected: 展示公共字段配置列表和「新建公共字段」入口
      - action: |-
          点击「新建公共字段」，按顺序完成配置：
          * 选择数据源：${DataSourceB}
          * 选择数据库：${SchemaB}
          * 选择数据表：test_table_15912_c0003
          * 选择字段：vin、event_time、vehicle_type
          点击「确定」
        expected: 列表新增 test_table_15912_c0003，公共字段显示 vin、event_time、vehicle_type
      - action: 点击数据表名称 test_table_15912_c0003
        expected: |-
          1) 打开公共字段详情
          2) 基本信息展示数据表 test_table_15912_c0003、数据源 ${DataSourceB} 和数据库 ${SchemaB}
          3) 公共字段列表展示 vin/VARCHAR、event_time/DATETIME、vehicle_type/VARCHAR，名称和类型与 Doris 源表一致
    tags:
      - 数据质量
      - 脏数据明细

