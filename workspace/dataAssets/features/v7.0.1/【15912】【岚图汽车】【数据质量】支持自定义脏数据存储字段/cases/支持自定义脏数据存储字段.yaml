  - case_id: C0011
    title: 验证【脏数据明细】-【数据源筛选】搜索并选择筛选项，列表匹配且重置后恢复
    source_ref: TP-011
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 在数据源 A 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15912_c0011_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15912_c0011_source (
           record_id BIGINT,
           vin STRING
         );
         INSERT INTO ${SchemaA}.test_table_15912_c0011_source VALUES
           (1, 'VIN0001');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：SparkThrift2.x
      7) 数据源 B 存在数据库：${SchemaB}
      8) 在数据源 B 创建数据表：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15912_c0011_target;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15912_c0011_target (
           record_id BIGINT,
           vin STRING
         );
         INSERT INTO ${SchemaB}.test_table_15912_c0011_target VALUES
           (2, 'VIN0002');
    steps:
      - action: 进入【数据质量 → 项目管理 → 脏数据管理】页面
        expected: 进入成功
      - action: 切换至「脏数据明细」页签
        expected: 展示公共字段配置列表和「新建公共字段」入口
      - action: |-
          点击「新建公共字段」，按顺序完成配置：
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15912_c0011_source
          * 选择字段：vin
          点击「确定」
        expected: 列表新增数据源为 ${DataSourceA} 的 test_table_15912_c0011_source
      - action: |-
          点击「新建公共字段」，按顺序完成配置：
          * 选择数据源：${DataSourceB}
          * 选择数据库：${SchemaB}
          * 选择数据表：test_table_15912_c0011_target
          * 选择字段：vin
          点击「确定」
        expected: 列表新增数据源为 ${DataSourceB} 的 test_table_15912_c0011_target
      - action: 展开数据源筛选，在筛选项搜索框输入 ${DataSourceA} 的中间片段
        expected: 筛选项仅保留名称匹配 ${DataSourceA} 的数据源
      - action: 选择 ${DataSourceA} 并确认筛选
        expected: 列表仅展示数据源为 ${DataSourceA} 的 test_table_15912_c0011_source
      - action: 重置数据源筛选
        expected: 列表恢复展示 ${DataSourceA} 和 ${DataSourceB} 的两条配置
    tags:
      - 数据质量
      - 脏数据明细

  - case_id: C0012
    title: 验证【脏数据明细】-【最近更新时间】切换升降序，记录按更新时间正确排序
