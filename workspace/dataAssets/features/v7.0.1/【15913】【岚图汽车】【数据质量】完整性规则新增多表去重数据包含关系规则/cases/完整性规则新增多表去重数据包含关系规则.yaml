meta:
  title: 【岚图汽车】【数据质量】完整性规则新增多表去重数据包含关系规则
  feature_id: quality-multi-table-deduplicated-containment
  project_id: data-assets
  requirement_id: "15913"
  case_module_id: ""
  source: "蓝湖需求 #15913"
  test_points_digest: "sha256:0b53c22efe3de7956e4e525392ce43baab9721073d5c6f55518e5461e3e156d3"
  exports:
    - 完整性规则新增多表去重数据包含关系规则.xmind
cases:
  - case_id: C0001
    title: 验证【规则库配置】-【内置规则列表】检索多表去重数据包含关系，显示完整性校验分类与多表范围
    source_ref: TP-001
    priority: P1
    precondition: 1) 规则库已完成内置规则初始化
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 在规则列表中检索「多表去重数据包含关系」
        expected: 列表存在且仅定位到该内置规则，名称列显示「多表去重数据包含关系」
      - action: 查看该规则所在分类与关联范围
        expected: 规则分类显示「完整性校验」，关联范围显示「多表」
    tags:
      - 数据质量

  - case_id: C0002
    title: 验证【规则集管理】-【多表去重数据包含关系】选择新规则类型，展示全部专属配置项
    source_ref: TP-002
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建校验表和对比表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15913_c0002_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15913_c0002_source (
           id BIGINT,
           code STRING
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15913_c0002_source PARTITION (dt='2026-08-04') VALUES
           (1, 'A');
         INSERT INTO ${SchemaA}.test_table_15913_c0002_source PARTITION (dt='2026-08-05') VALUES
           (2, 'B');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15913_c0002_comparison;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15913_c0002_comparison (
           id BIGINT,
           code STRING
         );
         INSERT INTO ${SchemaA}.test_table_15913_c0002_comparison VALUES
           (1, 'A');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15913_c0002_source
          规则集描述：配置项展示验证
          点击「下一步」
        expected: 进入规则配置步骤，基础信息按填写值回显
      - action: 在规则包 PackA 中选择「完整性校验-多表去重数据包含关系」
        expected: |-
          规则配置区按顺序展示以下配置项：
          1) 生效范围
          2) 校验表去重字段
          3) 选择对比表
          4) 对比表包含关系
          5) 对比表
          6) 输入分区
          7) 对比表字段
          8) 选择判断关系
          9) 字段类型转换
          10) 强弱规则和规则描述
    tags:
      - 数据质量

  - case_id: C0003
    title: 验证【校验结果查询】-【校验表包含对比表】执行子集数据，结果达标且无脏数据明细
    source_ref: TP-003
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建校验分区表和对比表，dt=2026-08-04 为全部可得到预期达标结果的正确数据，dt=2026-08-05 为全部可得到预期不达标结果的异常数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15913_c0003_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15913_c0003_source (
           id BIGINT,
           code STRING
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_15913_c0003_source PARTITION (dt='2026-08-04') VALUES
           (1, 'A'), (2, 'B'), (3, 'C');
         INSERT INTO ${SchemaA}.test_table_15913_c0003_source PARTITION (dt='2026-08-05') VALUES
           (4, 'A');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15913_c0003_comparison;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15913_c0003_comparison (
           id BIGINT,
           code STRING
         );
         INSERT INTO ${SchemaA}.test_table_15913_c0003_comparison VALUES
           (1, 'A'), (2, 'B');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击「新建规则集」，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15913_c0003_source
          规则集描述：校验表包含对比表子集场景
          点击「下一步」
        expected: 进入规则配置步骤，基础信息按填写值回显
      - action: |-
          配置规则包「PackA」的规则（完整性校验-多表去重数据包含关系）：
          * 生效范围：多表去重数据包含关系
          * 校验表去重字段：code
          * 选择对比表：
            对比表1：
              * 包含关系：校验表包含对比表
              * 对比表：test_table_15913_c0003_comparison
              输入分区：空
              * 对比表字段：code
              字段类型转换：否
          * 选择判断关系：且
          * 强弱规则：弱规则
          规则描述：对比表去重集合为校验表去重集合的子集
          点击「保存」
        expected: Toast提示:「保存成功」,规则集列表新增 RuleSetA，规则包 PackA 规则数量为 1
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击「新建规则任务」
        expected: 打开「新建规则任务」创建向导
      - action: |-
          新建监控任务：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15913_c0003_source
          选择分区：选择已有分区(dt=2026-08-04)
          抽样检查设置：关闭
          点击「下一步」
        expected: 进入「监控规则」步骤
      - action: |-
          引入规则包：
          * 规则包：PackA
          * 规则类型：全部
          点击「引入」并「确定」
        expected: 规则包区域展示 PackA，规则行数量为 1
      - action: |-
          配置调度属性：
          * 调度周期：手动触发
          * 规则拼接包：2
          * 资源组：default
          * 超时时间：30分钟
          * 告警方式：无
          * 无需生成报告：不勾选
          * 报告名称：ReportA
          点击「保存」
        expected: Toast提示:「保存成功」,规则任务列表新增 RuleA
      - action: 点击「表名」进入 RuleA 规则任务详情页
        expected: 进入 RuleA 规则任务详情页
      - action: 点击「立即执行」
        expected: 提示执行成功，任务进入调度
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 进入成功
      - action: 打开 RuleA 最新运行实例的监控报告
        expected: 任务状态为「运行成功」，结果状态为「达标」，规则行不提供脏数据明细入口且明细记录数为 0
    tags:
      - 数据质量

