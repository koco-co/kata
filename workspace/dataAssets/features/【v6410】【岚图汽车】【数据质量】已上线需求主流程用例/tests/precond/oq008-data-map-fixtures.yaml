tables:
  - name: customer_info
    sql: |
      CREATE TABLE IF NOT EXISTS customer_info (
        cust_id STRING COMMENT '客户ID',
        cust_name STRING COMMENT '客户名称',
        cust_cert_type STRING COMMENT '证件类型',
        cust_cert_code STRING COMMENT '证件号',
        customer_level STRING COMMENT '客户等级',
        update_time STRING COMMENT '更新时间'
      )
      COMMENT 'OQ008 数据地图客户域字段结果页测试表'
      STORED AS PARQUET;

      INSERT OVERWRITE TABLE customer_info
      SELECT 'C001' AS cust_id, '高价值客户A' AS cust_name, 'ID_CARD' AS cust_cert_type, '330100199001010011' AS cust_cert_code, 'VIP' AS customer_level, '2026-05-24 10:00:00' AS update_time
      UNION ALL
      SELECT 'C002' AS cust_id, '待回访客户B' AS cust_name, 'PASSPORT' AS cust_cert_type, 'P99887766' AS cust_cert_code, 'NORMAL' AS customer_level, '2026-05-24 10:05:00' AS update_time;
  - name: order_info
    sql: |
      CREATE TABLE IF NOT EXISTS order_info (
        order_id STRING COMMENT '订单ID',
        cust_id STRING COMMENT '客户ID',
        order_name STRING COMMENT '订单名称',
        order_amount DECIMAL(18,2) COMMENT '订单金额',
        order_status STRING COMMENT '订单状态',
        order_date STRING COMMENT '订单日期'
      )
      COMMENT 'OQ008 数据地图订单域字段结果页测试表'
      STORED AS PARQUET;

      INSERT OVERWRITE TABLE order_info
      SELECT 'O001' AS order_id, 'C001' AS cust_id, '岚图整车订单' AS order_name, CAST(120000.00 AS DECIMAL(18,2)) AS order_amount, 'FULFILLED' AS order_status, '2026-05-24' AS order_date
      UNION ALL
      SELECT 'O002' AS order_id, 'C002' AS cust_id, '精品配件订单' AS order_name, CAST(880.50 AS DECIMAL(18,2)) AS order_amount, 'PENDING' AS order_status, '2026-05-24' AS order_date;
