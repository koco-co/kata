      - action: 查看生成 SQL
        expected: SQL 未包含 rand() 和临时抽样表名称，源表扫描次数为 1
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0006
    automation:
      spec_file: c0006-mergeable-sample.spec.ts
    title: 验证【数据质量】-【规则任务配置】开启抽样执行混合规则，可合并规则合并查询且不可合并规则独立查询(抽样开启)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入测试记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0006 (id BIGINT, code STRING, name STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15862_c0006 SELECT id, CONCAT('code_', CAST(id AS STRING)), CONCAT('name_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)) FROM range(1, 7);
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 创建任务并选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0006，开启抽样
        expected: 监控对象展示抽样配置项且状态为「开启」
      - action: 添加一个可合并完整性规则和一个字段取值规则，点击【保存】
        expected: 任务保存成功，规则列表展示两种规则类型
      - action: 立即执行任务并查看实例详情
        expected: 实例状态为「运行完成」，两条规则均有结果
      - action: 查看生成 SQL
        expected: 可合并规则进入合并查询，不可合并规则保留独立查询，结果规则编号可追溯
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0007
    automation:
      spec_file: c0007-mergeable-no-sample.spec.ts
    title: 验证【数据质量】-【规则任务配置】关闭抽样执行完整性与有效性规则，异常明细展示 id=1 空串记录(抽样关闭)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入测试记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0007 (id BIGINT, code STRING, name STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15862_c0007 SELECT id, CONCAT('code_', CAST(id AS STRING)), CASE WHEN id = 1 THEN '' ELSE CONCAT('name_', CAST(id AS STRING)) END, CAST(id AS DECIMAL(10,2)) FROM range(1, 7);
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 创建任务并选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0007
        expected: 监控对象展示所选表和字段列表
      - action: 添加 name 非空完整性规则和 name 空串有效性规则，点击【保存】
        expected: 规则列表展示完整性规则和有效性规则
      - action: 立即执行任务并打开结果详情
        expected: 实例状态为「校验异常」，name 空串记录为 id=1
      - action: 查看规则 SQL
        expected: 两条规则结果均写入同一实例，规则类型和异常明细保持对应关系
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0008
    automation:
      spec_file: c0008-partial-unmergeable-sample-partition.spec.ts
    title: 验证【数据质量】-【规则任务配置】执行字段 and 空值数规则，SQL 保留分区过滤与字段逻辑(抽样开启+设置分区)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并插入前一日和当日数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0008 (id BIGINT, code STRING, name STRING, amount DECIMAL(10,2), dt DATE) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15862_c0008 SELECT id, CONCAT('code_', CAST(id AS STRING)), CASE WHEN id = 1 THEN NULL ELSE CONCAT('name_', CAST(id AS STRING)) END, CAST(id AS DECIMAL(10,2)), DATE_SUB(CURRENT_DATE(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15862_c0008 SELECT id, CONCAT('code_', CAST(id AS STRING)), CONCAT('name_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)), CURRENT_DATE() FROM range(4, 7);
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 创建任务并选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0008，开启抽样并选择当日分区
        expected: 监控对象展示当日分区和抽样配置
      - action: 添加 code、name 两字段的 and 空值数规则，保存任务
        expected: 规则卡片展示字段 code、name 和逻辑「and」
      - action: 立即执行并打开结果详情
        expected: 实例状态为「运行完成」，结果中的字段组合为 code and name
      - action: 查看生成 SQL
        expected: SQL 保留分区过滤和字段逻辑「and」，结果明细只来自当日分区
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0009
    automation:
      spec_file: c0009-partial-unmergeable-sample.spec.ts
    title: 验证【数据质量】-【规则任务配置】执行格式有效性规则，异常明细展示 code=bad 记录(抽样开启)
