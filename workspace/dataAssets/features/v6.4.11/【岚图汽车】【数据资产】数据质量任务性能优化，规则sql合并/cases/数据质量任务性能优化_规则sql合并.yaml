      - action: 创建规则任务并选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0005，关闭抽样
        expected: 抽样配置显示为「关闭」
      - action: 添加可合并完整性规则并保存任务
        expected: Toast提示:「保存成功」，任务列表新增该规则任务
      - action: 点击【立即执行】并打开实例详情
