      - action: 添加 code 格式有效性规则，规则要求以「code_」开头，点击【保存】
        expected: 规则卡片展示格式条件和启用状态
      - action: 立即执行任务并打开异常明细
        expected: 实例状态为「校验异常」，异常明细包含 id=1 且 code=bad
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0010
    automation:
      spec_file: c0010-partial-unmergeable-no-sample.spec.ts
    title: 验证【数据质量】-【规则任务配置】执行超阈值期望值规则，最新实例状态为校验异常(抽样关闭)
