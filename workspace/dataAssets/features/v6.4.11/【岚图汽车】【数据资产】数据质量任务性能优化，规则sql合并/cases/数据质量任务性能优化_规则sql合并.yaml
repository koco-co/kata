  - case_id: C0011
    automation:
      spec_file: c0011-completeness-validity-sample-partition-strength-multi-pack.spec.ts
    title: 验证【数据质量】-【规则任务配置】执行完整性与有效性规则，3 条规则结果均符合期望值(多规则包)
    priority: P1
