          * 字段：name
          * 统计函数：空串数
          过滤条件：手动配置 id<=10
          校验方法：固定值
          期望值：>0
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则3配置完成
      - action: |-
          配置监控规则4：
          * 生效范围：字段级
          * 字段：name
          * 统计函数：空串率
          过滤条件：空
          校验方法：固定值
          期望值：=1
          * 强弱规则：弱规则
          规则描述：测试规则
