         SELECT id + 6, age, string_num, name, address, money, buy_date, date_detail, date_format(current_date(), 'yyyy-MM-dd')
         FROM ${SchemaA}.test_table_15862_c0013
         WHERE dt = date_format(date_sub(current_date(), 1), 'yyyy-MM-dd');
