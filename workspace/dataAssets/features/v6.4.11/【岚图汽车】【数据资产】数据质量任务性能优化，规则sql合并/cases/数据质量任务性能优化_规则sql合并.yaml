    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入测试记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0009;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0009 (id BIGINT, code STRING, name STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15862_c0009 SELECT id, CASE WHEN id = 1 THEN 'bad' ELSE CONCAT('code_', CAST(id AS STRING)) END, CONCAT('name_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)) FROM range(1, 7);
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
