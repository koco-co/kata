meta:
  title: 落标检查任务性能优化_规则sql合并
  version: v6.4.11
  feature_id: v6.4.11/【v6411】【岚图汽车】【数据资产】落标检查任务性能优化，规则sql合并
cases:
  - id: C001
    title: 验证「有车型」-「不绑定车型关联字段」-「date/timestamp数据类型」校验逻辑正确
    priority: P0
    steps:
      - action: 进入「资产-数据标准-标准定义」页面
        expected: 页面正常打开
      - action: 新建标准配置如下： 「中文名称」：「总额」 「英文名称」：「amount」 「英文缩写」：「at」 「标准目录」：「test」 「车型」：「小米su7，保时捷718」 1）小米su7： 「数据类型」：「数值型」 「数据长度」：「<=5」 「数据精度」：「3/2」 「是否允许为空」：「不可空」 「是否允许重复」：「不可重复」 「默认值」：「1」 「取值范围」：「>=10且<=280」 「初始值」：「2」 「无效值」：「0.1」 「精度倍数」：「2.2」 「偏移量」：「0.02」； 2）保时捷718： 「数据类型」：「数值型」 「数据长度」：「<=5」 「数据精度」：「3/2」 「是否允许为空」：「不可空」 「是否允许重复」：「不可重复」 「默认值」：「1」 「取值范围」：「>=180且<=999」 「初始值」：「2」 「无效值」：「0.1」 「精度倍数」：「2.2」 「偏移量」：「0.02」； 点击【上线】
        expected: 内容配置成功； 标准成功上线
      - action: 点击「标准映射」页面，进行标准映射
        expected: 标准映射列表新增该标准
      - action: 给该标准绑定字段：绑定register_date、last_login字段
        expected: 字段绑定成功
      - action: 点击「落标检查」页面，新增检查任务，检查内容配置如下： 「数据源」：「${DATASOURCE}」 「数据库」：「${DATABASE}」 「数据表」：「order_info」 不设置分区 「标准目录」：「test」 不绑定「车型关联字段」； 点击【下一步】
        expected: 检查内容配置成功； 进入选择字段页面
      - action: 开启register_date、last_login字段的检查，设置检查项为：全部； 点击【下一步】
        expected: 成功开启检查，检查项全部仅包含：空值数、重复数； 进入调度配置页面
      - action: 配置调度属性为按天运行，其余内容正确配置；点击【新增并立即执行】
        expected: 保存成功，任务进入检查中状态
      - action: 等待检查完成，查看【落标检查设置】tab列表
        expected: 显示对应的正确数据表名称、所属数据源、所属数据库、检查字段数/总字段数、检查周期、检查状态、标准达标率、不达标字段数/检查失败数、最近编辑时间、最近检查时间、操作。
      - action: 点击【操作-查看结果详情】
        expected: 跳转至【落标检查结果】tab
      - action: 查看【落标检查结果】tab列表
        expected: 显示对应的正确数据源、数据库、数据表、字段、检查状态、是否达标、检查开始时间、检查结束时间、操作。
      - action: 点击【操作-查看详情】
        expected: 检查结果详情包含以下信息： 1）检查信息：检查数据源、数据库、数据表、字段与配置的内容一致； 2）检查结果列表：“空值数、重复数”检查项达标情况正确，开始检查时间、结束检查时间正确，未达标的检查项操作为“查看详情” 3）关联标准详情与前面配置的内容一致
      - action: 点击列表里未达标检查项对应的的【操作-查看详情】
        expected: 1）为脏数据明细，显示不符合检查项的数据，标红展示 2）行数<=100
      - action: 根据文档步骤通过底层数据库查看该检查任务的sql
        expected: 两个字段的空值数进行sql合并： 1）扫描一次源数据表 2）写在同一个select里面：用两个 SUM (CASE WHEN) 把规则并行计算； 3）结果插入同一张脏数据表 两个字段的重复数未进行sql合并： 1）两个字段的重复数单独分开去读取一遍源数据表； ​2）两个字段重复数的判断计算语句分开写，一条规则对应一个select语句，无SUM (CASE WHEN)并行计算逻辑 ​3）两个字段的重复数脏数据分开存入不同的脏数据表
      - action: 等待该检查任务按周期运行完成，查看结果详情
        expected: 检查项达标情况正确，详情正确，脏数据明细正确
    precondition: |-
      1、已存在表order_info
      CREATE TABLE IF NOT EXISTS tytest.order_info (
      user_id INT COMMENT '用户ID',
      tall FLOAT COMMENT '身高',
      weight DOUBLE COMMENT '体重',
      amount DECIMAL(10,3) COMMENT '金额',
      car_model STRING COMMENT '车型',
      age BYTE COMMENT '年龄',
      score SHORT COMMENT '评分',
      total_orders LONG COMMENT '总订单数',
      is_vip BOOLEAN COMMENT '是否VIP',
      register_date DATE COMMENT '注册日期',
      last_login TIMESTAMP COMMENT '最后登录时间'
      )
      PARTITIONED BY (order_date STRING COMMENT '订单日期，格式yyyy-MM-dd');
      -- 插入2026-01-12分区数据
      INSERT INTO tytest.order_info PARTITION (order_date='2026-01-12')
      VALUES
      (1000, 160, NULL, 265.2, '小米su7', 25, 80, 10, TRUE, DATE '2024-01-01', TIMESTAMP '2026-01-12 10:30:00'),
      (102, 170, 66, 140.80, '小米su7', 30, 85, 5, FALSE, DATE '2024-03-15', TIMESTAMP '2026-01-12 14:20:00'),
      (1100, 180.23, 459897, 187, '保时捷718', 35, 90, 3, TRUE, DATE '2024-06-20', TIMESTAMP '2026-01-12 09:15:00');
      -- 插入2026-01-13分区数据
      INSERT INTO tytest.order_info PARTITION (order_date='2026-01-13')
      VALUES
      (1001, 160, NULL, 265, '小米su7', 26, 82, 15, NULL, CAST('2024-01-15' AS DATE), CAST('2026-01-13 11:00:00' AS TIMESTAMP)),
      (1001, 160, NULL, NULL, '小米su7', 26, 82, 16, FALSE, CAST(NULL AS DATE), CAST('2026-01-13 15:30:00' AS TIMESTAMP)),
      (102, 170, 66, 15483.568, '小米su7', 31, 87, 8, TRUE, CAST('2024-04-01' AS DATE), CAST(NULL AS TIMESTAMP)),
      (1001, 160, NULL, 265, '小米su7', 26, 82, 17, FALSE, CAST('2024-01-15' AS DATE), CAST('2026-01-13 18:20:00' AS TIMESTAMP)),
      (110030, 180.23, 459897, 80.55485, '保时捷718', 36, 92, 5, NULL, CAST('2024-07-10' AS DATE), CAST(NULL AS TIMESTAMP)),
      (110030, 180.23, 459897, 80.55485, '保时捷718', 36, 92, 6, FALSE, CAST('2024-07-10' AS DATE), CAST('2026-01-13 14:05:00' AS TIMESTAMP)),
      (11003, 180.23, 459897, NULL, '保时捷718', 36, 92, 7, FALSE, CAST(NULL AS DATE), CAST('2026-01-13 16:40:00' AS TIMESTAMP)),
      (1001, 160, NULL, 265, NULL, 26, 82, 17, FALSE, CAST('2024-01-15' AS DATE), CAST('2026-01-13 18:20:00' AS TIMESTAMP)),
      (11003, 180.23, 459897, 80.55485, NULL, 36, 92, 5, NULL, CAST('2024-07-10' AS DATE), CAST(NULL AS TIMESTAMP));
      2、已存在标准目录：test
    tags:
      - 不同的数据类型
      - 未分类
