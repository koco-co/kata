        expected: 字符串长度、数据精度、空值数、取值范围、精度倍数sql进行合并： 1）源表只扫描一次：FROM 后面的源表只出现 1 次； ​2）所有可合并规则写在同一个select里面：用多个 SUM (CASE WHEN) 把规则并行计算； 3）计算后再把结果拆成多行，每行代表单个规则进行输出，最终把结果插入同一张脏数据表 重复数sql不进行合并： 1）只有单个select计算语句，不参与SUM (CASE WHEN)并行计算逻辑 2）脏数据存储于另一张脏数据表
