      - action: 点击【操作-查看详情】
        expected: 检查结果详情包含以下信息： 1）检查信息：检查数据源、数据库、数据表、字段与配置的内容一致； 2）检查结果列表：字符串长度、数据精度、空值数、取值范围、精度倍数、重复数都显示“达标”，开始检查时间、结束检查时间正确，操作为“--” 3）关联标准详情与前面配置的内容一致
