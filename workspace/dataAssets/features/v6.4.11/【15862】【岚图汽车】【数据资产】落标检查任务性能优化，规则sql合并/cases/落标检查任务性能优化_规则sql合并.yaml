          * 取值范围：>=10且<=280
          默认值：1
          初始值：2
          无效值：0.1
          精度倍数：2.2
          偏移量：0.02
        expected: 「小米su7」车型标准配置完成
      - action: |-
          配置「保时捷718」车型标准：
          * 数据类型：数值型
          * 数据长度：<=5
          * 数据精度：3/2
          * 是否允许为空：不可空
          * 是否允许重复：不可重复
          * 取值范围：>=180且<=999
          默认值：1
          初始值：2
          无效值：0.1
          精度倍数：2.2
          偏移量：0.02
