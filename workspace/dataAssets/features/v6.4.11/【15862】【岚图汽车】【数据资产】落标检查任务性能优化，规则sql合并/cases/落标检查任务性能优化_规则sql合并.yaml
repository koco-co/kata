meta:
  title: 落标检查任务性能优化_规则sql合并
  requirement_id: "15862"
  imports:
    - 落标检查规则SQL.csv
  exports:
    - 落标检查任务性能优化_规则sql合并.xmind
  case_module_id: ""
cases:
  - case_id: C0001
    title: 验证【数据标准】-【落标检查】配置日期与时间戳字段全部检查项并执行，展示空值数和重复数检查结果(车型关联字段为空)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 存在标准目录：${CatalogA}
      5) 创建表并插入日期时间字段数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0001 (id BIGINT, car_model STRING, register_date DATE, last_login TIMESTAMP, dt DATE) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15862_c0001 SELECT id, CASE WHEN id % 2 = 0 THEN '小米su7' ELSE '保时捷718' END, CASE WHEN id % 3 = 0 THEN NULL ELSE DATE_SUB(CURRENT_DATE(), id) END, CASE WHEN id % 3 = 0 THEN NULL ELSE CAST(date_add(CURRENT_DATE(), id) AS TIMESTAMP) END, DATE '2026-01-12' FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15862_c0001 SELECT id, CASE WHEN id % 2 = 0 THEN '小米su7' ELSE '保时捷718' END, CASE WHEN id % 3 = 0 THEN NULL ELSE DATE_SUB(CURRENT_DATE(), id) END, CASE WHEN id % 3 = 0 THEN NULL ELSE CAST(date_add(CURRENT_DATE(), id) AS TIMESTAMP) END, DATE '2026-01-13' FROM range(4, 7);
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: |-
          新建标准，配置基础信息：
          * 中文名称：总额
          * 英文名称：amount
          * 英文缩写：at
          * 标准目录：${CatalogA}
          * 车型：小米su7、保时捷718
        expected: 基础信息填写完成，展示车型标准配置区域
      - action: |-
          配置「小米su7」车型标准：
          * 数据类型：数值型
          * 数据长度：<=5
          * 数据精度：3/2
          * 是否允许为空：不可空
          * 是否允许重复：不可重复
          * 取值范围：>=10且<=280
          默认值：1
          初始值：2
          无效值：0.1
          精度倍数：2.2
          偏移量：0.02
        expected: 「小米su7」车型标准配置完成
      - action: |-
          配置「保时捷718」车型标准：
          * 数据类型：数值型
          * 数据长度：<=5
          * 数据精度：3/2
          * 是否允许为空：不可空
          * 是否允许重复：不可重复
          * 取值范围：>=180且<=999
          默认值：1
          初始值：2
          无效值：0.1
          精度倍数：2.2
          偏移量：0.02
        expected: 「保时捷718」车型标准配置完成
      - action: 点击【上线】
        expected: 标准状态为「已上线」
      - action: 进入【数据标准 → 标准映射】页面
        expected: 进入成功
      - action: 给该标准绑定字段 register_date、last_login
        expected: 标准映射列表新增该标准，字段绑定状态为「已绑定」
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: |-
          新增检查任务，配置检查内容：
          * 数据源：${DataSourceA}
          * 数据库：${SchemaA}
          * 数据表：test_table_15862_c0001
          是否设置分区：不设置分区
          * 标准目录：${CatalogA}
          车型关联字段：不绑定
          点击「下一步」
        expected: 检查内容配置完成，进入选择字段页面
      - action: |-
          开启 register_date、last_login 字段检查：
          * 检查字段：register_date、last_login
          * 检查项：全部
          点击「下一步」
        expected: 检查项仅包含空值数、重复数，进入调度配置页面
      - action: |-
          配置检查周期：
          * 检查周期：按天运行
          点击「新增并立即执行」
        expected: Toast提示:「新增成功」，任务状态为「检查中」
      - action: 查看【落标检查设置】tab 列表
        expected: 任务状态为「检查完成」，列表展示数据表名称、所属数据源、所属数据库、检查字段数/总字段数、检查周期、检查状态、标准达标率、不达标字段数、最近编辑时间、最近检查时间和操作
      - action: 点击任务【查看结果详情】
        expected: 切换至【落标检查结果】tab，列表展示数据源、数据库、数据表、字段、检查状态、是否达标、检查开始时间、检查结束时间和操作
      - action: 点击结果【查看详情】
        expected: 结果详情展示检查信息、检查结果列表和关联标准详情，检查信息与任务配置一致，空值数和重复数检查项展示实际值、标准值和达标状态，未达标检查项操作为「查看详情」
      - action: 点击未达标检查项【查看详情】
        expected: 展示脏数据明细，不符合检查项的数据标红展示，明细行数 <= 100
      - action: 通过底层数据库查看该检查任务的 SQL
        expected: |-
          空值数规则进行 SQL 合并：
          1) 源表只扫描一次，FROM 后的源表仅出现 1 次
          2) register_date、last_login 的空值数写在同一个 SELECT 中，用 SUM(CASE WHEN) 并行计算
          3) 计算结果插入同一张脏数据表
          重复数规则不进行 SQL 合并：
          1) register_date、last_login 的重复数各自独立读取源表
          2) 一条规则对应一个 SELECT，无 SUM(CASE WHEN) 并行计算逻辑
          3) 重复数脏数据写入不同的脏数据表
      - action: 等待该检查任务按周期运行完成，查看结果详情
        expected: 检查结果列表按最新一次运行展示，检查项展示实际值、标准值和达标状态，详情与脏数据明细可查看
    tags:
      ["数据标准", "落标检查"]
