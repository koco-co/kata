meta:
  title: 数据质量任务性能优化_规则sql合并
  requirement_id: "15862"
  imports:
    - 数据质量规则SQL优化.csv
  exports:
    - 数据质量任务性能优化_规则sql合并.xmind
  case_module_id: ""
cases:
  - case_id: C0001
    automation:
      spec_file: c0001-mergeable-sample-partition-filter-strength-multi-pack.spec.ts
    title: 验证【数据质量】-【规则任务配置】可合并与不可合并规则，SQL 单次扫描源表且结果分组写入(过滤条件不同且包含强弱规则+多规则包)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入两个分区：2026-08-04 与 2026-08-05 各插入 6 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0001 (
           id BIGINT, age INT, string_num STRING, name STRING, address STRING,
           money STRING, buy_date DATE, date_detail STRING, dt STRING
         ) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15862_c0001 PARTITION (dt)
         SELECT 1 + user_idx, CASE user_idx WHEN 0 THEN 25 WHEN 1 THEN 30 WHEN 2 THEN 28 WHEN 3 THEN 35 WHEN 4 THEN 22 ELSE 29 END,
           CASE user_idx WHEN 0 THEN '001' WHEN 1 THEN '002' WHEN 2 THEN '003' WHEN 3 THEN '004' WHEN 4 THEN '005' ELSE '006' END,
           CASE user_idx WHEN 0 THEN '张三' WHEN 1 THEN '李四' WHEN 2 THEN '王五' WHEN 3 THEN '赵六' WHEN 4 THEN '小明' ELSE '小红' END,
           CASE user_idx WHEN 0 THEN '北京市朝阳区' WHEN 1 THEN '上海市浦东新区' WHEN 2 THEN '广州市天河区' WHEN 3 THEN '深圳市南山区' WHEN 4 THEN '杭州市西湖区' ELSE '成都市武侯区' END,
           CASE user_idx WHEN 0 THEN '5000.00' WHEN 1 THEN '6800.50' WHEN 2 THEN '4200.00' WHEN 3 THEN '9500.00' WHEN 4 THEN '3100.00' ELSE '5600.00' END,
           DATE_ADD(CURRENT_DATE(), INTERVAL -30 + user_idx DAY),
           CASE user_idx WHEN 0 THEN '订单已完成' WHEN 1 THEN '待发货' WHEN 2 THEN '已取消' WHEN 3 THEN '配送中' WHEN 4 THEN '已完成' ELSE '退款中' END,
           '2026-08-04'
         FROM range(1, 7);
         INSERT INTO ${SchemaA}.test_table_15862_c0001 PARTITION (dt)
         SELECT id + 6, age, string_num, name, address, money, buy_date, date_detail, '2026-08-05'
         FROM ${SchemaA}.test_table_15862_c0001
         WHERE dt = '2026-08-04';
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15862_c0001
          规则集描述：空
          规则包名称：可合并+不可合并+抽样开启+设置分区+不同过滤条件+包含强弱规则+多规则包
          点击「新增规则包」，点击【添加规则-完整性校验】
        expected: 打开「完整性校验」规则配置区域
      - action: |-
          配置监控规则1：
          * 生效范围：字段级
          * 字段：id、age
          字段间规则逻辑：and
          * 统计函数：空值数
          过滤条件：手动配置 id<=100
          校验方法：固定值
          期望值：!=1
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则1配置完成
      - action: |-
          配置监控规则2：
          * 生效范围：字段级
          * 字段：id、age
          字段间规则逻辑：or
          * 统计函数：空值率
          过滤条件：手动配置 id<=100
          校验方法：固定值
          期望值：=0
          * 强弱规则：强规则
          规则描述：测试规则
        expected: 监控规则2配置完成
      - action: |-
          配置监控规则3：
          * 生效范围：字段级
          * 字段：name
          * 统计函数：空串数
          过滤条件：手动配置 id<=100
          校验方法：固定值
          期望值：>0
          * 强弱规则：强规则
          规则描述：测试规则
        expected: 监控规则3配置完成
      - action: |-
          配置监控规则4：
          * 生效范围：字段级
          * 字段：name
          * 统计函数：空串率
          过滤条件：手动配置 id<=80
          校验方法：固定值
          期望值：=1
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则4配置完成
      - action: |-
          配置监控规则5：
          * 生效范围：单表
          * 统计函数：表行数
          过滤条件：手动配置 id<=100
          校验方法：固定值
          期望值：>0
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则5配置完成
      - action: |-
          配置监控规则6（不合并）：
          * 生效范围：字段级
          * 字段：string_num
          * 统计函数：字段取值校验
          过滤条件：手动配置 id<=100
          期望值：>=1
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则6配置完成
      - action: 点击【添加规则-有效性校验】
        expected: 选择成功，页面显示「有效性校验」规则配置区域
      - action: |-
          配置监控规则7：
          * 字段：id
          * 统计函数：数值-取值范围
          过滤条件：手动配置 id<=100
          校验方法：固定值
          期望值：>0且<=100
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则7配置完成
      - action: |-
          配置监控规则8：
          * 字段：string_num
          * 统计函数：数值-枚举个数
          过滤条件：手动配置 id>=100且<300
          校验方法：固定值
          期望值：>=1
          * 强弱规则：强规则
          规则描述：测试规则
        expected: 监控规则8配置完成
      - action: |-
          配置监控规则9：
          * 字段：age
          * 统计函数：枚举值
          过滤条件：手动配置 id<=100
          枚举值信息：not in 25,30,28,35
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则9配置完成
      - action: |-
          配置监控规则10：
          * 字段：id
          * 统计函数：取值范围&枚举范围
          取值范围：期望值>0且<5
          枚举值：in 1
          取值范围和枚举值关系：且
          * 强弱规则：强规则
          规则描述：测试规则
        expected: 监控规则10配置完成
      - action: |-
          配置监控规则11：
          * 字段：address
          * 统计规则：字符串长度
          校验方法：固定值
          期望值：>=1
          过滤条件：手动配置 id<=100
          * 强弱规则：强规则
          规则描述：测试规则
        expected: 监控规则11配置完成
      - action: |-
          配置监控规则12（不合并）：
          * 字段：money
          * 统计规则：数据精度
          小数点前最大位：=4 且 小数点后最大位：=1
          过滤条件：手动配置 id<=100
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则12配置完成
      - action: 点击【添加规则-唯一性校验】
        expected: 选择成功，页面显示「唯一性校验」规则配置区域
      - action: |-
          配置监控规则13：
          * 字段：id
          * 统计函数：重复数
          过滤条件：手动配置 id<=100
          校验方法：固定值
          期望值：=0
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则13配置完成
      - action: |-
          配置监控规则14：
          * 字段：age
          * 统计函数：多表唯一性判断
          过滤条件：手动配置 id<=100
          校验字段逻辑：唯一
          和其他表的校验关系：且
          选择对比表：${SchemaA}.test_table_15862_c0001
          对比表字段：id
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则14配置完成
      - action: 点击【添加规则-统计性校验】
        expected: 选择成功，页面显示「统计性校验」规则配置区域
      - action: |-
          配置监控规则15：
          * 字段：name
          * 统计函数：异常值检测
          过滤条件：手动配置 id<=100
          校验方法：IQR离群点数量
          期望值：=1
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则15配置完成
      - action: 点击【添加规则-自定义SQL】
        expected: 选择成功，页面显示「自定义SQL」规则配置区域
      - action: |-
          配置监控规则16：
          规则类型：完整性校验
          引用规则：自定义规则测试
          sql：select * from ${tableName} where ${colName} = ${value}
          参数：${tableName}：${SchemaA}.test_table_15862_c0001、${colName}：id、${value}：1
          校验方法：固定值
          期望值：=1
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则16配置完成
      - action: 点击【添加规则-一致性校验】
        expected: 选择成功，页面显示「一致性校验」规则配置区域
      - action: |-
          配置监控规则17：
          校验类型：多表数据一致性比对
          选择校验字段：id、name
          选择校验表主键：id
          对比表：${SchemaA}.test_table_15862_c0001
          选择对比表主键：id
          校验表比对字段：id、name
          对比表1：id、name
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则17配置完成
      - action: 点击【添加规则-时效性校验】
        expected: 选择成功，页面显示「时效性校验」规则配置区域
      - action: |-
          配置监控规则18：
          * 字段：buy_date
          * 统计函数：周期性校验（单字段时间差校验）
          过滤条件：手动配置 id<=100
          选择排序字段：id
          时间差：>=1秒
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则18配置完成
      - action: |-
          配置监控规则19：
          * 字段：id
          * 统计函数：及时性校验（多字段时间差校验）
          过滤条件：手动配置 id<=100
          选择对比字段组：buy_date、dt
          时间差：<1分钟
          大小关系：buy_date<dt
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则19配置完成
      - action: 点击【添加规则-合理性校验】
        expected: 选择成功，页面显示「合理性校验」规则配置区域
      - action: |-
          配置监控规则20：
          * 字段：age
          * 统计函数：数据变化趋势
          维度字段：空
          过滤条件：手动配置 id<=100
          * 选择排序字段：id
          * 校验方法：单调递增
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则20配置完成
      - action: |-
          配置监控规则21：
          * 字段：age
          * 统计函数：字段值计算对比
          过滤条件：手动配置 id<=100
          计算逻辑配置：cast(string_num as double)*(id+age)
          对比方法：计算结果与字段对比、age<计算结果
          * 强弱规则：弱规则
          规则描述：测试规则
        expected: 监控规则21配置完成
      - action: 点击【保存】
        expected: 规则集保存成功
      - action: |-
          新建监控任务：
          * 规则名称：RuleA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_15862_c0001
          选择分区：选择已有分区(dt=2026-08-04)
          抽样检查设置：百分比抽样50%
          点击「下一步」
        expected: 进入「监控规则」步骤
      - action: |-
          引入规则包：
          * 规则包：可合并+不可合并+抽样开启+设置分区+不同过滤条件+包含强弱规则+多规则包
          * 规则类型：全部
          点击「引入」并「确定」
        expected: 规则包区域展示 packA，规则行数量为 1
      - action: |-
          配置调度属性：
          * 调度周期：手动触发
          * 规则拼接包：10
          * 资源组：默认资源组
          * 超时时间：不限制
          告警方式：无
          无需生成报告：不勾选
          报告名称：质量报告A
          点击「保存」
        expected: Toast提示:「保存成功」,规则任务列表新增 RuleA
      - action: 点开规则详情，查看规则SQL
        expected: |-
          1) 过滤条件相同的规则按强弱分类进行合并：规则1、5、7、9进行合并；规则2、10、11进行合并；源表只扫描一次，合并的子规则写在同一个 select 里用 SUM(CASE WHEN) 并行计算，结果拆成多行插入同一张脏数据表
          2) 其余规则不合并：各规则单独扫描源表，判断语句分开写，结果单独成行，不同规则数据分开存入不同的脏数据表
          3) 抽样开启：SQL 含 rand() 函数和临时抽样表（表名_temp_sample_table）
      - action: 临时运行规则，查看实例详情
        expected: 实例详情展示正确，未通过的子规则可查看明细
      - action: 查看质量报告
        expected: 质量报告展示与配置的规则内容一致
    tags:
      - 数据质量
      - 规则任务配置

