          - 选择对比表: dwd_voyah_dq_rule_08_ref
          - 对比表所属库: ${SchemaA}
          - 输入分区: 选择已有分区 stat_date='20260116'
          - 比对细节设置: 记录数百分比差异 <= 0%; 记录数数量差异 <= 0 条
          - 强弱规则: 强规则
          - 规则描述: 校验多表行数分区结果
          点击「保存」并保存规则集
        expected: |-
