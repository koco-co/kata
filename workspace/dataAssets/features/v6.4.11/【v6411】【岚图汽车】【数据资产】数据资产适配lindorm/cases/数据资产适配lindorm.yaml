    precondition: |-
      USE ${SchemaA};

      /*
      1. 已引入 SparkThrift2.x 数据源，数据库 ${SchemaA}。
      2. 已在【数据质量 → 通用配置 → 报告关联维表设置】中为目标表 dwd_voyah_dq_rule_21_main 配置报告关联维度：
         - 车辆数统计字段：vehicle_count
         - 车系关联字段：car_series_code
         - 车型关联字段：car_model_code
         - 动力类型关联字段：power_type
      3. 已在【数据质量 → 通用配置 → json格式校验管理】中维护校验 key：vehicle-vin，value 格式为 VIN 正则 ^LTV[A-Z0-9]{14}$。
      4. 执行以下 SparkThrift2.x 前置 SQL，准备 有效性校验-格式-json格式校验 的通过分区 stat_date='20260116' 和失败分区 stat_date='20260115' 测试数据。
      */

      DROP TABLE IF EXISTS dwd_voyah_dq_rule_21_main;

      CREATE TABLE dwd_voyah_dq_rule_21_main (
        order_id STRING COMMENT '销售订单号',
        vin STRING COMMENT '车辆识别代码',
        vehicle_count BIGINT COMMENT '车辆数统计字段',
        car_series_code STRING COMMENT '车系关联字段',
        car_series_name STRING COMMENT '车系名称',
        car_model_code STRING COMMENT '车型关联字段',
        car_model_name STRING COMMENT '车型名称',
        power_type STRING COMMENT '动力类型关联字段',
        final_price DECIMAL(20,3) COMMENT '最终成交价',
        guide_price DECIMAL(20,3) COMMENT '官方指导价',
        discount_amount DECIMAL(20,3) COMMENT '优惠金额',
        delivery_center STRING COMMENT '交付中心',
        json_payload STRING COMMENT '车辆扩展 JSON',
        owner_id_card STRING COMMENT '车主身份证号',
        owner_phone STRING COMMENT '车主手机号',
        owner_email STRING COMMENT '车主邮箱',
        production_date STRING COMMENT '生产日期',
        delivery_time STRING COMMENT '交付时间',
        order_time STRING COMMENT '下单时间',
        payment_time STRING COMMENT '支付时间',
        event_time STRING COMMENT '趋势事件时间',
        mileage BIGINT COMMENT '累计里程',
        battery_loss_rate DECIMAL(10,3) COMMENT '电池衰减率'
      )
      COMMENT '岚图车辆质量规则任务有效性校验-格式-json格式校验主表'
      PARTITIONED BY (stat_date STRING COMMENT '分区字段，格式 yyyyMMdd')
      STORED AS ORC;

