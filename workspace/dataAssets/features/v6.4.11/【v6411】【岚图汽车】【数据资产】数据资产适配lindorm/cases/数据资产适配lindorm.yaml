  - id: C338
    title: 验证【一致性校验-多表数据一致性比对】质量规则任务校验正常(单主键)
    priority: P2
    steps:
      - action: |-
          进入【数据质量 → 规则集管理】, 点击「新建规则集」:
          - 选择数据源: SparkThrift2.x
          - 选择数据库: ${SchemaA}
          - 选择数据表: dwd_voyah_dq_rule_36_main
          - 选择对比表: dwd_voyah_dq_rule_36_ref
          - 规则集描述: 一致性校验-多表数据一致性比对
          - 新增规则包名称: 一致性校验-多表数据一致性比对规则包
          点击「下一步」
        expected: |-
          1)规则集基础信息保存成功
          2)规则包创建成功
      - action: |-
          选择规则包(一致性校验-多表数据一致性比对规则包), 新增「一致性校验」规则:
          - 校验类型: 多表数据一致性比对
          - 选择校验字段: car_model_code,power_type
          - 选择校验表主键: vin
          - 选择对比表: dwd_voyah_dq_rule_36_ref
          - 对比表字段: car_model_code,power_type
          - 对比表分区: 选择已有分区 stat_date='20260116'
          - 选择对比表主键: vin
          - 比对细节设置: 数值差异绝对值 <= 0
          - 强弱规则: 强规则
          - 规则描述: 校验多表一致分区结果
          点击「保存」并保存规则集
        expected: |-
          1)规则保存成功
          2)规则集详情中展示「一致性校验-多表数据一致性比对」规则
          3)规则配置项保存后回显正确
          4)规则描述展示为「校验多表一致分区结果」
      - action: |-
          进入【数据质量 → 规则任务管理】, 点击「新建监控规则」:
          - 规则名称: SparkThrift2.x+一致性校验-多表数据一致性比对
          - 选择数据源: SparkThrift2.x
          - 选择数据库: ${SchemaA}
          - 选择数据表: dwd_voyah_dq_rule_36_main
          - 选择对比表: dwd_voyah_dq_rule_36_ref
          - 选择已有分区: stat_date='20260116'
          点击「下一步」
        expected: |-
          1)监控对象配置成功
          2)进入监控规则页面
      - action: |-
          在「监控规则」中引用质量规则:
          - 规则包: 一致性校验-多表数据一致性比对规则包
          - 规则类型: 一致性校验
          点击「下一步」
        expected: |-
          1)监控规则配置成功
          2)进入调度属性页面
      - action: |-
          在「调度属性」中配置:
          1)调度配置:
          - 调度周期: 手动触发
          - 规则拼接包: 1
          - 实例生成方式: 立即生成
          - 超时时间: 不限制
          2)告警配置: 无
          3)报告配置: 无需生成报告
          点击保存, 进入规则任务${SchemaA}.dwd_voyah_dq_rule_36_main、dwd_voyah_dq_rule_36_ref详情页, 点击「立即执行」
        expected: |-
          1)调度属性配置成功
          2)规则任务保存成功
          3)进入规则任务${SchemaA}.dwd_voyah_dq_rule_36_main、dwd_voyah_dq_rule_36_ref详情页
          4)任务提交执行成功
      - action: 进入【数据质量 → 校验结果查询】, 查询任务名称(SparkThrift2.x+一致性校验-多表数据一致性比对)最新实例详情
        expected: |-
          1)最新实例为「校验通过」
          2)car_model_code,power_type 实际值为 0
          3)规则期望值或判断条件展示正确
          4)明细仅统计 stat_date='20260116' 分区
      - action: |-
          切换失败分区(对比表分区必须同步更新, 否则对比表仍读通过分区 stat_date='20260116' 干净数据, 校验会一直通过):
          1)进入【数据质量 → 规则集管理】, 编辑规则集(一致性校验-多表数据一致性比对)的一致性校验规则, 将对比表分区从 stat_date='20260116' 改为 stat_date='20260115', 保存规则集
          2)进入【数据质量 → 规则任务管理】, 编辑规则任务(SparkThrift2.x+一致性校验-多表数据一致性比对), 将校验表分区从 stat_date='20260116' 改为 stat_date='20260115', 点击「下一步」重新引入规则包(此时对比表分区同步更新为 stat_date='20260115')
          3)保存后再次点击「立即执行」
        expected: |-
          1)规则集对比表分区更新为 stat_date='20260115'
          2)规则任务重新引入规则包成功, 校验表与对比表分区均为 stat_date='20260115'
          3)任务分区保存成功
          4)任务提交执行成功
      - action: 进入【数据质量 → 校验结果查询】, 查询任务名称(SparkThrift2.x+一致性校验-多表数据一致性比对)最新实例详情
        expected: |-
          1)最新实例为「校验不通过」
          2)car_model_code,power_type 实际值为 1
          3)规则期望值或判断条件展示正确
          4)不通过明细包含 vin=LTV202601150003AA 的车型或动力类型不一致
          5)明细仅统计 stat_date='20260115' 分区
