          - 关联表主键: vin
          - 计算逻辑配置: guide_price - final_price
          - 对比方法: 计算结果值判断
          - 结果值: <= 1000000
          - 强弱规则: 强规则
          - 规则描述: 校验多表计算判断分区结果
          点击「保存」并保存规则集
