        delivery_time STRING COMMENT '交付时间',
        order_time STRING COMMENT '下单时间',
        payment_time STRING COMMENT '支付时间',
        event_time STRING COMMENT '趋势事件时间',
        mileage BIGINT COMMENT '累计里程',
        battery_loss_rate DECIMAL(10,3) COMMENT '电池衰减率'
      )
