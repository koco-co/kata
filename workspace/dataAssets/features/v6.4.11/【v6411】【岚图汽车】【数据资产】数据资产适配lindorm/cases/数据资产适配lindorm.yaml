  - id: C335
    title: 验证【自定义SQL-一致性校验】质量规则任务校验正常(固定值+<=)
    priority: P2
    steps:
      - action: |-
          进入【数据质量 → 规则库配置】, 切换到【自定义SQL模版】并点击「新增自定义sql模版」:
          - 规则名称: 自定义SQL一致性主外表差异模板
          - 规则分类: 一致性校验
          - 关联范围: 多表
          - 规则描述: 自定义SQL-一致性校验模板
          - 自定义配置: select count(*) from ${test_table} t left join ${ref_table} r on t.vin = r.vin where t.car_model_code <> r.car_model_code or r.vin is null;
          - 参数配置:
          - 参数: ${test_table}
          - 类型: 当前校验表
          - 参数名称: 当前校验表
          - 参数说明: 当前任务主表
          - 参数: ${ref_table}
          - 类型: 自定义参数
          - 参数名称: 对比表
          - 参数说明: 对比表表名
          点击「保存」
        expected: |-
          1)自定义SQL模版保存成功
          2)列表展示该自定义SQL模版
          3)规则分类、关联范围、规则描述回显正确
          4)参数列表按SQL中的参数自动解析并展示，参数、类型、参数名称、参数说明保存后回显正确
      - action: |-
          进入【数据质量 → 规则集管理】, 点击「新建规则集」:
          - 选择数据源: SparkThrift2.x
          - 选择数据库: ${SchemaA}
          - 选择数据表: dwd_voyah_dq_rule_33_main
          - 选择对比表: dwd_voyah_dq_rule_33_ref
          - 规则集描述: 自定义SQL-一致性校验
          - 新增规则包名称: 自定义SQL-一致性校验规则包
          点击「下一步」
        expected: |-
          1)规则集基础信息保存成功
          2)规则包创建成功
      - action: |-
          选择规则包(自定义SQL-一致性校验规则包), 新增「自定义SQL」规则:
          - 规则类型: 一致性校验
          - 引用规则: 自定义SQL一致性主外表差异模板
          - SQL面板: 自动回显引用规则中的自定义配置且不可编辑
          - 参数值:
          - ${test_table}: 使用规则任务当前监控对象
          - ${ref_table}: dwd_voyah_dq_rule_33_ref
          - 校验字段: car_model_code
          - 校验方法: 固定值
          - 期望值: <= 0
          - 强弱规则: 强规则
          - 规则描述: 校验一致性校验SQL结果
          点击「保存」并保存规则集
        expected: |-
          1)引用规则选择成功
          2)SQL面板回显引用规则中的自定义配置且不支持编辑
          3)参数列表与自定义SQL模版配置一致
          4)校验字段保存后回显正确
          5)规则保存成功
          6)规则集详情中展示「自定义SQL-一致性校验」规则
          7)规则描述保存后回显正确
      - action: |-
          进入【数据质量 → 规则任务管理】, 点击「新建监控规则」:
          - 规则名称: SparkThrift2.x+自定义SQL-一致性校验
          - 选择数据源: SparkThrift2.x
          - 选择数据库: ${SchemaA}
          - 选择数据表: dwd_voyah_dq_rule_33_main
          - 选择对比表: dwd_voyah_dq_rule_33_ref
          - 选择已有分区: stat_date='20260116'
