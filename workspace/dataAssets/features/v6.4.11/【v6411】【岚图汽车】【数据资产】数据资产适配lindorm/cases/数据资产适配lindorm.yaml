        guide_price DECIMAL(20,3) COMMENT '官方指导价',
        discount_amount DECIMAL(20,3) COMMENT '优惠金额',
        delivery_center STRING COMMENT '交付中心',
        json_payload STRING COMMENT '车辆扩展 JSON',
        owner_id_card STRING COMMENT '车主身份证号',
        owner_phone STRING COMMENT '车主手机号',
        owner_email STRING COMMENT '车主邮箱',
        production_date STRING COMMENT '生产日期',
        delivery_time STRING COMMENT '交付时间',
        order_time STRING COMMENT '下单时间',
        payment_time STRING COMMENT '支付时间',
        event_time STRING COMMENT '趋势事件时间',
        mileage BIGINT COMMENT '累计里程',
        battery_loss_rate DECIMAL(10,3) COMMENT '电池衰减率'
      )
      COMMENT '岚图车辆质量规则任务合理性校验-多表字段值对比-计算结果值判断对比表'
      PARTITIONED BY (stat_date STRING COMMENT '分区字段，格式 yyyyMMdd')
      STORED AS ORC;

