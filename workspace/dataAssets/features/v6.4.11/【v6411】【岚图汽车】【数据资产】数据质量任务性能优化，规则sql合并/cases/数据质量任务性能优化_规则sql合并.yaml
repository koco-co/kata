      - action: 「监控规则14」配置如下： 「字段」：「name」 「统计函数」：「异常值检测」 「过滤条件」：「手动配置：id<=100」 「校验方法」：「IQR离群点数量」 「期望值」：「=1」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
