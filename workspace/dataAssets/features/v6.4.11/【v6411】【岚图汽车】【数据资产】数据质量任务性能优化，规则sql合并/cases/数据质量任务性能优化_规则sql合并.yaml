        expected: 监控规则12配置完成
      - action: 「监控规则13」配置如下： 「字段」：「age」 「统计函数」：「多表唯一性判断」 「过滤条件」：「手动配置：id<=100」 「校验字段逻辑」：「唯一」 「和其他表的校验关系」：「且」 「选择对比表」：「${TABLE}」 「对比表字段」：「id」 「校验字段逻辑」：「唯一」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
