      - action: 「监控规则15」配置如下： 「规则类型」：「完整性校验」 「引用规则」：「自定义规则测试」 「sql」：「select * from ${tableName} where ${colName} = ${value}」 「参数」：「${tableName}：pw_test.test_info_1」、「${colName}：id」、「${value}：1」 「校验方法」：「固定值」 「期望值」：「=1」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
