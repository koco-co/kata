        expected: 选择成功，页面显示「一致性校验」规则配置区域
      - action: 「监控规则16」配置如下： 「校验类型」：「多表数据一致性比对」 「选择校验字段」：「id、name」 「选择校验表主键」：「id」 「对比表」：「${TABLE}」 「选择对比表主键」：「id」 「校验表比对字段」：「id」、「name」 「对比表1」：「id」、「name」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
        expected: 监控规则16配置完成
      - action: 点击【添加规则-时效性校验】
