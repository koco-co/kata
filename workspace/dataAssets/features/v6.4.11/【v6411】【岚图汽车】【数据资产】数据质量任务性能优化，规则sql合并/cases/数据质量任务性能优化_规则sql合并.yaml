      - action: 点击「新增规则包」-「可合并+不可合并+抽样开启+设置分区+不同过滤条件+包含强弱规则+多规则包」，点击【添加规则-完整性校验】
        expected: 抽样开启：sql有rand()函数和 tableName_temp_sample_table_xxx 临时抽样表
      - action: 「监控规则1」配置如下： 「生效范围」：「字段级」 「字段」：「id，age」 「字段间规则逻辑」：「and」 「统计函数」：「空值数」 「过滤条件」：「手动配置：id<=100」 「校验方法」：「固定值」 「期望值」：「!=1」 「强弱规则」选择「弱规则」 「规则描述」输入「测试规则」
        expected: 监控规则1配置完成
      - action: 「监控规则2」配置如下： 「生效范围」：「字段级」 「字段」：「id，age」 「字段间规则逻辑」：「or」 「统计函数」：「空值率」 「校验方法」：「固定值」 「期望值」：「=0」 「强弱规则」选择「强规则」 「规则描述」输入「测试规则」
