meta:
  title: 落标检查任务性能优化_规则sql合并
  requirement_id: "15862"
  exports:
    - 落标检查任务性能优化_规则sql合并.xmind
  case_module_id: ""
cases:
  - case_id: C0001
    title: 验证【数据标准】-【落标检查】配置数值字段全部检查项并执行，展示空值数、重复数和取值范围结果(车型未绑定关联字段)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入车型数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0001 (id BIGINT, car_model STRING, amount DECIMAL(10,2), dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0001 SELECT id, CASE WHEN id % 2 = 0 THEN '车型A' ELSE '车型B' END, CAST(id AS DECIMAL(10,2)), CURRENT_DATE() FROM range(1, 7);
      5) 标准目录「CatalogA」存在标准「StandardL」，车型配置为「车型A」「车型B」，amount 字段要求非空、不可重复、范围 1 至 6
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 点击【新增检查任务】，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0001 和标准目录「CatalogA」，车型关联字段保持未选择
        expected: 检查对象展示数据源、数据库、数据表和标准目录，车型关联字段为空
      - action: 在字段选择中启用 amount，检查项选择「全部」，点击【下一步】
        expected: amount 展示空值数、重复数和取值范围检查项，进入调度配置
      - action: 选择按天执行并点击【新增并立即执行】
        expected: Toast提示:「新增成功」，任务状态为「检查中」
      - action: 打开检查结果详情
        expected: 结果展示 amount 字段、3 个检查项、检查状态和标准达标率
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0002
    title: 验证【数据标准】-【落标检查】配置布尔字段非空检查并执行，空值数为 0 且标准达标率 100%(车型未绑定关联字段)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入布尔字段数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0002 (id BIGINT, is_vip BOOLEAN, dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0002 SELECT id, id % 2 = 0, CURRENT_DATE() FROM range(1, 7);
      5) 标准「StandardA」绑定 is_vip 字段，要求非空
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0002 和标准「StandardA」，不选择车型关联字段
        expected: 检查对象展示 is_vip 字段对应的标准
      - action: 启用 is_vip 检查，检查项选择「全部」并提交调度配置
        expected: 字段检查项仅展示空值数，调度配置展示按天执行
      - action: 点击【新增并立即执行】并打开结果详情
        expected: 任务状态为「检查完成」，is_vip 空值数为 0，标准达标率为 100%
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0003
    title: 验证【数据标准】-【落标检查】配置数值字符串字段全部检查项并执行，展示字符串长度等 4 项检查结果(车型未绑定关联字段)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入数值字符串数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0003 (id BIGINT, car_model STRING, amount STRING, dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0003 SELECT id, '车型A', CAST(id AS STRING), CURRENT_DATE() FROM range(1, 7);
      5) 标准「StandardK」绑定 amount 字段，要求长度 1 至 2、非空、不可重复、取值范围 1 至 6
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0003 和标准「StandardK」
        expected: 检查对象展示 amount 字段和标准配置
      - action: 启用 amount 检查并选择「全部」检查项
        expected: 检查项包含字符串长度、空值数、重复数和取值范围
      - action: 保存并立即执行任务
        expected: Toast提示:「新增成功」，任务进入「检查完成」状态
      - action: 打开结果详情
        expected: amount 的每个检查项展示实际值、标准值、达标状态和异常明细入口
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0004
    title: 验证【数据标准】-【落标检查】映射日期与时间戳字段并执行，结果字段类型展示为 DATE 和 TIMESTAMP(两字段同时映射)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建日期时间字段数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0004 (id BIGINT, register_date DATE, last_login TIMESTAMP, dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0004 SELECT id, DATE_SUB(CURRENT_DATE(), id), CURRENT_TIMESTAMP(), CURRENT_DATE() FROM range(1, 7);
      5) 标准「StandardD」分别绑定 register_date 和 last_login，要求日期字段非空、时间戳字段非空
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0004 和标准「StandardD」
        expected: 检查对象展示 register_date、last_login 两个已映射字段
      - action: 启用两个字段检查并选择「全部」检查项
        expected: 两个字段均展示空值数和重复数检查项
      - action: 保存并立即执行任务
        expected: 任务状态从「检查中」变为「检查完成」
      - action: 查看结果详情
        expected: 结果中的字段类型分别为 DATE、TIMESTAMP，检查值与字段类型匹配
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0005
    title: 验证【数据标准】-【落标检查】绑定车型关联字段执行检查，结果按车型分组且各自使用对应标准(绑定车型关联字段)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建车型分区表并插入前一日和当日数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0005 (id BIGINT, car_model STRING, amount DECIMAL(10,2), dt DATE) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15862_c0005 SELECT id, '车型A', CAST(id AS DECIMAL(10,2)), DATE_SUB(CURRENT_DATE(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15862_c0005 SELECT id, '车型B', CAST(id + 3 AS DECIMAL(10,2)), CURRENT_DATE() FROM range(4, 7);
      5) 标准「StandardL」为车型A配置范围 1 至 3，为车型B配置范围 4 至 6，标准映射字段为 amount，车型关联字段为 car_model
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0005 和标准「StandardL」
        expected: 检查对象展示车型关联字段选择项
      - action: 将车型关联字段选择为 car_model，选择当日分区并启用 amount 检查
        expected: 车型关联字段显示 car_model，检查分区显示当日
      - action: 保存并立即执行任务
        expected: 任务状态为「检查完成」，车型A与车型B分别使用对应标准配置
      - action: 查看结果详情
        expected: 结果按 car_model 分组展示，车型B记录的 amount 均在 4 至 6 范围内
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0006
    title: 验证【数据标准】-【落标检查】选择前一日与当日分区执行，生成 SQL 仅包含所选分区过滤条件(两分区)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并插入前一日和当日数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0006 (id BIGINT, amount DECIMAL(10,2), dt DATE) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15862_c0006 SELECT id, CAST(id AS DECIMAL(10,2)), DATE_SUB(CURRENT_DATE(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15862_c0006 SELECT id, CAST(id + 3 AS DECIMAL(10,2)), CURRENT_DATE() FROM range(4, 7);
      5) 标准「StandardJ」绑定 amount 字段并要求 amount 大于 0
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0006 和标准「StandardJ」
        expected: 检查对象展示分区选择控件
      - action: 选择前一日和当日两个分区，启用 amount 检查并提交
        expected: 分区列表展示前一日和当日两个动态日期值
      - action: 保存并立即执行任务
        expected: 任务状态为「检查完成」，检查记录数为 6
      - action: 查看生成 SQL
        expected: SQL 包含前一日和当日分区过滤条件，未读取其他分区
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0007
    title: 验证【数据标准】-【落标检查】不选分区执行检查，检查记录数为 6 且覆盖整表数据(未选择分区)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入测试记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0007 (id BIGINT, amount DECIMAL(10,2), dt DATE) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15862_c0007 SELECT id, CAST(id AS DECIMAL(10,2)), DATE_SUB(CURRENT_DATE(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15862_c0007 SELECT id, CAST(id + 3 AS DECIMAL(10,2)), CURRENT_DATE() FROM range(4, 7);
      5) 标准「StandardI」绑定 amount 字段并要求 amount 大于 0
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0007 和标准「StandardI」，分区保持未选择
        expected: 检查对象未展示分区过滤条件
      - action: 启用 amount 检查并点击【新增并立即执行】
        expected: 任务状态为「检查完成」，检查记录数为 6
      - action: 查看结果详情
        expected: 结果包含前一日和当日数据，标准达标率为 100%
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0008
    title: 验证【数据标准】-【落标检查】勾选全部检查项，按字段类型展示各自支持的检查项(全部检查项)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入测试记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0008 (id BIGINT, code STRING, amount DECIMAL(10,2), dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0008 SELECT id, CONCAT('code_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)), CURRENT_DATE() FROM range(1, 7);
      5) 标准「StandardB」映射 code、amount 两个字段
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务并选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0008 和标准「StandardB」
        expected: 字段选择列表展示 code、amount
      - action: 选择 code、amount 并将检查项设置为「全部」
        expected: code 展示字符串长度、空值数、重复数和取值范围，amount 展示空值数、重复数和取值范围
      - action: 点击【下一步】进入调度配置
        expected: 调度配置展示已选字段和检查项数量
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0009
    title: 验证【数据标准】-【落标检查】仅指定字段和检查项保存，调度配置展示 2 条检查项(指定字段)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入测试记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0009;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0009 (id BIGINT, code STRING, amount DECIMAL(10,2), dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0009 SELECT id, CONCAT('code_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)), CURRENT_DATE() FROM range(1, 7);
      5) 标准「StandardC」映射 code、amount 两个字段
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务并选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0009 和标准「StandardC」
        expected: 字段选择列表展示 code、amount
      - action: 仅选择 code 字段，检查项仅勾选空值数和重复数
        expected: code 仅展示空值数和重复数，amount 未生成检查项
      - action: 点击【下一步】并保存任务
        expected: 调度配置仅展示 2 条检查项，任务保存成功
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0010
    title: 验证【数据标准】-【落标检查】查看空值数规则详情，脏数据明细展示 2 条异常记录(空值规则不达标)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入空值数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0010 (id BIGINT, code STRING, amount DECIMAL(10,2), dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0010 SELECT id, CASE WHEN id IN (2, 4) THEN NULL ELSE CONCAT('code_', CAST(id AS STRING)) END, CAST(id AS DECIMAL(10,2)), CURRENT_DATE() FROM range(1, 7);
      5) 标准「StandardF」映射 code 字段并要求非空
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0010 和标准「StandardF」，启用 code 空值数检查
        expected: 检查任务配置展示 code 空值数规则
      - action: 保存并立即执行任务
        expected: 任务状态为「检查完成」，code 空值数为 2
      - action: 点击 code 空值数规则【查看详情】
        expected: 脏数据明细包含 id=2、id=4，明细行数量为 2
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0011
    title: 验证【数据标准】-【落标检查】查看结果列表，是否达标列为「是」且标准达标率 100%(全部规则达标)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建表并插入满足标准的数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0011;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0011 (id BIGINT, code STRING, amount DECIMAL(10,2), dt DATE);
         INSERT INTO ${SchemaA}.test_table_15862_c0011 SELECT id, CONCAT('code_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)), CURRENT_DATE() FROM range(1, 7);
      5) 标准「StandardE」映射 code、amount，所有检查项预期均达标
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15862_c0011 和标准「StandardE」，启用 code、amount 的检查项
        expected: 任务配置展示所选字段和检查项
      - action: 保存并立即执行任务
        expected: 任务状态为「检查完成」，达标字段数为 2
      - action: 查看【落标检查结果】列表
        expected: code 和 amount 的是否达标列为「是」，标准达标率为 100%
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0012
    title: 验证【数据标准】-【落标检查】查看已执行任务的结果列表，展示 8 个结果字段(任务执行完成)
    priority: P1
    precondition: |-
      1) 使用租户管理员账号进入数据标准平台并具备落标检查任务查看权限
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：SparkThrift2.x
      4) 存在数据库：${SchemaA}
      5) 检查任务「TaskB」已执行完成，关联表为「${SchemaA}.test_table_15862_c0012」
      6) 创建并写入关联表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15862_c0012;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15862_c0012 (id BIGINT, code STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15862_c0012 SELECT id, CONCAT('code_', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)) FROM range(1, 7);
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 点击【落标检查设置】列表中的任务「TaskB」
        expected: 列表展示数据源、数据库、数据表、检查字段数、检查周期、检查状态、标准达标率和最近检查时间
      - action: 点击任务【查看结果详情】
        expected: 切换至【落标检查结果】列表，字段包含数据源、数据库、数据表、字段、检查状态、是否达标、开始时间和结束时间
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0013
    title: 验证【数据标准】-【落标检查】编辑检查项后重新执行，最新结果同时展示新增检查项(编辑检查项)
    priority: P1
    precondition: |-
      1) 使用租户管理员账号进入数据标准平台并具备落标检查任务编辑权限
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：SparkThrift2.x
      4) 存在数据库：${SchemaA}
      5) 任务「TaskC」已关联「${SchemaA}.test_table_15862_c0013」，当前检查 code 空值数
