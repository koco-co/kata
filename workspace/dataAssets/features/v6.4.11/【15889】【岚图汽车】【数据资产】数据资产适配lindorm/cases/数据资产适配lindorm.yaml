meta:
  title: 数据资产适配 Lindorm
  requirement_id: "15889"
  case_module_id: ""
  exports:
    - 数据资产适配lindorm.xmind
cases:
  - case_id: C0001
    title: 验证【数据资产】-【盘点任务】查看已接入数据源统计，统计卡片展示 Lindorm 类型与库表数量
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0001 (order_id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15889_c0001 VALUES (1, 10.5), (2, 20.5), (3, 30.5);
      5) ${DataSourceA} 已完成数据源、数据库和数据表的元数据同步
    steps:
      - action: 进入【数据资产 → 盘点任务】页面
        expected: 进入成功
      - action: 查看「已接入数据源」统计卡片
        expected: 卡片展示 Lindorm 数据源类型、数据库数 1 和数据表数 1
      - action: 查看昨日新增统计
        expected: 展示昨日新增源数、库数、表数和存储量字段，数值均有明确值
    tags:
      - 数据资产
      - 盘点任务
      - Lindorm

  - case_id: C0002
    title: 验证【数据资产】-【盘点任务】切换数据源类型查看分布图，仅统计所选类型的表数量并展示负责人分布
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Lindorm
      3) 数据源 A 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建 4 张数据表并各插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0002_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0002_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0002_source_01 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0002_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0002_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0002_source_02 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0002_source_03;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0002_source_03 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0002_source_03 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0002_source_04;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0002_source_04 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0002_source_04 VALUES (1, 'A');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：SparkThrift2.x
      7) 数据源 B 存在数据库：${SchemaB}
      8) 在 ${SchemaB} 创建 2 张数据表并各插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15889_c0002_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15889_c0002_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaB}.test_table_15889_c0002_source_01 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15889_c0002_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15889_c0002_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaB}.test_table_15889_c0002_source_02 VALUES (1, 'A');
      9) 授权数据源 C：${DataSourceC}
      10) 数据源 C 类型：Doris3.x
      11) 数据源 C 存在数据库：${SchemaC}
      12) 在 ${SchemaC} 创建 1 张数据表并插入 1 行数据：
          DROP TABLE IF EXISTS ${SchemaC}.test_table_15889_c0002_source_01;
          CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_15889_c0002_source_01 (id BIGINT, name STRING);
          INSERT INTO ${SchemaC}.test_table_15889_c0002_source_01 VALUES (1, 'A');
      13) 三个数据源均已完成元数据同步，数据表均未分配负责人
    steps:
      - action: 进入【数据资产 → 盘点任务】页面
        expected: 进入成功
      - action: 在数据源类型下拉框选择「Lindorm」并将分布属性选择为「负责人」
        expected: 分布图仅统计 ${DataSourceA}，展示 4 张表及负责人分布
      - action: 将数据源类型切换为「Doris3.x」
        expected: 分布图更新为 ${DataSourceC} 的 1 张表，不保留 ${DataSourceA} 统计
    tags:
      - 数据资产
      - 盘点任务
      - 数据源筛选

  - case_id: C0003
    title: 验证【数据资产】-【盘点任务】查看未分配目录的统计模块，数据目录分布与价值排行展示暂无数据
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0003 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0003 VALUES (1, 'A');
      5) ${DataSourceA} 已完成 1 个数据库和 1 张数据表的元数据同步
      6) test_table_15889_c0003 未分配数据目录
    steps:
      - action: 进入【数据资产 → 盘点任务】页面
        expected: 进入成功
      - action: 查看「数据目录分布」模块
        expected: 模块展示「暂无数据」，不展示虚构目录名称
      - action: 查看「数据价值排行」模块
        expected: 无排行记录时展示「暂无数据」空状态
    tags:
      - 数据资产
      - 盘点任务
      - 空状态

  - case_id: C0004
    title: 验证【数据资产】-【数据地图】搜索数据表名称，结果按前缀匹配仅展示命中数据表
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建 2 张数据表并各插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0004_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0004_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0004_source_01 VALUES (1, 'orders');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0004_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0004_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0004_source_02 VALUES (1, 'customers');
      5) 两张数据表均已完成元数据同步
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 打开搜索下拉框，选择资产类型「数据表」，输入「test_table_15889_c0004_source_01」并点击【搜索】
        expected: 结果列表仅展示数据表 test_table_15889_c0004_source_01，资产类型标识为「数据表」
      - action: 清空关键词并输入「test_table_15889_c0004_」后点击【搜索】
        expected: 结果列表展示 test_table_15889_c0004_source_01、test_table_15889_c0004_source_02 两条匹配记录
    tags:
      - 数据资产
      - 数据地图
      - Lindorm

  - case_id: C0005
    title: 验证【数据资产】-【数据地图】按资产类型搜索资产，各类型按名称匹配仅展示对应资产
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0005 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0005 VALUES (1, 'order');
      5) 数据地图存在离线任务 ${TaskA}、实时任务 ${TaskB} 和 API order_api
      6) 数据表、任务与 API 均已完成元数据同步
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 选择资产类型「数据表」并搜索「test_table_15889_c0005」
        expected: 结果列表仅包含 test_table_15889_c0005，类型筛选值为「数据表」
      - action: 切换资产类型为「离线任务」并搜索「TaskA」
        expected: 结果列表仅展示 ${TaskA}
      - action: 切换资产类型为「实时任务」并搜索「TaskB」
        expected: 结果列表仅展示 ${TaskB}
      - action: 切换资产类型为「API」并搜索「order_api」
        expected: 结果列表仅展示 order_api
    tags:
      - 数据资产
      - 数据地图
      - 资产类型

  - case_id: C0006
    title: 验证【数据资产】-【数据地图】搜索资产后查看最近查询，点击历史关键词回填并展示对应结果
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0006 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0006 VALUES (1, 'A');
      5) 数据地图存在离线任务 ${TaskA} 和 API order_api，且已完成元数据同步
      6) 数据地图搜索记录为空
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 依次搜索「test_table_15889_c0006」「TaskA」「order_api」
        expected: 每次搜索均生成对应结果，最近查询区域按最新搜索时间排序
      - action: 打开「最近查询」并点击「TaskA」
        expected: 搜索框回填 TaskA，结果列表展示对应离线任务
    tags:
      - 数据资产
      - 数据地图
      - 最近查询

  - case_id: C0007
    title: 验证【数据资产】-【数据地图】按表数量排序查看数据源统计，刷新后排序与顺序保持不变
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：Lindorm
      3) 数据源 A 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建 4 张数据表并各插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0007_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0007_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0007_source_01 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0007_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0007_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0007_source_02 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0007_source_03;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0007_source_03 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0007_source_03 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0007_source_04;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0007_source_04 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0007_source_04 VALUES (1, 'A');
      5) 授权数据源 B：${DataSourceB}
      6) 数据源 B 类型：Doris3.x
      7) 数据源 B 存在数据库：${SchemaB}
      8) 在 ${SchemaB} 创建 2 张数据表并各插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15889_c0007_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15889_c0007_source_01 (id BIGINT, name STRING);
         INSERT INTO ${SchemaB}.test_table_15889_c0007_source_01 VALUES (1, 'A');
         DROP TABLE IF EXISTS ${SchemaB}.test_table_15889_c0007_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaB}.test_table_15889_c0007_source_02 (id BIGINT, name STRING);
         INSERT INTO ${SchemaB}.test_table_15889_c0007_source_02 VALUES (1, 'A');
      9) 授权数据源 C：${DataSourceC}
      10) 数据源 C 类型：SparkThrift2.x
      11) 数据源 C 存在数据库：${SchemaC}
      12) 在 ${SchemaC} 创建 1 张数据表并插入 1 行数据：
          DROP TABLE IF EXISTS ${SchemaC}.test_table_15889_c0007_source_01;
          CREATE TABLE IF NOT EXISTS ${SchemaC}.test_table_15889_c0007_source_01 (id BIGINT, name STRING);
          INSERT INTO ${SchemaC}.test_table_15889_c0007_source_01 VALUES (1, 'A');
      13) 三个数据源的数据源统计模块均处于有数据状态
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 查看数据源统计区域并选择「按表数量排序」
        expected: ${DataSourceA} 位于第 1 位、${DataSourceB} 位于第 2 位、${DataSourceC} 位于第 3 位
      - action: 刷新数据地图页面
        expected: 排序条件保持「按表数量排序」，三项顺序保持不变
    tags:
      - 数据资产
      - 数据地图
      - 排序

  - case_id: C0008
    title: 验证【数据资产】-【数据地图】翻页查看 25 个数据源统计，页码与列表内容随翻页更新
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0008 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0008 VALUES (1, 'A');
      5) 数据地图数据源统计共有 25 个数据源，分页大小为 20
      6) 第 1 页包含 ${DataSourceA}，第 2 页包含 ${DataSourceB}
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 在数据源统计区域点击【下一页】
        expected: 页码变为 2，列表展示第 21 至 25 个数据源并包含 ${DataSourceB}
      - action: 点击【上一页】
        expected: 页码变为 1，列表恢复展示第 1 至 20 个数据源并包含 ${DataSourceA}
    tags:
      - 数据资产
      - 数据地图
      - 分页

  - case_id: C0009
    title: 验证【数据资产】-【数据地图】打开带表标签的数据表详情，技术属性与字段列表展示同步结果
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0009;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0009 (order_id STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15889_c0009 VALUES ('1001', 88.50), ('1002', 99.90);
      5) test_table_15889_c0009 已配置表标签「订单表」和字段标签「金额字段」
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 搜索并打开数据表「test_table_15889_c0009」详情
        expected: 详情页展示数据源 ${DataSourceA}、数据库 ${SchemaA}、表名 test_table_15889_c0009 和表标签「订单表」
      - action: 查看「技术属性」和字段列表
        expected: 技术属性展示 Lindorm 数据源类型，字段列表展示 order_id STRING、amount DECIMAL(10,2) 及字段标签「金额字段」
    tags:
      - 数据资产
      - 数据地图
      - 表详情

  - case_id: C0010
    title: 验证【数据资产】-【数据地图】新增表标签并刷新详情页，标签保留且使用次数为 1
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0010 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0010 VALUES (1, 'A');
      5) test_table_15889_c0010 当前没有表标签「订单主题」
    steps:
      - action: 进入【数据资产 → 数据地图】页面
        expected: 进入成功
      - action: 打开 test_table_15889_c0010 详情，在表标签区域新增「订单主题」并保存
        expected: Toast提示:「保存成功」，表标签区域新增「订单主题」
      - action: 刷新详情页并重新打开表标签区域
        expected: 「订单主题」仍存在，标签使用次数为 1
    tags:
      - 数据资产
      - 数据地图
      - 表标签

  - case_id: C0011
    title: 验证【元数据】-【数据目录】新增目录并刷新目录树，新目录保留在根节点
    priority: P1
    precondition: |-
      1) 数据目录树不存在目录 CatalogA
      2) 当前用户具有数据目录维护权限
    steps:
      - action: 进入【元数据 → 数据目录 → 目录管理】页面
        expected: 进入成功
      - action: 点击【新增目录】，填写目录名称「CatalogA」并保存
        expected: Toast提示:「保存成功」，目录树新增 CatalogA
      - action: 刷新目录树
        expected: CatalogA 仍位于目录树根节点，目录编号保持不变
    tags:
      - 元数据
      - 数据目录
      - 目录管理
      - 新增

  - case_id: C0012
