      5) 目录 CatalogA 存在且包含数据表 test_table_15889_c0012，目录名称 CatalogB 尚未使用
      6) 当前用户具有数据目录维护权限
    steps:
      - action: 进入【元数据 → 数据目录 → 目录管理】页面
