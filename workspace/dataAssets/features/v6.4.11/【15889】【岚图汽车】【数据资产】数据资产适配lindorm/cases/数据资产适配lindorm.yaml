        expected: Toast提示:「保存成功」，树节点名称更新为 CatalogB
      - action: 打开目录 CatalogB
        expected: 目录内容仍包含数据表 test_table_15889_c0012
    tags:
      - 元数据
      - 数据目录
      - 目录管理
      - 编辑

  - case_id: C0013
    title: 验证【元数据】-【数据目录】移动数据表至目标目录，源目录移除且目标目录新增
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0013;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0013 (id BIGINT, name STRING);
         INSERT INTO ${SchemaA}.test_table_15889_c0013 VALUES (1, 'A');
      5) 目录 CatalogA 包含数据表 test_table_15889_c0013，目录 CatalogB 已存在
      6) 当前用户具有数据目录维护权限
    steps:
      - action: 进入【元数据 → 数据目录 → 目录管理】页面
        expected: 进入成功
      - action: 将数据表 test_table_15889_c0013 移动至目录 CatalogB 并确认
        expected: Toast提示:「移动成功」，test_table_15889_c0013 从 CatalogA 移除
      - action: 打开目录 CatalogB
        expected: 目录内容包含数据表 test_table_15889_c0013
    tags:
      - 元数据
      - 数据目录
      - 目录管理
      - 移动

  - case_id: C0014
    title: 验证【元数据】-【数据目录】批量指定数据表目录，目录列与目录内容均更新
    priority: P0
