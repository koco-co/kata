    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Lindorm
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入 1 行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15889_c0012;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15889_c0012 (id BIGINT, name STRING);
