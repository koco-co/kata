meta:
  title: DBC落标检查
  requirement_id: "15522"
  case_module_id: ""
  exports:
    - DBC落标检查.xmind
cases:
  - case_id: C0001
    title: 验证【数据标准】-【落标检查结果】查看总览区域与结果列表，展示检查字段数与达标率
    priority: P1
    precondition: |-
      1) 落标检查任务「TaskG」已执行完成，关联字段数量为 4，达标字段数量为 3
      2) 任务结果包含 1 条未达标记录
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 查看落标检查总览区域
        expected: 展示检查数据表、检查字段总数 4、达标字段数 3 和标准达标率 75%
      - action: 查看结果列表
        expected: 列包含数据源、数据库、数据表、字段、检查状态、是否达标、开始时间、结束时间和操作
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0002
    title: 验证【数据标准】-【落标检查结果】勾选已达标记录导出，下载文件包含检查列表内容(已达标)
    priority: P1
    precondition: |-
      1) 落标检查结果列表存在 2 条已达标记录和 1 条未达标记录
      2) 浏览器允许下载文件
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 勾选 2 条已达标记录并点击【导出】
        expected: 弹出导出内容选择框，选项包含「检查列表内容」和「检查列表内容+不达标明细数据」
      - action: 选择「检查列表内容+不达标明细数据」并确认导出
        expected: 下载任务创建成功，下载目录新增 1 个 Excel 文件
      - action: 打开下载文件
        expected: 文件包含 2 条已达标检查记录和对应字段列，不生成额外明细文件
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0003
    title: 验证【数据标准】-【落标检查结果】未勾选记录直接导出，提示请选择导出记录(未勾选)
    priority: P1
    precondition: |-
      1) 落标检查结果列表存在可导出的记录
      2) 当前页面没有勾选记录
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 点击【导出】
        expected: Toast提示:「请选择导出记录」，未创建下载任务
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0004
    title: 验证【数据标准】-【落标检查结果】全选与取消勾选记录，已选数量同步变化(全选交互)
    priority: P2
    precondition: |-
      1) 落标检查结果列表当前页展示 20 条记录
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 点击表头全选复选框
        expected: 当前页 20 条记录全部选中，已选数量显示 20
      - action: 取消第 5 条记录的复选框
        expected: 已选数量变为 19，表头复选框显示半选状态
      - action: 再次点击表头复选框
        expected: 当前页 20 条记录全部取消选中，已选数量为 0
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0005
    title: 验证【数据标准】-【落标检查结果】按数据库表字段查询后重置，列表恢复全部结果
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建检查表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0005_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0005_source_01 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0005_source_01 VALUES (1, 10.50);
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0005_source_02;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0005_source_02 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0005_source_02 VALUES (1, 20.00);
      5) 结果列表存在数据库「${SchemaA}」、数据表「test_table_15522_c0005_source_01」、字段「amount」的记录
      6) 结果列表同时存在数据库「${SchemaA}」、数据表「test_table_15522_c0005_source_02」的记录
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 数据库输入「${SchemaA}」，数据表输入「test_table_15522_c0005_source_01」，字段输入「amount」，点击【查询】
        expected: 列表仅展示数据库 ${SchemaA}、数据表 test_table_15522_c0005_source_01、字段 amount 的匹配记录
      - action: 点击【重置】
        expected: 三个输入框清空，列表恢复展示全部结果
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0006
    title: 验证【数据标准】-【落标检查结果】按检查状态与达标状态筛选，列表仅展示匹配记录
    priority: P1
    precondition: |-
      1) 结果列表包含检查状态「检查完成」「检查失败」和达标状态「是」「否」的记录
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 在检查状态筛选中选择「检查完成」，在是否达标筛选中选择「否」
        expected: 列表仅展示检查状态为「检查完成」且是否达标为「否」的记录
      - action: 清空筛选并选择检查状态「检查失败」
        expected: 列表仅展示检查状态为「检查失败」的记录，是否达标筛选恢复全部
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0007
    title: 验证【数据标准】-【落标检查结果】点击检查开始时间排序，列表升降序切换
    priority: P2
    precondition: |-
      1) 结果列表存在开始时间分别为 2026-01-01 09:00、2026-01-02 09:00 的记录
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 点击【检查开始时间】排序
        expected: 列表按开始时间升序排列，2026-01-01 09:00 记录位于 2026-01-02 09:00 记录之前
      - action: 再次点击【检查开始时间】排序
        expected: 列表按开始时间降序排列，2026-01-02 09:00 记录位于首行
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0008
    title: 验证【数据标准】-【落标检查结果】打开任务结果详情，展示检查结果与关联标准信息
    priority: P1
    precondition: |-
      1) 结果列表存在任务「TaskD」的未达标记录
      2) 关联标准「StandardC」存在版本 2
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 点击任务「TaskD」记录的【查看详情】
        expected: 打开结果详情，展示数据源、数据库、数据表、字段和检查项
      - action: 查看检查结果区域
        expected: 展示是否达标、检查开始时间、检查结束时间和【查看日志】【查看明细】操作
      - action: 查看关联标准区域
        expected: 展示标准名称「StandardC」、标准版本 2 和版本变更记录入口
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0009
    title: 验证【数据标准】-【落标检查】打开任务详情，字段列表与结果总览分页展示(25个字段)
    priority: P1
    precondition: |-
      1) 落标检查任务「TaskH」关联 25 个检查字段
      2) 任务已生成 25 条检查结果
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 打开任务「TaskH」详情
        expected: 检查字段列表和检查结果总览区域均展示分页组件，第一页显示 20 条
      - action: 点击字段列表【下一页】
        expected: 字段列表切换至第二页，展示剩余 5 条字段
      - action: 点击结果总览【下一页】
        expected: 结果总览切换至第二页，展示剩余 5 条结果
    tags:
      - 数据标准
      - 落标检查
      - 任务详情
      - 分页

  - case_id: C0010
    title: 验证【数据标准】-【落标检查】新增检查任务扫描动态分区，检查记录含前一日与当日分区(分区扫描)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并插入前一日和当日数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0010 (id BIGINT, amount DECIMAL(10,2), dt DATE) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15522_c0010 SELECT id, CAST(id AS DECIMAL(10,2)), DATE_SUB(CURRENT_DATE(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15522_c0010 SELECT id, CAST(id + 3 AS DECIMAL(10,2)), CURRENT_DATE() FROM range(4, 7);
      5) 标准「StandardB」已映射 amount 字段并要求 amount 大于 0
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}.test_table_15522_c0010，选择前一日和当日分区
        expected: 分区选择控件展示两个动态日期分区
      - action: 选择 amount 字段和StandardB，点击【新增并立即执行】
        expected: Toast提示:「新增成功」，任务状态为「检查中」
      - action: 打开检查结果
        expected: 检查记录数为 6，结果包含前一日和当日分区，未读取其他分区
    tags:
      - 数据标准
      - 落标检查
      - 分区扫描

  - case_id: C0011
    title: 验证【数据标准】-【落标检查】新增检查任务设置检查项，任务进入检查中(全部检查项)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入检查表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0011;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0011 (amount DECIMAL(10,2), order_id STRING);
         INSERT INTO ${SchemaA}.test_table_15522_c0011 VALUES (10.50, 'O001'), (20.00, 'O002');
      5) 标准「StandardA」已映射 amount、order_id
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}、test_table_15522_c0011 和标准「StandardA」
        expected: 检查字段列表展示 amount、order_id
      - action: 选择 amount、order_id，检查项设置为「全部」并点击【下一步】
        expected: amount 展示空值数、重复数、取值范围，order_id 展示空值数、重复数
      - action: 点击【新增并立即执行】
        expected: 任务状态为「检查中」，检查字段数为 2
    tags:
      - 数据标准
      - 落标检查
      - 检查项

  - case_id: C0012
    title: 验证【数据标准】-【落标检查】新增检查任务不选字段，检查字段置红且无法下一步(必填校验)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建检查表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0012;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0012 (amount DECIMAL(10,2), order_id STRING);
         INSERT INTO ${SchemaA}.test_table_15522_c0012 VALUES (10.50, 'O001');
      5) 标准「StandardA」已上线
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增检查任务，选择 ${DataSourceA}、${SchemaA}、test_table_15522_c0012 和标准「StandardA」，不选择字段并点击【下一步】
        expected: 「检查字段」置红提示「请选择检查字段」，页面停留在字段选择步骤
    tags:
      - 数据标准
      - 落标检查
      - 必填校验

  - case_id: C0013
    title: 验证【数据标准】-【落标检查结果】查看脏数据明细，空值字段标红且展示记录(空值)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入含空值的检查表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0013;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0013 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0013 VALUES (1, NULL), (2, NULL), (3, 10.00);
      5) 标准「StandardD」已映射 amount，要求 amount 非空
      6) 任务「TaskB」已执行完成，amount 空值数为 2
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 搜索任务「TaskB」并点击 amount 检查项【查看详情】
        expected: 打开脏数据明细，字段 amount 标红
      - action: 查看明细表格
        expected: 表格展示 2 条记录，包含数据源、数据库、数据表、字段、原始值和检查项
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0014
    title: 验证【数据标准】-【落标检查结果】查看达标结果详情，操作列无明细入口且异常明细为0(已达标)
    priority: P1
    precondition: |-
      1) 任务「TaskA」已执行完成，所有检查项是否达标为「是」
      2) 结果列表包含任务「TaskA」记录
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 搜索「TaskA」并查看操作列
        expected: 记录是否达标为「是」，操作列不展示【查看明细】入口
      - action: 打开结果详情
        expected: 检查结果区域展示达标状态和 0 条异常明细
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0015
    title: 验证【数据标准】-【落标检查结果】查看失败记录日志，弹窗展示失败原因且关闭后状态保持(检查失败)
    priority: P1
    precondition: |-
      1) 任务「TaskF」存在 1 条检查失败记录
      2) 该记录具备【查看日志】入口
    steps:
      - action: 进入【数据标准 → 落标检查结果】页面
        expected: 进入成功
      - action: 打开任务「TaskF」结果详情并点击【查看日志】
        expected: 日志弹窗展示任务名称、数据表、检查项、SQL 片段、开始时间、结束时间和失败原因
      - action: 关闭日志弹窗
        expected: 返回结果详情页，当前筛选和分页位置保持不变
    tags:
      ["数据标准", "落标检查结果"]
  - case_id: C0016
    title: 验证【数据标准】-【落标检查】新增检查任务设置每天调度，任务检查中并生成执行记录(每天调度)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入检查表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0016;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0016 (id BIGINT, order_id STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0016 SELECT id, CONCAT('O', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)) FROM range(1, 4);
      5) 标准「StandardA」已映射 order_id、amount
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增任务，选择 ${DataSourceA}、${SchemaA}、test_table_15522_c0016 和标准「StandardA」，选择 order_id、amount
        expected: 任务配置展示 2 个检查字段
      - action: 调度周期选择「每天」，点击【新增并立即执行】
        expected: Toast提示:「新增成功」，任务状态为「检查中」，调度周期显示每天
      - action: 查看任务执行记录
        expected: 新增 1 条执行记录，记录包含开始时间、结束时间和检查状态
    tags:
      - 数据标准
      - 落标检查
      - 调度

  - case_id: C0017
    title: 验证【数据标准】-【落标检查】新增检查任务选择字段，未映射字段不可选(标准映射)
    priority: P1
    precondition: |-
      1) 标准「StandardA」仅映射 order_id、amount
      2) 数据表 order_info 还存在未映射字段 customer_name
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 新增任务并选择标准「StandardA」和数据表 order_info
        expected: 检查字段列表展示 order_id、amount，不展示 customer_name
      - action: 选择 order_id 和 amount
        expected: 两个字段均加入检查字段列表，未映射字段保持不可选
    tags:
      ["数据标准", "落标检查"]
  - case_id: C0018
    title: 验证【数据标准】-【落标检查】编辑检查任务修改周期与字段，保存后任务列表同步更新
    priority: P1
    precondition: |-
      1) 任务「TaskE」已存在，当前周期为每天，检查字段为 amount
      2) 标准「StandardA」已映射 order_id、amount
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
      - action: 打开任务「TaskE」并点击【编辑】
        expected: 编辑页回显每天周期和 amount 检查字段
      - action: 将周期改为每周，增加 order_id 字段，点击【保存】
        expected: Toast提示:「保存成功」，任务列表周期为每周，检查字段数为 2
      - action: 重新打开任务详情
        expected: 周期仍为每周，检查字段为 amount、order_id
    tags:
      - 数据标准
      - 落标检查
      - 编辑

  - case_id: C0019
    title: 验证【数据标准】-【落标检查】删除检查任务，任务列表不再展示且无检查结果(删除)
    priority: P1
    precondition: |-
      1) 任务「TaskC」已创建但从未执行
      2) 使用数据标准管理员账号进入数据资产平台，账号具备落标检查任务删除权限
    steps:
      - action: 进入【数据标准 → 落标检查】页面
        expected: 进入成功
