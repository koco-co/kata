  - case_id: C0006
    title: 验证【标准管理】-【落标检查】-【落标检查结果】页面交互
    priority: P1
    steps:
      - action: 进入【资产】-【数据标准】-【标准管理】-【标准定义】页面
        expected: 进入成功
      - action: 切换到【落标检查结果】
        expected: 切换成功
      - action: 输入数据库全称
        expected: 成功输入
      - action: 点击 [查询] 按钮
        expected: 展示数据库名称包含搜索内容的所有落标任务记录
      - action: 输入数据库名称部分
        expected: 成功输入
      - action: 点击 [查询] 按钮
        expected: 展示数据库名称包含搜索内容的所有落标任务记录
      - action: 输入数据表全称
        expected: 成功输入
      - action: 点击 [查询] 按钮
        expected: 展示数据表名称包含搜索内容的所有落标任务记录
      - action: 输入数据表名称部分
        expected: 成功输入
      - action: 点击 [查询] 按钮
        expected: 展示数据表名称包含搜索内容的所有落标任务记录
      - action: 输入字段全称
        expected: 成功输入
      - action: 点击 [查询] 按钮
        expected: 展示使用了名称包含查询内容的字段的所有落标任务记录
      - action: 输入字段名称部分
        expected: 成功输入
      - action: 点击 [查询] 按钮
        expected: 展示使用了名称包含查询内容的字段的所有落标任务记录
      - action: 在数据库/数据表/字段输入框中输入内容，点击 [重置] 按钮
        expected: 所有输入框重置为默认状态
      - action: 组合编辑 [数据库/数据表/字段] 内容，点击 [查询] 按钮
        expected: 展示使用了名称包含 [数据库/数据表/字段] 的所有落标任务记录
      - action: 点击 [导出] 按钮
        expected: 弹出导出选择框，支持选择“检查列表内容/检查列表内容+不达标明细数据”
      - action: 点击 [勾选框] （单选/全选）
        expected: 全选勾选框成功勾选当前页所有字段，单选勾选框成功勾选选定字段
      - action: 点击 [检查状态] 筛选按钮，选择筛选项
        expected: 支持多选，且在选择了筛选项后，更新【落标检查结果】列表，根据筛选项展示对应落标检查结果
      - action: 点击 [是否达标] 筛选按钮，选择筛选项
        expected: 支持多选，且在选择了筛选项后，更新【落标检查结果】列表，根据筛选项展示对应落标检查结果
      - action: 点击 [检查开始时间] 排序按钮
        expected: 支持按照正序/倒序排列，更新【落标检查结果】列表，根据排序结果展示对应落标检查结果
      - action: 点击 [检查结束时间] 排序按钮
        expected: 支持按照正序/倒序排列，更新【落标检查结果】列表，根据排序结果展示对应落标检查结果
      - action: 组合[所属数据源][所属数据库][检查周期][检查状态][检查开始时间][检查结束时间] 筛选按钮，选择筛选项
        expected: 在选择了筛选项后，更新【落标检查结果】列表，根据组合筛选项展示对应落标检查任务
      - action: 点击 [操作] 列中的 [查询详情] 按钮
        expected: 弹出对应的落标任务结果详情页面
      - action: 点击 [上一页]
        expected: 切换 [落标检查结果] 至上一分页内容，当当前页数为1时无点击动作且鼠标悬浮无变化
      - action: 点击 [下一页]
        expected: 切换 [落标检查结果] 至下一分页内容，当当前页数为最后一页时无点击动作且鼠标悬浮无变化
      - action: 点击 [页码]
        expected: 切换 [落标检查结果] 至选定页码的分页内容
      - action: 点击 [显示条数/页]
        expected: 切换20条/页;50条/页;100条/页
    precondition: 无
    tags:
      - 【数据标准】-【标准管理】新增【落标检查】版块
      - 未分类
