  - case_id: C0012
    title: 验证【标准管理】-【落标检查】-【落标检查任务】-【编辑检查任务】-【检查范围】页面交互
    priority: P1
    steps:
      - action: 进入【资产】-【数据标准】-【标准管理】-【落标检查】页面
        expected: 进入成功
      - action: 定位到测试用任务 【test】，点击 [编辑] 按钮
        expected: 进入[检查范围]配置页面
      - action: 点击[选择数据源]下拉框
        expected: 不可编辑
      - action: 点击[数据库]下拉框
        expected: 不可编辑
      - action: 点击[数据表]下拉框
        expected: 不可编辑
      - action: 点击切换[选择分区]单选框
        expected: 当选择到选择已有分区/选择动态分区/手动输入分区时，下方联动出现对应填写内容
      - action: 填写选择分区内容
        expected: 展示树形标准目录，支持多选
      - action: 点击[标准目录]下拉框
        expected: 测试用标准按层级格式填充进选择框
      - action: 选择测试用标准
        expected: 展示所有车系/车型
      - action: 点击[车型关联字段]下拉框
        expected: 所选车型填充进选择框
      - action: 选择测试用车型
        expected: 返回【标准管理】-【落标检查】-【落标检查任务】页面，不生成任务
      - action: 点击 [取消] 按钮
        expected: 进入[选择字段]配置页面
      - action: 点击 [下一步] 按钮
        expected: 逻辑：字段列表为已经存在绑定了标准的字段列表，若字段无标准绑定，不展示在列表中。针对后续新增绑定标准的字段，是否开启检查默认为不开启，需要在编辑任务的时候开启后才可进行落标检查。
