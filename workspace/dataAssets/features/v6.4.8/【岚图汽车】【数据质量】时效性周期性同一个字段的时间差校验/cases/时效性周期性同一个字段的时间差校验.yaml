meta:
  title: 时效性周期性同一个字段的时间差校验
  case_module_id: ""
  requirement_id: "10181"
  exports:
    - 时效性周期性同一个字段的时间差校验.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则集管理】配置单字段时间差校验规则并执行，实例不达标且明细展示间隔 90 秒
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0001 (id BIGINT, event_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10181_c0001 VALUES (1, TIMESTAMP '2026-08-01 08:00:00'), (2, TIMESTAMP '2026-08-01 08:00:30'), (3, TIMESTAMP '2026-08-01 08:02:00');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_10181_c0001
          规则集描述：空
          添加单字段时间差校验：字段和排序字段选择 event_time，阈值 <= 60 秒，保存并立即执行
        expected: Toast提示:「保存成功」，规则实例状态为「不达标」，失败记录数为 1
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 最新实例状态为「不达标」
      - action: 打开实例详情
        expected: 明细展示 id=3，event_time 与前一条记录相差 90 秒
    tags:
      - 数据质量
      - 规则集管理
      - 单字段时间差
      - 异常明细

  - case_id: C0002
    title: 验证【数据质量】-【规则集管理】配置单字段时间差校验规则并执行，实例达标且表级报告展示记录数与报警数
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0002 (id BIGINT, event_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10181_c0002 VALUES (1, TIMESTAMP '2026-08-01 08:00:00'), (2, TIMESTAMP '2026-08-01 08:00:30'), (3, TIMESTAMP '2026-08-01 08:01:00');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetB
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_10181_c0002
          规则集描述：空
          添加单字段时间差校验：字段和排序字段选择 event_time，阈值 <= 60 秒，保存并立即执行
        expected: Toast提示:「保存成功」，规则实例状态为「达标」，失败记录数为 0
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 最新实例状态为「达标」
      - action: 打开实例详情
        expected: 表级报告展示记录数 3、报警数 0，规则结果为「达标」
    tags:
      - 数据质量
      - 规则集管理
      - 单字段时间差
      - 达标结果

  - case_id: C0003
    title: 验证【数据质量】-【规则集管理】执行单字段时间差校验，实例失败且日志提示转换错误(时间值字段 = 含非法值)
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0003 (id BIGINT, event_time_text STRING);
         INSERT INTO ${SchemaA}.test_table_10181_c0003 VALUES (1, '2026-08-01 08:00:00'), (2, 'invalid-time');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetC
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_10181_c0003
          规则集描述：空
          添加单字段时间差校验：字段和排序字段选择 event_time_text，阈值 = 1 秒，保存并立即执行
        expected: 规则实例状态为「失败」
      - action: 打开执行日志
        expected: 日志包含 event_time_text 值 invalid-time 无法转换为时间戳
    tags:
      - 数据质量
      - 规则集管理
      - 单字段时间差
      - 执行日志

  - case_id: C0004
    title: 验证【数据质量】-【规则集管理】以多种时间格式字段配置单字段时间差校验，实例均达标且报告展示间隔 2 秒
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0004 (id BIGINT, standard_time STRING, millis_time STRING, compact_time STRING, slash_time STRING);
         INSERT INTO ${SchemaA}.test_table_10181_c0004 VALUES (1, '2026-08-01 08:00:00', '1722470400000', '20260801080000', '2026/08/01 08:00:00'), (2, '2026-08-01 08:00:02', '1722470402000', '20260801080002', '2026/08/01 08:00:02');
      5) 规则集「${RuleSetA}」已选择 test_table_10181_c0004 与单字段时间差校验
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「${RuleSetA}」，分别以 standard_time、millis_time、compact_time、slash_time 新建单字段时间差规则，阈值 >= 1 秒，保存并立即执行
        expected: 四条规则实例状态均为「达标」
      - action: 打开任一规则详情
        expected: 报告展示解析后的时间值和相邻间隔 2 秒
    tags:
      - 数据质量
      - 规则集管理
      - 单字段时间差
      - 时间格式

  - case_id: C0005
    title: 验证【数据质量】-【规则集管理】查看单字段时间差校验排序字段选择器，仅时间类型字段可选
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0005 (id BIGINT, event_date DATE, event_time TIMESTAMP, amount DECIMAL(10,2), enabled BOOLEAN);
         INSERT INTO ${SchemaA}.test_table_10181_c0005 VALUES (1, DATE '2026-08-01', TIMESTAMP '2026-08-01 08:00:00', 10.50, TRUE), (2, DATE '2026-08-02', TIMESTAMP '2026-08-02 08:00:00', 20.00, FALSE);
      5) 规则集「${RuleSetA}」已选择 test_table_10181_c0005 与单字段时间差校验
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「${RuleSetA}」并展开单字段时间差校验的排序字段选择器
        expected: 可选字段包含 event_date、event_time，不包含 amount、enabled
      - action: 选择 event_time
        expected: 排序字段显示 event_time，时间差输入区域可用
    tags:
      - 数据质量
      - 规则集管理
      - 单字段时间差
      - 字段类型

  - case_id: C0006
    title: 验证【数据质量】-【规则集管理】输入非正整数时间差，输入框置红且保存按钮禁用
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0006 (id BIGINT, event_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10181_c0006 VALUES (1, TIMESTAMP '2026-08-01 08:00:00'), (2, TIMESTAMP '2026-08-01 08:00:30');
      5) 规则集「${RuleSetA}」已选择 test_table_10181_c0006 与单字段时间差校验
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「${RuleSetA}」，选择 event_time，在时间差输入框依次填写 0、-1、1.5 并点击【保存】
        expected: 输入框置红提示「请输入正整数」，「保存」按钮禁用
      - action: 填写 1 并选择单位「秒」
        expected: 红色提示消失，时间差显示 1 秒
    tags:
      - 数据质量
      - 规则集管理
      - 单字段时间差
      - 表单校验

  - case_id: C0007
    title: 验证【数据质量】-【规则集管理】保存时间差配置并重新打开详情，运算符阈值与单位保持原值
    priority: P2
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0007 (id BIGINT, event_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10181_c0007 VALUES (1, TIMESTAMP '2026-08-01 08:00:00'), (2, TIMESTAMP '2026-08-01 08:00:30');
      5) 规则集「${RuleSetA}」已选择 test_table_10181_c0007 与单字段时间差校验
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「${RuleSetA}」，选择 event_time，填写 60，依次选择运算符 <= 和时间单位 秒并保存
        expected: Toast提示:「保存成功」，规则详情显示时间差 <= 60 秒
      - action: 重新打开规则详情
        expected: 运算符、数值和时间单位仍为 <=、60、秒
    tags:
      - 数据质量
      - 规则集管理
      - 单字段时间差
      - 配置持久化

  - case_id: C0008
    title: 验证【数据质量】-【校验结果查询】下载单字段时间差校验失败明细，文件含失败记录与实际时间差
    priority: P2
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 4 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10181_c0008;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10181_c0008 (id BIGINT, event_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10181_c0008 VALUES (1, TIMESTAMP '2026-08-01 08:00:00'), (2, TIMESTAMP '2026-08-01 08:00:30'), (3, TIMESTAMP '2026-08-01 08:02:00'), (4, TIMESTAMP '2026-08-01 08:04:00');
      5) 规则任务「${TaskA}」已执行单字段时间差校验（字段与排序字段 event_time，阈值 <= 60 秒），结果为「不达标」，失败记录数为 2
    steps:
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 进入成功
      - action: 打开任务「${TaskA}」的【查看明细】
        expected: 明细展示 id=3、id=4 两条记录，event_time 字段标红
      - action: 点击【下载明细】并打开文件
        expected: 文件包含 id=3、id=4、event_time 和各自的实际时间差
    tags:
      - 数据质量
      - 校验结果查询
      - 失败明细
      - 下载
