      - action: 检查调度配置信息
        expected: "新增配置: 环境参数配置"
      - action: 点击【环境参数配置】
        expected: 进入【环境参数配置】页面, 可进行编辑
      - action: 取消/确定
        expected: 配置页面关闭 / 配置内容保存成功
    precondition: 无
    tags:
      - 规则任务管理
      - 未分类
