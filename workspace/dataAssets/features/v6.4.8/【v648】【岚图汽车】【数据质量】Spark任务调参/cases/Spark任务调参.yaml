      - action: 进入规则任务详情, 点击「环境参数」
        expected: 进入「配置环境参数」界面, 配置参数回显正确
      - action: 设置spark.executor.cores=3 后保存
        expected: 修改成功, 配置参数回显正确
    precondition: 无
    tags:
      - 规则任务管理
      - 未分类
  - case_id: C0014
    title: 验证调度属性新增环境参数配置(SparkThrift2.x)
    priority: P1
    steps:
      - action: 进入【数据资产】-【数据质量】-【规则任务管理】页面
