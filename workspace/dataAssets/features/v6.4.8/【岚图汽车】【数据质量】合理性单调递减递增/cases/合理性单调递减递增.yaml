      - action: 点击【新建监控规则】，「规则名称」输入「${RuleA}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0005
        expected: 监控对象配置成功
      - action: 添加「合理性校验」规则，字段选择「id」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col1」，「校验方法」选择「单调递增」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 规则保存成功
      - action: 添加「合理性校验」规则，字段选择「id」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col2」，「校验方法」选择「单调递增」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 规则保存成功
      - action: |-
          配置调度属性：
          * 调度周期：小时
          生效日期：2025-11-20～2025-11-20
          间隔时间：1 小时
          开始时间-结束时间：00:00:00～15:00:00
          规则拼接包：1
          资源组：default
          超时时间：不限制
          告警方式：无
          无需生成报告：勾选
          报告名称：空
          保存规则
        expected: 规则保存成功
      - action: 立即运行规则任务，查看结果
        expected: 两条规则校验都不通过，实例状态为校验异常
      - action: 查看明细
        expected: 明细分别展示按 col1、col2 排序后违反单调递增的记录（col1 下 id=100.50 回落，col2 下 id=9999.99 后回落至 50.00）
    tags:
      - 数据质量
      - 规则任务管理
      - decimal 类型
  - case_id: C0006
    title: 验证【数据质量】-【规则任务管理】合理性校验字段与排序字段为 double/double precision 类型并运行，col1 规则通过且 col2 校验不通过
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006 (id DOUBLE, col1 DOUBLE PRECISION, col2 DOUBLE);
         INSERT INTO ${SchemaA}.test_table_none_c0006 VALUES (1.5, 3.141592653589793, 2.718281828459045), (2.25, 1.414213562373095, 1.618033988749895), (100.0, 0.000000001, 999999999.999999);
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，「规则名称」输入「${RuleA}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0006
        expected: 监控对象配置成功
      - action: 添加「合理性校验」规则，字段选择「id」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col1」，「校验方法」选择「单调递减」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 规则保存成功
      - action: 添加「合理性校验」规则，字段选择「id」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col2」，「校验方法」选择「单调递减」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 规则保存成功
      - action: |-
          配置调度属性：
          * 调度周期：小时
          生效日期：2025-11-20～2025-11-20
          间隔时间：1 小时
          开始时间-结束时间：00:00:00～15:00:00
          规则拼接包：1
          资源组：default
          超时时间：不限制
          告警方式：无
          无需生成报告：勾选
          报告名称：空
          保存规则
        expected: 规则保存成功
      - action: 立即运行规则任务，查看结果
        expected: 排序字段 col1 的规则校验结果为「通过」，排序字段 col2 的规则校验结果为「不通过」，实例状态为校验异常
      - action: 查看明细
        expected: 明细展示排序字段 col2 下违反单调递减的记录（id=100.0 的 col2 由 2.718281828459045 突增至 999999999.999999）
    tags:
      - 数据质量
      - 规则任务管理
      - double 类型
