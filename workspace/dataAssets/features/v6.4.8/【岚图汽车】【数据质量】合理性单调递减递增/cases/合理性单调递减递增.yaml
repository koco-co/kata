         INSERT INTO ${SchemaA}.test_table_none_c0005 SELECT CASE id WHEN 1 THEN -25.50 WHEN 2 THEN 0.00 WHEN 3 THEN 50.00 WHEN 4 THEN 123.45 WHEN 5 THEN 100.50 ELSE 9999.99 END, CASE id WHEN 1 THEN -30.75 WHEN 2 THEN 0.00 WHEN 3 THEN 75.25 WHEN 4 THEN 200.75 WHEN 5 THEN 456.78 ELSE 8888.88 END, CASE id WHEN 1 THEN -2.5000 WHEN 2 THEN 0.0000 WHEN 3 THEN 1.6180 WHEN 4 THEN 9.8765 WHEN 5 THEN 3.1416 ELSE 0.1234 END FROM range(1, 7);
    steps:
