meta:
  title: 合理性单调递减递增
  feature_id: quality-monotonic-trend-rules
  project_id: data-assets
  requirement_id: "none"
  case_module_id: ""
  exports:
    - 合理性单调递减递增.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则任务管理】配置合理性校验排序字段为 datetime 类型并运行，运行失败且提示排序字段类型不支持
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001 (id INT, col1 DATETIME, col2 STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0001 VALUES (1, '2025-11-20 10:00:00', 'A'), (2, '2025-11-20 11:00:00', 'B'), (3, '2025-11-20 12:00:00', 'C');
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，「规则名称」输入「${RuleA}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0001
        expected: 监控对象配置成功
      - action: 添加「合理性校验」规则，字段选择「id」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col1」，「校验方法」选择「单调递增」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 规则保存成功
      - action: 运行规则任务，查看结果
        expected: 运行失败，提示「排序字段类型不支持，仅支持数值型或 string 类型」
    tags:
      - 数据质量
      - 规则任务管理
      - 字段类型限制
  - case_id: C0002
    title: 验证【数据质量】-【规则任务管理】合理性校验字段选择 datetime 类型并保存，保存失败且提示仅支持数值型或 string 类型
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002 (id INT, create_time DATETIME, col1 BIGINT, col2 STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0002 VALUES (1, '2025-11-20 10:00:00', 10, 'A'), (2, '2025-11-20 11:00:00', 20, 'B'), (3, '2025-11-20 12:00:00', 30, 'C');
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，「规则名称」输入「${RuleA}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0002
        expected: 监控对象配置成功
      - action: 添加「合理性校验」规则，字段选择「create_time」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col1」，「校验方法」选择「单调递增」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 保存失败，提示「字段类型仅支持 TINYINT、SMALLINT、MEDIUMINT、INT/INTEGER、BIGINT、FLOAT、DOUBLE/DOUBLE PRECISION、DECIMAL/NUMERIC 类型」
    tags:
      - 数据质量
      - 规则任务管理
      - 字段类型限制
  - case_id: C0003
    title: 验证【数据质量】-【规则任务管理】合理性校验字段与排序字段为 string 且值包含非数字并运行，运行失败且提示字符强转 double 类型失败
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (id STRING, col1 STRING, col2 STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0003 SELECT CASE id WHEN 1 THEN 'fas' WHEN 2 THEN '哈哈哈' WHEN 3 THEN '#@¥' WHEN 4 THEN '4' WHEN 5 THEN 'a' ELSE CAST(id AS STRING) END, CAST(id * 10 AS STRING), CAST(id * 10 AS STRING) FROM range(1, 11);
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，「规则名称」输入「${RuleA}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0003
        expected: 监控对象配置成功
      - action: 添加「合理性校验」规则，字段选择「id」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col1」，「校验方法」选择「单调递增」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 规则保存成功
      - action: |-
          配置调度属性：
          * 调度周期：小时
          生效日期：2025-11-20～2025-11-20
          间隔时间：1 小时
          开始时间-结束时间：00:00:00～15:00:00
          规则拼接包：1
          资源组：default
          超时时间：不限制
          告警方式：无
          无需生成报告：勾选
          报告名称：空
          保存规则
        expected: 规则保存成功
      - action: 立即运行规则任务，查看结果
        expected: 运行失败，报错「字符强转 double 类型失败」
      - action: 编辑规则，调换校验字段和排序字段，再次运行
        expected: 运行失败，报错「字符强转 double 类型失败」
    tags:
      - 数据质量
      - 规则任务管理
      - 字段类型限制
  - case_id: C0004
    title: 验证【数据质量】-【规则任务管理】合理性校验字段与排序字段为 string 且值均为数字并运行，校验不通过且明细展示 id=5 记录
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004 (id STRING, col1 STRING, col2 STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0004 SELECT CAST(id AS STRING), CAST(CASE WHEN id = 5 THEN 60 WHEN id = 6 THEN 50 ELSE id * 10 END AS STRING), CAST(CASE WHEN id = 5 THEN 60 WHEN id = 6 THEN 50 ELSE id * 10 END AS STRING) FROM range(1, 11);
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，「规则名称」输入「${RuleA}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0004
        expected: 监控对象配置成功
      - action: 添加「合理性校验」规则，字段选择「id」，「统计函数」选择「数据变化趋势」，「选择排序字段」选择「col1」，「校验方法」选择「单调递增」，「强弱规则」选择「弱规则」，「规则描述」输入「合理性校验测试」，点击保存
        expected: 规则保存成功
      - action: |-
          配置调度属性：
          * 调度周期：小时
          生效日期：2025-11-20～2025-11-20
          间隔时间：1 小时
          开始时间-结束时间：00:00:00～15:00:00
          规则拼接包：1
          资源组：default
          超时时间：不限制
          告警方式：无
          无需生成报告：勾选
          报告名称：空
          保存规则
        expected: 规则保存成功
      - action: 立即运行规则任务，查看结果
        expected: 校验不通过
      - action: 查看明细
        expected: 明细展示 id=5 的数据，该记录按 col1 排序后 id 由 6 回落为 5，违反单调递增
    tags:
      - 数据质量
      - 规则任务管理
      - string 类型
  - case_id: C0005
    title: 验证【数据质量】-【规则任务管理】合理性校验字段与排序字段为 decimal/numeric 类型并运行，校验不通过且明细展示违反单调递增记录
