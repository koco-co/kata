  - case_id: C0003
    title: 验证【数据质量】-【质量报告】新增多表报告并选择全部任务，报告展示三个任务对应的表级报告
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建 2 张数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003_source;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003_source (id INT, age STRING, name STRING, score STRING, sex STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0003_source VALUES (1, '11', '林大', '100', '男'), (2, '12', '王二', '99', '男'), (3, '13', '张三', '99', '男'), (4, '14', '李四', '100', '女');
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003_target;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003_target (id INT, age STRING, name STRING, score STRING, sex STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0003_target VALUES (1, '11', '林大', '100', '男'), (2, '12', '王二', '99', '男'), (3, '13', '张三', '99', '男'), (4, '14', '李四', '100', '女');
      5) 数据表 test_table_none_c0003_source 已配置规则集「${RuleSetA}」，规则包 1 包含「自定义 SQL：SELECT * FROM ${SchemaA}.test_table_none_c0003_source，期望值固定值大于 2，弱规则」「有效性校验：字段 id-取值范围，期望值大于 3，弱规则」
      6) 已存在规则任务「${TaskA}」「${TaskB}」监控对象为 test_table_none_c0003_source，「${TaskC}」监控对象为 test_table_none_c0003_target
    steps:
      - action: 进入【数据质量 → 质量报告】页面
        expected: 进入成功
      - action: 点击【新增报告】，「报告名称」填写「${ReportA}」，关联表选择 ${SchemaA}.test_table_none_c0003_source、${SchemaA}.test_table_none_c0003_target
        expected: 新增「选择任务」字段
      - action: 「选择任务」选择「全部」，点击【确定】
        expected: Toast 提示「保存成功」
      - action: 查看报告内容
        expected: 展示「${TaskA}」「${TaskB}」「${TaskC}」对应的表级报告
    tags:
      - 数据质量
      - 质量报告
      - 新增报告
