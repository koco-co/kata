  - case_id: C0011
    title: 验证【数据质量】-【规则任务管理】同一张表创建两个不同任务并运行，质量报告分别展示各自规则结果
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0011;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0011 (id INT, age STRING, name STRING, score STRING, sex STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0011 VALUES (1, '11', '林大', '100', '男'), (2, '12', '王二', '99', '男'), (3, '13', '张三', '99', '男'), (4, '14', '李四', '100', '女');
      5) 已配置规则集「${RuleSetA}」，规则包 1 包含「完整性校验-字段级-字段取值范围校验-期望值 > 5-弱规则」
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，「规则名称」输入「${RuleA}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0011
        expected: 监控对象配置成功
      - action: 「监控规则」配置「完整性校验」：「规则类型」选择「字段级」，「字段」选择「id」，「统计函数」选择「字段取值范围校验」，「过滤条件」输入「id < 100」，「期望值」选择「>5」，「强弱规则」选择「弱规则」，「规则描述」输入「测试规则」
        expected: 监控规则配置完成，与前置「规则包 1-完整性校验」内容一致
      - action: 「调度属性」配置：「调度周期」选择「小时」，「生效日期」为「2025-11-20～2025-11-20」，「间隔时间」为「1 小时」，「开始时间-结束时间」为「00:00:00～15:00:00」，「规则拼接包」为「1」，「资源组」选择「default」，不勾选「无需生成报告」，查看报告名称
        expected: 报告名称为「${ReportA}」
      - action: 保存规则并再次点击【新建监控规则】，「规则名称」输入「${RuleB}」，配置「唯一性校验」：「字段」选择「id」，「统计函数」选择「重复值检测-重复数」，「期望值」选择「<0」，「过滤条件」输入「id < 100」，其他内容与上一任务保持一致，保存规则
        expected: 规则保存成功，报告名称为「${ReportB}」
      - action: 分别运行两个任务，查看质量报告结果
        expected: 质量报告分别展示「${RuleA}」「${RuleB}」的规则结果，与各自期望值判断一致，无相互串扰
    tags:
      - 数据质量
      - 规则任务管理
      - 多任务
