meta:
  title: 一个数据表支持创建多个质量规则任务
  requirement_id: "none"
  case_module_id: ""
  exports:
    - 一个数据表支持创建2 个质量规则任务.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【质量报告】查看历史质量报告质量评估汇总名称，名称展示为表名和任务名拼接
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001 (id INT, age STRING, name STRING, score STRING, sex STRING);
         INSERT INTO ${SchemaA}.test_table_none_c0001 VALUES (1, '11', '林大', '100', '男'), (2, '12', '王二', '99', '男'), (3, '13', '张三', '99', '男'), (4, '14', '李四', '100', '女');
      5) 已存在 ${SchemaA}.test_table_none_c0001 的 1 个规则任务「${TaskA}」，报告名称为「${ReportA}」
    steps:
      - action: 进入【数据质量 → 质量报告】页面
        expected: 进入成功
      - action: 查看 test_table_none_c0001 的质量报告
        expected: 报告列表展示「${ReportA}」
      - action: 查看报告内质量评估汇总后的名称
        expected: 展示表名_任务名称，即「test_table_none_c0001_${TaskA}」
    tags:
      - 数据质量
      - 质量报告
      - 报告命名
