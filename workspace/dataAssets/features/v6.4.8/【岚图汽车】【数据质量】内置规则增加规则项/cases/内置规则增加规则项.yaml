meta:
  title: 内置规则增加规则项
  case_module_id: ""
  requirement_id: "15531"
  exports:
    - 内置规则增加规则项.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则库配置】查看规则分类，列表展示新增内置规则及关联范围
    priority: P0
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 查看规则分类「时效性校验」
        expected: 列表展示「${RuleA}」和「${RuleB}」，关联范围均为「字段」
      - action: 查看规则分类「合理性校验」
        expected: 列表展示「${RuleC}」，关联范围为「字段」
    tags:
      - 数据质量
      - 规则库配置
      - 内置规则

  - case_id: C0002
    title: 验证【数据质量】-【规则库配置】导出规则库，下载文件包含新增规则信息
    priority: P1
    precondition: |-
      1) 规则库存在「${RuleA}」「${RuleB}」「${RuleC}」三条启用内置规则
      2) 浏览器下载目录可写
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 点击【导出规则库】并确认下载
        expected: 下载 1 个规则库文件，文件名包含规则库导出标识
      - action: 打开下载文件
        expected: 文件包含三条新增规则的名称、分类、关联范围和规则描述
    tags:
      - 数据质量
      - 规则库配置
      - 导出

  - case_id: C0003
    title: 验证【数据质量】-【规则库配置】按分类筛选规则后重置，列表恢复展示全部规则
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 规则分类选择「时效性校验」并点击【查询】
        expected: 列表仅展示分类为「时效性校验」的规则，包含「${RuleA}」和「${RuleB}」
      - action: 点击【重置】
        expected: 规则分类清空，列表恢复展示全部规则分类
    tags:
      - 数据质量
      - 规则库配置
      - 筛选

  - case_id: C0004
    title: 验证【数据质量】-【规则库配置】关闭内置规则状态，规则集选择器不再展示该规则
    priority: P1
    precondition: |-
      1) 规则库存在「${RuleA}」「${RuleB}」「${RuleC}」，当前状态均为「启用」
      2) 当前用户具有规则库维护权限
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 将「${RuleA}」「${RuleB}」「${RuleC}」三条内置规则状态切换为「关闭」并保存
        expected: Toast提示:「保存成功」，三条规则状态均显示「关闭」
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 新增规则集并打开监控规则选择器
        expected: 监控规则选择器不展示三条状态为「关闭」的内置规则
    tags:
      - 数据质量
      - 规则库配置
      - 内置规则
      - 状态管理

  - case_id: C0005
    title: 验证【数据质量】-【规则库配置】新增规则，规则名称置红且保存按钮禁用(规则名称 = 重名)
    priority: P1
    precondition: |-
      1) 规则库已存在启用规则「${RuleA}」
      2) 当前用户具有规则库维护权限
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 新增规则并填写名称「${RuleA}」，分类选择「时效性校验」后点击【保存】
        expected: 「规则名称」置红提示「规则名称已存在」，「保存」按钮禁用
      - action: 将名称改为「${RuleA}副本」
        expected: 红色提示消失，保存按钮恢复可用
    tags:
      - 数据质量
      - 规则库配置
      - 内置规则
      - 必填校验

  - case_id: C0006
    title: 验证【数据质量】-【规则集管理】新增规则集添加时效性校验，保存成功且详情包含「${RuleA}」
    priority: P0
    precondition: |-
      1) 规则库存在「${RuleA}」「${RuleB}」两条启用规则
      2) 授权数据源 A：${DataSourceA}
      3) 数据源 A 类型：SparkThrift2.x
      4) 数据源 A 存在数据库：${SchemaA}
      5) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15531_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15531_c0006 (id BIGINT, start_time TIMESTAMP, end_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_15531_c0006 VALUES (1, '2026-08-03 10:00:00', '2026-08-03 11:00:00');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 新增规则集，选择 ${DataSourceA}、${SchemaA}、test_table_15531_c0006 并添加时效性校验
        expected: 规则选择器展示「${RuleA}」和「${RuleB}」
      - action: 选择「${RuleA}」并保存
        expected: Toast提示:「保存成功」，规则集详情包含「${RuleA}」
    tags:
      - 数据质量
      - 规则集管理
      - 内置规则
      - 规则集
