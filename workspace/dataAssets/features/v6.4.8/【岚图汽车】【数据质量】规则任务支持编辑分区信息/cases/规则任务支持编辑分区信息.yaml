        expected: 进入成功
      - action: 编辑规则任务「TaskA」，将分区方式改为「手动输入」并填写 factory_date=20260115、sale_date=20260201 后保存
        expected: Toast提示:「保存成功」，任务详情显示手动分区值 factory_date=20260115、sale_date=20260201
      - action: 进入【数据质量 → 校验结果查询】页面并查看「TaskA」的未运行实例
        expected: 实例状态依次显示「停止中」和「中途停止」，不再执行旧动态分区配置
    tags:
      - 数据质量
      - 规则任务管理
      - 实例状态

