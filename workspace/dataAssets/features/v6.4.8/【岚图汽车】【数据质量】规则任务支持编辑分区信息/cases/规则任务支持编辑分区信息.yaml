meta:
  title: 质量规则任务支持编辑分区信息
  requirement_id: "15524"
  case_module_id: ""
  exports:
    - 规则任务支持编辑分区信息.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则任务管理】修改分区方式为动态分区并保存，新实例分区值为前一日和当日
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日和当日两个分区，每个分区 3 条记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15524_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15524_c0001 (
           id BIGINT,
           amount DECIMAL(10,2)
         ) PARTITIONED BY (factory_date STRING, sale_date STRING);
         INSERT INTO ${SchemaA}.test_table_15524_c0001 PARTITION (factory_date, sale_date)
         SELECT id, CAST(id * 100 AS DECIMAL(10,2)), date_format(date_sub(current_date(), 1), 'yyyyMMdd'), date_format(date_sub(current_date(), 1), 'yyyyMMdd') FROM range(1, 4)
         UNION ALL
         SELECT id, CAST(id * 100 AS DECIMAL(10,2)), date_format(current_date(), 'yyyyMMdd'), date_format(current_date(), 'yyyyMMdd') FROM range(1, 4);
      5) 规则任务「TaskA」分区方式为「手动输入」，配置值为 factory_date=20260115、sale_date=20260201
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 打开规则任务「TaskA」并点击【编辑】，将分区方式改为「动态分区」并保存
        expected: Toast提示:「保存成功」，任务详情显示分区方式「动态分区」
      - action: 打开规则任务「TaskA」的实例列表
        expected: 新生成实例的分区值为前一日和当日日期，实例状态为「等待运行」
    tags:
      - 数据质量
      - 规则任务管理
      - 动态分区

  - case_id: C0002
    title: 验证【数据质量】-【规则任务管理】修改分区方式为选择已有分区并保存，新实例仅扫描所选分区
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日、当日和 factory_date=20260115、sale_date=20260201 三个分区，每个分区 3 条记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15524_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15524_c0002 (
           id BIGINT,
           amount DECIMAL(10,2)
         ) PARTITIONED BY (factory_date STRING, sale_date STRING);
         INSERT INTO ${SchemaA}.test_table_15524_c0002 PARTITION (factory_date, sale_date)
         SELECT id, CAST(id * 100 AS DECIMAL(10,2)), date_format(date_sub(current_date(), 1), 'yyyyMMdd'), date_format(date_sub(current_date(), 1), 'yyyyMMdd') FROM range(1, 4)
         UNION ALL
         SELECT id, CAST(id * 100 AS DECIMAL(10,2)), date_format(current_date(), 'yyyyMMdd'), date_format(current_date(), 'yyyyMMdd') FROM range(1, 4)
         UNION ALL
         SELECT id, CAST(id * 100 AS DECIMAL(10,2)), '20260115', '20260201' FROM range(1, 4);
      5) 分区列表可选择的值为 factory_date=20260115、sale_date=20260201
      6) 规则任务「TaskA」分区方式为「手动输入」，配置值为 factory_date=20260115、sale_date=20260201
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 编辑规则任务「TaskA」，将分区方式改为「选择已有分区」并选择 factory_date=20260115、sale_date=20260201 后保存
        expected: Toast提示:「保存成功」，任务详情显示两个已选分区值
      - action: 打开规则任务「TaskA」的实例列表
        expected: 新生成实例仅包含 factory_date=20260115、sale_date=20260201
    tags:
      - 数据质量
      - 规则任务管理
      - 已有分区

