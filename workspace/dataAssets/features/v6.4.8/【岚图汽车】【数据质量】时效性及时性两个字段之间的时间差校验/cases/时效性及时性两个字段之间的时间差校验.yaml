meta:
  title: 时效性及时性两个字段之间的时间差校验
  feature_id: quality-multi-field-time-difference
  case_module_id: ""
  requirement_id: "10182"
  exports:
    - 时效性及时性两个字段之间的时间差校验.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则集管理】配置多字段时间差校验规则并执行，实例不达标且失败明细为 2 条
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10182_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10182_c0001 (id BIGINT, start_time TIMESTAMP, end_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10182_c0001 VALUES (1, TIMESTAMP '2026-08-01 08:00:00', TIMESTAMP '2026-08-01 08:00:30'), (2, TIMESTAMP '2026-08-01 09:00:00', TIMESTAMP '2026-08-01 09:02:00'), (3, TIMESTAMP '2026-08-01 10:00:00', TIMESTAMP '2026-08-01 09:59:30');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_10182_c0001
          规则集描述：空
          添加多字段时间差校验：字段组选择 start_time、end_time，阈值 <= 60 秒，关系为 start_time < end_time，保存并立即执行
        expected: Toast提示:「保存成功」，规则实例状态为「不达标」
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 最新实例状态为「不达标」，失败记录数为 2
      - action: 打开实例详情
        expected: 结果明细展示 id=2、id=3
    tags:
      - 数据质量
      - 规则集管理
      - 多字段时间差
      - 异常明细

  - case_id: C0002
    title: 验证【数据质量】-【规则集管理】配置多字段时间差校验规则并执行，实例达标且监控报告展示字段组与阈值
    priority: P0
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10182_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10182_c0002 (id BIGINT, start_time TIMESTAMP, end_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10182_c0002 VALUES (1, TIMESTAMP '2026-08-01 08:00:00', TIMESTAMP '2026-08-01 08:00:30'), (2, TIMESTAMP '2026-08-01 09:00:00', TIMESTAMP '2026-08-01 09:00:45'), (3, TIMESTAMP '2026-08-01 10:00:00', TIMESTAMP '2026-08-01 10:00:30');
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          新建规则集，配置基础信息：
          * 规则集名称：RuleSetB
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：test_table_10182_c0002
          规则集描述：空
          添加多字段时间差校验：字段组选择 start_time、end_time，阈值 <= 60 秒，关系为 start_time < end_time，保存并立即执行
        expected: Toast提示:「保存成功」，规则实例状态为「达标」，失败记录数为 0
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 最新实例状态为「达标」
      - action: 打开实例详情查看监控报告
        expected: 监控报告展示字段组 start_time、end_time、阈值 60 秒和结果「达标」
    tags:
      - 数据质量
      - 规则集管理
      - 多字段时间差
      - 达标结果

  - case_id: C0003
    title: 验证【数据质量】-【校验结果查询】查看多字段时间差校验失败明细，字段标红且下载文件含实际时间差
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 3 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10182_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10182_c0003 (id BIGINT, start_time TIMESTAMP, end_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10182_c0003 VALUES (1, TIMESTAMP '2026-08-01 08:00:00', TIMESTAMP '2026-08-01 08:00:30'), (2, TIMESTAMP '2026-08-01 09:00:00', TIMESTAMP '2026-08-01 09:02:00'), (3, TIMESTAMP '2026-08-01 10:00:00', TIMESTAMP '2026-08-01 10:00:45');
      5) 规则任务「${TaskA}」已执行多字段时间差校验（字段组 start_time、end_time，阈值 <= 60 秒，关系为 start_time < end_time），结果为「不达标」，失败记录数为 1
    steps:
      - action: 进入【数据质量 → 校验结果查询】页面
        expected: 进入成功
      - action: 打开任务「${TaskA}」的【查看明细】
        expected: 明细列表展示 id=2，start_time、end_time 两个字段标红，失败数量为 1
      - action: 点击【下载明细】并打开下载文件
        expected: 文件包含 id=2、start_time、end_time 和实际时间差 120 秒
    tags:
      - 数据质量
      - 校验结果查询
      - 失败明细
      - 下载

  - case_id: C0004
    title: 验证【数据质量】-【规则集管理】查看多字段时间差校验字段组选择器，仅时间类型字段可选
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10182_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10182_c0004 (id BIGINT, event_date DATE, event_time TIMESTAMP, amount DECIMAL(10,2), enabled BOOLEAN);
         INSERT INTO ${SchemaA}.test_table_10182_c0004 VALUES (1, DATE '2026-08-01', TIMESTAMP '2026-08-01 08:00:00', 10.50, TRUE), (2, DATE '2026-08-02', TIMESTAMP '2026-08-02 08:00:00', 20.00, FALSE);
      5) 规则集「${RuleSetA}」已关联 test_table_10182_c0004 与多字段时间差校验
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「${RuleSetA}」并展开多字段时间差校验配置
        expected: 字段组选择器展示 event_date、event_time，大小关系可选择 event_date < event_time 或 event_date > event_time
      - action: 查看 amount、enabled 字段
        expected: amount、enabled 不出现在字段组选择器中
    tags:
      - 数据质量
      - 规则集管理
      - 多字段时间差
      - 字段类型

  - case_id: C0005
    title: 验证【数据质量】-【规则集管理】输入非正整数时间差，输入框置红且保存按钮禁用
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10182_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10182_c0005 (id BIGINT, start_time TIMESTAMP, end_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10182_c0005 VALUES (1, TIMESTAMP '2026-08-01 08:00:00', TIMESTAMP '2026-08-01 08:00:30'), (2, TIMESTAMP '2026-08-01 09:00:00', TIMESTAMP '2026-08-01 09:00:30');
      5) 规则集「${RuleSetA}」已关联 test_table_10182_c0005 与多字段时间差校验
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「${RuleSetA}」，在时间差输入框依次填写 0、-1、1.5 并点击【保存】
        expected: 输入框置红提示「请输入正整数」，「保存」按钮禁用
      - action: 输入 60 并选择时间单位「秒」
        expected: 红色提示消失，保存按钮恢复可用，时间差展示 60 秒
    tags:
      - 数据质量
      - 规则集管理
      - 多字段时间差
      - 表单校验

  - case_id: C0006
    title: 验证【数据质量】-【规则集管理】不选对比字段组保存规则，字段组置红且保存按钮禁用
    priority: P1
    precondition: |-
      1) 授权数据源 A：${DataSourceA}
      2) 数据源 A 类型：SparkThrift2.x
      3) 数据源 A 存在数据库：${SchemaA}
      4) 创建数据表并插入 2 行记录：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_10182_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_10182_c0006 (id BIGINT, start_time TIMESTAMP, end_time TIMESTAMP);
         INSERT INTO ${SchemaA}.test_table_10182_c0006 VALUES (1, TIMESTAMP '2026-08-01 08:00:00', TIMESTAMP '2026-08-01 08:00:30'), (2, TIMESTAMP '2026-08-01 09:00:00', TIMESTAMP '2026-08-01 09:00:30');
      5) 规则集「${RuleSetA}」已关联 test_table_10182_c0006 与多字段时间差校验
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「${RuleSetA}」，不选择对比字段组，填写阈值 60 秒并点击【保存】
        expected: 「对比字段组」置红提示「请选择字段」，「保存」按钮禁用
      - action: 选择 start_time、end_time
        expected: 字段组回显两个字段，红色提示消失
    tags:
      - 数据质量
      - 规则集管理
      - 多字段时间差
      - 必填校验
