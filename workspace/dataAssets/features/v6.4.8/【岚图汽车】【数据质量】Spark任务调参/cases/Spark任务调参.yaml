meta:
  title: 【规则调度设置】spark任务调参
  requirement_id: "15532"
  case_module_id: "10190"
  exports:
    - Spark任务调参.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则任务管理】配置spark.driver.maxResultSize=2g环境参数并运行任务，YARN Environment页签展示参数值
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入100行数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15532_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15532_c0001 (id BIGINT, code STRING);
         INSERT INTO ${SchemaA}.test_table_15532_c0001 SELECT id, CONCAT('code_', CAST(id AS STRING)) FROM range(1, 101);
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新建单表校验规则，监控对象选择 ${DataSourceA}.${SchemaA}.test_table_15532_c0001，完成监控规则配置并进入「调度属性」步骤
        expected: 「调度属性」展示「环境参数配置」入口
      - action: 打开「环境参数配置」，设置 spark.driver.maxResultSize=2g，确认配置并保存规则
        expected: Toast提示:「保存成功」，规则详情的环境参数展示 spark.driver.maxResultSize=2g
      - action: 运行规则任务并打开对应YARN应用的「Environment」页签
        expected: 任务实例状态为「成功」，Spark Properties中的spark.driver.maxResultSize为2g
    tags:
      - 数据质量
      - 规则任务管理

