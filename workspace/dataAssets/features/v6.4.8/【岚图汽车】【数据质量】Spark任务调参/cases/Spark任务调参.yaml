  - case_id: C0005
    title: 验证【数据质量】-【规则任务管理】配置spark.sql.shuffle.partitions=10环境参数并运行任务，聚合Shuffle Stage包含10个Task
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入100行分组数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15532_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15532_c0005 (id BIGINT, group_code STRING);
         INSERT INTO ${SchemaA}.test_table_15532_c0005 SELECT id, CONCAT('group_', CAST(id % 10 AS STRING)) FROM range(1, 101);
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新建单表校验规则，监控对象选择 ${DataSourceA}.${SchemaA}.test_table_15532_c0005，为group_code配置重复值校验规则并进入「调度属性」步骤
        expected: 「调度属性」展示「环境参数配置」入口
      - action: 打开「环境参数配置」，设置 spark.sql.shuffle.partitions=10，确认配置并保存规则
        expected: Toast提示:「保存成功」，规则详情的环境参数展示 spark.sql.shuffle.partitions=10
      - action: 运行规则任务并打开对应Spark UI的「Stages」页签
        expected: 任务实例状态为「成功」，聚合产生的Shuffle Stage包含10个Task
    tags:
      - 数据质量
      - 规则任务管理

