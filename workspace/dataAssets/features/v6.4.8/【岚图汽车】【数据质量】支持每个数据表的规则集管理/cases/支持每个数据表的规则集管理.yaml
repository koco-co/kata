meta:
  title: 【岚图】【规则集管理】支持每个数据表的规则集管理
  feature_id: quality-table-scoped-rule-sets
  requirement_id: "15522"
  case_module_id: "10193"
  exports:
    - 支持每个数据表的规则集管理.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则集管理】删除被引用规则集，历史任务实例仍按删除前规则执行
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0001 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0001 VALUES (1, 10.00), (2, 20.00), (3, 30.00);
      5) 规则集「RuleSetE」已被任务「TaskA」引用
      6) 任务「TaskA」已执行 1 次，历史实例状态为「校验异常」
      7) 任务所属数据表为「${SchemaA}.test_table_15522_c0001」，表行数为 3
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 删除规则集「RuleSetE」并在确认弹窗点击【确定】
        expected: Toast提示:「删除成功」，规则集列表不再展示「RuleSetE」
      - action: 进入【数据质量 → 规则任务配置】页面，打开任务「TaskA」并点击【立即执行】
        expected: 新实例生成成功，任务仍引用删除前的规则内容
      - action: 打开最新实例详情
        expected: 最新实例状态为「校验异常」，表行数实际值为 3，历史规则结果不变
    tags:
      - 数据质量
      - 规则集管理
      - 历史任务

  - case_id: C0002
    title: 验证【数据质量】-【规则集管理】编辑被引用规则集，历史任务实例仍按旧期望值计算
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0002 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0002 VALUES (1, 10.00), (2, 20.00), (3, 30.00);
      5) 规则集「RuleSetF」已被任务「TaskB」引用
      6) 任务「TaskB」已执行 1 次，历史实例中规则期望值为 3
      7) 任务所属数据表为「${SchemaA}.test_table_15522_c0002」
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 编辑规则集「RuleSetF」，将规则期望值改为 4 并点击【保存】
        expected: Toast提示:「保存成功」，规则集详情期望值更新为 4
      - action: 进入【数据质量 → 规则任务配置】页面，打开任务「TaskB」并点击【立即执行】
        expected: 新实例生成成功，任务规则仍展示历史期望值 3
      - action: 查看实例详情
        expected: 最新实例按期望值 3 计算，历史实例结果与新实例结果可分别查看
    tags:
      - 数据质量
      - 规则集管理
      - 历史配置

  - case_id: C0003
    title: 验证【数据质量】-【规则任务配置】导入规则包并立即执行，实例与质量报告展示全部规则包结果(20规则包 * 1校验规则)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并插入前一日和当日数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0003 (id BIGINT, amount DECIMAL(10,2), dt STRING) PARTITIONED BY (dt);
         INSERT INTO ${SchemaA}.test_table_15522_c0003 SELECT id, CAST(id AS DECIMAL(10,2)), date_sub(current_date(), 1) FROM range(1, 4);
         INSERT INTO ${SchemaA}.test_table_15522_c0003 SELECT id, CAST(id + 3 AS DECIMAL(10,2)), current_date() FROM range(4, 7);
      5) 规则集「RuleSetQ」包含 20 个规则包，每个规则包包含 1 条规则
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务，选择 ${DataSourceA}、${SchemaA}.test_table_15522_c0003，选择当日分区并导入「RuleSetQ」
        expected: 监控规则区域展示 20 个规则包，每个规则包展示 1 条规则
      - action: 保存并立即执行
        expected: 最新实例生成成功，实例详情展示 20 个规则包结果
      - action: 打开质量报告
        expected: 报告展示规则包名称、规则数量、执行状态和异常数量，20 个规则包均有记录
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0004
    title: 验证【数据质量】-【规则任务配置】导入单规则包并执行，实例包含10条规则结果(1规则包 * 10校验规则)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入规则表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0004 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0004 SELECT id, CAST(id AS DECIMAL(10,2)) FROM range(1, 11);
      5) 规则集「RuleSetO」仅包含规则包「ten_rule_pack」，规则包内有 10 条规则
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务并导入规则集「RuleSetO」
        expected: 规则包区域仅展示 ten_rule_pack，规则行数量为 10
      - action: 保存任务并打开监控规则详情
        expected: 10 条规则分别展示字段、统计函数、期望值和强弱规则
      - action: 点击【立即执行】
        expected: 最新实例包含 10 条规则结果，结果数量与配置数量一致
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0005
    title: 验证【数据质量】-【规则任务配置】导入两个规则包并执行，结果按规则包分组展示(2规则包 * 2校验规则)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入规则表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0005 (id BIGINT, code STRING, amount DECIMAL(10,2), dt DATE);
         INSERT INTO ${SchemaA}.test_table_15522_c0005 SELECT id, CONCAT('C', CAST(id AS STRING)), CAST(id AS DECIMAL(10,2)), current_date() FROM range(1, 5);
      5) 规则集「RuleSetR」包含 pack_a、pack_b，每个规则包有 2 条规则
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务并导入规则集「RuleSetR」
        expected: 规则包区域展示 pack_a、pack_b，每包规则数量为 2
      - action: 保存并立即执行
        expected: 最新实例展示 4 条规则结果，结果按规则包分组
      - action: 打开质量报告
        expected: 报告分别展示 pack_a、pack_b 的通过数量和异常数量
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0006
    title: 验证【数据质量】-【规则任务配置】导入单规则包并执行，实例生成3条规则结果(1规则包 * 3校验规则)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入规则表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0006;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0006 (id BIGINT, amount DECIMAL(10,2), code STRING);
         INSERT INTO ${SchemaA}.test_table_15522_c0006 SELECT id, CAST(id AS DECIMAL(10,2)), CONCAT('C', CAST(id AS STRING)) FROM range(1, 4);
      5) 规则集「RuleSetP」包含规则包「three_rule_pack」，规则包内有 3 条规则
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务并导入规则集「RuleSetP」
        expected: 规则包区域展示 three_rule_pack，规则行数量为 3
      - action: 点击【保存】并立即执行
        expected: Toast提示:「保存成功」，最新实例生成 3 条规则结果
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0007
    title: 验证【数据质量】-【规则集管理】打开规则集详情并编辑规则包，回显数据表与规则配置(1规则包 * 1校验规则)
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0007 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0007 VALUES (1, 10.00);
      5) 规则集「RuleSetI」包含规则包「one_rule_pack」和 1 条表行数规则
      6) 规则包已关联数据表「${SchemaA}.test_table_15522_c0007」
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 搜索规则集「RuleSetI」并打开详情
        expected: 详情展示规则包名称 one_rule_pack，规则数量为 1，规则类型为表行数
      - action: 点击规则包【编辑】
        expected: 规则编辑页回显数据表、规则类型、期望值和规则描述
    tags:
      - 数据质量
      - 规则集管理
      - 单规则

  - case_id: C0008
    title: 验证【数据质量】-【规则集管理】删除被引用规则包中的规则，任务引用关系保留
    priority: P1
    precondition: |-
      1) 规则集「RuleSetK」已被任务「TaskD」引用
      2) 规则集包含规则包「referenced_pack」和 2 条规则
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「RuleSetK」并查看规则包操作菜单
        expected: 操作菜单展示【编辑】和【删除规则】入口，不展示删除被引用规则集入口
      - action: 删除规则包中的 1 条规则并点击【保存】
        expected: Toast提示:「保存成功」，规则包规则数量由 2 变为 1，任务引用关系保留
    tags:
      - 数据质量
      - 规则集管理
      - 引用限制

  - case_id: C0009
    title: 验证【数据质量】-【规则任务配置】编辑任务切换规则包但不导入，规则内容不隐式替换
    priority: P1
    precondition: |-
      1) 规则集「RuleSetL」包含旧规则包「old_pack」和新规则包「new_pack」
      2) 任务「TaskE」已导入 old_pack，规则数量为 2
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 编辑任务「TaskE」，将规则包选择改为 new_pack，不点击【导入】
        expected: 规则内容区域仍展示 old_pack 的 2 条规则
      - action: 返回任务列表并重新打开任务
        expected: 任务仍展示 old_pack 和原 2 条规则，未发生隐式替换
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0010
    title: 验证【数据质量】-【规则任务配置】导入全部规则包并保存，任务保留3个规则包6条规则
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0010;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0010 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0010 VALUES (1, 10.00), (2, 20.00), (3, 30.00);
      5) 规则集「RuleSetG」包含 pack_a、pack_b、pack_c 三个规则包
      6) 三个规则包分别包含 2、3、1 条规则
      7) 任务数据表为「${SchemaA}.test_table_15522_c0010」
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务，选择数据表「${SchemaA}.test_table_15522_c0010」，点击【导入规则包】并选择「全部」
        expected: 规则内容展示 pack_a、pack_b、pack_c，规则总数为 6
      - action: |-
          点击【下一步】进入调度配置，配置调度属性如下：
          * 调度周期：手动触发
          规则拼接包：2
          资源组：默认资源组
          超时时间：不限制
          告警方式：无
          无需生成报告：勾选
          报告名称：空
        expected: 调度配置展示规则包数量 3 和规则数量 6
      - action: 点击【保存】
        expected: Toast提示:「保存成功」，任务详情保留 3 个规则包和 6 条规则
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0011
    title: 验证【数据质量】-【规则任务配置】选择两个规则包并保存，任务详情仅展示所选规则包
    priority: P1
    precondition: |-
      1) 规则集「RuleSetH」包含 pack_a、pack_b、pack_c 三个规则包
      2) 任务「TaskC」状态为草稿
    steps:
      - action: 进入【数据质量 → 规则任务配置】页面
        expected: 进入成功
      - action: 新建任务并在规则包下拉框依次选择 pack_c、pack_a
        expected: 下拉框展示已选 2 个规则包，规则内容按 pack_c、pack_a 分组
      - action: 点击【保存】
        expected: Toast提示:「保存成功」，任务详情只展示 pack_c、pack_a，不展示 pack_b
    tags:
      ["数据质量", "规则任务配置"]
  - case_id: C0012
    title: 验证【数据质量】-【规则集管理】打开规则集详情，展示规则包数量与规则配置
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0012;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0012 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0012 VALUES (1, 10.00);
      5) 规则集「RuleSetC」包含 20 个规则包，每个规则包有 1 条规则
      6) 规则集关联数据表「${SchemaA}.test_table_15522_c0012」
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 搜索并打开规则集「RuleSetC」
        expected: 详情展示规则集名称、数据源、数据库、数据表、规则包数量 20 和规则总数 20
      - action: 展开任一规则包
        expected: 规则包展示规则名称、字段、统计函数、期望值、强弱规则和描述
    tags:
      - 数据质量
      - 规则集管理
      - 详情

  - case_id: C0013
    title: 验证【数据质量】-【规则集管理】新增编辑删除规则包，列表与提示同步更新
    priority: P1
    precondition: |-
      1) 规则集「RuleSetB」已创建，当前包含规则包「RuleSetB」
      2) 规则包名称「RuleSetC」当前不存在
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 打开规则集「RuleSetB」，点击【新增规则包】，填写名称「RuleSetC」并点击【保存】
        expected: Toast提示:「保存成功」，规则包列表新增 RuleSetC
      - action: 编辑 RuleSetC 名称为「RuleSetD」并保存
        expected: Toast提示:「保存成功」，规则包名称更新为 RuleSetD
      - action: 删除 RuleSetD 并确认
        expected: Toast提示:「删除成功」，规则包列表不再展示 RuleSetD
    tags:
      - 数据质量
      - 规则集管理
      - 规则包CRUD

  - case_id: C0014
    title: 验证【数据质量】-【规则集管理】新增规则包，名称置红且保存禁用(规则包名称重复或已存在)
    priority: P1
    precondition: |-
      1) 规则集「RuleSetD」已存在规则包「duplicate_pack」
      2) 当前正在新增规则包
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: 在新增规则包表单输入名称「duplicate_pack」
        expected: 点击成功
      - action: 【保存】
        expected: 「规则包名称」置红提示「名称已存在」，保存按钮保持禁用，列表不新增记录
    tags:
      ["数据质量", "规则集管理"]
  - case_id: C0015
    title: 验证【数据质量】-【规则集管理】新建规则集选择数据表，已配置规则集的表不可选
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建并写入两张规则表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0015_source;
         DROP TABLE IF EXISTS ${SchemaA}.test_table_15522_c0015_target;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0015_source (id BIGINT, amount DECIMAL(10,2));
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15522_c0015_target (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_15522_c0015_source VALUES (1, 10.00), (2, 20.00);
         INSERT INTO ${SchemaA}.test_table_15522_c0015_target VALUES (1, 10.00), (2, 20.00);
      5) 数据表 test_table_15522_c0015_source 已被规则集「RuleSetA」配置，数据表 test_table_15522_c0015_target 尚未配置规则集
    steps:
      - action: 进入【数据质量 → 规则集管理】页面
        expected: 进入成功
      - action: |-
          点击【新建规则集】，配置基础信息如下：
          * 规则集名称：RuleSetA
          * 选择数据源：${DataSourceA}
          * 选择数据库：${SchemaA}
          * 选择数据表：下拉框展示 test_table_15522_c0015_source 与 test_table_15522_c0015_target
          规则集描述：空
        expected: 数据表下拉框展示 test_table_15522_c0015_source、test_table_15522_c0015_target
