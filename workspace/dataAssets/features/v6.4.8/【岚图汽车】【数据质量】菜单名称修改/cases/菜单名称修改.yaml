meta:
  title: 菜单名称修改
  case_module_id: ""
  exports:
    - 菜单名称修改.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】新建项目并打开左侧菜单，5个菜单名称按新规则修改并新增规则集管理(新建项目)
    priority: P1
    steps:
      - action: 进入【数据质量】页面
        expected: 进入成功
      - action: 新建项目 quality_menu_new 并打开项目左侧菜单
        expected: |-
          1） 「概览」名称改为「总览」
          2） 「规则任务配置」名称改为「规则任务管理」
          3） 「任务实例查询」名称改为「校验结果查询」
          4） 「质量报告」名称改为「数据质量报告」
          5） 新增一级菜单「规则集管理」
    precondition: 无
  - case_id: C0002
    title: 验证【数据质量】打开历史项目左侧菜单，5个菜单名称按新规则修改并新增规则集管理(历史项目)
    priority: P0
    steps:
      - action: 进入【数据质量】页面
        expected: 进入成功
      - action: 打开版本升级前创建的项目 quality_menu_legacy 并查看左侧菜单
        expected: |-
          1） 「概览」名称改为「总览」
          2） 「规则任务配置」名称改为「规则任务管理」
          3） 「任务实例查询」名称改为「校验结果查询」
          4） 「质量报告」名称改为「数据质量报告」
          5） 新增一级菜单「规则集管理」
    precondition: |-
      1) 存在版本升级前创建的数据质量项目 quality_menu_legacy
