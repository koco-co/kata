meta:
  title: 菜单名称修改
  case_module_id: ""
  exports:
    - 菜单名称修改.xmind
cases:
  - case_id: C0001
    title: 验证新建项目菜单名称正确修改
    priority: P1
    steps:
      - action: 进入【数据质量 → 新建项目菜单名称正确修改】页面
        expected: 已进入【数据质量 → 新建项目菜单名称正确修改】页面，显示页面标题与主要操作区域
      - action: 进入「资产-数据质量」页面
        expected: 页面加载完成且显示目标控件打开
      - action: 查看页面菜单
        expected: |-
          1） 「概览」名称改为「总览」
          2） 「规则任务配置」名称改为「规则任务管理」
          3） 「任务实例查询」名称改为「校验结果查询」
          4） 「质量报告」名称改为「数据质量报告」
          5） 新增一级菜单「规则集管理」
    precondition: 无
  - case_id: C0002
    title: 验证历史项目菜单名称正确修改
    priority: P0
    steps:
      - action: 进入【数据质量 → 历史项目菜单名称正确修改】页面
        expected: 已进入【数据质量 → 历史项目菜单名称正确修改】页面，显示页面标题与主要操作区域
      - action: 进入「资产-数据质量」页面
        expected: 页面加载完成且显示目标控件打开
      - action: 查看历史项目下的页面菜单
        expected: |-
          1） 「概览」名称改为「总览」
          2） 「规则任务配置」名称改为「规则任务管理」
          3） 「任务实例查询」名称改为「校验结果查询」
          4） 「质量报告」名称改为「数据质量报告」
          5） 新增一级菜单「规则集管理」
    precondition: 无
