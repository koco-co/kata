      - action: 点击「新增自定义正则」按钮，新增页面「规则模式」字段已删除不显示
        expected: 新增自定义正则保存成功
      - action: 点击「编辑」按钮，编辑页面「规则模式」字段已删除不显示
        expected: 编辑自定义正则保存成功
