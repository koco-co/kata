meta:
  title: 规则库支持自定义SQL模版
  version: v6.4.8
  feature_id: v6.4.8/【v648】【岚图汽车】【数据质量】规则库支持自定义SQL模版
cases:
  - case_id: C0001
    title: 验证文案调整
    priority: P2
    steps:
      - action: 查看原先的“自定义规则”tab名称
        expected: 已成功修改为“自定义正则”
      - action: 查看原先“新增自定义规则”按钮名称
        expected: 已成功修改为“新增自定义正则”
    precondition: 无
    tags:
      - 数据质量-规则库管理
      - 自定义正则
  - case_id: C0002
    title: 验证规则模式字段删除
    priority: P0
