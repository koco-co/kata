  - case_id: C0031
    title: 验证自定义sql任务运行结果查看
    priority: P0
    steps:
      - action: 查看监控报告
        expected: 支持校验未通过（数量）、校验通过（数量）tab切换
      - action: 选中校验未通过「数量」tab
        expected: 根据自定义配置时的分类展示，正确显示：完整性（自定义sql)，显示正确
      - action: 查看sql显示替换了参数信息之后的完整sql内容
        expected: SQl展示完整正确；SELECT COUNT(*) FROM car_order WHERE ( UNIX_TIMESTAMP(end_time1) - UNIX_TIMESTAMP(start_time1) ) > 60;
      - action: 点击查看明细
        expected: 成功打开明细弹框，明细内容正确，明细列表展示不符合要求的2条数据，展示数据表内的全部字段
      - action: 支持通过运行时间筛选
        expected: 筛选结果正确
      - action: 若配置规则时选择“校验字段”：end_time1、start_time1
        expected: 明细表end_time1、start_time1标红展示，显示正确
      - action: 点击下载明细
        expected: 受筛选条件影响，下载成功，下载结果正确，校验字段标红
    precondition: |-
      1、配置自定义sql模版，${自定义sql模版名称}
      配置规则分类：完整性
      配置sql如下：select count(*) from ${test_table} where
      ((unix_timestamp(${end_time1}) - unix_timestamp(${start_time1})) > ${d_value1} )
      参数列表显示：
      参数：${test_table}   类型：当前校验表   参数名称：当前校验表   参数说明：表名
      参数：${end_time1}   类型：当前校验表字段   参数名称：校验字段   参数说明：结束时间
      参数：${start_time1}   类型：当前校验表字段   参数名称：校验字段   参数说明：开始时间
      参数：${d_value1}   类型：数值  参数名称：校验字段   参数说明：开始时间
