         DROP TABLE IF EXISTS ${SchemaA}.test_table_15521_c0031;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_15521_c0031 (
           id BIGINT,
           start_time TIMESTAMP,
           end_time TIMESTAMP,
           name STRING
         );
         INSERT INTO ${SchemaA}.test_table_15521_c0031
         SELECT
           id,
           TIMESTAMP '2026-08-01 10:00:00',
           CAST(from_unixtime(unix_timestamp('2026-08-01 10:00:00') + CASE WHEN id <= 4 THEN id * 10 ELSE id * 30 END) AS TIMESTAMP),
           CONCAT('row_', CAST(id AS STRING))
         FROM range(1, 7);
