meta:
  title: 规则库支持自定义SQL模版
  requirement_id: "15521"
  case_module_id: "10205"
  exports:
    - 规则库支持自定义SQL模版.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则库配置】查看正则页签与新增按钮文案，展示新文案且不展示旧文案
    priority: P2
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 查看正则功能页签与新增按钮文案
        expected: |-
          1) 页签名称：「自定义正则」
          2) 新增按钮名称：「新增自定义正则」
          3) 页面不展示旧文案「自定义规则」和「新增自定义规则」
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0002
    title: 验证【数据质量】-【规则库配置】查看自定义正则列表与表单，不展示规则模式字段
    priority: P0
    precondition: |-
      1) 存在当前版本创建的自定义正则「RuleA」
      2) 存在升级前创建的历史自定义正则「RuleB」
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义正则」并查看列表列名
        expected: 列表不展示「规则模式」列
      - action: 点击「新增自定义正则」
        expected: 新增表单不展示「规则模式」字段
      - action: 点击「取消」，分别编辑「RuleA」和「RuleB」
        expected: 两个编辑表单均不展示「规则模式」字段
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0003
    title: 验证【数据质量】-【规则库配置】切换自定义sql模版页签，展示模版列表与新增按钮
    priority: P2
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 查看「自定义正则」右侧的页签
        expected: 右侧展示名称为「自定义sql模版」的页签
      - action: 点击「自定义sql模版」
        expected: 页面展示自定义sql模版列表和「新增自定义sql模版」按钮
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0004
    title: 验证【数据质量】-【规则库配置】按规则名称搜索模版，仅展示匹配记录或空数据状态
    priority: P2
    precondition: |-
      1) 存在模版「RuleA」
      2) 存在模版「RuleA2」
      3) 存在模版「RuleB」
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」并查看搜索框
        expected: 搜索框占位文案为「请输入规则名称进行搜索」
      - action: 在规则名称搜索框输入「RuleA」
        expected: 列表仅展示「RuleA」和「RuleA2」
      - action: 将搜索值替换为「not_found_c0004」
        expected: 列表展示空数据状态
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0005
    title: 验证【数据质量】-【规则库配置】筛选模版列表并查看关联规则数，仅展示匹配记录且数量正确
    priority: P1
    precondition: |-
      1) 存在模版「RuleA」，规则分类为「完整性」，关联范围为「字段级」，关联规则数为 0
      2) 存在模版「RuleB」，规则分类为「有效性」，关联范围为「表级」，关联规则数为 2
      3) 存在模版「RuleC」，规则分类为「合理性」，关联范围为「多表」，关联规则数为 1
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」并查看列表
        expected: 列表展示「规则名称」、「规则分类」、「关联范围」、「关联规则数」、「规则描述」和「操作」列
      - action: 在「规则分类」筛选中同时选择「完整性」和「有效性」
        expected: 列表仅展示「RuleA」和「RuleB」
      - action: 重置筛选，在「关联范围」筛选中同时选择「字段级」和「多表」
        expected: 列表仅展示「RuleA」和「RuleC」
      - action: 查看三条模版的「关联规则数」
        expected: 「RuleA」为 0，「RuleB」为 2，「RuleC」为 1
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0006
    title: 验证【数据质量】-【规则库配置】查看模版列表，按修改时间倒序展示
    priority: P1
    precondition: |-
      1) 模版「RuleA」修改时间为 2026-08-01 10:00:00
      2) 模版「RuleB」修改时间为 2026-08-02 10:00:00
      3) 模版「RuleC」修改时间为 2026-08-03 10:00:00
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」并查看三条模版的列表顺序
        expected: 从上至下依次为「RuleC」、「RuleB」、「RuleA」
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0007
    title: 验证【数据质量】-【规则库配置】新增自定义sql模版并保存，列表新增该模版且取消不落库
    priority: P0
    precondition: |-
      1) 列表不存在名称为「RuleE」的模版
      2) 列表不存在名称为「RuleC」的模版
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」并点击「新增自定义sql模版」
        expected: 进入新建页，面包屑显示「自定义sql模版 → 新建自定义sql模版」
      - action: |-
          配置模版：
          规则名称：RuleE
          规则分类：完整性
          关联范围：字段级
          规则描述：订单字段与阈值组合模版
          模版语句：SELECT * FROM ${table_name} WHERE ${field_name} ${operator} ${threshold} AND status IN (${status_values}) AND ${custom_condition}
          参数 threshold：类型「数值」，名称「阈值」，说明「比较阈值」
          参数 status_values：类型「数组」，名称「状态集合」，说明「允许状态」
          参数 operator：类型「逻辑关系」，名称「比较符」，说明「字段比较符」
          参数 table_name：类型「当前校验表」，名称置灰，说明「当前表名」
          参数 field_name：类型「当前校验表字段」，名称「校验字段」，说明「当前表字段」
          参数 custom_condition：类型「自定义参数」，名称「补充条件」，说明「补充过滤条件」
          点击「保存」
        expected: 返回列表，新增「RuleE」，规则分类为「完整性」，关联范围为「字段级」
      - action: |-
          再次点击「新增自定义sql模版」并配置：
          规则名称：RuleC
          规则分类：完整性
          关联范围：表级
          规则描述：取消新增验证
          模版语句：SELECT COUNT(*) FROM ${table_name}
          参数 table_name：类型「当前校验表」，说明「当前表名」
          点击「取消」
        expected: 返回列表且不展示「RuleC」
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0008
    title: 验证【数据质量】-【规则库配置】校验规则名称必填与长度上限，输入框置红且超长字符不写入
    priority: P1
    precondition: |-
      1) 存在模版「RuleA」
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」并查看「规则名称」
        expected: 输入框占位文案为「请输入」
      - action: 保持「规则名称」为空，完整填写其余必填项并点击「保存」
        expected: 「规则名称」输入框置红，页面停留在新建页
      - action: 在「规则名称」连续输入 101 个字符「a」
        expected: 输入框仅保留 100 个字符，第 101 个字符未写入
      - action: 将「规则名称」改为「RuleA」并点击「保存」
        expected: 「规则名称」输入框置红，列表中「RuleA」仅保留 1 条
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0009
    title: 验证【数据质量】-【规则库配置】选择规则分类并校验必填，仅保留最新选中值且为空置红
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」并查看「规则分类」
        expected: 未选择时显示「请选择」
      - action: 展开「规则分类」
        expected: 下拉列表展示「完整性」、「唯一性」、「有效性」、「统计性」、「时效性」和「合理性」
      - action: 先选择「完整性」，再选择「唯一性」
        expected: 选中值仅显示「唯一性」
      - action: 清空「规则分类」，完整填写其余必填项并点击「保存」
        expected: 「规则分类」表单项置红，页面停留在新建页
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0010
    title: 验证【数据质量】-【规则库配置】展开关联范围下拉，未选择显示请选择且枚举完整
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」并查看「关联范围」
        expected: 未选择时显示「请选择」
      - action: 展开「关联范围」
        expected: 下拉列表展示「字段级」、「表级」和「多表」
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0011
    title: 验证【数据质量】-【规则库配置】保持关联范围为空保存，表单项置红且停留新建页
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」，保持「关联范围」为空，完整填写其余必填项并点击「保存」
        expected: 「关联范围」表单项置红，页面停留在新建页
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0012
    title: 验证【数据质量】-【规则库配置】依次选择两个关联范围，仅保留最新选中值
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」，先选择「字段级」再选择「多表」
        expected: 「关联范围」仅显示「多表」
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0013
    title: 验证【数据质量】-【规则库配置】新建多表模版并打开详情，关联范围展示为多表
    priority: P1
    precondition: |-
      1) 列表不存在模版「RuleD」
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: |-
          切换到「自定义sql模版」，新建模版：
          规则名称：RuleD
          规则分类：完整性
          关联范围：多表
          规则描述：多表关联范围验证
          模版语句：SELECT COUNT(*) FROM ${table_name}
          参数 table_name：类型「当前校验表」，说明「当前表名」
          点击「保存」
        expected: 列表新增「RuleD」且「关联范围」显示为「多表」
      - action: 点击「RuleD」
        expected: 详情页的「关联范围」显示为「多表」
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0014
    title: 验证【数据质量】-【规则库配置】校验规则描述必填与长度上限，输入框置红且超长字符不写入
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」并查看「规则描述」
        expected: 输入框占位文案为「请输入」
      - action: 保持「规则描述」为空，完整填写其余必填项并点击「保存」
        expected: 「规则描述」输入框置红，页面停留在新建页
      - action: 在「规则描述」连续输入 256 个字符「b」
        expected: 输入框仅保留 255 个字符，第 256 个字符未写入
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0015
    title: 验证【数据质量】-【规则库配置】打开全局参数弹窗，参数表达式与说明完整展示
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」，再点击「全局参数」
        expected: 打开标题为「全局参数」的弹窗
      - action: 查看全局参数清单
        expected: 每条记录均展示参数表达式和对应说明，参数表达式可选中复制
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0016
    title: 验证【数据质量】-【规则库配置】编辑模版语句，参数列表实时增删
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」，在模版语句编辑器输入「${table_name} ${field_name} ${threshold}」
        expected: 参数列表依次展示「table_name」、「field_name」和「threshold」三条记录
      - action: 将「${threshold}」改为「threshold」
        expected: 参数列表仅展示「table_name」和「field_name」
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0017
    title: 验证【数据质量】-【规则库配置】编辑模版语句参数，参数列表按顺序展示且不收录全局参数
    priority: P0
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」，保持模版语句编辑器为空
        expected: 参数列表展示空数据状态
      - action: 输入「${param_a} ${param_b} ${param_c}」
        expected: 参数列表按顺序展示「param_a」、「param_b」和「param_c」三条记录
      - action: 将编辑器内容改为「${param_a} ${param_c}」
        expected: 参数列表仅展示「param_a」和「param_c」
      - action: 将编辑器内容改为「${param_a} ${param_c} ${param_d} ${param_e} ${param_f}」
        expected: 参数列表按顺序展示「param_a」、「param_c」、「param_d」、「param_e」和「param_f」五条记录
      - action: 在编辑器末尾插入一个全局参数
        expected: 参数列表仍仅展示前述五条自定义参数记录
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0018
    title: 验证【数据质量】-【规则库配置】编辑含重复参数的模版语句，参数列表仅展示单条
    priority: P2
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」，在模版语句编辑器输入「${field_a} + ${field_b} + ${field_a}」
        expected: 参数列表仅展示「field_a」和「field_b」，「field_a」位于「field_b」之前
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0019
    title: 验证【数据质量】-【规则库配置】选择参数类型并校验必填，控件随类型切换且为空置红
    priority: P0
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到「自定义sql模版」，点击「新增自定义sql模版」，输入「${parameter_type}」后展开「参数类型」
        expected: 下拉列表展示「数值」、「数组」、「逻辑关系」、「当前校验表」、「当前校验表字段」和「自定义参数」
      - action: 保持「参数类型」为空，完整填写其余必填项并点击「保存」
        expected: 「参数类型」表单项置红，页面停留在新建页
      - action: 依次选择六类参数类型并查看对应参数值控件
        expected: |-
          1) 「数值」使用 BIGINT 数值输入框
          2) 「数组」使用可输入且可多选的选择器
          3) 「逻辑关系」展示「>」、「=」、「<」、「>=」、「<=」和「!=」
          4) 「当前校验表」的参数值显示「--」且不可编辑
          5) 「当前校验表字段」使用当前表字段单选器
          6) 「自定义参数」使用文本输入框
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0020
    title: 验证【数据质量】-【规则库配置】校验参数名称置灰与长度上限，超长字符不写入
    priority: P1
    precondition: 无
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 切换到自定义模版页签，新建模版并将参数类型选择为「当前校验表」
        expected: 「参数名称」置灰且不可编辑
      - action: 将参数类型改为「数值」，保持「参数名称」为空并点击「保存」
        expected: 「参数名称」输入框置红，页面停留在新建页
      - action: 在「参数名称」连续输入 51 个字符「n」
        expected: 输入框仅保留 50 个字符，第 51 个字符未写入
    tags:
      ["数据质量", "规则库配置"]
  - case_id: C0021
    title: 验证【数据质量】-【规则库配置】编辑参数说明并保存，引用任务配置浮层同步展示
    priority: P1
