meta:
  title: 任务时长限制
  feature_id: quality-task-timeout
  requirement_id: "none"
  case_module_id: ""
  exports:
    - 任务时长限制.xmind
cases:
  - case_id: C0001
    title: 验证【数据质量】-【规则任务管理】编辑历史规则配置超时时间为自定义并运行，运行超过 5 分钟任务被强制杀死且状态为中途停止
    priority: P2
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0001 SELECT id, CAST(id AS DECIMAL(10,2)) FROM range(1, 1000001);
      5) 存在历史规则任务「${TaskA}」，监控对象为 ${SchemaA}.test_table_none_c0001，其「调度属性」中「超时时间」为「不限制」
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: |-
          打开规则任务「${TaskA}」点击【编辑】，进入「调度属性」页面，配置如下：
          * 调度周期：手动触发
          规则拼接包：2
          资源组：默认资源组
          超时时间：不限制
          告警方式：无
          无需生成报告：不勾选
          报告名称：空
        expected: 页面加载完成，展示「超时时间」配置区域
      - action: 查看「超时时间」区域
        expected: 默认选择「不限制」
      - action: 「超时时间」选择「自定义」
        expected: 弹出时间配置框，可配置小时、分钟
      - action: 「超时时间」配置为 00 时 05 分，点击【保存】
        expected: Toast 提示「保存成功」
      - action: 临时运行规则任务，等待实例运行并查看任务状态
        expected: 任务运行时长超过 5 分钟后被强制杀死，不再运行，状态展示「中途停止」，未生成质量报告
    tags:
      - 数据质量
      - 规则任务管理
      - 超时时间
