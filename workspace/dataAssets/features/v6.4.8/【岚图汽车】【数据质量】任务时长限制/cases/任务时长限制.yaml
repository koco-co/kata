meta:
  title: 任务时长限制
  case_module_id: ""
  exports:
    - 任务时长限制.xmind
cases:
  - case_id: C0001
    title: 验证编辑历史规则，配置「超时时间」功能正确
    priority: P2
    steps:
      - action: 进入「资产-数据质量」页面
        expected: 页面正常打开
      - action: 选择「规则B」，点击编辑，进入「调度属性」页
        expected: 页面正常打开
      - action: 查看「超时时间」区域
        expected: 默认选择为「不限制」
      - action: 编辑「超时时间」选择「自定义」
        expected: 弹出时间配置框，可配置小时、分钟
      - action: 配置为：00时05分，保存规则，且「调度属性」中配置「规则报告」为最新结果
        expected: 规则保存成功
      - action: 临时运行规则，查看实例详情及质量报告
        expected: 运行时间超过5分钟，该任务被自动杀掉，不再运行，未生成质量报告
      - action: 查看任务状态
        expected: 显示为“中途停止”
    precondition: 存在历史规则任务B
    tags:
      - 未分类
      - 未分类
