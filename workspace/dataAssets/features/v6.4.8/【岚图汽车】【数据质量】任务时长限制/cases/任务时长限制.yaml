  - case_id: C0006
    title: 验证「超时时间」配置内容交互
    priority: P1
    steps:
      - action: 进入「资产-数据质量-规则任务管理-调度属性」页面
        expected: 页面正常打开
      - action: 查看区域配置内容
        expected: 默认选择「不限制」
      - action: 鼠标悬浮“？”
        expected: 悬浮提示：“任务运行时长大于超时时间时平台将对其强制杀死。”
      - action: 选择「自定义」
        expected: 弹出时间配置框，可配置小时、分钟
      - action: 点击小时下拉框
        expected: 可选择“00～23”
      - action: 点击分钟下拉框
        expected: 可选择“00～59”
    precondition: 无
    tags:
      - 未分类
      - 未分类
  - case_id: C0007
    title: 验证「调度属性」页面新增「超时时间」
    priority: P2
    steps:
      - action: 进入「资产-数据质量-规则任务管理-调度属性」页面
        expected: 页面正常打开
      - action: 查看页面
        expected: |-
          1） 「调度配置」区域新增「超时时间」
          2） 可选择「不限制」和「自定义」
    precondition: 无
    tags:
      - 未分类
      - 未分类
