  - case_id: C0003
    title: 验证【数据质量】-【规则任务管理】新建规则任务配置超时时间为不限制并运行，生成正确实例与质量报告
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Hive2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (id BIGINT, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_none_c0003 VALUES (1, 10.00), (2, 20.00), (3, 30.00), (4, 40.00);
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，「规则名称」输入「${TaskC}」，「选择数据源」选择 ${DataSourceA}，「选择数据库」选择 ${SchemaA}，「选择数据表」选择 ${SchemaA}.test_table_none_c0003
        expected: 监控对象配置成功，进入「监控规则」配置页
      - action: 添加「完整性校验」规则，规则类型选择「表级」，统计函数选择「表行数」，校验方法选择「固定值」，期望值输入 4
        expected: 规则保存成功，进入「调度属性」配置页
      - action: |-
          「调度属性」配置如下：
          * 调度周期：手动触发
          规则拼接包：2
          资源组：默认资源组
          超时时间：不限制
          告警方式：无
          无需生成报告：不勾选
          报告名称：空
          规则报告：最新结果
          保存规则
        expected: Toast 提示「保存成功」
      - action: 临时运行规则任务，查看实例详情及质量报告
        expected: 生成正确实例详情，实例状态展示「通过」，质量报告展示表行数实际值 4
    tags:
      - 数据质量
      - 规则任务管理
      - 超时时间
