      3) 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建源表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006_source_01 (
           order_id BIGINT,
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_none_c0006_source_01 VALUES
           (1, CAST(10.00 AS DECIMAL(10,2))),
           (2, CAST(20.00 AS DECIMAL(10,2))),
           (3, CAST(30.00 AS DECIMAL(10,2)));
      5) 在 ${SchemaA} 创建对比表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0006_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0006_comparison_01 (
           order_id BIGINT,
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_none_c0006_comparison_01 VALUES
           (1, CAST(10.00 AS DECIMAL(10,2))),
           (2, CAST(20.00 AS DECIMAL(10,2))),
           (3, CAST(30.00 AS DECIMAL(10,2)));
      6) 规则任务「TaskA」配置多表数据行数对比，关系为「且」
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 打开规则任务「TaskA」并查看监控规则
        expected: 展示源表 test_table_none_c0006_source_01 和对比表 test_table_none_c0006_comparison_01 及行数对比规则
      - action: 点击【立即执行】并打开校验结果详情
        expected: 行数对比结果为「达标」，两张表行数均为 3
    tags:
      - 数据质量
