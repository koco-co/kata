cases:
  - case_id: C0001
    title: 验证【规则任务管理】-【单表规则】手动输入分区执行唯一性校验，结果不达标且异常记录数为1(当日分区含重复id)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0001 (
           id BIGINT,
           name STRING,
           dt DATE
         ) PARTITION BY RANGE (dt) (
           PARTITION p_prev VALUES LESS THAN (DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)),
           PARTITION p_curr VALUES LESS THAN (DATE_ADD(CURRENT_DATE(), INTERVAL 1 DAY))
         ) DISTRIBUTED BY HASH(id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0001 VALUES
           (1, 'alpha', DATE_SUB(CURRENT_DATE(), 1)),
           (2, 'beta', DATE_SUB(CURRENT_DATE(), 1)),
           (1, 'dup', CURRENT_DATE()),
           (1, 'dup2', CURRENT_DATE()),
           (2, 'gamma', CURRENT_DATE());
      5) 规则「RuleA」为字段 id 的唯一性校验，规则任务「TaskA」分区方式为手动输入
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新增单表规则任务「TaskA」，选择 test_table_none_c0001、id 和手动分区 dt=CURRENT_DATE()
        expected: 监控对象区域显示数据表 test_table_none_c0001、字段 id 和手动分区值 CURRENT_DATE()
      - action: 保存规则并点击【立即执行】，再打开校验结果详情
        expected: 任务状态为「运行成功」，id 唯一性结果为「不达标」，异常记录数为 1
    tags:
      - 数据质量
      - 规则任务管理
      - 分区
      - 唯一性

  - case_id: C0002
    title: 验证【规则任务管理】-【单表规则】选择已有分区执行唯一性校验，结果达标且异常记录数为0(分区数据唯一)
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0002 (
           id BIGINT,
           name STRING,
           dt DATE
         ) PARTITION BY RANGE (dt) (
           PARTITION p_prev VALUES LESS THAN (DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)),
           PARTITION p_curr VALUES LESS THAN (DATE_ADD(CURRENT_DATE(), INTERVAL 1 DAY))
         ) DISTRIBUTED BY HASH(id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0002 VALUES
           (1, 'alpha', DATE_SUB(CURRENT_DATE(), 1)),
           (2, 'beta', DATE_SUB(CURRENT_DATE(), 1)),
           (1, 'gamma', CURRENT_DATE()),
           (2, 'delta', CURRENT_DATE()),
           (3, 'epsilon', CURRENT_DATE());
      5) 分区列表包含 dt=CURRENT_DATE()，规则「RuleA」为字段 id 的唯一性校验
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新增单表规则任务，选择 test_table_none_c0002、id 和已有分区 dt=CURRENT_DATE()
        expected: 监控对象区域显示已有分区 dt=CURRENT_DATE()
      - action: 保存规则并点击【立即执行】，再打开校验结果详情
        expected: 任务状态为「运行成功」，id 唯一性结果为「达标」，异常记录数为 0
    tags:
      - 数据质量
      - 规则任务管理
      - 分区
      - 唯一性

  - case_id: C0003
    title: 验证【规则任务管理】-【动态分区】双分区字段动态分区执行规则，实例分区值为前一日与当日且任务运行成功
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0003;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0003 (
           id BIGINT,
           amount DECIMAL(10,2),
           factory_date STRING,
           sale_date STRING
         ) PARTITIONED BY (factory_date, sale_date);
         INSERT INTO ${SchemaA}.test_table_none_c0003 PARTITION (factory_date, sale_date)
         SELECT 1, CAST(100 AS DECIMAL(10,2)), date_format(date_sub(current_date(), 1), 'yyyy-MM-dd'), date_format(date_sub(current_date(), 1), 'yyyy-MM-dd')
         UNION ALL
         SELECT 2, CAST(200 AS DECIMAL(10,2)), date_format(date_sub(current_date(), 1), 'yyyy-MM-dd'), date_format(current_date(), 'yyyy-MM-dd')
         UNION ALL
         SELECT 3, CAST(300 AS DECIMAL(10,2)), date_format(current_date(), 'yyyy-MM-dd'), date_format(current_date(), 'yyyy-MM-dd');
      5) 规则「RuleA」为字段 amount 的金额非空校验，规则任务「TaskA」支持动态分区
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 新增规则任务「TaskA」，选择 test_table_none_c0003、amount 和「动态分区」
        expected: 分区配置展示 factory_date、sale_date 两个动态日期字段
      - action: 保存规则并点击【立即执行】，打开实例详情
        expected: 实例分区值为前一日和当日日期，任务状态为「运行成功」
    tags:
      - 数据质量
      - 规则任务管理
      - 分区
      - 动态分区

  - case_id: C0004
    title: 验证【规则任务管理】-【多表唯一性】执行表关系为且的唯一性规则，两张表结果均为达标
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建源表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004_source_01 (
           customer_id BIGINT
         ) DISTRIBUTED BY HASH(customer_id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0004_source_01 VALUES (1001), (1002), (1003);
      5) 在 ${SchemaA} 创建对比表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0004_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0004_comparison_01 (
           customer_id BIGINT
         ) DISTRIBUTED BY HASH(customer_id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0004_comparison_01 VALUES (1001), (1002), (1003);
      6) 规则任务「TaskA」的字段逻辑为「唯一」，表关系为「且」，对比表为 test_table_none_c0004_comparison_01
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 打开规则任务「TaskA」详情并查看监控规则
        expected: 展示 test_table_none_c0004_source_01.customer_id、test_table_none_c0004_comparison_01.customer_id 和「唯一 且 唯一」关系
      - action: 点击【立即执行】并打开校验结果详情
        expected: 两张表的唯一性结果均为「达标」，异常记录数为 0
    tags:
      - 数据质量
      - 规则任务管理
      - 多表唯一性
      - 规则详情

