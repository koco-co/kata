      3) 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建源表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005_source_01 (
           customer_id BIGINT
         ) DISTRIBUTED BY HASH(customer_id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0005_source_01 VALUES (1001), (1002), (1003);
      5) 在 ${SchemaA} 创建对比表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0005_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0005_comparison_01 (
           customer_id BIGINT
         ) DISTRIBUTED BY HASH(customer_id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0005_comparison_01 VALUES (1001), (1001), (1003);
