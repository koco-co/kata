  - case_id: C0014
    title: 验证【规则任务管理】-【抽样】执行开启抽样的规则任务，执行日志显示读取10行(抽样数量10)
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 使用以下 Shell 脚本生成 test_table_none_c0014.sql：
         #!/usr/bin/env bash
         set -euo pipefail
         output_file="test_table_none_c0014.sql"
         schema='${SchemaA}'
         table="${schema}.test_table_none_c0014"
         {
           printf 'DROP TABLE IF EXISTS %s;\n' "${table}"
           printf 'CREATE TABLE IF NOT EXISTS %s (order_id BIGINT);\n' "${table}"
           printf 'INSERT INTO %s VALUES\n' "${table}"
           for ((id=1; id<=100; id++)); do
             separator=','
             if (( id == 100 )); then separator=';'; fi
             printf "(%d)%s\n" "${id}" "${separator}"
           done
         } > "${output_file}"
      5) 复制 test_table_none_c0014.sql 的内容，在 ${DataSourceA} 对应平台或底层执行
      6) 规则任务「TaskA」配置完整性校验，抽样方式为开启，抽样数量为 10
