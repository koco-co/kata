  - case_id: C0007
    title: 验证【规则任务管理】-【规则克隆】克隆规则任务并修改字段，克隆任务配置新字段且原任务不变
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0007;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0007 (
           order_id BIGINT,
           amount DECIMAL(10,2)
         ) DISTRIBUTED BY HASH(order_id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0007 VALUES
           (1, CAST(100.00 AS DECIMAL(10,2))),
           (2, CAST(200.00 AS DECIMAL(10,2))),
           (3, CAST(300.00 AS DECIMAL(10,2)));
      5) 规则任务「TaskA」包含 order_id 唯一性规则，任务状态为「启用」
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 对规则任务「TaskA」点击【克隆】，将克隆任务名称改为「TaskB」并把字段改为 amount
        expected: 克隆编辑页回显原任务配置，保存后 Toast提示:「保存成功」
      - action: 分别打开「TaskA」和「TaskB」详情
        expected: 「TaskA」仍配置 order_id，「TaskB」配置 amount，两个任务状态均为「启用」
    tags:
      - 数据质量
      - 规则任务管理
      - 克隆

  - case_id: C0008
    title: 验证【规则任务管理】-【规则编辑】编辑校验关系并保存，规则关系更新为允许重复或允许重复
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：Doris3.x
      3) 存在数据库：${SchemaA}
      4) 在 ${SchemaA} 创建源表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0008_source_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0008_source_01 (
           customer_id BIGINT
         ) DISTRIBUTED BY HASH(customer_id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0008_source_01 VALUES (1001), (1002), (1003);
      5) 在 ${SchemaA} 创建对比表：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_none_c0008_comparison_01;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_none_c0008_comparison_01 (
           customer_id BIGINT
         ) DISTRIBUTED BY HASH(customer_id) BUCKETS 3;
         INSERT INTO ${SchemaA}.test_table_none_c0008_comparison_01 VALUES (1001), (1002), (1003);
      6) 规则任务「TaskA」当前关系为「唯一 且 唯一」
    steps:
      - action: 进入【数据质量 → 规则任务管理】页面
        expected: 进入成功
      - action: 编辑规则任务「TaskA」，将字段逻辑改为「允许重复」，关系改为「或」并点击【保存】
        expected: Toast提示:「保存成功」，规则详情显示「允许重复 或 允许重复」
      - action: 重新打开「TaskA」详情
        expected: 规则关系仍为「允许重复 或 允许重复」，未恢复为旧配置
    tags:
      - 数据质量
      - 规则任务管理
      - 规则编辑
      - 多表唯一性

  - case_id: C0009
    title: 验证【规则任务管理】-【必填校验】新建唯一性校验缺少字段逻辑，保存按钮禁用且置红提示(选择关系且)
