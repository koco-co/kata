meta:
  title: json格式校验导出支持勾选导出
  feature_id: quality-json-format-selected-export
  requirement_id: "16019"
  case_module_id: ""
  exports:
    - json格式校验导出支持勾选导出.xmind
cases:
  - case_id: C0001
    automation:
      spec_file: c0001-export-selected-json-records.spec.ts
    title: 验证【JSON格式校验管理】-【勾选导出】导出勾选记录，导出文件仅含勾选行
    priority: P0
    precondition: |-
      1) JSON格式校验管理列表存在一层级记录「exportA」，中文名称为「导出测试A」，数据源类型为「SparkThrift2.x」
      2) JSON格式校验管理列表存在一层级记录「exportB」，中文名称为「导出测试B」，数据源类型为「SparkThrift2.x」
      3) JSON格式校验管理列表存在一层级记录「exportC」，中文名称为「导出测试C」，数据源类型为「SparkThrift2.x」
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 查看列表选择控件和顶部操作区
        expected: 表头展示全选复选框，每行展示复选框，顶部展示「导入」「导出」「新增」按钮
      - action: 勾选「exportA」「exportB」，保持「exportC」未勾选
        expected: 「exportA」「exportB」为选中态，「exportC」为未选中态，选中计数为2
      - action: 点击「导出」并在确认弹窗中确认导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对记录
        expected: 文件包含「exportA」「exportB」两条记录，不包含「exportC」
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0002
    title: 验证【JSON格式校验管理】-【勾选导出】不勾选记录直接导出，导出文件含当前筛选全量记录
    priority: P0
    precondition: |-
      1) JSON格式校验管理列表存在记录「exportAllA」「exportAllB」
      2) 页面初始状态未选中任何记录
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 查看未勾选记录时的「导出」按钮
        expected: 「导出」按钮可点击
      - action: 不勾选记录，点击「导出」并在确认弹窗中确认导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并与当前筛选结果核对
        expected: 文件包含当前筛选结果中的全部记录
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0003
    title: 验证【JSON格式校验管理】-【勾选导出】导出单条一层级记录，导出文件仅含该条记录
    priority: P1
    precondition: |-
      1) JSON格式校验管理列表存在一层级记录「singleExport」
      2) 该记录中文名称为「单行导出」，value格式为「^\d+$」，数据源类型为「SparkThrift2.x」
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 仅勾选「singleExport」
        expected: 仅「singleExport」为选中态，选中计数为1
      - action: 点击「导出」并在确认弹窗中确认导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对记录
        expected: 文件仅包含一条记录，key为「singleExport」，中文名称为「单行导出」，value格式为「^\d+$」，数据源类型为「SparkThrift2.x」
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0004
    title: 验证【JSON格式校验管理】-【勾选导出】表头全选后导出，导出文件含当前列表全量记录
    priority: P1
    precondition: |-
      1) JSON格式校验管理列表当前页存在3条记录「selectAllA」「selectAllB」「selectAllC」
      2) 当前筛选结果不超过单页容量
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 点击表头全选复选框
        expected: 当前页3条记录均为选中态，选中计数为3
      - action: 点击「导出」并在确认弹窗中确认导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对记录
        expected: 文件包含「selectAllA」「selectAllB」「selectAllC」且记录数为3
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0005
    title: 验证【JSON格式校验管理】-【勾选导出】勾选父节点并导出，子节点自动级联进入导出文件
    priority: P1
    precondition: |-
      1) JSON格式校验管理列表存在一层级记录「parentExport」
      2) 「parentExport」下存在二层级记录「childExport」
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 展开「parentExport」并勾选「parentExport」「childExport」
        expected: 父子两条记录均为选中态，选中计数为2
      - action: 点击「导出」并在确认弹窗中确认导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对记录
        expected: 文件包含「parentExport」「childExport」两条记录
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0006
    title: 验证【JSON格式校验管理】-【勾选导出】导出记录并核对文件表头，列结构与顺序完整
    priority: P1
    precondition: |-
      1) JSON格式校验管理列表存在记录「columnExport」
      2) 该记录的创建人、创建时间、更新人和更新时间均有值
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 勾选「columnExport」并执行导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对表头
        expected: 表头依次为「key、中文名称、value格式、数据源类型、创建人、创建时间、更新人、更新时间、层级关系、父Key」，无缺列和多余列
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0007
    title: 验证【JSON格式校验管理】-【勾选导出】导出五层级记录并核对层级字段，层级关系与父Key取值正确
    priority: P1
    precondition: |-
      1) JSON格式校验管理列表存在一层级记录「lvl1」
      2) 「lvl1」下依次存在「lvl2」「lvl3」「lvl4」「lvl5」四级子记录
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 逐层展开「lvl1」至「lvl5」并勾选五条记录
        expected: 「lvl1」「lvl2」「lvl3」「lvl4」「lvl5」均为选中态，选中计数为5
      - action: 点击「导出」并在确认弹窗中确认导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对层级字段
        expected: |-
          1) lvl1：层级关系为「一层」，父Key为空
          2) lvl2：层级关系为「二层」，父Key为「lvl1」
          3) lvl3：层级关系为「三层」，父Key为「lvl2」
          4) lvl4：层级关系为「四层」，父Key为「lvl3」
          5) lvl5：层级关系为「五层」，父Key为「lvl4」
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0008
    title: 验证【JSON格式校验管理】-【勾选导出】导出三种数据源类型记录，文件数据源类型列依次为SparkThrift2.x、Hive2.x、Doris3.x
    priority: P1
    precondition: |-
      1) JSON格式校验管理列表存在记录「keySpark」，数据源类型为「SparkThrift2.x」
      2) JSON格式校验管理列表存在记录「keyHive」，数据源类型为「Hive2.x」
      3) JSON格式校验管理列表存在记录「keyDoris」，数据源类型为「Doris3.x」
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 勾选「keySpark」「keyHive」「keyDoris」并执行导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对数据源类型
        expected: 「keySpark」「keyHive」「keyDoris」的数据源类型依次为「SparkThrift2.x」「Hive2.x」「Doris3.x」
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
  - case_id: C0009
    title: 验证【JSON格式校验管理】-【勾选导出】搜索后勾选导出，导出文件仅含搜索结果中勾选的行
    priority: P2
    precondition: |-
      1) JSON格式校验管理列表存在记录「vehicle_a」「vehicle_b」「department_a」
    steps:
      - action: 进入【数据质量 → 通用配置 → JSON格式校验管理】页面
        expected: 进入成功
      - action: 在搜索框输入「vehicle」并执行查询
        expected: 列表展示「vehicle_a」「vehicle_b」，不展示「department_a」
      - action: 仅勾选「vehicle_a」并执行导出
        expected: 浏览器下载导出文件
      - action: 打开导出文件并核对记录
        expected: 文件仅包含「vehicle_a」，不包含「vehicle_b」「department_a」
    tags:
      ["数据质量", "通用配置", "JSON格式校验管理"]
