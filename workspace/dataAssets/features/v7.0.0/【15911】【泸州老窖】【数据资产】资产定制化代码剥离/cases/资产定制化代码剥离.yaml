  - requirement_id: '13188'
    title: 验证【分级数据】-【表级别】修改字段等级后重新查询表级别分级结果，表级安全/隐私等级重新计算(字段等级 ≠ 原等级)
    priority: P0
    source_ref: TP-125
    case_id: C0362
    precondition: |-
      1) UserA 为管理员主流程账号，已授予分级数据查看与操作权限
      2) 数据级别 L2、L3、P1、P2 已存在
      3) L3 高于 L2，P2 高于 P1（此处仅为数据级别名称，不是账号等级）
      4) 授权数据源：${DataSourceA}
      5) 数据源类型：SparkThrift2.x
      6) 存在数据库：${SchemaA}
      7) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_13188_c0362;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_13188_c0362 (code STRING, amount DECIMAL(10,2));
         INSERT INTO ${SchemaA}.test_table_13188_c0362 VALUES ('C001',100.00),('C002',200.00);
      8) test_table_13188_c0362 已同步至数据地图
      9) 字段等级：code 安全 L2/隐私 P1，amount 安全 L3/隐私 P2
      10) 表级别分级结果已生成：test_table_13188_c0362 安全等级 L3、隐私等级 P2
      11) 分级结果创建步骤（保证第 9、10 条成立）：
          a. 在【级别管理】确认安全级别 L2/L3、隐私级别 P1/P2 已存在
          b. 进入【分级数据】，安全等级目录下将 code 手动分级为 L2、amount 手动分级为 L3
          c. 隐私等级目录下将 code 手动分级为 P1、amount 手动分级为 P2
          d. 按「表」检索 test_table_13188_c0362，确认表级安全 L3、隐私 P2
    steps:
      - action: 进入【数据安全 → 数据分级分类 → 分级数据】页面
        expected: 进入成功
      - action: 将检索类型切换为「表」，搜索 test_table_13188_c0362
        expected: 表级别结果展示 test_table_13188_c0362，安全等级 L3、隐私等级 P2
      - action: 切换等级目录为「安全等级」，检索字段 amount，将安全等级由 L3 修改为 L2 并保存
        expected: 保存成功，amount 安全等级展示为 L2
      - action: 切换等级目录为「隐私等级」，检索字段 amount，将隐私等级由 P2 修改为 P1 并保存
        expected: 保存成功，amount 隐私等级展示为 P1
      - action: 将检索类型切换为「表」，重新搜索 test_table_13188_c0362
        expected: 表级安全等级更新为 L2，表级隐私等级更新为 P1
      - action: 刷新页面后再次按「表」检索 test_table_13188_c0362
        expected: 表级安全等级保持 L2，表级隐私等级保持 P1，与字段等级一致
    tags:
      - 数据安全
      - 数据分级分类
      - 分级数据

