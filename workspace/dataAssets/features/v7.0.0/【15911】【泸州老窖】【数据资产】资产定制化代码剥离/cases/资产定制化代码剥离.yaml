    2) 授权数据源：${DataSourceA}
    3) 数据源类型：SparkThrift2.x
    4) 存在数据库：${SchemaA}
    5) 使用以下 Shell 脚本生成 prepare_13925_c0332.sql（生成 801 张 L4 表，该表为空表）：
       #!/usr/bin/env bash
       set -euo pipefail
       output_file="prepare_13925_c0332.sql"
       schema='${SchemaA}'
       prefix='test_table_13925_c0332'
       : > "$output_file"
       for ((i = 1; i <= 801; i++)); do
         table="${schema}.${prefix}_$(printf '%04d' "$i")"
         printf 'DROP TABLE IF EXISTS %s;\n' "$table" >> "$output_file"
         printf 'CREATE TABLE IF NOT EXISTS %s (id BIGINT);\n' "$table" >> "$output_file"
       done
