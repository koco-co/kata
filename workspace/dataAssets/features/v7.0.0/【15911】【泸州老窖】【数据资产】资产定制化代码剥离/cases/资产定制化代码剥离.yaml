cases:
  - requirement_id: '13183'
    title: 验证【属性编辑】编辑枚举类标准属性，仅可修改中文名、枚举值与必填且已用枚举值删除后标准记录值清空
    priority: P1
    precondition: |-
      1) 标准属性管理列表已存在枚举属性_01（值 a、b）、STRING文本属性_01、BIGINT文本属性_01 和树形目录属性_01
         a. 枚举属性_01 创建方式：进入【数据标准 → 标准管理 → 标准属性管理】，点击【新增属性】，配置属性名 enum_13183_01、属性中文名 枚举属性_01、属性类型 枚举、选项 a、b、是否必填 非必填，点击【确定】
         b. STRING文本属性_01 创建方式：点击【新增属性】，配置属性名 string_13183_01、属性中文名 STRING文本属性_01、属性类型 文本框、字段类型 string、是否必填 非必填，点击【确定】
         c. BIGINT文本属性_01 创建方式：点击【新增属性】，配置属性名 bigint_13183_01、属性中文名 BIGINT文本属性_01、属性类型 文本框、字段类型 bigint、是否必填 非必填，点击【确定】
         d. 树形目录属性_01 创建方式：点击【新增属性】，配置属性名 tree_13183_01、属性中文名 树形目录属性_01、属性类型 树形目录、编辑目录添加根节点与子节点、是否必填 非必填，点击【确定】
      2) 标准记录 StandardA 已关联这些属性
         a. 创建方式：进入【数据标准 → 标准管理 → 标准定义】，点击【新增标准】，配置标准中文名称 StandardA、标准英文名称 StandardB、标准英文缩写 STD01、标准编码 STD_13183_01、标准目录 CatalogA、标准负责人 user_001、标准责任公司 泸州老窖、标准责任部门 数据资产部，枚举属性_01 选择 a，点击【保存】
      3) 已发布 L3 目录 CatalogA 已存在
         a. 创建方式：进入【元数据 → 数据目录 → 目录管理】，依次新建并发布 CatalogRoot、CatalogParent、CatalogA，目录必填项使用 数据资产部/泸州老窖/张三/1001/在职，L3 数据管家使用 李四/2001/在职
    steps:
      - action: 进入【数据标准 → 标准管理 → 标准属性管理】页面
        expected: 进入成功
      - action: |-
          1）进入【数据标准 → 标准管理 → 标准属性管理】页面
          2）选择【枚举属性_01-枚举类数据类型】，点击【编辑】按钮
        expected: |-
          1）仅支持修改属性中文名、枚举值、是否必填信息
          2）枚举值删除弹二次弹窗确认信息
      - action: |-
          1）进入【数据标准 → 标准管理 → 标准属性管理】页面
          2）选择【枚举属性_01-枚举类数据类型】，点击【编辑】按钮
          3）删除枚举属性_01中枚举值a,二次弹窗确认删除
          4）点击确定按钮保存
        expected: 已使用枚举值 a 的标准记录清空该属性值且属性列仍保留
      - action: |-
          1）进入【数据标准 → 标准管理 → 标准属性管理】页面
          2）选择【STRING文本属性_01-文本框类数据类型】，点击【编辑】按钮
        expected: 1）仅支持修改属性中文名、是否必填信息
    source_ref: TP-030
    case_id: C0174
    tags:
      - 数据标准
      - 标准管理
      - 标准属性管理
  - requirement_id: '13183'
