cases:
  - requirement_id: '13176'
    title: 验证【编码管理】-【编码值自增】新增目录触发编码自增，L1当前编码值由99进位为BD100
    priority: P2
    precondition: |-
      1) 编码配置包含 L1 前缀 BD、起始码 1、结束码 99、当前值 99
      2) L2/L3/L4/L5 和数据标准配置独立前缀
      3) 目录L1_01、目录L2_01、目录L3_01已存在。
    steps:
      - action: 进入【平台管理 → 编码管理】页面
        expected: 进入成功
      - action: '1）L1当前编码值为99；

          2）新增L1目录；

          3）再次查看L1当前编码值'
        expected: L1当前编码值为BD100
    source_ref: TP-001
    case_id: C0001
    tags:
      - 平台管理
      - 编码管理
  - requirement_id: '13176'
    title: 验证【编码管理】-【编码值自增】元数据同步与建删表操作，L4当前编码值随表数增加且L5随字段数增加
    priority: P0
    precondition: |-
      1) 编码配置包含 L1 前缀 BD、起始码 1、结束码 99、当前值 99
      2) L2/L3/L4/L5 和数据标准配置独立前缀
      3) 目录L1_01、目录L2_01、目录L3_01已存在。
    steps:
      - action: 进入【平台管理 → 编码管理】页面
        expected: 进入成功
      - action: '1）记录L4和L5的当前编码值

          2）通过元数据同步，同步2张新表（每张表3个字段）；

          3）查看编码列表，L4和L5的当前编码值'
        expected: '1）L4的当前编码值+2；

          2）L5的当前编码值+(2*3)'
      - action: '1）通过元数据同步，同步2张已同步的表（每张表3个字段）；

          2）查看编码列表，L4和L5的当前编码值'
        expected: L4和L5的当前编码值不变
      - action: '1）通过元数据同步，同步2张已同步的表:

          - 有且仅有一张表与上次同步相比，新增了2个字段

          2）查看编码列表，L4和L5的当前编码值'
        expected: '1）L4的当前编码值不变；

          2）L5的当前编码值+2'
      - action: '1）通过数据地图批量删除2张表（每张表3个字段）；

          2）查看编码列表，L4和L5的当前编码值'
        expected: L4和L5的当前编码值不变
      - action: '1）通过表详情页删除表（每张表3个字段）；

          2）查看编码列表，L4和L5的当前编码值'
        expected: L4和L5的当前编码值不变
      - action: '1）通过数据模型创建（审批通过）2张表（每张表3个字段）；

          2）查看编码列表，L4和L5的当前编码值'
        expected: '1）L4的当前编码值+2；

          2）L5的当前编码值+(2*3)'
      - action: '1）通过数据模型编辑一张表，添加了2个字段:

          2）查看编码列表，L4和L5的当前编码值'
        expected: '1）L4的当前编码值不变；

          2）L5的当前编码值+2'
      - action: '1）通过数据模型删除2张表（每张表3个字段）；

          2）查看编码列表，L4和L5的当前编码值'
        expected: L4和L5的当前编码值不变
      - action: '1）通过离线任务创建2张表（每张表3个字段）；

          2）查看编码列表，L4和L5的当前编码值'
        expected: '1）L4的当前编码值+2；

          2）L5的当前编码值+(2*3)'
      - action: '1）通过离线任务ALTER一张表（该表已同步至资产数据地图），添加了2个字段:

          2）查看编码列表，L4和L5的当前编码值'
        expected: '1）L4的当前编码值不变；

          2）L5的当前编码值+2'
      - action: '1）通过离线任务删除（drop）2张表（每张表3个字段，且已同步至资产数据地图）；

          2）查看编码列表，L4和L5的当前编码值'
        expected: L4和L5的当前编码值不变
    source_ref: TP-001
    case_id: C0002
    tags:
      - 平台管理
      - 编码管理
