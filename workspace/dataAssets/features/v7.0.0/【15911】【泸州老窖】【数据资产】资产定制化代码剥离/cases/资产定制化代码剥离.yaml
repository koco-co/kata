    title: 验证【码表管理】-【导入】导入代码文件，错误文件错误原因列定位必填、长度与编码重复等原因(文件数据 = 无效)
    priority: P1
    precondition: |-
      1) 码表目录 CatalogB 已存在
         a. 创建方式：进入【数据标准 → 标准基础 → 码表管理】，在目录树点击新增，目录名称 CatalogB，保存
      2) 手工码表 code_table_01 已存在（CatalogB 下，内容 A01/启用/可用、A02/停用/不可用、A03/冻结/空）
         a. 创建方式：点击【新增】，配置码表名称 code_table_01、编码 CODE_01、所属目录 CatalogB、码表内容手动添加，添加 A01/启用/可用、A02/停用/不可用、A03/冻结/空，点击【确定】
      3) 创建导入文件 code_table_c0192_required.xlsx：
        Sheet: Sheet1
        Title: 代码,* 代码值,* 代码名称,代码说明,上级代码,状态
        Line1: C001,A01,,可用,A02,有效
        Line2: C002,,,不可用,空,无效
      4) 创建导入文件 code_table_c0192_length.xlsx：
        Sheet: Sheet1
        Title: 代码,* 代码值,* 代码名称,代码说明,上级代码,状态
        Line1: C001,A01,256个字符值,可用,A02,有效
        （代码名称单元格实际填写 256 个字符）
      5) 创建导入文件 code_table_c0192_missing_col.xlsx：
        Sheet: Sheet1
        Title: 代码,* 代码值,代码说明,上级代码,状态
        Line1: C001,A01,可用,A02,有效
      6) 创建导入文件 code_table_c0192_duplicate.xlsx：
        Sheet: Sheet1
        Title: 代码,* 代码值,* 代码名称,代码说明,上级代码,状态
        Line1: C001,A01,启用,可用,A02,有效
        Line2: C002,A01,启用_2,可用_2,A02,有效
      7) 创建导入文件 code_table_c0192_unmatched.xlsx：
        Sheet: Sheet1
        Title: 代码,* 代码值,* 代码名称,代码说明,上级代码,状态
        Line1: C999,A01,启用,可用,A02,有效
      8) 创建导入文件 code_table_c0192_valid.xlsx：
        Sheet: Sheet1
        Title: 代码,* 代码值,* 代码名称,代码说明,上级代码,状态
        Line1: C001,A01,启用,可用,A02,有效
        Line2: C002,A02,停用,不可用,空,无效
        Line3: C003,A03,冻结,空,空,有效
    steps:
      - action: 进入【数据标准 → 标准基础 → 码表管理】页面
        expected: 进入成功
      - action: 点击【导入】，目录选择 CatalogB，上传 code_table_c0192_required.xlsx，点击【确定】
        expected: 弹出「代码导入失败」弹窗，正文「导入表格中存在错误数据，请检查后再导入，点击此处导出错误数据。」
      - action: 点击弹窗中导出错误数据的入口并打开错误文件
        expected: '错误文件含「代码管理」「编码管理」两个sheet且末尾各增加「错误原因」列；未填写的必填字段在错误原因列以「必填项未填写: [代码名称,编码名称]」形式展示'
      - action: 点击【导入】，目录选择 CatalogB，上传 code_table_c0192_length.xlsx，点击【确定】，再导出错误文件
        expected: '错误文件错误原因列展示「填写数据字符超限: [对应字段]」'
      - action: 点击【导入】，目录选择 CatalogB，上传 code_table_c0192_missing_col.xlsx，点击【确定】，再导出错误文件
        expected: '错误文件错误原因列展示「缺少必填列: [代码名称]」'
      - action: 点击【导入】，目录选择 CatalogB，上传 code_table_c0192_duplicate.xlsx，点击【确定】，再导出错误文件
        expected: 错误文件错误原因列展示「编码取值重复;」
      - action: 点击【导入】，目录选择 CatalogB，上传 code_table_c0192_unmatched.xlsx，点击【确定】，再导出错误文件
        expected: 错误文件错误原因列展示「代码编号信息无法匹配已有编码，若为新增标准需清空代码编号;」
      - action: 点击【导入】，目录选择 CatalogA（不存在），上传 code_table_c0192_valid.xlsx，点击【确定】
        expected: 导入被阻断，提示「未找到目录：CatalogA」，不进入导入结果处理
