- requirement_id: '16178'
  case_id: C0262
  title: 验证「数据权限分配」配置行级权限的交互逻辑
  priority: P1
  precondition: |-
    1) 当前用户具有数据权限分配权限。
    2) 已选择支持 DQL 行级权限的表 ${TableA}，表中包含字段 col1、col2、col3。
  steps:
  - action: 点击【配置行级权限】
    expected: |-
      1) 显示数据表行级权限配置弹窗
      2) 「规则关系」提供「且」「或」两个单选项，默认选中「且」
      3) 「选择字段」下拉项包含所选表的全部字段
      4) 「操作符」下拉项包含「=」「!=」「包含」「正则」「in」「not in」「null」
      5) 展示条件值输入框
  - action: |-
      配置以下多条权限关系后点击【确定】：
      col1 = value1 and col2 in (value2,value3) and col3 is null
    expected: 弹窗关闭
  - action: 再次打开配置弹窗，删除「col3 is null」条件后点击【确定】
    expected: 弹窗关闭
  - action: 点击行级权限条件区域的【+】
    expected: 下方新增一组条件组件
  - action: 点击某组条件的【删除】图标
    expected: 删除当前条件组件
  - action: 连续添加条件，尝试生成超过 5 组条件
    expected: 提示最多只支持 5 组条件
  - action: 将某组条件的操作符选择为「null」
    expected: 该条件右侧输入框不可编辑
  - action: 在条件值输入框中输入超过 200 个字符
    expected: 提示输入超限
  tags:
  - 数据安全
  - 数据权限管理
  - 行级权限
  source_ref: T24
- requirement_id: '16178'
  case_id: C0263
  title: 验证行级权限的各类过滤条件在数据预览中生效
  priority: P1
  precondition: |-
    1) 当前用户具有数据权限分配权限。
    2) 表 ${TableA} 支持 DQL 行级权限，且 col1、col2 中存在覆盖 value1、value2、其他值及 NULL 的测试数据。
  steps:
  - action: 在「数据权限分配」中配置行级权限「col1 = value1」，然后在「元数据-数据地图」预览表 ${TableA}
    expected: 只显示符合「col1 = value1」条件的数据
  - action: 将行级权限修改为「col1 != value1」，然后预览表 ${TableA}
    expected: 只显示符合「col1 != value1」条件的数据
  - action: 将行级权限修改为「col1 包含 value1」，然后预览表 ${TableA}
    expected: 只显示符合「col1 like '%value1%'」条件的数据
  - action: 将行级权限修改为正则条件「col1 REGEXP '^value1'」，然后预览表 ${TableA}
    expected: 只显示符合「col1 REGEXP '^value1'」条件的数据
  - action: 将行级权限修改为「col1 in ('value1','value2')」，然后预览表 ${TableA}
    expected: 只显示符合「col1 in ('value1','value2')」条件的数据
  - action: 将行级权限修改为「col1 not in ('value1','value2')」，然后预览表 ${TableA}
    expected: 只显示符合「col1 not in ('value1','value2')」条件的数据
  - action: 将行级权限修改为「col1 is null」，然后预览表 ${TableA}
    expected: 只显示符合「col1 is null」条件的数据
  - action: 将规则关系设为「且」，配置「col1 in ('value1','value2')」与「col2 is null」，然后预览表 ${TableA}
    expected: 只显示同时符合「col1 in ('value1','value2') and col2 is null」条件的数据
  - action: 将规则关系设为「或」，配置「col1 in ('value1','value2')」与「col2 is null」，然后预览表 ${TableA}
    expected: 只显示符合「col1 in ('value1','value2') or col2 is null」条件的数据
  tags:
  - 数据安全
  - 数据权限管理
  - 行级权限
  source_ref: T24
