      2）查看编码列表，L1/L2/L3的当前编码值'
    expected: L1/L2/L3的当前编码值不变
  - action: '1）在「元数据」-「数据目录」-「目录管理」页面，删除2个L1/L2/L3目录；

      2）查看编码列表，L1/L2/L3的当前编码值'
    expected: L1/L2/L3的当前编码值不变
  source_ref: TP-002
  case_id: C0003
