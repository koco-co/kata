    title: 验证【码表管理】-【导出】默认导出全部或按目录导出代码，导出文件列头与模版一致且命名规范
    priority: P1
    precondition: |-
      1) 码表目录 CatalogA、CatalogB 已存在
         a. 创建方式：进入【数据标准 → 标准基础 → 码表管理】，在目录树依次点击新增，目录名称 CatalogA、CatalogB，分别保存
      2) 手工码表 code_table_01 已存在（CatalogB 下，内容 A01/启用/可用、A02/停用/不可用、A03/冻结/空）
         a. 创建方式：点击【新增】，配置码表名称 code_table_01、编码 CODE_01、所属目录 CatalogB、码表内容手动添加，添加 A01/启用/可用、A02/停用/不可用、A03/冻结/空，点击【确定】
      3) 手工码表 code_table_02 已存在（CatalogA 下，内容 B01/启用/可用、B02/停用/不可用）
         a. 创建方式：点击【新增】，配置码表名称 code_table_02、编码 CODE_02、所属目录 CatalogA、码表内容手动添加，添加 B01/启用/可用、B02/停用/不可用，点击【确定】
