- requirement_id: '13176'
  title: 验证【编码管理】-【重置】删除并重建L3目录，重建后目录与数据表关联关系不恢复
  priority: P2
  precondition: '1) 使用 UserA，已授予目录管理和数据地图操作权限

    2) 已发布 L3 目录 CatalogA 的编码为 BO0001，已同步表 test_table_13176_c0004_01 仅关联 CatalogA

    3) 已发布 L3 目录 CatalogB 的编码为 BO0002，已同步表 test_table_13176_c0004_02 未关联 CatalogB'
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: 删除数据地图中的 test_table_13176_c0004_01 和 test_table_13176_c0004_02
    expected: 两张表从数据地图移除，CatalogA 不再展示已删除表
  - action: 重新同步 test_table_13176_c0004_01 和 test_table_13176_c0004_02 至数据地图
    expected: 无法通过目录 CatalogA 查询到表
  - action: 将 test_table_13176_c0004_01 和 test_table_13176_c0004_02 与目录 CatalogB 关联
    expected: 关联成功，并可以通过目录 CatalogB 查询到表
  - action: 删除所有 L3 目录
    expected: 所有 L3 目录与数据表/数据标准的关联关系被删除
  - action: 重新创建目录 CatalogC（编码为 BO0002）
    expected: 无法通过目录 CatalogC 查询到表
  - action: 将 test_table_13176_c0004_01 和 test_table_13176_c0004_02 与目录 CatalogC 关联
    expected: 关联成功，并可以通过目录 CatalogC 查询到表
  source_ref: TP-004
  case_id: C0004
  tags:
  - 平台管理
  - 编码管理
- requirement_id: '13176'
  title: 验证【编码管理】-【重置】重置无未删除数据的编码，弹窗提示后编码信息重置为初始值
  priority: P1
  precondition: '1) 使用 UserA，已授予编码管理查看和重置权限

    2) 目标编码对象存在历史失效数据，但不存在任何当前生效业务数据

    3) 已记录重置前的前缀、流水位、起止码和当前资产编码值'
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: 点击「重置」
    expected: 弹窗标题：「确认要重置编码"<编码类别>"吗？」；弹窗说明：「重置后将对资产数据进行重新编码，对已经删除的资产数据不会进行数据库保留，请谨慎操作。」；操作按钮文案为「重置」
  - action: 点击「重置」
    expected: 弹窗关闭，Toast提示:「重置成功」
  - action: 查看重置后的编码
    expected: '1) 前缀：重置为初始值

      2) 流水位数：重置为初始值

      3) 起始码/结束码：重置为初始值

      4) 当前资产编码值：重置为 0，数值位为 0'
  source_ref: TP-003
  case_id: C0005
  tags:
  - 平台管理
  - 编码管理
- requirement_id: '13176'
  title: 验证【编码管理】-【重置】重置存在未删除数据的编码，弹窗提示不可重置且不触发重置
  priority: P1
  precondition: '1) 使用 UserA，已授予编码管理查看和重置权限

    2) 目标编码对象仍存在至少 1 条当前生效业务数据

    3) 已记录重置前当前资产编码值'
