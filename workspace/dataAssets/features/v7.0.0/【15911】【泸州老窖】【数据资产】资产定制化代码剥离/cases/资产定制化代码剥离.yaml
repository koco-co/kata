         b. STRING文本属性_01 创建方式：点击【新增属性】，配置属性名 string_13183_01、属性中文名 STRING文本属性_01、属性类型 文本框、字段类型 string、是否必填 非必填，点击【确定】
         c. BIGINT文本属性_01 创建方式：点击【新增属性】，配置属性名 bigint_13183_01、属性中文名 BIGINT文本属性_01、属性类型 文本框、字段类型 bigint、是否必填 非必填，点击【确定】
         d. 树形目录属性_01 创建方式：点击【新增属性】，配置属性名 tree_13183_01、属性中文名 树形目录属性_01、属性类型 树形目录、编辑目录添加根节点与子节点、是否必填 非必填，点击【确定】
