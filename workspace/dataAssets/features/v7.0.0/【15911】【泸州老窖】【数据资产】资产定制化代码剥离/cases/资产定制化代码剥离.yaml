    title: 验证【标准定义】-【导入标准】导入含无效数据的标准文件，错误文件批注对应校验原因
    priority: P1
    precondition: |-
      1) 标准目录包含 L1_01→L2_01→L3_01
      2) 责任人 user_001、码表 code_table_01 与创建导入文件 standard_c0182.xlsx
        Sheet: Sheet1
        Title: * 标准编码,* 标准中文名,* 标准英文名,* 标准目录（L3）,数据类型,长度
        Line1: 取值, 取值, 取值, 取值, 取值, 取值。
    steps:
      - action: 进入【数据标准 → 标准定义】页面
        expected: 进入成功
      - action: 枚举值范围校验
        expected: 若填写信息无法匹配枚举，批注提示/报错信息为“填写数据不在枚举范围内”
      - action: 必填项校验
        expected: 必填项-若未填写批注提示/报错信息为“必填项未填写”
      - action: 字段类型校验
        expected: 若填写数据格式有误，批注提示/报错信息为“填写数据格式有误”
      - action: 字符长度校验
        expected: 若填写超过255字符，批注提示/报错信息为“填写数据字符超限”
      - action: 必填列校验
        expected: 若存在指定/2 个必填列被删除，则报错信息为“缺少必填列指定属性；指定属性”
      - action: 重复则覆盖-已发布校验
        expected: 选择了“重复则覆盖”选项，但是重复标准为“已发布”标准，需要备注报错信息为“已发布标准不可更新”
      - action: 编码信息匹配逻辑
        expected: 导入的编码若无法匹配到已有编码信息，批注提示/报错信息为“编码信息无法匹配已有编码，若为新增标准需清空编码值”
      - action: 中文名，英文名校验
        expected: 导入的标准中文名称、英文名称需要做重复性校验，批注提示/报错信息为“标准名称重复”
      - action: 错误原因展示逻辑
        expected: 在导出错误文件的最右侧增加“错误原因”一列，若同一行存在2 个报错内容，错误原因一列展示内容为中文分号拼接展示。
    source_ref: TP-032
    case_id: C0182
    tags:
      - 数据标准
      - 标准定义
