    requirement_id: '13925'
    title: 验证【L4导出】导出801行数据按800拆批，文件801行完整且记录耗时与180秒目标比较(行数 = 801)
    priority: P2
    source_ref: TP-069
    precondition: |-
      1) 使用 UserA，已授予数据地图查看与导出权限
      2) 授权数据源：${DataSourceA}
      3) 数据源类型：SparkThrift2.x
      4) 存在数据库：${SchemaA}
      5) 使用以下一次性 Bash 命令生成 prepare_13925_c0332.sql（生成 801 张 L4 表，该表为空表）：
      bash <<'BASH'
      set -euo pipefail
      output_file="prepare_13925_c0332.sql"
      schema='${SchemaA}'
      prefix='test_table_13925_c0332'
      : > "$output_file"
      for ((i = 1; i <= 801; i++)); do
        table="${schema}.${prefix}_$(printf '%04d' "$i")"
        printf 'DROP TABLE IF EXISTS %s;\n' "$table" >> "$output_file"
        printf 'CREATE TABLE IF NOT EXISTS %s (id BIGINT);\n' "$table" >> "$output_file"
      done
      BASH
      6) 复制 prepare_13925_c0332.sql 的内容，在 ${DataSourceA} 对应平台或底层执行
      7) 进入【元数据 → 元数据同步】，选择数据源 ${DataSourceA}、数据库 ${SchemaA}，执行元数据同步，将以上表同步至数据地图
      8) 表名前缀：test_table_13925_c0332_
    steps:
      - action: 进入【元数据 → 数据地图】页面
        expected: 进入成功
      - action: 查询结果类型选择「数据表」，数据源类型选择 SparkThrift2.x，数据表名称搜索 test_table_13925_c0332_
        expected: 列表展示 801 条 L4 数据表记录
      - action: 点击【导出】，导出维度选择 L4，导出数据源类型选择 SparkThrift2.x，点击【确定】
        expected: 导出任务创建成功；按 ≥800 拆批规则以 800 拆为 2 批（800+1），记录任务耗时并与 180 秒需求目标比较（环境指标，不作硬断言）
      - action: 下载导出文件并核对
        expected: 文件可打开，L4 sheet 数据行数为 801，按批拼接完整无截断、无重复，表头与字段完整
    tags:
      - 元数据
      - 数据地图
