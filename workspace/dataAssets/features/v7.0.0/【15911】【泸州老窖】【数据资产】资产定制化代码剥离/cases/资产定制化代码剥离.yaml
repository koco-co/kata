- requirement_id: '13176'
  title: 验证【编码管理】-【编码值自增】导入L1～L3目录各至编码上限减一，继续新建各触发编码用尽报错
  priority: P0
  source_ref: TP-002
  case_id: C0357
  precondition: |-
    1) 使用 UserA，已授予【平台管理 → 编码管理】查看权限、【目录管理】导入权限和【目录管理】新增权限

    2) L1 编码前缀 BD、流水位数 2、范围 BD01～BD99

    3) L2 编码前缀 SD、位数 3、范围 SD001～SD999

    4) L3 编码前缀 BO、位数 4、范围 BO0001～BO9999

    5) 创建前置上级目录前，L1/L2/L3 编码当前值均为 0（无任何 L1～L3 目录）

    6) 已创建并发布 L1 上级目录 CatalogA 与 L2 上级目录 CatalogB（位于其下），创建后 L1=BD01、L2=SD001、L3 数值位为 0

    7) 使用以下 Python 脚本生成 import_l1l2l3_boundary.xlsx（依赖 openpyxl，需先 pip install openpyxl。生成 L1 97 行、L2 997 行、L3 9998 行，编码列留空，L2/L3 上级分别填 CatalogA/CatalogB，枚举列填平台内已维护的值，脚本中 ENUM 按当前环境调整。脚本每行前导 2 空格为 YAML 块缩进占位，复制执行时去除）：
      ```python
      from openpyxl import Workbook
      ENUM = {"归属部门": "数据资产部", "所属公司": "泸州老窖", "数据责任人": "张三", "数据责任人工号": "1001", "数据责任人状态": "在职", "数据管家": "李四", "数据管家工号": "2001", "数据管家状态": "在职", "zuhu11": "zuhu11", "dasdsa": "dasdsa", "验证": "验证"}
      PARENT = {"L2": "CatalogA", "L3": "CatalogB"}
      PLAN = {"L1": 97, "L2": 997, "L3": 9998}
      HEADERS = {
          "L1": ["编码", "* 目录中文名称", "* 业务定义", "* 目录英文名称", "* 归属部门", "* 所属公司", "* 数据责任人", "* 数据责任人工号", "* 数据责任人状态", "* zuhu11", "* dasdsa", "* 验证"],
          "L2": ["编码", "* 上级目录", "* 目录中文名称", "* 业务定义", "* 目录英文名称", "* 归属部门", "* 所属公司", "* 数据责任人", "* 数据责任人工号", "* 数据责任人状态"],
          "L3": ["编码", "* 上级目录(L1)", "* 上级目录(L2)", "标签", "* 目录中文名称", "* 业务定义", "* 目录英文名称", "* 归属部门", "* 所属公司", "* 数据责任人", "* 数据责任人工号", "* 数据责任人状态", "* 数据管家", "* 数据管家工号", "* 数据管家状态"],
      }
      workbook = Workbook()
      workbook.remove(workbook.active)
      for sheet, rows in PLAN.items():
          ws = workbook.create_sheet(title=sheet)
          ws.append(HEADERS[sheet])
          for i in range(1, rows + 1):
              row = []
              for h in HEADERS[sheet]:
                  name = h.replace("* ", "").strip()
                  if name == "编码":
                      row.append("")
                  elif name == "目录中文名称":
                      row.append(f"{sheet}_BD_{i:05d}")
                  elif name == "目录英文名称":
                      row.append(f"{sheet}_BD_EN_{i:05d}")
                  elif name == "业务定义":
                      row.append(f"{sheet}_BD_DEF_{i}")
                  elif name == "上级目录":
                      row.append(PARENT["L2"])
                  elif name == "上级目录(L1)":
                      row.append(PARENT["L2"])
                  elif name == "上级目录(L2)":
                      row.append(PARENT["L3"])
                  else:
                      row.append(ENUM.get(name, ""))
              ws.append(row)
      workbook.save("import_l1l2l3_boundary.xlsx")
      print("已生成 import_l1l2l3_boundary.xlsx（L1 97 行 / L2 997 行 / L3 9998 行）")
      ```
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: 查看 L1/L2/L3 当前编码值
    expected: L1 当前编码值为 BD01、L2 当前编码值为 SD001、L3 当前编码值数值位为 0（与前置第 6 条一致）
  - action: 在【元数据 → 数据目录 → 目录管理】打开「导入目录」，导入数据维度选择 L1/L2/L3，重复处理规则选择「重复则跳过」，上传 import_l1l2l3_boundary.xlsx 并点击「确定」
    expected: 导入成功，新增 L1 97 个、L2 997 个、L3 9998 个目录
  - action: 查看【平台管理 → 编码管理】的 L1/L2/L3 当前编码值
    expected: '1）L1 当前编码值为 BD98（=99-1，达编码上限前一位）；

      2）L2 当前编码值为 SD998（=999-1）；

      3）L3 当前编码值为 BO9998（=9999-1）'
  - action: 在【目录管理】新建 1 个 L1 目录、1 个 L2 目录（上级 CatalogA）、1 个 L3 目录（上级 CatalogB）
    expected: 三个目录均新建成功；编码管理 L1=BD99、L2=SD999、L3=BO9999（均达编码上限）
  - action: 再各新建 1 个 L1/L2/L3 目录
    expected: '1）三次新建均失败并给出报错提示（编码已用尽，无法分配新编码）；

      2）L1/L2/L3 当前编码值保持 BD99/SD999/BO9999，不会出现 BD100/SD1000/BO10000'
  tags:
  - 平台管理
  - 编码管理
