  title: 验证【标准定义】-【导入标准】导入标准文件，导入结果弹窗展示失败计数且错误文件定位原因(文件数据 = 无效)
  priority: P1
  precondition: |-
    1) 标准目录包含已发布 L1_01→L2_01→L3_01
       a. 创建方式：进入【元数据 → 数据目录 → 目录管理】，依次新建并发布 L1_01、L2_01、L3_01，目录必填项使用 数据资产部/泸州老窖/张三/1001/在职，L3 数据管家使用 李四/2001/在职
    2) 责任人 user_001 为在职人员
    3) 码表 code_table_01 已存在（CatalogB 下，内容 A01/启用）
       a. 创建方式：进入【数据标准 → 标准基础 → 码表管理】，新建目录 CatalogB，点击【新增】，配置码表名称 code_table_01、编码 CODE_01、所属目录 CatalogB、码表内容手动添加，添加 A01/启用，点击【确定】
    4) 创建导入文件 standard_c0182.xlsx
      Sheet: Sheet1
      Title: * 标准编码,* 标准中文名,* 标准英文名,* 标准目录（L3）,数据类型,长度
      Line1: STD_C0182, 标准_C0182, STD_C0182_EN, L3_01, string, 255
  steps:
  - action: 进入【数据标准 → 标准管理 → 标准定义】页面
    expected: 进入成功
  - action: |-
      导入含以下无效数据的标准文件：
      * 标准编码不存在的行
      * 英文名称为空、英文缩写为空或含大写字母的行
      * 中文名称与库中已有标准重复的行
      * 数据长度格式错误、数据精度格式错误的行
      点击【导入标准】并确认
    expected: 弹出「导入结果」弹窗，展示「导入总量」「导入成功」「导入失败」三项，导入失败计数与无效行数一致
  - action: 点击【下载异常记录】并打开下载的错误文件
    expected: 
      页面提示「下载成功」，下载文件为「标准导入异常结果_日期.xlsx」，其中各行对应校验原因分别为：标准编码「编码信息无法匹配已有编码」、英文名称「英文名称不能为空」、英文缩写「英文缩写不符合规范只支持小写英文字母」、中文名称「标准名称重复」、数据长度「数据长度格式不正确，请输入=或<=，如：=10或<=10」、数据精度「数据精度格式不正确，请输入
      数字/数字，如3/6」
  - action: |-
      再次导入含以下无效数据的标准文件：
      * 责任人工号不存在、公司工号不存在、部门工号不存在的行
      * 标准目录路径不足L3或L1目录不存在的行
      * 必填自定义属性值为空、枚举自定义属性值不存在的行
      点击【导入标准】并确认
    expected: 弹出「导入结果」弹窗，导入失败计数与无效行数一致；下载错误文件后各行对应校验原因分别为：责任人工号「标准责任人找不到」、公司工号「*
