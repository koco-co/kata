  - requirement_id: '13176'
    title: 验证【编码管理】-【重置】删除并重建L3目录，重建后目录与数据表关联关系不恢复
    priority: P2
    precondition: |-
      1) 编码配置包含 L1 前缀 BD、起始码 1、结束码 99、当前值 99
      2) L2/L3/L4/L5 和数据标准配置独立前缀
      3) 目录L1_01、目录L2_01、目录L3_01已存在。
    steps:
      - action: 进入【平台管理 → 编码管理】页面
        expected: 进入成功
      - action: 数据地图中所有表，只与目录L3_01（L3，编号为BO0001）关联
        expected: 页面状态、列表记录和操作结果与步骤中给定值一致。
      - action: 删除数据地图中所有表
        expected: 与目录的关联关系也得删除
      - action: 重新同步表至数据地图
        expected: 无法通过目录L3_01查询到表
      - action: 将所有表与目录L3_02（L3，编号为BO0002）关联
        expected: 关联成功，并可以通过目录L3_02查询到表
      - action: 删除所有L3目录
        expected: 所有L3目录与数据表/数据标准的关联关系被删除
      - action: 重新创建目录L3_03（L3，编号为BO0002）
        expected: 无法通过目录L3_03查询到表
      - action: 将所有表与目录L3_03（L3，编号为BO0002）关联
        expected: 关联成功，并可以通过目录L3_03查询到表
    source_ref: TP-001
    case_id: C0004
    tags:
      - 平台管理
      - 编码管理
