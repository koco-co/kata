cases:
  - requirement_id: "13176"
    title: 验证编码管理 - 编码值自增 - 编码值超过结束码
    priority: P2
    precondition: 已登录泸州老窖数据资产平台，准备各资产层级的编码配置和同租户测试数据。
    steps:
      - action: |-
          1）L1当前编码值为99；
          2）新增L1目录；
          3）再次查看L1当前编码值
        expected: L1当前编码值为BD100
    source_ref: TP-001
    case_id: C0001
  - requirement_id: "13176"
    title: 验证编码管理 - 编码值自增 - L4～L5
    priority: P0
    precondition: 已登录泸州老窖数据资产平台，准备各资产层级的编码配置和同租户测试数据。
    steps:
      - action: |-
          1）记录L4和L5的当前编码值
          2）通过元数据同步，同步N张新表（每张表P个字段）；
          3）查看编码列表，L4和L5的当前编码值
        expected: |-
          1）L4的当前编码值+N；
          2）L5的当前编码值+(N*P)
      - action: |-
          1）通过元数据同步，同步N张已同步的表（每张表P个字段）；
          2）查看编码列表，L4和L5的当前编码值
        expected: L4和L5的当前编码值不变
      - action: |-
          1）通过元数据同步，同步N张已同步的表:
          - 有且仅有一张表与上次同步相比，新增了Q个字段
          2）查看编码列表，L4和L5的当前编码值
        expected: |-
          1）L4的当前编码值不变；
          2）L5的当前编码值+Q
      - action: |-
          1）通过数据地图批量删除N张表（每张表P个字段）；
          2）查看编码列表，L4和L5的当前编码值
        expected: L4和L5的当前编码值不变
      - action: |-
          1）通过表详情页删除表（每张表P个字段）；
          2）查看编码列表，L4和L5的当前编码值
        expected: L4和L5的当前编码值不变
      - action: |-
          1）通过数据模型创建（审批通过）N张表（每张表P个字段）；
          2）查看编码列表，L4和L5的当前编码值
        expected: |-
          1）L4的当前编码值+N；
          2）L5的当前编码值+(N*P)
      - action: |-
          1）通过数据模型编辑一张表，添加了Q个字段:
          2）查看编码列表，L4和L5的当前编码值
        expected: |-
          1）L4的当前编码值不变；
          2）L5的当前编码值+Q
      - action: |-
          1）通过数据模型删除N张表（每张表P个字段）；
          2）查看编码列表，L4和L5的当前编码值
        expected: L4和L5的当前编码值不变
      - action: |-
          1）通过离线任务创建N张表（每张表P个字段）；
          2）查看编码列表，L4和L5的当前编码值
        expected: |-
          1）L4的当前编码值+N；
          2）L5的当前编码值+(N*P)
      - action: |-
          1）通过离线任务ALTER一张表（该表已同步至资产数据地图），添加了Q个字段:
          2）查看编码列表，L4和L5的当前编码值
        expected: |-
          1）L4的当前编码值不变；
          2）L5的当前编码值+Q
      - action: |-
          1）通过离线任务删除（drop）N张表（每张表P个字段，且已同步至资产数据地图）；
          2）查看编码列表，L4和L5的当前编码值
        expected: L4和L5的当前编码值不变
    source_ref: TP-001
    case_id: C0002
  - requirement_id: "13176"
    title: 验证编码管理 - 编码值自增 - L1～L3
    priority: P1
    precondition: 已登录泸州老窖数据资产平台，准备各资产层级的编码配置和同租户测试数据。
    steps:
      - action: |-
          1）记录L1/L2/L3的当前编码值
          2）在「元数据」-「数据目录」-「目录管理」页面，新建N个L1/L2/L3目录；
          3）查看编码列表，L1/L2/L3的当前编码值
        expected: L1/L2/L3的当前编码值+N
      - action: |-
          1）在「元数据」-「数据目录」-「目录管理」页面，编辑一个L1/L2/L3目录；
          2）查看编码列表，L1/L2/L3的当前编码值
        expected: L1/L2/L3的当前编码值不变
      - action: |-
          1）在「元数据」-「数据目录」-「目录管理」页面，删除N个L1/L2/L3目录；
          2）查看编码列表，L1/L2/L3的当前编码值
        expected: L1/L2/L3的当前编码值不变
      - action: |-
          1）在「元数据」-「数据目录」-「目录管理」页面，导入L1/L2/L3目录：
          - 导入文件中存在N个编码为空的数据，以及M（M>0）个编码不为空的数据
          - 导入文件的数据，均导入成功
          - “重复处理规则”为“重复则覆盖更新”
          2）查看编码列表，L1/L2/L3的当前编码值
        expected: L1/L2/L3的当前编码值+N
    source_ref: TP-001
    case_id: C0003
  - requirement_id: "13176"
    title: 验证编码管理 - 重置 - 重置后重新关联
    priority: P2
    precondition: 已登录泸州老窖数据资产平台，准备各资产层级的编码配置和同租户测试数据。
    steps:
      - action: 数据地图中所有表，只与目录A3（L3，编号为BO0001）关联
        expected: 页面完成步骤描述的功能，数据状态与操作结果一致。
      - action: 删除数据地图中所有表
        expected: 与目录的关联关系也得删除
      - action: 重新同步表至数据地图
        expected: 无法通过目录A3查询到表
      - action: 将所有表与目录B3（L3，编号为BO0002）关联
        expected: 关联成功，并可以通过目录B3查询到表
      - action: 删除所有L3目录
        expected: 所有L3目录与数据表/数据标准的关联关系被删除
      - action: 重新创建目录C3（L3，编号为BO0002）
        expected: 无法通过目录C3查询到表
      - action: 将所有表与目录C3（L3，编号为BO0002）关联
        expected: 关联成功，并可以通过目录C3查询到表
    source_ref: TP-001
    case_id: C0004
  - requirement_id: "13176"
    title: 验证编码管理 - 重置 - 当前编码不存在未删除的数据
    priority: P1
    precondition: 已登录泸州老窖数据资产平台，准备各资产层级的编码配置和同租户测试数据。
    steps:
      - action: 点击【重置】
        expected: 弹出提示弹窗，提示：重置后将对资产数据进行重新编码，对已经删除的资产数据不会进行数据库保留，请谨慎操作。
      - action: 在弹窗中，点击【确定】
        expected: 弹窗关闭，触发重置
      - action: 查看重置后的编码
        expected: 该编码所有信息都重置为初始值
    source_ref: TP-001
    case_id: C0005
