  title: 验证【L4导出】分别导出799、800、801行数据，文件可打开且行数与筛选条件一致(行数 = 799/800/801)
  priority: P2
  precondition: |-
    1) 授权数据源：${DataSourceA}

    2) 数据源类型：SparkThrift2.x

    3) 存在数据库：${SchemaA}

    4) 使用以下 Shell 脚本生成 prepare_13925_c0253.sql（生成 799/800/801 张 L4 表，该表为空表）：
       #!/usr/bin/env bash
       set -euo pipefail
       output_file="prepare_13925_c0253.sql"
       schema='${SchemaA}'
       prefix='test_table_13925_c0253'
       : > "$output_file"
       gen_tables() {
         local group=$1
         local count=$2
         for ((i = 1; i <= count; i++)); do
           table="${schema}.${prefix}_${group}_$(printf '%04d' "$i")"
           printf 'DROP TABLE IF EXISTS %s;\n' "$table" >> "$output_file"
           printf 'CREATE TABLE IF NOT EXISTS %s (id BIGINT);\n' "$table" >> "$output_file"
         done
       }
       gen_tables g799 799
       gen_tables g800 800
       gen_tables g801 801

    5) 复制 prepare_13925_c0253.sql 的内容，在 ${DataSourceA} 对应平台或底层执行

    6) 进入【元数据 → 元数据同步】，选择数据源 ${DataSourceA}、数据库 ${SchemaA}，执行元数据同步，将以上表同步至数据地图

    7) 分组表名前缀：
       - 799 行：test_table_13925_c0253_g799_
       - 800 行：test_table_13925_c0253_g800_
       - 801 行：test_table_13925_c0253_g801_
  steps:
  - action: 进入【元数据 → 数据地图】页面
    expected: 进入成功
  - action: 查询结果类型选择「数据表」，数据源类型选择 SparkThrift2.x，数据表名称搜索 test_table_13925_c0253_g799_
    expected: 列表展示 799 条 L4 数据表记录
  - action: 点击【导出】，导出维度选择 L4，导出数据源类型选择 SparkThrift2.x，点击【确定】
    expected: 导出任务创建成功，等待轮询后提示「下载成功」
  - action: 打开下载文件，核对行数、表头、首尾表名
    expected: 文件可打开，L4 sheet 共 799 行，表头完整，记录与筛选结果一致
  - action: 返回列表，将搜索条件改为 test_table_13925_c0253_g800_，重复导出并下载
    expected: 文件 L4 sheet 共 800 行，记录与筛选结果一致
  - action: 返回列表，将搜索条件改为 test_table_13925_c0253_g801_，重复导出并下载
    expected: 文件 L4 sheet 共 801 行，记录与筛选结果一致，无截断或重复
