cases:
- requirement_id: '13176'
  title: 验证【编码管理】-【编码值自增】新增目录触发编码自增，L1当前编码值由98进位为BD99后继续新增报错
  priority: P0
  precondition: |-
    1) 使用 UserA，已授予【平台管理 → 编码管理】查看权限和【目录管理】新增权限
    2) L1 编码前缀为 BD，流水位数 2，编码值范围 BD01～BD99，当前资产编码值为 98
    3) 存在两个待新增 L1 目录，目录名称在当前租户内唯一
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: 查看 L1 当前编码值
    expected: L1 当前编码值为 BD98
  - action: 新增 1 个 L1 目录
    expected: 新增成功
  - action: 再次查看 L1 当前编码值
    expected: L1 当前编码值进位为 BD99（达到编码值范围上限）
  - action: 继续新增 1 个 L1 目录
    expected: 新增失败并给出报错提示（编码已用尽，无法分配新编码）
  - action: 查看 L1 当前编码值
    expected: L1 当前编码值保持 BD99，不会进位为 BD100
  source_ref: TP-002
  case_id: C0001
  tags:
  - 平台管理
  - 编码管理
- requirement_id: '13176'
  title: 验证【编码管理】-【编码值自增】元数据同步与建删表操作，L4当前编码值随表数增加且L5随字段数增加
  priority: P0
  precondition: |-
    1) 使用 UserA，已授予编码管理查看、元数据同步和数据地图操作权限
    2) ${DataSourceA} 中存在 2 张未同步表，每张表 3 个字段，表名与字段名在当前租户唯一
    3) 已记录操作前 L4、L5 当前资产编码值
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: 记录 L4、L5 当前编码值
    expected: 记录完成，后续作为基线
  - action: 进入【元数据 → 元数据同步】页面，通过元数据同步 2 张新表（每张表 3 个字段）
    expected: 同步成功
  - action: 回到【平台管理 → 编码管理】，查看 L4、L5 当前编码值
    expected: L4 当前编码值 +2，L5 当前编码值 +(2*3)
  - action: 进入【元数据 → 元数据同步】页面，再次同步这 2 张已同步表（每张表 3 个字段）
    expected: 同步成功，表结构未变化
  - action: 回到【平台管理 → 编码管理】，查看 L4、L5 当前编码值
    expected: L4、L5 当前编码值均不变
  - action: 修改其中 1 张已同步表，新增 2 个字段，再进入【元数据 → 元数据同步】执行同步
    expected: 同步成功
  - action: 回到【平台管理 → 编码管理】，查看 L4、L5 当前编码值
    expected: L4 当前编码值不变，L5 当前编码值 +2
  - action: 进入【元数据 → 数据地图】，批量删除这 2 张表（每张表 3 个字段）
    expected: 删除成功
  - action: 回到【平台管理 → 编码管理】，查看 L4、L5 当前编码值
    expected: L4、L5 当前编码值均不变
  - action: 进入【元数据 → 数据地图】，通过表详情页删除这 2 张表
    expected: 删除成功
  - action: 回到【平台管理 → 编码管理】，查看 L4、L5 当前编码值
    expected: L4、L5 当前编码值均不变
  source_ref: TP-002
  case_id: C0002
  tags:
  - 平台管理
  - 编码管理
