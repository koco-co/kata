      - action: 点击【新增属性】
        expected: 打开「新增属性」弹窗
      - action: |-
          配置枚举属性：
          属性名：enum_13183_c0175
          属性中文名：枚举属性_0175
          属性类型：枚举值
          新增枚举值 A、B，将 A 名称改为 C
          移动 B、C 顺序
          删除 B 枚举，并在二次确认弹窗中确认
          是否必填：非必填
          点击【确认】
        expected: 属性保存成功，列表展示新枚举属性
      - action: 打开该属性的编辑弹窗核对枚举值
        expected: 枚举值名称更新为步骤输入值，剩余枚举值顺序与保存前一致
      - action: 再次删除一个枚举值
        expected: 删除枚举值时弹出二次确认弹窗
    source_ref: TP-030
    case_id: C0175
    tags:
      - 数据标准
      - 标准管理
      - 标准属性管理
