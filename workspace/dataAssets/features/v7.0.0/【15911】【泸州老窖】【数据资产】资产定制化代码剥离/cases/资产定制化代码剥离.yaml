cases:
- requirement_id: '13176'
  title: 验证【编码管理】-【编码值自增】新增目录触发编码自增，L1当前编码值由98进位为BD99后继续新增报错
  priority: P0
  precondition: '1) 使用 UserA，已授予【平台管理 → 编码管理】查看权限和【目录管理】新增权限

    2) L1 编码前缀为 BD，流水位数 2，编码值范围 BD01～BD99，当前资产编码值为 98

    3) 存在两个待新增 L1 目录，目录名称在当前租户内唯一'
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: '1）L1当前编码值为BD98；

      2）新增1个L1目录；

      3）再次查看L1当前编码值'
    expected: L1当前编码值进位为BD99（达到编码值范围上限）
  - action: '1）继续新增1个L1目录；

      2）查看新增结果和L1当前编码值'
    expected: '1）新增失败并给出报错提示（编码已用尽，无法分配新编码）；

      2）L1当前编码值保持BD99，不会进位为BD100'
  source_ref: TP-002
  case_id: C0001
  tags:
  - 平台管理
  - 编码管理
- requirement_id: '13176'
  title: 验证【编码管理】-【编码值自增】元数据同步与建删表操作，L4当前编码值随表数增加且L5随字段数增加
  priority: P0
  precondition: '1) 使用 UserA，已授予编码管理查看、元数据同步和数据地图操作权限

    2) ${DataSourceA} 中存在 2 张未同步表，每张表 3 个字段，表名与字段名在当前租户唯一

    3) 已记录操作前 L4、L5 当前资产编码值'
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: '1）记录L4和L5的当前编码值

      2）通过元数据同步，同步2张新表（每张表3个字段）；

      3）查看编码列表，L4和L5的当前编码值'
    expected: '1）L4的当前编码值+2；

      2）L5的当前编码值+(2*3)'
  - action: '1）通过元数据同步，同步2张已同步的表（每张表3个字段）；

      2）查看编码列表，L4和L5的当前编码值'
    expected: L4和L5的当前编码值不变
  - action: '1）通过元数据同步，同步2张已同步的表:

      - 有且仅有一张表与上次同步相比，新增了2个字段

      2）查看编码列表，L4和L5的当前编码值'
    expected: '1）L4的当前编码值不变；

      2）L5的当前编码值+2'
  - action: '1）通过数据地图批量删除2张表（每张表3个字段）；

      2）查看编码列表，L4和L5的当前编码值'
    expected: L4和L5的当前编码值不变
  - action: '1）通过表详情页删除表（每张表3个字段）；

      2）查看编码列表，L4和L5的当前编码值'
    expected: L4和L5的当前编码值不变
  source_ref: TP-002
  case_id: C0002
  tags:
  - 平台管理
  - 编码管理
- requirement_id: '13176'
  title: 验证【编码管理】-【编码值自增】新建与导入目录，L1～L3当前编码值按目录数增加
  priority: P1
  precondition: '1) 使用 UserA，已授予编码管理查看和目录管理操作权限

    2) 已记录操作前 L1、L2、L3 当前资产编码值

    3) 已存在用于新增的唯一 L1、L2、L3 目录数据及有效上下级关系'
  steps:
  - action: 进入【平台管理 → 编码管理】页面
    expected: 进入成功
  - action: '1）记录L1/L2/L3的当前编码值

      2）在「元数据」-「数据目录」-「目录管理」页面，新建2个L1/L2/L3目录；

      3）查看编码列表，L1/L2/L3的当前编码值'
