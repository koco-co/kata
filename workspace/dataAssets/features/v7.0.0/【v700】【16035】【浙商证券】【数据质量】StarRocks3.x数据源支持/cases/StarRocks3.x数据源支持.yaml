meta:
  title: StarRocks3.x数据源支持
  version: v7.0.0
  feature_id: v7.0.0/【v700】【16035】【浙商证券】【数据质量】StarRocks3.x数据源支持
cases:
  - id: C001
    title: 验证 StarRocks 3.x 数据源经引入与质量项目授权后数据质量可选用
    priority: P0
    steps:
      - action: |-
          在控制台「公共管理-数据源中心」找到 ${DataSourceA}，对其做「应用授权」:
          - 勾选应用: 数据资产
          点击「确定」
        expected: 应用授权成功，${DataSourceA} 在数据资产应用下可见
      - action: |-
          进入【数据资产】-【平台管理】-【数据源管理】，点击「引入数据源」:
          - 勾选: ${DataSourceA}（STAR_ROCKS_3X）
          点击「确定」
        expected: 引入成功，数据源管理列表新增 ${DataSourceA}，数据源状态「正常」，支持模块含「数据质量」
      - action: |-
          在 ${DataSourceA} 记录的「操作」列点击「质量项目授权」:
          - 选择质量项目: ${ProjectA}
          点击「确定」
        expected: 提示「操作成功」
      - action: 进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」，展开「选择数据源」下拉
        expected: 下拉出现 ${DataSourceA}（STAR_ROCKS_3X）；选择后可正确加载其 Schema 与数据表
    precondition: |-
      1) 控制台-公共管理-数据源中心已新建 StarRocks 3.x 数据源 ${DataSourceA}，连接测试通过。
      2) 数据质量已存在质量项目 ${ProjectA}。
    tags:
      - 平台管理
      - 数据源管理
  - id: C002
    title: 验证概览页正确统计 StarRocks 3.x 数据源规则任务数据
    priority: P1
    steps:
      - action: 进入【数据质量】-【概览】
        expected: 概览页加载成功，展示规则统计卡片、运维指标、告警汇总
      - action: 查看「单表规则总数」「多表规则总数」卡片
        expected: |-
          1)单表规则总数为 3
          2)多表规则总数为 1
      - action: 查看「运维指标」区
        expected: |-
          1)任务总数为 4
          2)校验通过为 2、校验异常为 2，与实际任务结果一致
      - action: 将概览右上时间范围筛选为近一周
        expected: 运维指标与告警按所选时间范围刷新，仅统计该区间内运行的实例
    precondition: |-
      1) StarRocks 3.x 数据源 ${DataSourceA} 已完成质量项目授权。
      2) ${DataSourceA} 下已创建并执行 4 个规则任务：2 个单表完整性任务（1 校验通过、1 校验异常）、1 个单表唯一性任务（校验异常）、1 个多表比对任务（校验通过）。
    tags:
      - 数据质量
      - 概览
  - id: C003
    title: 验证规则集导入规则包后直接执行批量校验 StarRocks 3.x 数据表
    priority: P0
    steps:
      - action: |-
          进入【数据质量】-【规则配置】，点击「新建规则集」，填写「基础信息」:
          - 规则集名称: 证券基础校验集
          - 校验数据源: ${DataSourceA}（STAR_ROCKS_3X）
          - 规则集描述: 证券基础完整性与唯一性校验
          点击「下一步」
        expected: 进入「规则内容」步骤
      - action: |-
          在「规则内容」点击「导入规则」，上传规则包导入文件「证券基础校验包.xlsx」，导入文件填写项为:
          - * 规则名称
          - 规则描述
          - * 表名
          - 表中文名
          - 字段名
          - 字段中文名
          - * 校验SQL(请输入不符合规则要求的明细数据查询SQL)
          确认生成规则包「证券基础校验包」后点击「下一步」
        expected: |-
          1)文件解析成功，规则包「证券基础校验包」含 2 条规则
          2)完整性校验、唯一性校验的表名、字段名、字段中文名、校验SQL 与导入文件内容一致
      - action: 在「调度配置」将「调度周期」切换为「手动触发」，点击「保存」
        expected: 规则集「证券基础校验集」保存成功，规则配置页左上「规则集」区展示该规则集卡片，卡片显示 1 表、1 规则包
      - action: 在「规则集」区找到「证券基础校验集」卡片，点击右上角「更多」菜单中的「立即执行」；进入【任务查询】查看最新实例「查看明细」
        expected: |-
          1)实例状态为「校验异常」
          2)完整性校验的导入 SQL 返回 security_name 为空的 order_id=1003 明细
          3)唯一性校验的导入 SQL 返回 security_code=600036 的重复明细
    precondition: |-
      1) StarRocks 3.x 数据源 ${DataSourceA} 已完成质量项目授权。
      2) 在 ${DataSourceA} 的 ${SchemaA} 库中执行以下建表 SQL（可重入），security_name 含 1 条空值、security_code 含 1 组重复值：

      DROP TABLE IF EXISTS zszq_ruleset;
      CREATE TABLE zszq_ruleset (
        order_id      BIGINT       COMMENT '交易订单ID',
        security_code VARCHAR(10)  COMMENT '证券代码',
        security_name VARCHAR(50)  COMMENT '证券名称'
      )
      ENGINE=OLAP DUPLICATE KEY(order_id)
      DISTRIBUTED BY HASH(order_id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
      INSERT INTO zszq_ruleset VALUES
      (1001,'600036','招商银行'),
      (1002,'000001','平安银行'),
      (1003,'600036',NULL);
      -- security_name 空值数=1；security_code='600036' 重复（1 组，2 行）
      3) 已准备规则包导入文件「证券基础校验包.xlsx」，表头逐字为「* 规则名称、规则描述、* 表名、表中文名、字段名、字段中文名、* 校验SQL(请输入不符合规则要求的明细数据查询SQL)」，文件内容如下：
      - 第 1 行：规则名称=完整性校验；规则描述=证券名称不能为空；表名=zszq_ruleset；表中文名=证券规则集校验表；字段名=security_name；字段中文名=证券名称；校验SQL=SELECT order_id, security_code, security_name FROM zszq_ruleset WHERE security_name IS NULL
      - 第 2 行：规则名称=唯一性校验；规则描述=证券代码不可重复；表名=zszq_ruleset；表中文名=证券规则集校验表；字段名=security_code；字段中文名=证券代码；校验SQL=SELECT order_id, security_code, security_name FROM zszq_ruleset WHERE security_code IN (SELECT security_code FROM zszq_ruleset GROUP BY security_code HAVING COUNT(1) > 1)
    tags:
      - 数据质量
      - 规则配置
  - id: C004
    title: 验证 StarRocks 3.x 数据源完整性校验表级表行数规则校验
    priority: P0
    steps:
      - action: |-
          进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」，配置监控对象:
          - 规则名称: StarRocks表行数校验
          - 选择数据源: ${DataSourceA}（STAR_ROCKS_3X）
          - 选择数据表: zszq_trade_orders
          点击「下一步」
        expected: 数据源/Schema/数据表三级联动正常，加载到 StarRocks 表
      - action: |-
          点击「添加规则」-「完整性校验」，配置规则:
          - 规则类型: 表级
          - 统计函数: 表行数
          - 校验方法: 固定值
          - 期望值: > 5
          - 强弱规则: 弱规则
          - 规则描述: 表行数大于5校验
          点击「保存」
        expected: |-
          1)切换规则类型为表级后统计函数仅「表行数」
          2)规则保存成功
      - action: 点击「下一步」将「调度周期」切换为「手动触发」，点击「完成」
        expected: 规则任务创建成功，规则配置列表展示该任务
      - action: 在列表点击 zszq_trade_orders 打开规则详情，点击「立即执行」，进入【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验通过」（表行数 6 > 5）
      - action: |-
          返回规则详情编辑规则:
          - 期望值: > 10
          保存后再次「立即执行」，在【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验异常」（表行数 6 不满足 > 10）
    precondition: |-
      1) StarRocks 3.x 数据源 ${DataSourceA} 已完成质量项目授权。
      2) 在 ${DataSourceA} 的 ${SchemaA} 库执行以下建表 SQL（可重入）：

      DROP TABLE IF EXISTS zszq_trade_orders;
      CREATE TABLE zszq_trade_orders (
        order_id      BIGINT        COMMENT '交易订单ID',
        security_code VARCHAR(10)   COMMENT '证券代码',
        trade_amount  DECIMAL(18,2) COMMENT '交易金额',
        trade_date    DATE          COMMENT '交易日期'
      )
      ENGINE=OLAP DUPLICATE KEY(order_id)
      DISTRIBUTED BY HASH(order_id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
      INSERT INTO zszq_trade_orders VALUES
      (1001,'600036',25000.00,'2025-01-01'),
      (1002,'000001',18000.00,'2025-01-01'),
      (1003,'601318',88000.00,'2025-01-02'),
      (1004,'600519',150000.00,'2025-01-02'),
      (1005,'000858',60000.00,'2025-01-02'),
      (1006,'300750',36000.00,'2025-01-02');
      -- 表行数=6
    tags:
      - 数据质量
      - 规则配置
  - id: C005
    title: 验证 StarRocks 3.x 数据源完整性校验字段级空值数单字段规则校验
    priority: P0
    steps:
      - action: |-
          进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」，配置监控对象:
          - 规则名称: 证券名称空值数校验
          - 选择数据源: ${DataSourceA}（STAR_ROCKS_3X）
          - 选择数据表: zszq_trade_null
          点击「下一步」
        expected: 三级联动正常
      - action: |-
          点击「添加规则」-「完整性校验」，配置规则:
          - 规则类型: 字段级
          - 字段: security_name
          - 统计函数: 空值数
          - 校验方法: 固定值
          - 期望值: = 0
          - 强弱规则: 强规则
          - 规则描述: 证券名称空值数校验
          点击「保存」
        expected: 规则保存成功
      - action: 点击「下一步」将「调度周期」切换为「手动触发」，「完成」，在列表点表名打开详情，「立即执行」，进入【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验异常」（security_name 空值数 1 不满足 = 0）
      - action: 对「校验异常」实例「查看明细」
        expected: 明细展示空值记录 order_id=1003
      - action: |-
          编辑规则:
          - 期望值: <= 1
          保存后再次「立即执行」，在【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验通过」（空值数 1 满足 <= 1）
    precondition: |-
      1) StarRocks 3.x 数据源 ${DataSourceA} 已完成质量项目授权。
      2) 在 ${DataSourceA} 的 ${SchemaA} 库执行以下建表 SQL（可重入），security_name 含 1 条空值：

      DROP TABLE IF EXISTS zszq_trade_null;
      CREATE TABLE zszq_trade_null (
        order_id      BIGINT       COMMENT '交易订单ID',
        security_code VARCHAR(10)  COMMENT '证券代码',
        security_name VARCHAR(50)  COMMENT '证券名称'
      )
      ENGINE=OLAP DUPLICATE KEY(order_id)
      DISTRIBUTED BY HASH(order_id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
      INSERT INTO zszq_trade_null VALUES
      (1001,'600036','招商银行'),
      (1002,'000001','平安银行'),
      (1003,'601318',NULL);
      -- security_name 空值数=1（order_id=1003）
    tags:
      - 数据质量
      - 规则配置
  - id: C006
    title: 验证 StarRocks 3.x 数据源完整性校验字段级空值数多字段规则校验
    priority: P2
    steps:
      - action: |-
          进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」，配置监控对象:
          - 规则名称: 多字段空值数校验
          - 选择数据源: ${DataSourceA}（STAR_ROCKS_3X）
          - 选择数据表: zszq_trade_multi_null
          点击「下一步」
        expected: 三级联动正常
      - action: |-
          点击「添加规则」-「完整性校验」，配置规则:
          - 规则类型: 字段级
          - 字段: security_name、account_no
          - 统计函数: 空值数
          - 校验方法: 固定值
          - 期望值: = 0
          - 强弱规则: 弱规则
          - 规则描述: 多字段空值数校验
          点击「保存」
        expected: |-
          1)字段支持多选，security_name 与 account_no 均被选中
          2)规则保存成功
      - action: 点击「下一步」将「调度周期」切换为「手动触发」，「完成」，点表名打开详情「立即执行」，进入【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验异常」（仅 order_id=1004 两字段同时为 NULL，空值数=1，不满足 = 0）
      - action: 对「校验异常」实例「查看明细」
        expected: 明细展示 order_id=1004 这条 security_name、account_no 同时为 NULL 的记录
    precondition: |-
      1) StarRocks 3.x 数据源 ${DataSourceA} 已完成质量项目授权。
      2) 在 ${DataSourceA} 的 ${SchemaA} 库执行以下建表 SQL（可重入），仅 order_id=1004 一行 security_name 与 account_no 同时为 NULL：

      DROP TABLE IF EXISTS zszq_trade_multi_null;
      CREATE TABLE zszq_trade_multi_null (
        order_id      BIGINT       COMMENT '交易订单ID',
        security_name VARCHAR(50)  COMMENT '证券名称',
        account_no    VARCHAR(20)  COMMENT '账户号'
      )
      ENGINE=OLAP DUPLICATE KEY(order_id)
      DISTRIBUTED BY HASH(order_id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
      INSERT INTO zszq_trade_multi_null VALUES
      (1001,'招商银行','ACC001'),
      (1002,NULL,'ACC002'),
      (1003,'中国平安',NULL),
      (1004,NULL,NULL);
      -- 仅 order_id=1004 security_name 与 account_no 同时为 NULL，空值数=1
    tags:
      - 数据质量
      - 规则配置
  - id: C007
    title: 验证 StarRocks 3.x 数据源完整性校验字段级空值率单字段规则校验
    priority: P1
    steps:
      - action: |-
          进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」，配置监控对象:
          - 规则名称: 证券名称空值率校验
          - 选择数据源: ${DataSourceA}（STAR_ROCKS_3X）
          - 选择数据表: zszq_trade_null_rate
          点击「下一步」
        expected: 三级联动正常
      - action: |-
          点击「添加规则」-「完整性校验」，配置规则:
          - 规则类型: 字段级
          - 字段: security_name
          - 统计函数: 空值率
          - 校验方法: 固定值
          - 期望值: <= 10%
          - 强弱规则: 弱规则
          - 规则描述: 证券名称空值率校验
          点击「保存」
        expected: 规则保存成功
      - action: 点击「下一步」将「调度周期」切换为「手动触发」，「完成」，点表名打开详情「立即执行」，进入【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验异常」（空值率 20% 不满足 <= 10%）
      - action: 对「校验异常」实例「查看明细」
        expected: 明细展示空值记录 order_id=1005
      - action: |-
          编辑规则:
          - 期望值: <= 20%
          保存后再次「立即执行」，在【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验通过」（空值率 20% 满足 <= 20%）
    precondition: |-
      1) StarRocks 3.x 数据源 ${DataSourceA} 已完成质量项目授权。
      2) 在 ${DataSourceA} 的 ${SchemaA} 库执行以下建表 SQL（可重入），5 行中 security_name 含 1 条空值（空值率 20%）：

      DROP TABLE IF EXISTS zszq_trade_null_rate;
      CREATE TABLE zszq_trade_null_rate (
        order_id      BIGINT       COMMENT '交易订单ID',
        security_name VARCHAR(50)  COMMENT '证券名称'
      )
      ENGINE=OLAP DUPLICATE KEY(order_id)
      DISTRIBUTED BY HASH(order_id) BUCKETS 10 PROPERTIES ("replication_num" = "1");
      INSERT INTO zszq_trade_null_rate VALUES
      (1001,'招商银行'),(1002,'平安银行'),(1003,'中国平安'),(1004,'贵州茅台'),(1005,NULL);
      -- security_name 空值率=1/5=20%
    tags:
      - 数据质量
      - 规则配置
  - id: C008
    title: 验证 StarRocks 3.x 数据源完整性校验字段级空值率多字段规则校验
    priority: P2
    steps:
      - action: |-
          进入【数据质量】-【规则配置】，点击「新建监控规则」-「单表校验规则」，配置监控对象:
          - 规则名称: 多字段空值率校验
          - 选择数据源: ${DataSourceA}（STAR_ROCKS_3X）
          - 选择数据表: zszq_multi_null_rate
          点击「下一步」
        expected: 三级联动正常
      - action: |-
          点击「添加规则」-「完整性校验」，配置规则:
          - 规则类型: 字段级
          - 字段: security_name、account_no
          - 统计函数: 空值率
          - 校验方法: 固定值
          - 期望值: <= 10%
          - 强弱规则: 弱规则
          - 规则描述: 多字段空值率校验
          点击「保存」
        expected: |-
          1)字段多选成功
          2)规则保存成功
      - action: 点击「下一步」将「调度周期」切换为「手动触发」，「完成」，点表名打开详情「立即执行」，进入【任务查询】查看最新实例
        expected: 实例状态由「运行中」→「校验异常」（仅 order_id=1004 两字段同时为 NULL，空值率=1/5=20%，不满足 <= 10%）
      - action: 对「校验异常」实例「查看明细」
        expected: 明细展示 order_id=1004 这条 security_name、account_no 同时为 NULL 的记录
    precondition: |-
      1) StarRocks 3.x 数据源 ${DataSourceA} 已完成质量项目授权。
      2) 在 ${DataSourceA} 的 ${SchemaA} 库执行以下建表 SQL（可重入），5 行中仅 order_id=1004 一行 security_name 与 account_no 同时为 NULL：

      DROP TABLE IF EXISTS zszq_multi_null_rate;
      CREATE TABLE zszq_multi_null_rate (
        order_id      BIGINT       COMMENT '交易订单ID',
        security_name VARCHAR(50)  COMMENT '证券名称',
        account_no    VARCHAR(20)  COMMENT '账户号'
