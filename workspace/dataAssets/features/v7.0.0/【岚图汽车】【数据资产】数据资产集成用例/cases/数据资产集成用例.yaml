meta:
  title: 数据资产集成用例
  feature_id: data-assets-core-module-integration-suite
  project_id: data-assets
  case_module_id: ""
  layout: requirements
  imports:
    - archive.md
  exports:
    - 数据资产集成用例.xmind
requirements:
  - requirement_id: "9633"
    title: 元数据
    source: cases/imports/archive.md
  - requirement_id: "9634"
    title: 数据标准
    source: cases/imports/archive.md
  - requirement_id: "9635"
    title: 数据模型
    source: cases/imports/archive.md
  - requirement_id: "9636"
    title: 数据质量
    source: cases/imports/archive.md
cases:
  - case_id: C0001
    requirement_id: "9633"
    title: 验证【元数据】-【元数据同步】新增并执行周期同步任务，任务状态为同步完成且查看实例、编辑、删除均生效
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_9633_c0001;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_9633_c0001 (
           id BIGINT,
           name STRING,
           amount DECIMAL(10,2),
           updated_at TIMESTAMP
         );
         INSERT INTO ${SchemaA}.test_table_9633_c0001 VALUES
           (1, 'alpha', CAST(100 AS DECIMAL(10,2)), TIMESTAMP '2026-08-01 08:00:00'),
           (2, 'beta', CAST(200 AS DECIMAL(10,2)), TIMESTAMP '2026-08-01 09:00:00');
    steps:
      - action: 进入【元数据 → 元数据同步】页面
        expected: 进入成功
      - action: |-
          配置周期同步任务：
          任务名称：TaskA
          数据源：${DataSourceA}
          数据库：${SchemaA}
          数据表：test_table_9633_c0001
          同步内容：全部内容
          调度周期：每天 02:00
          点击「新增并立即执行」
        expected: |-
          1) 列表新增任务「TaskA」
          2) 任务执行时状态显示为「运行中」
          3) 任务结束后状态显示为「同步完成」
      - action: 选中「TaskA」并点击「查看实例」
        expected: |-
          1) 实例记录显示任务名称「TaskA」
          2) 实例状态显示为「同步完成」
          3) 同步对象显示为「test_table_9633_c0001」
      - action: 编辑「TaskA」，将调度周期修改为每周一 03:00 并保存
        expected: 任务「TaskA」的调度周期显示为每周一 03:00
      - action: 删除「TaskA」并在二次确认弹窗中点击「确定」
        expected: 元数据同步任务列表不展示「TaskA」
    tags:
      - 元数据
      - 元数据同步

  - case_id: C0002
    requirement_id: "9634"
    automation:
      effects:
        platform_write: false
      business_record:
        policy: not_applicable
        reason: 仅查看统计数据并搜索既有词根、码表与标准定义
      implementations:
        - executor: playwright-web-ui
          state: active
    title: 验证【数据标准】-【标准统计】查看统计卡片与分布图，标准数量、热度、目录分布、趋势与来源分布均展示
    priority: P1
    precondition: |-
      1) 词根管理中存在词根：简称「email」、全称「email」、中文名「邮箱」
      2) 码表管理中存在代码：名称「code」、编号「001」、目录「CatalogA」
      3) 标准定义中存在数据标准：中文名称「金额」、英文名称「money」、标准编号「StandardCodeA」
    steps:
      - action: 进入【数据标准 → 标准统计】页面
        expected: 进入成功
      - action: 查看标准统计卡片
        expected: |-
          1) 「数据标准」数量大于或等于 1
          2) 「代码表」数量大于或等于 1
          3) 「词根管理」数量大于或等于 1
      - action: 查看「标准热度」、「标准目录分布」、「标准趋势」和「标准来源分布」
        expected: |-
          1) 「标准热度」展示标准名称与引用次数
          2) 「标准目录分布」展示目录名称与标准数量
          3) 「标准趋势」展示时间轴与标准数量数据点
          4) 「标准来源分布」展示来源名称与标准数量
      - action: 进入【数据标准 → 标准基础 → 词根管理】页面，搜索词根简称「email」
        expected: 列表展示词根简称「email」、全称「email」、中文名「邮箱」
      - action: 进入【数据标准 → 标准基础 → 码表管理】页面，搜索代码编号「001」
        expected: 列表展示代码名称「code」、代码编号「001」、代码目录「CatalogA」
      - action: 进入【数据标准 → 标准管理 → 标准定义】页面，搜索标准编号「StandardCodeA」
        expected: 列表展示中文名称「金额」、英文名称「money」、标准编号「StandardCodeA」
    tags:
      - 数据标准
      - 标准统计

  - case_id: C0003
    requirement_id: "9635"
    automation:
      effects:
        platform_write: false
      business_record:
        policy: not_applicable
        reason: 仅查看页面结构与导航，新建表表单未提交并主动取消
      implementations:
        - executor: playwright-web-ui
          state: active
    title: 验证【数据模型】-【规范建表】查看建表、规范设计与我的模型页面，导航与列表字段完整展示
    priority: P1
    precondition: |-
      1) 使用租户管理员账号进入数据资产平台
    steps:
      - action: 进入【数据模型 → 规范建表】页面
        expected: 进入成功
      - action: 查看规范建表页面的导航与列表字段
        expected: |-
          1) 导航展示「建表」、「规范设计」、「授权与审批」和「我的模型」
          2) 列表展示「表名」、「表中文名」、「表来源」、「表类型」、「所属数据源」、「所属数据库」、「创建时间」和「操作」
      - action: 点击「新建表」
        expected: |-
          1) 打开新建表表单
          2) 表单展示「数据源」、「数据库」、「表名」和「表类型」
          3) 表单展示「基础信息」、「表结构」或「下一步」入口
      - action: 点击「取消」，切换到「规范设计」
        expected: |-
          1) 新建表表单关闭
          2) 规范设计页面展示「模型元素」、「数仓层级」和「元素值」
          3) 页面展示「新增」、「编辑」和「删除」操作
      - action: 切换到「我的模型」
        expected: |-
          1) 页面展示「审批中」、「已审批」或「待审批」状态筛选
          2) 列表展示「表名」、「表中文名」、「创建时间」和「操作」
          3) 审批中记录的操作列展示「撤回」或「批量撤回」
    tags:
      - 数据模型
      - 规范建表
      - 规范设计

  - case_id: C0004
    requirement_id: "9636"
    automation:
      effects:
        platform_write: true
      business_record:
        policy: required
      implementations:
        - executor: playwright-web-ui
          state: planned
    title: 验证【数据质量】-【项目管理】搜索并置顶项目，项目列表仅展示匹配记录且置顶项目位于首位
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：SparkThrift2.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_9636_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_9636_c0004 (
           id BIGINT,
           name STRING,
           amount DECIMAL(10,2)
         ) PARTITIONED BY (dt STRING);
         INSERT INTO ${SchemaA}.test_table_9636_c0004 PARTITION (dt)
         SELECT 1, 'alpha', CAST(100 AS DECIMAL(10,2)), date_format(date_sub(current_date(), 1), 'yyyy-MM-dd')
         UNION ALL
         SELECT 2, 'beta', CAST(200 AS DECIMAL(10,2)), date_format(date_sub(current_date(), 1), 'yyyy-MM-dd')
         UNION ALL
         SELECT 3, 'gamma', CAST(300 AS DECIMAL(10,2)), date_format(current_date(), 'yyyy-MM-dd')
         UNION ALL
         SELECT 4, 'delta', CAST(400 AS DECIMAL(10,2)), date_format(current_date(), 'yyyy-MM-dd');
      5) 数据质量中存在项目「${ProjectA}」
    steps:
      - action: 进入【数据质量 → 项目管理】页面
        expected: 进入成功
      - action: 搜索项目名称「${ProjectA}」
        expected: 项目列表仅展示名称为「${ProjectA}」的记录
      - action: 点击项目「${ProjectA}」的「置顶」
        expected: 「${ProjectA}」显示置顶标识并位于项目列表首位
      - action: 进入项目「${ProjectA}」的「规则任务管理」，点击「新建监控规则」
        expected: 打开「监控对象」配置页面
      - action: |-
          配置监控对象：
          规则名称：RuleA
          * 数据源：${DataSourceA}
          * 数据库：${SchemaA}
          * 数据表：test_table_9636_c0004
          分区：dt=date_format(current_date(), 'yyyy-MM-dd')
          点击「下一步」
        expected: 进入「监控规则」步骤，监控对象显示为 test_table_9636_c0004
      - action: |-
          配置表行数监控规则：
          规则分类：完整性校验
          范围：单表
          统计函数：表行数
          校验方法：固定值
          比较符：=
          期望值：2
          点击「保存」
        expected: 列表新增规则「RuleA」且状态显示为「待运行」
      - action: 点击规则「RuleA」的「立即执行」，进入「校验结果查询」查看任务实例
        expected: |-
          1) 任务状态：「成功」
          2) 校验结果：「通过」
          3) 执行SQL：SELECT COUNT(*) FROM ${SchemaA}.test_table_9636_c0004 WHERE dt = date_format(current_date(), 'yyyy-MM-dd');
             查询结果：2
    tags:
      - 数据质量
      - 项目管理
      - 监控规则
