meta:
  title: 数据资产集成用例
  version: v7.0.0
  feature_id: v7.0.0/【v700】【岚图汽车】数据资产集成用例
  case_module_id: ""
  exports:
    - xmind
cases:
  - case_id: C0001
    automation:
      spec_file: c0001-metadata-sync-record-actions.spec.ts
    title: 验证「元数据」元数据同步记录查看实例编辑与删除
    priority: P0
    steps:
      - action: 进入「数据资产」-「元数据」-「元数据同步」页面
        expected: 进入成功
      - action: |-
          1）点击「新增周期同步任务」，配置周期同步任务如下
          「数据源」选择「DS_A」
          「数据库」选择「DB_A」
          「数据表」选择「T_A」
          「元数据同步内容」选择「全部内容」
          配置调度属性
          2）点击「新增并立即执行」
        expected: |-
          1）元数据周期同步任务配置完成
          2）弹窗关闭，任务进入「运行中」状态
          3）运行结束后任务状态变更为同步完成
      - action: 选择该条同步记录，点击【查看实例】
        expected: 展示同步成功的实例详情
      - action: 点击【编辑】，修改调度周期，点击保存
        expected: 成功修改
      - action: |-
          1）点击表「T_A」的立即同步按钮
          2）删除表T_A，运行结束后，查看状态
          3）点击「查看实例」，查看同步日志
        expected: 运行失败，报错表不存在
      - action: 点击【删除】，二次确认
        expected: 成功删除该条记录
      - action: |-
          进入「数据地图」页面
          1）查看「数据表」
          2）查看「DS_A」所属的数据源类型表数量
        expected: |-
          1）数据表统计数+1
          2）数据源类型表数量+1
      - action: 「资产类型」分别点击不同模块「数据表」「字段」「离线任务」「实时任务」「指标」「智能标签」「API」
        expected: 均成功跳转到数据地图二级页面，并携带资产类型进行搜索，搜索结果正确
      - action: 「表来源」分别点击不同模块「starocks」「spark」「doris」「mysql」「hive」「TIDB」等
        expected: 均成功跳转到数据地图二级页面，并携带数据源类型进行搜索，搜索结果正确
      - action: |-
          1）「数据表」搜索框内输入不存在的表名「test」,点击搜索
          2）「数据表」搜索框内输入已同步的表「T_A」，点击搜索
        expected: |-
          1）跳转到数据地图二级页面，但是展示为缺省页
          2）数据地图二级页面正确展示表T_A
          3）表T_A的「表名」「数据源类型」「数据源」「数据库」「资产类型」「表中文名」「负责人」「表标签」均展示正确
      - action: |-
          1）搜索表后，数据地图一级页面热门查询功能正确
          2）点击热门查询处的表名
        expected: |-
          1）热门查询新增当前搜索的表名
          2）跳转到数据地图二级页面，并携带表名自动搜索
      - action: 点击表名
        expected: 进入表详情页
      - action: 校验「表结构」模块功能正确
        expected: 「表字段」「表索引」「建表语句」信息均展示正确
      - action: 在「表结构-字段」页根据字段名/字段描述/标签进行搜索
        expected: 符合条件即返回正确数据，不符合条件则返回“暂无数据”
      - action: 校验表「数据预览」功能正确
        expected: 表数据预览正确，默认展示前3条
      - action: |-
          1）进入表详情页，查看血缘关系-表级血缘
          1）进入表详情页，查看血缘关系-字段级血缘
        expected: |-
          1）表级血缘正确，T_A的下游表有T_B
          2）字段及血缘正确，T_A的每个字段下游字段为T_B的同名字段
      - action: 执行前置条件的血缘sql，查看表的血缘展示是否正确
        expected: 表级血缘和字段级血缘正确
      - action: 校验「任务依赖」模块功能正确
        expected: 「离线任务」和「实时任务」信息均展示正确，默认展示为“暂无数据”
      - action: 校验「文件治理」模块功能正确
        expected: 列表信息均展示正确，默认展示为“暂无数据”
      - action: |-
          1）进入「元数据管理」-「DS_A」-「DB_A」，点击「T_A」的编辑按钮
          2）修改表负责人和表中文名，点击确定
          3）进入「T_A」的表详情-「版本变更」，查看版本记录
        expected: |-
          1）跳转到编辑页面
          2）编辑成功
          3）版本记录正确
      - action: |-
          1）执行sql：ALTER TABLE T_A DROP COLUMN score；
          2）进入「T_A」的表详情-「操作记录」
        expected: 操作记录展示正确，新增一条alter的操作记录
      - action: 「表基本信息」「表技术属性」「表业务属性」「表热度统计」功能校验
        expected: 表相关信息均统计正确
      - action: |-
          维护表基本信息」如下
          「描述信息」输入「desc test」
          「标签」输入「tag」
          「数据目录」选择「已存在的数据目录A」
        expected: 保存成功
      - action: |-
          1）维护标签之后，校验数据地图一级页面「热门标签」功能
          2）点击「标签」名
        expected: |-
          1）热门标签统计当前表标签使用次数正确
          2）跳转到数据地图二级页面，并携带标签名自动搜索
      - action: 进入表详情页，点击「导出」按钮
        expected: 导出当前表的详细信息csv文件成功，内容正确
      - action: 点击「订阅」按钮，选择「钉钉」，输入「webhook URL」
        expected: 订阅表成功，「订阅的数据」页面新增表T_A的记录
      - action: |-
          1）进入「订阅的数据」页面
          2）点击「T_A」的表名
          3）勾选「T_A」，点击“取消订阅”
        expected: |-
          1）进入页面成功，展示表「T_A」
          2）跳转到表数据地图详情页面
          3）取消订阅成功
      - action: 进入「元模型管理」页面
        expected: 进入成功,展示所有类型数据源卡片
      - action: 搜索${datasource_type}类型数据源
        expected: 搜索成功，仅展示当前搜索类型数据源卡片
      - action: 点击「编辑元模型」
        expected: 进入「元模型管理」二级页面
      - action: 查看「技术属性」
        expected: 当前数据源类型内置「技术属性」初始化正确
      - action: 进入「通用业务属性」
        expected: 当前数据源类型内置「技术属性」初始化正确
      - action: |-
          点击「新增业务属性」，配置如下
          「属性名」输入「name」
          「属性中午名」输入「属性名」
          「属性类型」选择「文本框」
          「是否必填」选择「非必填」
          点击「确定」按钮
        expected: 新增业务属性成功
      - action: 进入当前类型数据源下的资产表中，查看业务属性模块
        expected: 展示新增的业务属性
      - action: 删除当前新增的业务属性，进入当前类型数据源下的资产表中，查看业务属性模块
        expected: 不展示新增的业务属性
      - action: 进入「个性业务属性」
        expected: 默认展示为空
      - action: |-
          新增「个性业务属性」，配置如下
          「子模型」输入「test」
          「描述」输入「desc」
          点击「新增」按钮
        expected: 新增个性业务属性成功
      - action: |-
          点击「添加应用库」，配置如下
          「数据源」选择「${DS_A}」
          「数据库」选择「${DB_A}」
          点击「确定」按钮
        expected: 提交成功，已应用库数量+1
      - action: 进入当前类型数据源下的资产表中，查看个性业务属性模块
        expected: 展示新增的个性业务属性
      - action: 删除当前新增的个性业务属性，进入当前类型数据源下的资产表中，查看个性业务属性模块
        expected: 不展示新增的个性业务属性
      - action: 进入「元数据管理」页面
        expected: 进入成功，展示所有已同步进资产的数据源信息
      - action: 选择${DS_A}，编辑生命周期，设置为1
        expected: 生命周期更新为1天，1天后当前数据源下的表均被删除
      - action: |-
          1）点击${DS_A}名称，进入数据源详情下，点击「导出元数据」
          2）导出方式excel/sql/html，数据库选择「DB_A」
          3）点击确定
        expected: 元数据信息导出成功，内容格式正确
      - action: 点击${DS_A}名称，进入数据源详情下，点击「导入元数据」
        expected: 导入元数据信息成功
      - action: 点击${DB_A}名称，进入数据表列表下
        expected: 进入表列表
      - action: 选择${T_A}点击表后「编辑」按钮
        expected: 跳转「表元数据」页面
      - action: |-
          编辑表${T_A}
          「负责人」为「admin@dtstack.com」
          「表中文名」为「测试中文名」
        expected: 编辑成功
      - action: 进入数据地图查看${T_A}详情
        expected: 「负责人」「表中文名」均展示正确
      - action: 元数据同步重新同步表${T_A},再次查看表「负责人」「表中文名」
        expected: 已维护的表属性不覆盖
      - action: 进入「元数据质量」-「完整度分析」页面
        expected: 质量统计数据展示正确
      - action: 进入「元数据质量」-「血缘分析」页面
        expected: 如有数据，则展示该数据源下「数据库」「数据源类型」「数据源」「表数量」「表数量无血缘」「操作」
      - action: 点击「查看」按钮
        expected: 进入当前数据库下的数据表列表中
      - action: 点击「移除监控」按钮
        expected: 页面不再展示相关数据
      - action: 进入「元数据质量」-「血缘分析」页面
        expected: 如没有数据，展示「暂无数据」
    precondition: |-
      1. 已存在${datasource_type}类型数据源DS_A，且包含${database}数据库DB_A,${table}数据表T_A
      2. 表T_A	DDL、DML如下
      create table if not exits T_A(
          id          BIGINT       COMMENT "用户ID",
          name        VARCHAR(64)  COMMENT "姓名",
          age         TINYINT      COMMENT "年龄",
          salary      DECIMAL(12, 2) COMMENT "月薪",
          is_active   BOOLEAN      COMMENT "是否活跃",
          register_dt DATE         COMMENT "注册日期",
          last_login  DATETIME     COMMENT "最后登录时间",
          ip_address  CHAR(15)     COMMENT "IP地址",
          description STRING       COMMENT "描述信息",
          score       DOUBLE       COMMENT "评分");

      insert into T_A values
      (1001, 'Alice', 28, 15000.50, true, '2023-05-10', '2025-11-05T10:30:45', '192.168.1.101', 'Senior Engineer', 9.75),
      (1002, 'Bob',   35, 22000.00, false, '2022-11-20', '2025-10-01T08:15:30', '10.0.0.50',    'Manager',        8.90),
      (1003, 'Cindy', 22, 8500.75,  true, '2024-03-15', '2025-11-04T19:45:12', '172.16.254.3', 'Intern',         7.60);

      create table T_B  as select * from T_A;

      2. 数据源A已经引入到资产平台



      血缘sql：
      CREATE TABLE  TA_A (
          id INT COMMENT "用户ID",
          name VARCHAR(50) COMMENT "用户姓名"
      )
      DISTRIBUTED BY HASH(id) BUCKETS 10
      PROPERTIES (
          "replication_num" = "1"
      );

      CREATE TABLE  TA_B (
          id INT COMMENT "用户ID",
          name VARCHAR(50) COMMENT "用户姓名"
      )
      DISTRIBUTED BY HASH(id) BUCKETS 10
      PROPERTIES (
          "replication_num" = "1"
      );

      CREATE TABLE  TA_C (
          id INT COMMENT "用户ID",
          name VARCHAR(50) COMMENT "用户姓名"
      )
      DISTRIBUTED BY HASH(id) BUCKETS 10
      PROPERTIES (
          "replication_num" = "1"
      );

      --样例一 需先执行TA_A、TA_B建表
      -- insert into ... select
      insert into TA_A select id,name from TA_B;

      --样例二 需先执行TA_B建表
      -- create as ... select
      create table TA_A DISTRIBUTED BY HASH(id) BUCKETS 10
      PROPERTIES (
          "replication_num" = "1"
      ) as select * from TA_B;

      --样例三  需先执行TA_A、TA_B、TA_C建表
      -- insert into ... select union all
      insert into TA_A select * from TA_B union all  select * from TA_C;

      --样例四  需先执行TA_A、TA_B、TA_C建表
      -- insert overwrite ... select ... union all
      insert OVERWRITE table TA_A select * from TA_B union all  select * from TA_C;

      --样例五  需先执行TA_A、TA_B、TA_C建表
      -- insert into ... select + 子查询
      insert into TA_A select id,name from TA_B where id in (select id from TA_C where id>1);

      --样例六  需先执行TA_A、TA_B建表
      -- insert into ... with as ...
      INSERT INTO TA_A (id, name) WITH TA_C AS (SELECT id, name FROM TA_B) SELECT id, name FROM TA_C;
      INSERT INTO TA_A (id, name) WITH TA_C AS (SELECT * FROM TA_B) SELECT * FROM TA_C;

      drop table TA_A;
      drop table TA_B;
      drop table TA_C;
    tags:
      - 元数据
  - case_id: C0002

    title: 验证「数据标准」标准统计各维度结果展示
    priority: P1
    steps:
      - action: 进入「数据资产」-「数据标准」-「标准统计」页面
        expected: 进入页面成功
      - action: 查看「数据标准」统计结果
        expected: 统计结果记录正确
      - action: 查看「代码表」「词根管理」统计结果
        expected: 统计结果正确
      - action: 查看「标准热度」统计
        expected: 统计结果正确
      - action: 查看「标准目录分布」统计
        expected: 统计结果正确
      - action: 查看「标准趋势」图表
        expected: 图表结果展示正确
      - action: 查看「标准来源分布」图表
        expected: 结果展示正确
      - action: 进入「数据资产」-「数据标准」-「标准基础」-「词根管理」页面
        expected: 进入页面成功，默认展示所有词根
      - action: |-
          点击新建词根
          词根简称：email
          词根全称：email
          词根中文名：邮箱
        expected: 新建成功
      - action: 编辑已存在的词根test，修改所有可以修改的内容，点击保存
        expected: 保存成功，内容成功修改
      - action: 根据词根简称/全称/中文名或更新用户进行搜索
        expected: 存在即正确返回，不存在则返回「暂无数据」
      - action: |-
          1）点击导入词根
          2）下载模板，填写正确内容：
          词根简称：aban；词根全称：abandon，abandoned；词根中文名：废弃，抛弃，遗弃，被抛弃的
          3）点击上传
        expected: |-
          1）弹出导入词根弹窗
          2）提示“文件上传成功”，列表新增“aban”词根，内容正确
      - action: |-
          1）导入重复词根
          2）导入词根未填写“词根简称”
        expected: |-
          1）提示文件上传失败
          2）提示文件上传失败
      - action: 选择词根test，点击删除
        expected: 删除成功，列表不存在该条记录
      - action: 进入「数据资产」-「数据标准」-「标准基础」-「码表管理」页面
        expected: 进入页面成功，默认展示所有码表
      - action: |-
          1）点击目录区域右上角的“+”号；
          2）在下方显示的输入框中输入目录名称test，回车
        expected: 目录创建成功，下方目录结构中展示该一级目录test
      - action: |-
          点击新建代码：
          代码名称：code
          代码编号：001
          代码目录：test
          代码说明：代码
          代码来源：CD-001
          码表内容：1-test1-test1、2-test2-test2、3-test3-test3
          点击确定
        expected: 新建成功，内容正确
      - action: 编辑已存在的代码“测试”，修改所有可以修改的内容，点击保存
        expected: 保存成功，内容正确修改
      - action: |-
          1）点击导入代码
          2）下载模板，填写正确内容后，点击上传
        expected: |-
          1）弹出导入代码弹窗
          2）上传成功，列表新增该代码
      - action: |-
          1）导入重复代码
          2）导入代码未填写“代码名称”
        expected: |-
          1）提示文件上传失败
          2）提示文件上传失败
      - action: 根据代码名称/代码编号或更新用户进行搜索
        expected: 存在即正确返回，不存在则返回「暂无数据」
      - action: 点击【导出代码】，二次确认
        expected: 成功导出，文件内容正确
      - action: 选中代码“测试”，点击删除
        expected: 删除成功，列表不存在该条记录
      - action: 进入「数据资产」-「数据标准」-「标准管理」-「标准定义」页面
        expected: 进入页面成功，默认展示所有数据标准
      - action: |-
          1）点击目录区域右上角的“+”号；
          2）在下方显示的输入框中输入目录名称test，回车
        expected: 目录创建成功，下方目录结构中展示该一级目录test
      - action: 点击新建标准
        expected: 页面跳转至新建标准页
      - action: 中文名称输入框填写词根管理中不存在的词根中文名
        expected: 英文名称和英文缩写为空
      - action: |-
          填写业务属性：
          「中文名称」：「金额」
          「英文名称」：「money」
          「英文缩写」：「my」
          「标准编号」：「bz001」
          「标准目录」：「test」
          「业务定义」：「无车型的金额标准」
          「标准来源」：「1」
          不新增车系车型
        expected: 填写成功
      - action: |-
          「自定义属性」：
          1）点击“添加属性”
          2）点击“删除”icon
          3）重新添加属性，输入属性项和属性值，点击✅icon
        expected: |-
          1）自定义属性下出现一行为空的属性项和属性值
          2）弹出二次确认弹窗，确定后自定义属性被删除
          3）该自定义属性被保存，属性项置灰不可更改，属性值可更改
      - action: |-
          填写技术属性：
          「数据类型」：「字符型」
          「数据长度」：「<=4」
          「数据精度」：「2/1」
          「是否允许为空」：「不可空」
          「是否允许重复」：「不可重复」
          「默认值」：「1」
          「取值范围」：「>1且<=50」
          「初始值」：「2」
          「无效值」：「0.1」
          「精度倍数」：「2」
          「偏移量」：「0.02」
