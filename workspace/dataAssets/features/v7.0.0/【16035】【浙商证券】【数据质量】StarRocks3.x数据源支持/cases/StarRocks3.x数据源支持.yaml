         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16035_c0010_comparison_01 (
           order_id BIGINT
         );
         INSERT INTO ${SchemaA}.test_table_16035_c0010_comparison_01 VALUES (1), (2);
