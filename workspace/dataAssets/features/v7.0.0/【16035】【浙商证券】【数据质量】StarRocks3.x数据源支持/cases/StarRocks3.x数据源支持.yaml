  - case_id: C0015
    title: 验证【规则库配置】-【JSON导入】导入规则JSON文件，列表新增规则且表达式为amount BETWEEN 0 AND 100000
    priority: P1
    precondition: |-
      1) 规则库页面不存在名称为「RuleA」的规则
