      2) 数据源类型：StarRocks3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16035_c0005;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16035_c0005 (
           order_id BIGINT,
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_16035_c0005 VALUES
           (1, CAST(100.00 AS DECIMAL(10,2))),
           (2, CAST(200.00 AS DECIMAL(10,2))),
           (3, CAST(300.00 AS DECIMAL(10,2)));
      5) 规则集「RuleSetA」已启用，关联上述数据表，包含金额非空和订单号唯一规则
