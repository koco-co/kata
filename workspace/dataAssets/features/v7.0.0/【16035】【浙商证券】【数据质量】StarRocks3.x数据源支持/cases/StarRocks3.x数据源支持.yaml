  - case_id: C0011
    title: 验证【规则库配置】-【动态分区】执行动态分区规则，执行日志显示读取前一日与当日共4行记录
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：StarRocks3.x
      3) 存在数据库：${SchemaA}
      4) 创建分区表并写入前一日和当日两个分区：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16035_c0011;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16035_c0011 (
           id BIGINT,
           name STRING,
           dt DATE
         ) PARTITION BY RANGE (dt) (
           PARTITION p_prev VALUES LESS THAN (DATE_SUB(current_date(), INTERVAL 1 DAY)),
           PARTITION p_curr VALUES LESS THAN (DATE_ADD(current_date(), INTERVAL 1 DAY))
         );
         INSERT INTO ${SchemaA}.test_table_16035_c0011 VALUES
           (1, 'alpha', DATE_SUB(current_date(), 1)),
           (2, 'beta', DATE_SUB(current_date(), 1)),
           (3, 'gamma', current_date()),
           (4, 'delta', current_date());
      5) 规则任务「TaskA」已配置动态分区
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 打开「TaskA」编辑页并选择「动态分区」
        expected: 分区配置显示 dt 的动态日期表达式
      - action: 点击【立即执行】并查看执行日志
        expected: 日志显示读取前一日和当日共 4 行记录，未读取其他分区
    tags:
      - 数据质量
      - 规则库配置
      - 分区
      - 动态分区

  - case_id: C0012
    title: 验证【规则库配置】-【抽样】执行开启抽样的规则任务，执行日志显示本次读取10行
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：StarRocks3.x
      3) 存在数据库：${SchemaA}
      4) 使用以下 Shell 脚本生成 test_table_16035_c0012.sql：
         #!/usr/bin/env bash
         set -euo pipefail
         output_file="test_table_16035_c0012.sql"
         schema='${SchemaA}'
         table="${schema}.test_table_16035_c0012"
         {
           printf 'DROP TABLE IF EXISTS %s;\n' "${table}"
           printf 'CREATE TABLE IF NOT EXISTS %s (order_id BIGINT, amount DECIMAL(10,2));\n' "${table}"
           printf 'INSERT INTO %s VALUES\n' "${table}"
           for ((id=1; id<=100; id++)); do
             separator=','
             if (( id == 100 )); then separator=';'; fi
             printf "(%d, CAST(%d AS DECIMAL(10,2)))%s\n" "${id}" "${id}" "${separator}"
           done
         } > "${output_file}"
      5) 复制 test_table_16035_c0012.sql 的内容，在 ${DataSourceA} 对应平台或底层执行
      6) 规则任务「TaskA」开启抽样，抽样数量为 10
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 打开「TaskA」详情并查看抽样配置
        expected: 抽样开关为「开启」，抽样数量为 10
      - action: 点击【立即执行】并查看执行日志
        expected: 日志显示本次读取 10 行，任务状态为「运行成功」
    tags:
      - 数据质量
      - 规则库配置
      - 抽样

