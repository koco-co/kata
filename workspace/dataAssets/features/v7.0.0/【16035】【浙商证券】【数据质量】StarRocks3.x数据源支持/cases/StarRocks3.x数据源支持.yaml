meta:
  title: StarRocks3.x数据源支持
  requirement_id: "16035"
  case_module_id: ""
  exports:
    - StarRocks3.x数据源支持.xmind
cases:
  - case_id: C0001
    title: 验证【数据源管理】引入并授权StarRocks3.x数据源，列表新增数据源且授权项目列显示质量项目
    priority: P0
    precondition: |-
      1) 公共管理数据源中心存在数据源「${DataSourceA}」，数据源类型为 StarRocks3.x
      2) 数据资产平台存在质量项目「${ProjectA}」
    steps:
      - action: 进入【平台管理 → 数据源管理】页面
        expected: 进入成功
      - action: 点击【引入数据源】，选择「${DataSourceA}」并确认
        expected: Toast提示:「引入成功」，列表新增「${DataSourceA}」，类型为 StarRocks3.x
      - action: 在「${DataSourceA}」操作列点击【质量项目授权】，选择「${ProjectA}」并确认
        expected: Toast提示:「授权成功」，授权项目列显示「${ProjectA}」
    tags:
      - 平台管理
      - 数据源管理
      - StarRocks3.x

  - case_id: C0002
    title: 验证【规则库配置】-【新建监控规则】选择StarRocks3.x数据源并配置监控对象，数据库与数据表下拉框加载对应数据
    priority: P1
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：StarRocks3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16035_c0002;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16035_c0002 (
           order_id BIGINT,
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_16035_c0002 VALUES
           (1, CAST(100.00 AS DECIMAL(10,2))),
           (2, CAST(200.00 AS DECIMAL(10,2))),
           (3, CAST(300.00 AS DECIMAL(10,2)));
    steps:
      - action: 进入【数据质量 → 规则库配置】页面
        expected: 进入成功
      - action: 点击【新建监控规则】，选择「单表校验规则」并选择数据源「${DataSourceA}」
        expected: 数据库下拉框加载「${SchemaA}」，数据表下拉框加载 test_table_16035_c0002
      - action: 选择「${SchemaA}」、test_table_16035_c0002 和字段 amount
        expected: 字段列表展示 order_id、amount 及对应类型
    tags:
      - 数据质量
      - 规则库配置
      - StarRocks3.x

  - case_id: C0003
    title: 验证【概览】查看规则统计与运维指标卡片，单表规则3个、多表规则1个且达标与不达标任务各2个
    priority: P1
    precondition: |-
      1) 数据源「${DataSourceA}」下存在 3 个单表规则任务和 1 个多表规则任务
      2) 4 个任务最近一次执行结果为 2 个「达标」和 2 个「不达标」
    steps:
      - action: 进入【数据质量 → 概览】页面
        expected: 进入成功
      - action: 查看规则统计卡片
        expected: 单表规则总数为 3，多表规则总数为 1
      - action: 查看运维指标和告警汇总
        expected: 任务总数为 4，达标任务数为 2，不达标任务数为 2
    tags:
      - 数据质量
      - 概览
      - 统计

  - case_id: C0004
    title: 验证【规则配置】-【新建规则集】创建StarRocks3.x规则集并添加规则，列表新增规则集且规则数为2
    priority: P0
    precondition: |-
      1) 授权数据源：${DataSourceA}
      2) 数据源类型：StarRocks3.x
      3) 存在数据库：${SchemaA}
      4) 创建数据表并插入数据：
         DROP TABLE IF EXISTS ${SchemaA}.test_table_16035_c0004;
         CREATE TABLE IF NOT EXISTS ${SchemaA}.test_table_16035_c0004 (
           order_id BIGINT,
           amount DECIMAL(10,2)
         );
         INSERT INTO ${SchemaA}.test_table_16035_c0004 VALUES
           (1, CAST(100.00 AS DECIMAL(10,2))),
           (2, CAST(200.00 AS DECIMAL(10,2))),
           (3, CAST(300.00 AS DECIMAL(10,2)));
    steps:
      - action: 进入【数据质量 → 规则配置】页面
        expected: 进入成功
      - action: |-
          点击【新建规则集】，配置基础信息：
          * 规则集名称：RuleSetA
          * 校验数据源：${DataSourceA}
          规则集描述：空
          点击「下一步」
        expected: 进入「规则内容」步骤
      - action: |-
          在「规则内容」步骤点击「导入规则」，导入含金额非空与订单号唯一两条规则的规则文件并点击「保存」
        expected: Toast提示:「添加成功！」,列表新增「RuleSetA」，规则数为 2
      - action: 打开「RuleSetA」详情
        expected: 数据源类型显示 StarRocks3.x，规则内容包含金额非空和订单号唯一
    tags:
      - 数据质量
      - 规则配置
      - 规则集
      - StarRocks3.x

