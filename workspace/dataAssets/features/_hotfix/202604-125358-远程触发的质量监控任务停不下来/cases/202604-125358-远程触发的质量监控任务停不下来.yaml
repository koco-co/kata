meta:
  title: 202604-125358-远程触发的质量监控任务停不下来
  version: unknown
  source: http://zenpms.dtstack.cn/zentao/bug-view-125358.html
  feature_id: _hotfix/202604-125358-远程触发的质量监控任务停不下来
cases:
  - id: C001
    title: 【125358】验证远程触发的质量监控任务能够正常停止
    priority: P1
    steps:
      - action: 通过远程触发接口（POST `/remote/dq/service/monitor/remoteTrigger/{code}`）触发对应质量监控规则执行
        expected: 接口返回成功，质量监控任务开始运行
      - action: 导航至「数据资产」-「数据质量」-「任务查询」页面
        expected: 页面正常加载，显示任务列表
      - action: 在任务列表中找到刚刚由远程触发产生的运行记录，确认其状态显示为「运行中」
        expected: 该任务记录存在，状态列显示「运行中」，操作列出现「停止」按钮
      - action: 点击该任务记录操作列中的「停止」按钮
        expected: 弹出确认对话框，提示文字为：「请确认是否停止该质量任务？停止后将不会保留本次运行结果。」
      - action: 在确认对话框中点击「确定」按钮
        expected: 对话框关闭，停止请求正常发送（POST `/dassets/v1/valid/monitor/stopJob`），页面无报错提示
      - action: 在任务列表页点击「刷新数据」按钮或等待页面自动刷新，观察该任务记录的状态变化
        expected: 该任务状态由「运行中」变更为「停止中」，最终变更为「中途停止」，不再持续停留在「运行中」状态
    tags:
      - 数据资产
      - 数据质量 - 任务查询
      - 远程触发任务停止功能
