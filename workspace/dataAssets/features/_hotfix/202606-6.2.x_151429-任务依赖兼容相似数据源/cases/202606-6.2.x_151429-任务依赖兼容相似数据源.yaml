meta:
  title: 202606-6.2.x_151429-任务依赖兼容相似数据源
  version: 6.2.x
  source: http://zenpms.dtstack.cn/zentao/bug-view-151429.html
  feature_id: _hotfix/202606-6.2.x_151429-任务依赖兼容相似数据源
cases:
  - id: C001
    title: 【151429】验证【任务依赖】基础展示并记录相似数据源缺失复现条件
    priority: P1
    steps:
      - action: |-
          进入数据资产【元数据】-【数据地图】搜索表 test_info_1，打开表详情并核对右侧技术属性：
          - 表名：test_info_1
          - 数据库：pw_test
          - 数据源：pw_test_HADOOP
          - 表来源：SparkThrift2.x
        expected: |-
          1)进入「表详情」页
          2)页面展示「表结构」「数据预览」「血缘关系」「任务依赖」页签
          3)当前表的表名、数据库、数据源与前置条件记录一致
      - action: |-
          点击「任务依赖」页签，查看「离线任务」区域，核对基础依赖记录：
          - 任务名称：mysql2spark
          - 任务类型：数据同步
          - 和该表的关系：产出该表
          - 负责人：admin@dtstack.com
        expected: |-
          1)任务依赖列表展示「任务名称」「任务类型」「和该表的关系」「负责人」
          2)离线任务列表存在 mysql2spark 记录
          3)mysql2spark 的任务类型、和该表的关系、负责人分别为「数据同步」「产出该表」「admin@dtstack.com」
      - action: |-
          点击「血缘关系」页签，切换或保持「表级血缘」，记录除 mysql2spark 外是否存在实际依赖离线任务：
          - 任务清单：{{lineage_offline_task_names}}
          - 任务数量：{{lineage_offline_task_count}}
        expected: |-
          1)表级血缘区域加载完成
          2)若仅能看到 mysql2spark 或无法看到额外离线任务，记录「当前环境未复现缺失依赖」，本轮不继续断言修复效果
          3)若存在额外离线任务，继续执行第 4 步
      - action: |-
          在存在额外血缘离线任务时，回到「任务依赖」页签并对比「离线任务」列表：
          - 血缘任务清单：{{lineage_offline_task_names}}
          - 任务依赖清单：{{table_rely_offline_task_names}}
          - 缺失任务清单：{{missing_task_names}}
        expected: |-
          1)未部署修复分支时，若 {{missing_task_names}} 非空，记录为 #151429 可复现证据，不判定修复通过
          2)已部署 hotfix_6.2.x_151429 修复分支时，{{missing_task_names}} 必须为空，任务依赖清单应覆盖血缘中的实际依赖离线任务
      - action: |-
          打开浏览器 Network，查看本次「任务依赖」页签触发的 `/dataMap/tableRely/page` 请求，保存请求与响应证据：
          - tableId：{{table_id}}
          - metaType：离线任务对应值，以页面实际请求为准
          - 响应任务清单：{{table_rely_offline_task_names}}
        expected: |-
          1)请求返回成功
          2)响应结果与页面「离线任务」列表一致
          3)若第 4 步存在缺失任务，响应证据中同步记录缺失清单，用于修复分支部署后再次回归
    precondition: |-
      1. 当前验证环境不要求部署 hotfix_6.2.x_151429 修复包；未部署修复分支时，本用例只验证可复现前置和现场证据采集，不得断言修复效果通过。
      2. 已在数据资产【元数据】-【数据地图】中定位表详情：
         - 表名：test_info_1
         - 数据库：pw_test
         - 数据源：pw_test_HADOOP
         - 表来源：SparkThrift2.x
      3. 该表【任务依赖】-【离线任务】当前已存在基础依赖记录：
         - 任务名称：mysql2spark
         - 任务类型：数据同步
         - 和该表的关系：产出该表
         - 负责人：admin@dtstack.com
      4. 修复回归场景需要额外准备或定位一张满足 #151429 缺陷条件的表：
         - 【血缘关系】表级血缘中存在除产出表同步任务外的实际依赖离线任务，任务清单记录为 {{lineage_offline_task_names}}。
         - 【任务依赖】-【离线任务】展示数量少于表级血缘中的实际依赖任务数，缺失任务记录为 {{missing_task_names}}。
         - 缺失任务来自相似数据源组内不同 dtCenterSourceId，或由跨相似数据源的表血缘生成。
      5. 如当前环境无法定位第 4 条数据，不判定修复通过或失败；仅完成 test_info_1 基础展示核验，并将“无法复现缺失任务”记录为阻塞。
    tags:
      - 数据资产
      - 元数据
      - 表详情
