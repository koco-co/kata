meta:
  title: 202604-129212-数据模型建表新增字段失败没有回滚
  version: unknown
  source: http://zenpms.dtstack.cn/zentao/bug-view-129212.html
  feature_id: _hotfix/202604-129212-数据模型建表新增字段失败没有回滚
cases:
  - id: C001
    title: 【129212】验证规范建表新增字段失败后数据库记录完整回滚
    priority: P1
    steps:
      - action: 登录数据资产平台，点击左侧导航「数据模型」，进入「规范建表」（标准化建表）页面
        expected: 页面正常展示规范建表列表，顶部显示「新建表」按钮
      - action: 点击「新建表」按钮，填写步骤一（基本信息）：输入合法的表名（英文）、表中文名，选择目标数仓层级、数据源、数据库，设置生命周期，点击「下一步」
        expected: 跳转至步骤二（表结构配置）页面
      - action: 在步骤二中，点击「新增字段」按钮，依次添加多个字段（至少 3 个），填写每个字段的字段名（英文）、字段中文名、字段类型；其中故意将某个字段名设置为当前数据源中已存在字段的保留关键字或超长字符串，使后续建表执行时能触发失败
        expected: 字段行被添加到字段列表中，表单可正常填写
      - action: 完成字段填写后，点击「提交建表」（或步骤三确认页的「建表」按钮），触发 POST /dataWarehouseTable/createOrUpdateTable 接口调用
        expected: 接口请求发出，页面显示加载中状态
      - action: 等待接口返回失败响应（因字段非法导致建表执行失败），观察页面提示信息
        expected: 页面弹出明确的错误提示，说明建表失败原因；不显示「建表成功」或跳转至成功状态
      - action: 回到「规范建表」列表页，搜索步骤二中填写的表名
        expected: 列表中不存在该表记录，即建表失败后表记录已被完整回滚，未产生半成品记录
      - action: 直接查询后端数据库（或通过运维接口），确认 data_table 及对应 data_table_column（分表）中均无该表及其字段的残留记录
        expected: data_table 表和 data_table_column 分表中均无该次操作产生的数据行，事务回滚彻底
    tags:
      - 数据资产
      - 数据模型 - 规范建表
      - 建表事务回滚
