meta:
  title: 202604-6.3.x_148219-标准建表优化词根和标准的翻译
  version: 6.3.x
  feature_id: _hotfix/202604-6.3.x_148219-标准建表优化词根和标准的翻译
cases:
  - id: C001
    title: 【148219】验证字段中文名解析仅触发整词精确匹配词根，不再进行分词拼接匹配
    priority: P1
    steps:
      - action: 进入【数据标准 > 标准基础 > 词根管理】
        expected: 词根管理页面正常加载
      - action: |-
          新建词根:
          - *词根简称: Sales_dept
          - 词根全称: Sales_dept
          - 词根中文名: 采销部
        expected: 新建成功，列表中可查到该词根
      - action: 进入【数据模型 > 规范建表 > 建表】
        expected: 建表列表页正常加载
      - action: |-
          点击新建表，填写基础信息:
          - *写入数据源: SparkThrift2.x
          - *写入数据库: test_db
          - 数仓层级: ODS
          - *表名: test_root_148219
          - *表中文名: 词根验证表
          - *存储格式: orc
          - *生命周期: 永久
          - *表类型: 内部表
          - hdfs存储路径:

          点击下一步
        expected: 进入表结构编辑页面
      - action: |-
          选择批量解析模式，输入:

          采销部

          采销部部长

          点击解析
        expected: |-
          解析成功，生成两条字段记录:
          - "采销部"精确匹配词根，字段英文名填充为 Sales_dept
          - "采销部部长"无整词匹配，字段英文名为空（不出现 Sales_dept 等分词拼接结果），系统不报错
    precondition: 无
    tags:
      - 数据模型
      - 规范建表 > 建表
      - 字段中文名解析时的词根翻译逻辑
