meta:
  title: 202604-6.0.x_148618-数据资产表生命周期未显示
  version: 6.0.x
  feature_id: _hotfix/202604-6.0.x_148618-数据资产表生命周期未显示
cases:
  - id: C001
    title: 【148618】验证数据资产表列表中正确显示表的生命周期天数
    priority: P1
    steps:
      - action: 进入【数据资产 > 数据地图】
        expected: 页面正常加载，展示表列表
      - action: 在搜索框输入前置条件中已配置生命周期的表名，点击搜索
        expected: 搜索结果中显示目标表
      - action: 查看目标表所在行的「生命周期」列
        expected: 显示与离线数据地图侧一致的生命周期天数（如 30 天），不为空
      - action: 切换分页或更换其他已配置生命周期的表重复步骤 2-3
        expected: 每页加载后生命周期列均正确显示对应天数
      - action: 查看未配置生命周期的表对应行的「生命周期」列
        expected: 该列显示为空或「--」，不报错
    precondition: |-
      1. 在离线数据地图（数据开发侧）为目标表配置生命周期，记录表名和生命周期天数（如 30 天）
      2. 确认目标表已被数据资产元数据同步采集到
    tags:
      - 数据资产
      - 数据地图
      - 表列表 - 生命周期显示
