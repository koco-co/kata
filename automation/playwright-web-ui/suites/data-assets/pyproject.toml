[project]
name = "data-assets-playwright-web-ui"
version = "0.1.0"
description = "Data Assets Playwright Web UI suite package."
requires-python = ">=3.14,<3.15"
dependencies = ["playwright-web-ui"]

[project.entry-points."playwright_web_ui.suites"]
data-assets = "data_assets_playwright_web_ui:SUITE"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
