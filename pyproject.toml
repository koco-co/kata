[project]
name = "automation-workspace"
version = "0.1.0"
description = "Local workspace for Python automation packages."
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pre-commit>=4.3.0",
  "ruff>=0.12.0",
  "types-openpyxl>=3.1.5.20260807",
]

[tool.uv]
package = false
required-version = ">=0.11.28,<0.12.0"

[tool.uv.sources]
automation-contracts = { workspace = true }
data-assets-playwright-web-ui = { workspace = true }
playwright-web-ui = { workspace = true }

[tool.uv.workspace]
members = [
  "automation/contracts",
  "automation/playwright-web-ui",
  "automation/playwright-web-ui/suites/data-assets",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
]
testpaths = [
  "automation/playwright-web-ui/tests",
  "automation/playwright-web-ui/suites/data-assets/tests",
]
markers = [
  "automation_case(project_id, feature_id, case_id): bind one collected item to a canonical automation case",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = [
  "automation/contracts/src",
  "automation/playwright-web-ui/src",
  "automation/playwright-web-ui/suites/data-assets/src",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "D",
  "S101",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = [
  "automation/contracts/src",
  "automation/playwright-web-ui/src",
  "automation/playwright-web-ui/tests",
  "automation/playwright-web-ui/suites/data-assets/src",
  "automation/playwright-web-ui/suites/data-assets/tests",
]
exclude = ["**/__pycache__", "**/node_modules", "**/.*", ".venv"]
